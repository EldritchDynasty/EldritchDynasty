name: auto merge queue

# TWO LANDINGS, CHOSEN BY THE REPOSITORY'S VISIBILITY, IN ONE PLACE (#1947).
#
# GitHub's native merge queue exists only in public organisation repositories
# (or private ones on Enterprise Cloud), and a private repository on the Free
# plan gets no rulesets, branch protection or auto-merge either. The
# repository went private on 2026-10-26 and every admission after that failed.
#
#   public   native: enqueue the exact green head; merge_group CI is the
#            integration check and GitHub moves `main`. Unchanged.
#   private  fast-forward: tools/fast-forward-landing.mjs moves `main` to the
#            exact green head once that head contains `main`, and asks GitHub
#            to rebase a green head that is behind. The commit that lands is
#            the commit CI tested.
#
# Making the repository public again switches back with no edit here.
env:
  LANDING_MODE: ${{ github.event.repository.private && 'fast-forward' || 'native' }}

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: auto-merge-queue-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  enqueue:
    name: enqueue ready PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve eligible pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              pr_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              expected_head="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              ;;
            workflow_run)
              run_event="$(jq -r '.workflow_run.event' "$GITHUB_EVENT_PATH")"
              run_conclusion="$(jq -r '.workflow_run.conclusion' "$GITHUB_EVENT_PATH")"
              if [[ "$run_event" != "pull_request" || "$run_conclusion" != "success" ]]; then
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
              expected_head="$(jq -r '.workflow_run.pull_requests[0].head.sha // empty' "$GITHUB_EVENT_PATH")"

              # GitHub can emit workflow_run with an empty pull_requests array
              # even though the triggering pull_request check run itself had
              # the association (#560). Recover only from same-repo open PRs
              # whose branch and exact current head match the successful run.
              if [[ -z "$pr_number" || -z "$expected_head" ]]; then
                run_branch="$(jq -r '.workflow_run.head_branch // empty' "$GITHUB_EVENT_PATH")"
                run_head="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
                repo_owner="${GITHUB_REPOSITORY%%/*}"
                if [[ -z "$run_branch" || -z "$run_head" ]]; then
                  echo "eligible=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi

                candidates="$(
                  gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" \
                    -f state=open \
                    -f base=main \
                    -f head="$repo_owner:$run_branch"
                )"
                pr_number="$(
                  jq -r --arg repo "$GITHUB_REPOSITORY" --arg branch "$run_branch" --arg head "$run_head" \
                    '[.[] | select(
                      .base.ref == "main"
                      and .head.repo.full_name == $repo
                      and .head.ref == $branch
                      and .head.sha == $head
                    )] | if length == 1 then .[0].number else empty end' <<<"$candidates"
                )"
                expected_head="$run_head"
              fi

              if [[ -z "$pr_number" || -z "$expected_head" ]]; then
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          pr="$(
            gh api               --header 'Accept: application/vnd.github+json'               --header 'X-GitHub-Api-Version: 2026-03-10'               "/repos/$GITHUB_REPOSITORY/pulls/$pr_number"
          )"

          draft="$(jq -r '.draft' <<<"$pr")"
          state="$(jq -r '.state' <<<"$pr")"
          base="$(jq -r '.base.ref' <<<"$pr")"
          head="$(jq -r '.head.sha' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr")"
          node_id="$(jq -r '.node_id // empty' <<<"$pr")"

          if [[ "$state" != "open" || "$draft" != "false" || "$base" != "main" || "$head_repo" != "$GITHUB_REPOSITORY" || -z "$node_id" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A completed workflow_run may describe an older head if a push landed
          # while CI was finishing. Never let stale green evidence enqueue new code.
          if [[ "$head" != "$expected_head" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            # A successful completed run of the named `check` workflow is the
            # authoritative green signal for this exact head. Re-querying its
            # terminal "CI required" check here races GitHub's check-runs index:
            # the workflow_run event can arrive seconds before that check is
            # visible, causing a permanent missed enqueue because there is no
            # later retry event.
            required="success"
          else
            # The NEWEST "CI required" run decides, and only once it has
            # finished. Sorting by completed_at put a still-running check
            # (completed_at: null) first, so a draft-tier success on the same
            # head outranked the full-tier run that marking the PR ready had
            # just started (#493). A pending required check may also not exist
            # yet; the enqueue step below treats GitHub's "is expected" refusal
            # on this event as not-yet-eligible for that reason.
            required="$(
              gh api               --header 'Accept: application/vnd.github+json'               --header 'X-GitHub-Api-Version: 2026-03-10'               "/repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100"               --jq '[.check_runs[] | select(.name == "CI required")] | sort_by(.id) | last | if . == null then "" elif .status == "completed" then (.conclusion // "") else "pending" end'
            )"
          fi

          if [[ "$required" != "success" ]]; then
            echo "CI required is not green yet for PR #$pr_number; waiting for the check workflow."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "node=$node_id" >> "$GITHUB_OUTPUT"

      # An org-level variable does not reach a private repository on the Free
      # plan, and the token action's own error does not say so. Say it here.
      - name: Require the landing App's client ID
        if: steps.pr.outputs.eligible == 'true'
        shell: bash
        env:
          CLIENT_ID: ${{ vars.MERGE_QUEUE_APP_CLIENT_ID }}
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::MERGE_QUEUE_APP_CLIENT_ID is empty. Organisation variables do not reach a private repository on GitHub Free; add it as a REPOSITORY variable (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Mint merge-queue GitHub App token
        if: steps.pr.outputs.eligible == 'true' && env.LANDING_MODE == 'native'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MERGE_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          # enqueuePullRequest mutates the PR as well as the queue. Narrowing
          # the installation token to merge-queues alone reaches GraphQL but
          # GitHub rejects it as "Resource not accessible by integration".
          # Admission is a merge, so the token needs contents: write too; the
          # ruleset and the queue's merge_group CI still gate what lands.
          permission-merge-queues: write
          permission-pull-requests: write
          permission-contents: write

      - name: Add pull request to native merge queue
        if: steps.pr.outputs.eligible == 'true' && env.LANDING_MODE == 'native'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_NODE_ID: ${{ steps.pr.outputs.node }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail

          # The asynchronous REST merge endpoint documents GitHub App
          # installation tokens as supported, but its background worker can
          # reject a valid App actor with "Enqueuer is not authorized to
          # merge". Use the native GraphQL queue mutation instead.
          response="$(mktemp)"
          enqueue() {
            set +e
            gh api graphql \
              -f query='mutation($pullRequestId:ID!,$expectedHeadOid:GitObjectID!){enqueuePullRequest(input:{pullRequestId:$pullRequestId,expectedHeadOid:$expectedHeadOid}){mergeQueueEntry{id position state}}}' \
              -F pullRequestId="$PR_NODE_ID" \
              -F expectedHeadOid="$HEAD_SHA" >"$response" 2>&1
            status=$?
            set -e
          }
          required_check_pending() {
            grep -q '"UNPROCESSABLE"' "$response" &&
              grep -Eq 'Required status check .*CI required.* is expected' "$response"
          }

          # GitHub refuses admission while the required check has not reported
          # on this exact head (#493). On a pull_request event that is the
          # normal case, not a failure: the full CI run is still going, and its
          # workflow_run handoff admits the PR when it finishes. After that
          # handoff, the same refusal can only be the queue's own index lagging
          # the completed check, so retry briefly with the same expected head
          # and then fail closed.
          enqueue
          if [[ "$status" -ne 0 ]] && required_check_pending; then
            if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
              echo "CI required has not reported on $HEAD_SHA yet; the check workflow's handoff will admit PR #$PR_NUMBER."
              exit 0
            fi
            for delay in 5 10 20; do
              echo "Queue has not seen CI required on $HEAD_SHA yet; retrying in ${delay}s."
              sleep "$delay"
              enqueue
              if [[ "$status" -eq 0 ]] || ! required_check_pending; then
                break
              fi
            done
          fi

          if [[ "$status" -ne 0 ]]; then
            # Multiple eligible workflow events can race. Treat an already
            # queued PR as the same idempotent success as the old REST path.
            if grep -Eqi 'already (in|on) (the )?merge queue|already in the queue' "$response"; then
              echo "PR #$PR_NUMBER is already in the native merge queue."
              exit 0
            fi
            echo "::error::GitHub GraphQL merge-queue request failed for PR #$PR_NUMBER:"
            cat "$response"
            exit 1
          fi

          entry_id="$(jq -r '.data.enqueuePullRequest.mergeQueueEntry.id // empty' "$response")"
          state="$(jq -r '.data.enqueuePullRequest.mergeQueueEntry.state // "queued"' "$response")"
          position="$(jq -r '.data.enqueuePullRequest.mergeQueueEntry.position // "unknown"' "$response")"
          if [[ -z "$entry_id" ]]; then
            echo "::error::GitHub returned no merge-queue entry for PR #$PR_NUMBER:"
            cat "$response"
            exit 1
          fi

          echo "PR #$PR_NUMBER is in the native merge queue (state=$state, position=$position)."

      # ── Private repository: fast-forward landing ─────────────────────────
      #
      # The default checkout is the commit this workflow file came from (the
      # PR merge ref on pull_request, main on workflow_run), so the script and
      # the YAML calling it never come from two different commits.
      - name: Check out the landing script
        if: steps.pr.outputs.eligible == 'true' && env.LANDING_MODE == 'fast-forward'
        uses: actions/checkout@v7
        with:
          sparse-checkout: tools
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.pr.outputs.eligible == 'true' && env.LANDING_MODE == 'fast-forward'
        with:
          node-version-file: .nvmrc

      # An App push that changes .github/workflows needs the Workflows
      # permission. Ask for it; an installation without it refuses the token,
      # and the plain token below lands everything else.
      - name: Mint landing token with Workflows permission
        if: steps.pr.outputs.eligible == 'true' && env.LANDING_MODE == 'fast-forward'
        id: ff-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MERGE_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Mint landing token
        if: steps.pr.outputs.eligible == 'true' && env.LANDING_MODE == 'fast-forward' && steps.ff-token.outcome != 'success'
        id: ff-token-basic
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MERGE_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Fast-forward main to the exact green head
        if: steps.pr.outputs.eligible == 'true' && env.LANDING_MODE == 'fast-forward'
        env:
          READ_TOKEN: ${{ github.token }}
          WRITE_TOKEN: ${{ steps.ff-token.outputs.token || steps.ff-token-basic.outputs.token }}
          CAN_WRITE_WORKFLOWS: ${{ steps.ff-token.outcome == 'success' }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          # Established above for this exact head: the completed check run on
          # workflow_run, the newest finished CI required on pull_request.
          REQUIRED: success
        run: node tools/fast-forward-landing.mjs land

  # The private counterpart of the native recovery below. When main's own CI
  # passes, land what is ready and rebase what is green but behind, oldest PR
  # first. A rebased head reruns CI, and that run's handoff above lands it.
  sweep-after-main:
    name: land or rebase green PRs after main advances
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.repository.private &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the landing App's client ID
        shell: bash
        env:
          CLIENT_ID: ${{ vars.MERGE_QUEUE_APP_CLIENT_ID }}
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::MERGE_QUEUE_APP_CLIENT_ID is empty. Organisation variables do not reach a private repository on GitHub Free; add it as a REPOSITORY variable (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Mint landing token with Workflows permission
        id: ff-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MERGE_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Mint landing token
        if: steps.ff-token.outcome != 'success'
        id: ff-token-basic
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MERGE_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Land or rebase green PRs against the green main
        env:
          READ_TOKEN: ${{ github.token }}
          WRITE_TOKEN: ${{ steps.ff-token.outputs.token || steps.ff-token-basic.outputs.token }}
          CAN_WRITE_WORKFLOWS: ${{ steps.ff-token.outcome == 'success' }}
          EXPECTED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tools/fast-forward-landing.mjs sweep

  # GitHub may dequeue an otherwise green PR when an earlier merge-group
  # advances main. That does not emit any of the PR/head events handled above.
  # Recover once a NEW main push passes its own CI; never on "dequeued" itself,
  # since a genuinely failing merge-group must not be retried in a loop.
  reconcile-after-main:
    name: re-admit ready PRs after main advances
    if: >-
      github.event_name == 'workflow_run' &&
      !github.event.repository.private &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint merge-queue GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MERGE_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-merge-queues: write
          permission-pull-requests: write
          permission-contents: write

      - name: Reconcile eligible PRs against the green main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENQUEUE_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Ignore late workflow_run deliveries for a main head that is no
          # longer current. Its successor will have its own push-CI handoff.
          current_main="$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$current_main" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "main moved from $EXPECTED_MAIN_SHA to $current_main; newer run owns reconciliation."
            exit 0
          fi

          # Only an open, ready, same-repository PR with a CURRENT and green
          # exact-head required check can re-enter. GitHub's merge_group still
          # tests the actual rebased integration; this job cannot merge main.
          numbers="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" --jq '.[].number')"
          failed=0
          while IFS= read -r number; do
            [[ -z "$number" ]] && continue
            pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$number")"
            if ! jq -e --arg repo "$GITHUB_REPOSITORY" '
              .state == "open" and .draft == false
              and .base.ref == "main"
              and .head.repo.full_name == $repo
              and .mergeable == true and .mergeable_state == "clean"
            ' <<<"$pr" >/dev/null; then
              echo "PR #$number is not currently safe to re-admit."
              continue
            fi

            head="$(jq -r '.head.sha' <<<"$pr")"
            node="$(jq -r '.node_id' <<<"$pr")"
            required="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "CI required")] | sort_by(.id) | last | if . == null then "" elif .status == "completed" then (.conclusion // "") else "pending" end')"
            if [[ "$required" != "success" || -z "$node" ]]; then
              echo "PR #$number has no completed green exact-head CI required check."
              continue
            fi

            # The base may advance during a scan; leave retries to the newer
            # successful main run rather than admitting against stale proof.
            if [[ "$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" != "$EXPECTED_MAIN_SHA" ]]; then
              echo "main advanced during reconciliation; stopping."
              break
            fi

            response="$(mktemp)"
            if GH_TOKEN="$ENQUEUE_TOKEN" gh api graphql \
              -f query='mutation($pullRequestId:ID!,$expectedHeadOid:GitObjectID!){enqueuePullRequest(input:{pullRequestId:$pullRequestId,expectedHeadOid:$expectedHeadOid}){mergeQueueEntry{id position state}}}' \
              -F pullRequestId="$node" \
              -F expectedHeadOid="$head" >"$response" 2>&1; then
              # GraphQL can succeed at the transport layer without returning
              # an admission entry. Match the ordinary PR-head admission guard.
              entry_id="$(jq -r '.data.enqueuePullRequest.mergeQueueEntry.id // empty' "$response")"
              if [[ -z "$entry_id" ]]; then
                echo "::error::PR #$number admission returned no queue entry:"
                cat "$response"
                failed=1
              else
                echo "PR #$number admitted to native queue for head $head."
              fi
            elif grep -Eqi 'already (in|on) (the )?merge queue|already in the queue' "$response"; then
              echo "PR #$number is already queued."
            elif grep -Eq 'Required status check .*CI required.* is expected' "$response"; then
              echo "PR #$number: GitHub no longer sees the required head check; leaving unqueued."
            else
              echo "::error::PR #$number queue recovery failed:"
              cat "$response"
              failed=1
            fi
            rm -f "$response"
          done <<< "$numbers"
          exit "$failed"
