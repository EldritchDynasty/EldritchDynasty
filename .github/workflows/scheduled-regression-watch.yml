name: scheduled regression watch

on:
  workflow_run:
    workflows: [nightly regression, weekly statistical]
    types: [completed]

permissions:
  contents: write
  issues: write

jobs:
  report:
    name: surface scheduled regression
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_NAME: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      BAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v4

      - name: record the scheduled verdict
        shell: bash
        env:
          GIT_AUTHOR_NAME: scheduled-verdict
          GIT_AUTHOR_EMAIL: scheduled-verdict@users.noreply.github.com
          GIT_COMMITTER_NAME: scheduled-verdict
          GIT_COMMITTER_EMAIL: scheduled-verdict@users.noreply.github.com
        run: |
          set -euo pipefail

          case "$RUN_NAME" in
            "nightly regression") KEY="nightly" ;;
            "weekly statistical") KEY="weekly" ;;
            *) echo "Unrecognised scheduled workflow: $RUN_NAME"; exit 1 ;;
          esac

          REF="refs/scheduled/$KEY"
          git fetch --quiet origin "+$REF:$REF" || true

          PREVIOUS_CONCLUSION=""
          PREVIOUS_SINCE=""
          if git show-ref --verify --quiet "$REF"; then
            PREVIOUS_CONCLUSION="$(git log -1 --format=%B "$REF" | sed -n 's/^conclusion: //p' | head -n 1)"
            PREVIOUS_SINCE="$(git log -1 --format=%B "$REF" | sed -n 's/^since: //p' | head -n 1)"
          fi

          if [ "$CONCLUSION" = "success" ]; then
            SINCE=""
          elif [ -n "$PREVIOUS_SINCE" ] && [ "$PREVIOUS_CONCLUSION" != "success" ]; then
            SINCE="$PREVIOUS_SINCE"
          else
            SINCE="$BAD_SHA"
          fi

          msg=$(printf 'scheduled %s %s\n\nsha: %s\nconclusion: %s\nsince: %s\nrun: %s\nrecorded: %s\n' \
            "$KEY" "$CONCLUSION" "$BAD_SHA" "$CONCLUSION" "$SINCE" "$RUN_URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          empty=$(git hash-object -t tree /dev/null)
          commit=$(git commit-tree "$empty" -m "$msg")
          git push --force origin "$commit:$REF"

      - name: open, update, or close the persistent regression issue
        shell: bash
        run: |
          set -euo pipefail

          case "$RUN_NAME" in
            "nightly regression")
              TITLE="[scheduled-regression] nightly regression is red"
              ;;
            "weekly statistical")
              TITLE="[scheduled-regression] weekly statistical evidence is red"
              ;;
            *)
              echo "Unrecognised scheduled workflow: $RUN_NAME"
              exit 1
              ;;
          esac

          NUMBER="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"$TITLE\") | .number" \
              | head -n 1
          )"

          if [ "$CONCLUSION" = "success" ]; then
            if [ -n "$NUMBER" ]; then
              gh issue close "$NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Recovered on $BAD_SHA: $RUN_URL"
            fi
            exit 0
          fi

          REPORT="$(cat <<EOF
          Scheduled evidence **$RUN_NAME** concluded **$CONCLUSION** on $BAD_SHA.

          Run: $RUN_URL

          Treat this as active regression work. The first report in this issue is the first known bad scheduled SHA; later failures are appended here until a successful run closes the issue.
          EOF
          )"

          if [ -n "$NUMBER" ]; then
            # Scheduled regressions are active P0 work under AGENTS.md priority
            # rules. Repair the priority if somebody removed it while the
            # regression is still open, then append the newest failing run.
            gh issue edit "$NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label "priority: P0"
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$REPORT"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --label "priority: P0" \
              --body "$REPORT"
          fi
