name: issue 341 replay measurement

on:
  push:
    branches:
      - chatgpt/341-ranked-variety-worklist-20261006
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  replay-48-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Measure 48 replay pairs
        run: npm run gate:replay -- 48
