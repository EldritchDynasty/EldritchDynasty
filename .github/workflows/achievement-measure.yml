name: achievement measurement

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: achievement-measure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measure:
    name: achievement 100x4 measurement
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: run judgeable achievement report
        run: |
          npm run gate:achievements | tee achievement-rates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: achievement-rates
          path: achievement-rates.txt
          if-no-files-found: error
