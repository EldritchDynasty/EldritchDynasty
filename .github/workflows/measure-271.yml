name: measure-271

on:
  push:
    branches: [chatgpt/271-measurement]

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: #271 variance stats
        run: npx tsx --tsconfig tsconfig.base.json packages/core/src/tools/measure-271-temp.ts
