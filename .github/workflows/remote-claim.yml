name: remote claim

on:
  issue_comment:
    types: [created]
  # The second transport (#499): a connector whose safety layer refuses the
  # comment can still create a branch and commit a file, because that is how it
  # does any work at all. claim-request/<working-branch> carries CLAIM_REQUEST.
  push:
    branches: ['claim-request/**']

# Connector-only sessions cannot create the orphan empty-tree commit used by the
# canonical claim mutex. This workflow is only a transport to tools/agents.mjs;
# it never constructs, updates, or interprets claim refs itself.
permissions:
  contents: write

jobs:
  claim:
    if: >-
      github.event_name == 'issue_comment'
      && (github.event.comment.body == '/claim'
          || startsWith(github.event.comment.body, '/claim '))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authorize request
        uses: actions/github-script@v7
        with:
          script: |
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.data.permission)) {
              core.setFailed(
                `/claim requires write access; ${context.actor} has ${permission.data.permission}.`,
              );
            }

      # Always execute trusted code from main. A claim comment may be placed on
      # a pull request, but must never cause that pull request's code to run with
      # a write-capable token.
      - name: Check out claim transport
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure claim committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run canonical claim tool
        env:
          ED_CLAIM_REQUEST: ${{ github.event.comment.body }}
        run: node tools/remote-claim.mjs

  # Same transport, read from a pushed file instead of a comment. Pushing a
  # branch already requires write access to this repository, which is the same
  # bar the comment path checks, but it is checked here too rather than assumed.
  claim-branch:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: remote-claim-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Authorize request
        uses: actions/github-script@v7
        with:
          script: |
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.data.permission)) {
              core.setFailed(
                `/claim requires write access; ${context.actor} has ${permission.data.permission}.`,
              );
            }

      # Trusted main, never the request branch: the request is read out of the
      # pushed commit as DATA by remote-claim.mjs, and none of its code runs.
      - name: Check out claim transport
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure claim committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run canonical claim tool
        env:
          ED_CLAIM_REQUEST_BRANCH: ${{ github.ref_name }}
          ED_CLAIM_REQUEST_SHA: ${{ github.sha }}
        run: node tools/remote-claim.mjs
