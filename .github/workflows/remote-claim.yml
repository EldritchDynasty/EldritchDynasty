name: remote claim

on:
  issue_comment:
    types: [created]

# Connector-only sessions cannot create the orphan empty-tree commit used by the
# canonical claim mutex. This workflow is only a transport to tools/agents.mjs;
# it never constructs, updates, or interprets claim refs itself.
permissions:
  contents: write

jobs:
  claim:
    if: >-
      github.event.comment.body == '/claim'
      || startsWith(github.event.comment.body, '/claim ')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authorize request
        uses: actions/github-script@v7
        with:
          script: |
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.data.permission)) {
              core.setFailed(
                `/claim requires write access; ${context.actor} has ${permission.data.permission}.`,
              );
            }

      # Always execute trusted code from main. A claim comment may be placed on
      # a pull request, but must never cause that pull request's code to run with
      # a write-capable token.
      - name: Check out claim transport
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure claim committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run canonical claim tool
        env:
          ED_CLAIM_REQUEST: ${{ github.event.comment.body }}
        run: node tools/remote-claim.mjs
