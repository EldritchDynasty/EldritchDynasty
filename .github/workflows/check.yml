name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  # `ready_for_review` and `labeled` ARE NOT DEFAULTS AND ARE LOAD-BEARING.
  # The default type list is opened/synchronize/reopened, so without these two
  # the tier below could be raised and nothing would run at the new tier until
  # the next push — an opt-in that silently does nothing until you forget you
  # asked for it. See `tier`.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # Re-run the whole thing by hand without an empty commit, which is the only
  # other way anybody has to ask CI a question twice.
  workflow_dispatch:

# Nothing here writes anything, so nothing here gets a token that can. This is
# explicit because the repository-wide default had to be raised to "read and
# write" for `janitor.yml` to delete a merged branch, and a default is exactly
# the kind of thing that widens a job nobody was thinking about at the time.
permissions:
  contents: read

# Supersede a PR's own earlier runs; never a push to `main`. Every commit on
# `main` is somebody's landed work and is the only verdict it will ever get —
# this repository fast-forwards without pull requests, so cancelling there
# would leave a commit permanently unjudged.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── WHY THESE JOBS AND NOT ONE ────────────────────────────────────────────
#
# This was one serial job, then three. It is now a tier decision, two cheap
# jobs that always run (lint, fast lane), four test shards, five gate lanes, a
# windows runner and a corpus warm that blocks nothing. The reason for
# splitting has never been the clock, and it still is not.
#
# A failing step aborts the steps after it, so a serial run reports the FIRST
# thing wrong and nothing else: fix a test, wait, discover a gate had moved
# too, fix that, wait again. The record of it is four pushes inside 33 minutes
# on 2026-09-05, spending hours of runner time to learn three facts one run
# could have carried. Split, every job reports independently, and the verdict
# arrives in the time the SLOWEST job takes rather than the sum of them.
#
# THAT IS WHY EVERY MATRIX BELOW SETS `fail-fast: false`. The default cancels
# every sibling the moment one fails, which would rebuild the exact serial
# failure mode inside each job — four shards reporting one broken test and
# hiding the other three. A matrix without it is a regression dressed as a
# speed-up.
#
# NOTHING IS MOVED OFF `main`. The obvious version of this change — fast
# checks on push, the expensive ones on pull requests — would disable them:
# AGENTS.md records standing authorisation to fast-forward `main` with no PR
# at all, so a PR-gated job would run approximately never. Coverage on push is
# identical to what it was; only the shape changed. Nothing is deferred to a
# schedule either, and gates 4 and 8 are why: a tier's share of the year is
# weight times how many templates carry it, so they go red on content nobody
# touched. Weekly would mean finding that with a week of commits to bisect.
#
# THE TIER BELOW DOES NOT WEAKEN THAT AND IS NOT AN EXCEPTION TO IT. Two
# things get the short set: a DRAFT pull request, and a change made only of
# markdown whose base commit's own verdict was green. Everything else — every
# push to `main` that touches anything but `.md`, a tag, a manual dispatch,
# every pull request that is not a draft — runs every job in this file,
# exactly as before. The markdown case moves nothing off `main` either: the
# jobs it skips cannot read a markdown file, so their answer for that commit
# is the green they already gave its parent. The argument for where both
# lines fall is on the `tier` job itself.
#
# ── WHAT IT COSTS ───────────────────────────────────────────────────────────
#
# Gate timing is checked data, not prose. Current lane baselines, measurement
# date, evidence and tolerance live in tools/gate-durations.json, and every
# gate job below checks its own elapsed wall clock against that file.
#
# #333 re-measured a green runner gate-by-gate before repacking. The expensive
# default-lane work was independent blood play plus the shared fire-rate
# corpus, so those costs now run in parallel lanes without reducing a seed or
# an assertion. War remains the gate critical path. The measurement and the
# before/after critical-path and runner-minute accounting are recorded in
# docs/BALANCE-LOG.md.
#
# Test-file cost is separately data-driven by tools/test-durations.json and
# tools/shards.mjs. Keep both timing systems machine-readable; do not add a
# stopwatch figure here as another source of truth.
#
jobs:
  # ── WHICH TIER THIS RUN IS, DECIDED IN ONE PLACE ──────────────────────────
  #
  # THE WASTE THIS EXISTS FOR, MEASURED over runs 169-198 (issue #144). Agents
  # push every micro-commit, and each push started the whole nine-job set:
  #
  #   codex/issue-61-channel    runs 195, 196, 197 created at 08:38:23,
  #                             08:38:29 and 08:38:33 — three full builds in
  #                             TEN SECONDS, two cancelled on arrival.
  #   codex/issue-133-stage5    eight runs between 05:05 and 05:22, seven
  #                             cancelled.
  #
  # The cancellation is correct and is not what changes here: superseding a
  # stale run is exactly what `cancel-in-progress` is for. The waste is
  # upstream of it — firing the expensive half at a commit that is going to be
  # superseded thirty seconds later, and a cancelled run is still billed for
  # the minutes it ran before it died. The slow suites start first.
  #
  # SO THE EXPENSIVE HALF IS GATED AND THE CHEAP HALF NEVER IS. `lint` and
  # `fast lane` run on every event, always, and they are the two that catch
  # the failure this codebase actually has: a broken Vue template, a schema
  # mismatch, a hook that names a shell. Three minutes, and nothing about a
  # draft branch is unguarded.
  #
  # WHAT RAISES THE TIER, AND WHY THESE AND NOT A LABEL ALONE:
  #
  #   anything that is not a pull request   push to `main`, a tag, or a manual
  #                                         dispatch. NOTHING MOVES OFF TRUNK —
  #                                         see the note above on gates 4 and
  #                                         8, which go red on content nobody
  #                                         touched and would otherwise arrive
  #                                         with a batch of suspects.
  #   a pull request that is not a draft    GitHub's own words for "this is
  #                                         the head that is about to land".
  #   the `full-ci` label                   so a draft can ask for the whole
  #                                         set without being undrafted.
  #
  # THE DEFAULT IS THE SAFE ONE, AND THAT IS THE WHOLE DESIGN. An ordinary
  # pull request is not a draft, so it gets exactly the coverage it got before
  # this job existed. Cheap iteration is something you OPT INTO by marking the
  # branch a draft, which is the act you were already performing. Gated the
  # other way round — full set only when a label says so — forgetting the
  # label would cost coverage silently, and this repository has a catalogue of
  # what that costs (`docs/FAILURES.md`). Forgetting a draft flag costs
  # minutes, and minutes announce themselves.
  #
  # ONE PLACE STATES THE RULE. A four-way copy of this expression across the
  # gated jobs is the hand-kept list `land.mjs` refuses to keep about gates and
  # `check.yml` refuses to keep about lanes. It costs one runner for about five
  # seconds, and it PRINTS the decision into the log, so a build that ran the
  # short set says so rather than leaving somebody to infer it from absences.
  #
  # AND ONE THING LOWERS IT: A DIFF OF ONLY MARKDOWN, ON A GREEN BASE.
  #
  # The gates and the slow suites load the simulation sources and the content
  # YAML and cannot see a markdown file, so a change made only of `.md` files
  # cannot move a number they compute. What DOES read markdown — as data, for
  # dead paths, byte budgets and stale figures — is the fast lane, and the
  # short tier runs it. The base's own verdict must be green first: a short run
  # on a red `main` would record a green that hides the red from everyone who
  # asks whether trunk is healthy. The rule lives in `tools/docs-only.mjs`,
  # which the landing imports too, so the two cannot classify a diff apart.
  # Never for a tag, a manual dispatch, or a pull request labelled `full-ci`:
  # those ask for everything by name. Anything the classifier cannot answer —
  # a new branch with no `before`, a history it cannot reach — is the full set.
  tier:
    name: which tier
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject negated closing keywords in pull request body
        if: github.event_name == 'pull_request'
        env:
          CHECK_PR_BODY: '1'
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node tools/closing-keywords.mjs
      - id: decide
        env:
          # `>-` FOLDS TO ONE LINE ONLY IF EVERY LINE IS INDENTED THE SAME.
          # A more-indented continuation is a literal line in YAML and keeps its
          # newline, which would hand GitHub an expression with line breaks
          # inside it. It happens to survive that; relying on it is a footgun
          # with no upside, so the lines below are all at one indent.
          FULL: >-
            ${{ github.event_name != 'pull_request'
            || github.event.pull_request.draft == false
            || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          FORCED: >-
            ${{ github.event_name == 'workflow_dispatch'
            || startsWith(github.ref, 'refs/tags/')
            || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          # For a pull request `github.sha` is the merge commit, whose parent is
          # the base — so both events diff "what is new" against a commit that
          # has its own verdict.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          DOCS=""
          if [ "$FULL" = true ] && [ "$FORCED" != true ]; then
            SET=$(node tools/docs-only.mjs "$BASE" "$HEAD_SHA" 2>docs-only.txt || echo full)
            DOCS=$(cat docs-only.txt)
            echo "$DOCS"
            if [ "$SET" = short ]; then FULL=false; fi
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          if [ "$FULL" = true ]; then
            echo "FULL SET: every job in this workflow." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$DOCS" ]; then echo "$DOCS" >> "$GITHUB_STEP_SUMMARY"; fi
          elif [ -n "$DOCS" ]; then
            echo "SHORT SET: typecheck, validate and the fast lane only." >> "$GITHUB_STEP_SUMMARY"
            echo "$DOCS" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing else this workflow runs reads a markdown file." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SHORT SET: typecheck, validate and the fast lane only." >> "$GITHUB_STEP_SUMMARY"
            echo "This is a draft pull request. Mark it ready for review, or add the" >> "$GITHUB_STEP_SUMMARY"
            echo "'full-ci' label, to run the slow suites, both gate lanes and windows." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Seconds, and it is the one that catches the failure this codebase calls
  # silent: a broken Vue template or a mismatched schema looks like a working
  # feature until somebody happens to hit the path.
  lint:
    name: typecheck + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # Zod validation across all content. Any error fails the build — this is
      # also where CI gate 6 (purposes) lives: `event/purposes` and
      # `event/purpose-overlap` are both error-level rules.
      - name: validate content
        run: npm run validate

      # Advice, not a gate — annotations, never a build failure. Runs even
      # when an earlier step failed, so a broken build still gets it.
      - name: prose lint (annotations only)
        if: always()
        run: npm run lint:prose

  # ── THE FAST LANE, ON EVERY EVENT, AT EITHER TIER ─────────────────────────
  #
  # `lint` above is typecheck and validate; this is the third of the three
  # commands AGENTS.md calls the fix-and-rerun loop, and together they are the
  # whole short tier. About a minute, and it is where every suite that spawns a
  # real operating script lives.
  #
  # ON THE FULL TIER IT DUPLICATES A MINUTE the shards run again inside `test`.
  # That is bought deliberately: the alternative is two different job sets
  # depending on the tier, and a job that exists only on one of them is a job
  # nobody reads when debugging the other. It is nowhere near the critical path
  # — see the timing block above — so the duplicate minute costs a runner and
  # no wall clock, and it means the short tier is not a special case of this
  # workflow but a subset of it.
  fast:
    name: fast lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: fast lane
        run: npm run test:fast

  # ── THE OTHER PLATFORM ────────────────────────────────────────────────────
  #
  # AGENTS.md says this repository is supported on Windows and Linux, under
  # Claude Code and Codex, and that all four combinations are first-class. For
  # months every job in this file ran on `ubuntu-latest` and every operating
  # script was `#!/usr/bin/env bash`, two of them piping stdin through `jq`. So
  # the claim was prose, and the evidence for it was that nobody had reported
  # otherwise — which is not evidence, because the way this fails is silence.
  #
  # A session hook that cannot start prints nothing an agent sees. The clone
  # stays shallow; `merge-base --is-ancestor` then answers FALSE past the graft
  # boundary rather than failing, so every "has this landed" reads wrong in the
  # direction that looks cautious; the claims other sessions hold are simply
  # not printed. A Windows agent got a worse session than a Linux one and had
  # no way to find out.
  #
  # WHAT THIS JOB IS FOR, AND WHAT IT IS DELIBERATELY NOT.
  #
  # It asks one question: does the TOOLING run there. The fast lane is the
  # whole answer, because that is where the suites that drive the tooling live
  # — `settings`, `orient`, `janitor`, `land`, `agents`, `verdict` and
  # `portability` all spawn the real scripts and read what they print. The
  # slow lane plays millennia and the gates measure them, and a seeded pure
  # simulation returns the same numbers on either platform; paying a second
  # runner thirty minutes to re-derive them would buy nothing.
  #
  # IT IS FREE, AND THAT IS A MEASURED CLAIM RATHER THAN A HOPE. The build's
  # floor is a gate lane (the current baselines are checked data in
  # `tools/gate-durations.json`). Everything below — install, typecheck, validate, fast lane —
  # runs several times inside that, so this job adds a runner and no wall
  # clock. Re-measure it with `tools/cost.mjs` like everything else here; if it
  # ever approaches the floor, shard it before deleting it.
  #
  # `npm ci` is not cached on this runner ON PURPOSE. `cache: npm` keys on the
  # lockfile and restores a tarball cache, which is fine — what is NOT fine is
  # sharing a `node_modules` across platforms, and an unkeyed cache is how that
  # happens by accident. Optional native dependencies resolve per platform.
  windows:
    name: windows (typecheck + validate + fast lane)
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The same three commands AGENTS.md tells an agent to run, spelled the
      # same way. A Windows-only variant of a command is a command that drifts:
      # the point is that `npm run typecheck` works on both, not that there is
      # a second thing to run here.
      - name: typecheck
        run: npm run typecheck

      - name: validate content
        run: npm run validate

      # The fix-and-rerun loop, which is also every suite that spawns a script
      # this repository asks an agent to run. `portability.test.ts` is in here,
      # and it is the one that fails the build if a hook goes back to naming a
      # shell.
      - name: fast lane
        run: npm run test:fast

  # ── THE TEST LANE, IN FOUR, PACKED BY DURATION ────────────────────────────
  #
  # Both vitest lanes are in here — the fast suites and the `*.slow.test.ts`
  # ones that play whole games.
  #
  # VITEST'S OWN SHARDING IS DURATION-BLIND, AND THAT COST 46 MINUTES A BUILD.
  # `--shard=i/n` hashes each file's PATH, sorts by the hash and slices into
  # equal COUNTS (`BaseSequencer.shard`, vitest 2.1.9). Deterministic, and
  # completely indifferent to what a file costs — so a shard's duration is
  # whatever suites its hash happened to draw, and adding ONE test file
  # anywhere in the repository re-rolls it for every shard.
  #
  # Run 185 is what that looks like when the dice go badly: 3m02s, 67m47s,
  # 10m45s, 4m03s. Nothing was slow that had not been slow the week before.
  # Every shard was green. The build was 68 minutes and three quarters of it
  # was seven finished jobs waiting on one.
  #
  # `vitest.config.ts` names a sequencer now (`tools/shards.mjs`) that
  # bin-packs the files by recorded cost, longest first. The count stays four:
  # packed, the shards sit below the gate-lane floor recorded in
  # `tools/gate-durations.json`, so a fifth runner buys nothing while that remains true — this is sized against the
  # critical path, the same argument as before, now made against numbers that
  # are measured rather than remembered.
  #
  # WHAT SHARDING STILL CANNOT DO. Vitest parallelises per FILE. A single file
  # longer than a shard's fair share is a floor no packing and no shard count
  # can cut, and the fix for one of those is not here — AGENTS.md prescribes
  # it, with its one prohibition: split it BY TEST, never by seed range,
  # because these are batch statistics and taking seeds out of a batch changes
  # what the batch claims. `lanes.test.ts` is where that stops being advice.
  # It re-packs the real file list from the committed durations and fails the
  # build when the shards come out further apart than a stated factor, which is
  # exactly the condition one oversized file produces.
  test:
    name: test ${{ matrix.shard }}/4
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      # See the note above: the default would cancel the other three shards on
      # the first failure and report one broken test out of however many there
      # are. That is the serial failure mode this workflow was split to kill.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ── THE RUN CORPUS ─────────────────────────────────────────────────
      #
      # `record.slow.test.ts` plays 240 runs of 458 years for two assertions
      # and, because vitest parallelises per FILE, was the 451-second floor
      # the whole lane waited behind. It reads those runs back through
      # saveGame/loadGame now — 23 seconds — but only once they are in the
      # corpus. COLD it is slightly slower than replaying, because playing a
      # run and then saving and compressing it costs more than playing it.
      #
      # So a cache that is never warm is a tax, and CI is exactly where it
      # would never be warm. The key is a hash of the simulation sources and
      # the content together, printed by the corpus tool itself: change
      # either and the key changes, the restore misses, and the warm step
      # below rebuilds it for next time. There is no invalidation to reason
      # about and no way to serve a run the current code would not produce.
      # Invoked through tsx rather than through an npm script, because
      # `land.test.ts` derives the landing's step set from this file by
      # matching npm invocations, and a quiet-mode flag in that position reads
      # to it as the name of a script. It matches comments too, on purpose, so
      # this one does not spell the flag out either. A workflow line that
      # confuses the thing checking the workflow is the workflow's to fix.
      - name: corpus key
        id: corpus
        run: |
          KEY=$(npx tsx --tsconfig tsconfig.base.json packages/core/src/tools/corpus-warm.ts --key)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # RESTORE ONLY. THE WARM IS ITS OWN JOB, AND CONCURRENCY IS WHY.
      #
      # The four shards run AT THE SAME TIME, so a warm inside one of them
      # cannot help the others: they have already restored (and missed) by the
      # time it finishes writing. Whichever shard draws the one suite that
      # needs the corpus — `record.slow.test.ts` — warming in a DIFFERENT
      # shard spends 5m40s to speed up nobody and makes that shard the longest
      # job in the build for the privilege. (Which shard that is used to be a
      # fact about a path hash and is now a fact about the packing; either way
      # it is not a shard this step can name in advance.)
      #
      # A warm only ever pays forward, into the NEXT run. So it belongs in a
      # job that blocks nothing and that nothing waits on — see `corpus`
      # below. On a cold key the shards play their own runs, which is
      # `playedRun`'s documented fallback and was always the cold behaviour.
      - name: restore run corpus
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/ed-runs
          key: ed-runs-${{ steps.corpus.outputs.key }}-${{ hashFiles('packages/content/**') }}

      - name: test
        run: npm test -- --shard=${{ matrix.shard }}/4

  # ── THE GATES, PARTITIONED BY MEASURED COST ──────────────────────────────
  #
  # packages/core/src/tools/gates.ts owns the partition and derives batch
  # as every registered gate not assigned an independent lane. The fire-rate
  # lane deliberately keeps outcome-reach and vocabulary-reach beside their
  # shared process-local corpus. packages/core/src/gates.test.ts proves that
  # this matrix and the engine lane table agree.
  #
  # tools/gate-durations.json is the sole current timing authority. Each lane
  # measures itself below and fails if it exceeds the checked tolerance.
  gates:
    name: gates (${{ matrix.lane }})
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      # A red lane must not cancel its siblings. Same reason as the test matrix:
      # these lanes answer unrelated questions.
      fail-fast: false
      matrix:
        lane: [batch, blood, fire-rate, war, endings]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: gates
        run: |
          started=$(date +%s)
          npm run gates -- --lane ${{ matrix.lane }}
          elapsed=$(( $(date +%s) - started ))
          node tools/gate-duration.mjs --check ${{ matrix.lane }} "$elapsed"

  # ── THE CORPUS WARM, WHICH BLOCKS NOTHING ─────────────────────────────────
  #
  # Nothing `needs:` this job and it needs nothing, so it runs beside the
  # shards and is never on the critical path. It exists to leave a warm corpus
  # under the key the NEXT run will restore — which is the only thing a warm
  # was ever able to do once the test job became four concurrent shards.
  #
  # ADVISORY IN EVERY SENSE. The corpus is a CACHE of played millennia, keyed
  # on the simulation sources and the content together, and `playedRun` falls
  # back to playing the run on any failure to read or write one. A warm that
  # fails costs the suite its speed-up and cannot cost it its correctness, so
  # this job must not be able to fail a build: `continue-on-error` at the job
  # level says that to the runner, and `tools/land.mjs` lists `corpus` in
  # ADVISORY for the same reason. A landing does not warm it at all — that is
  # minutes of runs to build a cache CI will not share with that machine.
  corpus:
    name: warm run corpus
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: corpus key
        id: corpus
        run: |
          KEY=$(npx tsx --tsconfig tsconfig.base.json packages/core/src/tools/corpus-warm.ts --key)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: restore run corpus
        id: restored
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/ed-runs
          key: ed-runs-${{ steps.corpus.outputs.key }}-${{ hashFiles('packages/content/**') }}
      # Nothing to do when the key already holds a corpus: the runs in it were
      # produced by this exact content and these exact sources, or the key
      # would not match.
      - name: warm run corpus
        if: steps.restored.outputs.cache-hit != 'true'
        run: npm run corpus
      - name: save run corpus
        if: steps.restored.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache/ed-runs
          key: ed-runs-${{ steps.corpus.outputs.key }}-${{ hashFiles('packages/content/**') }}

  # A release is the same checked client inside an Android activity. It is
  # deliberately downstream of every game check: an AAB that packages an
  # invalid bundle is not a release candidate.
  android:
    name: Android AAB
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, windows, test, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: build the offline client
        run: npm run build:client
      - name: install the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > packages/mobile/android/release.keystore
          cat > packages/mobile/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: build signed app bundle
        working-directory: packages/mobile/android
        run: ./gradlew bundleRelease
      # Page-size alignment is a property of native shared libraries. This
      # shell deliberately ships none: fail if a transitive dependency changes
      # that fact, instead of treating "we have no native code" as folklore.
      - name: assert no unaligned native payload
        run: |
          if unzip -l packages/mobile/android/app/build/outputs/bundle/release/app-release.aab | grep -E '/lib/.+\.so$'; then
            echo 'The AAB now contains native libraries; add and verify 16 KB alignment before release.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Eldritch-Dynasty-${{ github.ref_name }}.aab
          path: packages/mobile/android/app/build/outputs/bundle/release/app-release.aab

  # A release is the same checked client inside a Windows installer —
  # the desktop half of the same rule `android` states above. Windows only:
  # macOS and Linux are out of scope per #103, not deferred.
  #
  # Runs on `windows-latest` deliberately, not `ubuntu-latest`: signing a
  # Windows executable from Linux needs Wine and `osslsigncode` standing in
  # for tools that already exist on the platform the artefact is FOR, and this
  # job's whole job is to produce the real thing, not a cross-built stand-in.
  windows-release:
    name: Windows installer
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, windows, test, gates]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build the offline client
        run: npm run build:client

      # PRE-RELEASE TAGS PROVE PACKAGING NOW; PRODUCTION TAGS STILL REFUSE
      # UNSIGNED BYTES. Public-trust code-signing keys have been non-exportable
      # since 2023, so the old base64-PFX secret could never be provisioned.
      # Signing stays deferred until the owner selects a remote-HSM provider.
      #
      # A hyphen is SemVer's pre-release marker: `v0.3.0-beta.1` packages
      # unsigned and records `authenticode: not-checked`; `v1.0.0` takes the
      # production path and the proof script rejects both installer and shipped
      # executable unless Authenticode validates. When cloud signing is wired,
      # it belongs before that production proof without changing this split.
      #
      # Both steps reach electron-builder's Node API rather than an npm script.
      # `tools/land.mjs` derives ordinary landing work from workflow npm scripts;
      # tag packaging must never become something every landing pays for.
      - name: package unsigned Windows pre-release
        if: contains(github.ref_name, '-')
        working-directory: packages/shell
        run: node scripts/dist-windows.mjs

      - name: package production Windows release and require Authenticode
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: packages/shell
        run: node scripts/dist-windows.mjs --require-signature

      - uses: actions/upload-artifact@v4
        with:
          name: Eldritch-Dynasty-${{ github.ref_name }}-windows
          path: |
            packages/shell/release/*.exe
            packages/shell/release/windows-release-proof.json


  # BOOTSTRAP FOR THE COMMENT-TRIGGERED REMOTE LANDING.
  #
  # A newly-added issue_comment workflow cannot hear its own PR: GitHub only
  # listens for repository events through workflow files already on the default
  # branch. A PR carrying this marker therefore calls the SAME reusable workflow
  # from the PR event that already reached this file. After this feature lands,
  # ordinary connector sessions use the /land comment and never need the marker.
  #
  # The implementation lives in remote-land.yml; this is deliberately only a
  # transport. Referencing a same-repository reusable workflow without @ref uses
  # the same commit as this caller, so the bootstrap exercises exactly the file
  # proposed by the PR rather than the copy currently on main.
  remote-land-bootstrap:
    name: remote landing transport
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.body || '', '<!-- remote-land -->')
    permissions:
      actions: write
      contents: write
      pull-requests: read
    uses: ./.github/workflows/remote-land.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      LAND_DEPLOY_KEY: ${{ secrets.LAND_DEPLOY_KEY }}
