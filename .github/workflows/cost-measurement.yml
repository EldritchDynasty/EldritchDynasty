name: cost measurement probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  measure:
    if: github.event.pull_request.number == 537
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: regenerate canonical test-duration table
        run: npm run cost -- --full --write
      - uses: actions/upload-artifact@v4
        with:
          name: cost-measurement-${{ github.event.pull_request.head.sha }}
          path: |
            AGENTS.md
            tools/test-durations.json
          if-no-files-found: error
          retention-days: 1
