name: cut pre-release tag

# #321: a manual pre-release tag is the common Windows/Android/iOS release proof.
# Never tag a guessed SHA, an untested main commit, or an arbitrary ref.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pre-release tag, e.g. v0.3.0-beta.1'
        required: true
        type: string
      expected_sha:
        description: 'Exact 40-character HEAD SHA of green main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cut-pre-release-tag
  cancel-in-progress: false

jobs:
  cut:
    name: require green main, then tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check exact main CI before creating a tag
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG_NAME ?? '';
            const sha = (process.env.EXPECTED_SHA ?? '').toLowerCase();
            const fail = (reason) => core.setFailed(reason);

            if (context.ref !== 'refs/heads/main') {
              fail('Pre-release tags can only be cut by dispatching on main.');
              return;
            }
            if (!/^v\d+\.\d+\.\d+-(?:alpha|beta|rc)\.\d+$/.test(tag)) {
              fail('Tag must be a versioned pre-release (e.g. v0.3.0-beta.1).');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              fail('expected_sha must be an exact 40-character commit SHA.');
              return;
            }

            const current = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (current.data.commit.sha !== sha) {
              fail('Expected SHA is not the current head of main.');
              return;
            }

            // A PR-head or a manually dispatched short-tier check is not
            // release evidence. Require the complete push-to-main check at
            // this exact SHA and its stable merge-required check job.
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'check.yml', branch: 'main',
              event: 'push', head_sha: sha, per_page: 100,
            });
            const candidates = runs.data.workflow_runs.filter(
              (run) => run.head_sha === sha && run.head_branch === 'main'
                && run.event === 'push',
            );
            const latest = candidates.sort((a, b) =>
              b.run_number - a.run_number || b.run_attempt - a.run_attempt)[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              fail('No completed successful push-to-main check for this exact SHA.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: latest.id, per_page: 100,
            });
            if (!jobs.some((job) => job.name === 'CI required'
              && job.status === 'completed' && job.conclusion === 'success')) {
              fail('Push-to-main workflow lacks a successful CI required job.');
              return;
            }

            // Do not tag a head superseded while CI evidence was fetched.
            const again = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (again.data.commit.sha !== sha) {
              fail('main advanced during tag validation; dispatch again on its new head.');
              return;
            }
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            core.info(`Created ${tag} at green main ${sha}; tag-triggered release CI is next.`);
