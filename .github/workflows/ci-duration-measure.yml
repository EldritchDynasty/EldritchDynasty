# Temporary, branch-scoped calibration runner for P0 #2445.
# Delete this workflow after importing the measured artifact into the PR branch.
name: measure test durations (2445)
on:
  push:
    branches:
      - chatgpt/issue-2445-measured-duration-20261102-1711

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Measure the full suite and regenerate the official duration table
        run: npm run cost -- --full --write
      - name: Publish verifiable generated duration evidence
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { createHash } from 'node:crypto';
            const data = readFileSync('tools/test-durations.json');
            const doc = JSON.parse(data.toString('utf8'));
            if (doc.measured !== new Date().toISOString().slice(0, 10))
              throw new Error('duration evidence did not refresh on this run');
            if (Object.keys(doc.files).length < 280)
              throw new Error('incomplete measured test inventory');
            console.log('MEASURED_FILE_COUNT=' + Object.keys(doc.files).length);
            console.log('MEASURED_SHA256=' + createHash('sha256').update(data).digest('hex'));
            console.log('BEGIN_MEASURED_DURATIONS_BASE64');
            const encoded = data.toString('base64');
            for (let at = 0; at < encoded.length; at += 1200)
              console.log(encoded.slice(at, at + 1200));
            console.log('END_MEASURED_DURATIONS_BASE64');
          "
      - uses: actions/upload-artifact@v4
        with:
          name: generated-test-durations-2445
          path: tools/test-durations.json
          retention-days: 7
