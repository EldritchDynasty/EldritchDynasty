name: remote land

on:
  issue_comment:
    types: [created]
  workflow_call:
    inputs:
      pr_number:
        description: Pull request to land. Used by the check.yml bootstrap bridge.
        required: true
        type: number
    secrets:
      LAND_DEPLOY_KEY:
        description: Write-enabled deploy key used by the only main-pushing path.
        required: false

# This workflow is deliberately the only connector-only substitute for running
# `npm run land` in a session shell. It does not recreate the landing in YAML:
# it runs the repository's own landing command on a GitHub-hosted runner.
permissions:
  contents: read
  pull-requests: read

jobs:
  admit:
    permissions:
      contents: read
      pull-requests: read
      issues: write
    if: >-
      (github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && (github.event.comment.body == '/land'
      || github.event.comment.body == '/land --no-issue-check'
      || (endsWith(github.event.comment.body, ')_')
      && (startsWith(github.event.comment.body, fromJSON('"/land\n\n---\n_Generated by [Claude Code](https://"'))
      || startsWith(github.event.comment.body, fromJSON('"/land --no-issue-check\n\n---\n_Generated by [Claude Code](https://"'))))))
      || inputs.pr_number > 0
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.request.outputs.pr_number }}
      request_json: ${{ steps.request.outputs.request_json }}
      marker_id: ${{ steps.request.outputs.marker_id }}
      persisted: ${{ steps.request.outputs.persisted }}
      queue_group: ${{ steps.request.outputs.queue_group }}
    env:
      REQUEST_PR: ${{ inputs.pr_number || github.event.issue.number }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Authorize and persist landing request
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = Number(process.env.REQUEST_PR);
            const persistent = context.eventName === 'issue_comment';

            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed('No pull request number was supplied.');
              return;
            }

            // An issue-comment event is the immutable authorization event.
            // GitHub workflow reruns keep that old event payload but this script
            // would otherwise re-read the PR's *current* head and bind the old
            // /land comment to later code. Never let a rerun mint a second
            // request identity: a changed/retried landing needs a fresh /land.
            if (persistent && Number(process.env.RUN_ATTEMPT) > 1) {
              core.setFailed(
                'A /land comment is a one-shot immutable admission; workflow reruns cannot rebind it to a later PR head. Post a fresh /land comment.',
              );
              return;
            }

            // A newer trusted /land comment revokes an older request immediately,
            // even before this admission has persisted its own marker. If this
            // newer admission then fails readiness/authorization, it must also
            // retire the older request's human-visible queue flag. Do that only
            // while this source comment is still newest, and repair the label if
            // an even newer request appears during the check/remove race.
            const ATTRIBUTION = /\n\n---\n_Generated by \[Claude Code\]\(https:\/\/[^)\s]*\)_$/;
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const sourceRequest = persistent ? {
              requestedAt: String(context.payload.comment?.created_at ?? ''),
              sourceCommentId: Number(context.payload.comment?.id),
            } : null;
            const sourceRequestIsLater = (candidate, expected) => {
              const at = String(candidate.requestedAt ?? '');
              return at > expected.requestedAt || (
                at === expected.requestedAt
                && Number(candidate.sourceCommentId) > Number(expected.sourceCommentId)
              );
            };
            const permissionCache = new Map();
            const canLand = async (login) => {
              if (!login) return false;
              if (permissionCache.has(login)) return permissionCache.get(login);
              try {
                const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: login,
                });
                const allowed = ['admin', 'maintain', 'write'].includes(permission.data.permission);
                permissionCache.set(login, allowed);
                return allowed;
              } catch (error) {
                if (error.status === 404) {
                  permissionCache.set(login, false);
                  return false;
                }
                throw error;
              }
            };
            const hasLaterRequest = async (comments) => {
              if (!sourceRequest) return false;
              for (const comment of comments) {
                const body = String(comment.body ?? '');
                // Once a newer request has been admitted, its immutable bot
                // marker remains authoritative even if the human source
                // comment is later edited or deleted.
                if (comment.user?.login === 'github-actions[bot]') {
                  const marker = /<!-- land-request-json:(\{.*\}) -->/.exec(body);
                  if (marker) {
                    try {
                      if (sourceRequestIsLater(JSON.parse(marker[1]), sourceRequest)) return true;
                    } catch {
                      // Malformed unrelated markers do not own the queue flag.
                    }
                  }
                }
                if (!trusted.has(comment.author_association)) continue;
                const command = body.replace(ATTRIBUTION, '');
                if (command !== '/land' && command !== '/land --no-issue-check') continue;
                if (!sourceRequestIsLater({
                  requestedAt: comment.created_at,
                  sourceCommentId: comment.id,
                }, sourceRequest)) continue;
                if (await canLand(comment.user?.login)) return true;
              }
              return false;
            };
            const cleanupFailedAdmission = async () => {
              if (!sourceRequest) return;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: number,
                per_page: 100,
              });
              if (await hasLaterRequest(comments)) {
                core.notice('A still-newer /land request owns land-queued; failed admission will not clear it.');
                return;
              }
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name: 'land-queued',
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const afterRemoval = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: number,
                per_page: 100,
              });
              if (await hasLaterRequest(afterRemoval)) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: number,
                  labels: ['land-queued'],
                });
                core.notice('A newer /land request appeared during failed-admission cleanup; restored land-queued.');
              }
            };
            const failAdmission = async (message) => {
              try {
                await cleanupFailedAdmission();
              } catch (error) {
                core.warning('Could not clean land-queued after failed admission: ' + error.message);
              }
              core.setFailed(message);
            };

            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.data.permission)) {
              // A denied source comment never acquired landing authority, so it
              // must not revoke or dequeue an older valid request.
              core.setFailed(`/land requires write access; ${context.actor} has ${permission.data.permission}.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });
            if (pr.state !== 'open') {
              await failAdmission(`PR #${number} is not open.`);
              return;
            }
            if (pr.draft) {
              await failAdmission(`PR #${number} is a draft. Mark it ready before /land.`);
              return;
            }
            if (pr.base.ref !== 'main') {
              await failAdmission(`PR #${number} targets ${pr.base.ref}, not main.`);
              return;
            }
            if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
              await failAdmission('Remote landing is restricted to branches in this repository.');
              return;
            }

            // The Claude Code attribution footer the admission condition allows.
            const command = String(context.payload.comment?.body ?? '').replace(ATTRIBUTION, '');

            const noIssueCheck =
              context.eventName === 'issue_comment'
              && command === '/land --no-issue-check';
            const request = {
              version: 1,
              pr: number,
              requestedHead: pr.head.sha,
              requestedAt: persistent
                ? String(context.payload.comment?.created_at ?? new Date().toISOString())
                : new Date().toISOString(),
              noIssueCheck,
              sourceCommentId: persistent ? Number(context.payload.comment?.id) : null,
            };
            const requestJson = JSON.stringify(request);
            let markerId = '';

            if (persistent) {
              const label = 'land-queued';
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label,
                    color: '0e8a16',
                    description: 'Accepted by /land and waiting for the serialized landing queue',
                  });
                } catch (createError) {
                  // Two admissions can race the first-ever label creation.
                  // A 422 here means the neighbour won; prove the label now
                  // exists rather than turning a harmless race into a lost request.
                  if (createError.status !== 422) throw createError;
                  await github.rest.issues.getLabel({ owner, repo, name: label });
                }
              }

              const marker = '<!-- land-request:v1 -->';
              const markerBody = [
                marker,
                '<!-- land-request-json:' + requestJson + ' -->',
                'Queued /land request for PR #' + number + ' at `' + pr.head.sha.slice(0, 7) + '`.',
                'A newer trusted /land comment supersedes this immutable request; the queued job will refuse stale work.',
              ].join('\n');
              // One immutable marker per accepted request. Updating one shared
              // marker is not race-safe: two admission jobs can both read the old
              // value and overwrite each other. The sourceCommentId/requestedAt
              // order says which marker is newer.
              const stored = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: markerBody,
              });
              markerId = String(stored.data.id);
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: number,
                labels: [label],
              });
            }

            core.setOutput('pr_number', String(number));
            core.setOutput('request_json', requestJson);
            core.setOutput('marker_id', markerId);
            core.setOutput('persisted', persistent ? 'true' : 'false');
            core.setOutput(
              'queue_group',
              persistent
                ? 'remote-land-main-v3'
                : 'remote-land-bootstrap-' + process.env.RUN_ID,
            );

            core.notice(
              `Remote landing authorized for PR #${number} at ${pr.head.sha.slice(0, 7)}.`,
            );


  land:
    needs: admit
    permissions:
      contents: read
      pull-requests: read
      issues: write
    # Admission runs before this serialized job. Only the accepted immutable
    # request waits in the queue; unrelated comments never occupy it.
    concurrency:
      group: ${{ needs.admit.outputs.queue_group || format('remote-land-skip-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    if: needs.admit.result == 'success'
    runs-on: ubuntu-latest
    # The queue does the expensive rebased pre-push set, then waits for the
    # ordinary push-triggered check to publish its refs/verdict/<sha>.
    timeout-minutes: 240
    env:
      REQUEST_PR: ${{ needs.admit.outputs.pr_number }}

    steps:
      - name: Verify admitted request is still current
        id: pr
        uses: actions/github-script@v7
        env:
          REQUEST_JSON: ${{ needs.admit.outputs.request_json }}
          REQUEST_MARKER_ID: ${{ needs.admit.outputs.marker_id }}
          REQUEST_PERSISTED: ${{ needs.admit.outputs.persisted }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const request = JSON.parse(process.env.REQUEST_JSON);
            const persistent = process.env.REQUEST_PERSISTED === 'true';
            const ATTRIBUTION = /\n\n---\n_Generated by \[Claude Code\]\(https:\/\/[^)\s]*\)_$/;
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const permissionCache = new Map();
            const canLand = async (login) => {
              if (!login) return false;
              if (permissionCache.has(login)) return permissionCache.get(login);
              try {
                const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: login,
                });
                const allowed = ['admin', 'maintain', 'write'].includes(permission.data.permission);
                permissionCache.set(login, allowed);
                return allowed;
              } catch (error) {
                if (error.status === 404) {
                  permissionCache.set(login, false);
                  return false;
                }
                throw error;
              }
            };
            const requestIsLater = (candidate) => {
              const at = String(candidate.requestedAt ?? '');
              return at > request.requestedAt || (
                at === request.requestedAt
                && Number(candidate.sourceCommentId) > Number(request.sourceCommentId)
              );
            };
            let requestComments;
            const newerRequestExists = async ({ refresh = false } = {}) => {
              if (!persistent) return false;
              if (refresh) requestComments = undefined;
              if (!requestComments) {
                // Complete history is intentional: GitHub's `since` filter is
                // exclusive, while same-second request order uses comment ids.
                requestComments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: request.pr,
                  per_page: 100,
                });
              }
              for (const comment of requestComments) {
                const body = String(comment.body ?? '');
                if (comment.user?.login === 'github-actions[bot]') {
                  const marker = /<!-- land-request-json:(\{.*\}) -->/.exec(body);
                  if (marker) {
                    try {
                      if (requestIsLater(JSON.parse(marker[1]))) return true;
                    } catch {
                      // Malformed unrelated markers do not own the queue flag.
                    }
                  }
                }
                if (!trusted.has(comment.author_association)) continue;
                const command = body.replace(ATTRIBUTION, '');
                if (command !== '/land' && command !== '/land --no-issue-check') continue;
                if (!requestIsLater({
                  requestedAt: comment.created_at,
                  sourceCommentId: comment.id,
                })) continue;
                if (await canLand(comment.user?.login)) return true;
              }
              return false;
            };

            const removeQueued = async () => {
              if (!persistent) return;
              if (await newerRequestExists()) {
                core.notice('A newer /land request owns land-queued; this older run will not clear it.');
                return;
              }
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: request.pr,
                  name: 'land-queued',
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              // Ownership can change between the pre-check and removeLabel.
              // A newer source comment necessarily exists before its admission
              // can add the label, so a fresh post-remove scan can repair the
              // only harmful interleaving.
              if (await newerRequestExists({ refresh: true })) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: request.pr,
                  labels: ['land-queued'],
                });
                core.notice('A newer /land request appeared during cleanup; restored land-queued.');
              }
            };
            const requireFresh = async (message) => {
              await removeQueued();
              if (persistent) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: request.pr,
                  body: message + ' Post a fresh `/land` after the PR is ready.',
                });
              }
              core.setFailed(message);
            };

            if (persistent) {
              const markerId = Number(process.env.REQUEST_MARKER_ID);
              if (!Number.isInteger(markerId) || markerId <= 0) {
                await requireFresh('The persisted landing request marker is missing.');
                return;
              }
              let marker;
              try {
                ({ data: marker } = await github.rest.issues.getComment({
                  owner,
                  repo,
                  comment_id: markerId,
                }));
              } catch (error) {
                if (error.status !== 404) throw error;
                await requireFresh('The persisted landing request marker was deleted.');
                return;
              }
              const match = /<!-- land-request-json:(\{.*\}) -->/.exec(String(marker.body ?? ''));
              if (!match) {
                await requireFresh('The persisted landing request marker is malformed.');
                return;
              }
              const liveRequest = JSON.parse(match[1]);
              if (
                liveRequest.version !== request.version
                || liveRequest.sourceCommentId !== request.sourceCommentId
                || liveRequest.requestedHead !== request.requestedHead
                || liveRequest.requestedAt !== request.requestedAt
                || liveRequest.noIssueCheck !== request.noIssueCheck
              ) {
                core.setFailed('This queued landing was superseded by a newer /land request.');
                return;
              }

              // A newer trusted source comment or immutable bot marker revokes
              // this run even before/after a neighbouring admission job persists.
              if (await newerRequestExists()) {
                core.setFailed('This queued landing was superseded by a newer /land request.');
                return;
              }
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: request.pr,
            });
            if (pr.state !== 'open') {
              await requireFresh('PR #' + request.pr + ' is no longer open.');
              return;
            }
            if (pr.draft) {
              await requireFresh('PR #' + request.pr + ' is now a draft.');
              return;
            }
            if (pr.base.ref !== 'main') {
              await requireFresh('PR #' + request.pr + ' now targets ' + pr.base.ref + ', not main.');
              return;
            }
            if (!pr.head.repo || pr.head.repo.full_name !== owner + '/' + repo) {
              await requireFresh('PR #' + request.pr + ' no longer points at a branch in this repository.');
              return;
            }
            if (pr.head.sha !== request.requestedHead) {
              await requireFresh(
                'PR #' + request.pr + ' moved from requested head '
                + request.requestedHead.slice(0, 7) + ' to ' + pr.head.sha.slice(0, 7) + '.'
              );
              return;
            }

            core.setOutput('head_sha', request.requestedHead);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('body', pr.body ?? '');
            core.setOutput('issue_check_arg', request.noIssueCheck ? '--no-issue-check' : '');
            core.notice(
              'Landing request still pins PR #' + request.pr + ' at '
              + request.requestedHead.slice(0, 7) + '.'
            );

      # Checkout the exact head that was admitted above, not "whatever the
      # branch points at by the time checkout starts". Give it a local branch
      # name afterwards because land.mjs uses that name for issue-claim checks.
      - name: Check out requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          # A GITHUB_TOKEN credential here would silently remain in origin and
          # let the landing push with the wrong actor. The queue configures the
          # deploy key explicitly below.
          persist-credentials: false

      - name: Restore feature branch name
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          git switch -c "$HEAD_REF" "$HEAD_SHA"

      - name: Configure the landing deploy key
        shell: bash
        env:
          LAND_DEPLOY_KEY: ${{ secrets.LAND_DEPLOY_KEY }}
        run: |
          if [ -z "$LAND_DEPLOY_KEY" ]; then
            echo "::error::LAND_DEPLOY_KEY is unavailable. Create the write-enabled deploy key/secret from #351 before enabling the main ruleset."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/eldritch-land"
          printf '%s\n' "$LAND_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          git config core.sshCommand "ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject negated closing keywords in pull request body
        env:
          CHECK_PR_BODY: '1'
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: node tools/closing-keywords.mjs

      - name: Configure landing committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The deploy-key push below is deliberately NOT a GITHUB_TOKEN push.
      # GitHub therefore emits the ordinary `push` event: check.yml starts on
      # main, verdict.yml records requested/completed on refs/verdict/<sha>, and
      # janitor.yml receives the real before..after range. Do not manually
      # dispatch any of them here — that workaround was only for token-suppressed
      # pushes and would duplicate CI once the queue owns a deploy key.
      - name: Run the repository landing through its push
        id: landing
        env:
          ISSUE_CHECK_ARG: ${{ steps.pr.outputs.issue_check_arg }}
          LAND_EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
          LAND_REQUEST_PR: ${{ needs.admit.outputs.pr_number }}
          LAND_REQUEST_REPO: ${{ github.repository }}
          LAND_REQUEST_JSON: ${{ needs.admit.outputs.request_json }}
          LAND_REQUEST_MARKER_ID: ${{ needs.admit.outputs.marker_id }}
          LAND_REQUEST_PERSISTED: ${{ needs.admit.outputs.persisted }}
          LAND_GITHUB_TOKEN: ${{ github.token }}
        run: npm run land -- --from-queue --no-verdict $ISSUE_CHECK_ARG

      - name: Capture landed SHA
        id: target
        if: steps.landing.outcome == 'success'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for the normal push-triggered verdict
        id: verdict
        if: steps.landing.outcome == 'success'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: npm run --silent verdict -- "$TARGET_SHA" --wait 75

      # The landing can fail before its push; the normal push-triggered check
      # can fail after it. Always report current trunk rather than collapsing
      # those states.
      - name: Report landing result
        if: always() && steps.pr.outcome == 'success'
        uses: actions/github-script@v7
        env:
          LANDING_OUTCOME: ${{ steps.landing.outcome }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REQUEST_PERSISTED: ${{ needs.admit.outputs.persisted }}
          REQUEST_JSON: ${{ needs.admit.outputs.request_json }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = Number(process.env.REQUEST_PR);
            const { data: main } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main',
            });
            const sha = main.commit.sha;
            const landed = process.env.LANDING_OUTCOME === 'success';
            const judged = process.env.VERDICT_OUTCOME === 'success';
            const target = process.env.TARGET_SHA || '';
            const requestIsLater = (candidate, expected) => {
              const at = String(candidate.requestedAt ?? '');
              const expectedAt = String(expected.requestedAt ?? '');
              return at > expectedAt || (
                at === expectedAt
                && Number(candidate.sourceCommentId) > Number(expected.sourceCommentId)
              );
            };
            const ATTRIBUTION = /\n\n---\n_Generated by \[Claude Code\]\(https:\/\/[^)\s]*\)_$/;
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const permissionCache = new Map();
            const canLand = async (login) => {
              if (!login) return false;
              if (permissionCache.has(login)) return permissionCache.get(login);
              try {
                const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: login,
                });
                const allowed = ['admin', 'maintain', 'write'].includes(permission.data.permission);
                permissionCache.set(login, allowed);
                return allowed;
              } catch (error) {
                if (error.status === 404) {
                  permissionCache.set(login, false);
                  return false;
                }
                throw error;
              }
            };
            const hasNewerLandingRequest = async (comments, expected) => {
              for (const comment of comments ?? []) {
                const body = String(comment.body ?? '');
                if (comment.user?.login === 'github-actions[bot]') {
                  const marker = /<!-- land-request-json:(\{.*\}) -->/.exec(body);
                  if (marker) {
                    try {
                      if (requestIsLater(JSON.parse(marker[1]), expected)) return true;
                    } catch {
                      // Ignore malformed unrelated markers. The admitted marker
                      // itself was validated before this long-running step.
                    }
                  }
                }
                if (!trusted.has(comment.author_association)) continue;
                const command = body.replace(ATTRIBUTION, '');
                if (command !== '/land' && command !== '/land --no-issue-check') continue;
                if (!requestIsLater({
                  requestedAt: comment.created_at,
                  sourceCommentId: comment.id,
                }, expected)) continue;
                if (await canLand(comment.user?.login)) return true;
              }
              return false;
            };

            if (process.env.REQUEST_PERSISTED === 'true') {
              let expectedRequest;
              try {
                expectedRequest = JSON.parse(process.env.REQUEST_JSON ?? '');
              } catch {
                core.warning('Could not parse this landing request during queue-label cleanup; keeping land-queued.');
              }
              if (expectedRequest) {
                // Scan the complete append-only request history. GitHub's `since`
                // is exclusive by update time, while request ordering also uses a
                // same-second sourceCommentId tie-break.
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: number,
                  per_page: 100,
                });
                if (await hasNewerLandingRequest(comments, expectedRequest)) {
                  core.notice('A newer /land request owns land-queued; this older run will not clear it.');
                } else {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: number,
                      name: 'land-queued',
                    });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                  // Close the check/remove race: a newer /land source comment can
                  // arrive after the first scan and its admission can add the
                  // shared label before this older run removes it.
                  const afterRemoval = await github.paginate(github.rest.issues.listComments, {
                    owner,
                    repo,
                    issue_number: number,
                    per_page: 100,
                  });
                  if (await hasNewerLandingRequest(afterRemoval, expectedRequest)) {
                    await github.rest.issues.addLabels({
                      owner,
                      repo,
                      issue_number: number,
                      labels: ['land-queued'],
                    });
                    core.notice('A newer /land request appeared during cleanup; restored land-queued.');
                  }
                }
              }
            }

            const body = landed && judged
              ? `Remote landing finished green. \`main\` is now at \`${sha.slice(0, 7)}\`; \`${target.slice(0, 7)}\` received the normal post-push green verdict.`
              : landed
                ? `Remote landing pushed \`${target.slice(0, 7)}\`, but its normal push-triggered check did not return a green verdict. Current \`main\` is \`${sha.slice(0, 7)}\`. Inspect the verdict and check runs before changing code.`
                : `Remote landing stopped before it completed a push. Current \`main\` is \`${sha.slice(0, 7)}\`. Inspect this workflow's landing log before retrying.`;
            await core.summary.addRaw(body).write();
