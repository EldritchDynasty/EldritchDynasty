name: remote land

on:
  issue_comment:
    types: [created]
  workflow_call:
    inputs:
      pr_number:
        description: Pull request to land. Used by the check.yml bootstrap bridge.
        required: true
        type: number

# This workflow is deliberately the only connector-only substitute for running
# `npm run land` in a session shell. It does not recreate the landing in YAML:
# it runs the repository's own landing command on a GitHub-hosted runner.
permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  land:
    # The default Actions concurrency queue is lossy: one running + one pending,
    # and a newer request replaces the older pending one. `queue: max` keeps
    # up to 100 trusted issue-comment landings instead. The reusable bootstrap
    # deliberately gets a run-unique group: it executes the PR's proposed copy
    # of this workflow while issue comments execute the copy already on main, so
    # sharing a group would let old queue semantics cancel the new bootstrap.
    # Concurrency is evaluated before this job's `if`, so trusted exact /land
    # comments alone share the landing group. Issue-comment admission is
    # prefiltered by author_association before queueing; the API permission
    # lookup below remains authoritative. Unrelated or outsider comments get a
    # per-run group and skip without occupying it.
    #
    # A Claude Code session cannot post a bare `/land`: its GitHub proxy appends
    # an attribution footer ("\n\n---\n_Generated by [Claude Code](https://…)_")
    # to every comment. The exact-body match skipped PR #281's request in
    # silence, so both admission points also accept either command followed by
    # that footer (a trusted author is still required). The authorize step
    # strips the footer before reading the command, and anything it cannot
    # strip reads as a plain /land, never as --no-issue-check. Keep the two
    # admission lists identical.
    concurrency:
      group: >-
        ${{ (inputs.pr_number > 0
        && format('remote-land-bootstrap-{0}', github.run_id))
        || ((github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && (github.event.comment.body == '/land'
        || github.event.comment.body == '/land --no-issue-check'
        || (endsWith(github.event.comment.body, ')_')
        && (startsWith(github.event.comment.body, fromJSON('"/land\n\n---\n_Generated by [Claude Code](https://"'))
        || startsWith(github.event.comment.body, fromJSON('"/land --no-issue-check\n\n---\n_Generated by [Claude Code](https://"'))))))
        && 'remote-land-main')
        || format('remote-land-skip-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    if: >-
      (github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && (github.event.comment.body == '/land'
      || github.event.comment.body == '/land --no-issue-check'
      || (endsWith(github.event.comment.body, ')_')
      && (startsWith(github.event.comment.body, fromJSON('"/land\n\n---\n_Generated by [Claude Code](https://"'))
      || startsWith(github.event.comment.body, fromJSON('"/land --no-issue-check\n\n---\n_Generated by [Claude Code](https://"'))))))
      || inputs.pr_number > 0
    runs-on: ubuntu-latest
    # Run 36281354123 spent ~103m in the repository landing, then was killed
    # by the old 120m job cap 17m into verdict.mjs's allowed 40m wait. The job
    # budget must cover BOTH phases: a ~103m landing plus the 75m that
    # tools/dispatched-verdict.mjs waits on the dispatched check (measured at
    # 45m on 2026-09-27), plus headroom.
    timeout-minutes: 240
    env:
      REQUEST_PR: ${{ inputs.pr_number || github.event.issue.number }}

    steps:
      - name: Authorize request and resolve pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = Number(process.env.REQUEST_PR);

            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed('No pull request number was supplied.');
              return;
            }

            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.data.permission)) {
              core.setFailed(`/land requires write access; ${context.actor} has ${permission.data.permission}.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });
            if (pr.state !== 'open') {
              core.setFailed(`PR #${number} is not open.`);
              return;
            }
            if (pr.draft) {
              core.setFailed(`PR #${number} is a draft. Mark it ready before /land.`);
              return;
            }
            if (pr.base.ref !== 'main') {
              core.setFailed(`PR #${number} targets ${pr.base.ref}, not main.`);
              return;
            }
            if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed('Remote landing is restricted to branches in this repository.');
              return;
            }

            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('body', pr.body ?? '');
            // The Claude Code attribution footer the admission condition allows.
            const ATTRIBUTION = /\n\n---\n_Generated by \[Claude Code\]\(https:\/\/[^)\s]*\)_$/;
            const command = String(context.payload.comment?.body ?? '').replace(ATTRIBUTION, '');
            core.setOutput(
              'issue_check_arg',
              context.eventName === 'issue_comment'
                && command === '/land --no-issue-check'
                ? '--no-issue-check'
                : '',
            );

            core.notice(
              `Remote landing authorized for PR #${number} at ${pr.head.sha.slice(0, 7)}.`,
            );

      # Checkout the exact head that was authorized above, not "whatever the
      # branch points at by the time checkout starts". Give it a local branch
      # name afterwards because land.mjs uses that name for issue-claim checks.
      - name: Check out requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Restore feature branch name
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          git switch -c "$HEAD_REF" "$HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject negated closing keywords in pull request body
        env:
          CHECK_PR_BODY: '1'
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: node tools/closing-keywords.mjs

      - name: Configure landing committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A push made with GITHUB_TOKEN does not trigger another workflow run.
      # workflow_dispatch is GitHub's explicit exception, so let the landing do
      # everything through the compare-and-swap push, then dispatch the existing
      # check workflow and use the repository's normal verdict reader on that SHA.
      # The janitor dispatched below closes only the issues THIS landing named,
      # so it needs the range the landing added: main as it stood before, to the
      # landed SHA. Remote landings share one concurrency group, so nothing
      # else moves main between this read and the landing's own fetch unless a
      # session lands locally in that window — and that push fires the janitor
      # itself, whose closes are idempotent.
      - name: Record main before the landing
        id: before
        run: |
          git fetch --quiet origin main
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run the repository landing through its push
        id: landing
        env:
          ISSUE_CHECK_ARG: ${{ steps.pr.outputs.issue_check_arg }}
        run: npm run land -- --no-verdict $ISSUE_CHECK_ARG

      - name: Capture landed SHA
        id: target
        if: steps.landing.outcome == 'success'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch the post-push check
        id: dispatch
        if: steps.landing.outcome == 'success'
        uses: actions/github-script@v7
        env:
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            core.setOutput('at', new Date().toISOString());
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'check.yml',
              ref: 'main',
            });
            // The same token rule starves the janitor: it runs `on: push` to
            // main, a GITHUB_TOKEN push fires nothing, so a remote landing's
            // `Closes #N`, its claims and its branch waited for the daily cron.
            // GitHub itself does not close issues from a bot-token push either
            // (#266 and #267 were closed by hand). Dispatch it with what `push`
            // would have given it: a real sweep, not the manual dry run, and
            // the before..after range a push event carries. Without the range
            // janitor.mjs skips its issue-closing section entirely.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'janitor.yml',
              ref: 'main',
              inputs: { dry_run: 'false', range: `${process.env.BEFORE_SHA}..${process.env.TARGET_SHA}` },
            });

      # verdict.yml never hears about the run dispatched above: GitHub does not
      # deliver `workflow_run` for a run github-actions[bot] started, so it wrote
      # no ref and every remote landing on record reported FAILURE — #283's
      # included, with its commit green on main. This job can read Actions, so
      # it waits on the run it dispatched and writes the ref itself, in
      # verdict.yml's format; see tools/dispatched-verdict.mjs.
      - name: Record the dispatched check's verdict
        if: steps.landing.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.at }}
          WAIT_MINUTES: "75"
        run: node tools/dispatched-verdict.mjs

      - name: Wait for the normal verdict
        id: verdict
        if: steps.landing.outcome == 'success'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: npm run --silent verdict -- "$TARGET_SHA" --wait 5

      # The landing can fail before its push; the explicit check can fail after
      # the push. Always report current trunk rather than collapsing those states.
      - name: Report landing result
        if: always() && steps.pr.outcome == 'success'
        uses: actions/github-script@v7
        env:
          LANDING_OUTCOME: ${{ steps.landing.outcome }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = Number(process.env.REQUEST_PR);
            const { data: main } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main',
            });
            const sha = main.commit.sha;
            const landed = process.env.LANDING_OUTCOME === 'success';
            const judged = process.env.VERDICT_OUTCOME === 'success';
            const target = process.env.TARGET_SHA || '';
            const body = landed && judged
              ? `Remote landing finished green. \`main\` is now at \`${sha.slice(0, 7)}\`; \`${target.slice(0, 7)}\` received the normal post-push green verdict.`
              : landed
                ? `Remote landing pushed \`${target.slice(0, 7)}\`, but its explicitly dispatched post-push check did not return a green verdict. Current \`main\` is \`${sha.slice(0, 7)}\`. Inspect the verdict and check runs before changing code.`
                : `Remote landing stopped before it completed a push. Current \`main\` is \`${sha.slice(0, 7)}\`. Inspect this workflow's landing log before retrying.`;
            await core.summary.addRaw(body).write();
