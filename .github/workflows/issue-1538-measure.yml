name: temporary duration regeneration for issue 1538

# Branch-only measurement transport. Its successful generated-output commit
# removes this file, leaving only the measured catalogue and command costs.
on:
  push:
    branches: ['codex/1538-measured-durations-20261014']
    paths: ['.github/workflows/issue-1538-measure.yml']

permissions:
  contents: write

concurrency:
  group: full-duration-regeneration-1538
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run agents -- check
      - name: Regenerate official measured full-suite costs
        id: measure
        shell: bash
        run: npm run cost -- --full --write | tee "${RUNNER_TEMP}/issue-1538-cost.log"
      - name: Verify every current test has a measured duration
        id: catalogue
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { relative } from 'node:path';
          const d = JSON.parse(readFileSync('tools/test-durations.json', 'utf8'));
          assert.equal(d.measured, new Date().toISOString().slice(0, 10));
          const listed = JSON.parse(execFileSync(process.execPath,
            ['node_modules/vitest/vitest.mjs', 'list', '--filesOnly', '--json'],
            { encoding: 'utf8' }));
          const current = [...new Set(listed.map(({ file }) =>
            relative(process.cwd(), file).replaceAll('\\', '/')))].sort();
          assert.ok(current.length > 100, 'Vitest must discover the real suite');
          assert.deepEqual(Object.keys(d.files).sort(), current,
            'The generated catalogue must cover exactly the current full suite');
          for (const file of current) {
            assert.ok(Number.isFinite(d.files[file]) && d.files[file] >= 0,
              'Missing or invalid measured duration: ' + file);
          }
          assert.equal(d.totalMs, Object.values(d.files).reduce((a, b) => a + b, 0));
          const message = current.length + ' current test files measured; zero missing or obsolete entries.';
          console.log(message);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, message + '\n');
          NODE
      - name: Commit only measured outputs and remove this transport
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md tools/test-durations.json
          git diff --cached --quiet && { echo "No measured output changed"; exit 1; }
          git rm .github/workflows/issue-1538-measure.yml
          git commit -m "fix(ci): regenerate measured test durations (Closes #1538)"
      - name: Run canonical landing preflight
        shell: bash
        run: npm run land | tee "${RUNNER_TEMP}/issue-1538-land.log"
      - name: Publish measured outputs for review
        if: ${{ always() && steps.commit.outcome == 'success' }}
        env:
          ED_MEASUREMENT_HEAD: ${{ github.sha }}
        run: git push --force-with-lease=refs/heads/codex/1538-measured-durations-20261014:$ED_MEASUREMENT_HEAD origin HEAD:refs/heads/codex/1538-measured-durations-20261014
      - name: Retain measured outputs and preflight logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: issue-1538-measured-durations
          path: |
            AGENTS.md
            tools/test-durations.json
            ${{ runner.temp }}/issue-1538-cost.log
            ${{ runner.temp }}/issue-1538-land.log
          if-no-files-found: error
