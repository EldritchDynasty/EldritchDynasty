name: bearing-36-diagnostic

on:
  pull_request:
    types: [synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: bearing-36-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  density-candidate:
    name: density ${{ matrix.rate }} · ${{ matrix.years }}y · ${{ matrix.base }}+${{ matrix.step }}i
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rate: "0.55"
            years: 300
            base: 31013
            step: 37
          - rate: "0.55"
            years: 500
            base: 9001
            step: 17
          - rate: "0.60"
            years: 300
            base: 31013
            step: 37
          - rate: "0.60"
            years: 500
            base: 9001
            step: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply measurement-only density threshold
        env:
          RATE: ${{ matrix.rate }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("packages/core/src/ending.ts")
          source = path.read_text()
          needle = """function unsupportablePerRung(ctx: SimCtx): number {
            const years = campaignDef(ctx.world.campaign).years;
            return Math.max(1, Math.round(UNSUPPORTABLE_PER_RUNG * years / UNSUPPORTABLE_REFERENCE_YEARS));
          }"""
          rate = os.environ["RATE"]
          replacement = f"""function unsupportablePerRung(ctx: SimCtx): number {{
            const records = ctx.world.chronicle.filter((entry) =>
              entry.record === 'record' || entry.record === 'embellish').length;
            return Math.max(1, Math.ceil(records * {rate}));
          }}"""
          if needle not in source:
              raise SystemExit("ending.ts threshold function no longer matches diagnostic patch")
          path.write_text(source.replace(needle, replacement))
          PY
      - name: Measure failing historical schedule
        run: npm run gate:bearing -- 80 ${{ matrix.years }} ${{ matrix.base }} ${{ matrix.step }}
