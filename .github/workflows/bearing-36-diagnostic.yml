name: bearing-36-diagnostic

on:
  pull_request:
    types: [synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: bearing-36-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  god-book:
    name: inspect God seed 5121
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Measure the known God-reaching book
        run: |
          npx tsx --tsconfig tsconfig.base.json -e "
            import { loadContent } from '@ed/content';
            import { playToTheEnd } from './packages/core/src/tools/ending-gate.ts';
            const r = playToTheEnd(loadContent(), 5121, 500, 'ascendant', 'long');
            console.log(JSON.stringify({
              seed: r.seed,
              ending: r.ending,
              attested: r.attested,
              substantiated: r.substantiated,
              rungsWithheld: r.rungsWithheld,
              unsupportable: r.unsupportable,
              pages: r.pages,
              records: r.records,
              debtPerRecord: (r.unsupportable ?? 0) / Math.max(1, r.records ?? 0)
            }, null, 2));
          "
