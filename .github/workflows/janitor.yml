name: janitor

# The sweep itself is `tools/janitor.mjs`, because a script can be read and run
# and a YAML step cannot: `DRY_RUN=1 node tools/janitor.mjs` prints every action
# it would take against whatever remote you point it at, and performs none of
# them. Node rather than bash so that the dry run works from a Windows checkout
# as well as this runner — a command that deletes things should be rehearsable
# from every machine that has to trust it.
#
# It is a workflow at all only because agents physically cannot do this part —
# a Claude session's git proxy refuses ref deletion, 403, every time.

# The first real run deleted 36 of 37 branches and was RIGHT: nobody had ever
# been able to delete a merged branch here. What was wrong was the dry run used
# to predict it, which ran in an agent container — a shallow clone, where
# ancestry silently answers false. `tools/janitor.mjs` refuses to run on one now,
# and `janitor.test.ts` clones a shallow repo to prove the refusal.
#
# fetch-depth: 0 below is therefore load-bearing, not hygiene.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 19 * * *'   # 19:17 UTC — early morning in Auckland, either side
                            # of daylight saving. For claims whose session died.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Decide and report, delete nothing'
        type: boolean
        default: true
      max_share:
        description: 'Pause if more than this % of branches read as merged'
        type: string
        default: '60'

permissions:
  contents: write       # delete merged branches and spent claim refs
  issues: write         # close an issue a landing commit / merged PR named
  pull-requests: read   # recover PR bodies for native merge-queue landings

concurrency:
  group: janitor
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ancestry is the whole test; a shallow clone cannot answer it

      - name: sweep
        env:
          GH_TOKEN: ${{ github.token }}
          JANITOR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          JANITOR_RECONCILE_MERGED_PRS: '1'
          # A dispatch is dry unless somebody deliberately says otherwise. The
          # default is the safe one because the unsafe one has already cost 29
          # branches once.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == false && '0' || '1') || '0' }}
          JANITOR_MAX_SHARE: ${{ inputs.max_share || '60' }}
          # A real main push carries the exact range whose closing keywords
          # janitor should honor. Native merge queue produces that ordinary push;
          # manual dispatch remains a sweep/dry-run tool and never invents a
          # landing range. A first push reports 000… for `before`.
          JANITOR_RANGE: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha) || '' }}
        run: node tools/janitor.mjs
