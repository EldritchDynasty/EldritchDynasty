apply plugin: 'com.android.application'

def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

def githubRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def githubRunAttempt = System.getenv('GITHUB_RUN_ATTEMPT') ?: '1'
def versionCodeAttemptStride = 100L
def androidVersionCode = 1

if (githubRunNumber) {
    def runNumber = githubRunNumber.toLong()
    def runAttempt = githubRunAttempt.toLong()
    if (runNumber < 1L) throw new GradleException('GITHUB_RUN_NUMBER must be positive')
    if (runAttempt < 1L || runAttempt >= versionCodeAttemptStride) {
        throw new GradleException(
            "GITHUB_RUN_ATTEMPT must be between 1 and ${versionCodeAttemptStride - 1}"
        )
    }
    def computedVersionCode = runNumber * versionCodeAttemptStride + runAttempt
    // Android/Play caps versionCode at 2,100,000,000.
    if (computedVersionCode > 2100000000L) {
        throw new GradleException("Computed Android versionCode ${computedVersionCode} exceeds Play's limit")
    }
    androidVersionCode = computedVersionCode.toInteger()
}

def releaseName = System.getenv('GITHUB_REF_NAME') ?: '0.1.0'

android {
    namespace = "nz.eldritchdynasty.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "nz.eldritchdynasty.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersionCode
        versionName releaseName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (!signing.isEmpty()) {
                storeFile rootProject.file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (!signing.isEmpty()) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// #601: write the version identity from the same Gradle configuration as the
// actual bundle. The proof script never re-derives versionCode from CI variables.
tasks.register('writeReleaseProofMetadata') {
    dependsOn 'bundleRelease'
    doLast {
        def output = layout.buildDirectory.file('outputs/bundle/release/release-metadata.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            bundle: 'app-release.aab',
            versionCode: androidVersionCode,
            versionName: releaseName
        ])) + '\n'
    }
}
