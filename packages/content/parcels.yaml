# THE 1042 ENDOWMENT (issue #93, Phase A of #91).
#
# World §5: "The house holds roughly 1,400 acres: eleven tenant farms, a mill
# on the Wend, woodland, and the common where the village grazes." World §12
# adds the home demesne — the ground the hall works for its own table, let to
# nobody. Fifteen parcels, and every one carries a `place` this world already
# has (world §5's near country) and a `provenance` sentence, per issue #91's
# first design commitment: not a number with a name, a name with a number.
#
# `baseYield` is calibrated, not estimated: the fifteen sum to exactly 140,
# and `core/src/land.ts`'s `landIncome` scales that sum by
# `INCOME_BY_RESPECT[tier] / 140` — so at every Respect tier, holding exactly
# this endowment returns exactly what the old lookup did. `npm run digest`
# is the proof; see `land.ts` for the arithmetic. Buying, selling or losing a
# parcel (issue #91, Phase B on) is the first thing that can ever move it.
parcels:
  - id: hallowfield
    name: Hallowfield
    kind: tenant_farm
    acres: 110
    baseYield: 8
    place: the water-meadow below the mill
    provenance: The oldest holding on the roll, farmed by the same family for longer than anyone has bothered to write down.

  - id: nettlecombe
    name: Nettlecombe
    kind: tenant_farm
    acres: 95
    baseYield: 7
    place: the slope above the Wend
    provenance: Good barley ground, and the reeve's own favourite to walk when he wants a quiet argument.

  - id: longmere
    name: Longmere
    kind: tenant_farm
    acres: 130
    baseYield: 8
    place: along the old mere, drained a century back
    provenance: Still called the mere by everyone who works it, though the water went out of it two generations ago.

  - id: ashcroft
    name: Ashcroft
    kind: tenant_farm
    acres: 70
    baseYield: 6
    place: the near side of Ardwen wood
    provenance: The smallest farm on the roll, and it has never once been late with the rent.

  - id: redmoor
    name: Redmoor
    kind: tenant_farm
    acres: 105
    baseYield: 7
    place: the heath edge toward Wick
    provenance: Thin soil and a tenant family stubborn enough to make it pay anyway.

  - id: foxwell
    name: Foxwell
    kind: tenant_farm
    acres: 80
    baseYield: 7
    place: the spring line north of the hall
    provenance: Named for the well, which is named for what got into it one bad winter.

  - id: stonegate
    name: Stonegate
    kind: tenant_farm
    acres: 100
    baseYield: 7
    place: the gravel spur toward Bramme
    provenance: The gate is older than the farm; nobody now living remembers what it used to close off.

  - id: wetherby
    name: Wetherby
    kind: tenant_farm
    acres: 85
    baseYield: 7
    place: the low pasture by the common
    provenance: Sheep country, and the wool pays the rent twice a year like clockwork.

  - id: barrowfield
    name: Barrowfield
    kind: tenant_farm
    acres: 90
    baseYield: 7
    place: the rise east of the hall
    provenance: There is a barrow in the corner of it nobody ploughs near, on the theory that it is safer not to ask.

  - id: coldharbour
    name: Coldharbour
    kind: tenant_farm
    acres: 60
    baseYield: 8
    place: the sheltered bend of the Wend
    provenance: Small and cold-named, and the best hay ground the house has.

  - id: thornfield
    name: Thornfield
    kind: tenant_farm
    acres: 100
    baseYield: 8
    place: the hedge country toward the smaller house
    provenance: Split from the cadet hall's own ground by a hedge line the two families have quietly argued about for three generations.

  - id: the_wend_mill
    name: The Wend Mill
    kind: mill
    acres: 20
    baseYield: 25
    place: the millpond bend of the Wend, below Ardwen
    provenance: Takes its toll in flour off every sack ground in the Nethering, which is most of them.

  - id: ardwen_wood
    name: Ardwen Wood
    kind: woodland
    acres: 250
    baseYield: 10
    place: the rise behind the hall
    provenance: Timber sells badly this far from a road worth the name; the pannage for the village pigs is worth more most years.

  - id: wick_common
    name: Wick Common
    kind: common
    acres: 100
    baseYield: 5
    place: between the hall and the village
    provenance: Grazing rights the village has held since before anyone signed anything, and the reason Wick tolerates the house at all.

  - id: the_home_demesne
    name: The Home Demesne
    kind: demesne
    acres: 30
    baseYield: 20
    place: the ground the hall itself stands on
    provenance: Worked directly for the house's own table, and let to nobody.

  # NOT PART OF THE 1042 ENDOWMENT (issue #94, Phase B). Neighbouring ground
  # the house does not hold — `foundingHolding: false`, so `createWorld` seeds
  # no `ParcelState` for these. They exist only to be the market's pool:
  # `tickLandMarket` (core/src/land.ts) may put one up when a neighbour is
  # short before Michaelmas or at the Bramme fairs (world §5), and it is gone
  # if the house does not take it.

  - id: sowerhay
    name: Sowerhay
    kind: tenant_farm
    acres: 90
    baseYield: 7
    place: across the Wend from Nettlecombe
    provenance: Held by the Colcocks for three generations, and the eldest has no son who wants it.
    foundingHolding: false
    marketable: false

  - id: cradlemoor
    name: Cradlemoor
    kind: tenant_farm
    acres: 75
    baseYield: 6
    place: the boggy ground toward Wick common
    provenance: Wants draining worse than any farm on the roll, which is why it keeps changing hands.
    foundingHolding: false
    # NOT on the ordinary market (issue #91, Stage H): `cradlemoor_wants_draining`
    # (events/arc_cradlemoor.yaml) is the one route onto this parcel, and the
    # scene IS the commitment to drain it — buying it plain off the fair, with
    # no plan for the ground, was never really the story this holding tells.
    # Measured before ruling it out: with `marketable` left at its default true,
    # `land-gate.ts`'s buy-every-affordable-lot policy took Cradlemoor off the
    # open market almost every run, long before the trigger event's own weight
    # ever drew — 2 of 40 runs against gate:land's 25% floor.
    marketable: false

  - id: westerholt
    name: Westerholt
    kind: tenant_farm
    acres: 100
    baseYield: 8
    place: the far side of Ardwen wood
    provenance: A younger son's portion, cut loose whenever the family that holds it needs the coin more than the ground.
    foundingHolding: false

  - id: the_hanging_field
    name: The Hanging Field
    kind: tenant_farm
    acres: 65
    baseYield: 6
    place: the steep ground above Redmoor
    provenance: Named for the angle of it, not for anything that happened there — though every stranger asks.
    foundingHolding: false

  # PHASE E (#100): four businesses that are not farms with grander numbers.
  # Their kind is their risk rule in core/land.ts. The stated yields are
  # multipliers over baseYield: Hesk 2.6, Sarrow 3.4, Bramme 0, Lag 0.7.

  - id: hesk_slate_work
    name: A Share in the Hesk Slate Work
    kind: slate_work
    acres: 18
    baseYield: 5
    marketPrice: 120
    place: the slate village at Hesk
    provenance: A roof is dear after every hard winter; the work is idle when nobody can afford one, and half the village bears the same six surnames.
    foundingHolding: false

  - id: sarrow_bottom
    name: A Bottom out of Sarrow
    kind: sarrow_bottom
    acres: 1
    baseYield: 5
    marketPrice: 130
    place: a counting room and share of one hull at Sarrow
    provenance: The Grey takes ships without argument. The same road brings Anvarine books ashore, which is why men keep paying to try it.
    foundingHolding: false

  - id: bramme_house
    name: The House in Bramme
    kind: town_house
    acres: 1
    baseYield: 0
    marketPrice: 180
    place: inside Bramme's north gate
    provenance: It pays no rent. It gives the family a door near the assize and somewhere respectable to be seen waiting.
    foundingHolding: false

  - id: lag_eels_and_peat
    name: Eels and Peat in the Lag
    kind: wetland
    acres: 45
    baseYield: 5
    marketPrice: 42
    place: the Lag beyond the Warden's last certain marker
    provenance: Cheap ground, if it is ground, and not quite the Warden's either. The smell reaches Bramme before the profit does.
    foundingHolding: false

  # STAGE G (issue #91): the three acquisition routes #91 catalogued and the
  # engine never got — foreclosure, escheat, encroachment. All three are
  # `tenant_farm`, per `parcels/wiring`: only that kind may repeat, and none
  # of the three is a unique risk shape the way the mill or the common are.
  # `marketable: false` because none of them is bought at the ordinary fairs
  # — the deed is the outcome of one specific event, or it is nobody's.

  - id: pikeworth
    name: Pikeworth
    kind: tenant_farm
    acres: 55
    baseYield: 5
    place: a smallholding on the Bramme road
    provenance: Taken for a debt the Pike family could not otherwise pay, and no deed of sale anywhere in the house's papers.
    foundingHolding: false
    marketable: false

  - id: farrowmere
    name: Farrowmere
    kind: tenant_farm
    acres: 95
    baseYield: 7
    place: beyond Coldharbour, toward the Warden's road
    provenance: The Farrow line ended in a single bad winter, three deaths and no sons, and the Warden's clerk wrote the reassignment before the frost was out of the ground.
    foundingHolding: false
    marketable: false

  - id: the_farthing
    name: The Farthing
    kind: tenant_farm
    acres: 20
    baseYield: 2
    place: the near corner of Wick Common, against the boundary stone
    provenance: Ground the common never quite needed and the house never quite asked for, until one year the boundary stone simply did not go back.
    foundingHolding: false
    marketable: false

