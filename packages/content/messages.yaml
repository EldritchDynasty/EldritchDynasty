  - address: "core:messages#age_strategy.the_plague.0"
    of: "328aa8e5c453d3e9"
    plainenglish: >-
      fertile lines with children who have grown up are especially attractive
  - address: "core:messages#age_strategy.the_plague.1"
    of: "35b0ce8f1309ccbb"
    plainenglish: >-
      ordination costs less while deaths threaten the household
  - address: "core:messages#ambition.name.deepen_blood"
    of: "48a1caeb632eb017"
    plainenglish: >-
      Strengthen the bloodline
  - address: "core:messages#ambition.purpose.deepen_blood"
    of: "9ef012af7a1b0ea3"
    plainenglish: >-
      Keep the living bloodline broad so it does not die out.
  - address: "core:messages#ambition.name.raise_ascendant"
    of: "747afe673e443333"
    plainenglish: >-
      Prepare for Ascension
  - address: "core:messages#ambition.purpose.raise_ascendant"
    of: "bda83301d8a74055"
    plainenglish: >-
      Prepare a named line for the next major Ascension rung.
  - address: "core:messages#ambition.name.restore_ledger"
    of: "dba7b6534719d86f"
    plainenglish: >-
      Recover the Ledger
  - address: "core:messages#ambition.purpose.restore_ledger"
    of: "587423e7b04fd42b"
    plainenglish: >-
      Recover the clauses still available in this campaign.
  - address: "core:messages#ambition.name.secure_branches"
    of: "9aa0e525c9795ab9"
    plainenglish: >-
      Protect the branches
  - address: "core:messages#ambition.purpose.secure_branches"
