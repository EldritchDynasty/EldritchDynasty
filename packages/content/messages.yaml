# Plain English counterparts for the engine's own lines (#1010, #415).
#
# A content counterpart lives beside the Original it answers. A core line's
# Original is a `msg(ctx, key, original)` call in packages/core/src, which has
# no YAML file to sit beside, so every `core:messages#<key>` row lives here and
# assembly refuses one filed anywhere else.
#
# `of` is the fingerprint of the msg() Original this row was reviewed against.
# Reword the Original and the row goes stale: the game shows the Original again
# and packages/core/src/prose.test.ts names the key to re-review.
# The same test fails on a key no msg() call carries, and on a lost {TOKEN}.
#
# Plain English does not use either prose skill. Keep every fact, name, number
# and consequence; make only the sentences simpler.

proseVariants:
  - address: "core:messages#table.order.study.ineligible"
    of: "091a008e4080425a"
    plainenglish: "They cannot learn this book."
  - address: "core:messages#assize.the_assessors_call"
    of: "d6f23d20745bd8c4"
    plainenglish: >-
      Assessors came and counted the roof, the glass and the horses. They valued the house at a figure, and nobody argued with it out loud.
  - address: "core:messages#assize.the_price_of_your_name"
    of: "048b0bfb38de8e87"
    plainenglish: >-
      The house paid half a mark more for grain than the village did. The factor said he was very sorry, and did not lower the price.
  - address: "core:messages#assize.the_rivals_combine"
    of: "ad094b099d17aa8d"
    plainenglish: >-
      Word went round the auction rooms that no house would bid against another while the Eldritch name was on a lot. Nobody wrote this down.
  - address: "core:messages#assize.a_retainer_courted_away"
    of: "3866453aa8858186"
    plainenglish: >-
      Someone made the steward an offer, in a room the house does not own. He thought about it for a week, then said no.
  - address: "core:messages#assize.the_church_asks_after_the_book"
    of: "85f881eeff693192"
    plainenglish: >-
      A clerk of the Nine Quiet Names politely asked to compare the house's account of one year with three other accounts he had already read.
  - address: "core:messages#assize.a_ward_is_requested"
    of: "eec1e5747c9d2950"
    plainenglish: >-
      The house was asked to take a ward. It was the kind of request where a refusal is exactly what is being watched.
  - address: "core:messages#assize.an_older_claim"
    of: "8140f82e433dabc2"
    plainenglish: >-
      A neighbouring house brought out a document about a boundary. It was dated earlier than the house had thought any document could be.
  - address: "core:messages#assize.the_levy_falls_here"
    of: "d349bcec94bc4570"
    plainenglish: >-
      The levy was raised across the whole valley, and the house paid at a rate the rest of the valley thought was fair.
  - address: "core:messages#assize.the_church_opens_its_hand"
    of: "b300d54009c3c584"
    plainenglish: >-
      The chapter house sent grain and a cart. It did not call this charity, and it did not need to.
  - address: "core:messages#assize.the_tithe_forgiven"
    of: "04fa7075bc7fa231"
    plainenglish: >-
      The branches were told to keep their tithe this year. Nobody pretended it was generosity. There was nothing at the seat to send it to.
  - address: "core:messages#assize.an_old_friend_remembers"
    of: "55dd3788d5f47d1c"
    plainenglish: >-
      A debt the house had stopped keeping track of was paid back in full, by a man whose father had borrowed it.
  - address: "core:messages#assize.the_physician_stays"
    of: "59a191faa1093f4e"
    plainenglish: >-
      The physician took a room at the house for the season and then stayed on. Physicians do that where they are needed, even when they are paid late.
  - address: "core:messages#assize.a_cheap_hand"
    of: "0d91f769da698f35"
    plainenglish: >-
      The marriage market suddenly acted as if it had always liked the house, and as if its terms had always been easy to bargain over.
  - address: "core:messages#assize.a_book_at_the_gate"
    of: "0710d675fd8bc1b9"
    plainenglish: >-
      Someone left a book at the gate. It was wrapped in oilcloth, with no name on it and no note inside.
  - address: "core:messages#assize.kin_come_home"
    of: "586e80d9244ee56d"
    plainenglish: >-
      Cousins who had not written in forty years wrote, and then came. The house fed them without asking what they wanted.
  - address: "core:messages#succession.uncertain.single"
    of: "424166c07c058514"
    plainenglish: >-
      {PERSON} has not awakened yet, so the house does not know what the blood will show.
  - address: "core:messages#succession.uncertain.plural"
    of: "1b25e79884d08d4c"
    plainenglish: >-
      {PEOPLE} have not awakened yet, so the house does not know what the blood will show.
  - address: "core:messages#succession.namesake.text"
    of: "fabd115041e624dc"
    plainenglish: >-
      The house had a {NAME} before, and everyone who deals with the house remembers what that name was worth. They will expect the same again, and they will judge any difference harshly.
  - address: "core:messages#succession.regency.text"
    of: "ba61ffa0c7462524"
    plainenglish: >-
      No son of the house awakened, so {PERSON} held the house. She held it well, but she could not move it forward at all.
  - address: "core:messages#succession.majority.text"
    of: "8d15ecec7b270e18"
    plainenglish: >-
      {PERSON} turned sixteen this year. The Warden's clerk rode out to give back the keys {PRONOUN} had never yet held.
  - address: "core:messages#succession.wardship.title"
    of: "32b48c11ddc46fa5"
    plainenglish: >-
      The Warden takes over the estate
  - address: "core:messages#succession.wardship.text"
    of: "771bd97d7ebce271"
    plainenglish: >-
      {PERSON} is not yet sixteen. By the Warden's right, Cawdry now manages the estate until {PRONOUN} comes of age, or until the house pays to buy the wardship back.
  - address: "core:messages#wardship.refuse.bought_back"
    of: "f2ff66e6d43fe0aa"
    plainenglish: >-
      the wardship has already been bought back
  - address: "core:messages#wardship.refuse.cost"
    of: "d29a36c510d03429"
    plainenglish: >-
      the house cannot afford to buy back the wardship
  - address: "core:messages#succession.buyback.text"
    of: "cc8ed6e27dc6f85e"
    plainenglish: >-
      The house paid the Warden's clerk, and he stopped taking the harvest. {PERSON} is still not the Head, which has to wait until sixteen, but the land belongs to the house again.
  - address: "core:messages#succession.buyback.without_ward"
    of: "5a64573d68a14bd9"
    plainenglish: >-
      The house paid the Warden's clerk, and he stopped taking the harvest.
  - address: "core:messages#service.unpaid"
    of: "004a072384ecce57"
    plainenglish: >-
      {PERSON} was not kept on, because the house could not pay this quarter's wages.
  - address: "core:messages#service.destitute"
    of: "48407e94ad2f3e38"
    plainenglish: >-
      {PERSON} left the house, because there was nothing left to pay them with.
  - address: "core:messages#service.freed"
    of: "7bd8fb7ef6508d9a"
    plainenglish: >-
      {PERSON} was freed by the will of the person who hired them, and owed nothing.
  - address: "core:messages#service.employer_died"
    of: "130b331f7719be7b"
    plainenglish: >-
      {PERSON} was released from service, because the person who hired them died some years ago.
  - address: "core:messages#service.inherited_post"
    of: "47e1ce321d7c28ce"
    plainenglish: >-
      {HEIR} took over {LAST}'s post. That post had been in their family almost as long as the house had held the seal.
  - address: "core:messages#service.wanderer_unannounced"
    of: "cfddc043a9c3f6ef"
    plainenglish: >-
      {PERSON} arrived, though nobody had sent for them.
  - address: "core:messages#passage.birth.daughter.named"
    of: "1d45d34983a367f5"
    plainenglish: >-
      {MOTHER} had a daughter.
  - address: "core:messages#passage.birth.son.named"
    of: "87543aa9145a22a5"
    plainenglish: >-
      {MOTHER} had a son.
  - address: "core:messages#passage.birth.daughter.unknown"
    of: "f37896530b1ec307"
    plainenglish: >-
      A daughter was born.
  - address: "core:messages#passage.birth.son.unknown"
    of: "85fc2733e8191f97"
    plainenglish: >-
      A son was born.
  - address: "core:messages#adviser.cares.mother"
    of: "82b6b7b65b3e6e9a"
    plainenglish: >-
      her child will have to live with this agreement
  - address: "core:messages#adviser.cares.midwife"
    of: "2a4a61c0d6b0f84c"
    plainenglish: >-
      {SUBJECT} has seen this house count births, deaths and children who grew up
  - address: "core:messages#adviser.cares.former_head"
    of: "8f1cdf0bdab35647"
    plainenglish: >-
      {SUBJECT} has been Head before
  - address: "core:messages#adviser.cares.regent"
    of: "51066feb9c4637cf"
    plainenglish: >-
      she is Head because the house has no awakened son who can lead it
  - address: "core:messages#adviser.cares.head_widow"
    of: "e179619c92cf1d88"
    plainenglish: >-
      her husband was Head, and she saw what that cost the household
  - address: "core:messages#adviser.cares.priest"
    of: "6d1b90eaaa47fee6"
    plainenglish: >-
      {SUBJECT} serves the Church
  - address: "core:messages#adviser.cares.broker"
    of: "f37379d269c308a6"
    plainenglish: >-
      {POSSESSIVE} job depends on agreements, reputation and other houses
  - address: "core:messages#adviser.cares.steward"
    of: "b3d47679fc68f02d"
    plainenglish: >-
      {SUBJECT} manages the house and its accounts
  - address: "core:messages#adviser.cares.soldier"
    of: "7eb9b58c674d37f8"
    plainenglish: >-
      {POSSESSIVE} work measures risk in lives
  - address: "core:messages#adviser.cares.reader"
    of: "712f63a150ce3a1d"
    plainenglish: >-
      {SUBJECT} depends on what can be read, remembered and proved
  - address: "core:messages#adviser.cares.kin"
    of: "1b3dc9041c9ed700"
    plainenglish: >-
      this is {POSSESSIVE} own living family
  - address: "core:messages#adviser.match.none"
    of: "a790ae39d1725dcd"
    plainenglish: >-
      The house can no longer make any of these marriages.
  - address: "core:messages#adviser.match.dowry"
    of: "36de5676035cdef2"
    plainenglish: >-
      I would choose {NAME}. The account book can prove the dowry's value today.
  - address: "core:messages#adviser.match.record"
    of: "3a120b7189cb77a5"
    plainenglish: >-
      I would choose {NAME}. That line has more written records and witnesses than the others.
  - address: "core:messages#adviser.match.distance"
    of: "940bd39aa4a7d2e6"
    plainenglish: >-
      I would choose {NAME}. The family papers say these two lines are the least closely related of the
      matches offered.
  - address: "core:messages#adviser.match.witnesses"
    of: "07bd5d9f222a6803"
    plainenglish: >-
      I would choose {NAME}. I trust the evidence of the lives we have actually observed in that line.
  - address: "core:messages#adviser.match.age"
    of: "ed6729fd2cb1d479"
    plainenglish: >-
      I would choose {NAME}. That person is closest to my child's age. I am thinking about their years
      together after the agreement.
  - address: "core:messages#adviser.match.births"
    of: "c9bebcc26b431d1e"
    plainenglish: >-
      I would choose {NAME}. That line has the strongest birth history we have witnessed. I trust the
      lives we have counted more than a marriage broker's description.
  - address: "core:messages#adviser.match.kin"
    of: "5e122eed3f567e99"
    plainenglish: >-
      I would choose {NAME}. The papers show that line is closest to our blood. I admit that affects my
      advice.
  - address: "core:messages#adviser.record.honest"
    of: "5bb65a600ed53d2c"
    plainenglish: >-
      Write what happened. I value a page we can trust later more than one that looks better now.
  - address: "core:messages#adviser.record.embellish"
    of: "ce050aba6c5e3d9e"
    plainenglish: >-
      Make it sound better. Other houses act on our reputation, not the private truth behind it.
  - address: "core:messages#adviser.record.omit"
    of: "d960fd9c86270ad0"
    plainenglish: >-
      Leave it out. Another institution may read this book one day. It need not contain every true thing.
  - address: "core:messages#adviser.record.plain"
    of: "25f9d8ed7d741d69"
    plainenglish: >-
      Write it clearly. I want the house to remember the choice it made.
  - address: "core:messages#adviser.record.fallback"
    of: "144d821e53ebe11a"
    plainenglish: >-
      Choose the chronicler's least boastful account.
  - address: "core:messages#adviser.choice.none"
    of: "0496c63c19e92380"
    plainenglish: >-
      I see no option on this page that the house can take.
  - address: "core:messages#adviser.rite.priest"
    of: "51ac5a2775057993"
    plainenglish: >-
      I would choose “{LABEL}”. Being careful with a rite does not mean we know nothing. Caution is the
      only part we control.
  - address: "core:messages#adviser.rite.reader"
    of: "76c898e713c2b47b"
    plainenglish: >-
      I would choose “{LABEL}”. I am considering the words and earlier examples we have, not guessing what
      the rite secretly does.
  - address: "core:messages#adviser.choice.steward"
    of: "39dfda16da5cef6a"
    plainenglish: >-
      I prefer “{LABEL}”. I can defend that choice using what we know now.
  - address: "core:messages#adviser.choice.reader"
    of: "4b6d9bb39a5cf6e7"
    plainenglish: >-
      I prefer “{LABEL}”. Its written argument is the one I would want kept in the book.
  - address: "core:messages#adviser.choice.interest"
    of: "233c443037e741fc"
    plainenglish: >-
      I prefer “{LABEL}”. That serves my own interests. I know only what this page tells us.
  - address: "core:messages#adviser.help.reader.chronicle"
    of: "6ae9c5f9bce04205"
    plainenglish: >-
      I would read a page together with the pages around it. One sentence alone tells little of the
      history.
  - address: "core:messages#adviser.help.reader.tree"
    of: "753acda01326ff14"
    plainenglish: >-
      I would start with one person. Read the family tree one branch at a time.
  - address: "core:messages#adviser.help.reader.grievance"
    of: "10a6106f9c9de82b"
    plainenglish: >-
      I would look at who lives in this hall before reading its grievance. People are behind the quarrel.
  - address: "core:messages#adviser.help.reader.quiet"
    of: "9cc2a58ad23f28ce"
    plainenglish: >-
      I would start with the people who live in this hall. A quiet branch still matters.
  - address: "core:messages#adviser.help.head.chronicle"
    of: "576392a723f0006b"
    plainenglish: >-
      Start with the page about the act you care about. Then read what happened in response.
  - address: "core:messages#adviser.help.head.tree"
    of: "9dd59409f8609ae5"
    plainenglish: >-
      Find the person most relevant to your question. You can read the rest of the line later.
  - address: "core:messages#adviser.help.head.grievance"
    of: "e28eeee460df9e78"
    plainenglish: >-
      This hall has an unsettled quarrel. I would look at who is involved before reading its grievance.
  - address: "core:messages#adviser.help.head.quiet"
    of: "8af31caf254ce3eb"
    plainenglish: >-
      This hall is quiet for now. I would still learn who lives there.
  - address: "core:messages#adviser.help.kin.tree"
    of: "443c38d878084204"
    plainenglish: >-
      Start with one of the family. Follow their relatives instead of reading the whole hall at once.
  - address: "core:messages#adviser.help.kin.chronicle"
    of: "14b9fda2d6fb362e"
    plainenglish: >-
      Start with the page closest to the person you care about. Then read the pages before and after it.
  - address: "core:messages#adviser.help.kin.grievance"
    of: "cd780fe54c0f4e91"
    plainenglish: >-
      This hall has an unresolved matter. Read about its family before reading the grievance.
  - address: "core:messages#adviser.help.kin.quiet"
    of: "8e9b462dba402a19"
    plainenglish: >-
      Start with the family in this hall. There is more to the branch than its grievance.
  - address: "core:messages#adviser.help.steward.grievance"
    of: "95838721bdd769d5"
    plainenglish: >-
      I would look at who lives in this hall before reading its grievance. The account is easier to
      understand alongside the household.
  - address: "core:messages#adviser.help.steward.quiet"
    of: "17cd33f2f250344e"
    plainenglish: >-
      I would start with the people living here. No recorded grievance does not mean nobody lives in the
      hall.
  - address: "core:messages#adviser.help.steward.chronicle"
    of: "defb9a15ea163b51"
    plainenglish: >-
      Read the page together with what happened next. A record matters when someone later acts on it.
  - address: "core:messages#adviser.help.steward.tree"
    of: "2b46047df3e076a9"
    plainenglish: >-
      Start with one person and one hall. The whole house is too much to assess at once.
  - address: "core:messages#adviser.help.priest.chronicle"
    of: "fc90e708c2460464"
    plainenglish: >-
      Read one page at a time. Remember that a person wrote it, just as people wrote the rest of the book.
  - address: "core:messages#adviser.help.priest.tree"
    of: "841091eeba19a4ca"
    plainenglish: >-
      Start with one person and follow their relatives before judging the whole house.
  - address: "core:messages#adviser.help.priest.grievance"
    of: "e3359dfb1dfba6f7"
    plainenglish: >-
      Read about the people in this hall first. A grievance tells little without knowing who is involved.
  - address: "core:messages#adviser.help.priest.quiet"
    of: "902e5e9c99fd23b0"
    plainenglish: >-
      First look at who lives here. The hall matters even when it has no active quarrel.
  - address: "core:messages#adviser.help.rule.tree"
    of: "29ff3daf99a62af3"
    plainenglish: >-
      The tree shows living family members as the house records them. Read about the dead in the Chronicle
      and former Heads in the seal's line.
  - address: "core:messages#adviser.help.rule.chronicle"
    of: "6ca0173d761029c9"
    plainenglish: >-
      The Chronicle contains what this house chose to record. It is not an independent account. Mistakes
      and boasts can remain on its pages.
  - address: "core:messages#adviser.help.rule.branches"
    of: "3637a6da5cc56406"
    plainenglish: >-
      A cadet hall is part of this house. Its grievance is recorded separately because it affects that
      branch, not all halls equally.
  - address: "core:messages#adviser.help.control.tree"
    of: "0cb53ba71c981fd3"
    plainenglish: >-
      Use Find somebody by name, select a hall, or choose Only this branch. Open the seal's line to see
      former Heads.
  - address: "core:messages#adviser.help.control.chronicle"
    of: "b0e62b739b2723a7"
    plainenglish: >-
      Select Read it whole. Follow a page's links to earlier or later pages before judging its account.
  - address: "core:messages#adviser.help.control.branches"
    of: "50023605580fae39"
    plainenglish: >-
      Open the Table to respond to a quarrel. Endow gives land to a cadet hall. Scion changes whom the
      house focuses its effort on.
  - address: "core:messages#age.missed_clause"
    of: "654578593c5f60fd"
    plainenglish: >-
      The Age ended. The book recorded nothing further it may have revealed about the debt.
  - address: "core:messages#age_strategy.the_long_peace.0"
    of: "caa6be1c8a1fbb60"
    plainenglish: >-
      large families with well-supported records make valuable marriage partners
  - address: "core:messages#age_strategy.the_long_peace.1"
    of: "5b93261983c80cd5"
    plainenglish: >-
      the house can obtain commercial posts more cheaply
  - address: "core:messages#age_strategy.the_wars.0"
    of: "497a5df2f6f42e4e"
    plainenglish: >-
      surviving lines with proven records matter more than keeping blood concentrated
  - address: "core:messages#age_strategy.the_wars.1"
    of: "56052b48d9ba7904"
    plainenglish: >-
      the house can buy military commissions more cheaply
  - address: "core:messages#age_strategy.the_crusade.0"
    of: "89674573bc9f0d17"
    plainenglish: >-
      marrying a house already known to the institutions is safer
  - address: "core:messages#age_strategy.the_crusade.1"
    of: "36788029c7c96c9d"
    plainenglish: >-
      the chronicler is more likely to omit dangerous truths
  - address: "core:messages#age_strategy.the_insurrection.0"
    of: "4c28be8bcbab47bf"
    plainenglish: >-
      alliances and public reputation matter more when choosing marriages
  - address: "core:messages#age_strategy.the_insurrection.1"
    of: "f87831a4edb10cf8"
    plainenglish: >-
      advocate posts cost less while old claims are being challenged
  - address: "core:messages#age_strategy.the_withering.0"
    of: "5ea8cf3c40887778"
    plainenglish: >-
      known bloodlines matter more as the gift becomes less common
  - address: "core:messages#age_strategy.the_withering.1"
    of: "e3ca0c050932f6b9"
    plainenglish: >-
      scholars are especially valuable as books and knowledge are lost
  - address: "core:messages#age_strategy.the_quickening.0"
    of: "bf51902ca59015f0"
    plainenglish: >-
      deep blood is especially attractive when choosing marriages
  - address: "core:messages#age_strategy.the_quickening.1"
    of: "79fb7d1300c8a307"
    plainenglish: >-
