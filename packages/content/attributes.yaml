# Heritable attributes — Core, and eight Mystic affinities. The list is open:
# an attribute is six loci in gen-loci.mjs and an entry here, and nothing in
# the engine counts them.
#
# Eldritch Power is NOT one of them. It is inherited differently, expressed
# differently, and exists nowhere outside the blood.
attributes:
  # ── Core ────────────────────────────────────────────────────────────────
  - id: strength
    name: Strength
    kind: core
    # Men are almost always the stronger: 26 points male-minus-female, applied
    # as ±13 so the population mean does not move. About 95% of man-and-woman
    # pairs fall that way, and the 5% is deliberate — a woman who out-lifts the
    # men is rare enough to be worth a line in the chronicle.
    dimorphism: 26
    description: Survival. Duels, war, plague, hard winters, childbirth.

  - id: fecundity
    name: Fecundity
    kind: core
    description: >-
      What a body was born able to do, before age or illness has an opinion.
      Inherited from both parents like anything else, which is what makes a
      fruitful line a thing the marriage market can want — and a thin one a
      thing it can smell. Nobody in the world has a number for it. They have a
      grandmother who bore seven, and a cousin who bore none. What actually
      happens to a given couple in a given year is Fertility, below.

  - id: charm
    name: Charm
    kind: core
    description: The economy of options. Decides which suitor cards you are dealt. Compounds.

  - id: agility
    name: Agility
    kind: core
    description: Escape, precision, ritual execution, certain Arts.

  - id: mind
    name: Mind
    kind: core
    gatedBy: awakening
    description: >-
      Capacity for Madness, and the ceiling on it. Study speed and concurrent
      book capacity. Develops only after Awakening, which is why the unwoken
      son of hot blood is the most fragile person in the house.

  - id: longevity
    name: Longevity
    kind: core
    description: >-
      How long this body was built to last, before anything happens to it.
      The population mean is a hundred years and almost nobody reaches it:
      maxAge is the ceiling a life is measured against, not a promise of
      one. It is the denominator for the two age curves — a body built for
      a hundred and thirty is biologically thirty at thirty-nine, stays
      fertile later and greys later, and the mortality curve finds its knee
      further out. Everything that reads an age in this engine reads it as
      a fraction of this number.

  # ── Derived: calculated from the others, inherited by nobody ────────────
  # These two have no loci. `expressAttributes` skips them and
  # `people/vitality.ts` computes them on every recompute, which is why a
  # thirty-year-old and the fifty-year-old she becomes are not the same body.
  # The engine knows these two by name — a derived attribute is a rule, and
  # the rule needs a formula. The polygenic list above stays open.
  - id: health
    name: Health
    kind: derived
    heritable: false
    range: { min: 0, max: 100 }
    description: >-
      The condition of the body as it stands this year: robustness inherited
      through Strength, less the frailty of infancy, less what age has taken,
      less any of the founder's curses the blood happened to double up, less
      whatever Madness has overflowed the Mind meant to hold it. Events write
      into it — plague, famine, a hard birth, a midwife worth her wage — and
      what they write survives the winter, because it lives in `acquired`
      rather than in the phenotype cache.

  - id: fertility
    name: Fertility
    kind: derived
    heritable: false
    range: { min: 0, max: 200 }
    description: >-
      Fecundity, read through the body carrying it: what age and sex allow,
      times what condition allows. A hundred is the reference — mean stock,
      sound health, at the peak of the curve. A woman's peak is her early
      twenties and it is over by forty-five; a man's is broader, shallower and
      never quite closes, which is the same seventy-thirty asymmetry the
      marriage market already runs on, arrived at from the other direction.
      A couple's chance is the two multiplied, so either of them being finished
      finishes both.

  - id: max_age
    name: Maximum Age
    kind: derived
    heritable: false
    range: { min: 40, max: 400 }
    description: >-
      What Longevity comes to in years, centred on a hundred. Derived, so
      nothing writes it — but the acquired layer feeds it, which is how a
      portion of agelessness bought at auction can add decades to one
      person without touching what their children inherit.

  # ── Mystic affinities: four opposed dyads, in two groups ────────────────
  # Elemental — force applied to the world. Practised by men only.
  - id: fluid
    name: Fluid
    kind: affinity
    group: elemental
    description: The tide, and the tide that takes.
  - id: thermal
    name: Thermal
    kind: affinity
    group: elemental
    description: Fire, forge, the slow burn.
  - id: aero
    name: Aero
    kind: affinity
    group: elemental
    description: Wind, storm, ash carried a long way.
  - id: terra
    name: Terra
    kind: affinity
    group: elemental
    description: >-
      Stone, foundation, burial and load. The affinity of walls and of what is
      underneath them, which in this family is not a small subject.

  # Threshold — the coming in, the going out, the seeing and the unseeing.
  # Practised by both sexes. These four are the whole of what a woman may work.
  - id: life
    name: Life
    kind: affinity
    group: threshold
    description: Birth, flourishing, plague-breaking.
  - id: death
    name: Death
    kind: affinity
    group: threshold
    description: The returned, the un-buried, what stays down.
  - id: light
    name: Light
    kind: affinity
    group: threshold
    description: Sight, revelation, the thing seen plainly.
  - id: darkness
    name: Darkness
    kind: affinity
    group: threshold
    description: >-
      Thresholds, unseeing, doors. The affinity of not-being-seen — and
      therefore the family's answer to the last two centuries.

  # ── Eldritch Power: counted outside the twelve ──────────────────────────
  - id: eldritch_power
    name: Eldritch Power
    kind: eldritch
    heritable: true
    recordable: true
    description: >-
      X-linked and family-exclusive. Men express it; women carry it and never
      express it. Dilutes when married outward and cannot be replaced from any
      external source.

  - id: madness
    name: Madness
    kind: hidden
    heritable: false
    recordable: true
    description: >-
      Overflow of expressed power. A person can go mad if and only if they are
      capable of expressing Eldritch Power — which means never a woman, and
      never a mundane man.

proseVariants:
  - address: "content:attributes.yaml#attributes[id=strength].description"
    of: "96ebaa3add09b7ce"
    plainenglish: >-
      Staying alive. Duels, war, plague, hard winters, giving birth.
  - address: "content:attributes.yaml#attributes[id=fecundity].description"
    of: "8361fe7b8cdf2057"
    plainenglish: >-
      What a body was born able to do, before age or illness has any say. It is inherited from
      both parents like everything else, which is why the marriage market can want a fruitful
      family line and smell a weak one. Nobody in the world has a number for it. They have a
      grandmother who had seven children, and a cousin who had none. What actually happens to a
      particular couple in a particular year is Fertility, below.
  - address: "content:attributes.yaml#attributes[id=charm].description"
    of: "6f850d03f78e7f37"
    plainenglish: >-
      How many options you get. It decides which suitor cards you are dealt, and the effect
      builds over time.
  - address: "content:attributes.yaml#attributes[id=agility].description"
    of: "add57e2f7b1dd443"
    plainenglish: >-
      Getting away, precise work, carrying out rituals, and some of the Arts.
  - address: "content:attributes.yaml#attributes[id=mind].description"
    of: "c30294400f0e8ccc"
    plainenglish: >-
      How much Madness a person can hold, and the limit on it. How fast they study, and how many
      books they can study at once. It only develops after Awakening, which is why a son of hot
      blood who has not yet woken is the most fragile person in the house.
  - address: "content:attributes.yaml#attributes[id=longevity].description"
    of: "64317673eb0d7f8f"
    plainenglish: >-
      How long this body was built to last, before anything happens to it. The average is a
      hundred years, and almost nobody reaches it: maxAge is the limit a life is measured
      against, not a promise. Both age curves are measured as a share of it. A body built for a
      hundred and thirty years is biologically thirty when it is thirty-nine, stays fertile
      longer, goes grey later, and its risk of death starts climbing later. Everything in this
      engine that reads an age reads it as a fraction of this number.
  - address: "content:attributes.yaml#attributes[id=health].description"
    of: "f16336ad7e494511"
    plainenglish: >-
      The state of the body this year. It starts from the toughness inherited through Strength,
      then subtracts the weakness of infancy, what age has taken, any of the founder's curses
      the person happened to inherit from both sides, and any Madness that has spilled over what
      the Mind can hold. Events change it — plague, famine, a hard birth, a midwife worth her
      wages — and those changes last through the winter, because they are stored in `acquired`
      and not in the phenotype cache.
  - address: "content:attributes.yaml#attributes[id=fertility].description"
    of: "9f6236bab849dfde"
    plainenglish: >-
      Fecundity, adjusted for the body it belongs to: what age and sex allow, multiplied by what
      health allows. A hundred is the benchmark: average stock, good health, at the best age. A
      woman is most fertile in her early twenties and is finished by forty-five. A man's peak is
      wider and lower and never quite ends. That is the same seventy-thirty imbalance the
      marriage market already works on, reached from the other side. A couple's chance is the
      two numbers multiplied, so if either of them is finished, both are.
  - address: "content:attributes.yaml#attributes[id=max_age].name"
    of: "e6e08d72fdf26c0e"
    plainenglish: >-
      Longest Possible Age
  - address: "content:attributes.yaml#attributes[id=max_age].description"
    of: "473905810d2d609d"
    plainenglish: >-
      Longevity turned into years, with a hundred as the middle. It is calculated, so nothing
      writes to it directly. But the acquired layer feeds into it, which is how a dose of
      agelessness bought at auction can add decades to one person without changing what their
      children inherit.
  - address: "content:attributes.yaml#attributes[id=fluid].description"
    of: "5f41e8dbb86166df"
    plainenglish: >-
      The tide, and the tide that drowns.
  - address: "content:attributes.yaml#attributes[id=thermal].description"
    of: "28aca45111be164d"
    plainenglish: >-
      Fire, the forge, the slow burn.
  - address: "content:attributes.yaml#attributes[id=aero].description"
    of: "9f14dc587124962c"
    plainenglish: >-
      Wind, storms, ash carried far away.
  - address: "content:attributes.yaml#attributes[id=terra].description"
    of: "338555035cec8b17"
    plainenglish: >-
      Stone, foundations, burial and weight. The affinity of walls and of what lies under them,
      which in this family is a big subject.
  - address: "content:attributes.yaml#attributes[id=life].description"
    of: "f7409630517c3f94"
    plainenglish: >-
      Birth, growth, breaking a plague.
  - address: "content:attributes.yaml#attributes[id=death].description"
    of: "5eacc5fba819d5f7"
    plainenglish: >-
      The dead who come back, the unburied, what stays in the ground.
  - address: "content:attributes.yaml#attributes[id=light].description"
    of: "631ac7f8e936b934"
    plainenglish: >-
      Sight, revealing things, seeing something clearly.
  - address: "content:attributes.yaml#attributes[id=darkness].description"
    of: "7d5febbfb8fede6b"
    plainenglish: >-
      Doorways, not seeing, doors. The affinity of not being seen, and so the family's answer to
