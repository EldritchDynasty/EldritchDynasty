  - address: "content:attributes.yaml#attributes[id=eldritch_power].name"
    of: "b243dcd9ce97a0e5"
    plainenglish: >-
      Eldritch Power (the family gift)
  - address: "content:attributes.yaml#attributes[id=eldritch_power].description"
    of: "05cd8f76d259bf9a"
    plainenglish: >-
      Passed down on the X chromosome, and found only in this family. Men express it; women
      carry it and never express it. It weakens when the family marries outside its blood, and
      it can never be replaced from outside.
  - address: "content:attributes.yaml#attributes[id=madness].description"
    of: "85d7cb4a270de5be"
    plainenglish: >-
      What spills over when expressed power is too much. A person can go mad only if they can
      express Eldritch Power, which means never a woman and never a man without the gift.
