# STANDING MYSTIC DUTIES (#1866 B / #1873). A working is what a learned
# reader can be named to do, every year, for one real place — a hall to care
# for or a parcel to keep. The Table names the reader and the place; the
# `mystic` phase reserves the upkeep before any benefit, and the benefit is
# read where the outcome happens (`rollDeath`, `tickLandRisks`,
# `damageParcel`), only while the reader is alive, of the house and there.
#
# Nothing here touches Madness or Eldritch Power (invariant 4), and practice
# is not a post (invariant 16): the Threshold four are a woman's exactly as
# much as a man's. `books` lists EVERY book the reader must have finished.
mysticWorkings:
  - id: sickroom_watch
    name: The Sickroom Watch
    affinity: life
    books: [lesser_workings_of_life]
    description: >-
      One reader lives in one hall and sits up with the six people in it most
      likely to die that year, which usually means the smallest children and the
      oldest. Fewer of those six die of fevers, old age and the first five years.
      It does nothing for a wound, a war or the blood, and nothing for anybody
      the reader is not sitting with.
    preparation: { crowns: 12, years: 0 }
    upkeep: 4
    benefit: { kind: life_care, mortalityReduction: 0.35, infantReduction: 0.5, maxWards: 6 }

  - id: the_long_vigil
    name: The Long Vigil
    affinity: life
    books: [lesser_workings_of_life, greater_workings_of_life]
    description: >-
      The same watch, kept by somebody who has read the second book. It reaches
      ten beds instead of six and holds harder at each. It still cannot stop a
      blade, a war or the blood.
    preparation: { crowns: 20, years: 1 }
    upkeep: 6
    benefit: { kind: life_care, mortalityReduction: 0.45, infantReduction: 0.65, maxWards: 10 }

  - id: shoring_the_banks
    name: Shoring the Banks
    affinity: terra
    books: [lesser_workings_of_terra]
    description: >-
      A reader walks one farm or one stretch of wet ground every season, packing
      the banks and settling the drains. A bad year there costs about a third of
      what it would, and flood or slump takes about a third as much. It does not
      make a good year better.
    preparation: { crowns: 5, years: 1 }
    upkeep: 1
    benefit: { kind: estate_protection, lossPrevented: 0.7, parcelKinds: [tenant_farm, wetland], maxAcres: 140 }

  - id: the_quarrymans_face
    name: The Quarryman's Face
    affinity: terra
    books: [lesser_workings_of_terra, greater_workings_of_terra]
    description: >-
      The second book teaches how stone wants to fall. A reader can hold a slate
      face, a mill race or a large farm through a bad year and keep nearly all of
      what it would have lost.
    preparation: { crowns: 12, years: 2 }
    upkeep: 2
    benefit:
      kind: estate_protection
      lossPrevented: 0.9
      parcelKinds: [tenant_farm, wetland, mill, slate_work]
      maxAcres: 260

  - id: the_field_infirmary
    name: The Field Infirmary
    affinity: life
    books: [lesser_workings_of_life]
    description: >-
      One learned reader goes with one levy, tending the camp sickness and the
      men brought back from the fighting. Some recoverable losses are kept off
      the roll, and a wounded family officer has a better chance of living.
      The reader cannot keep a sickroom at home from the camp.
    preparation: { crowns: 8, years: 0 }
    upkeep: 2
    benefit:
      kind: field_care
      casualtyReduction: 0.35
      officerReduction: 0.35
      risk: { death: 0.006, capture: 0.018, injury: 0.025, ransom: 35 }

  - id: the_surgeons_tent
    name: The Surgeon's Tent
    affinity: life
    books: [lesser_workings_of_life, greater_workings_of_life]
    description: >-
      The second book equips a reader to hold harder at the camp infirmary.
      Half the recoverable levy losses can be saved, and the part of a family
      officer's danger that comes from the fighting is halved. Neither work
      stops old age or the blood. A year of preparation comes before the road.
    preparation: { crowns: 14, years: 1 }
    upkeep: 3
    benefit:
      kind: field_care
      casualtyReduction: 0.5
      officerReduction: 0.5
      risk: { death: 0.006, capture: 0.018, injury: 0.025, ransom: 35 }

  - id: keeping_the_camp_water
    name: Keeping the Camp Water
    affinity: fluid
    books: [lesser_workings_of_fluid]
    description: >-
      A reader keeps one levy supplied with clean water and keeps its stores
      fit to use. The account falls by three tenths of a crown for each of up
      to twelve men still serving. The reader's fee is a separate charge.
      There is no saving on a position bought from the Warden.
    preparation: { crowns: 8, years: 0 }
    upkeep: 1
    benefit:
      kind: field_supply
      crownsPerMan: 0.3
      maxMen: 12
      risk: { death: 0.006, capture: 0.018, injury: 0.025, ransom: 35 }

  - id: the_lantern_line
    name: The Lantern Line
    affinity: light
    books: [lesser_workings_of_light]
    description: >-
      A reader watches the approaches around one levy. A useful sighting can
      earn the house a little credit on the Warden's roll; it cannot turn the
      whole war. A learned enemy concealer can hide the movement, and this
      watch can contest an enemy's covered road.
    preparation: { crowns: 8, years: 0 }
    upkeep: 1
    benefit:
      kind: field_watch
      opportunityChance: 0.35
      credit: 1.5
      risk: { death: 0.006, capture: 0.018, injury: 0.025, ransom: 35 }

  - id: the_covered_road
    name: The Covered Road
    affinity: darkness
    books: [lesser_workings_of_darkness]
    description: >-
      A reader covers the paths used by the levy's working readers. Half their
      ordinary capture risk is hidden, but no wound or death is taken away.
      An enemy Light watch halves that protection. This same concealment can
      hide a local movement from an opposing reader's lanterns.
    preparation: { crowns: 8, years: 0 }
    upkeep: 1
    benefit:
      kind: field_concealment
      captureReduction: 0.5
      observationReduction: 0.5
      risk: { death: 0.006, capture: 0.018, injury: 0.025, ransom: 35 }

# Plain English counterparts for working descriptions; Originals above stay unchanged.
  - id: the_door_lamp
    name: The Door Lamp
    affinity: light
    books:
      - lesser_workings_of_light
    description: One learned watcher keeps one hall. A disturbed approach is more likely to be seen before it reaches a relative, leaving time to arrange lodging or an escort. The light shows a trace, never the name of an unseen patron.
    preparation:
      crowns: 8
      years: 0
    upkeep: 1
    benefit:
      kind: household_protection
      stage: warning
      scope: hall
      bonus: 0.4
  - id: the_shut_threshold
    name: The Shut Threshold
    affinity: terra
    books:
      - lesser_workings_of_terra
    description: One reader prepares the doors and passages of one hall. A bodily attack is less likely to reach anyone living there while the reader remains present and paid. An uncovered road stays uncovered, and a determined intruder may still get through.
    preparation:
      crowns: 10
      years: 0
    upkeep: 2
    benefit:
      kind: household_protection
      stage: prevention
      scope: hall
      bonus: 0.35
  - id: the_unwatched_room
    name: The Unwatched Room
    affinity: darkness
    books:
      - lesser_workings_of_darkness
    description: One reader shelters one named relative from an intruder looking for them at home. The working can spoil an approach; it neither erases a witness nor follows the relative on a journey. The reader must keep the duty throughout.
    preparation:
      crowns: 10
      years: 0
    upkeep: 2
    benefit:
      kind: household_protection
      stage: prevention
      scope: person
      bonus: 0.3
  - id: the_bedside_thread
    name: The Bedside Thread
    affinity: life
    books:
      - lesser_workings_of_life
    description: One reader stays with one named relative at home. If a bodily attack reaches that person, the reader can keep an otherwise fatal injury from killing them. The injury remains; the working cannot restore the dead or answer the blood.
    preparation:
      crowns: 12
      years: 0
    upkeep: 2
    benefit:
      kind: household_protection
      stage: survival
      scope: person
      bonus: 0.35

  - id: the_covered_approach
    name: The Covered Approach
    affinity: darkness
    books:
      - lesser_workings_of_darkness
    description: A reader travels with one named expedition and keeps its approach from casual observation. Reaching a person and leaving an identifiable witness remain different risks. The working cannot remove a statement already copied. Setting it down does not bring the reader home before the expedition returns.
    preparation:
      crowns: 8
      years: 1
    upkeep: 1
    benefit:
      kind: covert_support
      role: approach
      bonus: 0.15
  - id: a_passage_prepared
    name: A Passage Prepared
    affinity: terra
    books:
      - lesser_workings_of_terra
      - greater_workings_of_terra
    description: The second book lets a reader prepare one physical approach with an expedition. A guarded or reinforced passage is less likely to stop that approach. People can still stand in the way, and reaching the intended person does not settle what follows. The reader stays with the journey until its return.
    preparation:
      crowns: 12
      years: 1
    upkeep: 2
    benefit:
      kind: covert_support
      role: breach
      bonus: 0.2
  - id: the_returning_wind
    name: The Returning Wind
    affinity: aero
    books:
      - lesser_workings_of_aero
      - greater_workings_of_aero
    description: One reader prepares an expedition’s local way out. A named operative is less likely to be caught by the people actually watching that place. The wind neither shortens the journey home to nothing nor removes a witness who has already spoken. The reader must make the same return.
    preparation:
      crowns: 10
      years: 1
    upkeep: 1
    benefit:
      kind: covert_support
      role: escape
      bonus: 0.2
  - id: the_travelling_thread
    name: The Travelling Thread
    affinity: life
    books:
      - lesser_workings_of_life
    description: A learned carer goes with an expedition and attends its named operative after the encounter. Fewer of the wounds suffered while getting away stop that person from serving again. This care does not open a locked place, prevent captivity or restore a person already dead. The carer is absent from home throughout.
    preparation:
      crowns: 10
      years: 1
    upkeep: 2
    benefit:
      kind: covert_support
      role: recovery
      bonus: 0.2
  - id: the_short_vigil
    name: The Short Vigil
    affinity: death
    books:
      - lesser_workings_of_death
      - greater_workings_of_death
    description: A reader of both books prepares a bodily working against the expedition’s one named living enemy. It can help the attempt reach that person and make an injury harder to survive. Real guards and Life care still matter. It promises neither a death nor a second life, and its reader must travel and return with the expedition.
    preparation:
      crowns: 18
      years: 1
    upkeep: 2
    benefit:
      kind: covert_support
      role: hostile
      bonus: 0.15

  - id: the_foundation_line
    name: The Foundation Line
    affinity: terra
    books:
      - lesser_workings_of_terra
    description: A reader surveys one holding and keeps the ground settled while its
