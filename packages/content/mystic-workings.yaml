      crowns: 3
      years: 1
    upkeep: 0.5
    benefit:
      kind: project_support
      costReduction: 0.1
      parcelKinds:
        - tenant_farm
        - wetland
        - mill
        - slate_work
        - demesne
  - id: setting_the_culverts
