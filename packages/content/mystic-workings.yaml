proseVariants:
  - address: "content:mystic-workings.yaml#mysticWorkings[id=sickroom_watch].description"
    of: e4434738f3973e8c
    plainenglish: >-
      One reader lives in one hall and looks after the six people there most likely to die that year, usually the youngest children and the oldest people. Fewer of those six die of fever, old age, or in their first five years. It does not help with wounds, war or the blood, or anyone the reader is not looking after.
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_long_vigil].description"
    of: 4cd3be4968a84ea5
    plainenglish: >-
      The same care, given by someone who has read the second book. It covers ten people instead of six and protects each of them more. It still cannot stop a blade, a war or the blood.
  - address: "content:mystic-workings.yaml#mysticWorkings[id=shoring_the_banks].description"
    of: d49e82b70fc7dc2b
    plainenglish: >-
      A reader walks one farm or one area of wet ground every season, strengthening the banks and clearing the drains. A bad year there costs only about a third of what it would, and floods or landslips do about a third of the damage. It does not make a good year better.
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_quarrymans_face].description"
    of: b31455ec59e01dc8
    plainenglish: >-
      The second book teaches how stone wants to fall. A reader can protect a slate quarry, a mill race or a large farm through a bad year and save nearly all of what it would have lost.
  - address: "content:mystic-workings.yaml#mysticWorkings[id=sickroom_watch].name"
    of: c391dcaa52cff0a6
    plainenglish: "Caring for the Sick"
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_long_vigil].name"
    of: 947afad1b472193d
    plainenglish: "Greater Care for the Sick"
  - address: "content:mystic-workings.yaml#mysticWorkings[id=shoring_the_banks].name"
    of: 1ccbba4126b7c45d
    plainenglish: "Strengthening the Banks"
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_quarrymans_face].name"
    of: e75c92d76597612b
    plainenglish: "Protecting Quarries and Mills"
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_field_infirmary].name"
    of: "30939d273a76151b"
    plainenglish: "Treating the Levy"
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_field_infirmary].description"
    of: "244e7cfbd01b98af"
    plainenglish: "One trained reader accompanies one levy and treats sickness and wounded men. Some losses are prevented, and a wounded family officer has a better chance of surviving. The reader cannot also care for people at home."
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_surgeons_tent].name"
    of: "52450a06f818de0a"
    plainenglish: "Greater Field Care"
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_surgeons_tent].description"
    of: "6349c3a4e18f7180"
    plainenglish: "The second book gives the reader stronger field care. Half the recoverable levy losses can be prevented, and a family officer’s danger from fighting is halved. It does not prevent old age or harm from the blood. Preparation takes a year before travel begins."
  - address: "content:mystic-workings.yaml#mysticWorkings[id=keeping_the_camp_water].name"
    of: "17dfe7c7403e265b"
    plainenglish: "Protecting Camp Supplies"
  - address: "content:mystic-workings.yaml#mysticWorkings[id=keeping_the_camp_water].description"
    of: "14c2c8504b6ad994"
    plainenglish: "A reader keeps one levy’s water clean and its supplies usable. Costs fall by 0.3 crowns for each of up to twelve men still serving. The reader’s fee is paid separately. It does not reduce the cost of a position bought from the Warden."
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_lantern_line].name"
    of: "a28966d6a34dda9a"
    plainenglish: "Watching the Approaches"
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_lantern_line].description"
    of: "fa1a759a79ce63e6"
    plainenglish: "A reader watches the approaches around one levy. A useful sighting can earn a small amount of credit from the Warden, but cannot change the whole war. A trained enemy concealer can hide movements. This watch can also weaken an enemy’s concealment of a route."
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_covered_road].name"
    of: "b9101288764320e4"
    plainenglish: "Concealing the Route"
  - address: "content:mystic-workings.yaml#mysticWorkings[id=the_covered_road].description"
    of: "95bcdcd2a7d6c56e"
    plainenglish: "A reader hides the routes used by the levy’s Mystic readers. This halves their normal capture risk, but does not prevent wounds or death. An enemy Light watch halves this protection. The same working can hide a local movement from an opposing reader."

  - address: content:mystic-workings.yaml#mysticWorkings[id=the_door_lamp].name
    of: e9128c265cd95e7a
    plainenglish: Watching the Door
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_door_lamp].description
    of: c43c72eb75a68007
    plainenglish: A learned watcher protects one hall. The watcher is more likely to notice an approaching attack early, giving time to arrange safe lodging or an escort. A warning does not identify an unseen sponsor.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_shut_threshold].name
    of: eece8d2d846eba29
    plainenglish: Securing the Hall
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_shut_threshold].description
    of: 2e25b84d11f33291
    plainenglish: A reader protects the entrances and passages of one hall. While the reader is present and maintained, a physical attack is less likely to reach its target there. Travel outside the hall is unprotected. The protection can fail.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_unwatched_room].name
    of: d34663927cf0349e
    plainenglish: Concealing a Relative
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_unwatched_room].description
    of: dc594963a20fdc27
    plainenglish: A reader helps hide one named relative from an intruder at home. This can prevent an attack from reaching that person. It does not erase witnesses or protect travel. The reader must remain on duty.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_bedside_thread].name
    of: 9a618238cef27bf4
    plainenglish: Keeping a Victim Alive
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_bedside_thread].description
    of: 1836cfc02aaeccb4
    plainenglish: A reader protects one named relative at home. After a physical attack, the reader can help the victim survive an injury that would otherwise be fatal. The injury remains. The working cannot revive the dead or counter Eldritch Power.

  - address: content:mystic-workings.yaml#mysticWorkings[id=the_covered_approach].name
    of: 0ed18c9a2033b37e
    plainenglish: Concealing an Approach
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_covered_approach].description
    of: 35787432fd2192e6
    plainenglish: A reader accompanies one expedition. The working can help it reach its target and reduce the chance that a witness identifies the operative. Existing copied testimony remains. The reader stays away until the expedition returns, even if the working is released.
  - address: content:mystic-workings.yaml#mysticWorkings[id=a_passage_prepared].name
    of: 0146bb1973087885
    plainenglish: Preparing a Passage
  - address: content:mystic-workings.yaml#mysticWorkings[id=a_passage_prepared].description
    of: 5190bcc6161bdfaa
    plainenglish: A reader who has completed both Terra books accompanies an expedition and helps it pass a guarded or reinforced approach. Guards can still prevent the attack. Reaching the target does not guarantee success or escape. The reader remains with the expedition until it returns.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_returning_wind].name
    of: dea6cc906cd28d8c
    plainenglish: Preparing an Escape
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_returning_wind].description
    of: b5256c9521ccf5e9
    plainenglish: A reader with both Aero books helps an expedition leave the immediate scene. Actual guards are less likely to capture the operative. Travel home still takes time, and existing witnesses remain. The reader must return with the expedition.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_travelling_thread].name
    of: ed3f0b9c6bcddc68
    plainenglish: Expedition Recovery Care
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_travelling_thread].description
    of: a2357fce2f15b622
    plainenglish: A Life reader accompanies the expedition and helps the operative avoid an injury during escape. The working does not help the approach, prevent capture or revive the dead. The reader provides no home protection while away.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_short_vigil].name
    of: 88b876857a804bc9
    plainenglish: A Prepared Bodily Working
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_short_vigil].description
    of: 0c58968a244f6d06
    plainenglish: A reader who has completed both Death books accompanies an expedition against one named living enemy. The working can improve the chance of reaching that person and of a serious injury being fatal. Guards and Life care can still work. It cannot guarantee death or revive anyone. The reader must make the journey and return.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_foundation_line].name
    of: a4b4e15d6fc342a1
    plainenglish: Surveying the Foundations
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_foundation_line].description
    of: 3d89e58734c4e043
    plainenglish: A paid Terra reader surveys one holding. Starting a land
      improvement there costs 10% less while that reader is available.
      Preparation still takes a year and the improvement still takes four years.
      Losing the reader removes the discount for future projects.
  - address: content:mystic-workings.yaml#mysticWorkings[id=setting_the_culverts].name
    of: 0d4964f856dedb9c
    plainenglish: Laying the Drains
  - address: content:mystic-workings.yaml#mysticWorkings[id=setting_the_culverts].description
    of: 0711b5d2fe6631f6
    plainenglish: A reader who has completed both Terra books works at one holding.
      Another reader must keep Firing the Liners at the same holding. Both roles
      charge their preparation and annual fees. While both readers are
      available, starting an improvement costs 25% less; it still takes four
      years.
  - address: content:mystic-workings.yaml#mysticWorkings[id=firing_the_liners].name
    of: afee77aaa3ef0896
    plainenglish: Firing the Drain Liners
  - address: content:mystic-workings.yaml#mysticWorkings[id=firing_the_liners].description
    of: 5e68c59ad1d66c76
    plainenglish: A reader with both Thermal books fires clay drain liners at one
      holding. A different reader must keep Setting the Culverts there. Both
      roles must be paid and available. Together they reduce the price of
      starting an improvement by 25%, and the improvement still takes four
      years. This discount does not stack with another project discount.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_clear_well].name
    of: aeb1800373e61d97
    plainenglish: Keeping the Well Clean
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_clear_well].description
    of: eb85f0f7f495b163
    plainenglish: A paid Fluid reader works at one hall. Four residents with the
      greatest ordinary health risk receive a bounded reduction in that risk.
      Violence, inherited power and absent residents are unaffected.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_open_drain].name
    of: 20a60a96a0220fd2
    plainenglish: Keeping a Field Drained
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_open_drain].description
    of: aa50b1441b8504e8
    plainenglish: A Fluid reader maintains one farm or wetland of at most 160 acres.
      The working reduces a poor yield or physical damage by 40%. It does not
      increase a good year’s yield.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_running_race].name
    of: 01c694543b615aa8
    plainenglish: Keeping the Mill Race
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_running_race].description
    of: cde5060770aaab5b
    plainenglish: A Fluid reader protects one held mill against part of its poor
      yield and damage. The reader must remain assigned, available and paid.
      This working provides no coverage elsewhere.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_warm_room].name
    of: 76382e7c4ebc6e90
    plainenglish: Keeping a Hall Warm
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_warm_room].description
    of: 7eb8dce60c3599b2
    plainenglish: A paid Thermal reader stays in one hall and reduces ordinary
      health risk for four vulnerable residents. This does not affect violence,
      inherited power or the maximum-age boundary. The reader has no other duty.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_dry_store].name
    of: e6019a5067031c0c
    plainenglish: Keeping Provisions Dry
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_dry_store].description
    of: 810c772ab679d8e6
    plainenglish: A paid Thermal reader preserves provisions for up to eight
      residents of one hall. Each person’s annual food cost falls by up to 0.3
      crowns, capped at 25% of that actual charge. Wages, taxes and other
      spending remain.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_open_shutters].name
    of: c70578ded120b1b2
    plainenglish: Ventilating a Hall
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_open_shutters].description
    of: 863ba47467ecb7b8
    plainenglish: An available paid Aero reader reduces ordinary health risk for
      four vulnerable residents of one hall. It does not repair wounds, affect
      inherited power or cover people away from that hall.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_harvest_wind].name
    of: e05e29c9648e24fd
    plainenglish: Sheltering Harvest Work
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_harvest_wind].description
    of: 30328a08d5f09fe4
    plainenglish: An Aero reader protects one farm or demesne of at most 160 acres.
      The working reduces a poor yield or damage by 40%, with no improvement to
      a good year. It applies only while its named reader is available and paid.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_raised_sacks].name
    of: 60b001f70ddeadfb
    plainenglish: Ventilating the Food Store
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_raised_sacks].description
    of: 8484650ab3c72a5e
    plainenglish: A paid Aero reader reduces food costs for up to six residents of
      one hall by up to 0.25 crowns each per year. Savings are capped at 25% of
      each actual food charge. The working creates no food.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_first_winter].name
    of: 2d6c20f3c7cf0f97
    plainenglish: Watching the Youngest Children
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_first_winter].description
    of: 0ec07fa89d411c54
    plainenglish: A paid Life reader attends up to six children aged one or younger
      in one hall. Their ordinary infant risk falls by 60%. This does not change
      genetic stillbirths, inherited power, violence or absent children.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_mending_watch].name
    of: 02c35f6b359ef6b7
    plainenglish: Helping an Injured Relative Recover
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_mending_watch].description
    of: a12c7e05e15f0111
    plainenglish: One available paid Life reader treats one resident relative. Each
      year restores up to 3 lost health points, stopping at zero, and reduces
      any remaining field recovery by at most one year. The relative must
      actually be at home.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_still_binding].name
    of: ef3217d7294d54db
    plainenglish: Preserving a Vellum Book
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_still_binding].description
    of: 0b6bbecf90ac962b
    plainenglish: A paid Death reader protects one physical library copy from half
      its annual wear and wear from completed study. The working does not repair
      existing damage, restore lost text or affect copies held elsewhere. It
      pauses while that copy is with the binder.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_still_larder].name
    of: a902d8b47e31dda8
    plainenglish: Preserving Stored Meat
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_still_larder].description
    of: 14aa32913d6f8df5
    plainenglish: A paid Death reader preserves already-dead provisions for up to
      eight residents of one hall. The saving is up to 0.3 crowns per person per
      year, capped at 25% of actual food costs. This creates no food and
      restores no life.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_copyists_light].name
    of: 9df4a82bc06f185f
    plainenglish: Examining a Library Copy
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_copyists_light].description
    of: 21b325bc64f035b8
    plainenglish: A paid Light reader tends one held book. It suffers half the
      normal annual wear and wear from completed study, and a repair ordered
      while the reader is available costs 25% less. The working does not recover
      destroyed text or protect an absent copy.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_readers_lamp].name
    of: b08c955fe20613a3
    plainenglish: Teaching a Successor Reader
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_readers_lamp].description
    of: 080e5a03fa81aab7
    plainenglish: A paid Light practitioner teaches one resident relative from a
      book the teacher already knows. Three eligible lesson years shorten that
      book’s remaining study by one year. Paused or absent students receive no
      lessons, and changing books resets the lesson count.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_shaded_volume].name
    of: 3f5b905301e8d8b7
    plainenglish: Shading a Library Copy
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_shaded_volume].description
    of: 3d788ca659b0c5ba
    plainenglish: A paid Darkness reader protects one physical book from half its
      annual wear and wear from completed study. The working does not repair old
      damage, hide existing witnesses or erase other copies. It pauses while the
      book is at the binder.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_sleeping_room].name
    of: d516188489c3f390
    plainenglish: Keeping a Room for Rest
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_sleeping_room].description
    of: 6f5619b0f2e9f62c
    plainenglish: An available paid Darkness reader reduces ordinary health risk for
      three vulnerable residents in one hall. The working supports rest; it does
      not heal injuries, affect inherited power or change the maximum-age limit.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_dry_baggage].name
    of: 238bcd6bb02f347f
    plainenglish: Preserving Levy Supplies
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_dry_baggage].description
    of: e5509cfdea657e59
    plainenglish: A paid Thermal reader with both books accompanies one active levy.
      Supply costs fall by up to 0.2 crowns for at most 20 men per year. The
      reader travels with the commitment, faces its stated risks and provides no
      home coverage.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_water_contract].name
    of: 6b24e5bb047b9417
    plainenglish: Waterwork Commission
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_water_contract].description
    of: 8b9e7d86ac86b182
    plainenglish: A licensed reader who has completed both books works on one local
      waterwork for one known patron. The term is two working years plus travel
      and return. The patron reserves 16 crowns and pays 8 for each year
      actually served; unused money returns to the patron. This also creates a
      house obligation to provide a trained reader again within twenty years.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_kiln_contract].name
    of: 19098e9ba3ca4fdf
    plainenglish: Kiln Commission
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_kiln_contract].description
    of: 683c5b3bc412ec17
    plainenglish: A licensed reader who has completed both books works on one small
      workshop kiln for one known patron. The term is two working years plus
      travel and return. The patron reserves 16 crowns and pays 8 for each year
      actually served; unused money returns to the patron. This also creates a
      house obligation to provide a trained reader again within twenty years.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_local_passage].name
    of: ea89781bfd5fa7cf
    plainenglish: Local Travel Commission
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_local_passage].description
    of: c41c0167dc13e163
    plainenglish: A licensed reader who has completed both books works on one local
      passage and its baggage for one known patron. The term is two working
      years plus travel and return. The patron reserves 16 crowns and pays 8 for
      each year actually served; unused money returns to the patron. This also
      creates a house obligation to provide a trained reader again within twenty
      years.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_surveyors_round].name
    of: d78882c73039bfeb
    plainenglish: Survey Commission
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_surveyors_round].description
    of: 6835702a495eff96
    plainenglish: A licensed reader who has completed both books works on one
      bounded survey for one known patron. The term is two working years plus
      travel and return. The patron reserves 16 crowns and pays 8 for each year
      actually served; unused money returns to the patron. This also creates a
      house obligation to provide a trained reader again within twenty years.
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_hired_watch].name
    of: 87254e71d0f4656d
    plainenglish: Medical Commission
  - address: content:mystic-workings.yaml#mysticWorkings[id=the_hired_watch].description
    of: 23e158cdc1fb23f9
    plainenglish: A licensed reader who has completed both books works on one paid
      household watch for one known patron. The term is two working years plus
      travel and return. The patron reserves 16 crowns and pays 8 for each year
