      shortening its four years. Neither reader can keep another duty at home.
    preparation:
      crowns: 4
      years: 1
    upkeep: 1
    benefit:
      kind: project_support
      costReduction: 0.25
      parcelKinds:
        - tenant_farm
        - wetland
        - mill

