# THE NINE CLAUSES (concept §18).
#
# The contract signed in 1042. The player begins knowing the first; clause-bearing
# Ages are the ordinary reveal cadence that stops this game from deferring its
# entire payoff to the last hour. #185 adds one narrow late exception: after an
# Unmaking recipient has attained Demigod, the house may deliberately pay its
# record-keepers to recover the next missing clause, once per year, only until
# the existing seven-clause God gate is met.
#
# `text` is the contract's own words and is entered in the chronicle in the
# contract's own hand — no chronicler edits it, and no Record choice is offered
# on it. `effect` is the designer's note about what it changes at 1542 and is
# never shown to the player in those words.
#
# The clauses are deliberately not a difficulty curve. They are a shape: the
# early ones establish that the thing is real and legally exact, the middle
# ones open the routes a clever house can use, and the last two close the door
# the player has spent centuries walking toward.
#
# `ages` (issue #4): which Ages can reveal this clause. Every clause-bearing
# Age draws the lowest-weight UNRECOVERED clause from its own assigned set,
# not from the global order, so which clauses a run recovers varies by which
# Ages it drew and not merely how many. Non-clause-bearing Ages (the
# Insurrection, the Plague) never reveal a clause regardless of assignment,
# so only the five clause-bearing Ages appear below. Every clause is assigned
# to at least two of them — the `clause/ages` rule fails the build otherwise.

clauses:
  - id: clause_of_the_term
    name: The Term
    known: true
    weight: 10
    ages: [the_long_peace, the_wars]
    text: >-
      The term is five hundred years from the day of signing, and the day of
      signing is counted. No extension is possible. No party may be absent at
      collection.
    effect: >-
      The clock, and the only clause the family has always had. Establishes
      that 1542 is a date rather than a legend.

  - id: clause_of_the_kept_thing
    name: The Kept Thing
    weight: 20
    ages: [the_wars, the_crusade]
    text: >-
      What was given must be kept and must be keepable. A thing that cannot be
      held by the hand that owes it has not been kept.
    effect: >-
      The Regalia clause. Losing a founding heirloom is not a setback, it is a
      partial default, and the Church's copy of this clause is why the auction
      houses know what your grandmother sold.

  - id: clause_of_the_blood_entire
    name: The Blood Entire
    weight: 30
    ages: [the_long_peace, the_withering]
    text: >-
      The debt is owed by the blood and not by the man. It does not divide
      among heirs. It does not lessen by division.
    effect: >-
      Cadet branches do not dilute the debt — every branch owes the whole of
      it. Also the legal ground on which a cadet cousin can be made to answer
      for a Head four generations dead.

  - id: clause_of_substitution
    name: Substitution
    weight: 40
    ages: [the_crusade, the_quickening]
    text: >-
      A payment may be made in another's place, provided the other is of the
      blood and provided the other consents. Consent obtained in ignorance is
      consent.
    effect: >-
      The Vessel is legal. Note the second sentence, which is the whole of the
      clause: nobody has to be told what they are agreeing to.

  - id: clause_of_the_ninth_name
    name: The Ninth Name
    weight: 50
    ages: [the_crusade, the_long_peace]
    text: >-
      The counterparty is named nine times in this instrument and is one party.
      An action against one name is an action against all.
    effect: >-
      Settles the Church's oldest argument in the worst possible direction, and
      makes every ward that names one of the nine a ward that names all of them.

  - id: clause_of_the_broken_line
    name: The Broken Line
    weight: 60
    ages: [the_withering, the_wars]
    text: >-
      Should the blood fail before the term, the debt is not discharged. It
      falls upon what holds the name, and the name is held by whoever keeps
      the house.
    effect: >-
      The Broken Line ending is not an escape. A house that dies out hands the
      debt to whoever bought the roof, which is how the counterparty ends up
      sitting opposite a stranger.

  - id: clause_of_the_made_thing
    name: The Made Thing
    weight: 70
    ages: [the_quickening, the_crusade]
    text: >-
      A party who has ceased to be a person remains a party. Ascent does not
      discharge. Neither does it exempt.
    effect: >-
      A Demigod is still on the hook, and so is a God. This is the clause that
      makes the last rung a strategy rather than a victory, and it should land
      no earlier than the sixth Age.

  - id: clause_of_the_witness
    name: The Witness
    weight: 80
    ages: [the_withering, the_wars]
    text: >-
      What is written by the debtor is not evidence. What is written by a
      witness is evidence. The counterparty is a witness to all of it.
    effect: >-
      The chronicle is worthless as a defence and the Discrepancies are
      admissible. Every embellishment the player has made across the Long Line
      becomes a liability on the night, at once.

  - id: clause_of_the_final_accounting
    name: The Final Accounting
    weight: 90
    ages: [the_long_peace, the_crusade]
    text: >-
      At the term, what is owed shall be read aloud in full, and the reading
      shall be answered. Silence is an answer and is recorded as refusal.
    effect: >-
      The last night is a scene the player cannot decline. Sets the frame:
      two at a table, and one of them reading.

# Plain English text for each Ledger clause; originals and design notes stay intact.
proseVariants:
  - address: "content:clauses.yaml#clauses[id=clause_of_the_term].text"
    of: 00e2986d161cc591
    plainenglish: >-
      The contract lasts five hundred years, starting with the day it was signed. It
      cannot be extended. Every party must be present when the debt is collected.
  - address: "content:clauses.yaml#clauses[id=clause_of_the_kept_thing].text"
    of: ac6b0f7014a9f59c
    plainenglish: >-
      What was given must remain in the care of the party that owes it, and that party
      must be able to keep it. If the party cannot hold it, the condition has not been
      met.
  - address: "content:clauses.yaml#clauses[id=clause_of_the_blood_entire].text"
    of: b32c0bd2a6d5631e
    plainenglish: >-
      The bloodline owes this debt, not one man. Dividing the family among heirs does not
      divide or reduce the debt.
  - address: "content:clauses.yaml#clauses[id=clause_of_substitution].text"
    of: d66de3c5039367c1
    plainenglish: >-
      Someone else may make the payment, if the person they replace is of the bloodline
      and agrees. Agreement still counts even if that person does not understand what
      they are agreeing to.
  - address: "content:clauses.yaml#clauses[id=clause_of_the_ninth_name].text"
    of: f7adfcce28ef566a
    plainenglish: >-
      The other party to this contract is named nine times, but all nine names belong to
      the same party. Acting against one name counts as acting against all of them.
  - address: "content:clauses.yaml#clauses[id=clause_of_the_broken_line].text"
    of: e546ac072a50106b
    plainenglish: >-
      If the bloodline ends before the contract term, the debt remains. It passes to
      whoever holds the family name, and that name belongs to whoever keeps the house.
  - address: "content:clauses.yaml#clauses[id=clause_of_the_made_thing].text"
    of: ee3387f34a841bc7
    plainenglish: >-
      Even if a party is no longer a person, it is still bound by this contract. Rising
      to a higher state neither pays the debt nor removes the obligation.
  - address: "content:clauses.yaml#clauses[id=clause_of_the_witness].text"
    of: eee3771ea0cba78a
    plainenglish: >-
      A debtor's own writing does not count as evidence. A witness's writing does. The
      other party to the contract is a witness to everything.
  - address: "content:clauses.yaml#clauses[id=clause_of_the_final_accounting].text"
    of: 831acbabb4cf72e7
    plainenglish: >-
      When the term ends, the whole debt must be read aloud, and someone must answer.
      Saying nothing counts as an answer and is recorded as refusal.
