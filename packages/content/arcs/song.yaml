# THE SONG WE TAUGHT THEM.
#
# Started after the player pays Wayfolk to carry a corrected version of a story.
# The lesson looked cheap because it was: songs can be steered. This arc supplies
# the missing second half — songs can be steered by anyone, and a version helped
# onto the road can outlive the helper without remaining the version they knew.
#
# There is deliberately no short exit. The launcher has already supplied the
# player's choice, and keeping every path three beats long lets the campaign-end
# reachability guard refuse a story that cannot actually finish.
arcs:
  - id: arc_the_song_we_taught_them
    title: The Song We Taught Them
    entry: the_gift
    bindings: []
    expiresAfterYears: 180
    maxConcurrentInstances: 1
    nodes:
      - id: the_gift
        event: song_the_stave_they_left
        selection: first_match
        schedule: immediate
        successors:
          - to: two_versions

      - id: two_versions
        event: song_two_versions_at_greening
        selection: first_match
        schedule: { minYears: 35, maxYears: 65 }
        successors:
          - to: one_version

      - id: one_version
        event: song_the_children_have_one_version
        selection: first_match
        schedule: { minYears: 55, maxYears: 90 }
        successors:
          - to: end

proseVariants:
  - address: "content:arcs/song.yaml#arcs[id=arc_the_song_we_taught_them].title"
    of: "b7ea33d42e403680"
    plainenglish: >-
      The Song We Gave Them
