# A substory spanning three centuries.
#
# EXACTLY-ONE SEMANTICS: on node completion the engine collects successors
# whose `when` passes and whose `fromOutcome` matches, then takes exactly one.
# There is no path on which two children fire — the engine returns a single
# NodeId and the type says so.
#
# BINDINGS OUTLIVE PEOPLE. CHALLENGER is bound arc-wide and will be dead long
# before `presses` comes due. `onMissing: { inherit: heir }` is the policy that
# earns its keep: the grudge, the arc and the binding all move down one
# generation together, and the family's history rhymes without an author
# wiring it.
arcs:
  - id: arc_the_given_seal
    title: The Question of the Seal
    entry: aftermath
    bindings: [CHALLENGER]
    # 460, not 400 (issue #131): the full four-node path (aftermath, immediate;
    # presses, 45-120; counted, 90-200; our_letter, 60-140) runs 195-460 years,
    # and an expiry short of its own longest path expired 5.3% of full
    # traversals before `our_letter` — the payoff beat — could ever fire.
    # `arcs/expiry` fails the build if this ever falls behind the path again.
    expiresAfterYears: 460
    maxConcurrentInstances: 1
    nodes:
      - id: aftermath
        event: seal_aftermath
        selection: first_match
        schedule: immediate
        successors:
          - to: presses
            when: { generation: { op: gte, value: 5 } }
          - to: presses

      - id: presses
        event: seal_the_grandson_presses
        selection: first_match
        schedule: { minYears: 45, maxYears: 120 }
        successors:
          # Recovered: the arc ends. The house paid, and that is the story.
          #
          # `fromChoice` rather than `fromOutcome` on purpose. The two say the
          # same thing here — one branch, one ending — and they stop saying it
          # the moment somebody adds a second way for the purchase to go. What
          # ends the arc is that the house bought the Seal back, not that the
          # buying went smoothly.
          - to: end
            fromChoice: buy_it_back
          # Answered, or left to lie. Either way it comes due at the worst
          # possible moment; the difference between them is remembered on the
          # arc and read two nodes down.
          - to: counted

      - id: counted
        event: seal_the_regalia_incomplete
        selection: first_match
        schedule: { minYears: 90, maxYears: 200 }
        successors:
          # A house that put its position in writing has a fourth beat coming,
          # because the writing outlives everyone who agreed to it. A house
          # that said nothing has nothing to be read back at it.
          - to: our_letter
            when: { arcFlag: answered_in_writing }
          - to: end

      - id: our_letter
        event: seal_our_own_letter_returns
        selection: first_match
        schedule: { minYears: 60, maxYears: 140 }
        successors:
          - to: end

proseVariants:
  - address: "content:arcs/seal.yaml#arcs[id=arc_the_given_seal].title"
    of: "62e16a5726863bb3"
    plainenglish: >-
      Who Gets the Seal
