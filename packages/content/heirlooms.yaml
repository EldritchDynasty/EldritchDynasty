# Things the house owns and applies to a person.
#
# The application mechanism is generic (`core/people/heirlooms.ts`). An
# heirloom says who it may be used on and what it does, in the same filter and
# effect vocabularies events use, and the engine does the rest. What differs
# between them is what USING one costs the heirloom:
#
#   consumed   gone afterwards
#   cooldown   usable again after `cooldownYears`
#   reusable   no cost and no wait
#
# `charges` composes with all three, which is why they are two fields.
heirlooms:
  - id: portion_of_agelessness
    name: A Portion of Agelessness
    kind: portion
    cannotBeSold: false
    use:
      spends: consumed
      charges: 1
    target:
      - { status: [alive] }
      - { age: { op: gte, value: 12 } }
    effects:
      # Years on the ceiling itself — the acquired layer, so it lengthens one
      # life and changes nothing the bearer's children inherit.
      - { kind: attribute, target: { slot: BEARER }, attr: max_age, delta: 42 }
      - { kind: attribute, target: { slot: BEARER }, attr: health, delta: 6 }
    chronicle: >-
      {BEARER} drank it in the small hall with four people watching, and there
      was no light and no sound and nothing to see. The change did not arrive
      for eleven years. Then it did not arrive again, and kept not arriving,
      and the house began to count.
    blurb: >-
      Forty-odd years added to a ceiling, and to nothing else. It does not make
      anyone young; it makes them take longer to stop.

  - id: portion_of_fertility
    name: A Portion of Fertility
    kind: portion
    use:
      spends: cooldown
      cooldownYears: 60
      charges: 3
    target:
      - { status: [alive] }
      - { age: { op: gte, value: 15 } }
      - { age: { op: lte, value: 48 } }
    effects:
      - { kind: attribute, target: { slot: BEARER }, attr: fertility, delta: 34 }
      - { kind: attribute, target: { slot: BEARER }, attr: health, delta: -3 }
    chronicle: >-
      They gave it to {BEARER} in water, because the woman who sold it said
      water and would not say why. It tasted of the cup. Whatever it did, it
      did quietly, and the house did not know whether to thank anyone until
      the following autumn.
    blurb: >-
      Three doses in the flask and sixty years between them, so it is never the
      same generation twice. What it buys is a chance, not a child.

  - id: the_unmirrored_eye
    name: The Unmirrored Eye
    kind: instrument
    cannotBeSold: false
    use:
      spends: cooldown
      cooldownYears: 5
      charges: 6
    target:
      - { status: [alive] }
      - { canExpress: true }
    effects:
      # Purchased Madness. Money buys a road to the God rung that eleven hours
      # of ordinary overflow does not open by itself (issue #15) — gated by
      # `canExpress` at the effect layer regardless, same as every other
      # source of Madness in the game (invariant 1).
      - { kind: madness, target: { slot: BEARER }, delta: 22 }
    chronicle: >-
      It came from the same road the flask did, wrapped in a cloth nobody in
      the house would later admit to owning. {BEARER} looked into it once, by
      lamplight, alone. What is written down afterwards is never what {BEARER}
      says happened.
    blurb: >-
      Six uses, five years apart. Nothing about it requires the blood to have
      done anything at all — only to be able to.

  # ── THE REGALIA ──────────────────────────────────────────────────────────────
  #
  # The three things that lay on the table in 1042, one of which the founder's
  # hand was on when it was over (`story/Age-1.md` §III). All three are Regalia,
  # all three must be held at once for Demigod, and until this file named them
  # the house owned none of them: `world.heirlooms` began every run empty, and
  # `seal_the_regalia_incomplete` counted two of three against a set of zero.
  # They are seeded now from `houses.yaml`, which is where a house says what it
  # already has.
  #
  # None of the three is a bonus. The seal opens doors that ought to stay shut,
  # the ring costs the two people in a thousand years it fits, and nobody has
  # ever established what the rod is for — which is why its `effects` are the
  # strangest list in this file and why it is the one the family argues about.
  - id: the_ninefold_seal
    name: The Nine-Fold Seal
    kind: regalia
    cannotBeSold: true
    use:
      spends: reusable
    target:
      - { status: [alive] }
      - { age: { op: gte, value: 16 } }
    effects:
      # A seal is a signature, and a signature is standing. His father used it
      # for leases; it is required for things that are not leases.
      - { kind: respect, delta: 1 }
      - { kind: attribute, target: { slot: BEARER }, attr: charm, delta: 4 }
    chronicle: >-
      {BEARER} set it in the wax in front of the Warden's clerk and the clerk
      counted the folds without being asked to, the way every clerk in the
      province has counted them since anybody can remember. Nine. It is always
      nine. Somebody at the back of the room said so out loud, and was not
      thanked for it.
    blurb: >-
      Brass, nine-fold, older than the hall. Reusable and unsellable, because a
      house that has sold its seal has not sold an object, it has stopped being
      able to say who it is.

  - id: the_ring
    name: The Ring
    kind: regalia
    cannotBeSold: true
    use:
      spends: cooldown
      cooldownYears: 40
      charges: 4
    target:
      # "It has fitted exactly two people in a thousand years and both of them
      # were trouble" — and trouble is what the EFFECTS below make them, not a
      # bar they had to clear to be chosen. A first draft asked `mind >= 62`
      # against an expected 30.4, then 42, and both were the same mistake: an
      # heirloom whose target filter nobody passes applies silently, does
      # nothing and reports nothing, and the beats built on it read as though
      # they worked. Rarity here is the arc (one instance, ever) and the
      # charges (four, forty years apart). It is not this list's job.
      - { status: [alive] }
      - { canExpress: true }
      - { age: { op: gte, value: 19 } }
    effects:
      - { kind: attribute, target: { slot: BEARER }, attr: mind, delta: 9 }
      - { kind: madness, target: { slot: BEARER }, delta: 12 }
    chronicle: >-
      It went on without being worked at, which had not happened in four
      generations and which the household noticed before {BEARER} did. Nobody
      said anything at supper. Two people went and looked at the portrait in the
      west passage afterwards, separately, and neither mentioned having gone.
    blurb: >-
      Too large for the founder and too large for his son. The family remembers
      four wearings, forty years apart, and has never yet decided
      whether the ring chooses badly or whether it is simply right about people.

  - id: the_rod
    name: The Rod
    kind: regalia
    cannotBeSold: true
    use:
      spends: cooldown
      cooldownYears: 25
      charges: 8
    target:
      - { status: [alive] }
      - { age: { op: gte, value: 12 } }
    effects:
      # Everybody has had a theory and nobody has established anything, so what
      # it does is small, real and unaccountable: a little health, a little
      # longevity, and no explanation anywhere for either. A house that used it
      # eight times over a thousand years would still not be able to say what it
      # is for, which is the design.
      - { kind: attribute, target: { slot: BEARER }, attr: health, delta: 5 }
      - { kind: attribute, target: { slot: BEARER }, attr: longevity, delta: 4 }
    chronicle: >-
      A yard of black wood with no marks on it, held for the length of a short
      conversation, and afterwards {BEARER} was warmer than the room and stayed
      warmer than the room for most of a day. The steward wrote down the hour.
      Four generations of stewards have written down the hour, and no two of them
      have written down the same thing happening.
    blurb: >-
      Nobody in the family has ever established what it is for and everybody has
      had a theory. Eight uses ought to be enough to test almost any of them
      and have never once been enough to settle one.

  # ── Two more instruments, and the arithmetic behind adding them ──────────
  #
  # `sellableHeirlooms` offers everything not `cannotBeSold` and not already
  # held, which was three objects against twenty-one spellbooks — so the
  # heirloom line of the auction was, in practice, the flask, the other flask,
  # and the eye. Two more takes it to five against twenty-one. That is a real
  # shift in what comes up at Sarrow and it is deliberately a small one: the
  # constant at the top of `announceLots` exists because the library drop
  # halved a chronicle page's share of every pick without anybody noticing for
  # a version, and doubling this line would be the same mistake wearing a
  # different label.
  #
  # Neither of these is a bonus. One is a book that is not a spellbook and
  # cannot be studied; the other is a quarter of one, in a hand nobody here
  # reads. Both come into the house through an authored outcome rather than
  # through the auction alone — `heirlooms.test.ts` counts the house's founding
  # possessions and `heirloom: grant` effects as the routes in, and an object
  # whose only way in is a lot that may never be drawn is an object some runs
  # can never see.
  - id: the_bramme_register
    name: The Bramme Register, Eleven Volumes
    kind: instrument
    cannotBeSold: false
    use:
      spends: reusable
    target:
      - { status: [alive] }
      - { age: { op: gte, value: 20 } }
    effects:
      # Not knowledge, not a flag, and nothing anybody can act on directly.
      # What eleven volumes of somebody else's attestations buy a reader is the
      # habit of looking at a document and asking who was paid to write it.
      - { kind: attribute, target: { slot: BEARER }, attr: mind, delta: 4 }
    chronicle: >-
      {BEARER} went through the fourth volume in eleven evenings and came out
      of it able to date a hand to within nine years. Nobody in the house asked
      what was in the other ten. Somebody in the house has read all of them
      now, and it is not the person the family would guess.
    blurb: >-
      A retiring notary's own register, dated and in one hand, running back to
      1088. It is not a spellbook, it cannot be studied, and it is the only
      object in this file that makes a reader better at reading.

  - id: the_forty_leaves
    name: The Forty Leaves
    kind: instrument
    cannotBeSold: false
    use:
      spends: reusable
    target:
      - { status: [alive] }
      - { age: { op: gte, value: 16 } }
    effects:
      # A quarter of an argument. Nobody at Ardwen reads the hand, so what a
      # reader gets out of it is the four hundred hours spent failing to, which
      # is not nothing and is not what anybody paid thirty-one crowns for.
      - { kind: attribute, target: { slot: BEARER }, attr: mind, delta: 3 }
    chronicle: >-
      {BEARER} had the leaves out on the long table for most of a winter, with
      the lamp moved down to that end and the household walking round it. The
      hand is not Ambric and is not Old Ambric and is not Yssene. On the last
      evening {BEARER} put them back in the oiled cloth and said nothing about
      it at supper, and said nothing about it ever again.
    blurb: >-
      Forty leaves off a Rimefell cart, out of a book nobody has the other
      three quarters of, in a hand nobody at Ardwen can read. It has no
      paperwork and will never have any, which is the second thing wrong with
      owning it.

