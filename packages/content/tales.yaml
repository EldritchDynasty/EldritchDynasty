      all the same; count to eleven and do not go up; the dogs went out at
      first light and would not go back in till noon, and dogs are the only
      thing in this parish that has never once been wrong about that house. It
      is four lines and a skipping step and it will outlast every document
      mentioned in this file. Nobody at Wick believes it. Nobody at Wick lets a
      child go up that hill at dusk either, and the two facts have lived
      comfortably side by side for four hundred years.

