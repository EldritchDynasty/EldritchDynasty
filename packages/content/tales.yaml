    circulatesFrom: { yearsAfterEvent: 2 }
    mutatesEveryYears: 260
    text: >-
      Minute of the nine sessions: the household attended on each day, answered
      on each day, and was at no point in contempt. We record further, since it
      was asked of us and since the asking is itself a matter of record, that
      the interval before the answer on the sixth day was longer than the
      intervals before the answers on the other eight. We draw nothing from it.
      This body records; it is for others, later, to draw.

  - id: what_bramme_said_the_inquest_was_for
