  - id: the_chapter_houses_composition
    form: doctrine
    teller: the chapter house at Bramme
    bias: institutional
    about: the_interdict
    accuracy: 0.6
    circulatesFrom: { yearsAfterEvent: 1 }
    mutatesEveryYears: 280
    text: >-
      The composition offered was ninety crowns and an admission of four
      lines, which is the ordinary form and has been the ordinary form since
      before any man now living was ordained, and the ordinary form exists
      precisely so that no household need believe what it signs. The interdict
      ran until it did not. This office does not record why it was lifted, the
      lifting of an interdict requiring no reason, which is a property of the
      instrument and not an oversight of the office.

  - id: the_eastern_chapter_houses_ledger
