    accuracy: 0.2
    circulatesFrom: { yearsAfterEvent: 0 }
    mutatesEveryYears: 40
    text: >-
      Nine days is a long time to sit in a town that has two fairs a year and
      nothing else, and Bramme made the most of it, and what Bramme decided the
      inquest was for changed daily and was never once what it was for. By the
      fourth day it was witchcraft. By the seventh it was money, which is what
      Bramme decides everything is. The rhyme that survives is about the
      summoner's hat and mentions the family not at all.

