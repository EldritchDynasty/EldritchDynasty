      at the foot of it a drain, and that the matter within the drain was in
      his judgement ordinary yard waste. Asked whether the drain was cut or
      worn, he answered that it was cut. Asked for what purpose a drain is cut
      to that fall, he answered that he was a mason and not a lawyer, and the
      clerk wrote both the question and the answer, which is the clerk's habit
      and the reason this document is still read.

