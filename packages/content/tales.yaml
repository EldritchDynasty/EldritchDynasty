# NESTED TALES (issue #14, ~5% of the text).
#
# No tale is neutral. Every one of these is performed by a named, biased
# teller and disagrees with at least one other account of the same event —
# `tales/accounts` (CI gate 8) fails the build otherwise. The player sees
# these accounts AND the simulation's own outcome, which is often neither.
#
# `about` names the event whose firing starts this tale's circulation clock
# (`circulatesFrom.yearsAfterEvent` after it fires) — not merely an event that
# cites it in `accounts`. A tale may be cited by several later events without
# any of them being what it is about.
tales:
  - id: ballad_of_the_given_seal
    form: song
    teller: the household singers of the Eldritch hall
    bias: wistful
    about: seal_aftermath
    accuracy: 0.35
    circulatesFrom: { yearsAfterEvent: 25 }
    mutatesEveryYears: 90
    text: >-
      They say the Seal was lent, and lending is a word with a door left open
      in it, and the singers who first shaped that word into a tune were paid,
      in their day, by the very house whose door it opened. It went west in a
      box slightly too fine for it, carried by a cousin no older than the
      grief he carried it beside, and it has not yet come home, though every
      third generation swears it is on its way. The song does not end. It only
      stops, each time, at the place where someone alive still hopes.

  - id: west_house_ledger_1502
    form: rival_chronicle
    teller: the stewards of the western hall
    bias: entitled
    about: seal_the_grandson_presses
    accuracy: 0.55
    circulatesFrom: { yearsAfterEvent: 5 }
    mutatesEveryYears: 200
    text: >-
      Item: the Seal, held by this hall since the year of its lawful
      bestowal, and bestowal, we note for whoever reads this after us, is not
      a word that requires renewal. The main house calls the matter unsettled
      because unsettled matters may yet be settled in its favour. We do not
      call it unsettled. We call it closed, and have called it closed for
      four generations, and will go on calling it closed for as many more as
      are required.

  - id: church_inquest_minute_1604
    form: doctrine
    teller: the registrars of the Church of the Nine Quiet Names
    bias: suspicious
    about: seal_the_regalia_incomplete
    accuracy: 0.6
    circulatesFrom: { yearsAfterEvent: 2 }
    mutatesEveryYears: 250
    text: >-
      Minute of the ninth session: the Regalia was produced for inspection
      and found, upon the registrars' own count, to number two where three
      were sworn to. The house's steward offered an explanation involving a
      western loan of long standing, which this body neither accepts nor is
      in a position to disprove, there being no third piece anywhere to
      examine. We record the shortfall. We record also that a house capable
      of counting to three has never yet miscounted by accident.

  - id: ballad_of_the_thumb_sized_bottle
    form: song
    teller: wandering singers on the low road
    bias: envious
    about: the_portion_of_agelessness
    accuracy: 0.2
    circulatesFrom: { yearsAfterEvent: 15 }
    mutatesEveryYears: 70
    text: >-
      There is a shop on no road anyone can point to twice, the singers tell
      it, and a woman in it who sells forty years the way other women sell
      bread, and the price of the bread is never spoken of by those who could
      afford it. We who could not afford it have made a song instead, which
      costs nothing and buys nothing and is, on the whole, the fairer trade.
      Sing it and grow old like everyone else. Someone has to.

  - id: a_scholars_footnote
    form: footnote
    teller: an unnamed annotator of House Ilm's library
    bias: dismissive
    about: the_portion_of_fertility
    houses: [house_ilm]
    accuracy: 0.65
    circulatesFrom: { yearsAfterEvent: 40 }
    mutatesEveryYears: 300
    text: >-
      See above, "flask, three doses." I have examined eleven such claims
      across as many houses and found in every case either an ordinary tonic
      sold at an extraordinary price, or nothing sold at all, only
      remembered as having been. The reader is free to believe the twelfth
      is different. I decline to number it among my examples until it
      produces something a physician could weigh.

  - id: ballad_of_the_ninth_day
    form: song
    teller: household nursemaids
    bias: fearful
    about: the_drowning
    accuracy: 0.3
    circulatesFrom: { yearsAfterEvent: 10 }
    mutatesEveryYears: 60
    text: >-
      Nine days in the water and the water at the temperature of the room,
      the nursemaids sing, low, to boys not yet old enough to know the song
      is about them. It does not say what the ninth day costs. It only says
      that a house pays it gladly, and has always paid it gladly, and will
      go on singing that it was glad long after gladness has left the room
      entirely.

  - id: marrow_chronicle_fragment_1188
    form: rival_chronicle
    teller: House Marrow's death-clerks
    bias: gloating
    about: the_drowning
    houses: [house_marrow]
    accuracy: 0.5
    circulatesFrom: { yearsAfterEvent: 8 }
    mutatesEveryYears: 220
    text: >-
      Word reaches us that the Eldritch boy was put to the old water-rite and
      rose from it altered, which those people call an awakening and we, who
      deal honestly in the currency of the dead, call a debt taken out
      against a child too young to have signed for it. We record the date.
      We expect to be recording another like it before the century turns,
      and we generally are.

  - id: marrow_chronicle_fragment_1408
    form: rival_chronicle
    teller: House Marrow's chroniclers, a later hand
    bias: contemptuous
    about: the_seal_questioned
    houses: [house_marrow]
    accuracy: 0.45
    circulatesFrom: { yearsAfterEvent: 6 }
    mutatesEveryYears: 220
    text: >-
      The Eldritch seat changed hands again this year, sideways, which is the
      word that house prefers to the word we would use. Our own dead keep
      better order than their living do. We set this down without further
      comment, there being nothing further that the facts themselves do not
      already say more plainly than we could.

  - id: ballad_of_the_nine_days
    form: song
    teller: the commons of nine burned towns
    bias: reverent
    about: the_burning_of_the_nine_libraries
    accuracy: 0.3
    circulatesFrom: { yearsAfterEvent: 20 }
    mutatesEveryYears: 100
    text: >-
      Nine days the fire travelled, never resting, never once outrun, and
      the towns it passed through have given it nine names, one to a day,
      though no two singers agree on the order. It is sung reverently now,
      the way ruin is sung once enough years have gone by that nobody living
      lost anything in it — and in the last verse, always, the one house
      left holding books is named, though not thanked, and the singers have
      never quite decided which of those two the house deserved.

  - id: ilm_lament_for_the_burned
    form: rhyme
    teller: the scholars of House Ilm
    bias: grieving
    about: the_burning_of_the_nine_libraries
    houses: [house_ilm]
    accuracy: 0.55
    circulatesFrom: { yearsAfterEvent: 3 }
    mutatesEveryYears: 180
    text: >-
      We had a library once, the lament runs, and a library is a kind of
      family, and ours is ash now on nine roads we no longer walk. Somewhere
      a single house keeps whole what the fire could not reach, and calls it
      rescue, and we — who lost what it did not — have not yet found the
      grief a word small enough to argue with. We only have the rhyme, and
      we teach it to our children before we teach them to read, because
      there is nothing left to read them from.

  - id: ballad_of_the_northern_house
    form: song
    teller: travelling singers who never learned the truth
    bias: credulous
    about: the_vessel_rite
    accuracy: 0.1
    circulatesFrom: { yearsAfterEvent: 12 }
    mutatesEveryYears: 85
    text: >-
      She went north, the song says, to a house with a kinder climate and a
      better name, and married well, and the singers who carry the tune from
      village to village have never once been asked to name the house or the
      husband, because a good story does not survive being checked. It is
      sung at weddings now, of all places, as though it were an ending
      rather than a door nobody has ever seen opened from the other side.

  - id: ballad_of_the_second_table
    form: song
    teller: the lesser hall's own fireside singers
    bias: proud
    about: the_accounts_of_the_smaller_house
    accuracy: 0.4
    circulatesFrom: { yearsAfterEvent: 18 }
    mutatesEveryYears: 95
    text: >-
      We keep our own accounts and we keep them well, the song goes, better
      sung in the smaller hall than the greater one has ever managed to
      notice, and noticing was never really the point of keeping them. Let
      the big house count its own books slowly. Ours have always balanced,
      and a family that balances its books is a family the road does not
      forget, whatever table it is seated at when the meat comes round.

  - id: hall_book_of_the_lesser_house
    form: rival_chronicle
    teller: the smaller hall's own clerk
    bias: resentful
    about: the_accounts_of_the_smaller_house
    accuracy: 0.6
    circulatesFrom: { yearsAfterEvent: 1 }
    mutatesEveryYears: 210
    text: >-
      Delivered this year, fair-copied, the whole of our accounts to the
      main table, unasked and unthanked, as is now the custom. The main
      house calls this a gift. We call it proof, offered again because it
      was apparently insufficient the last eleven times it was offered, that
      a smaller hall can keep better order than the hall that never has to.

  - id: ballad_of_the_river_road
    form: song
    teller: the commons who sheltered behind the gate
    bias: admiring
    about: what_came_up_the_river_road
    accuracy: 0.35
    circulatesFrom: { yearsAfterEvent: 9 }
    mutatesEveryYears: 75
    text: >-
      They came up the river road at night, the song remembers, with the
      confidence of men who had done it before and not been stopped, and
      were stopped, that once, by a man who stood at the gate because
      standing at the gate was apparently still something the old houses
      did. The commons sing it now the way they sing anything that happened
      to someone else and turned out, this once, to be worth the standing.

  - id: cawdry_garrison_log_1218
    form: footnote
    teller: the garrison log-keeper at Cawdry
    bias: begrudging
    about: what_came_up_the_river_road
    accuracy: 0.7
    circulatesFrom: { yearsAfterEvent: 1 }
    mutatesEveryYears: 260
    text: >-
      Arrived two days past the hour we were needed, as usual, and found the
      gate already held, which the house's own account credits entirely to
      itself. We would note that a garrison two days off is a garrison that
      was, in fact, coming, and that arriving second is not the same as
      arriving never. The distinction seems worth preserving somewhere, if
      only here.

  - id: ballad_of_the_empty_chair
    form: song
    teller: the house's own singers, in a hushed register
    bias: uneasy
    about: the_guardian_disagrees
    accuracy: 0.25
    circulatesFrom: { yearsAfterEvent: 14 }
    mutatesEveryYears: 80
    text: >-
      There is a chair kept at the table's head that nobody living sits in,
      the singers say, low, the way a thing is said when the room itself
      might be listening, and the Head himself does not sit in it either, on
      the years the chair has cause to disagree with him. We do not say who
      is in it. We have never once, in all the versions of this song, said
      who is in it, and every version agrees on that, which is the part that
      keeps us from calling it just a song.

  # ── The eleven years copied at Cawdry ────────────────────────────────────
  # Two accounts of one book. The clerk is vouching for the hand because he
  # accepted it; the alehouse is telling a better story than the one it has.
  # Neither of them has read the fortnight, and neither says so.
  - id: cawdry_clerks_endorsement
    form: footnote
    teller: a clerk of the Warden's record office at Cawdry
    bias: professional
    about: the_hand_the_warden_accepts
    accuracy: 0.7
    circulatesFrom: { yearsAfterEvent: 3 }
    mutatesEveryYears: 220
    text: >-
      Received of that house, eleven years entire, in one hand throughout, the
      dates ruled in the margin and the entries made close to their occasions,
      which this office does not often see and does not expect. Copies of this
      kind are taken as read. I note, because the note costs nothing and may
      one day cost somebody else a great deal, that a book made well is a book
      made by a man who intends it to be believed.

  - id: wick_alehouse_on_the_book
    form: rhyme
    teller: the alehouse at Wick, meaning nobody and everybody
    bias: knowing
    about: the_hand_the_warden_accepts
    accuracy: 0.3
    circulatesFrom: { yearsAfterEvent: 1 }
    mutatesEveryYears: 40
    text: >-
      Eleven years and every one of them fair, and the fair ones are the
      trouble, because a man who writes eleven fair years has had eleven years
      to decide what fair means. They sent it up to Cawdry in a box. Ask the
      carter what the box weighed going and ask him what it weighed coming
      back, and he will tell you the same, and he will tell it to you in a way
      that makes it plain he was asked before.

  # ── The index that left the house ────────────────────────────────────────
  # Four accounts across two beats of arc_what_went_with_her. None of the four
  # tellers knows what the quires actually are. Three of them are guessing in
  # their own favour and the fourth is a dinner story, which is the only one
  # anybody enjoys and the only one that travels.
  - id: bramme_chapter_house_note
    form: doctrine
    teller: the cataloguer's daughter at the Bramme chapter house
    bias: defensive
    about: archive_the_bookseller_at_cawdry
    accuracy: 0.75
    circulatesFrom: { yearsAfterEvent: 4 }
    mutatesEveryYears: 160
    text: >-
      My mother made that index in her own hours, on paper she bought, in a
      house that let her go in a thin year without a quarter's wages and
      without a word said at the gate. Copying is not theft. The law is
      perfectly clear and so is the chapter house, and anybody who wishes to
      say otherwise may come to Bramme and say it here. We have never sold
      anything of theirs. We have sold something of hers.

  - id: the_booksellers_list_at_cawdry
    form: footnote
    teller: the bookseller at Cawdry, in his own list
    bias: commercial
    about: archive_the_bookseller_at_cawdry
    accuracy: 0.4
    circulatesFrom: { yearsAfterEvent: 0 }
    mutatesEveryYears: 90
    text: >-
      Item forty-one. Eleven quires, one hand throughout, an index of a
      gentleman's library in the Nethering, with a chest of sermons. Nine
      crowns the lot. The hand is a good one and the library, by the look of
      what is listed in it, is very much better than the gentleman, and I say
      no more than that because I am in trade and not in law.

  - id: cawdry_assize_roll_item_nine
    form: rival_chronicle
    teller: the Warden's clerk of the record office at Cawdry
    bias: procedural
    about: archive_read_back_at_the_assize
    accuracy: 0.85
    circulatesFrom: { yearsAfterEvent: 1 }
    mutatesEveryYears: 300
    text: >-
      Item nine, entered as read: an index of a library in the Nethering,
      produced to date a boundary and admitted for that purpose only. Whether
      it be admitted for any other purpose is not a question this office
      answers, and was not asked. It is entered. It stays entered. That is the
      whole of what a record office is and the whole of what it is for.

  - id: the_advocates_dinner_story
    form: play
    teller: an advocate of Cawdry, after dinner, for the fourth time
    bias: amused
    about: archive_read_back_at_the_assize
    accuracy: 0.35
    circulatesFrom: { yearsAfterEvent: 6 }
    mutatesEveryYears: 45
    text: >-
      And I am reading — a weir, gentlemen, a weir, nine years of it — and I
      read out where some box or other is kept in some cellar or other, purely
      for the date, and there is a man at the back of that room who has come
      forty miles in the wet, and I watch him hear it. He does not move. That
      is how you know. A man who does not move when you read out his own cellar
      has an excellent reason not to move, and I have dined on that reason for
      eleven years and have never once had to name it.

  # ── The ring, and the two it fitted ──────────────────────────────────────
  # A song and a document about the same eleven years. The song is better and
  # the document is right, and the house has spent two hundred years unable to
  # act on either, because the four lines never wrote down the reason.
  - id: the_song_of_the_two_hands
    form: song
    teller: the household singers, and after them everybody
    bias: admiring
    about: ring_it_fits_again
    accuracy: 0.4
    circulatesFrom: { yearsAfterEvent: 12 }
    mutatesEveryYears: 70
    text: >-
      They sing that it went on without being worked at, which is true, and
      that the hall knew before the hand did, which is the kind of thing that
      is sung rather than known; and the middle staves are all of the eleven
      good years, the arguments won, the winter nobody starved in, the letter
      that came back from Caster in nine days instead of thirty. The song has
      no last stave. It was made while the eleven years were still going on and
      nobody has ever been willing to finish it, and the room, when it gets to
      the place where the ending should be, simply stops together and moves on
      to another song, and has done for two hundred years.

  - id: the_four_lines_of_that_night
    form: footnote
    teller: the house's own book, in a hand that signed and dated it
    bias: withholding
    about: ring_it_fits_again
    accuracy: 0.9
    circulatesFrom: { yearsAfterEvent: 0 }
    mutatesEveryYears: 400
    text: >-
      Item, that the Ring was upon the hand of one of this blood on the eve of
      the Greening. Item, that it was removed the same night. Item, that it was
      removed at the direction of the Head and by no other authority. Item,
      that this is entered so that it shall be known to have happened. There is
      no fifth line. Whoever wrote the four had the whole of a long night to
      write a fifth in, and knew what a book is for, and did not.

  # ── The rod, and the two hundred years of being right ────────────────────
  - id: ilm_note_on_the_nethering_rod
    form: doctrine
    teller: a lecturer of the Colleges, in a letter to House Ilm
    bias: dismissive
    about: rod_the_correlation_was_something_else
    houses: [house_ilm]
    accuracy: 0.5
    circulatesFrom: { yearsAfterEvent: 8 }
    mutatesEveryYears: 180
    text: >-
      You ask what I make of the Nethering rod and I make of it what I make of
      every object a provincial family has kept for four centuries without a
      warranted person ever having been allowed to look at it: that they have
      measured something, that they have measured it honestly, and that they
      have no framework whatever in which to have measured it correctly. Two of
      the blood in the room. It is very nearly good work. I would give a good
      deal to know what else was in that room, and they will not tell me, and I
      do not think it has occurred to them to wonder.

  - id: the_household_rule_as_taught
    form: charm
    teller: whoever is teaching the children that year
    bias: certain
    about: rod_the_correlation_was_something_else
    accuracy: 0.25
    circulatesFrom: { yearsAfterEvent: 0 }
    mutatesEveryYears: 60
    text: >-
      Two in the room and it answers, one in the room and it sleeps. That is
      all of it, and it is taught before the grates and before the counting and
      before the names of the tenant farms, and it is taught in those words and
      no others because a rule that gets improved is a rule that gets lost.
      There are children in this house who could say it before they could say
      the name of the river. Nobody teaching it has ever been asked how it is
      known and nobody teaching it has ever needed to be told.

  # ── The second obligation ────────────────────────────────────────────────
  - id: advocates_opinion_on_the_half_sheets
    form: footnote
    teller: an advocate of Cawdry who reads Old Ambric, at two marks a day
    bias: professional
    about: eight_days_which_one_we_keep
    accuracy: 0.8
    circulatesFrom: { yearsAfterEvent: 2 }
    mutatesEveryYears: 250
    text: >-
      Both readings are good. I say that as the whole of my opinion and not as
      the beginning of one, and I decline to be drawn further for any fee. The
      instrument is of a kind I have seen twice and both of those were older
      than this house and neither was in a language I would swear to. Were it a
      lease I should tell them to go back to the other party and ask, and I did
      tell them so, and I have thought about the way the room went afterwards
      rather more often than I would like.

  - id: the_house_on_its_own_second_obligation
    form: rival_chronicle
    teller: the Eldritch House, in its own book, about itself
    bias: settled
    about: eight_days_which_one_we_keep
    accuracy: 0.45
    circulatesFrom: { yearsAfterEvent: 20 }
    mutatesEveryYears: 120
    text: >-
      The second obligation is recorded in the founder's own hand and has been
      kept without interruption since the year of the signing, and the manner
      of its keeping is the manner set out below, and has never been in doubt
      in this house. Four generations have kept it so. It is a great comfort to
      the family, in an uncertain business, to have one part of it that is
      plain — and the sentence saying so has been copied forward, unaltered, by
      every chronicler this house has employed since the year it was written.

  # ── The afternoon the ink went ───────────────────────────────────────────
  - id: wick_on_the_afternoon_the_dogs_went_out
    form: rhyme
    teller: Wick, which had it from a carter who had it from a girl at the gate
    bias: frightened
    about: eight_days_and_then_it_did
    accuracy: 0.55
    circulatesFrom: { yearsAfterEvent: 1 }
    mutatesEveryYears: 35
    text: >-
      The dogs went out and stood in the wet with their backs to the house, and
      that is the part everybody agrees on, and it is the part nobody in the
      village will say twice in an evening. There was a smell of burning in a
      room with no fire in it. There was a paper on a table that went the
      colour of the table. And the rhyme has a fourth line, which changes with
      whoever is saying it, and has been four different things in sixty years,
      and every version of it is about something the family did a long time ago
      and would not now be able to undo.

  - id: the_heads_sentence_as_it_is_taught
    form: doctrine
    teller: each Head of the house, to the next, on the day of the seal
    bias: unflinching
    about: eight_days_and_then_it_did
    accuracy: 0.85
    circulatesFrom: { yearsAfterEvent: 30 }
    mutatesEveryYears: 400
    text: >-
      You are shown the sheet, and you are told this and nothing more: that on
      an ordinary afternoon four hundred years after it was written the ink of
      it went the colour of its own paper, that the other sheet did not, and
      that no one in this family knows what that meant or has ever been in a
      position to find out. Nine Heads have been told it. Not one of them has
      improved the sentence, though several were fond of improving sentences,
      and the reason is that the sentence stops exactly where the knowledge
      stops and everybody who has heard it has understood why that matters.

  # ── The one who went to Anvary ───────────────────────────────────────────
  # A foreign institution's paperwork and a village's arithmetic, about a man
  # neither of them could identify. The register is nearly true and useless.
  # The alehouse is nearly useless and has the one detail that matters.
  - id: corran_register_entry
    form: footnote
    teller: the proctors' register of the Colleges at Corran
    bias: procedural
    about: corran_what_came_back
    accuracy: 0.75
    circulatesFrom: { yearsAfterEvent: 0 }
    mutatesEveryYears: 400
    text: >-
      Entered in the fourth year, Terra, by examination; struck in the ninth,
      the reason not recorded, the hand not the registrar's usual. It is the
      practice of this house to record a reason and the practice has held for
      two hundred years without exception before this line and without
      exception after it. Whoever wishes to make something of that is welcome
      to. The Colleges are not in the business of knowing where anybody goes,
      only of knowing what they were taught while they were here.

  - id: wick_on_the_man_who_came_back
    form: rhyme
    teller: Wick, and specifically the girl who was on the gate that afternoon
    bias: unconvinced
    about: corran_what_came_back
    accuracy: 0.5
    circulatesFrom: { yearsAfterEvent: 2 }
    mutatesEveryYears: 40
    text: >-
      He knew the bad step on the cellar stair, and he knew the second cup, and
      he called the west passage what only the family calls it, and everybody
      up at the house made a great deal of all three. He did not know the dog.
      The dog had been in that yard eleven years and went to everybody, and
      went to him, and he put his hand out at the wrong height for it — the
      height you put your hand out at for a dog you have been told about. That
      is the whole of what I saw and I have never once been asked about it by
      anybody from that house.

  # ══════════════════════════════════════════════════════════════════════════
  # FOUR MORE CONTESTED THINGS, EIGHT MORE TELLERS
  # ══════════════════════════════════════════════════════════════════════════
  #
  # Each pair below is two accounts of one scene from `papers.yaml` and
  # `the_quiet_names.yaml`, and no pair agrees. The rule this file runs on is
  # `tales/accounts`: two accounts that agree are one account written twice,
  # and the build fails on them. What the simulation actually did is a third
  # thing, and the player is shown all three and told by nobody which is which.
  #
  # The register is the elevated one — these are the myth layer, not an event
  # body. Nothing here is reportage and nothing here is neutral, because the
  # only voice in this game that could be neutral is Daveed's, and he is the
  # least neutral thing in it.

  # ── The tops, and who holds them ─────────────────────────────────────────
  - id: the_stave_of_the_high_grazing
    form: song
    teller: the fell-graziers of the high Nethering
    bias: dispossessed
    about: the_fell_graziers_have_no_paper
    accuracy: 0.65
    circulatesFrom: { yearsAfterEvent: 8 }
    mutatesEveryYears: 60
    text: >-
      They had the hill before the province had a name for it, and they will
      tell you so on any evening you are unwise enough to buy the beer; that
      their grandmothers walked it up at Greening when the road below was a
      track and the hall below that was a heap of good intentions, and that in
      all those hundreds of summers nobody thought to write it down, because a
      thing everybody knows does not require a pen. The song's whole argument
      is that sentence, and the song is wrong, and every man singing it knows
      exactly how wrong and sings it anyway. It ends on the word paper. It has
      always ended on the word paper, and it is sung slower there.

