    text: >-
      One sheet, unasked for and unpaid, rendering a page of Old Ambric into
      Ambric with the doubtful words marked doubtful and the guessed words
      marked guessed, which is more honesty than this family has ever been
      shown in a document. It is a grant of pasture. It is a grant of pasture
      in every line, and the pasture named in it has been under water since
      1104, and the archdeacon knew that and translated it anyway.

  - id: the_clerks_six_words
    form: footnote
    teller: the archdeacon's clerk, on the ride back to Bramme
    bias: dutiful
    about: the_archdeacon_at_the_shelf
    accuracy: 0.8
    circulatesFrom: { yearsAfterEvent: 1 }
    mutatesEveryYears: 300
    text: >-
      Six words, written on a knee, on a road, in weather: asked for the shelf;
      not shown. Six words are not an accusation and were not meant as one, and
      a clerk who wrote nine hundred entries in his career meant nothing
      whatever by these. But six words in a satchel become a line in a file,
      and a line in a file becomes a reason to ride up a hill, and the man who
      rode up the hill in 1288 had never heard of the clerk.

  - id: the_letter_that_was_not_signed
