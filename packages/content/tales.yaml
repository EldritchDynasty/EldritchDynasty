    accuracy: 0.75
    circulatesFrom: { yearsAfterEvent: 0 }
    mutatesEveryYears: 400
    text: >-
      The roll says a woman lies there and has said so since 1071 in a hand
      four keepers have certified, and the roll does not argue and has never
      needed to. What is under the stone is a matter for whoever lifted it. What
      is on the roll is a matter for the Church, and the Church has kept the
      count without a break since year 180, and where the ground disagrees with
      the roll it has always been the ground that was found to have been
      disturbed.

  - id: the_reeves_book_of_the_orchard
