      household in the Nethering; refused. Entered beneath it, in the same
      hand: offered at sixty crowns to a household at Cawdry; taken. The ledger
      keeps a third column which is not money and has no heading, and in that
      column beside the first entry there is a single mark, and nobody alive
      now knows what the mark means, and every archivist who has read the
      ledger has wanted to.

  - id: what_the_parish_thought_of_the_refusal
