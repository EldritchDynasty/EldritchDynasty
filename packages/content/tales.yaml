    teller: the parish at Wick, over four generations
    bias: excluded
    about: the_relic_offered
    accuracy: 0.35
    circulatesFrom: { yearsAfterEvent: 10 }
    mutatesEveryYears: 50
    text: >-
      Nine days a year the chapel at Cawdry is open to anybody who walks to
      it, and the chapel on the hill is open on none of them, and Wick has had
      four generations to decide what that means. What Wick decided is a charm
      you say at your own door on the nine days instead, and it is a perfectly
      pious charm, and every word of it is about a door that does not open.

  - id: the_archdeacons_own_translation
