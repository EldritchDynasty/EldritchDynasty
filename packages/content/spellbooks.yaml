  - address: "content:spellbooks.yaml#spellbooks[id=lesser_workings_of_thermal].blurb"
    of: 265d37a4a87ed5d8
    plainenglish: >-
      Explains how to keep a hearth burning during a siege, or put one out from across a room.
  - address: "content:spellbooks.yaml#spellbooks[id=lesser_workings_of_aero].blurb"
    of: 2de22674f5a6a600
    plainenglish: >-
      Written for sailors, but more useful to archers.
  - address: "content:spellbooks.yaml#spellbooks[id=lesser_workings_of_terra].blurb"
    of: c26709dd13eb57a1
    plainenglish: >-
      Explains how to build foundations that do not settle and how to find buried things before
