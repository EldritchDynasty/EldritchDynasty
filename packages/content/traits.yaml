# Traits are the extensibility surface. Each declares its own influence in two
# flavours: PRESENCE (it exists, in some scope) and DISPATCH (it was chosen for
# a mission). Adding "the family employs a competent midwife and fewer infants
# die" is a content edit, not an engine change. That is the entire point.
traits:
  - id: reads_the_signs
    name: Reads the Signs
    tags: [retainer, knowledge, women]
    acquisition: { kind: assigned }
    description: >-
      She can tell what a girl is carrying by how the room behaves around her.
      Every house has a folk theory about the signs and every theory disagrees;
      hers happens to be right more often than not.
    presence:
      - scope: household
        modifiers:
          - { kind: reveal_signs, power: 0.7 }
          - { kind: event_weight, match: { tags: [birth] }, multiply: 1.4 }

  - id: competent_physician
    name: A Competent Physician
    tags: [retainer, medicine]
    acquisition: { kind: assigned }
    description: >-
      The most interesting presence effects are the ones where nothing happens.
      She does not add a bonus to the plague; she removes a branch of it. The
      family learns what she was worth when she dies.
    presence:
      - scope: household
        modifiers:
          - { kind: suppress, match: { tags: [infant_death] } }
          - { kind: event_weight, match: { tags: [plague] }, multiply: 0.55 }

  - id: the_tutors_aphorisms
    name: The Tutor's Aphorisms
    tags: [tutor, warmth]
    acquisition: { kind: assigned }
    description: >-
      His lines become the family's aphorisms, quoted in the chronicle for
      centuries by people who never met him.
    presence:
      - scope: household
        modifiers:
          - { kind: attribute, attr: mind, delta: 3, target: children }
          - { kind: event_weight, match: { tags: [study] }, multiply: 1.5 }

  - id: sign_of_the_blood
    name: Sign of the Blood
    tags: [omen, hidden]
    acquisition: { kind: sign, perFontPoint: 0.018 }
    description: >-
      Iron that dulls where she has slept. Milk that turns sweet. Unreliable,
      cheap, everywhere — and every marriage-broker in the province has an
      opinion about it.

  - id: early_waking
    name: Early Waking
    tags: [omen, honest_signal]
    acquisition: { kind: assigned }
    description: >-
      She woke at nine, in front of witnesses. The one signal in a marriage
      market otherwise built entirely on forged documents: unfakeable, publicly
      seen, and worth more than any notarised pedigree.
    presence:
      - scope: house
        modifiers:
          - { kind: event_weight, match: { tags: [marriage, suitor] }, multiply: 1.8 }

  - id: hard_hands
    name: Hard Hands
    tags: [soldier, dispatch]
    acquisition: { kind: threshold, attr: strength, atLeast: 55 }
    dispatch:
      - whenCastAs: [family_member, head]
        modifiers:
          - { kind: check_bonus, match: { tags: [violence] }, delta: 12 }

  - id: bought_grandmother
    name: A Bought Grandmother
    tags: [pedigree, forgery]
    acquisition: { kind: assigned }
    description: >-
      Three generations of maternal records, notarised, and every page of it
      purchased. The documents are a forgery-prone substitute for the one proof
      that actually exists, which is what her sons turn out to be.
    presence:
      - scope: house
        modifiers:
          - { kind: event_weight, match: { tags: [scandal, pedigree] }, multiply: 1.6 }

  - id: keeps_a_night_watch
    name: Keeps a Night Watch
    tags: [retainer, soldier, vigilance]
    acquisition: { kind: assigned }
    description: >-
      Somebody is awake in this house at every hour that matters, in a
      rotation nobody wrote down and everybody still keeps. Three generations
      of trouble on the river road have found the gate already barred.
    presence:
      - scope: household
        modifiers:
          - { kind: unlock, grants: gate_watch }
          - { kind: outcome_weight, match: { tags: [vigilance] }, multiply: 1.8 }

  - id: hardened_by_the_line
    name: Hardened by the Line
    tags: [soldier, career]
    acquisition: { kind: career, career: military, afterYears: 10 }
    description: >-
      Ten years in a commission bought, not earned, and it stops mattering how
      it was bought. What is left is a man who does not flinch at the things
      that make other men flinch.
    dispatch:
      - whenCastAs: [family_member, head]
        modifiers:
          - { kind: check_bonus, match: { tags: [violence] }, delta: 8 }

  - id: keeps_the_tollgate
    name: Keeps the Tollgate
    tags: [retainer, trade]
    acquisition: { kind: assigned }
    description: >-
      A plank bridge, a chain, and a rate nobody has argued down in forty
      years. It is not much, set against the treasury. It is never nothing.
    presence:
      - scope: household
        modifiers:
          - { kind: resource, resource: toll, perYear: 4 }

  # ── The three posts the game declared and never hired for ───────────────
  # `RetainerRoleS` has always listed eight roles. Five were filled by a
  # template; `physician`, `singer` and `chronicler` were names in a union with
  # nothing behind them, which is the failure mode this repo is named after.
  # Each of the three now arrives with a presence effect and an `unlock`, and
  # the unlock is what gives the events below something to gate on.
  - id: keeps_the_sickroom
    name: Keeps the Sickroom
    tags: [retainer, medicine, vigilance]
    acquisition: { kind: assigned }
    description: >-
      Boiled linen, a window opened at the hour she says and not before, and a
      rule about who may be in the room that she enforces against the Head
      himself. None of it is understood by anybody, including her. All of it
      works, and the house cannot say by how much, because what it buys is a
      list of years in which nothing happened.
    presence:
      # The unlock and the health, and DELIBERATELY nothing about the plague.
      # `competent_physician` already multiplies plague weight by 0.55 and the
      # physician's template carries both traits, so a second 0.7 here stacked
      # to 0.385 — and a house with a physician in post stopped seeing the
      # Plague's own content at all. `who_gets_the_physician` went from 2% of
      # runs to never. A trait that suppresses the Age it exists for is a
      # trait that deletes the scene it was written to be in.
      - scope: household
        modifiers:
          - { kind: unlock, grants: sickroom }
          - { kind: suppress, match: { tags: [infant_death] } }
          - { kind: attribute, attr: health, delta: 2, target: household }

  - id: keeps_the_house_songs
    name: Keeps the House Songs
    tags: [retainer, folklore, warmth]
    acquisition: { kind: assigned }
    description: >-
      Eleven staves nobody else has, and the turn of each one held back until
      the room is full enough to finish it. What the house is paying for is not
      the singing. It is that the version sung at Ardwen is the version the
      Wayfolk carry out of Ardwen, and a house that lets a stranger set the
      tune has already lost the argument about what happened.
    presence:
      - scope: house
        modifiers:
          - { kind: unlock, grants: house_songs }
          - { kind: event_weight, match: { tags: [folklore, feast] }, multiply: 1.5 }
          - { kind: outcome_weight, match: { tags: [reputation] }, multiply: 1.4 }

  - id: keeps_a_fair_hand
    name: Keeps a Fair Hand
    tags: [retainer, records, literacy]
    acquisition: { kind: assigned }
    description: >-
      A clerk's hand, ruled lines, dates in the margin, and an entry made the
      same week the thing happened rather than forty years later by a man
      remembering. The Warden's clerk accepts his copies without a second
      reading, which is worth more at the assize than any oath the house can
      swear.
    presence:
      - scope: household
        modifiers:
          - { kind: unlock, grants: fair_hand }
          - { kind: event_weight, match: { tags: [records, law] }, multiply: 1.4 }
          - { kind: attribute, attr: mind, delta: 1, target: children }

  # The fourth of the posts to get an unlock, and the one that was already
  # hired. The archive was addressable by nothing: a `retainer` slot casts
  # whoever is in the house wearing a contract, and there is no filter for
  # which contract. A trait is how a post becomes a person an event can name.
  - id: keeps_the_house_archive
    name: Keeps the House Archive
    tags: [retainer, records, knowledge]
    acquisition: { kind: assigned }
    description: >-
      Eleven quires of index, in one hand, covering four hundred years of a
      house that has never once thrown anything away. She did not write most of
      what is in the presses. She wrote where all of it is, which turns out to
      be the more valuable document and the harder one to keep.
    presence:
      - scope: household
        modifiers:
          - { kind: unlock, grants: house_archive }
          - { kind: event_weight, match: { tags: [records, library] }, multiply: 1.35 }


  # ══════════════════════════════════════════════════════════════════════════
  # WHAT A CAREER LEAVES ON A PERSON
  # ══════════════════════════════════════════════════════════════════════════
  #
  # `careers.yaml` names eight placements. `TraitAcquisitionS` has a `career`
  # arm, `tickCareers` implements it, and exactly one trait in this file used
  # it — so seven of the eight careers were, in trait terms, a line of income
  # and nothing else. A man could hold the advocate's post for forty years and
  # the house would be no better at the assize on the day he died than on the
  # day he was sworn.
  #
  # These seven complete that. Every one is acquired automatically by the
  # existing pipeline after a term long enough to have changed somebody, and
  # every one goes away when the last holder dies, which is the point: a career
  # is Respect bought with a body or a bloodline, and this is the part of the
  # purchase the house actually gets to keep for a while.
  #
  # NOT ONE OF THEM PAYS A WAGE EITHER, and that is the second thing learned
  # writing them. `tickEconomy` sums every `resource` modifier PER PERSON over
  # the whole roster, and a roster runs to sixty-odd people — so `keeps_the_
  # tollgate` at 4 a year is one unique gatekeeper and a career trait at 5 a
  # year is however many merchants the house happens to be running, for as
  # long as it runs them. The first draft of this block put 5 on the merchant
  # and 7 on the factor and the median thousand-year treasury went from 5,068
  # to 7,720. A career already pays an income in `careers.yaml`; a trait that
  # pays a second one is the same money counted twice.
  #
  # NOT ONE OF THEM TOUCHES THE DRAW, and that is the whole of what was learned
  # writing them. `keeps_the_sickroom` is the standing lesson in this file from
  # the suppressing side: two traits at 0.55 and 0.7 on one tag deleted the Age
  # they were written for. Boosting is the same instrument held the other way
  # up — a tag lifted 1.3x is every untagged template in the pool pushed down,
  # and a household holding four careers at once was pushing four tags at once.
  # Measured, the first draft of this block (five `event_weight` modifiers,
  # none above 1.3) took the inline two-beat scene in `wend.yaml` from 53% of
  # runs to 35% without a line of that scene changing. These pay out in
  # `check_bonus`, `attribute` and `resource` instead: a career makes the
  # person better at the thing, and leaves the year's weather alone.

  - id: ordained_and_useful
    name: Ordained, and Useful
    tags: [clergy, career, church]
    acquisition: { kind: career, career: clergy, afterYears: 12 }
    description: >-
      Twelve years in the chapter house and he knows which archdeacon reads
      what, which questions are asked because the form requires them, and how
      long a visitation can be kept to ten questions out of eleven. He cannot
      inherit and cannot marry and is, for those exact reasons, the only member
      of this family the Church has ever been entirely relaxed about.
    presence:
      - scope: house
        modifiers:
          - { kind: check_bonus, match: { tags: [church] }, delta: 7 }

  - id: knows_who_to_ask
    name: Knows Who to Ask
    tags: [court, career, standing]
    acquisition: { kind: career, career: court, afterYears: 14 }
    description: >-
      Fourteen years of standing near enough to power to be seen at it, which
      buys nothing at all until the year it buys everything. What he has is not
      influence. It is the seating plan, four hundred names, and a reliable
      sense of which of them is about to stop mattering.
    presence:
      - scope: house
        modifiers:
          - { kind: check_bonus, match: { tags: [marriage] }, delta: 6 }
          - { kind: attribute, attr: charm, delta: 2, target: children }

  - id: prices_everything
    name: Prices Everything
    tags: [merchant, career, money]
    acquisition: { kind: career, career: merchant, afterYears: 10 }
    description: >-
      Ten years on the turn and he can no longer look at a room without
      totalling it. No standing whatsoever comes of this and the treasury does
      not care about standing. What the house gets is a man who has never once
      been surprised by a price, including the ones it did not want quoted.
    presence:
      - scope: household
        modifiers:
          - { kind: check_bonus, match: { tags: [money] }, delta: 8 }
          - { kind: attribute, attr: mind, delta: 1, target: self }

  - id: reads_faster_than_he_should
    name: Reads Faster Than He Should
    tags: [scholar, career, study]
    acquisition: { kind: career, career: scholar, afterYears: 9 }
    description: >-
      Nine years with no income and no standing, and at the end of it a man who
      gets through a volume in the time the last one took to get through the
      index. He cannot explain how. Neither can anybody at Corran, which is
      why the Colleges take nine years over it rather than four.
    presence:
      - scope: household
        modifiers:
          - { kind: check_bonus, match: { tags: [study] }, delta: 6 }
          - { kind: attribute, attr: mind, delta: 2, target: children }

  - id: reads_old_ambric
    name: Reads Old Ambric
    tags: [advocate, career, law, literacy]
    acquisition: { kind: career, career: advocate, afterYears: 8 }
    description: >-
      Four years to buy the reading and four more to stop needing the
      dictionary, and after that the house never again pays two marks a day to
      a man who will not tell it what a formula means. The Church's liturgy,
      the law's formulas and a physician's labels are the same dead language,
      and he is now the only person at Ardwen who has noticed that.
    presence:
      - scope: house
        modifiers:
          - { kind: check_bonus, match: { tags: [law] }, delta: 8 }
          - { kind: check_bonus, match: { tags: [contract] }, delta: 6 }

  - id: keeps_the_letter_of_credit
    name: Keeps the Letter of Credit
    tags: [factor, career, money, bracc]
    acquisition: { kind: career, career: factor, afterYears: 11 }
    description: >-
      Cross-border payment moves by letter drawn on a Braccish house at two per
      cent and a month's delay, and a family with its own man in that chain
      keeps the two per cent and hears things a month early. Eleven years in
      and he is in the chain rather than at the end of it. He swears on the
      weight now, in front of the keeper, and nobody at Wick knows what to make
      of that.
    presence:
      - scope: household
        modifiers:
          - { kind: check_bonus, match: { tags: [records] }, delta: 5 }
          - { kind: check_bonus, match: { tags: [money] }, delta: 5 }

  - id: eleven_days_east
    name: Eleven Days East
    tags: [sea, career, sarrow, hardship]
    acquisition: { kind: career, career: sea, afterYears: 9 }
    description: >-
      Sarrow, eleven days east, and nine years of the widest income swing on
      the list in both directions, which is one fact about weather. What comes
      home is a man who is calm in a way the hall finds unnerving and who
      cannot be told anything about a hard winter.
    presence:
      - scope: household
        modifiers:
          - { kind: check_bonus, match: { tags: [hardship] }, delta: 6 }
          - { kind: attribute, attr: health, delta: 1, target: household }

  # THE LADDER'S MEMORY OF A MAN (#341). Neither does anything by presence;
  # each is what `the_ladder.yaml` reads to ask him the second question rather
  # than the first one again.
  - id: went_past_the_book
    name: Past the Book
    tags: [ladder, madness, library]
    acquisition: { kind: assigned }
    description: >-
      He read a greater work past the place where it stops explaining, and it
      worked. He is quicker since, and harder to surprise, and nobody has asked
      him what else changed.

  - id: asked_for_in_wick
    name: Asked For in Wick
    tags: [ladder, madness, wick]
    acquisition: { kind: assigned }
    description: >-
      He cleared the mill race above Wick in an afternoon. The village has not
      forgotten, and it has not been told what the afternoon cost.

