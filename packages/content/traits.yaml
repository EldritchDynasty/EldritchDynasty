    plainenglish: >-
      Reads Unnaturally Fast
  - address: "content:traits.yaml#traits[id=reads_faster_than_he_should].description"
    of: "df9d6d1ab1cfd586"
    plainenglish: >-
      Nine years with no income and no standing, and at the end of it a man who finishes a whole
      book in the time the last one took him to get through its index. He cannot explain how.
      Nobody at Corran can either, which is why the Colleges take nine years over it instead of
      four.
  - address: "content:traits.yaml#traits[id=reads_old_ambric].name"
    of: "f2882bf36156ae67"
    plainenglish: >-
      Can Read Old Ambric
  - address: "content:traits.yaml#traits[id=reads_old_ambric].description"
    of: "3249b1e5299a7e79"
    plainenglish: >-
      Four years to learn to read it and four more to stop needing the dictionary, and after
      that the house never again pays two marks a day to a man who will not tell it what a
      formula means. The Church's services, the law's set phrases and a physician's labels are
      all the same dead language, and he is now the only person at Ardwen who has noticed.
  - address: "content:traits.yaml#traits[id=keeps_the_letter_of_credit].name"
    of: "376c8b78526c3f4c"
    plainenglish: >-
      Handles the Letters of Credit
  - address: "content:traits.yaml#traits[id=keeps_the_letter_of_credit].description"
    of: "af21613a491d2aee"
    plainenglish: >-
      Money that crosses a border moves by a letter drawn on a Braccish bank, at a cost of two
      percent and a month's wait. A family with its own man in that chain keeps the two percent
      and hears the news a month early. After eleven years he is part of the chain, not at the
      end of it. He swears his oath on the weight now, in front of the keeper, and nobody at
      Wick knows what to think of that.
  - address: "content:traits.yaml#traits[id=eleven_days_east].name"
    of: "e5461fe8cb489f74"
    plainenglish: >-
      Eleven Days to the East
  - address: "content:traits.yaml#traits[id=eleven_days_east].description"
    of: "675f55e78697be93"
    plainenglish: >-
      Sarrow is eleven days east, and its nine years bring the biggest swings in income on the
      list, up and down, all because of the weather. The man who comes home is calm in a way
      that unsettles the hall, and nobody can tell him anything about a hard winter.
  - address: "content:traits.yaml#traits[id=went_past_the_book].name"
    of: "78ef604b4123732f"
    plainenglish: >-
      Went Beyond the Book
  - address: "content:traits.yaml#traits[id=went_past_the_book].description"
    of: "025dc771c8713ca5"
    plainenglish: >-
      He kept reading a greater work after the point where it stops explaining itself, and it
      worked. He has been quicker since, and harder to surprise, and nobody has asked him what
      else changed.
  - address: "content:traits.yaml#traits[id=asked_for_in_wick].name"
    of: "bc9b21974882ee53"
    plainenglish: >-
      Wanted in Wick
  - address: "content:traits.yaml#traits[id=asked_for_in_wick].description"
    of: "f3f0c8ff73b8b7d3"
    plainenglish: >-
      He cleared the mill stream above Wick in one afternoon. The village has not forgotten, and
      nobody has told it what that afternoon cost.
