# A house is, mechanically, an allele frequency distribution. This is what
# makes the marriage market's vocabulary literal rather than flavour:
# "deep blood" is a nonzero fontCarrierRate, "a thin line" is a high
# deleteriousLoad with no font, "a bought grandmother" is a forged document.
houses:
  - id: house_gearithy
    name: The Eldritch House
    isPlayerHouse: true
    respect: known
    wealth: 240
    # The third thing given in 1042 was the keeping, on condition the family
    # held what it was given "in a hand that could be shown". These are it.
    heirlooms: [the_ninefold_seal, the_ring, the_rod]
    # What the house has been reading since before the signing. Two Threshold
    # books, because those are the ones its women may read and a house that
    # spends whole generations in Regency keeps the books its regents can use.
    # Measured in `gate:blood`: the shelf used to stand empty until about 1250,
    # which put the ladder's book gate two centuries after its blood gate.
    library: [lesser_workings_of_light, lesser_workings_of_life]
    blurb: Yours. In 1042 your ancestor signed something.
    genePool:
      house: house_gearithy
      fontCarrierRate: 1.0        # the font exists nowhere else in the world
      deleteriousLoad: 0.08
      # The family's own font frequencies. Rich, but nowhere near saturated —
      # concentration is something the player breeds toward over generations,
      # not something the founding line is handed.
      frequencies:
        font_1: [{ allele: font_1_null, p: 0.30 }, { allele: font_1_faint, p: 0.30 }, { allele: font_1_deep, p: 0.28 }, { allele: font_1_burning, p: 0.12 }]
        font_2: [{ allele: font_2_null, p: 0.34 }, { allele: font_2_faint, p: 0.30 }, { allele: font_2_deep, p: 0.26 }, { allele: font_2_burning, p: 0.10 }]
        font_3: [{ allele: font_3_null, p: 0.36 }, { allele: font_3_faint, p: 0.32 }, { allele: font_3_deep, p: 0.24 }, { allele: font_3_burning, p: 0.08 }]
        font_4: [{ allele: font_4_null, p: 0.40 }, { allele: font_4_faint, p: 0.32 }, { allele: font_4_deep, p: 0.20 }, { allele: font_4_burning, p: 0.08 }]
        font_5: [{ allele: font_5_null, p: 0.44 }, { allele: font_5_faint, p: 0.30 }, { allele: font_5_deep, p: 0.20 }, { allele: font_5_burning, p: 0.06 }]
        font_6: [{ allele: font_6_null, p: 0.48 }, { allele: font_6_faint, p: 0.30 }, { allele: font_6_deep, p: 0.17 }, { allele: font_6_burning, p: 0.05 }]

  - id: house_marrow
    name: House Marrow
    respect: eminent
    wealth: 900
    blurb: >-
      Always wants Death texts. Their chronicle is buyable at auction, which is
      how a Discrepancy gets proven.
    motives:
      - { wants: [death, darkness], refuses: [], bidsUpTo: 800 }
    genePool:
      house: house_marrow
      fontCarrierRate: 0.05        # genuinely deep blood, and they know it
      deleteriousLoad: 0.22        # they have been marrying cousins too
      frequencies:
        death_1: [{ allele: death_1_strong, p: 0.34 }]
        death_2: [{ allele: death_2_trace, p: 0.4 }]

  - id: house_calder
    name: House Calder
    respect: regarded
    wealth: 430
    blurb: Soldiers. Thin on affinity, heavy on Strength, and cheap to marry.
    genePool:
      house: house_calder
      fontCarrierRate: 0.008
      deleteriousLoad: 0.06
      frequencies:
        strength_6: [{ allele: strength_6_gift, p: 0.3 }]

  - id: house_ilm
    name: House Ilm
    respect: regarded
    wealth: 610
    blurb: >-
      Scholars and light. They will not say what they do with it, and the
      Church has stopped asking.
    motives:
      - { wants: [light, life], refuses: [death], bidsUpTo: 500 }
    genePool:
      house: house_ilm
      fontCarrierRate: 0.021
      deleteriousLoad: 0.12
      frequencies:
        light_1: [{ allele: light_1_strong, p: 0.28 }]
        life_2: [{ allele: life_2_trace, p: 0.35 }]

  - id: the_church
    name: The Church of the Nine Quiet Names
    respect: exalted
    wealth: 4000
    blurb: >-
      Holds that the law is divine and the practice is abominable, and has
      never resolved the contradiction, which is why it can be bribed.
    motives:
      - { wants: [light], refuses: [death, darkness], bidsUpTo: 2000 }
    genePool:
      house: the_church
      fontCarrierRate: 0
      deleteriousLoad: 0.1

  - id: commons
    name: The Commons
    respect: unknown
    wealth: 20
    blurb: Servants, hirelings, and whoever the house buys this decade.
    genePool:
      house: commons
      fontCarrierRate: 0.002
      deleteriousLoad: 0.09

  # ── Two more houses ──────────────────────────────────────────────────────
  # A house is an allele frequency distribution with money and an opinion. The
  # four above are the province; these two are the two directions the province
  # is not — the counting house every cross-border payment in this world passes
  # through, and the quarry village that has married only itself for three
  # hundred years (world file §22). One is where the money is from and the
  # other is what happens to a bloodline that never leaves.
  - id: house_bracc
    name: The Braccish Counting House
    respect: eminent
    wealth: 2200
    blurb: >-
      Not a family and not quite a house: a weight standard, a ledger and four
      generations of the same eleven surnames. Everything anybody in the
      Settled Lands owes anybody else is weighed against their reckoning, at
      their counting house, for their cut.
    motives:
      # 500, not the 1400 this had in its first draft. A counting house is not
      # a collector, and a rival ceiling above every other house's — Marrow's
      # is 800 — meant the player lost essentially every contested lot: three
      # auction tests went red at once, all of them "the winning bid did not
      # win". A house's `bidsUpTo` is a ceiling on somebody else's game.
      - { wants: [terra], refuses: [death], bidsUpTo: 500 }
    genePool:
      house: house_bracc
      fontCarrierRate: 0.0
      deleteriousLoad: 0.11
      frequencies:
        # Mind, and nothing else remarkable. Four hundred years of selecting
        # for people who can hold a column of figures in their heads.
        mind_2: [{ allele: mind_2_d, p: 0.3 }, { allele: mind_2_c, p: 0.3 }]
        mind_5: [{ allele: mind_5_d, p: 0.26 }, { allele: mind_5_c, p: 0.3 }]

  - id: house_hesk
    name: The Quarry Families of Hesk
    respect: known
    wealth: 90
    blurb: >-
      Eighteen miles north, one trade, and three hundred years of marrying
      each other. Every roof in the province including the one that leaks. They
      have never been rich and have never once been asked to leave anywhere.
    genePool:
      house: house_hesk
      fontCarrierRate: 0.0
      # The highest load in this file, and it is the whole characterisation:
      # a closed pool is a cheap marriage and an expensive grandchild.
      deleteriousLoad: 0.31
      frequencies:
        strength_2: [{ allele: strength_2_d, p: 0.3 }, { allele: strength_2_c, p: 0.32 }]
        strength_5: [{ allele: strength_5_d, p: 0.26 }, { allele: strength_5_c, p: 0.3 }]


  # ── Four more pools: the peoples, as allele frequencies ──────────────────
  # World §22 lists eleven peoples and four resident foreign communities, and
  # until now the marriage market could draw from exactly three of them plus
  # `commons`. That is the whole reason every suitor card read the same: the
  # vocabulary existed in prose and the distribution behind it did not.
  #
  # None of these four carries `motives`, and that is deliberate. A `motive` is
  # an auction bidder and a ceiling on somebody else's game — house_bracc's
  # first draft cost the player three contested lots at once. These are gene
  # pools with a reputation, not new competitors at Sarrow.
  - id: house_yssanne
    name: The Yssene Houses
    respect: regarded
    wealth: 60
    blurb: >-
      Perhaps nine families in the whole kingdom, exiled or married in, poor,
      immaculately mannered, and holding to a law of inheritance that Aubren
      does not recognise and cannot quite dismiss. A foreign match without the
      year of letters, and a legal argument nobody in the Nethering is
      equipped to have.
    genePool:
      house: house_yssanne
      fontCarrierRate: 0.0
      # Nine families is a small pool, but they have been marrying into Aubren
      # for four hundred years out of necessity, which is the difference
      # between them and Hesk: the same arithmetic, the opposite decision.
      deleteriousLoad: 0.17
      frequencies:
        charm_2: [{ allele: charm_2_d, p: 0.3 }, { allele: charm_2_c, p: 0.3 }]
        charm_5: [{ allele: charm_5_d, p: 0.26 }, { allele: charm_5_c, p: 0.3 }]
        light_1: [{ allele: light_1_trace, p: 0.22 }]

  - id: the_marches
    name: The Petty Holds of the Marches
    respect: unknown
    wealth: 45
    blurb: >-
      Two hundred holds between Aubren and the east, unruled since 604, and the
      companies that come out of them between wars. Nobody there has a
      pedigree, everybody there has cousins in four holds, and a daughter of
      the Marches costs a quarter of what a Calder daughter costs and arrives
      with no paper at all.
    genePool:
      house: the_marches
      fontCarrierRate: 0.0
      # The lowest load in the file. Two hundred holds and no precedence worth
      # marrying for is, genetically, the most outbred population in the game.
      deleteriousLoad: 0.04
      frequencies:
        strength_3: [{ allele: strength_3_d, p: 0.26 }, { allele: strength_3_c, p: 0.3 }]
        agility_2: [{ allele: agility_2_d, p: 0.28 }, { allele: agility_2_c, p: 0.3 }]

  - id: the_lag
    name: The Lag Folk
    respect: unknown
    wealth: 25
    blurb: >-
      Forty miles down the Wend: eel-fishers, wildfowlers, peat-cutters, their
      own reeves and their own drowned calendar. Ague every Highsun and
      everyone there has had it. Aubren says they are webbed, which is
      contempt; what they actually are is four hundred years of everybody who
      could not be buried anywhere else.
    genePool:
      house: the_lag
      fontCarrierRate: 0.0
      deleteriousLoad: 0.19
      frequencies:
        # Not health — health is what the ague takes. The Lag's inheritance is
        # the constitution that survives having had it every summer since
        # childhood, which is longevity with the first thirty years knocked out
        # of it and nothing to show on a suitor card.
        longevity_4: [{ allele: longevity_4_d, p: 0.24 }, { allele: longevity_4_c, p: 0.3 }]
        fluid_2: [{ allele: fluid_2_trace, p: 0.24 }]

  - id: the_fell
    name: The Fell-Graziers
    respect: known
    wealth: 70
    blurb: >-
      Sheep men of the high Nethering, up at Greening and down at Slaughter and
      somewhere else for half of every year. They hold their grazing by a
      custom older than the province and have never produced a document for
      it. Half the province's witnesses to anything that happened on a hill.
    genePool:
      house: the_fell
      fontCarrierRate: 0.0
      deleteriousLoad: 0.11
      frequencies:
        strength_5: [{ allele: strength_5_c, p: 0.3 }]
        longevity_2: [{ allele: longevity_2_d, p: 0.24 }, { allele: longevity_2_c, p: 0.3 }]
        longevity_5: [{ allele: longevity_5_c, p: 0.28 }]

