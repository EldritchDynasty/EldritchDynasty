# An Age is a HAZARD PROCESS, not a phase with a length. It arrives by chance
# and leaves by chance, so the same Age runs a different span in every run: a
# Wars can burn out in twenty years or grind on for eighty, and the family
# cannot know which one it is living through until it is over.
#
# Duration is a property of the Age, not a global band. Tempo is how Ages
# differ most — three short violent Ages back to back should feel nothing like
# two long ones.
#
# `opening` is player-facing and Dunsanian (issue #65). It is shown the year
# the Age begins, before the family has a word for it, and quoted again,
# unchanged, the year the chronicle finally gives these years a name. It is
# not a summary of what the Age does mechanically — that is `docs/VOCABULARY.md`'s
# job — it is what the years felt like from inside them.
ages:
  - id: the_long_peace
    name: The Long Peace
    register: warm
    opening: >-
      For a time the harvests came in fat and the graveyards thin, and the
      house began to believe, as every house does when the years are kind for
      long enough, that this was simply how things were now.
    onset: { weight: 30, cooldownYears: 140 }
    duration: { minYears: 60, medianYears: 105, shape: rising }
    namedAfterYears: 30
    clauseBearing: true

  - id: the_wars
    name: The Wars
    register: cold
    opening: >-
      Word came that men were needed, and then that men were needed again, and
      the house learned what a son is worth to a levy that does not ask what
      he was worth to his mother.
    onset: { weight: 26, cooldownYears: 70 }
    duration: { minYears: 12, medianYears: 38, shape: rising }
    # A war does not empty a house the way a plague does, and it runs three
    # times as long. Small, and it stacks: a Wars inside a Plague is worse
    # than either, which is why the multiplier is a product.
    mortalityMultiplier: 1.35
    namedAfterYears: 12
    clauseBearing: true

  - id: the_crusade
    name: The Crusade
    register: institutional
    opening: >-
      Somewhere a clerk with a very good memory had begun, without any
      particular malice, to take an interest in the family, and the family had
      the uneasy sense of a door that had always stood open being quietly
      measured for a lock.
    onset: { weight: 16, earliestYear: 1180, cooldownYears: 180 }
    duration: { minYears: 28, medianYears: 62, shape: rising }
    namedAfterYears: 15
    clauseBearing: true

  - id: the_insurrection
    name: The Insurrection
    register: institutional
    opening: >-
      Houses that had stood since before anyone living could remember began,
      one after another, to discover that standing since before anyone could
      remember had never been the same thing as standing forever.
    onset: { weight: 14, earliestYear: 1200, cooldownYears: 150 }
    duration: { minYears: 8, medianYears: 24, shape: front_loaded }
    namedAfterYears: 8
    clauseBearing: false

  - id: the_withering
    name: The Withering
    register: cold
    opening: >-
      Fewer children woke to what should have been theirs, and fewer books
      changed hands, and nobody could name the year it started because it had
      not started in any year — it had simply, by degrees, stopped being
      replaced.
    onset: { weight: 12, earliestYear: 1150, cooldownYears: 200 }
    duration: { minYears: 40, medianYears: 85, shape: flat }
    namedAfterYears: 25
    clauseBearing: true

  - id: the_quickening
    name: The Quickening
    register: warm
    opening: >-
      The gift came early now, and came to more of the blood than it had any
      right to, and the house found the ladder it had climbed alone for
      generations suddenly and uncomfortably crowded with other men's sons.
    onset: { weight: 11, earliestYear: 1250, cooldownYears: 220 }
    duration: { minYears: 18, medianYears: 44, shape: rising }
    namedAfterYears: 14
    clauseBearing: true

  - id: the_plague
    name: The Plague
    register: cold
    opening: >-
      It did not ask after bloodlines or affinities or which houses had been
      careful, and the ones who had built their lives on being strong learned,
      in a season, what the ones who had built theirs on being clever already
      knew.
    onset: { weight: 15, cooldownYears: 120 }
    duration: { minYears: 4, medianYears: 14, shape: front_loaded }
    # "Mortality catastrophic... small families die out" was this Age's own
    # blurb (now `opening`, above) for as long as the Ages existed: nothing in
    # the engine read an Age for anything but a condition to gate content on.
    # This is the number that makes the sentence true. Swept in
    # `gate:endings` — see docs/BALANCE-LOG.md — against the one thing a
    # Long Line could not do, which is end.
    mortalityMultiplier: 10.0
    namedAfterYears: 4
    clauseBearing: false

proseVariants:
  - address: "content:ages/ages.yaml#ages[id=the_long_peace].opening"
    of: "1363959a932dede6"
    plainenglish: >-
      For a while the harvests were large and the burials were few. The house began to believe,
      as every house does when the good years last long enough, that this was simply how things
      were now.
  - address: "content:ages/ages.yaml#ages[id=the_wars].opening"
    of: "f93de50dd3ff7e79"
    plainenglish: >-
      Word came that men were needed, and then that more men were needed. The house learned what
      a son is worth to an army that never asks what he was worth to his mother.
  - address: "content:ages/ages.yaml#ages[id=the_crusade].opening"
    of: "c778552aa3bddace"
    plainenglish: >-
      Somewhere a clerk with a very good memory had started, without any real ill will, to take
      an interest in the family. The family had the uneasy feeling of a door that had always
      stood open being quietly measured for a lock.
  - address: "content:ages/ages.yaml#ages[id=the_insurrection].opening"
    of: "8be603f808e91654"
    plainenglish: >-
      Houses that had stood for longer than anyone alive could remember began, one after
      another, to find out that standing for longer than anyone could remember was not the same
      as standing forever.
  - address: "content:ages/ages.yaml#ages[id=the_withering].opening"
    of: "89503cb091edd0bc"
    plainenglish: >-
      Fewer children woke to the gift that should have been theirs, and fewer books changed
      hands. Nobody could name the year it started, because it had not started in any one year.
      Little by little, things had simply stopped being replaced.
  - address: "content:ages/ages.yaml#ages[id=the_quickening].opening"
    of: "752b13efa6cf4223"
    plainenglish: >-
      The gift came early now, and to more of the blood than it had any right to. The house
      found that the ladder it had climbed alone for generations was suddenly and uncomfortably
      crowded with other men's sons.
  - address: "content:ages/ages.yaml#ages[id=the_plague].opening"
    of: "98fcbd17c571685b"
    plainenglish: >-
      It did not care about bloodlines, affinities, or which houses had been careful. In one
      season, the people who had built their lives on being strong learned what the people who
      had built theirs on being clever already knew.
