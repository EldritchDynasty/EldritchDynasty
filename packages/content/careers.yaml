# Purchased placements, chiefly for the Unwoken. The careers that pay Respect
# cost the house either the person's body or their bloodline — Respect is
# bought with descendants (issue #16).
careers:
  - id: military
    name: Military
    respectYield: high
    income: { base: 6, variance: 10 }     # variable, as advertised
    extraMortality: 0.03
    blurb: A commission bought, not earned. It pays in standing and it collects in bodies.

  - id: clergy
    name: Clergy
    respectYield: high
    income: { base: 14, variance: 0 }     # steady
    removesFromBreedingPool: true
    madnessCover: 25
    blurb: >-
      Ordination removes them from the succession entirely, and buys the house
      a great deal of room to be strange behind closed doors.

  - id: court
    name: Court
    respectYield: moderate
    income: { base: 4, variance: 0 }      # low
    attributeGrowth: { attr: charm, perYear: 0.6 }
    blurb: A seat near enough to power to be seen at it. Better suitor cards, slowly.

  - id: merchant
    name: Merchant
    respectYield: none
    income: { base: 22, variance: 4 }     # high
    blurb: No standing in it whatsoever, and the treasury does not care.

  - id: scholar
    name: Scholar
    respectYield: none
    income: { base: 0, variance: 0 }
    studySpeed: 0.7
    blurb: No income, no standing — and every spellbook in the house comes easier for it.

  # ── Three more placements ────────────────────────────────────────────────
  # The five above cover the shape of the system — Respect bought with bodies
  # or with bloodlines, or income bought with neither. What they do not cover
  # is the province the family actually lives in: an advocate is how a house
  # survives the assize, a factor is how coin crosses a border, and the sea is
  # what Sarrow does with the sons nobody else has a use for.
  - id: advocate
    name: Advocate
    respectYield: moderate
    income: { base: 11, variance: 3 }
    attributeGrowth: { attr: mind, perYear: 0.5 }
    minAge: 22
    blurb: >-
      Two marks a day and a reading knowledge of Old Ambric, which takes four
      years to buy and pays for itself the first time this family is asked a
      question it cannot afford to answer badly.

  - id: factor
    name: Factor
    respectYield: low
    income: { base: 26, variance: 9 }
    minAge: 18
    blurb: >-
      An agent of somebody else's counting house, usually Braccish, paid on the
      turn. Cross-border payment moves by letter of credit at two per cent and
      a month's delay, and a family with its own man in that chain keeps the
      two per cent and hears things a month early.

  - id: sea
    name: The Sea
    respectYield: low
    income: { base: 17, variance: 16 }
    extraMortality: 0.022
    minAge: 15
    blurb: >-
      Sarrow, eleven days east, and a berth bought rather than earned. The
      income is the widest swing on this list in both directions and the
      mortality is real, and both of those are the same fact about weather.

proseVariants:
  - address: "content:careers.yaml#careers[id=military].blurb"
    of: "557a23b35d8c52af"
    plainenglish: >-
      The house buys a military post rather than earning it. This raises the family's standing, but the person holding the post risks dying in service.
  - address: "content:careers.yaml#careers[id=clergy].blurb"
    of: "5d2cdd3998e3767d"
    plainenglish: >-
      Joining the clergy removes the person from succession. It also gives the house more protection from scrutiny when it behaves strangely in private.
  - address: "content:careers.yaml#careers[id=court].blurb"
    of: "250958e9f6b15105"
    plainenglish: >-
      A court post puts the person close to people with power. Over time, it brings the family better marriage offers.
  - address: "content:careers.yaml#careers[id=merchant].blurb"
    of: "369cceba434a3f2e"
    plainenglish: >-
      Trading brings money into the treasury but does not raise the family's standing.
  - address: "content:careers.yaml#careers[id=scholar].blurb"
    of: "65013f9be913607f"
    plainenglish: >-
      A scholar brings the house no income or standing, but can study spellbooks faster.
  - address: "content:careers.yaml#careers[id=advocate].blurb"
    of: "bebb251641d0b37a"
    plainenglish: >-
      An advocate's work is worth two marks a day. Learning to read Old Ambric takes four years. This knowledge helps when the family must answer an important question correctly.
  - address: "content:careers.yaml#careers[id=factor].blurb"
    of: "4445d0b436ddfb50"
    plainenglish: >-
      A factor is an agent for another counting house, usually a Braccish one, and is paid when deals are completed. Sending money across borders by letter of credit costs two per cent and takes a month. A family with its own man in that process keeps the two per cent and hears news a month sooner.
  - address: "content:careers.yaml#careers[id=sea].name"
    of: "4ab4b893507f7d17"
    plainenglish: >-
      Work at Sea
  - address: "content:careers.yaml#careers[id=sea].blurb"
    of: "6d1805792f813c45"
    plainenglish: >-
      The house buys a berth in Sarrow, eleven days to the east. This career has the widest range of possible income, both high and low. There is also a real risk of death. Both the income and the danger depend on the weather.
