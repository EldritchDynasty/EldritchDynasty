# Nodes of arc_the_two_it_fitted. Arc events never enter the ambient pool
# (`selection.ts`: `if (e.arc) return false`), so a substory is the one way to
# add a great deal of content without taking a share of the one event a year
# the ambient budget allows.
#
# WEARER is bound arc-wide and inherits down the blood, because the ring is not
# about a man, it is about what a family does twice, two hundred years apart,
# with the same object and no memory of the first time worth the name.
events:
  - id: ring_the_household_decides
    title: It Went On Without Being Worked At
    tier: family
    frequency: uncommon
    weight: 100
    tags: [regalia, ring, arc, madness]
    purposes: [establish_magic_rule, change_relationship, test_magic_rule]
    arc: { of: arc_the_two_it_fitted, node: after_it_fits }
    slots:
      HEAD: { role: head }
      WEARER:
        role: family_member
        bind: arc
        onMissing: { inherit: closest_blood }
        filters: [{ status: [alive] }, { canExpress: true }]
    body: >-
      Nobody said anything at supper, which is how the house says a great deal.
      The ring has been in the second press since before the roof was last
      argued about, and it does not fit anybody, and everybody who has ever
      tried it has tried it in the same half-embarrassed way and put it back.
      It went onto {WEARER}'s hand without being worked at. Two people got up
      afterwards and went to look at the portrait in the west passage,
      separately, and neither of them has mentioned going. {HEAD} has read what
      the book says about the last man it fitted. The book is not long on that
      subject, and what it does say is careful in a way that nothing else in
      four hundred pages of it is careful. It runs to four lines, signed and
      dated by a man who had the whole of a long night to write a fifth in.
      There is no fifth.
    absentBody: >-
      Nobody said anything at supper, which is how the house says a great deal.
      The ring went on without being worked at, on a hand that had tried it the
      same half-embarrassed way everybody tries it, and then it was on and the
      table had gone quiet. The book is careful about the last man it fitted in
      a way the rest of the book is not careful about anything.
    interaction:
      kind: choice
      choices:
        - id: let_it_stay
          label: Leave it on. It is ours and so is the hand.
          outcomes:
            - id: worn
              weight: 100
              text: >-
                It stays on for eleven years and the house gets eleven years of
                a person who is better at everything than they were, and who
                sleeps four hours, and who is right about things in a way that
                stops being a pleasure to be near about the fourth year. The
                province notices the first part. Nobody outside the walls ever
                learns the rest of it, which is the only piece of luck in this
                whole business.
              effects:
                - { kind: heirloom, op: use, heirloom: the_ring, to: WEARER }
                - { kind: respect, delta: 1 }
        - id: take_it_off
          label: Take it off him. Tonight, and write down why.
          outcomes:
            - id: taken
              weight: 100
              tags: [record]
              text: >-
                It comes off easily, which nobody expected and which two people
                in that room find worse than if it had not. What the house
                writes down is four lines long, signed, and dated, and it says
                that the ring was removed and does not say by whose authority
                or on what grounds, because there were no grounds and everybody
                knew it. Four lines is enough to be read back in two hundred
                years. It is not enough to be understood.
              effects:
                - { kind: arc_flag, flag: took_it_off, set: true }
                - { kind: relationship, from: { slot: WEARER }, to: head, sentiment: -34 }

  - id: ring_what_it_costs
    title: What It Costs, and Who Pays It
    tier: individual
    frequency: uncommon
    weight: 100
    tags: [regalia, ring, arc, madness]
    purposes: [test_magic_rule, change_standing, plant_rumour]
    arc: { of: arc_the_two_it_fitted, node: what_it_costs }
    slots:
      HEAD: { role: head }
      WEARER:
        role: family_member
        bind: arc
        onMissing: continue_absent
        # `canExpress` here is not casting, it is invariant 1: the binding was
        # made by the node above, which already gated it, and `madness/gate`
        # reads the slot it is given rather than the slot upstream. Restating
        # it is the price of the Madness gate being static and total.
        filters: [{ status: [alive] }, { canExpress: true }]
    body: >-
      {WEARER} is fifty-one and has been the cleverest person in every room for
      most of a lifetime, and the house has grown used to it the way you grow
      used to a good roof. What the house has not grown used to is being told,
      pleasantly and at breakfast, the day and manner of the deaths of three
      people at that table. He is not threatening anybody. He is answering a
      question nobody has asked out loud yet, which he has done before, four
      times, and been right about twice, and the two he was right about are
      what makes the other two impossible to laugh at.
    absentBody: >-
      The one it fitted has been dead for a generation and the house is still
      paying the bill. Two of the three people he named at that breakfast have
      since died in the manner he named, at their ordinary ages, of ordinary
      things, and the third has stopped coming to the house at all. Nobody
      wrote the breakfast down. Everybody at that table remembers it the same
      way, word for word, which is not how memory works and is a fact the
      family has never been willing to sit with.
    interaction:
      kind: choice
      choices:
        - id: keep_him_close
          label: Keep him in the house. Whatever it is, it is ours.
          outcomes:
            - id: kept
              weight: 100
              text: >-
                He is at the table for another nineteen years and the house is
                richer, better advised and quieter for every one of them. Two
                servants leave without giving a reason. The village has a name
                for the west passage by the end of it, and the name is not
                unkind, and it is not a name you would want a house to have.
              effects:
                - { kind: madness, target: { slot: WEARER }, delta: 18 }
                - { kind: treasury, delta: 140 }
                - { kind: discrepancy, op: create, id: what_the_ring_costs, severity: major, provableBy: [house_marrow, commons] }
                - { kind: rumour, op: seed, id: rumour_the_west_passage, accuracy: 0.4 }
        - id: send_him_out
          label: Give him the Lag holding and a good horse. Twice a year is enough.
          outcomes:
            - id: sent
              weight: 100
              text: >-
                Forty miles of flat drowned country, eels and peat and ague,
                and a house he does not need to be clever in. He writes every
                quarter for thirty years and the letters are affectionate and
                slightly wrong about the dates. The province decides the family
                has put away someone shameful, which is very much cheaper than
                what the province would have decided otherwise.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: madness, target: { slot: WEARER }, delta: 8 }
                - { kind: rumour, op: seed, id: rumour_the_one_in_the_lag, accuracy: 0.55 }
    rumour: { id: rumour_the_west_passage, accuracy: 0.35, spread: 1 }

  - id: ring_it_fits_again
    title: The Second of the Two
    tier: head
    frequency: rare
    weight: 100
    tags: [regalia, ring, arc, madness, succession]
    purposes: [force_record_choice, establish_magic_rule, test_magic_rule]
    arc: { of: arc_the_two_it_fitted, node: the_second_time }
    slots:
      HEAD: { role: head }
      SECOND:
        # The ring's own target filters again — see `the_ring_that_fits`.
        role: family_member
        filters:
          - { status: [alive] }
          - { canExpress: true }
          - { age: { op: gte, value: 19 } }
          - { age: { op: lte, value: 40 } }
    body: >-
      Two hundred years, near enough, and it goes on {SECOND}'s hand at a
      Greening feast in front of forty people, including two of Ilm. The house
      has four lines about the last time, signed and dated, saying the ring was
      taken off and not saying why. It also has a song about the last time,
      which is longer, and better, and disagrees with the four lines on every
      point that matters. Nobody alive has seen this happen. Everybody alive
      has an opinion about it, and the opinions divide almost exactly along the
      line between the people who have read the four lines and the people who
      have only heard the song.
    interaction:
      kind: choice
      choices:
        - id: follow_the_record
          label: Do what the four lines did. Take it off her tonight.
          outcomes:
            - id: followed
              weight: 100
              text: >-
                It comes off as easily as it did the first time. She is
                thanked, in front of the forty, for understanding, and she does
                understand, and that is somehow the worst available outcome for
                everyone in the room. The four lines get a fifth line. It says
                the same thing the first four said and adds the year.
              effects:
                - { kind: relationship, from: { slot: SECOND }, to: head, sentiment: -30 }
        - id: follow_the_song
          label: Do what the song did. Let her keep it and see.
          outcomes:
            - id: followed_song
              weight: 100
              text: >-
                She keeps it eleven years, which is what the last one got, and
                the eleven years are very good and end the way the song says
                they end rather than the way the four lines imply. Both accounts
                survive this. Neither is corrected. The house now has three
                documents about the ring and no policy at all.
              effects:
                - { kind: heirloom, op: use, heirloom: the_ring, to: SECOND }
                - { kind: respect, delta: 1 }
                - { kind: madness, target: { slot: SECOND }, delta: 16 }
    record:
      subject: what the ring does to the two it fits
      options:
        record:
          chronicle: >-
            Twice in four hundred years it has gone on without being worked at,
            and both times the house got someone remarkable and paid for them
            in a coin it could not count until afterwards. Whoever reads this
            and finds it fits them: it is not a reward.
          claims:
            - { kind: deed, target: { slot: SECOND }, text: was the second in four hundred years whom the Ring fit without being worked at }
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            The Ring has been worn by two of this line, both of them the
            greatest of their generation, and it has never cost the house a
            thing that the house was not glad to give.
          effects:
            - { kind: respect, delta: 1 }
          # THE CLAIM IS THE LIE. Only `eldritch_power` and `madness` are
          # `recordable`, which is the design saying that sigil drift is about
          # the two things this family lies about — and an Embellish that
          # carries no claim inflates the embellish rate while producing no
          # drift at all, which is exactly how twelve new Record blocks
          # decoupled `record.slow.test.ts`'s correlation.
          claims:
            - { kind: attr, target: { slot: SECOND }, attr: madness, value: 0 }
          discrepancy:
            id: what_the_ring_costs
            severity: major
            provableBy: [house_marrow, the_church, commons]
    rumour: { id: rumour_the_ring_went_on, accuracy: 0.5, spread: 2 }
    accounts: [the_song_of_the_two_hands, the_four_lines_of_that_night]

proseVariants:
  - address: "content:events/arc_ring.yaml#events[id=ring_the_household_decides].title"
    of: "6ec8301d708b7ba1"
    plainenglish: >-
      The Ring Fits Without Force
  - address: "content:events/arc_ring.yaml#events[id=ring_the_household_decides].body"
    of: "e649c4f93ebc7af5"
    plainenglish: >-
      Nobody speaks at supper, but the silence says a great deal. The ring has stayed in the
      second press since before the family last argued about the roof. It has never fitted
      anyone. Everyone who tried it was slightly embarrassed and put it away again. This time
      it slides onto {WEARER}'s hand without force. Afterwards, two people separately visit the
      portrait in the west passage, and neither admits it. {HEAD} has read the account of the
      last man the ring fitted. In a book of four hundred pages, these are the only words
      written with such care. There are four signed and dated lines. The writer had a whole
      long night to add a fifth, but did not.
  - address: "content:events/arc_ring.yaml#events[id=ring_the_household_decides].absentBody"
    of: "ae30997007db896c"
    plainenglish: >-
      Nobody speaks at supper, but the silence says a great deal. The ring slides onto a hand
      without force, although its wearer had tried it just as awkwardly as everyone else. The
      table falls silent. The book describes the last person it fitted with an unusual degree
      of care. Nothing else in the book is written quite that way.
  - address: "content:events/arc_ring.yaml#events[id=ring_the_household_decides].interaction.choices[id=let_it_stay].label"
    of: "3168b6fb3ee74b3f"
    plainenglish: >-
      Leave the ring on. Both the ring and its wearer belong to this house.
  - address: "content:events/arc_ring.yaml#events[id=ring_the_household_decides].interaction.choices[id=let_it_stay].outcomes[id=worn].text"
    of: "dec7aa66ce369fea"
    plainenglish: >-
      The ring stays on for eleven years. For all eleven, its wearer becomes better at
      everything and sleeps only four hours a night. By the fourth year, being around someone
      who is always right has become unpleasant. People across the province notice the
      improvements. Nobody outside the house discovers the rest, which is the family's only
      good fortune in this affair.
  - address: "content:events/arc_ring.yaml#events[id=ring_the_household_decides].interaction.choices[id=take_it_off].label"
    of: "e1511a8b5a4a357f"
    plainenglish: >-
      Remove the ring from his hand tonight, and record the reason.
  - address: "content:events/arc_ring.yaml#events[id=ring_the_household_decides].interaction.choices[id=take_it_off].outcomes[id=taken].text"
    of: "b03bc8b126c0d2b5"
    plainenglish: >-
      The ring comes off easily. Nobody expected that, and two people find the ease of it even
      more disturbing than a struggle. The house writes four signed and dated lines stating
      that it removed the ring. The record names neither the authority nor the grounds for the
      decision, because there were no grounds and everyone knew it. Two hundred years later,
      someone will be able to read those four lines but not understand them.
  - address: "content:events/arc_ring.yaml#events[id=ring_what_it_costs].title"
    of: "caeca8e7468640b3"
    plainenglish: >-
      The Ring's Cost and Who Bears It
  - address: "content:events/arc_ring.yaml#events[id=ring_what_it_costs].body"
    of: "7b1eae05ca6b8dc1"
    plainenglish: >-
      {WEARER} is fifty-one. For most of his life he has been the cleverest person in the room,
      and his family now takes that for granted. What they cannot accept is how pleasantly he
      announces, at breakfast, the dates and causes of death of three people sitting there. He
      is not threatening them. He is answering a question nobody has asked. He has made four
      such predictions before. Two were right and two were wrong. The two accurate predictions
      make the others difficult to dismiss.
  - address: "content:events/arc_ring.yaml#events[id=ring_what_it_costs].absentBody"
    of: "300197b88eb94f64"
    plainenglish: >-
      The person the ring fitted died a generation ago, but the house still feels the cost. Of
      the three people whose deaths he predicted at breakfast, two have now died in the ways he
      described, at ordinary ages and from ordinary causes. The third no longer visits the
      house. Nobody wrote down the conversation, yet everybody who was there remembers exactly
      the same words. Memory does not normally work that way, and the family refuses to discuss
      it.
  - address: "content:events/arc_ring.yaml#events[id=ring_what_it_costs].interaction.choices[id=keep_him_close].label"
    of: "51354e4780d68653"
    plainenglish: >-
      Keep him at home, even if his strange abilities frighten us.
  - address: "content:events/arc_ring.yaml#events[id=ring_what_it_costs].interaction.choices[id=keep_him_close].outcomes[id=kept].text"
    of: "981d8703eee75f1f"
    plainenglish: >-
      He stays at the family table for another nineteen years. Throughout that time, the house
      grows richer, receives better advice and becomes quieter. Two servants leave without
      explaining why. By the end, the village has given the west passage a name. The name is
      not openly cruel, but it is a troubling name for a family home.
  - address: "content:events/arc_ring.yaml#events[id=ring_what_it_costs].interaction.choices[id=send_him_out].label"
    of: "29366b1457be3358"
    plainenglish: >-
      Give him the holding in the Lag and a good horse. Visit twice a year.
  - address: "content:events/arc_ring.yaml#events[id=ring_what_it_costs].interaction.choices[id=send_him_out].outcomes[id=sent].text"
    of: "d8b72c267247be1a"
    plainenglish: >-
      He goes to a house forty miles away in flat, flooded country known for eels, peat and
      fever. There he need not be the cleverest person in the room. He writes affectionate
      letters every three months for thirty years, although their dates are slightly wrong.
      People in the province assume his family sent him away for something shameful. That
      belief costs the house far less than the alternative explanation would have.
  - address: "content:events/arc_ring.yaml#events[id=ring_it_fits_again].title"
    of: "a04067a01a544f24"
    plainenglish: >-
      The Ring Fits a Second Person
  - address: "content:events/arc_ring.yaml#events[id=ring_it_fits_again].body"
    of: "f00f92d3a43a61f7"
    plainenglish: >-
      Almost two hundred years later, the ring slides onto {SECOND}'s hand during a Greening
      feast. Forty people see it happen, including two from Ilm. The family has four signed and
      dated lines from the first time. They say the ring was removed, but not why. It also has
      a longer, more convincing song that contradicts the four lines on everything important.
      Nobody alive witnessed the first fitting, but everybody has an opinion. Most who read the
      lines believe one account; most who know only the song believe the other.
  - address: "content:events/arc_ring.yaml#events[id=ring_it_fits_again].interaction.choices[id=follow_the_record].label"
    of: "d992bff884fd35dc"
    plainenglish: >-
      Follow the four-line record. Remove the ring from her hand tonight.
  - address: "content:events/arc_ring.yaml#events[id=ring_it_fits_again].interaction.choices[id=follow_the_record].outcomes[id=followed].text"
    of: "4a1f822c75d49df0"
    plainenglish: >-
      The ring comes off just as easily as before. She is thanked before all forty guests for
      understanding the decision. She really does understand, which somehow makes the moment
      worse for everyone present. The four-line record gains a fifth line. It repeats the
      earlier account and adds the year.
  - address: "content:events/arc_ring.yaml#events[id=ring_it_fits_again].interaction.choices[id=follow_the_song].label"
    of: "82e4e1e93755c16d"
    plainenglish: >-
      Follow the song. Let her keep wearing the ring and see what happens.
  - address: "content:events/arc_ring.yaml#events[id=ring_it_fits_again].interaction.choices[id=follow_the_song].outcomes[id=followed_song].text"
    of: "8f909a0e6499fd72"
    plainenglish: >-
      She wears it for eleven years, just like the first wearer. Those years are very good, and
      they end as the song describes rather than as the four-line record suggests. Both
      contradictory accounts survive unchanged. The house now holds three documents about the
      ring, but still has no rule for what to do with it.
  - address: "content:events/arc_ring.yaml#events[id=ring_it_fits_again].record.subject"
    of: "70b84ed69110cffa"
    plainenglish: >-
      what happened to the two people the ring fitted
  - address: "content:events/arc_ring.yaml#events[id=ring_it_fits_again].record.options.record.chronicle"
    of: "cbbecec335bea867"
    plainenglish: >-
      Twice in four hundred years, the ring has fitted someone without force. Both times, that
      person became remarkable, and the house paid a price it did not understand until later.
      If this record reaches someone the ring also fits, remember: wearing it is not a reward.
  - address: "content:events/arc_ring.yaml#events[id=ring_it_fits_again].record.options.record.claims[0].text"
    of: "9bda54a7dda95613"
    plainenglish: >-
      was the second person in four hundred years to wear the Ring without forcing it on
  - address: "content:events/arc_ring.yaml#events[id=ring_it_fits_again].record.options.embellish.chronicle"
    of: "36813992839a05d6"
    plainenglish: >-
      Two members of our bloodline wore the Ring. Each was the greatest person of their
      generation, and the house has never regretted anything it gave up for them.
