# THE MACHINERY THAT CATCHES A LIE.
#
# World §16, in scenes: the parish roll, the notary's book, the Braccish
# ledger, the herald's Roll of Houses, the wool factors' valuation, the
# Warden's assize and the oath-men who follow it. Everything of consequence in
# this world is written down by somebody with a motive, and every one of those
# books outlives everybody in this house. That is the whole reason a
# Discrepancy is still provable eight hundred years later.
#
# All eight carry a Record block, because all eight are a scene in which the
# family finds out that somebody else is writing this down too, and gets one
# chance to decide what its own version says.
#
# UNCOMMON, at low per-template weight. Uncommon's cooldown is global to the
# tier — twelve years after any uncommon template fires, the whole tier is
# barred — so a run has room for about eighty-three uncommon firings shared by
# every uncommon template in the game. Eight new ones at weight 100 would have
# taken a full share each off fifty-five templates that were already thin.
# At 55 they take about half a share, which is what a scene of this kind is
# worth against `who_gets_the_physician` and `the_coat_hung_up`.
events:
  - id: the_notarys_book
    title: The Notary's Other Copy
    tier: head
    frequency: uncommon
    weight: 45
    tags: [law, notary, bramme, records, contract]
    purposes: [advance_clause, buy_patience, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      A notary's attestation costs one mark and it buys two things, and the
      house has only ever paid attention to the first. The second is that
      everything he attests goes into his own register in his own hand, dated,
      and that register is inherited by his son and sold with the practice. He
      is retiring. He mentions, pleasantly, over the last of the business, that
      the register runs back to 1088 and that the house appears in it
      forty-one times.
    interaction:
      kind: choice
      choices:
        - id: buy_the_register
          label: Buy the register outright.
          outcomes:
            - id: bought
              weight: 100
              text: >-
                Ninety crowns for eleven volumes and a cart, and he is
                surprised and takes it. It is the price of the west wing roof
                and it removes forty-one dated entries from the province
                permanently. The practice is sold on to a man from Cawdry who
                asks, within a month, where the old register went.
              effects:
                - { kind: treasury, delta: -90 }
                - { kind: heirloom, op: grant, heirloom: the_bramme_register }
        - id: leave_it
          label: Leave it. A register nobody has read is a register nobody has read.
          outcomes:
            - id: left
              weight: 100
              text: >-
                It goes with the practice, as it has three times before, and
                sits in a back room at Bramme being consulted about eight times
                a year for entirely ordinary reasons. It survives two fires and
                a flood, because a back room at Bramme is drier than Ardwen.
              effects:
                - { kind: respect, delta: 1 }
    record:
      subject: the notary's register and what is in it
      options:
        record:
          chronicle: The Bramme register carries forty-one entries in this house's name, running back to 1088, and we have read none of them.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: found forty-one Bramme register entries in the house's name and had read none of them }
        omit:
          chronicle: null
        embellish:
          chronicle: The Bramme register was reviewed entire and found to contain nothing this house would not read aloud at the assize.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: reviewed the Bramme register entire }
          discrepancy:
            id: the_unread_register
            severity: minor
            provableBy: [house_marrow, the_church]

  - id: the_weighers_ledger
    title: On the Weight
    tier: head
    frequency: uncommon
    weight: 45
    tags: [bracc, money, credit]
    purposes: [advance_clause, force_record_choice, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      Braccish factors keep a counting house at Cawdry and swear no oath in a
      Church court; they swear on the weight, which the Church has objected to
      formally for two hundred years and accepted in practice for four hundred.
      Their ledger is the one book in the Settled Lands that nobody has ever
      successfully argued with. A letter of credit for the Corran fees moves at
      two per cent and a month's delay, and the entry it makes will still be
      legible in 1542. The weigher is polite and asks {HEAD} for the payer's
      name, once, and writes down what he is given.
    interaction:
      kind: choice
      choices:
        - id: the_house_name
          label: The house's own name, and the two per cent.
          outcomes:
            - id: plainly
              weight: 100
              text: >-
                It goes in the ledger clean, with a weight beside it and a date,
                and it clears at Corran in five tendays. Everything after that
                is arithmetic, and Braccish arithmetic does not lose things.
              effects:
                - { kind: treasury, delta: -14 }
                - { kind: respect, delta: 1 }
        - id: through_a_factor
          label: Through a Bramme factor, under his name.
          outcomes:
            - id: at_one_remove
              weight: 100
              text: >-
                Two per cent to Bracc and four to the factor, and the ledger
                carries a Bramme wool man paying Colleges fees for a student he
                has never met. The weigher does not comment. The weigher never
                comments and never forgets, and neither does the column he put
                it in.
              effects:
                - { kind: treasury, delta: -22 }
                - { kind: rumour, op: seed, id: rumour_who_paid_the_corran_fees, accuracy: 0.35 }
    rumour: { id: rumour_the_weighed_entry, accuracy: 0.5, spread: 1 }
    record:
      subject: who paid, and in whose name
      options:
        record:
          chronicle: The Corran fees were paid by letter of credit drawn at Cawdry, in this house's name, at two per cent.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: paid the Corran fees by letter of credit drawn at Cawdry }
        omit:
          chronicle: null
        embellish:
          chronicle: The Corran fees were met out of the year's wool, in coin, at Bramme, and no letter was drawn.
          effects:
            - { kind: treasury, delta: 4 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: paid the Corran fees in coin at Bramme }
          discrepancy:
            id: the_letter_that_was_drawn
            severity: major
            provableBy: [house_bracc, house_ilm]

  - id: the_heralds_visitation
    title: The Herald's Visitation
    tier: head
    frequency: uncommon
    weight: 45
    tags: [assembly, roll_of_houses, standing, records, caster]
    purposes: [advance_clause, force_record_choice, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      Every third year the Assembly meets at Caster and keeps the Roll of
      Houses, and once in a long while it sends somebody out to look. He has
      come nine days by cart to sit in the long room with a clerk and ask what
      this house is: its descent, its acres, its dead, its arms, and the exact
      words of its precedence. He writes in a fair hand and he does not hurry
      and he will be gone in three days. What he leaves behind is a line about
      this family in the only book in the kingdom that decides where they sit.
    interaction:
      kind: choice
      choices:
        - id: full_descent
          label: Give him the full descent, generation by generation.
          outcomes:
            - id: full
              weight: 100
              text: >-
                Two days of it, with the chapel floor walked and the older
                stones read out where the cutting has gone. He is impressed in
                the specific, bloodless way of a man whose job is to be
                impressed accurately, and the line at Caster improves.
              effects:
                - { kind: respect, delta: 2 }
                - { kind: treasury, delta: -12 }
        - id: the_short_descent
          label: Four generations and the acreage. He can have what he needs.
          outcomes:
            - id: short
              weight: 100
              text: >-
                He writes down four generations and the acreage and one line
                that reads, in the herald's own careful shorthand, that the
                elder descent was not produced. That shorthand is a standing
                question in a book that gets read out every third year for
                centuries afterward.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: flag, flag: the_elder_descent_not_produced, set: true }
    accounts: [the_heralds_marginal_note, ardwen_stave_of_the_long_descent]
    record:
      subject: what was given to the herald
      options:
        record:
          chronicle: The herald had of us four generations and the acreage, and asked twice for the elder descent, and did not have it.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: 'gave the herald four generations and the acreage, but not the elder descent' }
        omit:
          chronicle: null
        embellish:
          chronicle: The herald had of us the descent entire, back to the founding, and went away satisfied.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: gave the herald the descent entire }
          discrepancy:
            id: the_descent_not_produced
            severity: major
            provableBy: [house_marrow, house_calder, the_church]

  - id: the_wool_factors_book
    title: The Valuation
    tier: head
    frequency: uncommon
    weight: 45
    tags: [wool, money, factors]
    purposes: [buy_patience, force_record_choice, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      Southern buyers come up in Haying, price the clip, and leave, and they
      are pleasant, and they are pricing your whole year. It is the one moment
      each season when an outsider assesses this house's real position and
      writes it down somewhere the house cannot see. He walks the fold, handles
      four fleeces out of nine hundred, and offers under last year by a tenth.
      He is not wrong about the clip and he is not right about why.
    interaction:
      kind: choice
      choices:
        - id: take_the_offer
          label: Take it. The money arrives at Harvest either way.
          outcomes:
            - id: taken
              weight: 100
              text: >-
                Signed in the yard on the cart tail and paid at Ingathering,
                and the figure goes south in his book with a note beside it
                about the state of the fences. That note is worth more to
                somebody than the wool was.
              effects:
                - { kind: treasury, delta: -6 }
        - id: hold_the_clip
          label: Hold the clip and sell at the Ingathering fair.
          outcomes:
            - id: held_and_sold
              weight: 62
              text: >-
                Four crowns better at Bramme after carriage, which is a small
                win taken at the cost of a large man in a southern counting
                house writing the word difficult next to a name.
              effects:
                - { kind: treasury, delta: 6 }
                - { kind: respect, delta: -1 }
            - id: it_rains
              weight: 38
              text: >-
                It rains for three tendays and the clip is in the barn for all
                of them and comes out worth less than the offer. The factor is
                courteous about it the following Haying and prices accordingly,
                and goes on pricing accordingly for eleven years.
              effects:
                - { kind: treasury, delta: -14 }
    record:
      subject: what the clip was worth
      options:
        record:
          chronicle: The clip went at a tenth under the year before, the fences being what they are.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: sold the clip at a tenth under the year before }
        omit:
          chronicle: null
        embellish:
          chronicle: The clip went at a tenth over the year before, the fold being in better order than the province expected.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: sold the clip above the previous year }
          discrepancy:
            id: the_clip_that_went_over
            severity: minor
            provableBy: [commons, house_bracc]

  - id: the_oath_men_at_the_assize
    title: Two Marks a Day
    tier: head
    frequency: uncommon
    weight: 45
    tags: [assize, law, witness, cawdry]
    purposes: [change_relationship, force_record_choice, test_magic_rule]
    slots:
      HEAD: { role: head }
      KIN:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 18 } }, { relation: not, of: HEAD }]
    body: >-
      Men follow the assize circuit and sell testimony at two marks a day.
      Everyone knows. The Warden's clerk knows, and prices his own reluctance
      accordingly, and this is the reason a proven Discrepancy needs documents
      rather than mouths. The matter before the assize is a boundary and the
      matter behind it is what four men in Wick say they saw {KIN} do in a barn
      in a bad summer, and one of the four has already been approached by
      somebody who is not this house.
    interaction:
      kind: choice
      choices:
        - id: buy_the_four
          label: Buy all four and be done with it.
          outcomes:
            - id: bought_four
              weight: 100
              text: >-
                Eight marks a day for two days and the boundary goes the
                house's way and the barn is not mentioned. Four men now know
                exactly what this house will pay to keep a barn unmentioned,
                and three of them will be at the next assize as well.
              effects:
                - { kind: treasury, delta: -2 }
                - { kind: respect, delta: -1 }
                - { kind: relationship, from: { slot: KIN }, to: head, sentiment: 12 }
        - id: bring_the_deed
          label: Bring the deed instead and let the mouths say what they like.
          outcomes:
            - id: paper_wins
              weight: 100
              text: >-
                The deed is ninety years old and badly kept and it wins in
                about four minutes, because a court in Aubren will take a bad
                document over a good witness every day of the circuit. The barn
                is mentioned twice and goes nowhere. The oath-men are paid by
                the other side and do not much care.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: { slot: KIN }, to: head, sentiment: -8 }
    record:
      subject: how the boundary was won
      options:
        record:
          chronicle: The boundary at the assize was won on a ninety-year deed, and the four witnesses from Wick were bought by neither side in the end.
          effects: []
          claims:
            - { kind: deed, target: { slot: KIN }, text: 'was cleared at the assize on a ninety-year deed, not on the witnesses' }
        omit:
          chronicle: null
        embellish:
          chronicle: The boundary at the assize was won on the plain testimony of four men of Wick, freely given.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: KIN }, text: was cleared at the assize by four freely given witnesses }
          discrepancy:
            id: the_freely_given_witnesses
            severity: minor
            provableBy: [commons, house_calder]

  - id: the_fell_graziers_have_no_paper
    title: A Custom Older Than the Province
    tier: head
    frequency: uncommon
    weight: 45
    tags: [graziers, land, custom, dispute]
    purposes: [force_record_choice, plant_rumour, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      The fell-graziers take the flocks up at Greening and bring them down at
      Slaughter and hold their grazing by a custom older than the province, and
      in eleven hundred years not one of them has produced a document for it.
      Neither has anybody else. The tops above the house are therefore held by
      two parties with equally excellent claims and no paper between them, and
      the Warden's clerk has begun to take an interest, because a clerk with a
      blank space on a map is a clerk with a career in front of him.
    interaction:
      kind: choice
      choices:
        - id: make_common_cause
          label: Make common cause. Two claims and no paper beats one clerk.
          outcomes:
            - id: common_cause
              weight: 100
              text: >-
                A grazier and a Head standing in the same room telling a clerk
                the same story about a hill is a thing the Nethering has not
                seen in living memory. It works. It also means the graziers
                have, for the first time, a written account of what they hold
                and who agreed to it, in this house's hand.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_the_hill_agreement, accuracy: 0.6 }
        - id: file_first
          label: File the house's claim first and let them find out at the assize.
          outcomes:
            - id: filed
              weight: 100
              tags: [hard]
              text: >-
                Four hundred acres of high grazing on the strength of being the
                only party in the room that owns a pen. The graziers are on the
                tops half of every year and hear about it in Slaughter. They
                are not litigious people. They are, however, witnesses to
                everything that has ever happened on that hill.
              effects:
                - { kind: treasury, delta: 30 }
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_the_hill_taken_on_paper, accuracy: 0.7 }
    accounts: [the_stave_of_the_high_grazing, cawdry_assize_roll_the_tops]
    record:
      subject: who holds the tops
      options:
        record:
          chronicle: The tops were entered to this house at the assize, the graziers having held them by custom and by nothing written.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: had the tops entered to the house while the graziers held them by custom and no writing }
        omit:
          chronicle: null
        embellish:
          chronicle: The tops were entered to this house at the assize, the graziers consenting, as they have consented since the founding.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: took the tops with the graziers consenting }
          discrepancy:
            id: the_graziers_consent
            severity: major
            provableBy: [commons, house_hesk]

  - id: the_coroners_view
    title: The View of the Body
    tier: head
    frequency: uncommon
    weight: 45
    tags: [death, law, warden, inquest]
    purposes: [force_record_choice, test_magic_rule, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      Blood belongs to the Warden's assize and the house holds only the low
      justice, so a body found on the house's land brings a man from Cawdry
      within four days whether anybody wants him or not. The dead man is a
      hired hand, and the cause is a fall, and the fall is real. What is not
      ordinary is that he was found inside the yard wall at an hour when the
      gate has been shut for ninety years without ever being locked, and that
      the two hall hounds went out of that yard at first light and would not
      come back into it until noon.
    interaction:
      kind: choice
      choices:
        - id: plain_account
          label: Give the plain account. A fall is a fall.
          outcomes:
            - id: plain
              weight: 100
              text: >-
                Misadventure, entered at Cawdry, four days and eleven marks in
                fees and a cart. The clerk asks about the gate and writes down
                the answer and asks about the dogs and does not write down the
                answer, which is a distinction his office makes on purpose.
              effects:
                - { kind: treasury, delta: -11 }
        - id: settle_with_the_kin
          label: Settle with his people before the man from Cawdry arrives.
          outcomes:
            - id: settled
              weight: 100
              text: >-
                Six crowns to a widow at Wick and the body away to her parish
                before Tuesday, which is lawful, generous and exactly the shape
                of a thing being tidied. The view is held anyway, over an empty
                place in a yard, and the entry says so.
              effects:
                - { kind: treasury, delta: -6 }
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_the_body_moved_early, accuracy: 0.45 }
    accounts: [the_wick_rhyme_of_the_shut_gate, the_cawdry_view_minute]
    record:
      subject: the man found inside the yard wall
      options:
        record:
          chronicle: A hired man was found dead inside the yard wall at dawn, the gate being shut, and the hounds would not come in until noon.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: had a hired man found dead inside the shut yard wall at dawn }
        omit:
          chronicle: null
        embellish:
          chronicle: A hired man was found dead on the Wick road, having fallen, and was carried to his own parish the same day.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: had the man carried to his own parish from the Wick road }
          discrepancy:
            id: the_man_in_the_yard
            severity: major
            provableBy: [commons, the_church, house_marrow]

  - id: the_relief_on_inheritance
    title: One Year's Income
    tier: head
    frequency: uncommon
    weight: 45
    tags: [succession, money, law, crown]
    purposes: [buy_patience, force_record_choice, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      Relief on inheritance is one year's income and the Crown assesses it off
      the last return, which is the return the house itself wrote. There is a
      clerk at Cawdry whose entire office is the gap between what a house
      declares and what its fold looks like from the road. He has ridden past
      this fold. The seat has just changed hands and the assessment is due
      before Thaw, and every crown declared now is a crown declared for ever in
      a book that also records what was declared last time.
    interaction:
      kind: choice
      choices:
        - id: declare_true
          label: Declare it true.
          outcomes:
            - id: true_return
              weight: 100
              text: >-
                Sixty-four crowns, paid in two parts, and a clerk who moves on
                to a house that interests him more. A true return is expensive
                once and cheap for two hundred years, and nobody in this family
                has ever been able to prove that second half to anybody.
              effects:
                - { kind: treasury, delta: -64 }
                - { kind: respect, delta: 1 }
        - id: declare_short
          label: Declare short. The fold had a bad murrain and the roof is out.
          outcomes:
            - id: short_return
              weight: 100
              text: >-
                Forty-one crowns, all of it defensible, none of it true, and
                the clerk accepts it in a single afternoon. The next relief
                falls in about thirty years and will be assessed against this
                afternoon's number by somebody who has both books open.
              effects:
                - { kind: treasury, delta: -41 }
                - { kind: flag, flag: the_short_return, set: true }
              # #334: "assessed against this afternoon's number by somebody who has both books open"
              next: { event: both_books_open, after: { minYears: 25, maxYears: 35 } }
    record:
      subject: what the house declared at the relief
      options:
        record:
          chronicle: The relief was assessed at forty-one crowns on a return this house wrote short, the fold being better than we said.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: made a short return at the relief and was assessed forty-one crowns on it }
        omit:
          chronicle: null
        embellish:
          chronicle: The relief was assessed at forty-one crowns on a true return, the murrain and the roof being what they were.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: made a true return at the relief }
          discrepancy:
            id: the_return_written_short
            severity: major
            provableBy: [house_bracc, house_calder]

  # #334: the reader of the_short_return.
  - id: both_books_open
    title: Both Books Open
    tier: head
    frequency: common
    weight: 100
    tags: [succession, money, law, crown]
    purposes: [buy_patience, change_standing, force_record_choice]
    conditions:
      all:
        - { flag: the_short_return, is: true }
    slots:
      HEAD: { role: head }
    body: >-
      The seat has changed hands again, and the relief falls due before Thaw.
      The clerk who rides out from Cawdry is not the clerk who came last time.
      He has the old return in one hand and the new one in the other, and he
      reads them at the board in the hall with the fire going, without taking
      off his gloves. The fold has not had a murrain in thirty years, and he says so, mildly, laying the
      old return on top of the new, and works out the true figure aloud: sixty-four crowns.
      Then he asks about the last one.
    interaction:
      kind: choice
      choices:
        - id: make_it_good
          label: Pay the true figure, and the difference owed on the last.
          outcomes:
            - id: made_good
              weight: 100
              text: >-
                Eighty-seven crowns, counted out on the board while he watches. He
                writes one line under the old return and initials it. After that
                the house's returns are dull, and the clerk stops riding past the
                fold.
              effects:
                - { kind: treasury, delta: -87 }
                - { kind: respect, delta: 1 }
                - { kind: flag, flag: the_short_return, set: false }
        - id: declare_short_again
          label: Declare short again. The fold had a bad year.
          outcomes:
            - id: short_again
              weight: 100
              text: >-
                Forty-four crowns, and he accepts them, and he writes the house's
                name on a different list from the one he came with. Nobody tells
                the house what the list is for. Nobody has to.
              effects:
                - { kind: treasury, delta: -44 }
                - { kind: respect, delta: -2 }

proseVariants:
  - address: "content:events/papers.yaml#events[id=the_notarys_book].title"
    of: "87f21caa2aa60a16"
    plainenglish: >-
      The Notary Keeps His Own Copy
  - address: "content:events/papers.yaml#events[id=the_notarys_book].body"
    of: "d9d66c9bd4327b67"
    plainenglish: >-
      Having a notary witness a document costs one mark and gets you two things, though the
      house has only ever thought about the first. The second is that everything he witnesses
      goes into his own register, in his own handwriting, with the date. That register passes to
      his son and is sold along with the business. He is retiring. While finishing up, he
      mentions pleasantly that his register goes back to 1088 and that the house appears in it
      forty-one times.
  - address: "content:events/papers.yaml#events[id=the_notarys_book].interaction.choices[id=buy_the_register].label"
    of: "1f8194097e454325"
    plainenglish: >-
      Buy the whole register.
  - address: "content:events/papers.yaml#events[id=the_notarys_book].interaction.choices[id=buy_the_register].outcomes[id=bought].text"
    of: "43803c0a51f565ee"
    plainenglish: >-
      Ninety crowns for eleven volumes and a cart. He is surprised, and accepts. It is what the
      west wing roof would cost, and it removes forty-one dated entries from the province for
      good. The business is sold to a man from Cawdry, who asks within a month where the old
      register went.
  - address: "content:events/papers.yaml#events[id=the_notarys_book].interaction.choices[id=leave_it].label"
    of: "b9a5c4ffe1770fe3"
    plainenglish: >-
      Leave it. Nobody has read it, and nobody will.
  - address: "content:events/papers.yaml#events[id=the_notarys_book].interaction.choices[id=leave_it].outcomes[id=left].text"
    of: "372bada22e1c0e86"
    plainenglish: >-
      It goes with the business, as it has three times before. It sits in a back room at Bramme
      and is looked at about eight times a year for perfectly ordinary reasons. It survives two
      fires and a flood, because a back room at Bramme is drier than Ardwen.
  - address: "content:events/papers.yaml#events[id=the_notarys_book].record.subject"
    of: "7d0a48e3e281c21f"
    plainenglish: >-
      the notary's register and what it contains
  - address: "content:events/papers.yaml#events[id=the_notarys_book].record.options.record.chronicle"
    of: "4f5c7ac590c3e811"
    plainenglish: >-
      The Bramme register has forty-one entries under this house's name, going back to 1088, and
      we have read none of them.
  - address: "content:events/papers.yaml#events[id=the_notarys_book].record.options.record.claims[0].text"
    of: "5209c6bdd9943741"
    plainenglish: >-
      found forty-one entries under the house's name in the Bramme register and had not read any
      of them
  - address: "content:events/papers.yaml#events[id=the_notarys_book].record.options.embellish.chronicle"
    of: "49ccacedd04496c1"
    plainenglish: >-
      The whole Bramme register was checked and found to contain nothing this house would not
      read out at the court.
  - address: "content:events/papers.yaml#events[id=the_notarys_book].record.options.embellish.claims[0].text"
    of: "1615836716fd1ecb"
    plainenglish: >-
      checked the whole Bramme register
  - address: "content:events/papers.yaml#events[id=the_weighers_ledger].title"
    of: "bfd8fec5dd982261"
    plainenglish: >-
      Sworn on the Scales
  - address: "content:events/papers.yaml#events[id=the_weighers_ledger].body"
    of: "e6cbb97aa6b6db36"
    plainenglish: >-
      Merchants from Bracc keep a counting house at Cawdry. They swear no oaths in a Church
      court; they swear on the scales. The Church has formally objected to that for two hundred
      years and accepted it in practice for four hundred. Their account book is the one record
      in the Settled Lands that nobody has ever successfully disputed. A letter of credit for
      the fees at Corran costs two per cent and takes a month, and the entry it makes will still
      be readable in 1542. The weigher is polite. He asks {HEAD} once whose name the payment is
      in, and writes down what he is told.
  - address: "content:events/papers.yaml#events[id=the_weighers_ledger].interaction.choices[id=the_house_name].label"
    of: "5e9c17d806a0718c"
    plainenglish: >-
      In the house's own name, and pay the two per cent.
  - address: "content:events/papers.yaml#events[id=the_weighers_ledger].interaction.choices[id=the_house_name].outcomes[id=plainly].text"
    of: "a45cd553eed6dda7"
    plainenglish: >-
      It goes into the account book cleanly, with a weight and a date beside it, and the money
      reaches Corran in five tendays. After that it is all arithmetic, and the merchants of
      Bracc never lose track of their arithmetic.
  - address: "content:events/papers.yaml#events[id=the_weighers_ledger].interaction.choices[id=through_a_factor].label"
    of: "434bd00b58ecb2b7"
    plainenglish: >-
      Through a merchant at Bramme, in his name.
  - address: "content:events/papers.yaml#events[id=the_weighers_ledger].interaction.choices[id=through_a_factor].outcomes[id=at_one_remove].text"
    of: "e8407d65f997e951"
    plainenglish: >-
      Two per cent to Bracc and four to the merchant, and the account book now shows a Bramme
      wool dealer paying College fees for a student he has never met. The weigher says nothing.
      The weigher never says anything and never forgets, and neither does the column he wrote it
      in.
  - address: "content:events/papers.yaml#events[id=the_weighers_ledger].record.subject"
    of: "c250577e131d6f62"
    plainenglish: >-
      who paid the fees, and under whose name
  - address: "content:events/papers.yaml#events[id=the_weighers_ledger].record.options.record.chronicle"
    of: "c8d7d2251136ea29"
    plainenglish: >-
      The Corran fees were paid by a letter of credit from Cawdry, in this house's name, at two
      per cent.
  - address: "content:events/papers.yaml#events[id=the_weighers_ledger].record.options.record.claims[0].text"
    of: "b243b85aa67dcede"
    plainenglish: >-
      paid the Corran fees by a letter of credit from Cawdry
  - address: "content:events/papers.yaml#events[id=the_weighers_ledger].record.options.embellish.chronicle"
    of: "fc1ef31bc64d2b17"
    plainenglish: >-
      The Corran fees were paid in coin at Bramme, out of the year's wool money, with no letter
      of credit.
  - address: "content:events/papers.yaml#events[id=the_weighers_ledger].record.options.embellish.claims[0].text"
    of: "0f955e6d1a59ec39"
    plainenglish: >-
      paid the Corran fees at Bramme in cash
  - address: "content:events/papers.yaml#events[id=the_heralds_visitation].title"
    of: "beba37684247beac"
    plainenglish: >-
      The Herald's Visit
  - address: "content:events/papers.yaml#events[id=the_heralds_visitation].body"
    of: "b28a2735cf1eff31"
    plainenglish: >-
      Every third year the Assembly meets at Caster and updates the Roll of Houses, and once in
      a long while it sends someone out to check. This man has spent nine days in a cart getting
      here. He sits in the long room with a clerk and asks what this house is: its family line,
      its land, its dead, its coat of arms, and the exact wording of its rank. He writes neatly,
      does not hurry, and will be gone in three days. What he leaves behind is one line about
      this family in the only book in the kingdom that decides where they sit.
  - address: "content:events/papers.yaml#events[id=the_heralds_visitation].interaction.choices[id=full_descent].label"
    of: "b9a8ff3b659d1567"
    plainenglish: >-
      Give him the whole family line, generation by generation.
  - address: "content:events/papers.yaml#events[id=the_heralds_visitation].interaction.choices[id=full_descent].outcomes[id=full].text"
    of: "dbb78368d4384364"
    plainenglish: >-
      It takes two days, including walking the chapel floor and reading out the older
      gravestones where the carving has worn away. He is impressed in the precise, unemotional
      way of a man whose job is to be impressed accurately, and the family's line at Caster
      improves.
  - address: "content:events/papers.yaml#events[id=the_heralds_visitation].interaction.choices[id=the_short_descent].label"
    of: "61eb54730082f797"
    plainenglish: >-
      Four generations and the land. That is all he needs.
  - address: "content:events/papers.yaml#events[id=the_heralds_visitation].interaction.choices[id=the_short_descent].outcomes[id=short].text"
    of: "4a6ce717199c6663"
    plainenglish: >-
      He writes down four generations and the amount of land, plus one line in the herald's
      careful shorthand: the older family line was not produced. That note stays an open
      question, in a book read out every third year for centuries afterwards.
  - address: "content:events/papers.yaml#events[id=the_heralds_visitation].record.subject"
    of: "9380a04ba5e2b13f"
    plainenglish: >-
      what the herald was given
  - address: "content:events/papers.yaml#events[id=the_heralds_visitation].record.options.record.chronicle"
    of: "87b904b007c2ed2c"
    plainenglish: >-
      We gave the herald four generations and the land. He asked twice for the older family
      line, and did not get it.
  - address: "content:events/papers.yaml#events[id=the_heralds_visitation].record.options.record.claims[0].text"
    of: "e613a403f3fa4f8f"
    plainenglish: >-
      gave the herald four generations and the land, but not the older family line
  - address: "content:events/papers.yaml#events[id=the_heralds_visitation].record.options.embellish.chronicle"
    of: "70597186bd80ec2a"
    plainenglish: >-
      We gave the herald the whole family line, back to the founding, and he left satisfied.
  - address: "content:events/papers.yaml#events[id=the_heralds_visitation].record.options.embellish.claims[0].text"
    of: "512fc1fb74c91777"
    plainenglish: >-
      gave the herald the whole family line
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].title"
    of: "82121e4b9fa1e857"
    plainenglish: >-
      The Wool Merchant's Estimate
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].body"
    of: "217e665c561f5350"
    plainenglish: >-
      Buyers from the south come up in Haying, set a price for the wool, and leave. They are
      pleasant, and they are putting a price on your whole year. It is the one time each season
      an outsider judges this house's real position and writes it down somewhere the house
      cannot see. He walks through the sheep pen, handles four fleeces out of nine hundred, and
      offers a tenth less than last year. He is right about the wool, and wrong about the
      reason.
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].interaction.choices[id=take_the_offer].label"
    of: "67f5fca0ebd30394"
    plainenglish: >-
      Accept. The money comes at Harvest either way.
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].interaction.choices[id=take_the_offer].outcomes[id=taken].text"
    of: "222e351a80200b36"
    plainenglish: >-
      It is signed on the back of a cart in the yard and paid at Ingathering. The figure goes
      south in his book with a note beside it about the state of the fences. To somebody, that
      note is worth more than the wool was.
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].interaction.choices[id=hold_the_clip].label"
    of: "ea992644e4c79860"
    plainenglish: >-
      Keep the wool and sell it at the Ingathering fair.
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].interaction.choices[id=hold_the_clip].outcomes[id=held_and_sold].text"
    of: "6bde9168ba03f40c"
    plainenglish: >-
      At Bramme it sells for four crowns more after transport costs. It is a small win, and the
      price is that an important man in a southern counting house writes the word 'difficult'
      next to the family's name.
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].interaction.choices[id=hold_the_clip].outcomes[id=it_rains].text"
    of: "46182941425c55a5"
    plainenglish: >-
      It rains for three tendays, the wool sits in the barn the whole time, and it comes out
      worth less than the offer. The merchant is polite about it next Haying, sets his price to
      match, and keeps doing so for eleven years.
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].record.subject"
    of: "b4ef063f4830b6b3"
    plainenglish: >-
      what the wool was worth
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].record.options.record.chronicle"
    of: "3ddc48701fe99624"
    plainenglish: >-
      The wool sold for a tenth less than the year before, because of the state of the fences.
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].record.options.record.claims[0].text"
    of: "ed3849c6c4f0f11a"
    plainenglish: >-
      sold the wool for a tenth less than the year before
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].record.options.embellish.chronicle"
    of: "093c4adeacece01a"
    plainenglish: >-
      The wool sold for a tenth more than the year before, the flock being in better condition
      than the province expected.
  - address: "content:events/papers.yaml#events[id=the_wool_factors_book].record.options.embellish.claims[0].text"
    of: "a931b496de55b862"
    plainenglish: >-
      sold the wool for more than the year before
  - address: "content:events/papers.yaml#events[id=the_oath_men_at_the_assize].title"
    of: "49c0ccae7426e212"
    plainenglish: >-
      Witnesses at Two Marks a Day
  - address: "content:events/papers.yaml#events[id=the_oath_men_at_the_assize].body"
    of: "29b71fd1bf3843fd"
    plainenglish: >-
      Men follow the travelling court from town to town and sell their testimony for two marks a
      day. Everyone knows it. The Warden's clerk knows it and weighs their word accordingly,
      which is why proving a lie in the record needs documents, not witnesses. The case in court
      is about a boundary. The real matter behind it is what four men from Wick say they saw
      {KIN} do in a barn one bad summer. Someone who is not from this house has already
      approached one of the four.
  - address: "content:events/papers.yaml#events[id=the_oath_men_at_the_assize].interaction.choices[id=buy_the_four].label"
    of: "ab2b9e4f8f125443"
    plainenglish: >-
      Pay all four and be done with it.
  - address: "content:events/papers.yaml#events[id=the_oath_men_at_the_assize].interaction.choices[id=buy_the_four].outcomes[id=bought_four].text"
    of: "cbd4d0c614726bca"
    plainenglish: >-
      Eight marks a day for two days. The boundary goes the house's way, and the barn is never
      mentioned. Four men now know exactly what this house will pay to keep a barn from being
      mentioned, and three of them will be at the next court session too.
  - address: "content:events/papers.yaml#events[id=the_oath_men_at_the_assize].interaction.choices[id=bring_the_deed].label"
    of: "e27b3cd59c82a8e1"
    plainenglish: >-
      Bring the property deed instead, and let the witnesses say what they like.
  - address: "content:events/papers.yaml#events[id=the_oath_men_at_the_assize].interaction.choices[id=bring_the_deed].outcomes[id=paper_wins].text"
    of: "7aa712842e7964d0"
    plainenglish: >-
      The deed is ninety years old and badly kept, and it wins in about four minutes, because a
      court in Aubren will trust a bad document over a good witness every day of the year. The
      barn is mentioned twice and goes nowhere. The paid witnesses are paid by the other side,
      and do not much care.
  - address: "content:events/papers.yaml#events[id=the_oath_men_at_the_assize].record.subject"
    of: "76ec1f15154de7d9"
    plainenglish: >-
      how the boundary case was won
  - address: "content:events/papers.yaml#events[id=the_oath_men_at_the_assize].record.options.record.chronicle"
    of: "c077291af06bc056"
    plainenglish: >-
      The boundary case at court was won on a ninety-year-old deed, and in the end neither side
      paid the four witnesses from Wick.
  - address: "content:events/papers.yaml#events[id=the_oath_men_at_the_assize].record.options.record.claims[0].text"
    of: "969091cabe46f846"
    plainenglish: >-
      won at court on a ninety-year-old deed, not on the witnesses
  - address: "content:events/papers.yaml#events[id=the_oath_men_at_the_assize].record.options.embellish.chronicle"
    of: "2440d8e03a24fd6c"
    plainenglish: >-
      The boundary case at court was won on the honest testimony of four men from Wick, freely
      given.
  - address: "content:events/papers.yaml#events[id=the_oath_men_at_the_assize].record.options.embellish.claims[0].text"
    of: "6884849509075e01"
    plainenglish: >-
      won at court thanks to four witnesses who spoke freely
  - address: "content:events/papers.yaml#events[id=the_fell_graziers_have_no_paper].title"
    of: "6ea2f99503158d19"
    plainenglish: >-
      An Unwritten Right Older Than the Province
  - address: "content:events/papers.yaml#events[id=the_fell_graziers_have_no_paper].body"
    of: "1a4d8733f885bc5f"
    plainenglish: >-
      The hill shepherds take their flocks up at Greening and bring them down at Slaughter. They
      graze the hills by a custom older than the province, and in eleven hundred years none of
      them has ever produced a document for it. Neither has anyone else. So the hilltops above
      the house are held by two parties with equally good claims and no paperwork between them.
      Now the Warden's clerk has started taking an interest, because a clerk with a blank space
      on a map has a career ahead of him.
  - address: "content:events/papers.yaml#events[id=the_fell_graziers_have_no_paper].interaction.choices[id=make_common_cause].label"
    of: "a17cda52f6ec7ffe"
    plainenglish: >-
      Join forces. Two claims without paper beat one clerk.
  - address: "content:events/papers.yaml#events[id=the_fell_graziers_have_no_paper].interaction.choices[id=make_common_cause].outcomes[id=common_cause].text"
    of: "7f39b1b89617e73c"
    plainenglish: >-
      A shepherd and a Head standing in the same room, telling a clerk the same story about a
      hill, is something the Nethering has not seen in living memory. It works. It also means
      that, for the first time, the shepherds have a written account of what they hold and who
      agreed to it, in this house's handwriting.
  - address: "content:events/papers.yaml#events[id=the_fell_graziers_have_no_paper].interaction.choices[id=file_first].label"
    of: "34559fc0835cf31c"
    plainenglish: >-
      File the house's claim first, and let them find out at court.
  - address: "content:events/papers.yaml#events[id=the_fell_graziers_have_no_paper].interaction.choices[id=file_first].outcomes[id=filed].text"
    of: "af586f595cb8acf5"
    plainenglish: >-
      Four hundred acres of high grazing land, won because this house was the only party in the
      room that owns a pen. The shepherds spend half of every year on the hills, and they hear
      about it at Slaughter. They are not people who go to court. They have, however, seen
      everything that has ever happened on that hill.
  - address: "content:events/papers.yaml#events[id=the_fell_graziers_have_no_paper].record.subject"
    of: "aaea97fa7fba2a66"
    plainenglish: >-
      who owns the hilltops
  - address: "content:events/papers.yaml#events[id=the_fell_graziers_have_no_paper].record.options.record.chronicle"
    of: "2c63810454f31678"
    plainenglish: >-
      The court recorded the hilltops as this house's property, although the shepherds had held
      them by custom with nothing in writing.
  - address: "content:events/papers.yaml#events[id=the_fell_graziers_have_no_paper].record.options.record.claims[0].text"
    of: "57b01e6061dd5204"
    plainenglish: >-
      had the hilltops recorded as the house's, while the shepherds held them by unwritten
      custom
  - address: "content:events/papers.yaml#events[id=the_fell_graziers_have_no_paper].record.options.embellish.chronicle"
    of: "dd93f34e6e11368a"
    plainenglish: >-
      The court recorded the hilltops as this house's property, with the shepherds' agreement,
      as they have agreed since the founding.
  - address: "content:events/papers.yaml#events[id=the_fell_graziers_have_no_paper].record.options.embellish.claims[0].text"
    of: "91d06c49cb59743d"
    plainenglish: >-
      took the hilltops with the shepherds' agreement
  - address: "content:events/papers.yaml#events[id=the_coroners_view].title"
    of: "b4760577e733d623"
    plainenglish: >-
      The Inquest
  - address: "content:events/papers.yaml#events[id=the_coroners_view].body"
    of: "c812acdd4ff38591"
    plainenglish: >-
      Cases of violent death belong to the Warden's court, and the house only has the right to
      judge minor matters. So a body found on the house's land brings an official from Cawdry
      within four days, whether anyone wants him or not. The dead man is a hired worker, the
      cause was a fall, and the fall is real. What is not ordinary is that he was found inside
      the yard wall, at an hour when the gate has been shut, though never locked, for ninety
      years. And the two hall hounds left the yard at first light and would not come back into
      it until noon.
  - address: "content:events/papers.yaml#events[id=the_coroners_view].interaction.choices[id=plain_account].label"
    of: "a945ef8801a9359c"
    plainenglish: >-
      Tell it simply. A fall is a fall.
  - address: "content:events/papers.yaml#events[id=the_coroners_view].interaction.choices[id=plain_account].outcomes[id=plain].text"
    of: "b0a3f9f125644e85"
    plainenglish: >-
      Recorded at Cawdry as an accident, after four days, eleven marks in fees and a cart. The
      clerk asks about the gate and writes down the answer. He asks about the dogs and does not
      write down the answer, a difference his office makes on purpose.
  - address: "content:events/papers.yaml#events[id=the_coroners_view].interaction.choices[id=settle_with_the_kin].label"
    of: "a1b43f451bb7a341"
    plainenglish: >-
      Settle with his family before the man from Cawdry arrives.
  - address: "content:events/papers.yaml#events[id=the_coroners_view].interaction.choices[id=settle_with_the_kin].outcomes[id=settled].text"
    of: "8334466b64198247"
    plainenglish: >-
      Six crowns to a widow at Wick, and the body taken to her parish before Tuesday. That is
      lawful and generous, and it looks exactly like someone tidying something away. The inquest
      is held anyway, over an empty spot in a yard, and the record says so.
  - address: "content:events/papers.yaml#events[id=the_coroners_view].record.subject"
    of: "7398db8bd947431f"
    plainenglish: >-
      the man found dead inside the yard wall
  - address: "content:events/papers.yaml#events[id=the_coroners_view].record.options.record.chronicle"
    of: "cfc5755a7c38fda6"
    plainenglish: >-
      A hired man was found dead inside the yard wall at dawn while the gate was shut, and the
      hounds would not come in until noon.
  - address: "content:events/papers.yaml#events[id=the_coroners_view].record.options.record.claims[0].text"
    of: "346bd72dca9b2fc1"
    plainenglish: >-
      had a hired man found dead at dawn inside the yard wall, with the gate shut
  - address: "content:events/papers.yaml#events[id=the_coroners_view].record.options.embellish.chronicle"
    of: "3ebece05a7408e41"
    plainenglish: >-
      A hired man was found dead on the Wick road after a fall, and was taken to his own parish
      the same day.
  - address: "content:events/papers.yaml#events[id=the_coroners_view].record.options.embellish.claims[0].text"
    of: "36beb4786d2fe91c"
    plainenglish: >-
      had the man taken from the Wick road to his own parish
  - address: "content:events/papers.yaml#events[id=the_relief_on_inheritance].title"
    of: "f20140015fe3a0f5"
    plainenglish: >-
      A Year's Income in Inheritance Tax
  - address: "content:events/papers.yaml#events[id=the_relief_on_inheritance].body"
    of: "d98664e7ae885b73"
    plainenglish: >-
      The tax on inheriting the estate is one year's income. The Crown works it out from the
      last statement of income, which the house wrote itself. At Cawdry there is a clerk whose
      whole job is the gap between what a house declares and what its sheep pens look like from
      the road. He has ridden past these pens. The Head of the house has just changed, and the
      tax is due before Thaw. Every crown declared now stays declared for ever, in a book that
      also shows what was declared last time.
  - address: "content:events/papers.yaml#events[id=the_relief_on_inheritance].interaction.choices[id=declare_true].label"
    of: "656c747ce681c808"
    plainenglish: >-
      Declare the true amount.
  - address: "content:events/papers.yaml#events[id=the_relief_on_inheritance].interaction.choices[id=declare_true].outcomes[id=true_return].text"
    of: "d01aa804eb894470"
    plainenglish: >-
      Sixty-four crowns, paid in two parts, and the clerk moves on to a house he finds more
      interesting. An honest statement is expensive once and cheap for two hundred years, but
      nobody in this family has ever been able to prove that second part to anyone.
  - address: "content:events/papers.yaml#events[id=the_relief_on_inheritance].interaction.choices[id=declare_short].label"
    of: "bfd9d1bea3ff572a"
    plainenglish: >-
      Declare less. The sheep had a bad sickness and the roof is gone.
  - address: "content:events/papers.yaml#events[id=the_relief_on_inheritance].interaction.choices[id=declare_short].outcomes[id=short_return].text"
    of: "a2b8eaa758ecd50b"
    plainenglish: >-
      Forty-one crowns, all of it defensible and none of it true, and the clerk accepts it in a
      single afternoon. The next inheritance tax comes in about thirty years, and it will be
      checked against this afternoon's number by someone with both books open.
  - address: "content:events/papers.yaml#events[id=the_relief_on_inheritance].record.subject"
    of: "c2629ab5e1d227f9"
    plainenglish: >-
      what the house declared for the inheritance tax
  - address: "content:events/papers.yaml#events[id=the_relief_on_inheritance].record.options.record.chronicle"
    of: "0a88b2c31e2ec807"
    plainenglish: >-
      The inheritance tax was set at forty-one crowns, based on a statement this house wrote
      short. The flock was in better shape than we said.
  - address: "content:events/papers.yaml#events[id=the_relief_on_inheritance].record.options.record.claims[0].text"
    of: "cab1bbb6b0b3424a"
    plainenglish: >-
      under-declared for the inheritance tax and was charged forty-one crowns
  - address: "content:events/papers.yaml#events[id=the_relief_on_inheritance].record.options.embellish.chronicle"
    of: "d66211003006b9c4"
    plainenglish: >-
      The inheritance tax was set at forty-one crowns on an honest statement, given the sheep
      sickness and the roof.
  - address: "content:events/papers.yaml#events[id=the_relief_on_inheritance].record.options.embellish.claims[0].text"
    of: "0342e09ea1f0e27a"
    plainenglish: >-
      made an honest statement for the inheritance tax
  - address: "content:events/papers.yaml#events[id=both_books_open].title"
    of: "7b24a7a003e13bd4"
    plainenglish: >-
      Both Account Books Open
  - address: "content:events/papers.yaml#events[id=both_books_open].body"
    of: "6cebb54548e76dc1"
    plainenglish: >-
      The house has a new Head again, and the inheritance tax is due before Thaw. The clerk who
      rides out from Cawdry is not the one who came last time. He has the old tax return in one
      hand and the new one in the other, and he reads them at the table in the hall by the fire,
      without taking his gloves off. The sheep have had no disease in thirty years, and he says
      so quietly, laying the old return on top of the new one and working out the true amount
      aloud: sixty-four crowns. Then he asks about the last one.
  - address: "content:events/papers.yaml#events[id=both_books_open].interaction.choices[id=make_it_good].label"
    of: "1bfd54eac90bb3d6"
    plainenglish: >-
      Pay the true amount, plus what was owed last time.
  - address: "content:events/papers.yaml#events[id=both_books_open].interaction.choices[id=make_it_good].outcomes[id=made_good].text"
    of: "f578578906b30c6d"
    plainenglish: >-
      Eighty-seven crowns, counted out on the table while he watches. He writes one line under
      the old return and signs it with his initials. After that the house's tax returns are
      boring, and the clerk stops riding past its sheep.
  - address: "content:events/papers.yaml#events[id=both_books_open].interaction.choices[id=declare_short_again].label"
    of: "63bc5aff066a13c3"
    plainenglish: >-
      Declare less again. The sheep had a bad year.
  - address: "content:events/papers.yaml#events[id=both_books_open].interaction.choices[id=declare_short_again].outcomes[id=short_again].text"
    of: "2707af3e7b9b7892"
    plainenglish: >-
      Forty-four crowns, and he accepts them, and he writes the house's name on a different list
      from the one he arrived with. Nobody tells the house what that list is for. Nobody needs
      to.
