      What the Watch Noticed
  - address: "content:events/retainers.yaml#events[id=what_the_watch_caught].body"
    of: df2302566bd6807a
    plainenglish: >-
      The watch rings a bell three times instead of shouting. {HEAD} is dressed before the gate
      opens. Tonight, a peddler has a broken axle and a long story about the ford. On other
      nights, the visitor may not be a peddler. The watch can never know which arrival matters
      until it has already stopped the visitor.
  - address: "content:events/retainers.yaml#events[id=what_the_watch_caught].interaction.outcomes[id=noted].text"
    of: c418de56a130974a
    plainenglish: >-
      Nothing happens. That is why the house pays the watch to notice trouble before it begins.
      Before the peddler fixes his axle, word spreads across the district that this house knows
      when someone is coming.
  - address: "content:events/retainers.yaml#events[id=what_the_watch_caught].interaction.outcomes[id=noted].effects[0].text"
