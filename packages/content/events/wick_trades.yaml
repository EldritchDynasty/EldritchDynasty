# THE VILLAGE TRADES.
#
# COMMON. About a hundred and twenty souls at Wick, all tenants, and among
# them a smith, a miller, a carpenter, an alewife and whoever else the decade
# has produced. The house does not employ them. It holds their land, grinds at
# their mill, buys their iron, and judges their quarrels, which is a more
# entangled relationship than employment and much harder to end.
#
# The smith matters more than the rest put together, and not because of the
# horses: iron is the one thing in this world that everybody agrees goes
# strange where the blood is, and the man who works it in this parish has
# thirty years of evidence and no theory he is willing to say out loud.
events:
  - id: the_smith_wants_the_charcoal_contract
    title: The Smith Would Like It in Writing
    tier: head
    frequency: common
    weight: 80
    tags: [tenants, trade, money, law]
    purposes: [buy_patience, change_relationship, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      The smith sets a sack of damp charcoal on the hall floor. Wick buys it
      from the colliers in the house's wood on a handshake older than either
      man. He wants that rate fixed in writing for twenty years, with a copy
      at Bramme that the next Head will have to answer. Charcoal has been
      short twice in living memory. The smith says his apprentice will still
      be here when the men who made the handshake are gone. The sack has
      stained the boards.
    interaction:
      kind: choice
      choices:
        - id: write_it
          label: Write it. Twenty years, fixed, notarised at Bramme.
          outcomes:
            - id: written
              weight: 100
              text: >-
                The smith pays for the notary's copy. The house keeps the
                other, with the rate set above the signatures and no space
                left for a later figure. The paper is put where the accounts
                for the wood are kept. Both men have a copy.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: 10 }
                - { kind: chronicle, text: "{HEAD} bound the house to a twenty-year charcoal rate witnessed at Bramme." }
              # #1810: the written obligation has an actual later reader.
              # No HEAD binding: the contract belongs to the house.
              next:
                event: the_charcoal_price_returns
                after: { minYears: 11, maxYears: 11 }
        - id: keep_the_handshake
          label: Keep the handshake. It has held for forty years.
          outcomes:
            - id: handshake
              weight: 100
              text: >-
                The smith carries the sack away at the old rate. When the
                apprentice asks what he is to promise after the smith is gone,
                the answer is that the old word has always been enough. The
                apprentice looks towards Bramme.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -8 }

  - id: the_charcoal_price_returns
    title: The Price Written Down
    tier: head
    frequency: common
    weight: 80
    tags: [charcoal, tenants, contracts, records]
    purposes: [buy_patience, change_relationship, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      Charcoal cracks under the collier's boot in the yard. The collier has
      the Bramme copy of the twenty-year rate, and today's charge is twice the
      one under the seal. {HEAD} is offered a settlement: thirteen crowns from
      the house will keep the smith supplied at the old figure until the term
      is out. The house's copy lies on the table.
    interaction:
      kind: choice
      choices:
        - id: keep_the_rate
          label: Keep the written rate. Pay thirteen crowns.
          outcomes:
            - id: kept
              weight: 100
              text: >-
                The collier takes the money and writes the settlement under
                the old signatures. The smith gets the load at the price fixed
                before this shortage, and the two copies will still agree
                when either of them is read again. The seal stays where it was.
              effects:
                - { kind: treasury, delta: -13 }
                - { kind: relationship, from: household, to: head, sentiment: 6 }
                - { kind: chronicle, text: "The house kept the signed charcoal rate after the price rose, paying thirteen crowns to cover the rest of the term." }
              agreedPrices:
                - effect: 0
                  reason: purchase
        - id: change_our_copy
          label: Change our copy. Claim the rate was never fixed.
          outcomes:
            - id: altered
              weight: 100
              text: >-
                The new figure is entered in the house copy without disturbing
                the seal. At Bramme the other copy still has the older figure,
                and at Wick the smith reads both aloud before the colliers.
                The old signatures have not moved.
              effects:
                - { kind: discrepancy, op: create, id: the_charcoal_rate_rewritten, severity: major, provableBy: [commons, the_church] }
                - { kind: relationship, from: household, to: head, sentiment: -12 }
                - { kind: chronicle, text: "{HEAD} had a higher charcoal rate entered in the house copy and certified that the signed rate had never been fixed." }

  - id: the_miller_and_the_thumb
    title: What Everybody Says About Every Miller
    tier: head
    frequency: common
    weight: 80
    tags: [mill, tenants, money, quarrel]
    purposes: [buy_patience, change_standing, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      Every village in the Settled Lands says its miller has a heavy thumb and
      about a third of them are right, and Wick has been saying it about this
      one for eleven years. The mill is the house's and the miller holds it of
      the house, so the accusation is really about the hall and everybody
      making it knows that. Four tenants have brought their own weights up the
      hill. The weights are not the same as each other, which is the first
      thing the steward notices and the last thing anybody wants to hear.
    interaction:
      kind: choice
      choices:
        - id: weigh_it_publicly
          label: Weigh it in the yard, with the reeve, in front of everybody.
          outcomes:
            - id: the_miller_is_honest
              weight: 55
              text: >-
                Four sacks, four weights and a set of the house's own, and the
                miller is honest to within what a wet day does to grain. The
                four tenants are not humiliated because the Head is careful not
                to humiliate them. Nobody says the word thumb at Wick for
                nineteen years.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: household, to: head, sentiment: 6 }
            - id: the_miller_is_not
              weight: 45
              text: >-
                About a fortieth part, consistently, for eleven years, which
                comes to more grain than the man's own holding produces. He is
                put out of the mill and off the land in the same afternoon and
                the parish watches all of it. The new miller is honest for
                about nine years.
              effects:
                - { kind: treasury, delta: 9 }
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: household, to: head, sentiment: -6 }
        - id: leave_it_alone
          label: Leave it. Every village says this about every miller.
          outcomes:
            - id: left
              weight: 100
              text: >-
                Nothing is weighed and nothing is settled and the saying goes
                on being said, and grows a verse, and the verse acquires the
                hall in it somewhere around the fourth telling. In thirty years
                nobody at Wick can remember whether it was ever about the
                miller.
              effects:
                - { kind: rumour, op: seed, id: rumour_the_thumb_on_the_scale, accuracy: 0.4 }

  - id: the_carpenter_is_getting_old
    title: There Is No Second Carpenter
    tier: head
    frequency: common
    weight: 70
    tags: [tenants, trade, upkeep, hardship]
    purposes: [advance_clause, buy_patience, change_relationship]
    conditions: { flag: no_carpenter_at_wick, is: false }
    slots:
      HEAD: { role: head }
    body: >-
      The carpenter at Wick is sixty-one and his hands have gone and there is
      nobody behind him, because his own boys went for soldiers and the trade
      takes seven years to teach. Everything wooden in this parish is his
      work — carts, gates, roof timbers, the mill's own gear. Bramme has four
      carpenters and none of them will come eleven miles for a gate. An
      apprenticeship costs the house nine crowns and takes seven years to pay
      anybody back.
    interaction:
      kind: choice
      choices:
        - id: apprentice_a_boy
          label: Put a boy to him. Nine crowns and seven years.
          outcomes:
            - id: apprenticed
              weight: 62
              text: >-
                Nine crowns, seven years and a cottager's second son who turns
                out to have hands, and by the time the old man dies there is
                somebody in this parish who can hang a gate. It is the least
                interesting decision made at this table in a decade and one of
                the four or five most useful.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: relationship, from: household, to: head, sentiment: 8 }
              agreedPrices:
                - effect: 0
                  reason: contract
            - id: the_boy_leaves
              weight: 38
              text: >-
                Nine crowns and four years, and then the boy goes to Bramme
                where there is more work and better company, which he is
                entirely entitled to do and which nobody had thought to write
                anything down about. The old man's hands do not come back.
              effects:
                - { kind: treasury, delta: -9 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: pay_bramme_rates
          label: Pay Bramme rates when we need one. It is cheaper than seven years.
          outcomes:
            - id: bramme_rates
              weight: 100
              text: >-
                It is cheaper for about eleven years and then it is not, and by
                then there is no trade in this parish at all and every gate,
                cart and roof timber comes eleven miles at a price set by
                somebody who knows there is no alternative. That is the whole
                arithmetic and it takes two generations to become visible.
              effects:
                - { kind: treasury, delta: -4 }
                - { kind: flag, flag: no_carpenter_at_wick, set: true }
              next:
                event: the_price_of_no_carpenter
                after: { minYears: 40, maxYears: 50 }
              agreedPrices:
                - effect: 0
                  reason: contract

  # #1276 / #334: the four-crown saving promised a bill two generations later.
  # This follows only that purchase, rather than competing for an ambient draw.
  # No HEAD binding: the bill belongs to whoever holds the seal when it arrives.
  - id: the_price_of_no_carpenter
    title: The Price of Having Nobody
    tier: head
    frequency: common
    weight: 100
    tags: [tenants, trade, upkeep, hardship]
    purposes: [buy_patience, change_relationship, worldbuild_through_action]
    conditions: { flag: no_carpenter_at_wick, is: true }
    slots:
      HEAD: { role: head }
    body: >-
      The Bramme cart creaks into the yard with rain dripping off its load.
      The gates need replacing, the mill needs a cog, and a cottage has lost
      part of its roof. The reeve puts the old account before {HEAD}, with
      its four-crown entry for work bought outside the parish. That was two
      generations ago. Today's bill is twenty-eight crowns, and no one at
      Wick can mend what is on the cart. The Bramme carpenter would stay if
      the house repaired a cottage for him and fitted a bench; with this
      bill paid, the whole settlement would cost thirty-six crowns. Rain
      runs off the uncovered tools.
    interaction:
      kind: choice
      choices:
        - id: pay_the_bill
          label: Pay for the work. Twenty-eight crowns.
          outcomes:
            - id: paid
              weight: 100
              text: >-
                The gates swing, the mill turns, and the cottage keeps the
                rain out. Twenty-eight crowns go back to Bramme with the
                cart. The reeve files the bill beside the four-crown entry.
                There is still no bench at Wick.
              effects:
                - { kind: treasury, delta: -28 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: bring_a_carpenter_to_wick
          label: Give him a cottage and a bench. Thirty-six crowns, including the work.
          outcomes:
            - id: settled
              weight: 100
              text: >-
                The repair bill is paid, and eight crowns more buys a roof
                for the empty cottage and a bench under its window. He
                brings his tools from Bramme before Ingathering. The reeve
                sends the next broken gate down the lane instead of eleven
                miles along the road. The shavings stay here.
              effects:
                - { kind: treasury, delta: -36 }
                - { kind: relationship, from: household, to: head, sentiment: 8 }
                - { kind: flag, flag: no_carpenter_at_wick, set: false }
              agreedPrices:
                - effect: 0
                  reason: purchase

  - id: the_alewife_and_the_licence
    title: The Alewife Has No Licence and Never Has
    tier: head
    frequency: common
    weight: 75
    tags: [tenants, law, money, custom]
    purposes: [buy_patience, change_standing, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      Brewing for sale wants a licence from the magistrate at Bramme and the
      alewife at Wick has never had one and neither did her mother. It has
      never mattered, because the low justice on this land is the house's and
      the house has never asked. A burgess of Bramme has now noticed, in
      writing, because Bramme's brewers pay for theirs. The letter is
      courteous and quotes a statute correctly.
    interaction:
      kind: choice
      choices:
        - id: buy_her_a_licence
          label: Buy her the licence. Four crowns and the letter goes away.
          outcomes:
            - id: licensed
              weight: 100
              text: >-
                Four crowns to the magistrate, a licence in her name, and the
                first document that woman has ever had with her name on it,
                which she keeps in a box and shows people for the rest of her
                life. Bramme's burgesses are satisfied. Every alehouse in the
                province now knows the hall pays.
              effects:
                - { kind: treasury, delta: -4 }
                - { kind: relationship, from: household, to: head, sentiment: 8 }
              agreedPrices:
                - effect: 0
                  reason: purchase
        - id: assert_the_franchise
          label: "Seal the franchise claim with a false date predating the statute."
          outcomes:
            - id: asserted
              weight: 100
              text: >-
                The house copy acquires a date eleven years before the statute. Bramme
                receives a sealed claim that the alehouse is exempt by prior franchise. The
                alewife brews on, and the house gains its point in public. The bench keeps
                the newer original.
              effects:
                - {kind: discrepancy, op: create, id: the_alewife_franchise_backdated, severity: minor, provableBy: [commons, the_church]}
                - {kind: respect, delta: 1}
                - {kind: chronicle, text: '{HEAD} certified a false early date for the alehouse franchise and sent the claim to Bramme.'}
              # On the outcome, where `next` lives (#995). Written on the choice it
              # was stripped without a word, and this scene fired ambiently instead.
              next:
                event: the_file_a_clerk_went_looking_for
                after: { minYears: 70, maxYears: 95 }


  # #341: `asserted` promised that "in about ninety years a clerk with a
  # grievance goes looking for exactly that kind of file", and no clerk ever
  # came. This is the clerk. Neither answer costs coin; both cost Wick.
  - id: the_file_a_clerk_went_looking_for
    title: The Hall's Own Letter, Returned
    tier: head
    frequency: uncommon
    weight: 100
    tags: [tenants, law, custom, record]
    purposes: [change_relationship, plant_rumour, buy_patience]
    slots:
      HEAD: { role: head }
    body: >-
      A clerk at Bramme has put the house's sealed alehouse claim beside the original
      franchise. The dates do not agree. The present Head is asked to levy the old licensing
      fine or refuse in writing; either reply will go into the same file. The alewife at
      Wick has put a clean cup beside her licence box.
    interaction:
      kind: choice
      choices:
        - id: levy_it
          label: Levy it. Our justice, so our fine.
          outcomes:
            - id: levied
              weight: 100
              text: >-
                The reeve walks down on a market day, takes the fine off the
                counter in front of the whole room, and sends every mite of
                it on to Bramme. The town is satisfied that the hall's justice
                works. The alehouse goes quiet when anybody from the hall
                comes in, and stays quiet for a generation.
              effects:
                - {kind: discrepancy, op: prove, id: the_alewife_franchise_backdated}
                - {kind: relationship, from: household, to: head, sentiment: -10}
        - id: refuse_in_writing
          label: Write that the house will not, and seal it.
          outcomes:
            - id: refused
              weight: 100
              text: >-
                One sentence, sealed, and filed at Bramme beside the first.
                She brews on. The town now holds two letters from the hall
                that say together that it keeps a justice and will not use
                it, which is the sort of pair a clerk carries to Cawdry when
                he wants the Warden to look at something.
              effects:
                - {kind: discrepancy, op: prove, id: the_alewife_franchise_backdated}
                - {kind: relationship, from: household, to: head, sentiment: 6}
                - {kind: rumour, op: seed, id: rumour_the_halls_justice_is_a_shelter, accuracy: 0.6}

  - id: the_thatcher_from_the_lag
    title: A Thatcher, Down From the Lag
    tier: family
    frequency: common
    weight: 70
    tags: [tenants, upkeep, hardship, lag]
    purposes: [buy_patience, change_relationship, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      Four cottages on the lane need rethatching and reed is what reed is,
      which means the Lag, forty miles down the Wend, where they cut it and
      where everybody in this province believes the people are webbed. He is
      cheaper than anybody else by half and he is very good and he will not
      stay in the village. He asks to sleep in the house's own barn. The reeve
      has already said no to that on the house's behalf without being asked.
    interaction:
      kind: choice
      choices:
        - id: give_him_the_barn
          label: Give him the barn, and say so in front of the reeve.
          outcomes:
            - id: the_barn
              weight: 100
              text: >-
                Four cottages thatched in eleven days by a man who is better at
                it than anybody within forty miles, and a barn slept in, and a
                reeve who has been publicly corrected in front of his own
                parish and will remember that for longer than the thatch lasts.
                He comes back every seven years for thirty years.
              effects:
                - { kind: treasury, delta: -11 }
                - { kind: relationship, from: household, to: head, sentiment: -5 }
              agreedPrices:
                - effect: 0
                  reason: gift
        - id: back_the_reeve
          label: Back the reeve. He has to live here and the Lag man does not.
          outcomes:
            - id: he_goes_home
              weight: 100
              text: >-
                He walks back to the Lag the same afternoon without a word of
                complaint, being entirely used to it, and the four cottages are
                done by a man out of Ockleigh at twice the price and about half
                the standard. Two of them leak by the following Frostfall. The
                reeve does not mention that either.
              effects:
                - { kind: treasury, delta: -22 }
                - { kind: rumour, op: seed, id: rumour_who_the_hall_would_not_house, accuracy: 0.35 }
              site:
                kind: hall
                hall: main
              primordial:
                id: he_goes_home_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} stands beneath the first open roof. The reed rises from its fallen
                  bundle and holds against the rafters until the bindings are made. The thatcher still
                  leaves; fewer cottages are left to buy work twice.
                effects:
                  - {kind: treasury, delta: -11}
                  - {kind: rumour, op: seed, id: rumour_who_the_hall_would_not_house, accuracy: 0.35}
                tags:
                  - primordial
                record: null

  - id: the_tanner_downwind
    title: Downwind, and Not Far Enough
    tier: head
    frequency: common
    weight: 65
    tags: [tenants, quarrel, trade, law]
    purposes: [change_relationship, change_standing, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      A tanner has set up at the bottom of the lane because a tanner has to set
      up somewhere, and the whole of Wick is downwind of him on the prevailing
      wind, which is nine days out of ten. Nobody disputes his right to the
      holding. Everybody disputes the smell, and eleven households have come up
      the hill about it in one tenday, which has not happened about anything in
      thirty years. The house needs leather as much as anybody.
    interaction:
      kind: choice
      choices:
        - id: move_him
          label: Move him. Give him the river close and pay the moving.
          outcomes:
            - id: moved
              weight: 100
              text: >-
                Six crowns of the house's money to move a man half a mile
                downstream onto ground nobody was using, and eleven households
                that got what they came for, and a tanner who has been shown
                that the hall will spend on him. The river close is where the
                parish draws water in a dry summer. Nobody thinks of that for
                nine years.
              effects:
                - { kind: treasury, delta: -6 }
                - { kind: relationship, from: household, to: head, sentiment: 12 }
              agreedPrices:
                - effect: 0
                  reason: gift
        - id: leave_him_where_he_is
          label: Leave him. A tanner has to be somewhere and that is somewhere.
          outcomes:
            - id: left_there
              weight: 100
              text: >-
                The eleven households are told, correctly, that the holding is
                his and the wind is nobody's, and they go back down the hill
                having learned what asking the hall for something is worth.
                Wick smells of it for forty years. The leather is good and it
                is cheap and nobody has ever thanked the house for either.
              effects:
                - { kind: treasury, delta: 4 }
                - { kind: relationship, from: household, to: head, sentiment: -9 }

  - id: the_shepherd_who_is_worth_more
    title: The Bitch Is Worth More Than the Shepherd
    tier: family
    frequency: common
    weight: 70
    tags: [dogs, tenants, money, signs]
    purposes: [change_relationship, plant_rumour, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      Everybody in the Nethering says the shepherd's bitch is worth more than
      the shepherd and in this case it is arithmetic rather than a joke: she
      works two hundred head on ground three men could not hold. She is nine
      and she has one litter left in her. The shepherd wants four crowns for a
      pup and knows exactly what he is asking. He also mentions, packing up,
      that she has stopped going into the upper fold and he cannot get her
      past the beck.
    interaction:
      kind: choice
      choices:
        - id: buy_the_pup
          label: Buy the pup. Four crowns for the best blood in the province.
          outcomes:
            - id: bought
              weight: 100
              text: >-
                Four crowns and a dog that is working sheep at fourteen months
                and is the best thing on four legs at Ardwen for eleven years.
                Nobody follows up the other remark. In the ninth year she stops
                at the beck too, in the same place, on the same ground, and by
                then there is nobody left who remembers being told.
              effects:
                - { kind: treasury, delta: -4 }
                - { kind: rumour, op: seed, id: rumour_where_the_dogs_stop_at_the_beck, accuracy: 0.3 }
              agreedPrices:
                - effect: 0
                  reason: purchase
        - id: ask_about_the_beck
          label: Never mind the pup. Ask him about the beck.
          outcomes:
            - id: he_explains
              weight: 100
              text: >-
                He is a shepherd and has no theory and gives none, and what he
                gives instead is four years of dates: which spring she stopped,
                which ground she will not take, and which of the other dogs
                followed her in it and which did not. It is the most precise
                account of anything anybody has ever brought up this hill. He
                does not know why he remembers it.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: 4 }

  - id: the_ploughs_go_out_late
    title: Eleven Ploughs and One Smith
    tier: family
    frequency: common
    weight: 70
    tags: [tenants, harvest, trade, hardship]
    purposes: [buy_patience, change_standing, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      Every plough in this parish wants its share laid and sharpened before
      Seedmonth and there is one forge to do eleven of them in four tendays.
      The order they go through is the smith's business and always has been.
      This year the smith has been ill for a tenday and is three behind, and
      the three are the three furthest from the village, which is not a
      coincidence and is not malice either.
    interaction:
      kind: narration
      outcomes:
        - id: the_house_pays_bramme
          weight: 55
          text: >-
            The house pays a Bramme smith to come out for three days and the
            three furthest ploughs go out on time, and it costs five crowns and
            nobody at Wick is told who paid for it, which is the only part of
            the arrangement the steward argues about.
          effects:
            - { kind: treasury, delta: -5 }
            - { kind: relationship, from: household, to: head, sentiment: 6 }
          site:
            kind: hall
            hall: main
          primordial:
            id: the_house_pays_bramme_primordial
            text: >-
              {PRIMORDIAL_ACTOR} takes up the worn share in the yard. Its edge holds through a pass on
              the stone that should have taken the last of it. Some of the ploughs can go out without
              the extra Bramme work.
            effects:
              - {kind: treasury, delta: -2}
              - {kind: relationship, from: household, to: head, sentiment: 6}
            tags:
              - primordial
            record: null
        - id: they_sow_late
          weight: 45
          text: >-
            The three sow a tenday late into ground that has already dried past
            its best, and it shows at Harvest on those three holdings and
            nowhere else, and all three of them pay their rent short and none
            of them says why.
          effects:
            - { kind: treasury, delta: -7 }
          site:
            kind: hall
            hall: main
          primordial:
            id: they_sow_late_primordial
            text: >-
              {PRIMORDIAL_ACTOR} takes up the worn share in the yard. Its edge holds through a pass on
              the stone that should have taken the last of it. Some of the ploughs can go out without
              the extra Bramme work.
            effects:
              - {kind: treasury, delta: -3}
            tags:
              - primordial
            record: null

  - id: the_cottager_who_can_read
    title: One of Them Can Read
    tier: head
    frequency: common
    weight: 70
    tags: [tenants, records, law, knowledge]
    purposes: [change_relationship, change_standing, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      Almost nobody is literate at the bottom of this world and a cottager's
      daughter at Wick can read, having been taught by a keeper who is nineteen
      years dead and had time on his hands. She has read the terms nailed to
      the church door, which nobody has ever done, and she has found something
      in them. She is not making trouble. She has come up the hill to ask a
      question about a clause, politely, with the wording remembered exactly.
    interaction:
      kind: choice
      choices:
        - id: answer_her_properly
          label: Answer her properly, and answer the clause honestly.
          outcomes:
            - id: answered
              weight: 100
              text: >-
                Half an hour in the yard and an honest answer, which is that
                the clause means what she thinks it means and has not been
                enforced in sixty years. She thanks the Head and goes home and
                tells eleven households. Nothing changes. Everything about how
                that village reads the terms on that door changes.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: household, to: head, sentiment: 10 }
        - id: send_her_to_the_steward
          label: Send her to the steward. This is not a matter for the hall.
          outcomes:
            - id: sent_to_the_steward
              weight: 100
              text: >-
                The steward is courteous, is entirely unhelpful, and is very
                careful to be both, and she goes home understanding precisely
                what she has been told. She teaches her own children to read.
                In 1247 one of them is the reason a boundary case at Cawdry
                goes the way it goes.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -6 }

  - id: the_forge_fire_in_deepwinter
    title: The Only Warm Building in the Parish
    tier: family
    frequency: common
    weight: 70
    tags: [tenants, winter, hardship, custom]
    purposes: [change_relationship, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      In the worst tendays of Deepwinter the forge is the only building in Wick
      that is properly warm, and by custom nobody says anything about the
      dozen people who are in it at any hour not obviously having business
      there. The smith burns about four crowns of extra charcoal a winter for
      that and has never mentioned it to anybody. The steward has noticed,
      because the charcoal comes out of the house's wood.
    interaction:
      kind: choice
      choices:
        - id: say_nothing_and_pay_it
          label: Say nothing. Let the wood cover it.
          outcomes:
            - id: covered
              weight: 100
              text: >-
                Four crowns of charcoal a winter that nobody accounts for and
                nobody thanks anybody for, because thanking anybody would
                require saying out loud what is being done, which would end it.
                It goes on for sixty years across three Heads and two smiths.
                Nobody writes it down.
              effects:
                - { kind: treasury, delta: -4 }
                - { kind: relationship, from: household, to: head, sentiment: 7 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: charge_it_to_him
          label: Charge it to him. The wood is the house's.
          outcomes:
            - id: charged
              weight: 100
              text: >-
                Four crowns entered against the smith, which he pays without a
                word, and the forge door is shut to everybody without business
                there from the following Frostfall. It is entirely correct.
                Wick spends that winter in its own cottages and works out for
                itself which change came first.
              # #341: the purpose was always plant_rumour, and this is the
              # side where Wick works something out for itself.
              effects:
                - { kind: treasury, delta: 4 }
                - { kind: relationship, from: household, to: head, sentiment: -11 }
                - { kind: rumour, op: seed, id: rumour_the_forge_door_shut, accuracy: 0.6 }

proseVariants:
  - address: content:events/wick_trades.yaml#events[id=the_carpenter_is_getting_old].title
    of: e7abfc7ab283bcc6
    plainenglish: Wick has only one carpenter
  - address: content:events/wick_trades.yaml#events[id=the_carpenter_is_getting_old].body
    of: 61140114c6295de0
    plainenglish: Wick's carpenter is 61, and his hands can no longer do the work. His sons
      became soldiers, so he has no apprentice to replace him. Training someone takes
      seven years. The parish relies on him for its carts, gates, roof beams and wooden
      mill parts. Bramme has four carpenters, but none will travel eleven miles just to
      repair a gate. The house could pay nine crowns to train a local apprentice, who
      would become useful after seven years.
  - address: content:events/wick_trades.yaml#events[id=the_carpenter_is_getting_old].interaction.choices[id=apprentice_a_boy].label
    of: 295e6fbc10f1a398
    plainenglish: Pay nine crowns to train an apprentice over seven years.
  - address: content:events/wick_trades.yaml#events[id=the_carpenter_is_getting_old].interaction.choices[id=apprentice_a_boy].outcomes[id=apprenticed].text
    of: 23b558e357ad9b07
    plainenglish: The house pays nine crowns to train a cottager's second son. After seven
      years he is skilled enough to take over when the old carpenter dies. Wick keeps
      someone who can repair its gates and other wooden equipment. This small decision
      proves useful to the whole parish.
  - address: content:events/wick_trades.yaml#events[id=the_carpenter_is_getting_old].interaction.choices[id=apprentice_a_boy].outcomes[id=the_boy_leaves].text
    of: d499c38b3eceb82f
    plainenglish: The house pays nine crowns, but after four years the apprentice moves to
      Bramme for more work and a better social life. No agreement requires him to stay at
      Wick, so he is free to leave. The old carpenter is still unable to work as before.
  - address: content:events/wick_trades.yaml#events[id=the_carpenter_is_getting_old].interaction.choices[id=pay_bramme_rates].label
    of: 5258d10b661b1497
    plainenglish: Hire carpenters from Bramme when needed. It costs less at first.
  - address: content:events/wick_trades.yaml#events[id=the_carpenter_is_getting_old].interaction.choices[id=pay_bramme_rates].outcomes[id=bramme_rates].text
    of: c3066fb6da44adba
    plainenglish: Hiring from Bramme costs less for about eleven years. By then Wick has lost
      its own carpentry trade. Every gate, cart and roof beam must come from eleven miles
      away, at prices set by suppliers who face no local competition. The full cost
      becomes clear two generations later.
  - address: content:events/wick_trades.yaml#events[id=the_price_of_no_carpenter].title
    of: 06bfed46bc19299a
    plainenglish: The cost of losing Wick's carpenter
  - address: content:events/wick_trades.yaml#events[id=the_price_of_no_carpenter].body
    of: 7292e21fa4331d03
    plainenglish: A cart from Bramme arrives in the rain. Wick needs new gates, a replacement
      mill cog and repairs to a cottage roof. The reeve shows {HEAD} an account from two
      generations ago, when the house paid four crowns for carpentry from outside the
      parish. The current work costs twenty-eight crowns because no one at Wick can do it.
      The Bramme carpenter offers to move to Wick if the house repairs a cottage for him
      and provides a workbench. Paying for the repairs and helping him settle would cost
      thirty-six crowns in total.
  - address: content:events/wick_trades.yaml#events[id=the_price_of_no_carpenter].interaction.choices[id=pay_the_bill].label
    of: d0a01879f752ec7d
    plainenglish: Pay twenty-eight crowns for the repairs.
  - address: content:events/wick_trades.yaml#events[id=the_price_of_no_carpenter].interaction.choices[id=pay_the_bill].outcomes[id=paid].text
    of: 4683b3f5328a60f1
    plainenglish: The gates, mill and cottage roof are repaired. The house pays twenty-eight
      crowns, and the carpenter returns to Bramme. The reeve files the bill with the old
      four-crown account. Wick still has no local carpenter.
  - address: content:events/wick_trades.yaml#events[id=the_price_of_no_carpenter].interaction.choices[id=bring_a_carpenter_to_wick].label
    of: 6d748856ffebff0a
    plainenglish: Pay thirty-six crowns for the repairs and help the carpenter settle at Wick.
  - address: content:events/wick_trades.yaml#events[id=the_price_of_no_carpenter].interaction.choices[id=bring_a_carpenter_to_wick].outcomes[id=settled].text
    of: "2698501e13163052"
    plainenglish: The house pays the repair bill and spends eight crowns more to repair an
      empty cottage and provide a workbench. The carpenter moves his tools from Bramme
      before Ingathering. Wick can now have its gates repaired locally instead of sending
      them eleven miles away.
  - address: "content:events/wick_trades.yaml#events[id=the_smith_wants_the_charcoal_contract].title"
    of: "b356671125a3169d"
    plainenglish: >-
      The Smith Wants It Written Down
  - address: "content:events/wick_trades.yaml#events[id=the_smith_wants_the_charcoal_contract].body"
    of: "cc8fed558707de91"
    plainenglish: >-
      The smith brings a damp sack of charcoal into the hall. He has always bought from the
      colliers in the house wood on an unwritten agreement. He wants the rate fixed for
      twenty years, with a witnessed copy at Bramme that a future Head must honour. There
      have already been two shortages in living memory. The smith wants the agreement to
      protect his apprentice after he is gone. The sack has stained the floor.
  - address: "content:events/wick_trades.yaml#events[id=the_smith_wants_the_charcoal_contract].interaction.choices[id=write_it].label"
    of: "6b2b0dc0f200035c"
    plainenglish: >-
      Put it in writing: twenty years, a fixed rate, notarised at Bramme.
  - address: "content:events/wick_trades.yaml#events[id=the_smith_wants_the_charcoal_contract].interaction.choices[id=write_it].outcomes[id=written].text"
    of: "d98ff2a3a1b48cdf"
    plainenglish: >-
      The smith pays the notary and both sides keep a signed copy of the fixed rate. The
      house puts its copy with the wood accounts. The signatures leave no space for another
      figure.
  - address: "content:events/wick_trades.yaml#events[id=the_smith_wants_the_charcoal_contract].interaction.choices[id=keep_the_handshake].label"
    of: "59b78c256b1706f1"
    plainenglish: >-
      Stick with the handshake. It has lasted forty years.
  - address: "content:events/wick_trades.yaml#events[id=the_smith_wants_the_charcoal_contract].interaction.choices[id=keep_the_handshake].outcomes[id=handshake].text"
    of: "cfb41903380bf147"
    plainenglish: >-
      The smith leaves with the charcoal at the old price. His apprentice is told that the
      same unwritten promise should be enough after the smith dies. The apprentice starts
      looking towards Bramme.
  - address: "content:events/wick_trades.yaml#events[id=the_miller_and_the_thumb].title"
    of: "3fcbb67f793252ab"
    plainenglish: >-
      What Every Village Says About Its Miller
  - address: "content:events/wick_trades.yaml#events[id=the_miller_and_the_thumb].body"
    of: "d4f860fefeba9f3a"
    plainenglish: >-
      Every village in the Settled Lands says its miller has a heavy thumb, and about a third of
      them are right. Wick has been saying it about this one for eleven years. The mill belongs
      to the house, and the miller holds it from the house, so the accusation is really about
      the hall, and everyone making it knows that. Four tenants have brought their own weights
      up the hill. The weights do not match each other. That is the first thing the steward
      notices and the last thing anyone wants to hear.
  - address: "content:events/wick_trades.yaml#events[id=the_miller_and_the_thumb].interaction.choices[id=weigh_it_publicly].label"
    of: "63d54566cb35bc02"
    plainenglish: >-
      Weigh it in the yard with the reeve, where everyone can see.
  - address: "content:events/wick_trades.yaml#events[id=the_miller_and_the_thumb].interaction.choices[id=weigh_it_publicly].outcomes[id=the_miller_is_honest].text"
    of: "e0440661c37020bd"
    plainenglish: >-
      Four sacks, four weights, and a set of weights belonging to the house, and the miller is
      honest, give or take what a wet day does to grain. The Head takes care not to humiliate
      the four tenants, so they are not humiliated. Nobody at Wick says the word thumb for
      nineteen years.
  - address: "content:events/wick_trades.yaml#events[id=the_miller_and_the_thumb].interaction.choices[id=weigh_it_publicly].outcomes[id=the_miller_is_not].text"
    of: "37418a315306729d"
    plainenglish: >-
      He has been taking about a fortieth part, every time, for eleven years. That adds up to
      more grain than his own holding grows. He is put out of the mill and off the land on the
      same afternoon, and the parish watches all of it. The new miller stays honest for about
      nine years.
  - address: "content:events/wick_trades.yaml#events[id=the_miller_and_the_thumb].interaction.choices[id=leave_it_alone].label"
    of: "53873c81a86df66d"
    plainenglish: >-
      Let it be. Every village says this of every miller.
  - address: "content:events/wick_trades.yaml#events[id=the_miller_and_the_thumb].interaction.choices[id=leave_it_alone].outcomes[id=left].text"
    of: "bb605eb90bf6cf75"
    plainenglish: >-
      Nothing is weighed and nothing is settled. The saying keeps going round and gains a verse,
      and by about the fourth telling the verse has the hall in it somewhere. Thirty years on,
      nobody at Wick can remember whether it was ever about the miller.
  - address: "content:events/wick_trades.yaml#events[id=the_alewife_and_the_licence].title"
    of: "ae8237143275c580"
    plainenglish: >-
      The Alewife Has Never Had a Licence
  - address: "content:events/wick_trades.yaml#events[id=the_alewife_and_the_licence].body"
    of: "c35607096b2a354d"
    plainenglish: >-
      Brewing for sale needs a licence from the magistrate at Bramme. The alewife at Wick has
      never had one, and neither did her mother. It has never mattered, because the low justice
      on this land belongs to the house, and the house has never asked. Now a burgess of Bramme
      has noticed, and put it in writing, because Bramme's brewers pay for their licences. The
      letter is polite and quotes a statute correctly.
  - address: "content:events/wick_trades.yaml#events[id=the_alewife_and_the_licence].interaction.choices[id=buy_her_a_licence].label"
    of: "a73efae62f28ae32"
    plainenglish: >-
      Pay for her licence. Four crowns, and the letter is dealt with.
  - address: "content:events/wick_trades.yaml#events[id=the_alewife_and_the_licence].interaction.choices[id=buy_her_a_licence].outcomes[id=licensed].text"
    of: "d8634309a4b0b345"
    plainenglish: >-
      Four crowns to the magistrate buys a licence in her name. It is the first document that
      woman has ever had with her name on it. She keeps it in a box and shows it to people for
      the rest of her life. Bramme's burgesses are satisfied. Every alehouse in the province now
      knows the hall pays.
  - address: "content:events/wick_trades.yaml#events[id=the_alewife_and_the_licence].interaction.choices[id=assert_the_franchise].label"
    of: "3b18887fc8ad547b"
    plainenglish: "Backdate the franchise claim and send the false certificate to Bramme."
  - address: "content:events/wick_trades.yaml#events[id=the_alewife_and_the_licence].interaction.choices[id=assert_the_franchise].outcomes[id=asserted].text"
    of: "0ee03156d5b0642a"
    plainenglish: >-
      The house certifies that its alehouse franchise predates the statute. The date is
      false. Bramme lets the claim stand for now but keeps the original document that can
      disprove it. The house gains standing and the alewife keeps brewing.
  - address: "content:events/wick_trades.yaml#events[id=the_file_a_clerk_went_looking_for].title"
    of: "3d46d8545accfe60"
    plainenglish: >-
      The Hall's Own Letter Comes Back
  - address: "content:events/wick_trades.yaml#events[id=the_file_a_clerk_went_looking_for].body"
    of: "2308f788a403161c"
    plainenglish: >-
      A Bramme clerk compares the house's old sealed claim with the original alehouse
      franchise. The conflicting dates prove the false certificate. The current Head must
      levy the licensing fine or refuse in writing. Both replies will be kept in the same
      file.
  - address: "content:events/wick_trades.yaml#events[id=the_file_a_clerk_went_looking_for].interaction.choices[id=levy_it].label"
    of: "6db57dabd47f585f"
    plainenglish: >-
      Levy the fine. It is our justice, so it is our fine.
  - address: "content:events/wick_trades.yaml#events[id=the_file_a_clerk_went_looking_for].interaction.choices[id=levy_it].outcomes[id=levied].text"
    of: "5cd9e8cf9748b013"
    plainenglish: >-
      On a market day the reeve walks down, takes the fine off the counter in front of the whole
      room, and sends every mite of it on to Bramme. The town is satisfied that the hall's
      justice works. The alehouse goes quiet whenever anyone from the hall comes in, and it
      stays quiet for a generation.
  - address: "content:events/wick_trades.yaml#events[id=the_file_a_clerk_went_looking_for].interaction.choices[id=refuse_in_writing].label"
    of: "3a345ce865d381cc"
    plainenglish: >-
      Put in writing that the house will not, and seal it.
  - address: "content:events/wick_trades.yaml#events[id=the_file_a_clerk_went_looking_for].interaction.choices[id=refuse_in_writing].outcomes[id=refused].text"
    of: "c42515edfe4b5d71"
    plainenglish: >-
      One sentence, sealed, and filed at Bramme next to the first letter. She keeps brewing. The
      town now holds two letters from the hall. Together they say that the hall keeps a justice
      and will not use it. That is the kind of pair a clerk takes to Cawdry when he wants the
      Warden to look into something.
  - address: "content:events/wick_trades.yaml#events[id=the_thatcher_from_the_lag].title"
    of: "77fd8990b41f3c74"
    plainenglish: >-
      A Thatcher From the Lag
  - address: "content:events/wick_trades.yaml#events[id=the_thatcher_from_the_lag].body"
    of: "b882177d03bd8d01"
    plainenglish: >-
      Four cottages on the lane need new thatch, and reed is reed, which means the Lag. That is
      forty miles down the Wend, where the reed is cut, and where everyone in this province
      believes the people are webbed. This thatcher charges half what anyone else does, he is
      very good, and he will not stay in the village. He asks to sleep in the house's own barn.
      The reeve has already refused that on the house's behalf, without being asked.
  - address: "content:events/wick_trades.yaml#events[id=the_thatcher_from_the_lag].interaction.choices[id=give_him_the_barn].label"
    of: "2029f5edae07e759"
    plainenglish: >-
      Let him have the barn, and say so in front of the reeve.
  - address: "content:events/wick_trades.yaml#events[id=the_thatcher_from_the_lag].interaction.choices[id=give_him_the_barn].outcomes[id=the_barn].text"
    of: "09c8b51d163b66c1"
    plainenglish: >-
      Four cottages are thatched in eleven days by a man who is better at it than anyone within
      forty miles. He sleeps in the barn. The reeve has been corrected in public, in front of
      his own parish, and will remember it for longer than the thatch lasts. The thatcher comes
      back every seven years for thirty years.
  - address: "content:events/wick_trades.yaml#events[id=the_thatcher_from_the_lag].interaction.choices[id=back_the_reeve].label"
    of: "ea19b7b2b8e94d5e"
    plainenglish: >-
      Side with the reeve. He has to live here, and the Lag man does not.
  - address: "content:events/wick_trades.yaml#events[id=the_thatcher_from_the_lag].interaction.choices[id=back_the_reeve].outcomes[id=he_goes_home].text"
    of: "e5111d98762fcbe4"
    plainenglish: >-
      He walks back to the Lag that same afternoon without a word of complaint, because he is
      completely used to it. The four cottages are done by a man from Ockleigh at twice the
      price and about half the quality. Two of them leak by the next Frostfall. The reeve does
      not mention that either.
  - address: "content:events/wick_trades.yaml#events[id=the_tanner_downwind].title"
    of: "841143787e4ad044"
    plainenglish: >-
      Downwind, and Too Close
  - address: "content:events/wick_trades.yaml#events[id=the_tanner_downwind].body"
    of: "6ad55221a8b6e86d"
    plainenglish: >-
      A tanner has set up at the bottom of the lane, because a tanner has to set up somewhere.
      On the usual wind, which blows nine days in ten, all of Wick is downwind of him. Nobody
      questions his right to the holding. Everybody complains about the smell. Eleven households
      have come up the hill about it in a single tenday, which has not happened over anything in
      thirty years. The house needs leather as much as anyone does.
  - address: "content:events/wick_trades.yaml#events[id=the_tanner_downwind].interaction.choices[id=move_him].label"
    of: "d72495f65080dcf2"
    plainenglish: >-
      Move him. Give him the river close and pay for the move.
  - address: "content:events/wick_trades.yaml#events[id=the_tanner_downwind].interaction.choices[id=move_him].outcomes[id=moved].text"
    of: "7063078683ac4532"
    plainenglish: >-
      The house spends six crowns of its own money to move a man half a mile downstream onto
      ground nobody was using. The eleven households get what they came for. The tanner learns
      that the hall will spend money on him. The river close is where the parish draws water in
      a dry summer. Nobody thinks of that for nine years.
  - address: "content:events/wick_trades.yaml#events[id=the_tanner_downwind].interaction.choices[id=leave_him_where_he_is].label"
    of: "d71490194aae8d2d"
    plainenglish: >-
      Let him stay. A tanner has to be somewhere, and there will do.
  - address: "content:events/wick_trades.yaml#events[id=the_tanner_downwind].interaction.choices[id=leave_him_where_he_is].outcomes[id=left_there].text"
    of: "5c7551a020051684"
    plainenglish: >-
      The eleven households are told, correctly, that the holding is his and the wind belongs to
      nobody. They go back down the hill having learned what asking the hall for something is
      worth. Wick smells of the tannery for forty years. The leather is good and cheap, and
      nobody has ever thanked the house for either.
  - address: "content:events/wick_trades.yaml#events[id=the_shepherd_who_is_worth_more].title"
    of: "9917684e287e414a"
    plainenglish: >-
      The Dog Is Worth More Than the Shepherd
  - address: "content:events/wick_trades.yaml#events[id=the_shepherd_who_is_worth_more].body"
    of: "76d05323a84249a7"
    plainenglish: >-
      Everyone in the Nethering says the shepherd's bitch is worth more than the shepherd, and
      here it is not a joke but plain arithmetic: she works two hundred head on ground three men
      could not hold. She is nine and has one litter left in her. The shepherd wants four crowns
      for a pup, and he knows exactly what he is asking. As he packs up, he also mentions that
      she has stopped going into the upper fold, and he cannot get her past the beck.
  - address: "content:events/wick_trades.yaml#events[id=the_shepherd_who_is_worth_more].interaction.choices[id=buy_the_pup].label"
    of: "fb417c3deca9cff9"
    plainenglish: >-
      Buy the pup. Four crowns for the best bloodline in the province.
  - address: "content:events/wick_trades.yaml#events[id=the_shepherd_who_is_worth_more].interaction.choices[id=buy_the_pup].outcomes[id=bought].text"
    of: "5c8faea2424b87ce"
    plainenglish: >-
      Four crowns buys a dog that is working sheep at fourteen months old, and for eleven years
      she is the best thing on four legs at Ardwen. Nobody follows up the shepherd's other
      remark. In the ninth year she too stops at the beck, in the same place, on the same
      ground, and by then nobody is left who remembers being told.
  - address: "content:events/wick_trades.yaml#events[id=the_shepherd_who_is_worth_more].interaction.choices[id=ask_about_the_beck].label"
    of: "35a998331855faa7"
    plainenglish: >-
      Forget the pup. Ask him about the beck.
  - address: "content:events/wick_trades.yaml#events[id=the_shepherd_who_is_worth_more].interaction.choices[id=ask_about_the_beck].outcomes[id=he_explains].text"
    of: "3cc75ae630d8c1da"
    plainenglish: >-
      He is a shepherd. He has no theory and offers none. Instead he gives four years of dates:
      which spring she stopped, which ground she will not take, and which of the other dogs
      followed her in it and which did not. It is the most exact account of anything anyone has
      ever brought up this hill. He does not know why he remembers it.
  - address: "content:events/wick_trades.yaml#events[id=the_ploughs_go_out_late].title"
    of: "33baf7c6abdd1f82"
    plainenglish: >-
      Eleven Ploughs, One Smith
  - address: "content:events/wick_trades.yaml#events[id=the_ploughs_go_out_late].body"
    of: "ac1ad7d792de4a63"
    plainenglish: >-
      Every plough in this parish needs its share laid and sharpened before Seedmonth, and there
      is one forge to do all eleven in four tendays. The order they go in has always been the
      smith's business. This year the smith has been ill for a tenday and is three behind. Those
      three are the three farthest from the village. That is not a coincidence, and it is not
      malice either.
  - address: "content:events/wick_trades.yaml#events[id=the_ploughs_go_out_late].interaction.outcomes[id=the_house_pays_bramme].text"
    of: "a3f007bb34cfc3cf"
    plainenglish: >-
      The house pays a smith from Bramme to come out for three days, and the three farthest
      ploughs go out on time. It costs five crowns. Nobody at Wick is told who paid, and that is
      the only part of the arrangement the steward argues about.
  - address: "content:events/wick_trades.yaml#events[id=the_ploughs_go_out_late].interaction.outcomes[id=they_sow_late].text"
    of: "ad7f7d3957124435"
    plainenglish: >-
      The three holdings sow a tenday late, into ground that has already dried past its best. It
      shows at Harvest on those three holdings and nowhere else. All three pay their rent short,
      and none of them says why.
  - address: "content:events/wick_trades.yaml#events[id=the_cottager_who_can_read].title"
    of: "dd49a9d8257bb4b4"
    plainenglish: >-
      A Cottager Who Can Read
  - address: "content:events/wick_trades.yaml#events[id=the_cottager_who_can_read].body"
    of: "156f9e6be60eca07"
    plainenglish: >-
      Hardly anyone at the bottom of this world can read, but a cottager's daughter at Wick can.
      She was taught by a keeper who died nineteen years ago and had time on his hands. She has
      read the terms nailed to the church door, which nobody has ever done, and she has found
      something in them. She is not making trouble. She has come up the hill to ask, politely,
      about one clause, and she remembers its wording exactly.
  - address: "content:events/wick_trades.yaml#events[id=the_cottager_who_can_read].interaction.choices[id=answer_her_properly].label"
    of: "cdde427268c1a416"
    plainenglish: >-
      Give her a proper answer, and an honest one about the clause.
  - address: "content:events/wick_trades.yaml#events[id=the_cottager_who_can_read].interaction.choices[id=answer_her_properly].outcomes[id=answered].text"
    of: "8da69ac79beb5c83"
    plainenglish: >-
      Half an hour in the yard and an honest answer: the clause means what she thinks it means,
      and it has not been enforced in sixty years. She thanks the Head, goes home, and tells
      eleven households. Nothing changes. Everything about how that village reads the terms on
      that door changes.
  - address: "content:events/wick_trades.yaml#events[id=the_cottager_who_can_read].interaction.choices[id=send_her_to_the_steward].label"
    of: "1b7653f8f3200e34"
    plainenglish: >-
      Send her to the steward. This is not the hall's business.
  - address: "content:events/wick_trades.yaml#events[id=the_cottager_who_can_read].interaction.choices[id=send_her_to_the_steward].outcomes[id=sent_to_the_steward].text"
    of: "5327cc3586585de9"
    plainenglish: >-
      The steward is polite, completely unhelpful, and very careful to be both. She goes home
      understanding exactly what she has been told. She teaches her own children to read. In
      1247, one of them is the reason a boundary case at Cawdry turns out the way it does.
  - address: "content:events/wick_trades.yaml#events[id=the_forge_fire_in_deepwinter].title"
    of: "7dc7f2e01c15bd1c"
    plainenglish: >-
      The One Warm Place in the Parish
  - address: "content:events/wick_trades.yaml#events[id=the_forge_fire_in_deepwinter].body"
    of: "0dd2f4f1f3ab19f5"
    plainenglish: >-
      In the worst tendays of Deepwinter, the forge is the only properly warm building in Wick.
      By custom, nobody says anything about the dozen people who are in it at any hour with no
      obvious business there. The smith burns about four crowns of extra charcoal each winter
      for this, and he has never mentioned it to anyone. The steward has noticed, because the
      charcoal comes out of the house's wood.
  - address: "content:events/wick_trades.yaml#events[id=the_forge_fire_in_deepwinter].interaction.choices[id=say_nothing_and_pay_it].label"
    of: "0e5f16a6811f4832"
    plainenglish: >-
      Say nothing. Let the house's wood cover it.
  - address: "content:events/wick_trades.yaml#events[id=the_forge_fire_in_deepwinter].interaction.choices[id=say_nothing_and_pay_it].outcomes[id=covered].text"
    of: "c167e40f0197092b"
    plainenglish: >-
      Four crowns of charcoal a winter that nobody accounts for and nobody thanks anyone for,
      because thanking anyone would mean saying out loud what is going on, and that would end
      it. It carries on for sixty years, across three Heads and two smiths. Nobody writes it
      down.
  - address: "content:events/wick_trades.yaml#events[id=the_forge_fire_in_deepwinter].interaction.choices[id=charge_it_to_him].label"
    of: "c7810cd653e8479a"
    plainenglish: >-
      Make him pay for it. The wood belongs to the house.
  - address: "content:events/wick_trades.yaml#events[id=the_forge_fire_in_deepwinter].interaction.choices[id=charge_it_to_him].outcomes[id=charged].text"
    of: "d90084b220e18b4e"
    plainenglish: >-
      Four crowns are charged to the smith, and he pays without a word. From the next Frostfall,
      the forge door is shut to anyone without business there. It is entirely correct. Wick
      spends that winter in its own cottages and works out for itself which change came first.

  - address: "content:events/wick_trades.yaml#events[id=the_smith_wants_the_charcoal_contract].interaction.choices[id=write_it].outcomes[id=written].effects[1].text"
    of: "48e5ef0d6dea0331"
    plainenglish: "{HEAD} signed a twenty-year fixed charcoal rate, witnessed at Bramme."

  - address: "content:events/wick_trades.yaml#events[id=the_charcoal_price_returns].title"
    of: "b107d1b29947a5d6"
    plainenglish: "The Written Charcoal Price"

  - address: "content:events/wick_trades.yaml#events[id=the_charcoal_price_returns].body"
    of: "27fb16faeb5c45fe"
    plainenglish: >-
      Charcoal cracks under the collier's boot in the yard. The collier brings the Bramme
      copy of the twenty-year agreement. Charcoal now costs twice the fixed rate. {HEAD} can
      pay thirteen crowns to cover the difference for the rest of the term. The house copy
      is on the table.

  - address: "content:events/wick_trades.yaml#events[id=the_charcoal_price_returns].interaction.choices[id=keep_the_rate].label"
    of: "7e2cf483924cdd67"
    plainenglish: "Honour the agreement and pay thirteen crowns."

  - address: "content:events/wick_trades.yaml#events[id=the_charcoal_price_returns].interaction.choices[id=keep_the_rate].outcomes[id=kept].text"
    of: "2a9b9412c1ef5fbe"
    plainenglish: >-
      The collier takes payment and records the settlement beneath the old signatures, so
      the smith gets charcoal at the agreed price. The two copies still agree.

  - address: "content:events/wick_trades.yaml#events[id=the_charcoal_price_returns].interaction.choices[id=keep_the_rate].outcomes[id=kept].effects[2].text"
    of: "518b2937b0a1894b"
    plainenglish: >-
      The family honoured the signed charcoal agreement after the price rose, paying
      thirteen crowns for the rest of the term.

  - address: "content:events/wick_trades.yaml#events[id=the_charcoal_price_returns].interaction.choices[id=change_our_copy].label"
    of: "15da62d672f3dc4a"
    plainenglish: "Alter the house copy and deny that the rate was fixed."

  - address: "content:events/wick_trades.yaml#events[id=the_charcoal_price_returns].interaction.choices[id=change_our_copy].outcomes[id=altered].text"
    of: "7c0284def0efe5ba"
    plainenglish: >-
      The house copy is altered without removing its seal. The Bramme copy still shows the
      older rate, and the smith reads both versions to the colliers. The signatures are
      unchanged.

  - address: "content:events/wick_trades.yaml#events[id=the_charcoal_price_returns].interaction.choices[id=change_our_copy].outcomes[id=altered].effects[2].text"
    of: "670bad1a2e20388e"
    plainenglish: >-
      {HEAD} changed the charcoal rate in the family copy and certified that the earlier
      signed rate had not been fixed.
  - address: "content:events/wick_trades.yaml#events[id=the_alewife_and_the_licence].interaction.choices[id=assert_the_franchise].outcomes[id=asserted].effects[2].text"
    of: "3341df6723dd1383"
    plainenglish: "{HEAD} sent Bramme a falsely backdated certificate for the alehouse franchise."
  - address: >-
      content:events/wick_trades.yaml#events[id=the_thatcher_from_the_lag].interaction.choices[id=back_the_reeve].outcomes[id=he_goes_home].primordial.text
    of: 5fa69a7d862dc191
    plainenglish: "{PRIMORDIAL_ACTOR} is beneath the first roof opened for rethatching. The reed rises from its fallen bundle and holds against the rafters until the bindings are made. The thatcher still leaves; fewer cottages are left to buy work twice."
  - address: >-
      content:events/wick_trades.yaml#events[id=the_ploughs_go_out_late].interaction.outcomes[id=the_house_pays_bramme].primordial.text
    of: f194b636a5a4408a
    plainenglish: "In the yard, {PRIMORDIAL_ACTOR} picks up the worn ploughshare. Its edge holds through a pass on the stone that should have taken the last of it. Some of the ploughs can go out without the extra Bramme work."
  - address: >-
      content:events/wick_trades.yaml#events[id=the_ploughs_go_out_late].interaction.outcomes[id=they_sow_late].primordial.text
    of: f194b636a5a4408a
    plainenglish: "In the yard, {PRIMORDIAL_ACTOR} picks up the worn ploughshare. Its edge holds through a pass on the stone that should have taken the last of it. Some of the ploughs can go out without the extra Bramme work."
