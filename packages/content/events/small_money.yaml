# SMALL MONEY.
#
# COMMON. One crown is twenty marks is two hundred and forty mites. A mite is
# copper and everybody has one; a mark is silver and a labourer sees a few a
# year; a crown is gold, is mostly an accounting unit, and a tenant farmer may
# go his whole life without holding one. Everything in this game is affordable
# and nothing is affordable twice.
#
# The Braccish weight standard is what everyone trusts, cross-border payment
# moves by letter of credit at two per cent and a month's delay, and there is
# no paper money and no cheque. What that produces is a world where a debt is
# a relationship rather than an instrument, and where a tally stick, a
# handshake and a man's memory do most of the work a bank would do.
events:
  - id: the_tally_stick_split
    title: Two Halves of One Stick
    tier: head
    frequency: common
    weight: 75
    tags: [money, records, tenants, law]
    purposes: [change_relationship, force_record_choice, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      A tally is a hazel stick notched across and split down the length, one
      half to each party, and it cannot be forged because no two splits match
      but the one, which is a better instrument than most of what is written
      on paper in this kingdom. The house has forty of them in a box. A tenant
      has come up saying his half burned in a cottage fire and asking what
      happens now. The house's half says nine marks.
    interaction:
      kind: choice
      choices:
        - id: the_house_half_stands
          label: The house's half stands. Nine marks, and cut a fresh stick.
          outcomes:
            - id: it_stands
              weight: 100
              text: >-
                Nine marks entered, a fresh stick split in the yard in front of
                the reeve, and a man who pays what he owed and knew he owed,
                and who has learned in the same afternoon that this house's box
                decides things when a cottage burns. Every tenant on this land
                hears the second half within a tenday.
              effects:
                - { kind: treasury, delta: 9 }
                - { kind: relationship, from: household, to: head, sentiment: -6 }
        - id: split_the_difference
          label: Call it five, and cut a fresh stick for the rest.
          outcomes:
            - id: five
              weight: 100
              text: >-
                Five marks and a fresh stick, which is four marks of this
                house's money spent on a proposition it did not have to
                concede, and a parish that concludes the hall will meet a man
                halfway when his roof goes. Three men lose their halves in the
                following eleven years. Two of them are lying.
              # #341: what the parish concludes is a thing said about the
              # house, and the Record is where a thing said is kept.
              effects:
                - { kind: treasury, delta: 5 }
                - { kind: relationship, from: household, to: head, sentiment: 10 }
                - { kind: rumour, op: seed, id: rumour_the_hall_meets_a_man_halfway, accuracy: 0.5 }

  - id: the_clipped_coin
    title: Four of These Are Light
    tier: head
    frequency: common
    weight: 70
    tags: [money, bracc, law, trade]
    purposes: [buy_patience, change_standing, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      Aubren, Anvary and the Marches all strike coin and every piece of it is
      weighed against Braccish reckoning at the counting house, which takes
      its cut for the service and is never wrong. Four marks out of this
      year's rents are light. Clipping is a hanging matter and the four came
      up the hill in three different hands, none of which is likely to have
      done it. Refusing them means naming somebody.
    interaction:
      kind: choice
      choices:
        - id: take_the_loss
          label: Take the loss. Weigh everything from now on and say nothing.
          outcomes:
            - id: loss_taken
              weight: 100
              text: >-
                Four marks written off and a small brass balance on the rent
                table from the following Thaw, in plain sight, unexplained, and
                every man who comes up that hill sees it and understands it and
                nobody is accused of anything. No light coin comes into this
                house again for nineteen years.
              effects:
                - { kind: treasury, delta: -1 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: send_the_four_to_bramme
          label: Send the four to the magistrate. Clipping is his business.
          outcomes:
            - id: sent_to_bramme
              weight: 100
              text: >-
                Four coins, a magistrate, and an inquiry that runs for two
                tendays through three households and finds nothing, because
                coin passes through nine hands and the ninth is not the guilty
                one. Nobody is hanged, which is a relief to everybody. Three
                families on this land were questioned about their honesty by a
                court because the hall sent four marks down a hill.
              # #341: the prose prices this in the three questioned families,
              # and nobody in it thinks better of the hall for it.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -14 }
                - { kind: chronicle, text: "Four light marks out of the rents were sent to the magistrate at Bramme, and three households were questioned." }

  - id: the_pledge_in_the_box
    title: A Ring, Against Two Marks
    tier: head
    frequency: common
    weight: 70
    tags: [money, tenants, custom, hardship]
    purposes: [buy_patience, change_relationship, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      There is no lending house in this parish and there is a box in the
      steward's room with nine pledges in it, because when a tenant needs two
      marks in Frostfall he brings up the only thing he owns that is worth
      anything and the house holds it until Harvest. Four of the nine have
      been in that box for more than three years. One of them is a wedding
      ring. The steward asks, once a year, what is to be done about them.
    interaction:
      kind: choice
      choices:
        - id: give_them_back
          label: Give the four back. Forgive what they stand against.
          outcomes:
            - id: given_back
              weight: 100
              text: >-
                Four objects handed back across a table in the yard in
                Ingathering, and about six marks written off, and a woman of
                sixty who does not say anything at all and puts a ring back on
                and goes down the hill. It is the smallest sum this house
                forgives in that decade and the only one anybody remembers.
              effects:
                - { kind: treasury, delta: -1 }
                - { kind: relationship, from: household, to: head, sentiment: 16 }
              agreedPrices:
                - effect: 0
                  reason: gift
        - id: sell_them_at_bramme
          label: Sell them at Bramme. Three years is three years.
          outcomes:
            - id: sold
              weight: 100
              text: >-
                Four objects to a Bramme dealer for about eleven marks, which
                is more than they stood against, and the difference correctly
                entered against each debt, and every part of it lawful and
                customary and done exactly as the terms provide. A wedding
                ring off this parish is in a shop window at Bramme for two
                years. People from this parish go to Bramme.
              effects:
                - { kind: treasury, delta: 1 }
                - { kind: relationship, from: household, to: head, sentiment: -12 }
                - { kind: rumour, op: seed, id: rumour_what_was_in_the_bramme_window, accuracy: 0.6 }

  - id: two_per_cent_and_a_month
    title: The Weigher's Cut
    tier: head
    frequency: common
    weight: 70
    tags: [money, bracc, trade, records]
    purposes: [advance_clause, change_standing, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      Anything crossing a border moves by letter of credit drawn on a Braccish
      house at two per cent and a month's delay, and the Corran fees have been
      going that way for nineteen years without anybody at this table ever
      looking at the arithmetic. The steward has looked at it. Two per cent of
      nineteen years is more than the last four years of fees put together.
      There is no alternative that exists anywhere in this world.
    interaction:
      kind: narration
      outcomes:
        - id: there_is_no_alternative
          weight: 100
          text: >-
            The figure is written on a slate, looked at by two men, and rubbed
            out, because there is nothing whatever to be done with it: the
            Braccish weigh the coin everyone else spends and take their cut of
            every exchange, and have since before this house had a name. The
            steward keeps a copy anyway. It is in the press in 1500.

  - id: the_debt_that_outlives_him
    title: He Died Owing Fourteen Marks
    tier: head
    frequency: common
    weight: 75
    tags: [money, death, tenants, law]
    purposes: [buy_patience, change_relationship, change_standing]
    slots:
      HEAD: { role: head }
    body: >-
      A tenant has died owing fourteen marks against a tally, and his widow
      has the holding and four children and about nine marks of movable goods
      in the world. The debt is good in law and passes with the holding, which
      is the whole point of customary tenure and is why the house can lend at
      all. Every other tenant on this land is going to hear what happens next
      and will make a decision about the hall on the strength of it.
    interaction:
      kind: choice
      choices:
        - id: strike_it_out
          label: Strike it out at the graveside. Publicly.
          outcomes:
            - id: struck_out
              weight: 100
              text: >-
                Said at the churchyard at Wick in front of the whole parish in
                one sentence, and fourteen marks gone off the book, and a
                widow who keeps a holding and four children who stay on this
                land. Eleven households make a decision about this family that
                afternoon that lasts four generations. It cost the price of a
                horse.
              effects:
                - { kind: treasury, delta: -1 }
                - { kind: relationship, from: household, to: head, sentiment: 20 }
                - { kind: respect, delta: 1 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: carry_it_against_the_holding
          label: Carry it against the holding. It is good in law.
          outcomes:
            - id: carried_over
              weight: 100
              text: >-
                Fourteen marks written against the holding and payable
                whenever it can be paid, which is the ordinary practice of
                every house in the province and is entirely fair and is not
                what anybody at that graveside was hoping for. It is paid off
                in 1223 by a grandson. He pays it in one sum, on the day, and
                does not stay for the drink.
              effects:
                - { kind: treasury, delta: 1 }

  - id: the_relief_falls_due
    title: One Year's Income, All at Once
    tier: head
    frequency: common
    weight: 75
    tags: [money, law, succession, hardship]
    purposes: [advance_clause, buy_patience, change_standing]
    slots:
      HEAD: { role: head }
    body: >-
      A relief of one year's income falls due to the Crown when a seat passes
      and it falls due in the year a family is least able to pay it, which is
      the design and is not an accident. The Warden's clerk is at the gate
      with the assessment and it is what the assessment always is. The house
      can pay it out of the box, borrow it from Bracc at four per cent, or ask
      for terms and be a house that asked for terms.
    interaction:
      kind: choice
      choices:
        - id: pay_it_from_the_box
          label: Pay it whole, out of the box, on the day.
          outcomes:
            - id: paid_whole
              weight: 100
              text: >-
                A year's income out of the coffer in one afternoon against a
                receipt, and a family that eats plainly for three years and is
                entered at Cawdry as having paid on the day, which about a
                third of the province manages. The box is empty. The roof is
                still the roof.
              effects:
                - { kind: treasury, delta: -62 }
                - { kind: respect, delta: 1 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: ask_for_terms
          label: Ask for terms. Four years, and the Crown has had worse.
          outcomes:
            - id: terms
              weight: 100
              text: >-
                Four years at no interest, which the Crown grants routinely and
                enters routinely, and a family that keeps its box and its
                dignity and appears in a schedule of houses paying by
                instalment. The schedule is read by the heralds. The heralds
                read everything, and remember it in the year the Roll is next
                read out.
              effects:
                - { kind: treasury, delta: -18 }
                - { kind: respect, delta: -1 }
              agreedPrices:
                - effect: 0
                  reason: contract

  - id: the_toll_and_the_tenth_mite
    title: A Mite a Wheel
    tier: family
    frequency: common
    weight: 65
    tags: [money, trade, rights, tenants]
    purposes: [buy_patience, change_standing, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      The bridge toll is a mite a wheel and brings in about four crowns a year,
      which is not much set against the treasury and is never nothing, and it
      is collected by whichever tenant holds the gate cottage that decade. He
      is entitled to a tenth of it and takes rather more, which everybody
      including the steward has always assumed. The difference is about nine
      marks a year. Auditing it means putting somebody on that bridge to watch
      a man count.
    interaction:
      kind: choice
      choices:
        - id: audit_the_gate
          label: Count it for a month. Nine marks is nine marks.
          outcomes:
            - id: audited
              weight: 100
              text: >-
                A month of the yard man on a bridge with a slate, and a figure
                that shows the gatekeeper taking about a sixth rather than a
                tenth, and a conversation that ends with him taking a tenth
                from the following Thaw. He keeps the cottage. He does not
                look at anybody from the hall directly again for nine years.
              effects:
                - { kind: treasury, delta: 9 }
                - { kind: relationship, from: household, to: head, sentiment: -8 }
        - id: leave_the_gate_alone
          label: Leave it. A tenth is what he is owed and the rest is his wage.
          outcomes:
            - id: left_alone
              weight: 100
              text: >-
                Nine marks a year that nobody has ever written down going to a
                man who keeps a bridge in all weathers for a tenth of four
                crowns, which is not a wage anybody could live on and was never
                meant to be. The arrangement holds for eleven decades. Four
                stewards inherit it and none of them writes it down either.
              tags: [self_expression]

  - id: the_price_of_everything_in_a_thin_year
    title: The Steward Has Written It All Down
    tier: head
    frequency: common
    weight: 70
    tags: [money, records, household, hardship]
    purposes: [buy_patience, force_record_choice, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      The steward has spent a winter putting every recurring cost of this
      house on four sheets in one column — wages, upkeep, the standing cost of
      being what the Roll says this family is, the kin in the branch halls —
      and the total at the bottom is larger than the income above it and has
      been for six years. Nobody has ever seen this house's position on one
      page before. It is on the board and eleven people eat at that board.
    interaction:
      kind: choice
      choices:
        - id: read_it_to_the_family
          label: Read it out. Everybody at this board is spending it.
          outcomes:
            - id: read_out
              weight: 100
              text: >-
                Four sheets read aloud to the whole family, which has not
                happened in the history of this house, and four people who have
                never thought about money in their lives being handed the shape
                of it in one evening. Two of them are useless about it. Two of
                them change what they cost the house within a season and never
                mention doing it.
              effects:
                - { kind: treasury, delta: 14 }
                - { kind: relationship, from: household, to: head, sentiment: -5 }
        - id: keep_it_between_two
          label: Between us. There is no point frightening anybody.
          outcomes:
            - id: between_two
              weight: 100
              text: >-
                Two men and four sheets and a press, and a family that goes on
                spending what it has always spent because nobody has told it
                not to, which is entirely the Head's decision and entirely the
                Head's to carry. The sheets are updated every winter for
                eleven years. The gap at the bottom widens every year and is
                looked at by the same two people.
              effects:
                - { kind: rumour, op: seed, id: rumour_what_the_steward_has_on_four_sheets, accuracy: 0.3 }

  - id: a_crown_in_the_hand
    title: He Has Never Held One
    tier: family
    frequency: common
    weight: 65
    tags: [money, tenants, custom, standing]
    purposes: [change_relationship, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      A crown is gold and is mostly an accounting unit, and a tenant farmer
      can go his whole life without holding one, and the reeve at Wick — who
      has kept this parish's accounts in his head for thirty years and can
      tell you what a crown is to the mite — has never had one in his hand.
      It comes up because a payment has to be made and there is nothing
      smaller in the box. He is genuinely, visibly, briefly undone by it.
    interaction:
      kind: narration
      outcomes:
        - id: he_takes_it_to_bramme
          weight: 100
          text: >-
            He carries it eleven miles to Bramme to have it changed rather than
            spend it, and comes back with two hundred and forty mites in a bag
            and the story, and tells the story for the rest of his life.
            Nobody at the high table ever learns that it was a story.
          effects:
            - { kind: rumour, op: seed, id: rumour_the_crown_the_reeve_held, accuracy: 0.5 }

  - id: the_hearth_tax_assessment
    title: Seven Grates, and What He Writes Down
    tier: head
    frequency: common
    weight: 70
    tags: [money, law, records, hall]
    purposes: [change_standing, force_record_choice, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      Taxes in this kingdom are assessed on what an assessor can count, and
      what he can count in a house is hearths, and there are seven at Ardwen
      of which three are lit in an ordinary winter. He is here to count them
      and he counts what is there and not what is used. Four crowns a hearth,
      annually, forever, on a number written once. The two in the west wing
      have not been lit since 1104.
    interaction:
      kind: choice
      choices:
        - id: brick_the_two
          label: Brick the two before he comes back. Five, not seven.
          outcomes:
            - id: bricked
              weight: 100
              text: >-
                Two crowns of brick against eight crowns a year forever, which
                is the best trade this house makes in that decade, and two
                rooms of the west wing that can never be heated again by
                anybody. In 1291 a family of eleven needs those rooms in a hard
                winter and cannot use them, and nobody alive knows why they are
                bricked.
              effects:
                - { kind: treasury, delta: 6 }
        - id: pay_on_seven
          label: Pay on seven. The house has seven and always has.
          outcomes:
            - id: paid_on_seven
              weight: 100
              text: >-
                Twenty-eight crowns a year on a house that heats three rooms,
                which is honest and is expensive and is the answer this family
                gives every time it is asked anything of this kind, and which
                the assessor notes with the mild surprise of a man who is used
                to bricked-up chimneys.
              effects:
                - { kind: treasury, delta: -8 }
                - { kind: respect, delta: 1 }
              agreedPrices:
                - effect: 0
                  reason: contract

# Direct-language counterparts for the first common small-money event (#415).
proseVariants:
  - address: "content:events/small_money.yaml#events[id=the_tally_stick_split].title"
    of: 8e8f342b5f7366f7
    plainenglish: >-
      Two Halves of a Tally Stick
  - address: "content:events/small_money.yaml#events[id=the_tally_stick_split].body"
    of: daae5e9d1f0021a1
    plainenglish: >-
      A tally is a hazel stick with notches, split lengthwise so each party keeps one half.
      The two halves fit together in a way that cannot be forged, making them more reliable
      than most written records in the kingdom. The house keeps forty of these sticks in a
      box. A tenant says his half burned in a cottage fire. He wants to know what happens to
      the debt now. The house's half records nine marks.
  - address: "content:events/small_money.yaml#events[id=the_tally_stick_split].interaction.choices[id=the_house_half_stands].label"
    of: bd66e734fb009bb8
    plainenglish: >-
      Trust the house's half. Collect nine marks and make a new tally stick.
  - address: "content:events/small_money.yaml#events[id=the_tally_stick_split].interaction.choices[id=the_house_half_stands].outcomes[id=it_stands].text"
    of: 0f7d787c96c90b70
    plainenglish: >-
      The tenant pays the nine marks he owed. The reeve watches as a new tally stick is split
      in the yard. The tenant learns that the house's records decide a dispute even when his
      own proof is destroyed. Within ten days, every tenant on the estate hears what
      happened.
  - address: "content:events/small_money.yaml#events[id=the_tally_stick_split].interaction.choices[id=split_the_difference].label"
    of: f7a859c0285a1d54
    plainenglish: >-
      Accept five marks instead of nine, and make a new tally stick.
  - address: "content:events/small_money.yaml#events[id=the_tally_stick_split].interaction.choices[id=split_the_difference].outcomes[id=five].text"
    of: 11e34fdcee1b2b98
    plainenglish: >-
      The tenant pays five marks and receives a new tally stick. The house has forgiven four
      marks it could have claimed. People in the parish decide the hall will meet a tenant
      halfway when his home is damaged. Over the next eleven years, three more men say they
      have lost their tally halves. Two of them are lying.
  - address: "content:events/small_money.yaml#events[id=the_clipped_coin].title"
    of: 45f8c0e727b9c353
    plainenglish: >-
      Four Coins Are Underweight
  - address: "content:events/small_money.yaml#events[id=the_clipped_coin].body"
    of: a83a92b4ca9ee5c0
    plainenglish: >-
      Aubren, Anvary and the Marches all mint coins. The counting house weighs every coin against
      the Braccish standard, charges a fee and is never wrong. Four marks from this year's rent
      payments are underweight. Cutting metal from coins is punishable by hanging. The coins came
      from three different people, and none of them is likely to have done the clipping. Rejecting
      the coins means accusing someone.
  - address: "content:events/small_money.yaml#events[id=the_clipped_coin].interaction.choices[id=take_the_loss].label"
    of: 1009b87557a87829
    plainenglish: >-
      Accept the loss. Weigh all coins from now on and say nothing.
  - address: "content:events/small_money.yaml#events[id=the_clipped_coin].interaction.choices[id=take_the_loss].outcomes[id=loss_taken].text"
    of: 8b65f338bd26f6f4
    plainenglish: >-
      The house writes off four marks. From the following Thaw, a small brass scale sits on the
      rent table where everyone can see it. Nobody explains why it is there, but everyone visiting
      the hall understands. No one is accused. The house receives no more underweight coins for
      nineteen years.
  - address: "content:events/small_money.yaml#events[id=the_clipped_coin].interaction.choices[id=send_the_four_to_bramme].label"
    of: 0ae13dcb93b27c97
    plainenglish: >-
      Send the four coins to the magistrate. Coin clipping is his responsibility.
  - address: "content:events/small_money.yaml#events[id=the_clipped_coin].interaction.choices[id=send_the_four_to_bramme].outcomes[id=sent_to_bramme].text"
    of: 73d7f3e2a31e0d66
    plainenglish: >-
      The magistrate investigates the four coins for two tendays. He questions three households
      but finds no culprit. A coin passes through nine hands, and the ninth person is not the one
      who clipped it. Nobody is hanged, to everyone's relief. But because the hall reported four
      underweight marks, a court has questioned three families on its land about their honesty.
  - address: "content:events/small_money.yaml#events[id=the_pledge_in_the_box].title"
    of: bb9c52d9c78af7d5
    plainenglish: >-
      A Wedding Ring Held for Two Marks
  - address: "content:events/small_money.yaml#events[id=the_pledge_in_the_box].body"
    of: cefd4563b8ab387f
    plainenglish: >-
      This parish has no lending house. The steward keeps nine objects pledged as security for
      loans in a box. When tenants need two marks during Frostfall, they bring something valuable
      to the hall, which holds it until Harvest. Four of the objects have been in the box for more
      than three years. One is a wedding ring. Once each year, the steward asks what the house
      will do with them.
  - address: "content:events/small_money.yaml#events[id=the_pledge_in_the_box].interaction.choices[id=give_them_back].label"
    of: a97364df7601a83b
    plainenglish: >-
      Return the four objects and cancel the debts they secure.
  - address: "content:events/small_money.yaml#events[id=the_pledge_in_the_box].interaction.choices[id=give_them_back].outcomes[id=given_back].text"
    of: 3d2a414ee11fb6d2
    plainenglish: >-
      At Ingathering, the house gives all four objects back across a table in the yard and
      forgives about six marks of debt. A sixty-year-old woman silently puts her wedding ring back
      on and walks home. This is the smallest amount the house forgives that decade, but it is the
      only act of forgiveness people remember.
  - address: "content:events/small_money.yaml#events[id=the_pledge_in_the_box].interaction.choices[id=sell_them_at_bramme].label"
    of: 0740357e50fbaa62
    plainenglish: >-
      Sell the four objects at Bramme. The debts are more than three years old.
  - address: "content:events/small_money.yaml#events[id=the_pledge_in_the_box].interaction.choices[id=sell_them_at_bramme].outcomes[id=sold].text"
    of: ce3319142084bc90
    plainenglish: >-
      A dealer at Bramme pays about eleven marks for the four objects, more than the debts they
      secured. The steward correctly credits the extra amount against each debt. The sale follows
      the law, local custom and the agreed terms. For the next two years, a wedding ring from this
      parish is displayed in a Bramme shop window. People from the parish visit Bramme and see it.
  - address: "content:events/small_money.yaml#events[id=two_per_cent_and_a_month].title"
    of: 7edd57412edd3b25
    plainenglish: >-
      The Counting House Takes Two Percent
  - address: "content:events/small_money.yaml#events[id=two_per_cent_and_a_month].body"
    of: f2c6b102a24bf48e
    plainenglish: >-
      Cross-border payments use letters of credit from a Braccish house. Each payment costs two
      percent and takes a month. The house has paid the Corran fees this way for nineteen years
      without checking the total cost. Now the steward has done the sums. The two-percent charges
      across those nineteen years exceed the fees paid during the last four years. There is no
      other payment method available anywhere in this world.
  - address: "content:events/small_money.yaml#events[id=two_per_cent_and_a_month].interaction.outcomes[id=there_is_no_alternative].text"
    of: 618b8409a6dd6345
    plainenglish: >-
      The steward writes the total on a slate. Two men read it, then erase it, because the family
      can do nothing to avoid the charge. The Braccish weigh the coins everyone else uses and take
      a fee on every exchange. They have done so since before this house existed. The steward
      still keeps a copy of the calculation. It remains in the press in 1500.
  - address: "content:events/small_money.yaml#events[id=the_debt_that_outlives_him].title"
    of: 2084213078b6d284
    plainenglish: >-
      A Tenant Dies Owing Fourteen Marks
  - address: "content:events/small_money.yaml#events[id=the_debt_that_outlives_him].body"
    of: d012bb81b7dfac1d
    plainenglish: >-
      A tenant has died with a debt of fourteen marks recorded on a tally stick. His widow now
      holds the farm and cares for their four children. The family owns about nine marks' worth of
      movable goods. By law, the debt remains attached to the farm after his death. This custom
      allows the house to lend money at all. Every other tenant will hear what the hall does next
      and judge the family by that decision.
  - address: "content:events/small_money.yaml#events[id=the_debt_that_outlives_him].interaction.choices[id=strike_it_out].label"
    of: 68b0a8b207ad8f36
    plainenglish: >-
      Cancel the debt publicly at the graveside.
  - address: "content:events/small_money.yaml#events[id=the_debt_that_outlives_him].interaction.choices[id=strike_it_out].outcomes[id=struck_out].text"
    of: c8eefcbce561ff38
    plainenglish: >-
      At the churchyard in Wick, the house announces in one sentence that the fourteen-mark debt
      is forgiven. The whole parish hears it. The widow keeps her farm, and her four children
      remain on the land. That afternoon eleven households form an opinion of the family that
      lasts four generations. Forgiving the debt cost the house the price of a horse.
  - address: "content:events/small_money.yaml#events[id=the_debt_that_outlives_him].interaction.choices[id=carry_it_against_the_holding].label"
    of: 163d425f652700ab
    plainenglish: >-
      Keep the debt attached to the farm. The law allows it.
  - address: "content:events/small_money.yaml#events[id=the_debt_that_outlives_him].interaction.choices[id=carry_it_against_the_holding].outcomes[id=carried_over].text"
    of: 75c53965e0021741
    plainenglish: >-
      The house keeps the fourteen-mark debt against the farm, to be paid whenever the family can
      afford it. Every house in the province follows this lawful and ordinary practice. Still,
      nobody at the graveside had hoped for this answer. In 1223, a grandson pays the whole amount
      in one payment. He does not stay for a drink.
  - address: "content:events/small_money.yaml#events[id=the_relief_falls_due].title"
    of: 8d6a6eee4a15ce72
    plainenglish: >-
      A Year's Income Due to the Crown
  - address: "content:events/small_money.yaml#events[id=the_relief_falls_due].body"
    of: 876b426a0e5bb516
    plainenglish: >-
      When a family seat passes to a new holder, the Crown charges a relief equal to one year's
      income. It is due at the moment the family can least afford it, and that is intentional. The
      Warden's clerk arrives at the gate with the usual assessment. The house can pay immediately
      from its savings, borrow at four percent from Bracc, or ask the Crown to let it pay later.
      Other houses will know if it asks for more time.
  - address: "content:events/small_money.yaml#events[id=the_relief_falls_due].interaction.choices[id=pay_it_from_the_box].label"
    of: 3a2889e4b7adcdd8
    plainenglish: >-
      Pay the whole relief from the coffer today.
  - address: "content:events/small_money.yaml#events[id=the_relief_falls_due].interaction.choices[id=pay_it_from_the_box].outcomes[id=paid_whole].text"
    of: 17a9cbff470034fb
    plainenglish: >-
      The house pays a full year's income in one afternoon and receives a receipt. It then spends
      three years eating plainly. The record at Cawdry says the family paid on the due date, as
      about one third of the province manages to do. The coffer is empty, but the house still has
      its roof.
  - address: "content:events/small_money.yaml#events[id=the_relief_falls_due].interaction.choices[id=ask_for_terms].label"
    of: 1d910c14035203e8
    plainenglish: >-
      Ask to pay over four years. The Crown has granted this before.
  - address: "content:events/small_money.yaml#events[id=the_relief_falls_due].interaction.choices[id=ask_for_terms].outcomes[id=terms].text"
    of: da5e3d15ceee6bb9
    plainenglish: >-
      The Crown grants four years to pay, without interest. This is routine, so the family keeps
      its money and its dignity. Its name also goes onto the public schedule of houses paying by
      instalments. The heralds read that list and remember it when the Roll of Houses is next
      announced.
  - address: "content:events/small_money.yaml#events[id=the_toll_and_the_tenth_mite].title"
    of: 346460916d9acb1d
    plainenglish: >-
      One Mite for Every Wheel
  - address: "content:events/small_money.yaml#events[id=the_toll_and_the_tenth_mite].body"
    of: 34d2b2886037e6cc
    plainenglish: >-
      The bridge charges one mite per wheel and raises about four crowns a year. The tenant living
      in the gate cottage collects the toll for that decade. He is allowed to keep one tenth, but
      everyone, including the steward, assumes he keeps more. The difference is about nine marks
      each year. To audit the toll, the house would have to send someone to stand on the bridge
      and watch the man count every payment.
  - address: "content:events/small_money.yaml#events[id=the_toll_and_the_tenth_mite].interaction.choices[id=audit_the_gate].label"
    of: 23290b651485b7d9
    plainenglish: >-
      Count the tolls for one month. The missing nine marks matter.
  - address: "content:events/small_money.yaml#events[id=the_toll_and_the_tenth_mite].interaction.choices[id=audit_the_gate].outcomes[id=audited].text"
    of: 28b4e84444fdea58
    plainenglish: >-
      A worker from the yard spends a month on the bridge recording payments on a slate. The
      records show that the gatekeeper keeps about one sixth, not the one tenth he is owed. After
      the hall confronts him, he takes only one tenth from the next Thaw onward. He keeps the
      cottage, but for nine years he refuses to look directly at anyone from the hall.
  - address: "content:events/small_money.yaml#events[id=the_toll_and_the_tenth_mite].interaction.choices[id=leave_the_gate_alone].label"
    of: f9428cf3f3741c3f
    plainenglish: >-
      Leave the arrangement alone. He earns the extra money by tending the bridge.
  - address: "content:events/small_money.yaml#events[id=the_toll_and_the_tenth_mite].interaction.choices[id=leave_the_gate_alone].outcomes[id=left_alone].text"
    of: 677ff6fc306c2220
    plainenglish: >-
      The gatekeeper continues to receive about nine extra marks each year, without anyone
      recording them. He maintains the bridge in every kind of weather. His official share, one
      tenth of four crowns, could never support him and was never intended as a living wage. The
      arrangement lasts eleven decades. Four successive stewards accept it and leave it out of
      their records.
  - address: "content:events/small_money.yaml#events[id=the_price_of_everything_in_a_thin_year].title"
    of: 506628fdc684bcb9
    plainenglish: >-
      The Steward Lists Every Household Expense
  - address: "content:events/small_money.yaml#events[id=the_price_of_everything_in_a_thin_year].body"
    of: da5b99768351d62a
    plainenglish: >-
      All winter, the steward has listed the house's regular costs on four sheets: wages, repairs,
      expenses needed to maintain the family's rank on the Roll, and support for relatives in
      branch halls. The total spending is greater than the income, as it has been for six years.
      Nobody has seen the house's complete finances on one page before. The sheets now sit on a
      table where eleven family members eat.
  - address: "content:events/small_money.yaml#events[id=the_price_of_everything_in_a_thin_year].interaction.choices[id=read_it_to_the_family].label"
    of: c99a1c2de4360579
    plainenglish: >-
      Read the costs aloud. Everyone at the table contributes to them.
  - address: "content:events/small_money.yaml#events[id=the_price_of_everything_in_a_thin_year].interaction.choices[id=read_it_to_the_family].outcomes[id=read_out].text"
    of: 5991f76bb9d3f9cf
    plainenglish: >-
      For the first time in the family's history, someone reads all four sheets to everyone at the
      table. Four people who have never had to think about money learn the full cost of the
      household. Two do nothing useful with the information. The other two reduce what they cost
      the house within a season, without ever mentioning it.
  - address: "content:events/small_money.yaml#events[id=the_price_of_everything_in_a_thin_year].interaction.choices[id=keep_it_between_two].label"
    of: 3ceca8c939f15ec5
    plainenglish: >-
      Keep the figures between the Head and the steward. Do not alarm the family.
  - address: "content:events/small_money.yaml#events[id=the_price_of_everything_in_a_thin_year].interaction.choices[id=keep_it_between_two].outcomes[id=between_two].text"
    of: ac82da593170bfad
    plainenglish: >-
      Only two men see the four sheets before they go into a press. The rest of the family
      continues spending as before because the Head has chosen not to tell them about the deficit.
      The steward updates the accounts every winter for eleven years. Each year, the gap between
      spending and income grows. Only the same two people see it.
  - address: "content:events/small_money.yaml#events[id=a_crown_in_the_hand].title"
    of: 84bcecaf7df84b13
    plainenglish: >-
      The Reeve Has Never Held a Gold Crown
  - address: "content:events/small_money.yaml#events[id=a_crown_in_the_hand].body"
    of: 32272bc0304031b4
    plainenglish: >-
      A crown is a gold coin, but most people use it only when counting money. A tenant farmer
      might never hold one. The reeve at Wick has managed the parish accounts from memory for
      thirty years and knows exactly how many mites make a crown. Even so, he has never held a
      crown himself. A payment must now be made, and the house has no smaller coins in the box.
      Holding the crown briefly leaves him visibly shaken.
  - address: "content:events/small_money.yaml#events[id=a_crown_in_the_hand].interaction.outcomes[id=he_takes_it_to_bramme].text"
    of: bdcc277ec3f0f5b2
    plainenglish: >-
      The reeve carries the crown eleven miles to Bramme to exchange it instead of spending it. He
      returns with a bag of two hundred and forty mites and a story he tells for the rest of his
      life. Nobody who sits at the high table ever learns that the coin became a story.
  - address: "content:events/small_money.yaml#events[id=the_hearth_tax_assessment].title"
    of: 8e078fc67704d252
    plainenglish: >-
      Seven Hearths Counted for Tax
  - address: "content:events/small_money.yaml#events[id=the_hearth_tax_assessment].body"
    of: b1633d55a1b48721
    plainenglish: >-
      The Crown taxes what its assessors can count. In a house, they count hearths, whether they
      are used or not. Ardwen has seven hearths, but only three are usually lit in winter. An
      assessor has arrived to count all seven. The annual tax is four crowns for every hearth, and
      the recorded number stays fixed forever. Two hearths in the west wing have not been lit
      since 1104.
  - address: "content:events/small_money.yaml#events[id=the_hearth_tax_assessment].interaction.choices[id=brick_the_two].label"
    of: 25915077b6d33ceb
    plainenglish: >-
      Brick up the two unused hearths before the assessor returns. Pay tax on five.
  - address: "content:events/small_money.yaml#events[id=the_hearth_tax_assessment].interaction.choices[id=brick_the_two].outcomes[id=bricked].text"
    of: fc5327a18227e3e5
    plainenglish: >-
      The bricks cost two crowns and save eight crowns in tax every year from now on. It is the
      family's best financial decision of the decade. But nobody can heat the two west-wing rooms
      again. In 1291, eleven family members need those rooms during a hard winter and cannot use
      them. Nobody alive knows why the hearths were bricked up.
  - address: "content:events/small_money.yaml#events[id=the_hearth_tax_assessment].interaction.choices[id=pay_on_seven].label"
    of: 488ea2156781c039
    plainenglish: >-
      Pay tax on all seven hearths. The house has always had seven.
  - address: "content:events/small_money.yaml#events[id=the_hearth_tax_assessment].interaction.choices[id=pay_on_seven].outcomes[id=paid_on_seven].text"
    of: 7b6121c131165e45
    plainenglish: >-
      The house pays twenty-eight crowns a year even though it heats only three rooms. This is
      honest but costly, and it reflects how the family always answers such demands. The assessor
      is mildly surprised because he is accustomed to finding chimneys that owners have
      deliberately bricked up.

  - address: "content:events/small_money.yaml#events[id=the_clipped_coin].interaction.choices[id=send_the_four_to_bramme].outcomes[id=sent_to_bramme].effects[1].text"
    of: e35ad56b4f87fef7
    plainenglish: >-
      The house sent four underweight rent marks to the magistrate at Bramme.
      Three households were questioned.
