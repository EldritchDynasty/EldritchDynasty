# #1982: an existing unfinished study and real, exclusive household practice.
# One decision, four paid years, automatic release. Both returns keep the
# initiating person and page; a personal commitment never passes to an heir.
events:
  - id: the_reader_has_two_rooms
    title: One Reader, Two Rooms
    tier: family
    frequency: common
    weight: 65
    repeatable: false
    tags: [library, study, mystic, family]
    purposes: [establish_magic_rule, change_relationship, worldbuild_through_action]
    conditions:
      all:
        - { arcCanFinish: inline_the_reader_has_two_rooms__reading_kept }
        - { arcCanFinish: inline_the_reader_has_two_rooms__watch_begun }
    slots:
      HEAD: { role: head }
      READER:
        role: family_member
        filters:
          - { membership: [blood] }
          - { relation: not, of: HEAD }
          - { studying: true }
          - { canKeepDuty: { working: sickroom_watch } }
    body: >-
      At Ardwen the night bell can be heard through the library wall. {READER}
      has an unfinished book and the learning to keep a sickroom in {READER.their}
      own hall. {HEAD} must choose where the years go. Four years of watch,
      beginning next year, would put the book down with its remaining work kept;
      twelve crowns to prepare, then four for each year the watch can be paid.
      Keeping the book open leaves those beds without the care this reader could have given.
      There is one chair to move.
    interaction:
      kind: choice
      choices:
        - id: keep_the_book_open
          label: Leave {READER}'s commitments alone. Assign no sickroom watch.
          outcomes:
            - id: reading_kept
              weight: 100
              text: >-
                The house leaves {READER}'s existing commitments alone. No watch
                is assigned by this decision; no years of reading are taken away.
                The bell can still be heard through the wall.
              effects:
                - { kind: relationship, from: { slot: READER }, to: head, sentiment: 12 }
              next:
                event: the_readers_open_book_returns
                after: { minYears: 5, maxYears: 5 }
                keep: [READER]
        - id: move_the_chair
          label: Give {READER} four paid years of sickroom watch; pause the unfinished book.
          outcomes:
            - id: watch_begun
              weight: 100
              text: >-
                {READER} marks the place and closes the book. The house pays to
                prepare the watch. The unfinished learning will wait through the
                term, with no years of reading lost and none gained while serving.
                The chair goes downstairs.
              effects:
                - { kind: mystic_duty, target: { slot: READER }, working: sickroom_watch, years: 4 }
              next:
                event: the_readers_sickroom_term_returns
                after: { minYears: 5, maxYears: 5 }
                keep: [READER]

  - id: the_readers_open_book_returns
    title: The Chair Left Upstairs
    tier: family
    frequency: common
    tags: [library, family, consequence]
    purposes: [establish_magic_rule, change_relationship, worldbuild_through_action]
    slots:
      READER:
        role: family_member
        bind: arc
        onMissing: continue_absent
    body: >-
      {READER} hears the night bell again. Five years ago the house left the
      reading uninterrupted rather than assigning the sickroom watch. Other
      orders may have changed the years since; that choice is still on its page.
      The chair has a mark on the floor.
    absentBody: >-
      The reader named on the earlier page is no longer here. The house once
      left that person's book open instead of assigning the sickroom watch.
      Nobody inherits the unfinished reading by inheriting the chair.
    interaction:
      kind: narration
      outcomes:
        - id: remembered
          weight: 100
          text: The household kept the choice. It did not keep the years.

  - id: the_readers_sickroom_term_returns
    title: The Chair Brought Back
    tier: family
    frequency: common
    tags: [library, mystic, family, consequence]
    purposes: [establish_magic_rule, change_relationship, worldbuild_through_action]
    slots:
      READER:
        role: family_member
        bind: arc
        onMissing: continue_absent
    body: >-
      The term assigned to {READER} has run out. Its account keeps only the
      years that could be paid and served; a closed watch promises no further
      care. Any surviving unfinished book can be taken up again, unless another
      commitment has claimed the reader. The chair is free.
    absentBody: >-
      The reader named on the earlier page is no longer here. The sickroom
      term has ended, and its account keeps only the
      service actually given. Nobody takes the original reader's place by taking
      the chair.
    interaction:
      kind: narration
      outcomes:
        - id: remembered
          weight: 100
          text: The book has waited. The household could not.


proseVariants:
  - address: content:events/competing_commitments.yaml#events[id=the_reader_has_two_rooms].title
