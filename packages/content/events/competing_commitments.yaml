  - address: content:events/competing_commitments.yaml#events[id=the_readers_open_book_returns].title
    of: 1df5ce29a27521a5
    plainenglish: The Reading Chosen
  - address: content:events/competing_commitments.yaml#events[id=the_readers_open_book_returns].body
