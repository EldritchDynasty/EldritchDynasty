  - id: the_quire_that_is_missing
    title: Eight Leaves, Cut Close to the Fold
    tier: head
    frequency: rare
    weight: 115
    tags: [library, records, secrecy, scandal]
    purposes: [establish_magic_rule, force_record_choice, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      ARCHIVIST: { role: retainer, filters: [{ status: [alive] }] }
    body: >-
      {ARCHIVIST} takes the oldest volume in this house down for its ten-year
      collation and finds a quire gone — eight leaves, cut close to the fold
      with something sharp, between the fourth and fifth gatherings. The
      binding has not been disturbed. The cut is old and the thread over it is
      older than anybody now living. Somebody in this family did this, on
      purpose, with time and a good knife, and left no note about it anywhere
      in four hundred years of entries.
    interaction:
      kind: choice
      choices:
        - id: go_looking_for_it
          label: Look for it. Eight leaves do not walk.
          outcomes:
            - id: found_in_the_press
              weight: 42
              text: >-
                Nine tendays of looking, and the quire is in the press between
                two lease rolls, which is where this house keeps what it will
                not admit to keeping, and has been there since about 1140. It
                is a genealogy. It is four generations of a descent that does
                not match the one the heralds hold, and it matches it in the
                male line exactly.
              effects:
                - { kind: knowledge, op: grant, flag: knows_the_quire_was_kept }
            - id: not_found
              weight: 58
              text: >-
                Nine tendays, every press, both cellars, the chapel and the
                cadet hall, and eight leaves that are not anywhere. What the
                search produces instead is a household that now knows there is
                something missing, and eleven people who did not know that
                three months ago.
              effects:
                - { kind: rumour, op: seed, id: rumour_what_was_cut_out_of_the_book, accuracy: 0.5 }
                - { kind: relationship, from: household, to: head, sentiment: -6 }
        - id: collate_and_say_nothing
          label: Enter it as collated and close the volume.
          outcomes:
            - id: entered_as_collated
              weight: 100
              text: >-
                One word in the collation book, and the volume goes back on
                the shelf, and {ARCHIVIST} — who is paid five marks a year to
                notice exactly this and has just been told not to — writes the
                word and then sits for a while with the pen down. He does not
                resign. He does keep his own note, in his own hand, in his own
                room, as archivists have since there were archivists.
              effects:
                - { kind: relationship, from: { slot: ARCHIVIST }, to: head, sentiment: -22 }
    record:
      subject: the missing quire
      options:
        record:
          chronicle: >-
            Eight leaves are cut out of the oldest volume in this house,
            close to the fold, by somebody of ours, four hundred years ago,
            and there is no note anywhere of why.
          effects: []
          claims:
            - { kind: deed, target: { slot: ARCHIVIST }, text: found eight leaves cut from the oldest volume close to the fold }
        omit:
          chronicle: null
        embellish:
          chronicle: The oldest volume was collated in the tenth year and found entire in every gathering, as it has been at every collation since the founding.
          effects: []
          claims:
            - { kind: deed, target: { slot: ARCHIVIST }, text: collated the oldest volume and found it entire }
          discrepancy:
            id: the_volume_found_entire
            severity: total
            provableBy: [house_ilm, the_church, commons]
    rumour: { id: rumour_the_eight_leaves, accuracy: 0.4, spread: 2 }
    accounts: [the_archivists_own_note, the_collation_book_of_this_house]

# Reviewed Plain English counterparts for the first rare-library scene (#415).
proseVariants:
  - address: "content:events/rare_books.yaml#events[id=a_book_that_names_the_family].title"
    of: "afd458a386580fbf"
    plainenglish: >-
      Our Family's Name in an Unfamiliar Book
  - address: "content:events/rare_books.yaml#events[id=a_book_that_names_the_family].body"
    of: "7c6f9a561d8851f2"
    plainenglish: >-
      The house bought eleven books at Cawdry for one hundred and ten crowns. Most are about
      farming, and one is about horse diseases. The ninth is a notebook kept by an unknown writer
      between about 1130 and 1174. On its forty-first leaf, a list of four families includes this
      family under a heading in Old Ambric. {READER} studied the page for two days before bringing
      the book to the long room.
  - address: "content:events/rare_books.yaml#events[id=a_book_that_names_the_family].interaction.choices[id=find_out_what_the_heading_says].label"
    of: "161138a020bcf414"
    plainenglish: >-
      Hire someone who knows Old Ambric to translate the heading.
  - address: "content:events/rare_books.yaml#events[id=a_book_that_names_the_family].interaction.choices[id=find_out_what_the_heading_says].outcomes[id=it_is_a_list_of_debtors].text"
    of: "0150c0c63e48a7ea"
    plainenglish: >-
      An advocate charges two marks a day for four days and never asks why the house wants the
      translation. The heading is a formula from contract law. It lists the four families as bound
      parties. Three of the other four names had died out before 1300. The advocate takes his
      payment, remains polite, and remembers that afternoon for the rest of his life.
  - address: "content:events/rare_books.yaml#events[id=a_book_that_names_the_family].interaction.choices[id=find_out_what_the_heading_says].outcomes[id=it_is_a_list_of_creditors].text"
    of: "34fda40452ccea08"
    plainenglish: >-
      After four days and eight marks, the advocate explains that the heading is not from contract
      law. It uses wording from a much older kind of record. He will not say what kind, and leaves
      after being paid. Nothing else in the book is written in Old Ambric. Only this page is.
  - address: "content:events/rare_books.yaml#events[id=a_book_that_names_the_family].interaction.choices[id=burn_the_leaf].label"
    of: "f22962854e4b6451"
    plainenglish: >-
      Remove the leaf and burn it. Treat the rest as ordinary farming books.
  - address: "content:events/rare_books.yaml#events[id=a_book_that_names_the_family].interaction.choices[id=burn_the_leaf].outcomes[id=burned_the_leaf].text"
    of: "593dd2993602453d"
    plainenglish: >-
      Removing a leaf from a bound book leaves a visible stub. Everyone in the long room knows a
      later reader will notice it, but they burn the leaf anyway. The other ten books are put on
      shelves. The ninth book is neither shelved nor burned. It is still in the second cellar in
      1400.
  - address: "content:events/rare_books.yaml#events[id=a_book_that_names_the_family].record.subject"
    of: "bccf726561ce58c1"
    plainenglish: >-
      the book's forty-first leaf
  - address: "content:events/rare_books.yaml#events[id=a_book_that_names_the_family].record.options.record.chronicle"
    of: "c9fa432b1dd6e1c7"
    plainenglish: >-
      A notebook bought at Cawdry names our family on its forty-first leaf, in a list of four
      families. An Old Ambric heading stands above the list. Our advocate would not give an
      opinion on its meaning.
  - address: "content:events/rare_books.yaml#events[id=a_book_that_names_the_family].record.options.record.claims[0].text"
    of: "1489fec2446220ee"
    plainenglish: >-
      found this family named on the forty-first leaf of a notebook bought at Cawdry
  - address: "content:events/rare_books.yaml#events[id=a_book_that_names_the_family].record.options.embellish.chronicle"
    of: "d69a7edc6c33df28"
    plainenglish: >-
      The house bought eleven books at Cawdry for one hundred and ten crowns. Most were about
