# THE WORLD LOOKING BACK (core/src/assize.ts).
#
# The Assize moves money, standing, loyalty, grievance and mortality, and says
# so in one chronicle line each. These are the scenes those lines happen in —
# the assessor at the door, the cart from the chapter house, the man who made
# the steward an offer in a room the house does not own.
#
# All COMMON. This is ordinary weather, and CLAUDE.md is explicit about where
# ordinary weather goes: the uncommon cooldown is global to its tier, so a run
# has room for about 83 uncommon firings shared by every uncommon template in
# the game. Texture belongs where there is no cooldown at all.
#
# Each gates on the Assize's own reading, so a house nobody resents never meets
# an assessor and a house nobody pities never meets the cart.
events:
  - id: the_assessor_at_the_door
    title: A Man With a Rule and a Book
    tier: head
    frequency: common
    weight: 110
    tags: [assize, money, standing]
    purposes: [change_standing, force_record_choice, worldbuild_through_action]
    conditions: { assize: { op: gte, value: 0.4 } }
    slots:
      HEAD: { role: head }
      STEWARD: { role: retainer, optional: true, filters: [{ status: [alive] }] }
    body: >-
      He arrives before the fires are up, which is deliberate, and he measures
      the front hall with a knotted cord while his boy writes down the number.
      Glass, he says. Nine panes on the south face and four on the west. He
      does not write down the four grates that have been cold since the last
      head died, and when {HEAD} mentions them he agrees that it is a great
      pity and does not write that down either. He is a polite man doing an unkind
      arithmetic, and both of those are his job. The cord goes back in his
      coat.
    interaction:
      kind: choice
      choices:
        - id: pay_it
          label: Pay what he writes. Argue nothing.
          outcomes:
            - id: paid
              weight: 100
              text: >-
                The figure is high and the house pays it inside the month,
                which is noticed, which was rather the point of the figure.
              effects:
                - { kind: treasury, delta: -70 }
                - { kind: respect, delta: 1 }
        - id: argue
          label: Send the steward to argue it line by line.
          outcomes:
            - id: shaved
              weight: 60
              text: >-
                Four panes come off the count on a technicality about the west
                face, and everyone involved understands that the house has
                just spent something more expensive than money to save it.
              effects:
                - { kind: treasury, delta: -30 }
                - { kind: branch, op: slight, amount: 6 }
            - id: worse
              weight: 40
              text: >-
                He listens to all of it. Then he adds the stable, which he had
                been prepared to forget about.
              effects:
                - { kind: treasury, delta: -95 }

  - id: the_cart_from_the_chapter_house
    title: Grain, and Not a Word About It
    tier: family
    frequency: common
    # 320, up from 105, and the same argument as `the_drowning` in
    # rites.yaml: WHAT RATIONS THIS IS THE CONDITION AND NOT THE TIER. It can
    # only fire while the Assize is reading the house at -0.25 or worse, which
    # is a minority of years in a minority of runs, and it shares the yearly
    # draw with a hundred and four common templates that have no condition on
    # them at all.
    #
    # A flat weight survived a common pool of fifty-five. It did not survive
    # a hundred and five, and then the rare tier's ration was widened and took
    # eight more firings a run out of common on top of that: measured over the
    # sixty-seed coverage batch this went to zero. At 320 it is back to eleven
    # runs in sixty, which is where it was before either drop. 600 buys two
    # more and is not worth taking the draw off everything else for.
    weight: 320
    tags: [assize, church, charity]
    purposes: [buy_patience, change_relationship, worldbuild_through_action]
    conditions: { assize: { op: lte, value: -0.25 } }
    slots:
      HEAD: { role: head }
    body: >-
      The cart comes up the lane at the hour when nobody is watching the lane,
      which is not an accident. Two sacks of grain, a crock of fat, and a
      young clerk who will not come inside and will not give his name. He
      says the chapter house had a surplus. The chapter house has not had a
      surplus in eleven years, and {HEAD} knows it, and the clerk knows that
      too.
    interaction:
      kind: choice
      choices:
        - id: take_it
          label: Take it. Say thank you.
          outcomes:
            - id: taken
              weight: 100
              text: >-
                The house eats through the spring. Somebody in a stone room
                eighteen miles off writes a line in a book, and the line has
                the family's name in it.
              effects:
                - { kind: treasury, delta: 60 }
        - id: refuse
          label: Send it back full.
          outcomes:
            - id: refused
              weight: 100
              text: >-
                The clerk turns the cart in the lane without arguing, which is
                worse than arguing. The house is hungry and unindebted, and
                one of those is a thing you can eat.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: treasury, delta: -10 }

  - id: the_offer_in_another_room
    title: What the Steward Was Offered
    tier: individual
    frequency: common
    weight: 100
    tags: [assize, retainer, loyalty]
    purposes: [change_relationship, plant_rumour, test_magic_rule]
    conditions: { assize: { op: gte, value: 0.4 } }
    slots:
      SERVANT: { role: retainer, filters: [{ status: [alive] }] }
      HEAD: { role: head }
    body: >-
      {SERVANT} is a week coming back from the market and says nothing about
      where the week went. What the house learns, and learns from the wrong
      person, is that there was a room, and a table, and a figure named out
      loud that is more than this house has paid anyone in living memory. He
      came back. He has not said why and he has not asked for more.
    interaction:
      kind: choice
      choices:
        - id: raise_him
          label: Raise his wage before he asks.
          outcomes:
            - id: raised
              weight: 100
              text: >-
                He takes it without comment, and stays, and the house has
                learned exactly what he costs.
              effects:
                - { kind: treasury, delta: -25 }
        - id: say_nothing
          label: Say nothing at all.
          outcomes:
            - id: held
              weight: 55
              text: >-
                He stays. Whatever it was that brought him back was never
                about money, and the house will never find out what it was.
            - id: cooled
              weight: 45
              text: >-
                He stays, and something in the way he says good morning has
                gone flat, and it does not come back.
              effects:
                - { kind: branch, op: slight, amount: 5 }

  - id: the_price_at_the_mill
    title: A Half-Mark More
    tier: family
    frequency: common
    weight: 115
    tags: [assize, money]
    purposes: [change_relationship, plant_rumour, worldbuild_through_action]
    conditions: { assize: { op: gte, value: 0.3 } }
    slots:
      STEWARD: { role: retainer, filters: [{ status: [alive] }] }
    body: >-
      The mill charges the village four marks the load and it charges this
      house four and a half, and has since spring, and when {STEWARD} asks
      about it the miller is very sorry. He is sorry the way a man is sorry
      about weather. The house can buy elsewhere, eleven miles further, at a
      price that works out to about four and a half.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            The house pays it. There is a word for what this is and nobody at
            the mill uses it.
          effects:
            - { kind: treasury, delta: -18 }

# Plain English alternatives for the Assize scenes (#617, #415).
proseVariants:
  - address: content:events/assize.yaml#events[id=the_assessor_at_the_door].title
    of: e0b92126f4022302
    plainenglish: >-
      The Assessor Arrives With His Records
  - address: content:events/assize.yaml#events[id=the_assessor_at_the_door].body
    of: cc0b95afff7488f3
    plainenglish: >-
      The assessor arrives before the fires are lit. He measures the front hall with a
      knotted cord while his assistant writes down the figures. He counts nine glass
      panes on the south side and four on the west. He ignores the four grates that have
      been cold since the previous head died. When {HEAD} points them out, he politely
      agrees that this is unfortunate but does not record it. He puts the cord back in
      his coat.
  - address: content:events/assize.yaml#events[id=the_assessor_at_the_door].interaction.choices[id=pay_it].label
    of: cda7005dd4e470a1
    plainenglish: >-
      Pay the amount he records without arguing.
  - address: content:events/assize.yaml#events[id=the_assessor_at_the_door].interaction.choices[id=pay_it].outcomes[id=paid].text
    of: 69e4c6bd0bf14e71
    plainenglish: >-
      The assessment is expensive. The house pays it within a month, and people notice
      that it paid promptly. The high charge was intended to make that payment visible.
  - address: content:events/assize.yaml#events[id=the_assessor_at_the_door].interaction.choices[id=argue].label
    of: 9e73b6b3afc9dba7
    plainenglish: >-
      Ask the steward to challenge each item in the assessment.
  - address: content:events/assize.yaml#events[id=the_assessor_at_the_door].interaction.choices[id=argue].outcomes[id=shaved].text
    of: ec7cecb45763a150
    plainenglish: >-
      A technical rule about the west side removes four panes from the count. The house
      saves money, but everyone involved knows that the argument has cost it something
      more valuable.
  - address: content:events/assize.yaml#events[id=the_assessor_at_the_door].interaction.choices[id=argue].outcomes[id=worse].text
    of: 9d3d29a5135a3299
    plainenglish: >-
      He listens to every objection, then adds the stable to the assessment. He had been
      prepared to leave it out.
  - address: content:events/assize.yaml#events[id=the_cart_from_the_chapter_house].title
    of: 3954cab9fdea5a65
    plainenglish: >-
      Food Delivered Quietly by the Chapter House
  - address: content:events/assize.yaml#events[id=the_cart_from_the_chapter_house].body
    of: c5549502b77e0956
    plainenglish: >-
      A cart arrives when no one is watching the lane. It carries two sacks of grain, a
      pot of fat and a young clerk who refuses to enter the house or give his name. He
      claims that the chapter house has extra supplies, although it has had none to
      spare for eleven years. Both he and {HEAD} know this is untrue.
  - address: content:events/assize.yaml#events[id=the_cart_from_the_chapter_house].interaction.choices[id=take_it].label
    of: 3fe967dbd84cfe9f
    plainenglish: >-
      Accept the supplies and thank the clerk.
  - address: content:events/assize.yaml#events[id=the_cart_from_the_chapter_house].interaction.choices[id=take_it].outcomes[id=taken].text
    of: 04159fe8c2ca9334
    plainenglish: >-
      The supplies feed the house through spring. At the chapter house, eighteen miles
      away, someone writes the family's name in a record book.
  - address: content:events/assize.yaml#events[id=the_cart_from_the_chapter_house].interaction.choices[id=refuse].label
    of: 6d02069ad366c396
    plainenglish: >-
      Return the cart with all the supplies.
  - address: content:events/assize.yaml#events[id=the_cart_from_the_chapter_house].interaction.choices[id=refuse].outcomes[id=refused].text
    of: 8794b0e4df473048
    plainenglish: >-
      The clerk turns the cart around without arguing. The house remains hungry but owes
      nothing to the chapter house. Being free of that debt will not feed anyone.
  - address: content:events/assize.yaml#events[id=the_offer_in_another_room].title
    of: ce06c596f865bc42
    plainenglish: >-
      The Offer Made to the Steward
  - address: content:events/assize.yaml#events[id=the_offer_in_another_room].body
    of: 9221adfb0d830d8f
    plainenglish: >-
      {SERVANT} returns from the market a week late and says nothing about the missing
      week. Someone else tells the house that he was offered more money in a private
      meeting than the house has paid anyone in living memory. He came back anyway. He
      has not explained why or asked for more pay.
  - address: content:events/assize.yaml#events[id=the_offer_in_another_room].interaction.choices[id=raise_him].label
    of: 7c88bc83a232a627
    plainenglish: >-
      Raise his pay before he asks.
  - address: content:events/assize.yaml#events[id=the_offer_in_another_room].interaction.choices[id=raise_him].outcomes[id=raised].text
    of: 9db267f972592845
    plainenglish: >-
      He accepts the raise without comment and stays. The house now knows how much it
      costs to keep him.
  - address: content:events/assize.yaml#events[id=the_offer_in_another_room].interaction.choices[id=say_nothing].label
    of: 0130ee616a3486a5
    plainenglish: >-
      Say nothing about the offer.
  - address: content:events/assize.yaml#events[id=the_offer_in_another_room].interaction.choices[id=say_nothing].outcomes[id=held].text
    of: 7b897bd6397c3e6a
    plainenglish: >-
      He stays. Money was not the reason he came back, but the house will never find out
      what brought him back.
  - address: content:events/assize.yaml#events[id=the_offer_in_another_room].interaction.choices[id=say_nothing].outcomes[id=cooled].text
    of: 788a418104e604ed
    plainenglish: >-
      He stays, but the warmth has gone from his morning greeting. It never returns.
  - address: content:events/assize.yaml#events[id=the_price_at_the_mill].title
    of: 8200d836d2e827f2
    plainenglish: >-
      The Mill Charges Half a Mark More
  - address: content:events/assize.yaml#events[id=the_price_at_the_mill].body
    of: fedd3f55cf8348b9
    plainenglish: >-
      Since spring, the mill has charged the village four marks per load but charged
      this house four and a half. When {STEWARD} asks why, the miller apologises without
      offering to change the price. Another mill is eleven miles farther away, and
      buying there would still cost about four and a half marks per load.
  - address: content:events/assize.yaml#events[id=the_price_at_the_mill].interaction.outcomes[id=only].text
    of: 3f711a7930ac1c05
    plainenglish: >-
      The house pays the higher price. The mill is taking advantage of the house, but
      nobody there will admit it.
