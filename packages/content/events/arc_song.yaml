# Nodes of arc_the_song_we_taught_them.
#
# No person binding is needed. This story follows a piece of folklore, which is
# exactly the thing that survives while every singer and every Head changes.
events:
  - id: song_the_stave_they_left
    title: What They Left Behind
    tier: family
    frequency: uncommon
    weight: 100
    tags: [folklore, wayfolk, reputation, arc]
    purposes: [plant_rumour, change_standing, worldbuild_through_action]
    arc: { of: arc_the_song_we_taught_them, node: the_gift }
    slots:
      HEAD: { role: head }
    body: >-
      The Wayfolk were paid to carry another house's story straight, and they
      remember being paid better than they remember the other house. The next
      time a company sleeps at Ardwen, its singer leaves a stave behind as a
      courtesy: an old family story set cleanly enough that the room can come
      in on the last line before supper is done. Most of it is true. One part
      is kinder than the truth, and nobody in the room corrects it.
    interaction:
      kind: narration
      outcomes:
        - id: taken_to_the_road
          weight: 100
          text: >-
            By morning three servants know the turn and one child knows half of
            it. The wagons take the rest east. The house did not buy this song,
            but it taught the people who made it that Ardwen listens when a
            story is sung carefully.
          effects:
            - { kind: respect, delta: 1 }
            - { kind: rumour, op: seed, id: rumour_the_stave_ardwen_helped_make, accuracy: 0.75 }

  - id: song_two_versions_at_greening
    title: Two Fourth Staves
    tier: family
    frequency: uncommon
    weight: 100
    tags: [folklore, wayfolk, feast, arc]
    purposes: [plant_rumour, force_record_choice, worldbuild_through_action]
    arc: { of: arc_the_song_we_taught_them, node: two_versions }
    slots:
      HEAD: { role: head }
    body: >-
      At Greening two companies arrive within a day of each other, which is
      awkward before either one sings a note. Both know the Ardwen stave. One
      has the ending the house heard first; the other has a fourth verse about
      a locked room, a winter birth, and a silver cup that never existed. The
      false verse is better. By sunset half of Wick can sing both.
    interaction:
      kind: choice
      choices:
        - id: buy_the_old_ending
          label: Pay again. Ask both companies to carry the older ending.
          outcomes:
            - id: bought_again
              weight: 100
              text: >-
                Four crowns this time, because there are two companies and
                everybody has learned the market. They take the money and keep
                their word. The old ending travels farther for another
                generation, while the better fourth verse travels for free.
              effects:
                - { kind: treasury, delta: -4 }
                - { kind: rumour, op: correct, id: rumour_the_stave_ardwen_helped_make, accuracy: 0.7 }
        - id: let_both_go
          label: Let both versions travel. Paying for truth once was lesson enough.
          outcomes:
            - id: both_travel
              weight: 100
              text: >-
                Both companies leave with both endings and choose according to
                the room. Caster likes the locked room. Cawdry prefers the
                older line. Nobody is lying when they say this is how the song
                goes, because by then it goes both ways.
              effects:
                - { kind: rumour, op: feed, id: rumour_the_stave_ardwen_helped_make, accuracy: 0.45 }

  - id: song_the_children_have_one_version
    title: The Version Nobody Bought
    tier: family
    frequency: uncommon
    weight: 100
    tags: [folklore, children, records, arc]
    purposes: [plant_rumour, force_record_choice, buy_patience]
    arc: { of: arc_the_song_we_taught_them, node: one_version }
    slots:
      HEAD: { role: head }
    body: >-
      Children at Wick are singing it now. The names are gone, the winter has
      become a flood, and the silver cup has survived every person who could
      have said there was never a silver cup. One line from the version Ardwen
      first heard is still there, word for word, lodged inside a story no Head
      of the house ever chose. {HEAD} knows the line because the old account
      about the Wayfolk is still in the book.
    interaction:
      kind: narration
      outcomes:
        - id: survived_wrong
          weight: 100
          text: >-
            The children finish the stave and start it again. The song has
            lasted exactly as the house hoped a true story might. It has also
            become something the house never chose, which turns out to be the
            more durable achievement.
          effects:
            - { kind: rumour, op: feed, id: rumour_the_stave_ardwen_helped_make, accuracy: 0.35 }
    record:
      subject: the stave Ardwen helped put on the road
      options:
        record:
          chronicle: >-
            We taught the Wayfolk that Ardwen would pay attention to a story
            told carefully, and a stave followed. What came back kept one line
            true and made the rest its own. The account and the song children
            sing now are both kept because neither is the whole of what happened.
          effects: []
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            The old stave of Ardwen rose among the people without purchase and
            has kept the house's deeds faithfully wherever it is sung.
          effects:
            - { kind: respect, delta: 1 }
          discrepancy:
            id: the_song_nobody_bought
            severity: major
            provableBy: [commons, house_marrow]

proseVariants:
  - address: "content:events/arc_song.yaml#events[id=song_the_stave_they_left].title"
    of: "05fb88dc668f8550"
    plainenglish: >-
      The Song They Left Behind
  - address: "content:events/arc_song.yaml#events[id=song_the_stave_they_left].body"
    of: "b41f98f03be8e74c"
    plainenglish: >-
      The Wayfolk were paid to tell another house's story accurately, but they
      remember how well they were paid more than the other house itself. Later,
      another Wayfolk company stays at Ardwen. Its singer leaves a song about an
      old family as a gift. The verses are clear enough that everyone can join in
      before supper ends. Most of the story is true. One part makes the family look
      better than it should, and no one objects.
  - address: "content:events/arc_song.yaml#events[id=song_the_stave_they_left].interaction.outcomes[id=taken_to_the_road].text"
    of: "5da081ad6f027fe1"
    plainenglish: >-
      By the next morning, three servants have learned part of the song and a child
      knows half of it. The Wayfolk wagons carry the rest east. Ardwen did not pay
      for this song. Its earlier payment taught the singers that Ardwen listens
      when a story is told carefully.
  - address: "content:events/arc_song.yaml#events[id=song_two_versions_at_greening].title"
    of: "56d7f065afc54b11"
    plainenglish: >-
      Two Versions of the Fourth Stave
  - address: "content:events/arc_song.yaml#events[id=song_two_versions_at_greening].body"
    of: "ff5837669318f522"
    plainenglish: >-
      At Greening, two Wayfolk companies arrive just one day apart. Both know the
      Ardwen song. One sings the ending Ardwen heard first. The other has added a
      fourth verse about a locked room, a winter birth and a silver cup that never
      existed. The invented verse makes a better song. By sunset, half the people
      in Wick can sing both versions.
  - address: "content:events/arc_song.yaml#events[id=song_two_versions_at_greening].interaction.choices[id=buy_the_old_ending].label"
    of: "5e9a7f9c680bf408"
    plainenglish: >-
      Pay both companies again and ask them to sing the older ending.
  - address: "content:events/arc_song.yaml#events[id=song_two_versions_at_greening].interaction.choices[id=buy_the_old_ending].outcomes[id=bought_again].text"
    of: "58e42b52b8a20966"
    plainenglish: >-
      There are two companies now, so it costs four crowns. Everyone has learned
      what Ardwen is willing to pay. The singers accept the money and keep their
      promise. The old ending spreads farther for another generation, but the
      popular invented verse keeps spreading without payment.
  - address: "content:events/arc_song.yaml#events[id=song_two_versions_at_greening].interaction.choices[id=let_both_go].label"
    of: "76f19b262c457632"
    plainenglish: >-
      Allow both versions to spread. Paying for the truth once was enough.
  - address: "content:events/arc_song.yaml#events[id=song_two_versions_at_greening].interaction.choices[id=let_both_go].outcomes[id=both_travel].text"
    of: "b6993da92e9e042d"
    plainenglish: >-
      Both companies leave knowing both endings. They choose which one to sing
      based on their listeners. In Caster, people enjoy the story about the locked
      room. In Cawdry, they prefer the older ending. By then the song has two
      accepted versions, so the singers do not think they are lying.
  - address: "content:events/arc_song.yaml#events[id=song_the_children_have_one_version].title"
    of: "99b41d966e0f5ca2"
    plainenglish: >-
      The Version Nobody Paid For
  - address: "content:events/arc_song.yaml#events[id=song_the_children_have_one_version].body"
    of: "818198d2648441ee"
    plainenglish: >-
      Children in Wick now sing the song. They no longer remember the names, the
      winter has become a flood, and the silver cup remains in the story even
      though it never existed. One line is still exactly as Ardwen first heard it,
      but it now belongs to a story no Head ever chose. {HEAD} recognises the line
      because the house kept its account of the Wayfolk in the book.
  - address: "content:events/arc_song.yaml#events[id=song_the_children_have_one_version].interaction.outcomes[id=survived_wrong].text"
    of: "54a4bcfead4dca82"
    plainenglish: >-
      The children finish the song and begin again. It has lasted just as Ardwen
      hoped a true story would. But it has changed into something the house never
      chose, and that changed version has proved more lasting.
  - address: "content:events/arc_song.yaml#events[id=song_the_children_have_one_version].record.subject"
    of: "5f90e8a31296b927"
    plainenglish: >-
      the song Ardwen helped send into the world
  - address: "content:events/arc_song.yaml#events[id=song_the_children_have_one_version].record.options.record.chronicle"
    of: "c020643232179c4e"
    plainenglish: >-
      We showed the Wayfolk that Ardwen would listen to a carefully told story, and
      a song followed. One line stayed true while the rest changed over time. We
      kept both the first account and the version children sing now because neither
      tells the whole story.
  - address: "content:events/arc_song.yaml#events[id=song_the_children_have_one_version].record.options.embellish.chronicle"
    of: "68bfc1d73a80b3fb"
    plainenglish: >-
      The old song about Ardwen spread without anyone paying for it. Wherever
      people sing it, they faithfully tell the truth about what our house did.
