# THE PLAGUE — cold register, and the only Age whose economy is a magic rule.
#
# World file §14: "A Life-affine practitioner in a plague year cannot be hired
# at any price, which is the whole of the Plague Age's economy." Everything
# here runs off that sentence. Mortality is weighted against low Strength, so
# the arithmetic of who survives is legible to the household BEFORE it happens,
# and that legibility is the horror — not the fever.
#
# The eleven days is custom, not law (§23). No physician defends the number and
# no household in the province will go a day short of it, which is what custom
# means in a place eleven miles from a magistrate.
events:
  - id: the_eleven_days
    title: The Reeve Counts to Eleven
    tier: family
    frequency: common
    weight: 130
    tags: [plague, quarantine, custom]
    purposes: [buy_patience, worldbuild_through_action, test_magic_rule]
    ages: { only: [the_plague] }
    slots:
      HEAD: { role: head }
    body: >-
      The gate is shut, which it has not been in ninety years, and the sound it
      made going across is the thing the children will remember. Eleven days is
      the custom. Eleven days from the last house in Wick that had it, and then
      eleven more if another one does, and there is no law behind the number
      and no physician who will defend it and not one household in this
      province that will go a day short. The house has bread, water off the
      Wend, and forty-one days of nothing to do. A green hand cannot be hired
      this year at any price, and everybody with the money to try has tried
      already. The reeve counts to eleven out loud.
    interaction:
      kind: choice
      choices:
        - id: keep_the_gate
          label: Keep the gate. Eleven days, and then eleven more.
          outcomes:
            - id: held
              weight: 100
              text: >-
                Forty-one days, in the end. Nobody in the hall takes it, three
                tenant families do, and for the rest of the century Wick is
                careful about how it says the word neighbour.
              effects:
                - { kind: treasury, delta: -20 }
                - { kind: respect, delta: -1 }
        - id: open_for_the_village
          label: Open to Wick. They are the house's people.
          outcomes:
            - id: opened_and_spared
              weight: 44
              text: >-
                Fourteen come up from the village and are put in the west wing,
                and by some arrangement of luck that nobody afterwards agrees
                about, the hall does not take it.
              effects:
                - { kind: treasury, delta: -32 }
                - { kind: respect, delta: 1 }
            - id: opened_and_took_it
              weight: 56
              text: >-
                Fourteen come up from the village and are put in the west wing,
                and on the sixth day it is in the hall, and after that the
                question of who brought it is not a question anyone can answer
                or stop asking.
              effects:
                - { kind: treasury, delta: -32 }
                - { kind: respect, delta: 1 }
                - { kind: flag, flag: opened_the_gate_to_wick, set: true }

  - id: the_physician_from_bramme
    title: Fourteen Crowns for a Lens
    tier: family
    frequency: uncommon
    # 230 rather than 115, and a fifteen-year cooldown rather than thirty —
    # the same move `who_gets_the_physician` and `the_physician_shuts_the_gate`
    # already document in this file, for the same constraint: the Plague is
    # about four per cent of years, runs a median of fourteen of them, and
    # carries six templates, so a weight here is a share of a very short
    # window rather than a preference. At 115/30yr this was the smallest
    # share of the six and the longest cooldown next to `the_hall_after`'s —
    # gate 8 found `retain_him -> retained` resolving in none of a 250-run
    # batch once #98 (an unrelated content drop) reshuffled which of the
    # Plague's already-few draws landed on it. Doubling the weight and halving
    # the cooldown is the exact adjustment this file already made twice for
    # the same reason; re-measure alongside its neighbours if either moves
    # again.
    weight: 230
    cooldownYears: 15
    tags: [plague, physician, money]
    purposes: [change_standing, buy_patience, test_magic_rule]
    ages: { only: [the_plague] }
    slots:
      HEAD: { role: head }
      PHYSICIAN:
        role: outsider
        filters: [{ age: { op: gte, value: 28 } }]
    body: >-
      {PHYSICIAN} arrives on the ninth day, which is early, and is dry, which
      means the journey was not made on foot. Fourteen crowns for the lens and
      two marks a day for the man, and he is honest enough to say in the yard
      that the lens is for his own satisfaction and not for anybody's recovery.
      He can set a bone, open a swelling, and tell you on the second morning
      which way a case is going to go. That last one is the whole of what
      fourteen crowns buys. He does not pretend otherwise, and the house does
      not pretend it hired him for anything else, and both of those are a kind
      of respect. He asks where to wash.
    interaction:
      kind: choice
      choices:
        - id: retain_him
          label: Retain him for the duration. Whatever it costs.
          outcomes:
            - id: retained
              weight: 100
              text: >-
                Two marks a day for as long as it runs, and what the house buys
                is not survival. It is knowing on the second morning, which
                turns out to be worth having and impossible to explain to
                anyone who was not in the room.
              effects:
                - { kind: treasury, delta: -28 }
                - { kind: relationship, from: head, to: { slot: PHYSICIAN }, sentiment: 15 }
        - id: pay_the_visit
          label: Pay for the visit and send him on to Wick.
          outcomes:
            - id: sent_on
              weight: 100
              text: >-
                He is paid for the day, fed, and sent down the hill to a
                village that cannot pay him at all. The house does not see him
                again and hears about him for twenty years.
              effects:
                - { kind: treasury, delta: -3 }
                - { kind: respect, delta: 1 }

  - id: who_gets_the_physician
    title: Saying It Aloud
    tier: family
    frequency: uncommon
    # 260 rather than 125, and a twelve-year cooldown rather than twenty-five.
    #
    # The rationing here is the AGE, not the slots — `relation: not, of: HEAD`
    # reads "is not that same person" (`conditions.ts`), not "is not of his
    # blood", so both slots below are wide. What is narrow is that the Plague
    # is about four per cent of years, runs a median of fourteen of them, and
    # now carries six templates; and a twenty-five-year cooldown on a
    # fourteen-year Age meant this could fire at most once per plague however
    # heavily it was weighted. Twelve lets a long plague show it twice, which
    # is where the reach came from — the weight alone had already failed to
    # keep all four of its endings above gate 8's floor twice running.
    weight: 260
    cooldownYears: 12
    tags: [plague, triage, hard]
    purposes: [change_relationship, buy_patience, test_magic_rule]
    ages: { only: [the_plague] }
    conditions:
      all:
        - { ageElapsed: { op: gte, years: 2 } }
    slots:
      HEAD: { role: head }
      ELDEST:
        role: family_member
        filters: [{ age: { op: gte, value: 14 } }, { relation: not, of: HEAD }]
      LEAST:
        role: family_member
        filters: [{ age: { op: gte, value: 4 } }, { relation: not, of: HEAD }, { relation: not, of: ELDEST }]
    body: >-
      There is one physician, two marks a day, and the fever is in three rooms
      of the house at once. {HEAD} has to say a name. Not a wrong name and a
      right name — three names, all of them people who sat at his table on the
      third night, and the physician has said in plain words that going room to
      room is how a physician carries a thing from one room to the next.
      Strength is what survives this, everybody in the house knows that, and
      everybody in the house has done the arithmetic on everybody else. The
      arithmetic is not the hard part, and anybody who says it is has never had
      to read it out to a room. Saying it aloud is.
    interaction:
      kind: choice
      choices:
        - id: the_strong_one
          label: The one most likely to live.
          outcomes:
            # 55/45 rather than 70/30. Four endings under two branches inside a
            # four-percent Age is already at the edge of what gate 8 can see;
            # a 30 makes one of them unreachable in practice, which is not the
            # same thing as unlikely.
            - id: spent_well
              weight: 55
              text: >-
                He lives, and would probably have lived anyway, and the other
                two live as well, and there is no version of the next thirty
                years in which anybody in that house brings the evening up.
              effects:
                - { kind: treasury, delta: -14 }
                - { kind: relationship, from: head, to: { slot: LEAST }, sentiment: -20 }
            - id: spent_badly
              weight: 45
              text: >-
                He lives. The youngest of the three does not, and the house has
                spent two marks a day for eleven days to find out that the
                arithmetic was only ever arithmetic.
              effects:
                - { kind: treasury, delta: -14 }
                - { kind: status, target: { slot: LEAST }, status: dead, cause: the fever }
        - id: the_weak_one
          label: The one least likely to live.
          outcomes:
            - id: bought_days
              weight: 55
              text: >-
                It buys nine days and a bed by a window and somebody in the
                room at the end of it, and the house is told afterwards, by
                three separate people, that nine days was not nothing.
              effects:
                - { kind: treasury, delta: -14 }
                - { kind: status, target: { slot: LEAST }, status: dead, cause: the fever }
                - { kind: relationship, from: head, to: { slot: ELDEST }, sentiment: 15 }
            - id: kept_them_both
              weight: 45
              text: >-
                They both come through it, and nobody can tell anybody why, and
                the house spends the next forty years being careful not to
                build a rule out of one winter.
              effects:
                - { kind: treasury, delta: -14 }

  - id: the_hall_after
    title: Six Grates of Seven
    tier: record
    frequency: uncommon
    # 600, and the argument is `the_drowning`'s one layer over: WHAT RATIONS
    # THIS IS THE AGE WINDOW AND NOT THE TIER. Measured over forty runs, the
    # Plague reaches every one of them, but `ageElapsed >= 5` inside it leaves
    # this template eligible for about ELEVEN YEARS OF A THOUSAND — and a flat
    # weight of 105 prices those eleven years as though they were the whole
    # run, against seventy-nine uncommon templates that are eligible in nearly
    # all of it. It fired in 2 runs of 60. Gate 4's floor is half a per cent,
    # so a genuinely-working 2% event lands under it whenever the stream moves
    # (measured: identical eligible-years, 436 against 433, and 2 of 100
    # before against 0 of 100 after an unrelated content drop).
    #
    # At 600 it is 12 runs in 60, and its Age siblings are unmoved inside
    # noise: the river road 13 -> 12 of 60, the quarry match 6 -> 6. Six
    # hundred is still a PARTIAL correction — closing the window ratio in full
    # would want four figures — and the rest of the Age-scoped block sits in
    # the same place for the same reason. See `docs/BALANCE-LOG.md`.
    weight: 600
    cooldownYears: 45
    tags: [plague, aftermath, record]
    purposes: [change_relationship, force_record_choice, buy_patience]
    ages: { only: [the_plague] }
    conditions:
      all:
        - { ageElapsed: { op: gte, years: 5 } }
    slots:
      HEAD: { role: head }
      STEWARD: { role: retainer, filters: [{ status: [alive] }], optional: true }
    body: >-
      The hall is quiet in the specific way a hall is quiet when it has the
      same number of rooms and fewer people in them. Six of the seven grates
      are cold and nobody gave an order about it. Nobody has been up the west
      stair since the Tuesday. {HEAD} counts the household the way a steward
      counts it, which is by places laid, and the number he gets is a number
      this house last had in his grandmother's time, and she was not proud of
      it either. The Age is not over, and there is no announcement when one
      ends, and the only thing that has changed is the noise. The grates stay
      cold.
    interaction:
      kind: narration
      outcomes:
        - id: counted
          weight: 100
          text: >-
            The places are laid for the number that is left, which is the first
            practical decision anybody has made in a month, and it is made by
            the kitchen rather than by anyone at the table.
          effects:
            - { kind: flag, flag: the_hall_was_counted, set: true }
    record:
      subject: the year the hall emptied
      options:
        record:
          chronicle: The fever took what it took. The places were laid for those left, and the number is written here so that it cannot be argued with later.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: counted the places left after the fever and wrote the number down }
        omit:
          chronicle: null
        embellish:
          chronicle: The fever passed over this house, which lost less than any hall in the Nethering, and the reason was said in the village to be the blood.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: brought the house through the fever with fewer losses than any hall in the province }
          discrepancy:
            id: the_fever_count_lie
            severity: major
            provableBy: [commons, the_church]

  # THE POST, MEASURED IN BOTH DIRECTIONS.
  #
  # Gated on `unlocked: sickroom` this fired in 0% of a hundred runs: the
  # Plague is 4% of years, a physician is in post for most of them but not all,
  # and the intersection after rationing is nothing. So the gate came off and
  # the SLOT went optional instead. Now it fires in every plague and the post
  # decides which body the player reads, which is a better answer anyway —
  # what a retainer is worth is only legible against the year you did not have
  # one.
  - id: the_physician_shuts_the_gate
    title: What She Tells Them to Do
    tier: head
    frequency: uncommon
    # 190. This went 150 → 95 → 190 across one afternoon of measurement and the
    # trip is worth recording, because both ends were wrong for the same
    # reason. At 150 it took about a quarter of the Plague's draws and
    # `who_gets_the_physician` fell from 11% of runs to 7%; at 95 it fell to 2%
    # of runs itself, and its `shut_it` branch has a single ending, so that
    # ending resolved in none of a hundred thousand-year runs. An Age-scoped
    # pool is small — the Plague is four per cent of years and carries six
    # templates — so a weight here is not a preference, it is a share of a
    # very short window, and both neighbours have to be measured after moving
    # it. `who_gets_the_physician` carries 260 and a twelve-year cooldown now
    # and is comfortable at this.
    weight: 190
    tags: [plague, retainer, medicine, hardship]
    purposes: [change_standing, establish_magic_rule, worldbuild_through_action]
    ages: { only: [the_plague] }
    slots:
      HEAD: { role: head }
      PHYSICIAN:
        role: retainer
        optional: true
        filters: [{ trait: keeps_the_sickroom, has: true }]
    body: >-
      It is at Bramme, eleven miles off, which is four hours by a good horse
      and about eleven days by the way the thing actually travels. {PHYSICIAN}
      wants the gate shut now, before it is anywhere near, and shut on tenants
      as well — no market, no fair, nobody up from Wick, and the two carters
      turned at the ford. She cannot tell {HEAD} why any of it works. She can
      say that she was at Hesk in the last one, and that the two houses which
      did this are two houses that are still there. A house with Life on the
      fourth shelf might do better, if it had a warranted practitioner, and if
      unwarranted practice were not a crime in both courts, and if any of that
      were a thing this family could be seen doing. It is boiled linen or it is
      nothing.
    absentBody: >-
      It is at Bramme, eleven miles off, and there is nobody in this house who
      knows anything about it that a tenant does not also know. The steward has
      a theory. The cook has a better one and it disagrees. Somebody remembers
      that in the last one the houses that shut early came through, and
      somebody else remembers exactly the opposite and remembers it just as
      clearly, and there is no third person to ask. A house with Life on the
      fourth shelf might do better, if it had a warranted practitioner, and if
      unwarranted practice were not a crime in both courts. What {HEAD} has to
      go on this afternoon is a cook, a steward and a memory. It comes to
      nothing at all.
    interaction:
      kind: choice
      choices:
        - id: shut_it
          label: Shut the gate. Tenants and all, and let them say what they like.
          outcomes:
            - id: held
              weight: 100
              text: >-
                Eleven weeks of it, the mill idle, and a man at the ford every
                night with a lamp. It gets into the dairy once, in the fourth
                week, and takes one before it stops. Wick loses nine. Every one
                of the nine is somebody {HEAD} has known since they were
                both children, and the gate stayed shut for all nine, and the
                arithmetic afterwards is correct and there is nobody in this
                house who can stand to say it out loud.
              effects:
                - { kind: treasury, delta: -60 }
                - { kind: respect, delta: -1 }
        - id: keep_it_open
          label: Keep it open. A house that shuts its door is remembered longer than a house that buries.
          outcomes:
            # One ending under each branch. The Plague is 4% of years and this
            # is one of five templates scoped to it, so a second ending here
            # is an ending nobody reaches: gate 8 measured the 42-weight one
            # resolving in zero of a hundred thousand-year runs. The gamble is
            # still in the scene. It is just not in the weights.
            - id: open_and_not
              weight: 100
              text: >-
                It is in the hall by the third week. Nobody says a word about
                the gate, then or afterwards or ever, and the work goes on for
                nineteen days without anybody sleeping properly, and at the end
                of it the house counts and the count is bad. What the house
                remembers is not the count. It is that nobody left.
              effects:
                - { kind: treasury, delta: -40 }
                - { kind: respect, delta: 1 }

proseVariants:
  - address: "content:events/age_plague.yaml#events[id=the_eleven_days].title"
    of: 7d4fde79825faa8d
    plainenglish: >-
      The Reeve Counts Eleven Days
  - address: "content:events/age_plague.yaml#events[id=the_eleven_days].body"
    of: 5a97db35a3c853d1
    plainenglish: >-
      The gate closes for the first time in ninety years. The children will remember the
      sound. The custom is to wait eleven days after the last house in Wick has the
      fever. If another house becomes infected, the count starts again. No law or
      physician supports the number, but no household in the province will end the
      quarantine early. The house has bread, water from the Wend, and forty-one days with
      nothing to do. No Life-affine healer can be hired this year, whatever the price.
      Every wealthy family has already tried. The reeve counts the days aloud.
  - address: "content:events/age_plague.yaml#events[id=the_eleven_days].interaction.choices[id=keep_the_gate].label"
    of: 1016435058e4cf54
    plainenglish: >-
      Keep the gate closed for eleven days, and another eleven if needed.
  - address: "content:events/age_plague.yaml#events[id=the_eleven_days].interaction.choices[id=keep_the_gate].outcomes[id=held].text"
    of: 9b9f1205410c0e99
    plainenglish: >-
      The gate stays closed for forty-one days. Nobody in the hall catches the fever, but
      three tenant families do. For the rest of the century, people in Wick choose their
      words carefully when they call the house a neighbour.
  - address: "content:events/age_plague.yaml#events[id=the_eleven_days].interaction.choices[id=open_for_the_village].label"
    of: cdab8f9081406c4c
    plainenglish: >-
      Open the gate to Wick. The villagers are the house's people.
  - address: "content:events/age_plague.yaml#events[id=the_eleven_days].interaction.choices[id=open_for_the_village].outcomes[id=opened_and_spared].text"
    of: 8aefa6c083ceb0ac
    plainenglish: >-
      Fourteen villagers come up to stay in the west wing. Nobody in the hall catches the
      fever. Afterwards, people disagree about what stroke of luck spared them.
  - address: "content:events/age_plague.yaml#events[id=the_eleven_days].interaction.choices[id=open_for_the_village].outcomes[id=opened_and_took_it].text"
    of: b5a93c52b2fb41ee
    plainenglish: >-
      Fourteen villagers move into the west wing. On the sixth day the fever reaches the
      hall. Nobody can say who brought it in, but the household cannot stop asking.
  - address: "content:events/age_plague.yaml#events[id=the_physician_from_bramme].title"
    of: b8b612b9538a8075
    plainenglish: >-
      A Physician's Lens Costs Fourteen Crowns
  - address: "content:events/age_plague.yaml#events[id=the_physician_from_bramme].body"
    of: d94c4ace4a446722
    plainenglish: >-
      {PHYSICIAN} arrives on the ninth day, earlier than expected. He is dry, so he must
      have travelled without walking. He charges fourteen crowns for his lens and two
      marks a day for his services. He admits that the lens helps him examine patients
      but will not cure them. He can set broken bones, open swellings, and tell by the
      second morning whether a patient is likely to recover. That knowledge is what the
      house is buying. Both he and the household admit it, and each respects the other's
      honesty. He asks where he can wash.
  - address: "content:events/age_plague.yaml#events[id=the_physician_from_bramme].interaction.choices[id=retain_him].label"
    of: b1509d89d8c963fd
    plainenglish: >-
      Keep him until the fever ends, whatever the cost.
  - address: "content:events/age_plague.yaml#events[id=the_physician_from_bramme].interaction.choices[id=retain_him].outcomes[id=retained].text"
    of: 1a5d27d80f92939c
    plainenglish: >-
      The physician receives two marks every day until the fever ends. The house cannot
      buy survival, but by the second morning it can know how each patient is likely to
      fare. That knowledge matters to the people in the room, even if they cannot explain
      why.
  - address: "content:events/age_plague.yaml#events[id=the_physician_from_bramme].interaction.choices[id=pay_the_visit].label"
    of: 1e2e061f1489b9a3
    plainenglish: >-
      Pay for today's visit, then send him to Wick.
  - address: "content:events/age_plague.yaml#events[id=the_physician_from_bramme].interaction.choices[id=pay_the_visit].outcomes[id=sent_on].text"
    of: adf30c73171e1087
    plainenglish: >-
      He receives his day's pay and a meal, then goes down the hill to Wick. The
      villagers cannot afford to pay him. The house never sees him again, but people tell
      stories about him for twenty years.
  - address: "content:events/age_plague.yaml#events[id=who_gets_the_physician].title"
    of: 29881996347a8a4a
    plainenglish: >-
      Choosing Who Gets the Physician
  - address: "content:events/age_plague.yaml#events[id=who_gets_the_physician].body"
    of: 9828eead27659bd1
    plainenglish: >-
      The fever has reached three rooms at once. There is only one physician, and he
      charges two marks a day. {HEAD} must choose which of three people receives his
      care. All three sat at his table on the third night. The physician has explained
      that moving from room to room may carry the fever between patients. Stronger people
      are more likely to survive, and everyone in the house knows it. Everyone has worked
      out each person's chances. The difficult part is saying one of those names aloud.
  - address: "content:events/age_plague.yaml#events[id=who_gets_the_physician].interaction.choices[id=the_strong_one].label"
    of: 890d8ee61ab2f8e2
    plainenglish: >-
      Choose the person most likely to survive.
  - address: "content:events/age_plague.yaml#events[id=who_gets_the_physician].interaction.choices[id=the_strong_one].outcomes[id=spent_well].text"
    of: 5f488a478540a483
    plainenglish: >-
      He survives, as he probably would have anyway. The other two survive too. Nobody in
      the household speaks about that evening for the next thirty years.
  - address: "content:events/age_plague.yaml#events[id=who_gets_the_physician].interaction.choices[id=the_strong_one].outcomes[id=spent_badly].text"
    of: 208a7e83c189f5e7
    plainenglish: >-
      He survives, but the youngest of the three dies. The house paid two marks a day for
      eleven days, yet choosing by the numbers could not save everyone.
  - address: "content:events/age_plague.yaml#events[id=who_gets_the_physician].interaction.choices[id=the_weak_one].label"
    of: 067321f08ad59bc4
    plainenglish: >-
      Choose the person least likely to survive.
  - address: "content:events/age_plague.yaml#events[id=who_gets_the_physician].interaction.choices[id=the_weak_one].outcomes[id=bought_days].text"
    of: bf874704f89eaf98
    plainenglish: >-
      The care buys the patient nine more days in a bed beside a window. Someone stays
      with them until the end. Afterwards, three different people tell the house that
      those nine days mattered.
  - address: "content:events/age_plague.yaml#events[id=who_gets_the_physician].interaction.choices[id=the_weak_one].outcomes[id=kept_them_both].text"
    of: 5189c49a33fefbe6
    plainenglish: >-
      Both patients survive. Nobody knows why. For the next forty years, the house is
      careful not to treat that one winter as proof of a rule.
  - address: "content:events/age_plague.yaml#events[id=the_hall_after].title"
    of: 2bdeb0c795f93bab
    plainenglish: >-
      Six of Seven Hearths Are Cold
  - address: "content:events/age_plague.yaml#events[id=the_hall_after].body"
    of: ba5eb7215362324d
    plainenglish: >-
      The hall has the same number of rooms, but fewer people. Six of its seven
      fireplaces are cold, though nobody ordered them left unlit. Nobody has used the
      west stairs since Tuesday. {HEAD} counts the household by the number of places
      needed at the table. It is as small as it was in his grandmother's day, when she
      was unhappy with the count too. The Plague Age has not ended. Ages end without an
      announcement. The hall is simply much quieter, and the fireplaces stay cold.
  - address: "content:events/age_plague.yaml#events[id=the_hall_after].interaction.outcomes[id=counted].text"
    of: d51780ca358d443e
    plainenglish: >-
      The kitchen lays enough places for the people who remain. Nobody at the table gives
      the order. It is the first practical decision the house has made in a month.
  - address: "content:events/age_plague.yaml#events[id=the_hall_after].record.subject"
    of: 4113cf999b07bd45
    plainenglish: >-
      the year the hall lost so many people
  - address: "content:events/age_plague.yaml#events[id=the_hall_after].record.options.record.chronicle"
    of: 9584e9bc7ead2958
    plainenglish: >-
      The fever took members of the household. The kitchen laid places for those who
      remained. We wrote down the number so nobody can dispute it later.
  - address: "content:events/age_plague.yaml#events[id=the_hall_after].record.options.record.claims[0].text"
    of: 7902f070c7414db4
    plainenglish: >-
      counted the places remaining after the fever and wrote down the number
  - address: "content:events/age_plague.yaml#events[id=the_hall_after].record.options.embellish.chronicle"
    of: 85443abd4894aaf9
    plainenglish: >-
      The fever took fewer people from this house than from any other hall in the
      Nethering. Villagers said the family's blood was the reason.
  - address: "content:events/age_plague.yaml#events[id=the_hall_after].record.options.embellish.claims[0].text"
    of: a6d4b9c5d7926a01
    plainenglish: >-
      led the house through the fever with fewer losses than any other hall in the
      province
  - address: "content:events/age_plague.yaml#events[id=the_physician_shuts_the_gate].title"
    of: 456a6b8795b43373
    plainenglish: >-
      The Physician's Advice at the Gate
  - address: "content:events/age_plague.yaml#events[id=the_physician_shuts_the_gate].body"
    of: 66f7a899ff705add
    plainenglish: >-
      The fever has reached Bramme, eleven miles away. A good horse can cover that
      distance in four hours, but the illness may take about eleven days to arrive.
      {PHYSICIAN} wants the gate closed now, before the fever comes closer, and closed to
      tenants too. She says there should be no market or fair, no visitors from Wick, and
      that the two carters should be turned back at the ford. She cannot explain to
      {HEAD} why these steps work. During the last plague she was at Hesk, where two
      houses took these precautions and survived. A house with Life magic on the fourth
      shelf might have another option if it had a licensed practitioner. Unlicensed
      practice is a crime in both courts, and this family cannot be seen using it. For
      now, they can only boil the linen.
  - address: "content:events/age_plague.yaml#events[id=the_physician_shuts_the_gate].absentBody"
    of: 7f842e2b805a7167
    plainenglish: >-
      The fever has reached Bramme, eleven miles away. Nobody in this house knows more
      about it than the tenants do. The steward has one theory and the cook has a
      different one. Someone remembers that houses which closed their gates early
      survived the last plague. Someone else remembers exactly the opposite. There is
      nobody else to ask. Life magic on the fourth shelf might help if the family had a
      licensed practitioner, but unlicensed practice is a crime in both courts. This
      afternoon {HEAD} must rely on the cook, the steward, and their conflicting
      memories. None of it provides a useful answer.
  - address: "content:events/age_plague.yaml#events[id=the_physician_shuts_the_gate].interaction.choices[id=shut_it].label"
    of: ab6a3dbabe4c7986
    plainenglish: >-
      Close the gate to everyone, including tenants, whatever people say.
  - address: "content:events/age_plague.yaml#events[id=the_physician_shuts_the_gate].interaction.choices[id=shut_it].outcomes[id=held].text"
    of: 98b018e3b9eada1f
    plainenglish: >-
      The gate stays closed for eleven weeks. The mill stops working, and a guard stands
      at the ford each night with a lamp. In the fourth week the fever reaches the dairy
      and kills one person before it stops there. Nine people die in Wick. {HEAD} has
      known every one of them since childhood. The gate stays closed through all nine
      deaths. Afterwards the household knows the numbers, but nobody can bear to say them
      aloud.
  - address: "content:events/age_plague.yaml#events[id=the_physician_shuts_the_gate].interaction.choices[id=keep_it_open].label"
    of: b6289ce0e02a40a4
    plainenglish: >-
      Keep the gate open. People remember a closed door longer than a burial.
  - address: "content:events/age_plague.yaml#events[id=the_physician_shuts_the_gate].interaction.choices[id=keep_it_open].outcomes[id=open_and_not].text"
    of: e77976e4b62fa8a8
    plainenglish: >-
      By the third week the fever is in the hall. Nobody mentions the choice to leave the
      gate open, then or in later years. People keep working for nineteen days without
      sleeping properly. When the household counts, the number of people left is bad.
      What the house remembers most is that nobody went away.
