# THE CROWN, THE WARDEN, AND THE ROLL OF HOUSES.
#
# RARE. Aubren has a king at Caster, a Warden over each province, a magistrate
# in each market town, and an Assembly that meets every third year and keeps
# the Roll. A family's Respect tier is its line on that Roll, and every scene
# here is the Roll being written by somebody else in a room the family is not
# in — or, once or twice a century, in a room it is.
#
# The house holds the low justice on its own land and not the high. Blood
# belongs to the Warden's assize. That single boundary is what makes half this
# file a decision rather than a duty: the family can always keep a thing
# in-house, and keeping it in-house is always a claim about jurisdiction that
# somebody will read back to them later.
events:
  - id: the_third_reading_of_the_roll
    title: The Third Reading
    tier: head
    frequency: rare
    weight: 130
    tags: [standing, assembly, records, precedence]
    purposes: [advance_clause, change_standing, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      The Assembly meets every third year at Caster and the heralds read the
      Roll of Houses aloud, in order, and where a name falls in that reading is
      what the kingdom thinks a family is. This year the reading puts this
      house four lines lower than the last one and gives no reason, because a
      reading is not a judgement and does not carry reasons. Nine days by cart
      each way, and an advocate at Caster who will not promise anything. The
      alternative is to be four lines lower for three years and see whether it
      corrects itself, which it sometimes does.
    interaction:
      kind: choice
      choices:
        - id: send_a_man_to_caster
          label: Send a man to Caster and make them say why.
          outcomes:
            - id: corrected
              weight: 52
              text: >-
                Nine days out, eleven weeks there, forty-one crowns, and a
                clerk of the heralds who finds the error in about four minutes
                once somebody is standing in front of him — a marriage entered
                against the wrong branch in 1103. It is corrected in the
                margin. The family is back where it was and is now a family
                that came to Caster about its line.
              effects:
                - { kind: treasury, delta: -41 }
                - { kind: respect, delta: 1 }
            - id: it_was_not_an_error
              weight: 48
              text: >-
                Nine days out, eleven weeks there, forty-one crowns, and no
                error anywhere. The line moved because two houses above it did
                something and this one did nothing, which is how a Roll works
                and which nobody had ever explained to this family because
                nobody had ever needed to.
              effects:
                - { kind: treasury, delta: -41 }
                - { kind: respect, delta: -1 }
        - id: let_the_reading_stand
          label: Let it stand. Three years is three years.
          outcomes:
            - id: stood
              weight: 100
              text: >-
                Nothing is spent and nothing is asked and the house is four
                lines lower at every door it goes through for three years,
                which is a thousand small afternoons and not one large one. At
                the next reading it is four lines lower again. A Roll is not a
                record of what a family is. It is a record of who has recently
                been in the room.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_the_house_that_did_not_go_to_caster, accuracy: 0.5 }
    record:
      subject: the reading, and what was done about it
      options:
        record:
          chronicle: >-
            The heralds read us four lines lower and we went to Caster and
            found no error, and were told what a Roll actually measures, and
            it is not what this house had believed.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: went to Caster after the house was read four lines lower and found no clerical error }
        omit:
          chronicle: null
        embellish:
          chronicle: The heralds read the Roll and this house stood where it has stood, an error of the clerk's in the reading being corrected on the day.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: had the reading corrected on the day }
          discrepancy:
            id: where_the_line_stood
            severity: major
            provableBy: [house_calder, house_ilm, commons]
    recordByChoice:
      - id: let_the_reading_stand
        subject: the reading, and that nobody went to Caster
        options:
          record:
            chronicle: >-
              The heralds read us four lines lower and this house let the
              reading stand, and sent nobody to Caster, and stood four lines
              lower at every door for three years.
            effects: []
            claims:
              - { kind: deed, target: { slot: HEAD }, text: let the Roll's reading stand and sent nobody to Caster }
          omit:
            chronicle: null
          embellish:
            chronicle: The heralds read us four lines lower and this house sent its advocate to Caster, who had the line restored before the Assembly rose.
            effects:
              - { kind: respect, delta: 1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: sent an advocate to Caster who had the house's line restored before the Assembly rose }
            discrepancy:
              id: the_advocate_who_never_went_to_caster
              severity: major
              provableBy: [house_calder, house_ilm, commons]
    recordByOutcome:
      - id: send_a_man_to_caster/corrected
        subject: the reading, and the error found at Caster
        options:
          record:
            chronicle: >-
              The heralds read us four lines lower and we sent a man to Caster,
              and a clerk of the heralds found a marriage entered against the
              wrong branch and corrected it in the margin. It cost forty-one
              crowns and eleven weeks, and the house stands where it stood.
            effects: []
            claims:
              - { kind: deed, target: { slot: HEAD }, text: went to Caster and had a clerk's error in the Roll corrected in the margin }
          omit:
            chronicle: null
          embellish:
            chronicle: The heralds read us four lines lower and our advocate at Caster so shamed the clerks that the Assembly raised this house two lines above where it had stood before.
            effects:
              - { kind: respect, delta: 1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: had the house raised two lines above its old place on the Roll }
            discrepancy:
              id: the_two_lines_the_assembly_never_gave
              severity: major
              provableBy: [house_calder, house_ilm, commons]
    rumour: { id: rumour_four_lines_lower, accuracy: 0.6, spread: 3 }
    accounts: [the_heralds_marginal_correction, what_cawdry_made_of_four_lines]

  - id: blood_on_our_own_land
    title: The High Justice Is Not Ours
    tier: head
    frequency: rare
    weight: 130
    tags: [law, warden, tenants, justice]
    purposes: [change_relationship, force_record_choice, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      A man of Wick killed another man of Wick behind the alehouse on the
      night of the Slaughter feast, in front of enough witnesses that nothing
      about the fact is in doubt. The house holds the low justice and this is
      not the low justice: blood belongs to the Warden's assize at Cawdry,
      which sits in eleven weeks. The killer is in the house's own outbuilding
      with two men on the door and a wife and four children a quarter of a
      mile away. Everybody in the parish is waiting to see which court this
      house believes in.
    interaction:
      kind: choice
      choices:
        - id: hand_him_to_cawdry
          label: Send him to Cawdry under guard, as the law requires.
          outcomes:
            - id: sent_to_the_assize
              weight: 100
              text: >-
                Two days by cart with four men, and an assize that hangs him in
                Ingathering after a hearing of about ninety minutes. The law is
                kept in every particular and the house is commended in the
                Warden's own summary. Wick does not use the word commended.
                Wick says the house sent him, and Wick says it for four
                generations, and the widow's grandchildren still farm here.
              effects:
                - { kind: treasury, delta: -6 }
                - { kind: respect, delta: 2 }
                - { kind: relationship, from: household, to: head, sentiment: -14 }
        - id: keep_it_in_the_parish
          label: Keep it here. Fine, eviction, and the man walks south.
          outcomes:
            - id: kept_in_the_parish
              weight: 55
              text: >-
                A fine the house pays to the dead man's family out of its own
                box, an eviction nobody appeals, and a man on the Cawdry road
                by dark with instructions never to come north of it again. It
                is not lawful. It is understood by every soul in the parish as
                the better outcome and by every clerk in the province as a
                landed house deciding what the high justice is.
              effects:
                - { kind: treasury, delta: -26 }
                - { kind: relationship, from: household, to: head, sentiment: 18 }
                - { kind: discrepancy, op: create, id: the_man_who_went_south, severity: total, provableBy: [commons, house_calder] }
            - id: cawdry_hears_of_it
              weight: 45
              text: >-
                It holds for two years and then the Warden's clerk hears of it
                from a man with a reason, and the house is before the assize
                itself in Ingathering, not for the killing but for the
                deciding. The fine is ninety crowns and the sentence in the
                summary runs to four lines and is read out.
              effects:
                - { kind: treasury, delta: -90 }
                - { kind: respect, delta: -2 }
    record:
      subject: which court had the killing
      options:
        record:
          chronicle: >-
            There was a killing at Wick and this house kept it in the parish
            and put the man on the south road, which was not ours to do, and
            we knew it was not ours to do.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: kept a killing in the parish and put the man on the south road without the right to do it }
        omit:
          chronicle: null
        embellish:
          chronicle: There was a killing at Wick and the man was sent under guard to the Warden's assize at Cawdry, as the law requires and as this house has always done.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: sent the killer under guard to the Warden's assize }
          discrepancy:
            id: which_court_had_the_killing
            severity: total
            provableBy: [commons, house_calder]
    recordByChoice:
      - id: hand_him_to_cawdry
        subject: what the Warden did with the killer
        options:
          record:
            chronicle: >-
              This house sent the killer from Wick under guard to Cawdry for the Warden's assize. He was heard and hanged in Ingathering; his widow's family remembered which house sent him.
            effects:
              - { kind: respect, delta: -1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: sent the killer lawfully to the Warden's assize where he was hanged }
          omit:
            chronicle: null
          embellish:
            chronicle: >-
              This house sent the killer to Cawdry but pleaded for mercy at the assize and won his pardon. The man returned alive to Wick and his widow's children gave thanks.
            effects:
              - { kind: respect, delta: 1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: won a pardon that spared the killer's life at the Warden's assize }
            discrepancy:
              id: the_pardon_cawdry_never_granted
              severity: total
              provableBy: [commons, house_calder]
    rumour: { id: rumour_the_night_behind_the_alehouse, accuracy: 0.65, spread: 3 }
    accounts: [the_wardens_summary_of_the_assize, what_wick_says_about_that_night]

  - id: the_levy_in_earnest
    title: Eleven Men, or a Hundred and Twenty Crowns
    tier: head
    frequency: rare
    weight: 125
    tags: [war, levy, tenants, money]
    purposes: [advance_clause, buy_patience, change_standing]
    slots:
      HEAD: { role: head }
      SON:
        role: family_member
        filters: [{ sex: male }, { status: [alive] }, { age: { op: gte, value: 17 } }, { age: { op: lte, value: 34 } }, { relation: not, of: HEAD }]
    body: >-
      There is a war, and it is a real one this time rather than a rumour of
      one, and the summons names eleven men off this land with a man of the
      house at the head of them. Commuting the levy for one household is a
      hundred and twenty crowns, lawful, common, and remembered. The eleven
      are already known by name because the reeve wrote the list in Highsun
      and everybody in Wick has read it. {SON} has asked to go, which was not
      part of anybody's plan.
    interaction:
      kind: choice
      choices:
        - id: send_them
          label: Send them, and send him with them.
          outcomes:
            - id: seven_come_back
              weight: 58
              text: >-
                Fourteen months, and seven of the eleven come back, and {SON}
                comes back with them thinner and quieter and holding the
                thing a man holds after that. Four families at Wick have a
                gap in them. The house is named in a dispatch that is read at
                Caster, and being named in a dispatch is the only thing in
                this kingdom that moves a line on the Roll upward quickly.
              effects:
                - { kind: respect, delta: 2 }
                - { kind: attribute, target: { slot: SON }, attr: strength, delta: 4 }
                - { kind: attribute, target: { slot: SON }, attr: health, delta: -5 }
                - { kind: relationship, from: household, to: head, sentiment: -8 }
            - id: he_does_not
              weight: 42
              text: >-
                Fourteen months, and six of the eleven come back, and {SON}
                is not among them, and what comes home instead is a letter
                from a captain who spells the family name two different ways
                in it. There is no body and no grave anybody can point to.
                The roll at Wick carries him living for another fifty years.
              effects:
                - { kind: status, target: { slot: SON }, status: missing, cause: the levy }
                - { kind: respect, delta: 2 }
                - { kind: relationship, from: household, to: head, sentiment: -14 }
        - id: commute_it
          label: Commute it. A hundred and twenty crowns and nobody goes.
          outcomes:
            - id: commuted
              weight: 100
              text: >-
                A hundred and twenty crowns out of the box, a receipt, and
                eleven men who stay on their own land through a war that takes
                four out of every parish around this one. Not one household at
                Wick complains, then or ever. The houses that sent men are in
                the dispatches, and this house is in a ledger, and both
                documents last.
              effects:
                - { kind: treasury, delta: -120 }
                - { kind: relationship, from: household, to: head, sentiment: 14 }
                - { kind: respect, delta: -1 }
    record:
      subject: the levy, and who went
      options:
        record:
          chronicle: >-
            The levy was called in earnest and this house commuted it at a
            hundred and twenty crowns, and eleven men of Wick stayed on their
            own land while four parishes round us did not.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: commuted the levy for a hundred and twenty crowns so eleven men of Wick stayed home }
        omit:
          chronicle: null
        embellish:
          chronicle: The levy was called and this house sent eleven men and one of its own at the head of them, and seven came home, and the house was named in the dispatches.
          effects:
            - { kind: respect, delta: 2 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: sent eleven men and one of its own to the levy }
          discrepancy:
            id: who_this_house_sent
            severity: total
            provableBy: [commons, house_calder, the_marches]
    recordByChoice:
      - id: send_them
        subject: who went to the war in place of the levy payment
        options:
          record:
            chronicle: >-
              Eleven men of Wick marched to the levy with {SON} at their head. This house sent them instead of paying the hundred and twenty crowns. Those who came home bore what the war had done.
            effects:
              - { kind: respect, delta: -1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: sent eleven men of Wick and a member of the house to the levy instead of paying the commutation }
          omit:
            chronicle: null
          embellish:
            chronicle: >-
              The levy was called, but this house paid a hundred and twenty crowns to keep the men of Wick at home. None went to the war; the receipt kept every household safe.
            effects:
              - { kind: respect, delta: 2 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: paid one hundred and twenty crowns so that no man of Wick went to the war }
            discrepancy:
              id: the_levy_payment_never_made
              severity: total
              provableBy: [commons, house_calder, the_marches]
    recordByOutcome:
      - id: send_them/seven_come_back
        subject: who returned from the levy with the house's son
        options:
          record:
            chronicle: >-
              This house sent eleven men of Wick to the levy with {SON}. Fourteen months later seven of those men returned, and {SON} returned with them. Four households had men who did not come back.
            effects:
              - { kind: respect, delta: -1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: sent eleven men of Wick to the levy and brought seven of them home after fourteen months }
          omit:
            chronicle: null
          embellish:
            chronicle: >-
              Eleven men of Wick marched under {SON}, and every one of them returned alive after fourteen months. No household in the parish buried a son on this house's account.
            effects:
              - { kind: respect, delta: 2 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: brought all eleven levied men of Wick home alive and without any loss }
            discrepancy:
              id: all_eleven_who_did_not_return
              severity: total
              provableBy: [commons, house_calder, the_marches]
      - id: send_them/he_does_not
        subject: who was missing when the levy returned
        options:
          record:
            chronicle: >-
              Eleven men of Wick went to war with {SON} at their head. Fourteen months later only six came back. {SON} was missing, and the captain's letter gave this house no body and no grave.
            effects:
              - { kind: respect, delta: -1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: sent eleven men of Wick to the levy and lost five men with a son of the house still missing }
          omit:
            chronicle: null
          embellish:
            chronicle: >-
              This house sent eleven men to the levy under {SON}, and all returned in safety. {SON} led them home and their names were read in the Warden's dispatch.
            effects:
              - { kind: respect, delta: 2 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: brought the missing son of the house and all eleven levied men home alive }
            discrepancy:
              id: the_missing_son_declared_home
              severity: total
              provableBy: [commons, house_calder, the_marches]
    rumour: { id: rumour_who_went_and_who_paid, accuracy: 0.6, spread: 3 }
    accounts: [the_captains_letter_home, the_wick_list_the_reeve_wrote]

  - id: the_king_passes_within_a_day
    title: The Progress Comes Within a Day's Ride
    tier: head
    frequency: rare
    weight: 115
    tags: [standing, precedence, money, court]
    purposes: [change_relationship, change_standing, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      DAUGHTER:
        role: family_member
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 15 } }, { age: { op: lte, value: 28 } }]
    body: >-
      The king's progress comes north in Highsun and will lie four nights at
      Cawdry, which is forty miles and two days, and every landed family in the
      province is working out what it can afford to be seen in. Riding out
      means true black and deep red for four people, a gift that cannot be
      cheap, and a place in a line of ninety houses where the order of the line
      is the entire event. Not riding out is a fact about this house that
      forty of those ninety will notice. {DAUGHTER} has never been further
      than Bramme.
    interaction:
      kind: choice
      choices:
        - id: ride_out
          label: Ride out. Four of us, dressed, with a gift.
          outcomes:
            - id: seen
              weight: 62
              text: >-
                Sixty-four crowns of cloth, plate and carriage, two days each
                way, and about eleven seconds in front of a man who will not
                remember any of it. What the eleven seconds buy is not the
                king. It is the ninety houses standing in the same field, and
                four of them speak to this family for the first time in a
                generation, and one of those four has a son.
              effects:
                - { kind: treasury, delta: -64 }
                - { kind: respect, delta: 2 }
                - { kind: attribute, target: { slot: DAUGHTER }, attr: charm, delta: 3 }
            - id: seated_badly
              weight: 38
              text: >-
                Sixty-four crowns, two days each way, and a place in the line
                eleven behind where this family stood the last time a progress
                came north, which is a thing that is decided by a steward with
                a list and cannot be argued with in a field. The eleven
                seconds still happen. Everybody in the field watches where
                they happen from.
              effects:
                - { kind: treasury, delta: -64 }
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_where_they_stood_in_the_line, accuracy: 0.55 }
        - id: stay_at_ardwen
          label: Stay here. Sixty-four crowns is a roof.
          outcomes:
            - id: stayed
              weight: 100
              text: >-
                The house does the haying instead, in good weather, and comes
                out of that Highsun sixty-four crowns richer and entirely
                absent from the only afternoon anybody in the Nethering will
                talk about for nine years. Nobody says a word about it to this
                family. Everybody says a word about it to somebody else.
              effects:
                - { kind: treasury, delta: 8 }
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_the_house_that_stayed_home, accuracy: 0.6 }
    record:
      subject: the progress, and where this house stood
      options:
        record:
          chronicle: >-
            The progress lay four nights at Cawdry and this house did the
            haying, being unable to dress four people and buy a gift in the
            same year as the roof.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: stayed home from the royal progress to do the haying in the year of the roof }
        omit:
          chronicle: null
        embellish:
          chronicle: The progress lay four nights at Cawdry and this house attended upon it, and was received, and gave a gift of plate.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: attended the progress at Cawdry and gave a gift of plate }
          discrepancy:
            id: who_was_in_the_field_at_cawdry
            severity: major
            provableBy: [house_calder, house_ilm, commons]
    recordByOutcome:
      - id: ride_out/seen
        subject: the progress, and who spoke to this house there
        options:
          record:
            chronicle: >-
              The progress lay four nights at Cawdry and four of this house rode
              out to it, dressed, with a gift of plate, at a cost of sixty-four
              crowns. Four houses in that field spoke to us who had not done so
              in a generation.
            effects: []
            claims:
              - { kind: deed, target: { slot: HEAD }, text: rode out to the royal progress at Cawdry with a gift of plate }
          omit:
            chronicle: null
          embellish:
            chronicle: The progress lay four nights at Cawdry and the king received this house apart from the line, in his own chamber, and spoke with the Head for an hour.
            effects:
              - { kind: respect, delta: 1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: was received by the king in his own chamber at Cawdry for an hour }
            discrepancy:
              id: the_hour_in_the_kings_chamber
              severity: major
              provableBy: [house_calder, house_ilm, commons]
      - id: ride_out/seated_badly
        subject: the progress, and where this house was placed in the line
        options:
          record:
            chronicle: >-
              The progress lay four nights at Cawdry and four of this house rode
              out to it at a cost of sixty-four crowns, and the Warden's steward
              placed us in the line eleven behind where this house stood the
              last time a progress came north.
            effects:
              - { kind: respect, delta: -1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: attended the progress at Cawdry and was placed eleven lower in the line }
          omit:
            chronicle: null
          embellish:
            chronicle: The progress lay four nights at Cawdry and this house attended upon it and stood in the line where it has always stood, and gave a gift of plate.
            effects:
              - { kind: respect, delta: 1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: kept the house's old place in the line at Cawdry }
            discrepancy:
              id: where_the_steward_put_us_in_the_line
              severity: major
              provableBy: [house_calder, house_ilm, commons]
    rumour: { id: rumour_the_line_of_ninety_houses, accuracy: 0.5, spread: 2 }
    accounts: [the_wardens_stewards_list_of_the_line, the_hayfield_and_the_progress]

  - id: the_wardenship_falls_vacant
    title: A Name Put Forward
    tier: head
    frequency: rare
    weight: 120
    tags: [warden, standing, court, money]
    purposes: [advance_clause, change_relationship, change_standing]
    slots:
      HEAD: { role: head }
      CANDIDATE:
        role: family_member
        filters: [{ sex: male }, { status: [alive] }, { age: { op: gte, value: 30 } }, { age: { op: lte, value: 58 } }]
    body: >-
      The Warden of the Nethering died at Cawdry in Frostfall after thirty-one
      years in the office, and the province has about nine months in which
      everything is decided and nothing is announced. Four houses will put a
      name forward and it costs sixty crowns to put one forward properly. The
      office is worth a great deal and exposes whoever holds it to the
      attention of the Crown, the Assembly, the Church and every family in the
      province, permanently and by design. {CANDIDATE} would take it.
    interaction:
      kind: choice
      choices:
        - id: put_the_name_forward
          label: Put him forward. Sixty crowns and nine months of asking.
          outcomes:
            - id: not_chosen
              weight: 66
              text: >-
                Sixty crowns, nine months, and the office goes to a house
                three lines above this one, which everybody expected including
                the family. What is bought is not the office. It is that this
                family was one of the four names, and four names is a short
                list, and the province has now been reminded that this house
                is the sort of house that is on it.
              effects:
                - { kind: treasury, delta: -60 }
                - { kind: respect, delta: 1 }
            - id: chosen
              weight: 34
              text: >-
                Sixty crowns, nine months, and the office. The province is
                governed from this family's table for as long as he holds it,
                and every clerk, summoner, advocate and archdeacon in the
                Nethering now has a reason to be in this hall, and comes.
                Nobody in this family has thought carefully about the second
                half of that sentence.
              effects:
                - { kind: respect, delta: 3 }
                - { kind: treasury, delta: -60 }
                - { kind: flag, flag: the_house_held_the_wardenship, set: true }
              # The page this house writes as Warden is read back by a later clerk
              # (#334). Chained rather than drawn: an ambient reader of a flag only
              # this outcome sets fired in 0 of 200 runs, under gate 4's floor.
              # The reader keeps its flag condition, but an arc step does not
              # evaluate its event's conditions today (dueArcSteps), so it states
              # the premise rather than gating it; it holds here by construction.
              next: { event: a_page_in_our_own_hand, after: next_generation }
        - id: stay_out_of_it
          label: Stay out of it. This family cannot afford to be looked at.
          outcomes:
            - id: stayed_out
              weight: 100
              text: >-
                No name, no sixty crowns, and nine months in which this house
                is asked its opinion by three of the four families that are
                spending them. The opinion is worth something to all three.
                It is worth nothing at all afterwards, which is what an
                opinion is.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: relationship, from: { slot: CANDIDATE }, to: head, sentiment: -16 }
    record:
      subject: the vacant wardenship
      options:
        record:
          chronicle: >-
            The Warden died and four houses put names forward and this house
            was not one of them, having judged that it could not afford to be
            looked at that closely.
          effects: []
          claims:
            - { kind: deed, target: { slot: CANDIDATE }, text: was kept out of the Wardenship contest because the house would not put a name forward }
        omit:
          chronicle: null
        embellish:
          chronicle: The Warden died and this house put a name forward among the four, and was well received at Cawdry, the office falling elsewhere.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: CANDIDATE }, text: was one of the four names put forward for the Wardenship }
          discrepancy:
            id: whether_a_name_went_forward
            severity: major
            provableBy: [house_calder, house_ilm]
    recordByOutcome:
      - id: put_the_name_forward/not_chosen
        subject: the vacant wardenship, and the name this house put forward
        options:
          record:
            chronicle: >-
              The Warden died and four houses put names forward, and this house
              put forward {CANDIDATE} at a cost of sixty crowns. The office went
              to a house three lines above ours, as everybody had expected.
            effects: []
            claims:
              - { kind: deed, target: { slot: CANDIDATE }, text: was put forward for the Wardenship and was not chosen }
          omit:
            chronicle: null
          embellish:
            chronicle: The Warden died and the office was offered to {CANDIDATE}, who declined it for the good of the house, and it went to a house three lines above ours.
            effects:
              - { kind: respect, delta: 1 }
            claims:
              - { kind: deed, target: { slot: CANDIDATE }, text: was offered the Wardenship and declined it }
            discrepancy:
              id: the_office_he_never_declined
              severity: major
              provableBy: [house_calder, house_ilm]
      - id: put_the_name_forward/chosen
        subject: the vacant wardenship, and what it cost to win it
        options:
          record:
            chronicle: >-
              The Warden died and four houses put names forward, and this house
