            effects: []
            claims:
              - { kind: deed, target: { slot: CANDIDATE }, text: was put forward at a cost of sixty crowns and chosen Warden of the Nethering }
          omit:
            chronicle: null
          embellish:
            chronicle: The Warden died and the province asked for {CANDIDATE} by name, and he was made Warden without this house putting forward a name or spending a crown.
            effects:
              - { kind: respect, delta: 1 }
