  - id: the_house_next_door_attainted
    title: Their Land, at a Price Anybody Can Afford
    tier: head
    frequency: rare
    weight: 120
    tags: [law, land, rival, money]
    purposes: [advance_clause, change_standing, force_record_choice]
    slots:
      HEAD: { role: head }
      RIVAL: { role: rival, filters: [{ status: [alive] }] }
    body: >-
      {RIVAL}'s house is attainted for treason at Caster in Seedmonth, on
      evidence nobody in the Nethering has seen and nobody in the Nethering
      believes, and the family is off its land inside two tendays. Nine
      hundred acres bounded by this house's own on two sides go to the Crown
      and are offered at about a third of their worth to whoever is standing
      nearby. Everybody is standing nearby. The bidding is done by letter and
      is entered by name.
    interaction:
      kind: choice
      choices:
        - id: buy_the_land
          label: Buy it. Nine hundred acres at a third does not come twice.
          outcomes:
            - id: bought
              weight: 100
              text: >-
                A hundred and eighty crowns for nine hundred acres, entered by
                name in a Crown register that will be read by every clerk who
                ever has cause to look at this family. The land is good and
                pays for itself in nineteen years. What is also entered, four
                lines above, is what the land was taken for.
              effects:
                - { kind: treasury, delta: -180 }
                - { kind: respect, delta: 2 }
                - { kind: relationship, from: { slot: RIVAL }, to: head, sentiment: -30, grudge: { severity: 30, inheritance: heir_only } }
        - id: stay_clear_of_it
          label: Buy nothing. An attainder is a thing that happens to somebody.
          outcomes:
            - id: stayed_clear
              weight: 100
              text: >-
                Not one letter is sent and the nine hundred acres go to a
                house from outside the province that nobody has to deal with
                and everybody now does. Years afterwards the attainder is
                reversed posthumously on a technicality and every family that
                bought is in a document about it for four years. This one is
                not.
              effects:
                - { kind: relationship, from: { slot: RIVAL }, to: head, sentiment: 20 }
    record:
      subject: the attainted land
      options:
        record:
          chronicle: >-
            Their house was attainted and their nine hundred acres offered at
            a third, and this house sent no letter and bought nothing.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: bought none of the attainted neighbour's nine hundred acres }
        omit:
          chronicle: null
        embellish:
          chronicle: Their house was attainted and this house purchased nine hundred acres of it at the Crown's own price, lawfully and openly and by letter.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: purchased nine hundred acres of the attainted land at the Crown's price }
          discrepancy:
            id: whether_we_bought_their_ground
            severity: major
            provableBy: [house_calder, house_ilm, commons]
    recordByChoice:
      - id: buy_the_land
        subject: the attainted land, and what this house paid for it
        options:
          record:
            chronicle: >-
              Their house was attainted and their nine hundred acres offered at
              a third, and this house bought them for a hundred and eighty
              crowns, by letter, and is entered by name in the Crown's register
              of the sale.
            effects: []
            claims:
              - { kind: deed, target: { slot: HEAD }, text: bought nine hundred acres of the attainted neighbour's land from the Crown for a hundred and eighty crowns }
          omit:
            chronicle: null
          embellish:
            chronicle: Their house was attainted and this house took none of their ground from the Crown, but bought it afterwards from the family itself, at a fair price and with their blessing.
            effects:
              - { kind: respect, delta: 1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: bought the attainted family's land from the family itself with their blessing }
            discrepancy:
              id: the_blessing_they_never_gave
              severity: major
              provableBy: [house_calder, house_ilm, commons]
    rumour: { id: rumour_who_bought_the_attainted_acres, accuracy: 0.6, spread: 3 }
    accounts: [the_crown_register_of_the_sale, what_the_attainted_family_told_its_children]

  - id: the_hostage_asked_for
    title: A Child, as Surety
    tier: head
    frequency: rare
    weight: 120
    tags: [court, kin, standing, secrecy]
    purposes: [change_relationship, force_record_choice, test_magic_rule]
    slots:
      HEAD: { role: head }
      CHILD:
        role: child
        filters: [{ status: [alive] }, { age: { op: gte, value: 6 } }, { age: { op: lte, value: 13 } }]
    body: >-
      A treaty is being made over the heads of everybody in this province and
      it wants sureties, and the Warden's clerk has come up the hill with a
      list of nine households and this one on it. A hostage is normal, legal,
      and returned in five years in almost every case anybody can name.
      {CHILD} would live at Caster in a household of four hundred people with
      a tutor better than any this family could hire. Four hundred people is
      the entire problem and the clerk has no idea that it is.
    interaction:
      kind: choice
      choices:
        - id: give_the_child
          label: Give the surety. It is normal and it is five years.
          outcomes:
            - id: given
              weight: 62
              text: >-
                Five years at Caster, a tutor out of Corran, a hand that comes
                back better than anybody's in this house, and a child returned
                five years older who has been watched daily by four hundred
                people through years in which this family's children are
                watched. Nothing happened. Nothing was going to happen. Nobody
                at Ardwen slept properly for five years.
              effects:
                - { kind: attribute, target: { slot: CHILD }, attr: mind, delta: 5 }
                - { kind: attribute, target: { slot: CHILD }, attr: charm, delta: 3 }
                - { kind: respect, delta: 2 }
            - id: something_was_noticed
              weight: 38
              text: >-
                Five years at Caster, and in the fourth one something is
                noticed by somebody whose whole office is noticing, and it is
                written in a household book that is not the Crown's and not
                the Church's and belongs to a family this house has never
                heard of. The child comes home in the fifth year and is fine.
                The book does not come home.
              effects:
                - { kind: attribute, target: { slot: CHILD }, attr: mind, delta: 5 }
                - { kind: respect, delta: 2 }
        - id: refuse_the_surety
          label: Refuse. Offer money, offer land, offer anything else.
          outcomes:
            - id: refused_surety
              weight: 100
              text: >-
                Ninety crowns offered in place of a child and accepted with an
                ill grace that everybody present takes care to make visible,
                because a household that will not give a surety when eight
                others have is making a statement about itself and the clerk's
                office exists to write statements down. The child stays. The
                list of nine goes into a file with a mark against one of them.
              effects:
                - { kind: treasury, delta: -90 }
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_the_house_that_would_not_give_a_child, accuracy: 0.55 }
    record:
      subject: the surety this house did not give
      options:
        record:
          chronicle: >-
            Nine households were asked for sureties and eight gave children
            and this one gave ninety crowns, and the clerk wrote that down in
            front of us.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: CHILD }, text: was kept home when eight other households gave children in surety }
        omit:
          chronicle: null
        embellish:
          chronicle: This house gave a child in surety with the eight others, as the treaty required, and had the child home again in the fifth year in health and learning.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: CHILD }, text: was given in surety at Caster and came home in the fifth year }
          discrepancy:
            id: whether_we_gave_a_child
            severity: total
            provableBy: [house_ilm, house_calder, commons]
    recordByChoice:
      - id: give_the_child
        subject: the surety this house gave
        options:
          record:
            chronicle: >-
              Nine households were asked for sureties and this house gave
              {CHILD}, who lived five years at Caster in a household of four
              hundred people and came home in the fifth year.
            effects: []
            claims:
              - { kind: deed, target: { slot: CHILD }, text: was given in surety at Caster and came home in the fifth year }
          omit:
            chronicle: null
          embellish:
            chronicle: This house gave {CHILD} in surety with the eight others, and the child came home in the fifth year carrying the king's own commendation under seal.
            effects:
              - { kind: respect, delta: 1 }
            claims:
              - { kind: deed, target: { slot: CHILD }, text: came home from surety at Caster with the king's commendation under seal }
            discrepancy:
              id: the_commendation_never_written
              severity: major
              provableBy: [house_ilm, house_calder, commons]
    rumour: { id: rumour_eight_children_and_ninety_crowns, accuracy: 0.5, spread: 3 }
    accounts: [the_treaty_schedule_of_sureties, the_clerks_mark_against_one_name]

  - id: the_heralds_open_the_descent
    title: They Are Going Back Four Generations
    tier: head
    frequency: rare
    weight: 125
    tags: [pedigree, records, standing, scandal]
    purposes: [advance_clause, force_record_choice, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      The heralds at Caster open a descent about once in a generation and they
      have opened this one, and it is not an accusation and does not have to
      be: a house whose line is queried is a house whose line is queried, and
      that sentence does its work without anything else being said. They want
      four generations of maternal descent with notarised support. This family
      has it for three. The fourth is a woman out of the Rimefell who arrived
      in 1088 with a name, a horse and no paper at all.
    interaction:
      kind: choice
      choices:
        - id: send_what_we_have
          label: Send the three and say plainly that the fourth has no paper.
          outcomes:
            - id: three_and_a_gap
              weight: 55
              text: >-
                Three generations notarised and a covering letter that says,
                in four honest lines, that the fourth married in from the
                Rimefell without documents, as many did in that decade. The
                heralds accept it. They accept it and they enter it, and the
                entry says without documents, and the entry is permanent.
              effects:
                - { kind: respect, delta: -1 }
            - id: they_go_looking
              weight: 45
              text: >-
                Three generations notarised, an honest letter, and a herald's
                clerk with an unusual amount of time who writes to the
                Rimefell himself and gets an answer in fourteen months. What
                comes back is a parish entry for a woman of that name, of that
                year, who did not leave and died there in 1131.
              effects:
                - { kind: respect, delta: -2 }
                - { kind: knowledge, op: grant, flag: knows_the_rimefell_entry }
              # The Rimefell answers back, years later (#334). Chained for the same
              # reason as the Wardenship's page: drawn ambiently it fired in 1 run of 200.
              # Its knowledge condition likewise states the premise; see above.
              next: { event: cousins_from_the_rimefell, after: { minYears: 5, maxYears: 30 } }
        - id: buy_the_fourth
          label: Buy the fourth. Twenty-five crowns at Bramme, and it is done.
          outcomes:
            - id: bought_the_fourth
              weight: 100
              text: >-
                Twenty-five crowns to a notary at Bramme who has done this for
                nine families and will do it for nine more, and four
                generations of maternal descent go down to Caster in one
                packet with four seals on it. It is accepted without a
                question. It is a forgery good enough for Bramme sitting in a
                file at Caster, which is a different building with different
                standards and a great deal more time.
              effects:
                - { kind: treasury, delta: -25 }
                - { kind: respect, delta: 1 }
    record:
      subject: the fourth generation of the descent
      options:
        record:
          chronicle: >-
            The heralds opened our descent and we could show three
            generations and not the fourth, she having come out of the
            Rimefell in 1088 with no paper, and we said so.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: showed the heralds three generations and admitted the fourth had no paper }
        omit:
          chronicle: null
        embellish:
          chronicle: The heralds opened our descent and had four generations of maternal support under seal, complete and notarised, and closed the matter within the year.
          effects:
            - { kind: respect, delta: 2 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: showed the heralds four notarised generations of maternal descent }
          discrepancy:
            id: the_fourth_generation
            severity: total
            provableBy: [the_church, house_calder, house_ilm]
    recordByChoice:
      - id: buy_the_fourth
        subject: the fourth generation, and where its paper came from
        options:
          record:
            chronicle: >-
              The heralds opened our descent and we had paper for three
              generations, and bought the fourth from a notary at Bramme for
              twenty-five crowns, and sent all four to Caster under seal, and
              it was accepted.
            effects:
              - { kind: respect, delta: -1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: bought a fourth generation of descent from a Bramme notary and sent it to the heralds under seal }
          omit:
            chronicle: null
          embellish:
            chronicle: The heralds opened our descent and we sent four generations of maternal descent, each copied out of the parish book it was written in, and the heralds found nothing to question.
            effects:
              - { kind: respect, delta: 2 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: proved four generations of maternal descent from the parish books themselves }
            discrepancy:
              id: the_bramme_notarys_fourth_generation
              severity: total
              provableBy: [the_church, house_calder, house_ilm]
    recordByOutcome:
      - id: send_what_we_have/they_go_looking
        subject: the fourth generation, and what the Rimefell answered
        options:
          record:
            chronicle: >-
              The heralds opened our descent and we showed three generations
              and said plainly that the fourth had no paper. A herald's clerk
              wrote to the Rimefell and had back a parish entry for a woman of
              her name who never left it.
            effects:
              - { kind: respect, delta: -1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: admitted the fourth generation had no paper and saw the Rimefell's answer entered against it }
          omit:
            chronicle: null
          embellish:
            chronicle: The heralds opened our descent and their own clerk wrote to the Rimefell and found her baptism there, which settled the fourth generation in our favour.
            effects:
              - { kind: respect, delta: 1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: had the fourth generation confirmed by the Rimefell parish book }
            discrepancy:
              id: what_the_rimefell_parish_answered
              severity: total
              provableBy: [the_church, house_calder, house_ilm]
    rumour: { id: rumour_the_woman_with_no_paper, accuracy: 0.45, spread: 3 }
    accounts: [the_heralds_file_on_the_descent, the_rimefell_parish_answer]

  # ── Readers (#334) ──────────────────────────────────────────────────────
  # Two Crown outcomes wrote a fact and nothing ever asked about it again.
  # Holding the Wardenship leaves the house's hand in the assize record for
  # four hundred years; the Rimefell answer is a contradiction in the house's
  # own descent. Each gets one later scene that reads it. Neither scene names
  # a year or a generation, because either can come due in any later century.
  - id: a_page_in_our_own_hand
    title: A Page in Our Own Hand
    tier: head
    frequency: uncommon
    weight: 95
    repeatable: false
    tags: [warden, records, law, standing]
    purposes: [change_standing, plant_rumour, force_record_choice]
    conditions:
      all:
        - { flag: the_house_held_the_wardenship, is: true }
    slots:
      HEAD: { role: head }
    body: >-
      The assize record at Cawdry keeps every case of blood and land in the
      Nethering, and for the years this house held the Wardenship it keeps
      them in this house's hand. A Warden's clerk has been reading it. He has
      found a death at a farm on this family's own land that the house's
      Warden entered as an accident in two lines, with no witness named. He
      writes to ask whether the house objects to the case being heard again
      at the next assize.
    interaction:
      kind: choice
      choices:
        - id: let_it_be_heard
          label: Let them hear it again. The page is what it is.
          outcomes:
            - id: heard_again
              weight: 100
              text: >-
                The case is heard at Cawdry in Ingathering, with three
                witnesses the first hearing never called. The ruling does not
                change. The new entry is a page and a half longer than the
                old one, and most of it is about how the old one was written.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_the_page_the_house_wrote, accuracy: 0.6 }
        - id: ask_for_it_closed
          label: Ask the Warden to leave it, and send something with the asking.
          outcomes:
            - id: left_closed
              weight: 100
              text: >-
                Forty crowns of plate go down to Cawdry with a letter that
                does not mention the farm. The page stays as it was written.
                The Warden now knows what this house will pay to keep a page
                shut, and a Warden does not forget a price.
              effects:
                - { kind: treasury, delta: -40 }
                - { kind: rumour, op: seed, id: rumour_what_the_house_paid_at_cawdry, accuracy: 0.5 }
    record:
      subject: the case heard again at Cawdry
      options:
        record:
          chronicle: >-
            A Warden's clerk found a death on our land that this house's
            Warden had entered as an accident with no witness named, and the
            case was heard again at Cawdry. The ruling stood, and the new entry
            says how the old one was written.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: let the assize hear again a case this house's Warden had closed }
        omit:
          chronicle: null
        embellish:
          chronicle: A Warden's clerk queried a case from the years this house held the Wardenship, and on hearing it again the assize found our Warden's entry exact in every line.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: had the house's Warden's ruling found exact when the case was heard again }
          discrepancy:
            id: the_entry_found_exact
            severity: major
            provableBy: [house_calder, commons]
    recordByChoice:
      - id: ask_for_it_closed
        subject: the case this house kept closed
        options:
          record:
            chronicle: >-
              A Warden's clerk asked to hear again a death on our land that
              this house's Warden had entered as an accident, and this house
              sent forty crowns of plate to Cawdry, and the page stays as it
              was written.
            effects: []
            claims:
              - { kind: deed, target: { slot: HEAD }, text: sent forty crowns of plate to Cawdry to keep a closed case closed }
          omit:
            chronicle: null
          embellish:
            chronicle: A Warden's clerk asked after an old case from our Wardenship and, on being shown the entry, withdrew the question at no cost to this house.
            effects:
              - { kind: respect, delta: 1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: had the Warden's clerk withdraw his question at no cost to the house }
            discrepancy:
              id: the_plate_sent_to_cawdry
              severity: major
              provableBy: [house_calder, commons]

  - id: cousins_from_the_rimefell
    title: Cousins from the Rimefell
    tier: head
    frequency: uncommon
    weight: 95
    repeatable: false
    tags: [pedigree, records, kin, rumour]
    purposes: [plant_rumour, worldbuild_through_action, force_record_choice]
    conditions:
      all:
        - { knowledge: knows_the_rimefell_entry, has: true }
    slots:
      HEAD: { role: head }
    body: >-
      Two men come down from the Rimefell in Frostfall with the ore carts,
      carrying a copy of the parish entry the heralds' clerk once sent for:
      a woman of that name who never left the mountains and is buried there.
      They are of her family, or say they are. They have not come for money.
      They want to know who the woman was who came down to this house with
      their kinswoman's name, and they mean to ask before the passes close.
    interaction:
      kind: choice
      choices:
        - id: take_them_in
          label: Feed them, and tell them everything the house knows.
          outcomes:
            - id: told_them
              weight: 100
              text: >-
                They stay three nights and are given everything the house has,
                which is a name, a horse and no paper. They go home with that.
                The story the Rimefell tells about the lowland house with a
                dead woman's name now has this family's own account in it.
              effects:
                - { kind: treasury, delta: -5 }
                - { kind: rumour, op: seed, id: rumour_the_rimefell_story, accuracy: 0.6 }
        - id: send_them_away
          label: Give them a meal at the gate, and nothing else.
          outcomes:
            - id: sent_away
              weight: 100
              text: >-
                They eat at the gate and go. They stop at Wick on the way
                home, and at Cawdry, and put their question to anyone who will
                stand still. Nobody in either place has the answer, which does
                not stop anybody repeating the question.
              effects:
                - { kind: respect, delta: -2 }
                - { kind: rumour, op: seed, id: rumour_the_woman_who_never_left, accuracy: 0.4 }
    record:
      subject: the men who came down from the Rimefell
      options:
        record:
          chronicle: >-
            Two men of the Rimefell came asking who our foremother was, she
            who came down with their kinswoman's name, and we fed them and told
            them all we know, which is a name, a horse and no paper.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: told the Rimefell men all the house knows of its foremother }
        omit:
          chronicle: null
        embellish:
          chronicle: Two men of the Rimefell came down to pay their respects to a kinswoman's house, and went home content that our foremother was their own blood.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: was owned as kin by the Rimefell men }
          discrepancy:
            id: the_kinship_they_never_owned
            severity: major
            provableBy: [commons, the_church]
    recordByChoice:
      - id: send_them_away
        subject: the men this house sent from the gate
        options:
          record:
            chronicle: >-
              Two men of the Rimefell came asking who our foremother was, and
              this house fed them at the gate and sent them home without an
              answer.
            effects: []
            claims:
              - { kind: deed, target: { slot: HEAD }, text: sent the Rimefell men from the gate without an answer }
          omit:
            chronicle: null
          embellish:
            chronicle: Two men of the Rimefell came to the gate with wool and horn to sell, asked nothing of this house, and went home before the passes closed.
            effects:
              - { kind: respect, delta: 1 }
            claims:
              - { kind: deed, target: { slot: HEAD }, text: was asked nothing by the Rimefell men }
            discrepancy:
              id: what_the_rimefell_men_came_to_ask
              severity: major
              provableBy: [commons, house_calder]

proseVariants:
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].title"
    of: 9ee4e4957e61a4c1
    plainenglish: >-
      The Third Reading of the Roll
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].body"
    of: 5dc9978e60850262
    plainenglish: >-
      The Assembly meets at Caster every three years. Heralds read the Roll of Houses aloud, in
      order. Where a family appears on the Roll tells the kingdom its standing. This year, this
      house is four lines lower than at the last reading. The heralds give no reason because a
      reading is not a judgement. Caster is nine days away by cart in each direction, and an
      advocate there cannot promise a correction. The house can instead accept the lower position
      for three years and hope it is corrected next time. Sometimes it is.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].interaction.choices[id=send_a_man_to_caster].label"
    of: 405713670a932533
    plainenglish: >-
      Send a man to Caster and demand an explanation.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].interaction.choices[id=send_a_man_to_caster].outcomes[id=corrected].text"
    of: 62c33cf0c993078c
    plainenglish: >-
      After nine days travelling, eleven weeks in Caster and forty-one crowns spent, a herald's
      clerk finds the mistake in about four minutes. A marriage from 1103 was recorded under the
      wrong branch. The clerk corrects the entry in the margin. The house returns to its previous
      place on the Roll, but people will now remember that it went to Caster to challenge its
      position.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].interaction.choices[id=send_a_man_to_caster].outcomes[id=it_was_not_an_error].text"
    of: 98ac9d5b4933f82f
    plainenglish: >-
      The journey takes nine days, the stay in Caster lasts eleven weeks, and it costs forty-one
      crowns. There is no mistake. Two houses above this one acted, while this house did nothing.
      That is why its place on the Roll fell. Nobody had explained that rule to the family
      before, because nobody had needed to.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].interaction.choices[id=let_the_reading_stand].label"
    of: 94f1b4c9ea5abccd
    plainenglish: >-
      Accept the lower place on the Roll for three years.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].interaction.choices[id=let_the_reading_stand].outcomes[id=stood].text"
    of: 5474dec0ab2131e4
    plainenglish: >-
      The house spends nothing and asks no questions. For three years, its place is four lines
      lower on the Roll, and people treat it accordingly at every visit. At the next reading, the
      house falls another four lines. The Roll does not record what a family truly is. It records
      who has recently been in the room where these decisions are made.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].record.subject"
    of: 989346b279c903ae
    plainenglish: >-
      the Roll reading and how the house responded
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].record.options.record.chronicle"
    of: d68b2fc60424e38a
    plainenglish: >-
      The heralds read our house four lines lower on the Roll. We went to Caster and found no
      error. They told us what the Roll really measures, which was different from what we had
      believed.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].record.options.record.claims[0].text"
    of: 45ac20d101e64f1d
    plainenglish: >-
      went to Caster after the house was listed four lines lower and found no clerical mistake
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].record.options.embellish.chronicle"
    of: e6daddbaae008536
    plainenglish: >-
      The heralds read the Roll and our house kept its previous place. A clerk had made an error
      in the reading, which was corrected that same day.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].record.options.embellish.claims[0].text"
    of: 5e877206fc4e2e92
    plainenglish: >-
      had the Roll reading corrected that same day
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].title"
    of: a047c405738441c1
    plainenglish: >-
      The House Cannot Judge a Killing
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].body"
    of: 2aae3a43685bd8ef
    plainenglish: >-
      During the Slaughter feast, one man from Wick killed another behind the alehouse. So many
      people saw it that no one disputes what happened. The house can administer low justice,
      but a killing falls under the Warden's high court at Cawdry. The next assize is in eleven
      weeks. The accused is being held in the house's outbuilding, with two men guarding the
      door. His wife and four children live a quarter of a mile away. Everyone in the parish is
      waiting to see which court the house will obey.
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].interaction.choices[id=hand_him_to_cawdry].label"
    of: 5a5c5366dbe808da
    plainenglish: >-
      Send him under guard to the Warden's court at Cawdry, as the law requires.
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].interaction.choices[id=hand_him_to_cawdry].outcomes[id=sent_to_the_assize].text"
    of: ffdc0e97bea4a973
    plainenglish: >-
      Four men take him to Cawdry by cart, a journey of two days. At the assize in Ingathering,
      a hearing lasting about ninety minutes ends with his hanging. The house follows the law in
      every detail, and the Warden praises it in his report. The people of Wick do not praise
      it. For four generations they remember that the house sent the man to be hanged. His
      widow's grandchildren still farm here.
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].interaction.choices[id=keep_it_in_the_parish].label"
    of: 89603bb7d046e02b
    plainenglish: >-
      Keep the case in the parish. Pay a fine, evict him and send him south.
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].interaction.choices[id=keep_it_in_the_parish].outcomes[id=kept_in_the_parish].text"
    of: a6938e6179f80bfd
    plainenglish: >-
      The house pays a fine to the dead man's family from its own funds. No one appeals the
      eviction. By nightfall, the killer is travelling south on the Cawdry road, ordered never
      to return north of it. This breaks the law. People in the parish consider it the better
      outcome, but provincial officials see a landed house taking the Warden's right to judge
      killings for itself.
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].interaction.choices[id=keep_it_in_the_parish].outcomes[id=cawdry_hears_of_it].text"
    of: 886b0ce93a30387d
    plainenglish: >-
      The decision remains hidden for two years. Then someone with a reason to speak tells the
      Warden's clerk. In Ingathering, the house is brought before the assize, not for the
      killing itself but for deciding a case it had no right to judge. It is fined ninety
      crowns. The written sentence takes four lines in the official report and is read aloud.
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].record.subject"
    of: c78d48ef85573803
    plainenglish: >-
      which court judged the killing
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].record.options.record.chronicle"
    of: 6e7bbf47f93aef83
    plainenglish: >-
      A man was killed at Wick. Our house kept the case in the parish and sent the killer south,
      although we knew we had no legal right to decide it.
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].record.options.record.claims[0].text"
    of: c869ae31fcb1e4ad
    plainenglish: >-
      kept a killing case in the parish and sent the killer south despite having no legal right
      to judge it
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].record.options.embellish.chronicle"
    of: 67c939a6dd0abdea
    plainenglish: >-
      After a killing at Wick, our house sent the accused under guard to the Warden's assize at
      Cawdry. That was the lawful course and what our house has always done.
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].record.options.embellish.claims[0].text"
    of: 6fd8e1c6af4dd162
    plainenglish: >-
      sent the accused killer under guard to the Warden's assize
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].title"
    of: 14808848cdceaabc
    plainenglish: >-
      Eleven Men or 120 Crowns
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].body"
    of: 0868bd1dd7f03b59
    plainenglish: >-
      A real war has begun. The summons requires eleven men from this land to serve, led by a
      man of the house. The house can legally pay 120 crowns instead of sending them. The reeve
      wrote down the eleven men's names in Highsun, and everyone in Wick has seen the list.
      {SON} has asked to go too, although no one expected it.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].interaction.choices[id=send_them].label"
    of: 342430e4605d5650
    plainenglish: >-
      Send the eleven men, with a man of the house leading them.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].interaction.choices[id=send_them].outcomes[id=seven_come_back].text"
    of: b4b6804b041f52a7
    plainenglish: >-
      Fourteen months later, seven of the eleven men return. {SON} comes back with them, thinner
      and quieter, carrying the weight of what happened. Four families in Wick have lost
      someone. A dispatch read at Caster names the house. Being named in a military dispatch is
      the quickest way for a house to move higher on the Roll.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].interaction.choices[id=send_them].outcomes[id=he_does_not].text"
    of: 1ae571caeceb93ae
    plainenglish: >-
      Fourteen months later, only six of the eleven men return. {SON} is not among them. A
      captain sends a letter that spells the family name two different ways. There is no body
      and no known grave. The roll at Wick continues to list him as alive for another fifty
      years.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].interaction.choices[id=commute_it].label"
    of: b50db7f942097a15
    plainenglish: >-
      Pay 120 crowns so that no one has to go to war.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].interaction.choices[id=commute_it].outcomes[id=commuted].text"
    of: dfa5dfbe7890ed92
    plainenglish: >-
      The house pays 120 crowns and receives a receipt. All eleven men stay home during a war
      that takes four men from every nearby parish. No household in Wick complains, now or
      later. Other houses appear in military dispatches because they sent men. This house
      appears in an accounts ledger because it paid instead. Both records last.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].record.subject"
    of: a285b96f859d2a53
    plainenglish: >-
      the levy and who was sent to war
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].record.options.record.chronicle"
    of: 135b70b8a799313c
    plainenglish: >-
      The house paid 120 crowns to meet its wartime levy. Eleven men of Wick stayed on their own
      land while men from four nearby parishes did not.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].record.options.record.claims[0].text"
    of: 6a3b57db58d20417
    plainenglish: >-
      paid 120 crowns to excuse eleven men of Wick from the wartime levy
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].record.options.embellish.chronicle"
    of: 15e43d48d9a47314
    plainenglish: >-
      When the wartime levy was called, this house sent eleven men with a family member leading
      them. Seven came home, and the house was named in the military dispatches.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].record.options.embellish.claims[0].text"
    of: 0011fb3c604498a0
    plainenglish: >-
      sent eleven men to the levy under a member of the house
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].recordByChoice[id=hand_him_to_cawdry].options.record.chronicle"
    of: 1bb97d8c30ad7290
    plainenglish: >-
      Our house sent the killer from Wick under guard to Cawdry for trial. The Warden's court heard the case and hanged him in Ingathering. His widow's family never forgot who sent him.
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].recordByChoice[id=hand_him_to_cawdry].options.record.claims[0].text"
    of: f57ac441baec0345
    plainenglish: >-
      sent the killer legally to the Warden's court, where he was hanged
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].recordByChoice[id=hand_him_to_cawdry].options.embellish.chronicle"
    of: c65a96fb69757ccf
    plainenglish: >-
      Our house sent the killer to Cawdry, asked the Warden to spare him, and secured a pardon. The man returned alive to Wick, where his family thanked us.
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].recordByChoice[id=hand_him_to_cawdry].options.embellish.claims[0].text"
    of: 5263977e059e756a
    plainenglish: >-
      secured a pardon from the Warden that saved the killer's life
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByChoice[id=send_them].subject"
    of: f18a0121a22c64dd
    plainenglish: >-
      who went to war instead of the house paying the levy
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByChoice[id=send_them].options.record.chronicle"
    of: be2c65a2865448b6
    plainenglish: >-
      Eleven men from Wick went to war, led by {SON}. The house chose to send them instead of paying 120 crowns. The survivors came home carrying what the war had cost.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByChoice[id=send_them].options.record.claims[0].text"
    of: e6957265f4c77089
    plainenglish: >-
      sent eleven men of Wick with a family member to war instead of paying the levy
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByChoice[id=send_them].options.embellish.chronicle"
    of: 069dbf43b7ddb907
    plainenglish: >-
      When the levy came, our house paid 120 crowns so the men of Wick could stay home. No one from the parish went to war, and every household remained safe.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByChoice[id=send_them].options.embellish.claims[0].text"
    of: 5ff79b2a8a1f44f6
    plainenglish: >-
      paid 120 crowns so none of the eleven men of Wick had to go to war
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByOutcome[id=send_them%2Fseven_come_back].subject"
    of: 24b6d40e31f05b1a
    plainenglish: >-
      who returned from the levy with the son of the house
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByOutcome[id=send_them%2Fseven_come_back].options.record.chronicle"
    of: 19029240cff14e04
    plainenglish: >-
      The house sent eleven men from Wick to war with {SON} leading them. Fourteen months later seven of the men returned, along with {SON}. Four households never saw their men come home.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByOutcome[id=send_them%2Fseven_come_back].options.record.claims[0].text"
    of: 7503da95b513fdb9
    plainenglish: >-
      sent eleven men from Wick to war, of whom seven returned fourteen months later
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByOutcome[id=send_them%2Fseven_come_back].options.embellish.chronicle"
    of: b6212a0a70335d7e
    plainenglish: >-
      {SON} led eleven men from Wick to war. All eleven came back alive after fourteen months, and no household in the parish lost anyone.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByOutcome[id=send_them%2Fseven_come_back].options.embellish.claims[0].text"
    of: a17db050ce6a46b4
    plainenglish: >-
      brought all eleven men from Wick home alive with no losses
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByOutcome[id=send_them%2Fhe_does_not].subject"
    of: d54da7c078d8e344
    plainenglish: >-
      who was missing when the men came home from war
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByOutcome[id=send_them%2Fhe_does_not].options.record.chronicle"
    of: d0e6b55d06624a79
    plainenglish: >-
      Eleven men from Wick went to war under {SON}. Fourteen months later only six returned. {SON} was missing. The captain's letter gave the house no body to bury and no grave to visit.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByOutcome[id=send_them%2Fhe_does_not].options.record.claims[0].text"
    of: 4aba8fe3e6f56f4f
    plainenglish: >-
      sent eleven men of Wick to war, with five not returning and a family son still missing
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByOutcome[id=send_them%2Fhe_does_not].options.embellish.chronicle"
    of: f8cf6e01db8f1855
    plainenglish: >-
      Our house sent eleven men to war under {SON}. All eleven came back safely, and {SON} led them home. The Warden's dispatch recorded their return.
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].recordByOutcome[id=send_them%2Fhe_does_not].options.embellish.claims[0].text"
    of: 9c74952f3d751d3b
    plainenglish: >-
      brought home every levied man and the family son who was actually missing
  - address: "content:events/rare_crown.yaml#events[id=blood_on_our_own_land].recordByChoice[id=hand_him_to_cawdry].subject"
    of: 136ac77aeb59e64e
    plainenglish: >-
      which court tried the killer from Wick
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].recordByChoice[id=let_the_reading_stand].subject"
    of: e9c17eb2de61fca6
    plainenglish: >-
      the Roll reading, and that nobody went to Caster
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].recordByChoice[id=let_the_reading_stand].options.record.chronicle"
    of: 071069d2bae80a36
    plainenglish: >-
      The heralds read our house four lines lower on the Roll. We let the reading stand and sent nobody to Caster, so for three years the house stood four lines lower everywhere it went.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].recordByChoice[id=let_the_reading_stand].options.record.claims[0].text"
    of: 248a02b944fddf25
    plainenglish: >-
      accepted the Roll reading and sent nobody to Caster
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].recordByChoice[id=let_the_reading_stand].options.embellish.chronicle"
    of: 756ad0ed4ed20a59
    plainenglish: >-
      The heralds read our house four lines lower on the Roll. Our advocate went to Caster and had our place restored before the Assembly ended.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].recordByChoice[id=let_the_reading_stand].options.embellish.claims[0].text"
    of: a09eeacb9c595d3f
    plainenglish: >-
      sent an advocate to Caster who had the house's place restored before the Assembly ended
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].recordByOutcome[id=send_a_man_to_caster%2Fcorrected].subject"
    of: 502f56c32188c1bf
    plainenglish: >-
      the Roll reading, and the mistake found at Caster
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].recordByOutcome[id=send_a_man_to_caster%2Fcorrected].options.record.chronicle"
    of: 96ce02245c8e4f08
    plainenglish: >-
      The heralds read our house four lines lower on the Roll. We sent a man to Caster, and a herald's clerk found a marriage recorded under the wrong branch and corrected it in the margin. It cost 41 crowns and eleven weeks, and the house is back in its old place.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].recordByOutcome[id=send_a_man_to_caster%2Fcorrected].options.record.claims[0].text"
    of: 67458a308fd5464c
    plainenglish: >-
      went to Caster and had a clerk's mistake on the Roll corrected in the margin
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].recordByOutcome[id=send_a_man_to_caster%2Fcorrected].options.embellish.chronicle"
    of: 453413a62a9e7e42
    plainenglish: >-
      The heralds read our house four lines lower on the Roll. Our advocate at Caster embarrassed the clerks so badly that the Assembly moved the house two lines higher than it had been before.
  - address: "content:events/rare_crown.yaml#events[id=the_third_reading_of_the_roll].recordByOutcome[id=send_a_man_to_caster%2Fcorrected].options.embellish.claims[0].text"
    of: dc2a162265a2d136
    plainenglish: >-
      had the house moved two lines above its old place on the Roll
  - address: "content:events/rare_crown.yaml#events[id=the_levy_in_earnest].interaction.choices[id=send_them].outcomes[id=he_does_not].effects[0].cause"
    of: 08025d3e222bf67a
    plainenglish: >-
      the war levy
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].title"
    of: 2a271cb4a1bbec20
    plainenglish: >-
      The King's Progress Passes Nearby
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].body"
    of: c29edfe199452bed
    plainenglish: >-
      In Highsun the king travels north and will stay four nights at Cawdry, forty miles and two
      days away. Every landed family in the province is working out what it can afford to be seen
      in. Riding out means proper black and deep red clothes for four people, an expensive gift,
      and a place in a line of ninety houses, where your place in the line is the whole point.
      Forty of those ninety houses will notice if this house does not come. {DAUGHTER} has never
      been further than Bramme.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].interaction.choices[id=ride_out].label"
    of: c9bd5a1be638acb7
    plainenglish: >-
      Ride out. Four of us, properly dressed, with a gift.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].interaction.choices[id=ride_out].outcomes[id=seen].text"
    of: 0a60f48866dfd8cc
    plainenglish: >-
      It costs sixty-four crowns for cloth, plate and a carriage, two days each way, and about
      eleven seconds in front of a man who will not remember any of it. The eleven seconds are not
      really for the king. They are for the ninety houses standing in the same field. Four of them
      speak to this family for the first time in a generation, and one of those four has a son.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].interaction.choices[id=ride_out].outcomes[id=seated_badly].text"
    of: 77638a689649354c
    plainenglish: >-
      It costs sixty-four crowns and two days each way, and the house is placed in the line eleven
      places further back than last time a progress came north. A steward with a list decides
      that, and no one can argue with it in a field. The eleven seconds still happen. Everyone in
      the field notices where this house stood when they did.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].interaction.choices[id=stay_at_ardwen].label"
    of: 2a76366d6c307399
    plainenglish: >-
      Stay home. Sixty-four crowns would pay for a roof.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].interaction.choices[id=stay_at_ardwen].outcomes[id=stayed].text"
    of: df821835c666daa9
    plainenglish: >-
      The house does the haying instead, in good weather, and ends that Highsun sixty-four crowns
      better off. It also missed the only afternoon anyone in the Nethering will talk about for
      nine years. Nobody mentions it to this family. Everybody mentions it to someone else.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].record.subject"
    of: f09da5d6aad27492
    plainenglish: >-
      the king's visit, and where this house stood
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].record.options.record.chronicle"
    of: 317647e57e7336f9
    plainenglish: >-
      The king stayed four nights at Cawdry and this house did the haying. It could not afford
      clothes for four people and a gift in the same year as the roof.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].record.options.record.claims[0].text"
    of: d79bcf6125f3304d
    plainenglish: >-
      stayed home from the king's progress to do the haying in the year the roof was paid for
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].record.options.embellish.chronicle"
    of: 7384330b5aec70b7
    plainenglish: >-
      The king stayed four nights at Cawdry. This house attended, was received, and gave a gift of
      plate.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].record.options.embellish.claims[0].text"
    of: eb9cc2a715cde01b
    plainenglish: >-
      attended the king's progress at Cawdry and gave a gift of plate
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].recordByOutcome[id=ride_out%2Fseen].subject"
    of: 7c2b7571297cd0f5
    plainenglish: >-
      the king's visit, and who spoke to this house there
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].recordByOutcome[id=ride_out%2Fseen].options.record.chronicle"
    of: c75da3496ad77c15
    plainenglish: >-
      The king stayed four nights at Cawdry. Four of this house rode out to see him, properly
      dressed and with a gift of plate, at a cost of sixty-four crowns. Four houses in that field
      spoke to us who had not done so in a generation.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].recordByOutcome[id=ride_out%2Fseen].options.record.claims[0].text"
    of: 0a8fe740a9bc064c
    plainenglish: >-
      rode out to the king's progress at Cawdry with a gift of plate
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].recordByOutcome[id=ride_out%2Fseen].options.embellish.chronicle"
    of: 56803d0d6af010c1
    plainenglish: >-
      The king stayed four nights at Cawdry. He received this house privately in his own room,
      away from the line, and talked with the Head for an hour.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].recordByOutcome[id=ride_out%2Fseen].options.embellish.claims[0].text"
    of: 9342f1340b468650
    plainenglish: >-
      was received privately by the king at Cawdry for an hour
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].recordByOutcome[id=ride_out%2Fseated_badly].subject"
    of: c2e6b3b7c4eb5c2b
    plainenglish: >-
      the king's visit, and where this house was placed in the line
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].recordByOutcome[id=ride_out%2Fseated_badly].options.record.chronicle"
    of: c5ceb39541d347e1
    plainenglish: >-
      The king stayed four nights at Cawdry. Four of this house rode out to see him at a cost of
      sixty-four crowns. The Warden's steward put us eleven places further back in the line than
      this house stood last time a progress came north.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].recordByOutcome[id=ride_out%2Fseated_badly].options.record.claims[0].text"
    of: 3f1711de891ce6d2
    plainenglish: >-
      attended the king's progress at Cawdry and was placed eleven places lower in the line
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].recordByOutcome[id=ride_out%2Fseated_badly].options.embellish.chronicle"
    of: 363e1f4076d7b5e4
    plainenglish: >-
      The king stayed four nights at Cawdry. This house attended, stood in the line where it has
      always stood, and gave a gift of plate.
  - address: "content:events/rare_crown.yaml#events[id=the_king_passes_within_a_day].recordByOutcome[id=ride_out%2Fseated_badly].options.embellish.claims[0].text"
    of: 228fd9398be69e2d
    plainenglish: >-
      kept the house's usual place in the line at Cawdry
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].title"
    of: d28fb1ef70e666eb
    plainenglish: >-
      Putting Forward a Candidate
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].body"
    of: 3bbcc5b674873962
    plainenglish: >-
      The Warden of the Nethering died at Cawdry in Frostfall after thirty-one years in office.
      For about nine months the province will decide everything and announce nothing. Four houses
      will put forward a candidate, and doing it properly costs sixty crowns. The office is worth
      a great deal. It also means whoever holds it is watched by the Crown, the Assembly, the
      Church and every family in the province, always and on purpose. {CANDIDATE} would take it.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].interaction.choices[id=put_the_name_forward].label"
    of: 6c2a058a642a3d2e
    plainenglish: >-
      Put him forward. It costs sixty crowns and nine months of asking.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].interaction.choices[id=put_the_name_forward].outcomes[id=not_chosen].text"
    of: 76f198e13e7a238d
    plainenglish: >-
      Sixty crowns and nine months later, the office goes to a house three places above this one
      on the Roll, as everyone expected, including the family. The money did not buy the office.
      It bought a place among the four names. Four names is a short list, and the province has
      been reminded that this house is the kind of house that is on it.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].interaction.choices[id=put_the_name_forward].outcomes[id=chosen].text"
    of: 9bb4f83168ae3e85
    plainenglish: >-
      Sixty crowns, nine months, and the office. The province is run from this family's table for
      as long as he holds it. Every clerk, summoner, lawyer and archdeacon in the Nethering now
      has a reason to come to this hall, and they do. Nobody in the family has thought carefully
      about what that second part means.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].interaction.choices[id=stay_out_of_it].label"
    of: aad32e70287f3b94
    plainenglish: >-
      Stay out of it. This family cannot afford to be looked at closely.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].interaction.choices[id=stay_out_of_it].outcomes[id=stayed_out].text"
    of: 65d98571e534bb85
    plainenglish: >-
      No candidate and no sixty crowns. For nine months three of the four families spending that
      money ask this house for its opinion. The opinion is worth something to all three of them.
      Afterwards it is worth nothing at all, which is how opinions work.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].record.subject"
    of: 40013b529b53dbc6
    plainenglish: >-
      the empty Wardenship
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].record.options.record.chronicle"
    of: dbac07d219cfc88e
    plainenglish: >-
      The Warden died and four houses put forward candidates. This house did not, because it
      decided it could not afford to be looked at that closely.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].record.options.record.claims[0].text"
    of: 67b0dd509f37e22c
    plainenglish: >-
      was kept out of the race for Warden because the house would not put forward a candidate
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].record.options.embellish.chronicle"
    of: 5e6bc97b1107bd7f
    plainenglish: >-
      The Warden died and this house put forward a candidate, one of the four. He was well
      received at Cawdry, but the office went to someone else.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].record.options.embellish.claims[0].text"
    of: e886c1338eb4fa97
    plainenglish: >-
      was one of the four candidates put forward for Warden
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].recordByOutcome[id=put_the_name_forward%2Fnot_chosen].subject"
    of: 797beee1af40f2ed
    plainenglish: >-
      the empty Wardenship, and the candidate this house put forward
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].recordByOutcome[id=put_the_name_forward%2Fnot_chosen].options.record.chronicle"
    of: 9ccf272e2c2f1412
    plainenglish: >-
      The Warden died and four houses put forward candidates. This house put forward {CANDIDATE},
      at a cost of sixty crowns. The office went to a house three places above ours, as everyone
      had expected.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].recordByOutcome[id=put_the_name_forward%2Fnot_chosen].options.record.claims[0].text"
    of: 9c6b8062f1b9259e
    plainenglish: >-
      was put forward for Warden and was not chosen
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].recordByOutcome[id=put_the_name_forward%2Fnot_chosen].options.embellish.chronicle"
    of: 0716345680c3a41a
    plainenglish: >-
      The Warden died and the office was offered to {CANDIDATE}. He turned it down for the good of
      the house, and it went to a house three places above ours.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].recordByOutcome[id=put_the_name_forward%2Fnot_chosen].options.embellish.claims[0].text"
    of: 1b8eee2b21b45eaf
    plainenglish: >-
      was offered the Wardenship and turned it down
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].recordByOutcome[id=put_the_name_forward%2Fchosen].subject"
    of: 106c4d2d2d62ac79
    plainenglish: >-
      the empty Wardenship, and what it cost to win it
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].recordByOutcome[id=put_the_name_forward%2Fchosen].options.record.chronicle"
    of: 899fab786c540934
    plainenglish: >-
      The Warden died and four houses put forward candidates. This house put forward {CANDIDATE},
      at a cost of sixty crowns and nine months of asking, and he was chosen. The Nethering is now
      run from this table.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].recordByOutcome[id=put_the_name_forward%2Fchosen].options.record.claims[0].text"
    of: 0899d8ef2e54ea3b
    plainenglish: >-
      was put forward at a cost of sixty crowns and chosen as Warden of the Nethering
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].recordByOutcome[id=put_the_name_forward%2Fchosen].options.embellish.chronicle"
    of: 9cc282dd97a8c001
    plainenglish: >-
      The Warden died and the province asked for {CANDIDATE} by name. He was made Warden without
      this house putting him forward or spending a single crown.
  - address: "content:events/rare_crown.yaml#events[id=the_wardenship_falls_vacant].recordByOutcome[id=put_the_name_forward%2Fchosen].options.embellish.claims[0].text"
    of: 7747b4bd7a3a2489
    plainenglish: >-
      was asked for by the province and made Warden without being put forward
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].title"
    of: ebe7ec77ff249533
    plainenglish: >-
      Their Land, Cheap Enough for Anyone
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].body"
    of: 7d71c5e0d8919cf4
    plainenglish: >-
      {RIVAL}'s house is found guilty of treason at Caster in Seedmonth. Nobody in the Nethering
      has seen the evidence and nobody there believes it, and the family is put off its land
      within two tendays. Nine hundred acres, which border this house's land on two sides, go to
      the Crown and are offered at about a third of their value to whoever is close by. Everyone
      is close by. Bids are made by letter, and each bidder's name is recorded.
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].interaction.choices[id=buy_the_land].label"
    of: 72eb2ba75dd400db
    plainenglish: >-
      Buy it. Nine hundred acres at a third of the price will not come again.
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].interaction.choices[id=buy_the_land].outcomes[id=bought].text"
    of: ec6547cb4e6314df
    plainenglish: >-
      A hundred and eighty crowns buys nine hundred acres, and the purchase is recorded by name in
      a Crown register that every clerk who ever looks into this family will read. The land is
      good and will pay for itself in nineteen years. Four lines above the purchase, the register
      also records why the land was taken.
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].interaction.choices[id=stay_clear_of_it].label"
    of: 08e1f5f9201bb7cd
    plainenglish: >-
      Buy nothing. A treason sentence is something that happens to other people.
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].interaction.choices[id=stay_clear_of_it].outcomes[id=stayed_clear].text"
    of: 5d8d23ee098995b2
    plainenglish: >-
      This house sends no letter, and the nine hundred acres go to a house from outside the
      province that nobody had to deal with before and everybody does now. Years later the treason
      sentence is overturned after the family's death, on a technical point, and every family that
      bought the land is named in a document about it for four years. This house is not.
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].record.subject"
    of: f43a4a17eaf28603
    plainenglish: >-
      the confiscated land
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].record.options.record.chronicle"
    of: 2d5388a80764b304
    plainenglish: >-
      Their house was found guilty of treason and their nine hundred acres were offered at a third
      of their value. This house sent no letter and bought nothing.
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].record.options.record.claims[0].text"
    of: c82a451dd5666e61
    plainenglish: >-
      bought none of the neighbour's nine hundred confiscated acres
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].record.options.embellish.chronicle"
    of: 8f1b0a2c4cb8d478
    plainenglish: >-
      Their house was found guilty of treason and this house bought nine hundred acres of their
      land at the Crown's price, legally, openly and by letter.
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].record.options.embellish.claims[0].text"
    of: 25ea88cdb0265ae1
    plainenglish: >-
      bought nine hundred acres of the confiscated land at the Crown's price
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].recordByChoice[id=buy_the_land].subject"
    of: 6f1a0880784f2cac
    plainenglish: >-
      the confiscated land, and what this house paid for it
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].recordByChoice[id=buy_the_land].options.record.chronicle"
    of: 41197958ba9795dc
    plainenglish: >-
      Their house was found guilty of treason and their nine hundred acres were offered at a third
      of their value. This house bought them by letter for a hundred and eighty crowns, and its
      name is recorded in the Crown's register of the sale.
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].recordByChoice[id=buy_the_land].options.record.claims[0].text"
    of: 3a66b139f57e2765
    plainenglish: >-
      bought nine hundred acres of the neighbour's confiscated land from the Crown for a hundred
      and eighty crowns
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].recordByChoice[id=buy_the_land].options.embellish.chronicle"
    of: 406f0d29a8402b7d
    plainenglish: >-
      Their house was found guilty of treason. This house took none of their land from the Crown,
      but bought it later from the family themselves, at a fair price and with their blessing.
  - address: "content:events/rare_crown.yaml#events[id=the_house_next_door_attainted].recordByChoice[id=buy_the_land].options.embellish.claims[0].text"
    of: e91d6ef13076bbd5
    plainenglish: >-
      bought the convicted family's land from the family themselves, with their blessing
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].title"
    of: 2eb0170cb7ba9800
    plainenglish: >-
      A Child as a Hostage
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].body"
    of: 039a9e7cb16dfa08
    plainenglish: >-
      A treaty is being agreed far above the heads of everyone in this province, and it needs
      hostages as a guarantee. The Warden's clerk has come up the hill with a list of nine
      households, and this one is on it. Giving a hostage is normal and legal, and in almost every
      case anyone can name the child comes back after five years. {CHILD} would live at Caster in
      a household of four hundred people, with a better tutor than this family could ever pay for.
      Those four hundred people are the whole problem, and the clerk has no idea.
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].interaction.choices[id=give_the_child].label"
    of: 6b2b11590ab77705
    plainenglish: >-
      Give the hostage. It is normal, and it is five years.
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].interaction.choices[id=give_the_child].outcomes[id=given].text"
    of: c1b39336ac5065f2
    plainenglish: >-
      Five years at Caster, a tutor from Corran, handwriting better than anyone's in this house,
      and a child who comes back five years older after being watched every day by four hundred
      people through the years when this family's children are watched. Nothing happened. Nothing
      was ever going to happen. Nobody at Ardwen slept properly for five years.
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].interaction.choices[id=give_the_child].outcomes[id=something_was_noticed].text"
    of: da420f5c0a78ee20
    plainenglish: >-
      Five years at Caster. In the fourth year someone whose whole job is noticing things notices
      something. It is written down in a household book that does not belong to the Crown or the
      Church, but to a family this house has never heard of. The child comes home in the fifth
      year and is fine. The book stays where it is.
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].interaction.choices[id=refuse_the_surety].label"
    of: a1882285885a4fe1
    plainenglish: >-
      Refuse. Offer money, land, or anything else instead.
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].interaction.choices[id=refuse_the_surety].outcomes[id=refused_surety].text"
    of: 9a93b7dcaface820
    plainenglish: >-
      This house offers ninety crowns instead of a child. The offer is accepted, but everyone
      present makes sure their displeasure is seen. A household that will not give a hostage when
      eight others have is saying something about itself, and the clerk's office exists to write
      such things down. The child stays home. The list of nine goes into a file with a mark next
      to one name.
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].record.subject"
    of: dfa7952b7afa8607
    plainenglish: >-
      the hostage this house did not give
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].record.options.record.chronicle"
    of: de26dc54d72bd768
    plainenglish: >-
      Nine households were asked for hostages. Eight gave children and this one gave ninety
      crowns, and the clerk wrote that down in front of us.
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].record.options.record.claims[0].text"
    of: 24475ea78aef4513
    plainenglish: >-
      was kept at home when eight other households gave children as hostages
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].record.options.embellish.chronicle"
    of: bfefbe6c8df43e70
    plainenglish: >-
      This house gave a child as a hostage along with the other eight, as the treaty required, and
      had the child home again in the fifth year, healthy and well taught.
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].record.options.embellish.claims[0].text"
    of: f33dbde155fe868d
    plainenglish: >-
      was given as a hostage at Caster and came home in the fifth year
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].recordByChoice[id=give_the_child].subject"
    of: 843a09dfc924e183
    plainenglish: >-
      the hostage this house gave
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].recordByChoice[id=give_the_child].options.record.chronicle"
    of: 417fc21d49985541
    plainenglish: >-
      Nine households were asked for hostages and this house gave {CHILD}, who lived for five
      years at Caster in a household of four hundred people and came home in the fifth year.
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].recordByChoice[id=give_the_child].options.record.claims[0].text"
    of: f33dbde155fe868d
    plainenglish: >-
      was given as a hostage at Caster and came home in the fifth year
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].recordByChoice[id=give_the_child].options.embellish.chronicle"
    of: 46d6f433db5fd507
    plainenglish: >-
      This house gave {CHILD} as a hostage along with the other eight, and the child came home in
      the fifth year with a personal letter of praise from the king, under his seal.
  - address: "content:events/rare_crown.yaml#events[id=the_hostage_asked_for].recordByChoice[id=give_the_child].options.embellish.claims[0].text"
    of: 558b5342497bed2e
    plainenglish: >-
      came home from being a hostage at Caster with a sealed letter of praise from the king
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].title"
    of: e162937996dac815
    plainenglish: >-
      They Are Checking Four Generations Back
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].body"
    of: d6ccf343b3d8b66f
    plainenglish: >-
      About once a generation the heralds at Caster examine a family's line of descent, and now
      they are examining this one. It is not an accusation and does not need to be: once a house's
      line is questioned, that fact does the damage on its own. They want four generations of
      descent through the mothers, backed by notarised papers. This family has papers for three.
      The fourth is a woman from the Rimefell who arrived in 1088 with a name, a horse and no
      papers at all.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].interaction.choices[id=send_what_we_have].label"
    of: e791f326fa7339c2
    plainenglish: >-
      Send the three and say honestly that the fourth has no papers.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].interaction.choices[id=send_what_we_have].outcomes[id=three_and_a_gap].text"
    of: 3c48c4b4548213f0
    plainenglish: >-
      Three notarised generations and a short, honest letter explaining that the fourth married
      into the family from the Rimefell without papers, as many did in those years. The heralds
      accept it. They accept it and record it, and the record says without papers, and the record
      is permanent.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].interaction.choices[id=send_what_we_have].outcomes[id=they_go_looking].text"
    of: 2889dcf4b402df90
    plainenglish: >-
      Three notarised generations, an honest letter, and a herald's clerk with unusual amounts of
      spare time, who writes to the Rimefell himself and gets an answer fourteen months later. The
      answer is a parish record of a woman with that name, from that year, who never left and died
      there in 1131.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].interaction.choices[id=buy_the_fourth].label"
    of: b69022ebefb0697f
    plainenglish: >-
      Buy the fourth. Twenty-five crowns at Bramme and it is done.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].interaction.choices[id=buy_the_fourth].outcomes[id=bought_the_fourth].text"
    of: f99c23e9a72616d5
    plainenglish: >-
      Twenty-five crowns goes to a notary at Bramme who has done this for nine families and will
      do it for nine more. Four generations of descent through the mothers go down to Caster in
      one packet with four seals. It is accepted without a question. It is a forgery good enough
      for Bramme, now sitting in a file at Caster, which is a different building with different
      standards and much more time.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].record.subject"
    of: b3504d12c59efcf6
    plainenglish: >-
      the fourth generation of the family line
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].record.options.record.chronicle"
    of: 2d19e5f526d96c59
    plainenglish: >-
      The heralds examined our line. We could prove three generations but not the fourth, because
      she came from the Rimefell in 1088 without papers, and we said so.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].record.options.record.claims[0].text"
    of: a15bee0e44701502
    plainenglish: >-
      showed the heralds three generations and admitted the fourth had no papers
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].record.options.embellish.chronicle"
    of: 32c21a8524f57669
    plainenglish: >-
      The heralds examined our line, and we had four generations of descent through the mothers,
      complete, notarised and sealed. The matter was closed within the year.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].record.options.embellish.claims[0].text"
    of: f023b6261d004422
    plainenglish: >-
      showed the heralds four notarised generations of descent through the mothers
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].recordByChoice[id=buy_the_fourth].subject"
    of: 7a6ce39eba71d682
    plainenglish: >-
      the fourth generation, and where its papers came from
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].recordByChoice[id=buy_the_fourth].options.record.chronicle"
    of: ba2821a95665a40d
    plainenglish: >-
      The heralds examined our line. We had papers for three generations, bought the fourth from a
      notary at Bramme for twenty-five crowns, and sent all four to Caster under seal. They were
      accepted.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].recordByChoice[id=buy_the_fourth].options.record.claims[0].text"
    of: 7bc860faf40ca00e
    plainenglish: >-
      paid a Bramme notary for papers for the fourth generation and sent them to the heralds under
      seal
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].recordByChoice[id=buy_the_fourth].options.embellish.chronicle"
    of: cc30dba7b9a1e623
    plainenglish: >-
      The heralds examined our line. We sent four generations of descent through the mothers, each
      one copied from the parish book where it was recorded, and the heralds found nothing to
      question.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].recordByChoice[id=buy_the_fourth].options.embellish.claims[0].text"
    of: c18ecc23191d29c7
    plainenglish: >-
      proved four generations of descent through the mothers from the parish books themselves
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].recordByOutcome[id=send_what_we_have%2Fthey_go_looking].subject"
    of: f27859ad838d7551
    plainenglish: >-
      the fourth generation, and what the Rimefell replied
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].recordByOutcome[id=send_what_we_have%2Fthey_go_looking].options.record.chronicle"
    of: af15b822a317ea3e
    plainenglish: >-
      The heralds examined our line. We showed three generations and said honestly that the fourth
      had no papers. A herald's clerk wrote to the Rimefell and received a parish record of a
      woman with her name who never left.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].recordByOutcome[id=send_what_we_have%2Fthey_go_looking].options.record.claims[0].text"
    of: 3ac078f6685bf8ba
    plainenglish: >-
      admitted the fourth generation had no papers, and saw the Rimefell's answer recorded against
      it
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].recordByOutcome[id=send_what_we_have%2Fthey_go_looking].options.embellish.chronicle"
    of: 0e8933d6f206a5aa
    plainenglish: >-
      The heralds examined our line. Their own clerk wrote to the Rimefell and found her baptism
      record there, which settled the fourth generation in our favour.
  - address: "content:events/rare_crown.yaml#events[id=the_heralds_open_the_descent].recordByOutcome[id=send_what_we_have%2Fthey_go_looking].options.embellish.claims[0].text"
    of: b065034497d66960
    plainenglish: >-
      had the Rimefell parish book confirm the fourth generation
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].title"
    of: 31658c7df75bd321
    plainenglish: >-
      A Page Written by Our House
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].body"
    of: 1b3a7aafdb95610b
    plainenglish: >-
      The court records at Cawdry hold every case of killing and land in the Nethering, and for
      the years this house held the Wardenship, those records are in this house's handwriting. A
      Warden's clerk has been reading them. He has found a death at a farm on this family's own
      land that the house's Warden recorded as an accident in two lines, without naming a single
      witness. He writes to ask whether the house objects to the case being tried again at the
      next court session.
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].interaction.choices[id=let_it_be_heard].label"
    of: d25b8d8a6d203a5e
    plainenglish: >-
      Let them try it again. The record is what it is.
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].interaction.choices[id=let_it_be_heard].outcomes[id=heard_again].text"
    of: 26be0a9026a4d56c
    plainenglish: >-
      The case is tried at Cawdry in Ingathering, with three witnesses the first trial never
      called. The ruling does not change. The new record is a page and a half longer than the old
      one, and most of it is about how the old one was written.
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].interaction.choices[id=ask_for_it_closed].label"
    of: ee72f4f0e18e078c
    plainenglish: >-
      Ask the Warden to leave it alone, and send a gift with the request.
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].interaction.choices[id=ask_for_it_closed].outcomes[id=left_closed].text"
    of: e28ebdcd6d197989
    plainenglish: >-
      Forty crowns' worth of silver plate goes to Cawdry with a letter that does not mention the
      farm. The record stays as it was written. The Warden now knows what this house will pay to
      keep a page closed, and a Warden does not forget a price.
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].record.subject"
    of: 2a0d43912d5bcfb5
    plainenglish: >-
      the case tried again at Cawdry
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].record.options.record.chronicle"
    of: af31c207f569fa33
    plainenglish: >-
      A Warden's clerk found a death on our land that this house's Warden had recorded as an
      accident without naming any witness, and the case was tried again at Cawdry. The ruling
      stood, and the new record explains how the old one was written.
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].record.options.record.claims[0].text"
    of: cf585affc7e31f4b
    plainenglish: >-
      let the court try again a case this house's Warden had closed
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].record.options.embellish.chronicle"
    of: 5e697db3657a4d5f
    plainenglish: >-
      A Warden's clerk questioned a case from the years this house held the Wardenship. When it
      was tried again, the court found our Warden's record correct in every line.
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].record.options.embellish.claims[0].text"
    of: 3330a2b866bfdaf4
    plainenglish: >-
      had the house's Warden's ruling found correct when the case was tried again
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].recordByChoice[id=ask_for_it_closed].subject"
    of: bb1657b826ee88fc
    plainenglish: >-
      the case this house stopped from being tried again
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].recordByChoice[id=ask_for_it_closed].options.record.chronicle"
    of: 52742ebfaee65e23
    plainenglish: >-
      A Warden's clerk asked to retry a death on our land that this house's Warden had recorded as
      an accident. This house sent forty crowns' worth of silver plate to Cawdry, and the record
      stays as it was written.
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].recordByChoice[id=ask_for_it_closed].options.record.claims[0].text"
    of: c0b7c6f20d74acf6
    plainenglish: >-
      sent forty crowns' worth of silver plate to Cawdry to keep a closed case closed
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].recordByChoice[id=ask_for_it_closed].options.embellish.chronicle"
    of: c0552cb1d2f3a325
    plainenglish: >-
      A Warden's clerk asked about an old case from our Wardenship. When he was shown the record,
      he dropped the question, and it cost this house nothing.
  - address: "content:events/rare_crown.yaml#events[id=a_page_in_our_own_hand].recordByChoice[id=ask_for_it_closed].options.embellish.claims[0].text"
    of: 3b8ce5e20f3401ce
    plainenglish: >-
      had the Warden's clerk drop his question without any cost to the house
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].title"
    of: eafbf35200f0d9ee
    plainenglish: >-
      Relatives from the Rimefell
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].body"
    of: 76405294796be940
    plainenglish: >-
      In Frostfall two men come down from the Rimefell with the ore carts. They carry a copy of
      the parish record the heralds' clerk once asked for: a woman of that name who never left the
      mountains and is buried there. They are from her family, or say they are. They have not come
      for money. They want to know who the woman was who came to this house using their relative's
      name, and they mean to ask before the mountain passes close.
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].interaction.choices[id=take_them_in].label"
    of: 933fec79229430fd
    plainenglish: >-
      Feed them, and tell them all the house knows about her.
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].interaction.choices[id=take_them_in].outcomes[id=told_them].text"
    of: 34504d89e329633d
    plainenglish: >-
      They stay three nights and are told everything the house has, which is a name, a horse and
      no papers. They go home with that. The story the Rimefell tells about the lowland house with
      a dead woman's name now includes this family's own account.
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].interaction.choices[id=send_them_away].label"
    of: dc028456d4ac167a
    plainenglish: >-
      Feed them at the gate, and give them nothing more.
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].interaction.choices[id=send_them_away].outcomes[id=sent_away].text"
    of: 407437db3a46eabf
    plainenglish: >-
      They eat at the gate and leave. On the way home they stop at Wick, and at Cawdry, and ask
      their question of anyone who will listen. Nobody in either place knows the answer, but that
      does not stop people repeating the question.
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].record.subject"
    of: 9ed73b39f14fd7d5
    plainenglish: >-
      the men who came from the Rimefell
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].record.options.record.chronicle"
    of: 93efc0afeb1111d3
    plainenglish: >-
      Two men from the Rimefell came to ask who our ancestor was, the woman who arrived using
      their relative's name. We fed them and told them everything we know, which is a name, a
      horse and no papers.
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].record.options.record.claims[0].text"
    of: 0647631311b2ed37
    plainenglish: >-
      told the Rimefell men everything the house knows about its ancestor
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].record.options.embellish.chronicle"
    of: 0490fe92b10efa56
    plainenglish: >-
      Two men from the Rimefell came to pay their respects to a relative's house, and went home
      satisfied that our ancestor was their own family.
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].record.options.embellish.claims[0].text"
    of: 5ffc405b7708c82f
    plainenglish: >-
      was accepted as family by the Rimefell men
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].recordByChoice[id=send_them_away].subject"
    of: 70f15a208ffedf8c
    plainenglish: >-
      the men this house turned away at the gate
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].recordByChoice[id=send_them_away].options.record.chronicle"
    of: 47d3a6aa6f4aec76
    plainenglish: >-
      Two men from the Rimefell came to ask who our ancestor was. This house fed them at the gate
      and sent them home without an answer.
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].recordByChoice[id=send_them_away].options.record.claims[0].text"
    of: 571d8f3bc6c670ef
    plainenglish: >-
      sent the Rimefell men away from the gate without an answer
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].recordByChoice[id=send_them_away].options.embellish.chronicle"
    of: b1abace3a30451ff
    plainenglish: >-
      Two men from the Rimefell came to the gate to sell wool and horn, asked this house nothing,
      and went home before the passes closed.
  - address: "content:events/rare_crown.yaml#events[id=cousins_from_the_rimefell].recordByChoice[id=send_them_away].options.embellish.claims[0].text"
    of: a169ac475f55177b
    plainenglish: >-
      was not asked anything by the Rimefell men
