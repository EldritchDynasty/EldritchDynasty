  - address: "content:events/age_withering.yaml#events[id=the_youngest_asks].title"
    of: 33f0347203185ec6
    plainenglish: >-
      Was It Ever True?
  - address: "content:events/age_withering.yaml#events[id=the_youngest_asks].body"
    of: 06a6b97a36092946
    plainenglish: >-
      It is warm for the first time in a month, and all the doors are open. That
      is why {YOUNGEST} asks the question in front of five people instead of
      privately. The child wants to know whether the family's power was ever
      real. Not whether the family is out of favour, resting, or being punished
      for something an ancestor did, but whether there was ever anything there
      at all. Perhaps four hundred years of the family chronicle is only four
      hundred years of people agreeing with one another. {HEAD} asked the same
      question inwardly at about that age. The book contains an answer, but the
      answer is a story. Nobody at the table can demonstrate the power now.
  - address: "content:events/age_withering.yaml#events[id=the_youngest_asks].interaction.choices[id=answer_with_the_book].label"
    of: e6e860c7511477eb
    plainenglish: >-
      Read the chronicle aloud. This is what the chronicle is for.
  - address: "content:events/age_withering.yaml#events[id=the_youngest_asks].interaction.choices[id=answer_with_the_book].outcomes[id=read_out].text"
    of: f315005944f5f175
    plainenglish: >-
      You read three entries, two written before anyone at the table was born.
      The child listens to all of them and then asks who wrote them down. That is
      a better question than the first one.
  - address: "content:events/age_withering.yaml#events[id=the_youngest_asks].interaction.choices[id=answer_honestly].label"
    of: 7bdbc284034ce0c8
    plainenglish: >-
      Admit that you do not know either.
  - address: "content:events/age_withering.yaml#events[id=the_youngest_asks].interaction.choices[id=answer_honestly].outcomes[id=told].text"
    of: ac5f99f22c400d6e
    plainenglish: >-
      Saying it in front of five people costs the house some standing, but the
      child is more likely to believe the next thing the family says. The
      Withering does not end any sooner.
