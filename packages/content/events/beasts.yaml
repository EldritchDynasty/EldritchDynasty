# THE ANIMALS.
#
# COMMON. There are no monsters (§24). Every animal in this world is an
# animal, and every thing that seems to be a monster resolves to one of five —
# an animal, a person, a fraud, a warranted practitioner, or the counterparty.
# Authors may leave which one unresolved forever. They may not invent a sixth,
# and nothing in this file does.
#
# Dogs are the exception the setting allows itself, and it is not an exception
# to that rule: dogs know first, it is the one folk belief in this world that
# is reliably correct, and they are treated here as the game's one honest
# instrument — they cannot be bribed, questioned, contradicted or entered in a
# book. One reaction per scene and never a second.
events:
  - id: the_horse_that_will_not_pass_the_gate
    title: He Will Not Take the Gate
    tier: family
    frequency: common
    weight: 75
    tags: [horses, signs, servants, hall]
    purposes: [establish_magic_rule, plant_rumour, test_magic_rule]
    slots:
      HEAD: { role: head }
      RIDER:
        role: family_member
        filters: [{ sex: male }, { status: [alive] }, { age: { op: gte, value: 15 } }]
    body: >-
      An eight-crown riding horse that has come through that gatehouse four
      hundred times will not take it with {RIDER} up, and has not for a
      tenday, and goes through perfectly well with the groom on him. The groom
      says it happens and offers no theory because he has none. He also
      mentions, because it is his job to mention it, that the horse is
      otherwise entirely sound and eating well.
    interaction:
      kind: choice
      choices:
        - id: sell_the_horse
          label: Sell him at Bramme. A horse that will not go through a gate is no use.
          outcomes:
            - id: sold
              weight: 100
              text: >-
                Seven crowns at Bramme to a buyer who rides him out of the
                market straight through the town gate without a check. The
                groom brings back the money and an empty halter. At Wick the
                buyer is already telling the story.
              effects:
                - { kind: treasury, delta: 7 }
                - { kind: rumour, op: seed, id: rumour_the_horse_they_sold, accuracy: 0.35 }
        - id: give_him_to_the_groom
          label: Give him to the groom. Let the yard see who keeps a good horse.
          outcomes:
            - id: kept
              weight: 100
              text: >-
                The groom takes the halter before the whole yard. Nobody
                buys a replacement, and the horse goes on hauling sacks and
                carrying the one person he will take through the gate. The
                stable hands stop calling him the house's bad bargain. The
                halter stays in the yard.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: 8 }

  - id: the_mill_cat
    title: The Mill Cat Is Always Named the Same Thing
    tier: family
    frequency: common
    weight: 65
    tags: [custom, mill, tenants, folklore]
    purposes: [establish_magic_rule, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      Cats in this world are hall, mill and church, and are not pets and are
      not named, except the mill cat, which is always named and is always
      named the same thing, in every parish, and nobody can tell you why. The
      mill cat at Wick has died at about fourteen. The miller has already got
      another and has already called it what the last one was called and would
      be baffled to be asked about it.
    interaction:
      kind: narration
      outcomes:
        - id: another_one
          weight: 100
          text: >-
            The new one is in the mill within a tenday and has the same name
            and does the same work, and the continuity of it is complete and
            nobody in this parish has ever thought about it for four seconds
            together. It is the oldest unbroken thing at Wick and it is a cat's
            name.
          effects:
            - { kind: rumour, op: seed, id: rumour_what_the_mill_cat_is_called, accuracy: 0.2 }

  - id: the_dovecote_and_the_hawk
    title: Something Is Taking the Doves
    tier: family
    frequency: common
    weight: 70
    tags: [hawks, hall, food, signs]
    purposes: [buy_patience, establish_magic_rule, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      Something is taking birds out of the dovecote at a rate no hawk in this
      county manages, about nine a tenday, and it is doing it at an hour
      nobody is watching. The falconer at Cawdry says a goshawk, which is
      possible and is not seen. The yard man says a person, which is more
      likely and is a thing you cannot say about your neighbours without
      evidence. Doves are food and this is four crowns a season.
    interaction:
      kind: choice
      choices:
        - id: sit_up_and_watch
          label: Sit up four nights and find out.
          outcomes:
            - id: it_is_a_goshawk
              weight: 55
              text: >-
                It is a goshawk, seen twice on the fourth morning, and it is
                magnificent and is doing exactly what a goshawk does, and the
                falconer at Cawdry would give six crowns for it and cannot
                catch it either. It moves on in Slaughter. The dovecote is
                fine after that for nine years.
              effects: []
            - id: it_is_a_person
              weight: 45
              text: >-
                It is a cottager's boy of about eleven with a bag, on the third
                night, and he is caught and is terrified and has been feeding
                four people on it since Highsun. What happens next is the low
                justice and the low justice is the house's, and everybody in
                the yard is watching to see which kind of house this is.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -4 }
        - id: net_the_cote
          label: Net the cote and stop asking.
          outcomes:
            - id: netted
              weight: 100
              text: >-
                Two crowns of net over the flight holes and the taking stops
                the same tenday, which is what a net does and which tells
                everybody in this yard exactly what the taking was. Nobody is
                named. Nobody is punished. Four people at the bottom of the
                lane eat worse from that tenday and the house never finds out
                which four.
              effects:
                - { kind: treasury, delta: -2 }

  - id: the_boar_in_the_oats
    title: It Is Not the Wolves This Year
    tier: head
    frequency: common
    weight: 70
    tags: [violence, tenants, harvest, hardship]
    purposes: [buy_patience, change_standing, test_magic_rule]
    slots:
      HEAD: { role: head }
      HUNTER:
        role: family_member
        filters: [{ sex: male }, { status: [alive] }, { age: { op: gte, value: 18 } }, { age: { op: lte, value: 45 } }]
    body: >-
      A boar out of the house's own wood has been in the oats on three
      holdings for a tenday and boar kill people, including well-armed people
      on horses, about once a generation in this province. It is the house's
      wood and therefore the house's boar and therefore the house's problem,
      and everybody at Wick knows the sequence of that sentence perfectly. It
      will not be driven off. {HUNTER} has the dogs ready.
    interaction:
      kind: choice
      choices:
        - id: hunt_it
          label: Hunt it. Four men, the dogs, and this week.
          outcomes:
            - id: killed
              weight: 68
              text: >-
                Two days, four men and a dog lost, and a sow of about nine
                score on the board at Slaughter and the three holdings left
                alone. The province hears about it because the province always
                hears about a boar, and it is worth more to this family than
                the oats were.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: treasury, delta: 4 }
            - id: it_goes_wrong
              weight: 32
              text: >-
                It comes back through the line at the one man who is not
                braced, which is how it always happens, and {HUNTER} is off his
                feet with a thigh opened to the bone and is carried out of that
                wood by four men. The boar is killed by somebody else four
                tendays later. Nobody mentions that part afterwards.
              effects:
                - { kind: attribute, target: { slot: HUNTER }, attr: health, delta: -7 }
                - { kind: treasury, delta: -5 }
        - id: pay_for_the_oats
          label: Pay for the oats and leave the wood alone.
          outcomes:
            - id: paid_for
              weight: 100
              text: >-
                Eleven crowns across three holdings, paid in full at Thaw
                without argument, and a wood nobody goes into for two years and
                a boar that is still in it. It is by some distance the cheapest
                and most sensible answer. It is also a landed family declining
                to hunt, which is a sentence the province turns over for a
                while.
              effects:
                - { kind: treasury, delta: -11 }
                - { kind: respect, delta: -1 }

  - id: the_oxen_and_the_plough_team
    title: Three Crowns Each, and the Whole Year Turns On Them
    tier: head
    frequency: common
    weight: 70
    tags: [tenants, money, harvest, hardship]
    purposes: [buy_patience, change_relationship, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      An ox is three crowns and a plough team is eight of them and there is
      one team on this land that four holdings share, and two of the eight
      have gone lame in the same tenday in the month before Seedmonth. Six
      will not pull a heavy plough through Nethering clay. The house owns the
      team. The four holdings owe the labour-days that make it work.
    interaction:
      kind: choice
      choices:
        - id: buy_two
          label: Buy two. Six crowns and the sowing happens.
          outcomes:
            - id: bought_two
              weight: 100
              text: >-
                Six crowns at the Bramme fair for two beasts that are not
                what the house would have picked with more time, and a team of
                eight in the field on the eighth of Seedmonth, and four
                holdings sown on time. Nobody thanks anybody for a thing that
                simply happened as it was supposed to.
              effects:
                - { kind: treasury, delta: -6 }
        - id: sow_with_six
          label: Sow with six. It will be slower and it will be done.
          outcomes:
            - id: six
              weight: 100
              text: >-
                Six oxen through clay, four tendays instead of two, and two
                of the four holdings sown after the ground has gone past its
                best, and both of them short at Harvest by about what two oxen
                cost. The rent is labour-days, and the labour-days were worked,
                so the hall's book comes out whole and the two holdings eat
                less. The steward does the arithmetic afterwards and says
                nothing.
              # #341: sowing with six cost the hall more coin than buying two
              # AND cost the tenants, a choice no one should ever take. The
              # shortfall falls where the text puts it, on the two holdings.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -10 }

  - id: the_terrier_and_the_barn
    title: Rats, and the One Thing That Works
    tier: family
    frequency: common
    weight: 65
    tags: [dogs, food, servants, household]
    purposes: [buy_patience, change_relationship, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      There is a terrier kept for rats and there has been one at Ardwen for as
      long as the rolls go back, and this one is old and the barn is losing
      about four crowns of grain a season to something a cat will not deal
      with. A good terrier out of a Bramme litter is a crown. The yard man
      would like the old one to see out its time indoors, which is a thing
      terriers are not for.
    interaction:
      kind: narration
      outcomes:
        - id: both
          weight: 100
          text: >-
            A crown for a pup and the old one on a sack by the kitchen fire
            until Thaw, which is exactly what everybody wanted and nobody was
            prepared to propose, and which the yard man arranges himself and
            presents as a fait accompli on a Tuesday morning.
          effects:
            - { kind: treasury, delta: -1 }
            - { kind: relationship, from: household, to: head, sentiment: 6 }

  - id: telling_the_bees_again
    title: Somebody Has to Go to the Hives
    tier: family
    frequency: common
    weight: 70
    tags: [bees, death, custom, signs]
    purposes: [establish_magic_rule, force_record_choice, plant_rumour]
    slots:
      HEAD: { role: head }
      TELLER:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 12 } }]
    body: >-
      When the Head dies somebody goes to the hives before dark and says so,
      plainly, out loud, and the custom is that you must tell them the truth —
      which makes the hives the one place at Ardwen where this family has never
      once been able to use the chronicle's methods. {TELLER} is going. A hive
      that leaves in the following month is the worst domestic omen this world
      has, and two of the six left after the last one.
    interaction:
      kind: choice
      choices:
        - id: tell_them_everything
          label: Tell them the whole of it, as the custom requires.
          outcomes:
            - id: told_whole
              weight: 100
              text: >-
                Six hives told the truth at dusk by somebody of the blood, out
                loud, including the part of it that is not in the chronicle and
                will not be, and the hives stay. Whatever else this family has
                done with its record, it has never lied to the bees, and there
                are people in this household who regard that as the only clean
                thing about it.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: 8 }
        - id: tell_them_the_short_version
          label: Tell them what the chronicle says. It is a custom about bees.
          outcomes:
            - id: told_short
              weight: 100
              text: >-
                The version that is in the chronicle, said at dusk, correctly,
                to six hives, by somebody who knows it is the short version and
                does it anyway. Two of the six are gone by Greening. There is
                no connection and there cannot be a connection and every soul
                in this household draws one.
              effects:
                - { kind: rumour, op: seed, id: rumour_the_hives_that_left, accuracy: 0.5 }
                - { kind: relationship, from: household, to: head, sentiment: -10 }

  - id: the_ladys_merlin_on_the_glove
    title: Ranked by Bird
    tier: family
    frequency: common
    weight: 65
    tags: [hawks, standing, women, custom]
    purposes: [change_relationship, change_standing, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      LADY:
        role: family_member
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 16 } }]
    body: >-
      Hawking is licensed by custom rather than law and is ranked by bird, and
      what a woman carries at a fair says her family's line more precisely than
      anything she is wearing. {LADY} carries a merlin, which is correct for
      this house. Her cousin at Cawdry has been given a peregrine, which is
      not correct for that house and which nobody at Cawdry has corrected. The
      Ingathering fair is in four tendays.
    interaction:
      kind: choice
      choices:
        - id: keep_the_merlin
          label: The merlin is correct. Carry what is correct.
          outcomes:
            - id: merlin
              weight: 100
              text: >-
                A merlin on the glove at the fair, correct at this line, read
                correctly by everybody who reads such things, and a cousin four
                yards away with a bird she is not entitled to being read
                equally correctly. Nobody says anything. Both women know
                exactly what has been said.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: { slot: LADY }, to: head, sentiment: -5 }
        - id: get_her_a_better_bird
          label: Get her a better bird. Nobody has corrected Cawdry either.
          outcomes:
            - id: better_bird
              weight: 62
              text: >-
                Nine crowns for a bird a line above this house's, carried at
                the fair without comment, and nobody corrects anybody because
                correcting is done by stewards with lists and no steward has a
                list about hawks. It works. It works, and it is the first thing
                this family has ever claimed that it is not entitled to.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: relationship, from: { slot: LADY }, to: head, sentiment: 12 }
            - id: somebody_does_correct
              weight: 38
              text: >-
                Nine crowns, and a Warden's steward who says one pleasant
                sentence about birds at the wrong moment in front of the wrong
                four people. Nothing further happens. The bird is not carried
                again and is a very expensive thing in a mews for eleven years.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: respect, delta: -1 }

  - id: the_feral_pack_after_the_winter
    title: Masterless Dogs
    tier: head
    frequency: common
    weight: 70
    tags: [dogs, violence, tenants, hardship]
    purposes: [buy_patience, change_standing, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      After a bad winter the dogs that were somebody's are nobody's, and by
      Greening there are about nine of them working together on the far side
      of the common, which is the closest thing this world produces to a
      monster and is a husbandry failure and nothing else. They have taken
      lambs and a calf. Two of them are recognisable and belonged, until
      Frostfall, to people who are still on this land.
    interaction:
      kind: choice
      choices:
        - id: put_them_down
          label: Put them down. All nine, this tenday, and be seen doing it.
          outcomes:
            - id: put_down
              weight: 100
              text: >-
                Nine dogs in two days by four men with bows, and two of them
                shot in front of the households that used to own them, which
                is the part nobody had thought about and which cannot be
                avoided once it starts. The lambing is saved. Two families do
                not come to the Greening feast.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: household, to: head, sentiment: -8 }
        - id: let_the_parish_do_it
          label: Let the parish deal with its own dogs.
          outcomes:
            - id: parish_deals
              weight: 100
              text: >-
                The parish deals with it over about six tendays, badly, one at
                a time, and loses another nine lambs and a child's leg to a
                bite that goes bad, and the last three are still out there in
                Highsun. Nobody at Wick blames the hall, exactly. Nobody at
                Wick forgets that it was left to them, either.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -12 }
                - { kind: rumour, op: seed, id: rumour_who_dealt_with_the_pack, accuracy: 0.5 }

  - id: the_pigs_go_into_the_wood
    title: Pannage, and the Most Important Animal at Wick
    tier: family
    frequency: common
    weight: 70
    tags: [food, tenants, harvest, custom]
    purposes: [change_relationship, change_standing, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      A pig is the most important animal at Wick and the least dignified: into
      the woodland for pannage in Smoke, killed at Slaughter, eaten all year.
      This year's mast is poor and there is room for about half the usual
      number. The woodward has drawn up an order of who goes in and the order
      is, by any measure, the correct one, and it puts four families who are
      already thin at the bottom of it.
    interaction:
      kind: choice
      choices:
        - id: take_the_woodwards_order
          label: Take his order. He knows the wood and the beasts.
          outcomes:
            - id: his_order
              weight: 100
              text: >-
                The wood carries what it can carry and the pigs that go in come
                out fat, and four families go into Frostfall without a killed
                pig, which is not starvation and is the difference between a
                winter and a bad winter. The order is correct. Everybody
                affected by it knows it is correct.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -6 }
        - id: split_it_by_need
          label: Put the four thinnest first. Take the surplus onto the home ground.
          outcomes:
            - id: by_need
              weight: 100
              text: >-
                Four families get their pigs into the wood, and the surplus
                are turned onto the home demesne. They eat what is left in
                the crofts and root through the beds laid for next year's
                crop. Wick has pork for winter. The house's seed ground
                has been turned over twice.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: 10 }
                - { kind: land, op: damage, parcel: the_home_demesne, magnitude: 2 }

# Plain English alternatives for the horse, mill-cat and dovecote scenes (#1094).
# Reviewed against the Original; mechanics and original words are unchanged.
proseVariants:
  - address: "content:events/beasts.yaml#events[id=the_horse_that_will_not_pass_the_gate].title"
    of: 81e9ffa82e976f44
    plainenglish: >-
      The Horse Refuses the Gate
  - address: "content:events/beasts.yaml#events[id=the_horse_that_will_not_pass_the_gate].body"
    of: 187ddaaef38ee4ea
    plainenglish: >-
      An eight-crown riding horse has passed through the gatehouse four hundred times. For the past
      tenday, it has refused to go through with {RIDER} riding it. It passes without trouble when the
      groom rides it. The groom has no explanation. He says the horse is otherwise healthy and eating
      well.
  - address: "content:events/beasts.yaml#events[id=the_horse_that_will_not_pass_the_gate].interaction.choices[id=sell_the_horse].label"
    of: 2b844b0d5c0dec99
    plainenglish: >-
      Sell the horse at Bramme. It is no use if it will not pass through the gate.
  - address: "content:events/beasts.yaml#events[id=the_horse_that_will_not_pass_the_gate].interaction.choices[id=sell_the_horse].outcomes[id=sold].text"
    of: "0b461d920895a68e"
    plainenglish: >-
      The horse sells for seven crowns at Bramme. The buyer rides through the town gate
      without trouble, and the groom returns with the money and an empty halter. The buyer
      tells the story at Wick.
  - address: "content:events/beasts.yaml#events[id=the_horse_that_will_not_pass_the_gate].interaction.choices[id=give_him_to_the_groom].label"
    of: "72375752729ad58e"
    plainenglish: "Give the horse to the groom in front of the yard."
  - address: "content:events/beasts.yaml#events[id=the_horse_that_will_not_pass_the_gate].interaction.choices[id=give_him_to_the_groom].outcomes[id=kept].text"
    of: "2e6c09e6c12350aa"
    plainenglish: >-
      The groom is given the horse in front of the servants. No replacement is bought. The
      horse keeps working for the groom, who can ride him through the gate. The stable hands
      stop treating him as a bad purchase. The halter stays in the yard.
  - address: "content:events/beasts.yaml#events[id=the_mill_cat].title"
    of: be11378d6125ba71
    plainenglish: >-
      Why Every Mill Cat Has the Same Name
  - address: "content:events/beasts.yaml#events[id=the_mill_cat].body"
    of: 695d0a398bcb3c6d
    plainenglish: >-
      Cats live in halls, mills and churches. They are not pets and are not usually named. Mill cats are
      different: every parish gives its mill cat the same name, and nobody knows why. The mill cat at
      Wick has died at about fourteen years old. The miller has already brought in another cat and given
      it the same name. He would not understand why anyone would question it.
  - address: "content:events/beasts.yaml#events[id=the_mill_cat].interaction.outcomes[id=another_one].text"
    of: 075ff46e25617ee2
    plainenglish: >-
      Within a tenday, the new cat is working in the mill under the same name and doing the same job as
      the last one. Nobody in the parish gives the custom much thought. Yet the name has remained
      unchanged longer than anything else at Wick.
  - address: "content:events/beasts.yaml#events[id=the_dovecote_and_the_hawk].title"
    of: 54a88cc1bffecf35
    plainenglish: >-
      The Dovecote Is Losing Birds
  - address: "content:events/beasts.yaml#events[id=the_dovecote_and_the_hawk].body"
    of: 4a1f9611e0a2452d
    plainenglish: >-
      About nine doves disappear from the dovecote every tenday, more than a local hawk normally takes.
      They vanish when nobody is watching. The falconer at Cawdry thinks it might be a goshawk, although
      no one has seen one. The yard man thinks a person is more likely to be taking the birds, but
      accusing a neighbour requires evidence. The doves are food worth four crowns each season.
  - address: "content:events/beasts.yaml#events[id=the_dovecote_and_the_hawk].interaction.choices[id=sit_up_and_watch].label"
    of: 38b84f31717de3bd
    plainenglish: >-
      Stay up for four nights and find out what is taking the doves.
  - address: "content:events/beasts.yaml#events[id=the_dovecote_and_the_hawk].interaction.choices[id=sit_up_and_watch].outcomes[id=it_is_a_goshawk].text"
    of: d4615997d6983fe3
    plainenglish: >-
      On the fourth morning, they see a magnificent goshawk twice. It is only hunting as goshawks do.
      The falconer at Cawdry would pay six crowns for the bird, but he cannot catch it. The goshawk
      leaves in Slaughter. The dovecote is safe for the next nine years.
  - address: "content:events/beasts.yaml#events[id=the_dovecote_and_the_hawk].interaction.choices[id=sit_up_and_watch].outcomes[id=it_is_a_person].text"
    of: cc336dc18d4ccafd
    plainenglish: >-
      On the third night, they catch a cottager's boy of about eleven carrying a bag. He is terrified.
      He has been using the stolen birds to feed four people since Highsun. What happens next is low
      justice, which belongs to the house. Everyone in the yard watches to see what kind of household
      this is.
  - address: "content:events/beasts.yaml#events[id=the_dovecote_and_the_hawk].interaction.choices[id=net_the_cote].label"
    of: a204d0840ce21b78
    plainenglish: >-
      Put netting over the dovecote and stop investigating.
  - address: "content:events/beasts.yaml#events[id=the_dovecote_and_the_hawk].interaction.choices[id=net_the_cote].outcomes[id=netted].text"
    of: e1f42378b45fdcd4
    plainenglish: >-
      The house spends two crowns on netting over the flight holes, and the birds stop disappearing that
      same tenday. Everyone in the yard understands what was taking them. Nobody is named or punished.
      Four people at the bottom of the lane have less food from then on, and the house never learns who
      they are.
# Plain English alternatives for boar, plough oxen and terrier scenes (#1098).
# Counterparts only: event rules and the Original text remain unchanged.
  - address: "content:events/beasts.yaml#events[id=the_boar_in_the_oats].title"
    of: "3036f5bbdf956f77"
    plainenglish: >-
      This Year, a Boar Is Ruining the Oats
  - address: "content:events/beasts.yaml#events[id=the_boar_in_the_oats].body"
    of: "543393b8a0f3920c"
    plainenglish: >-
      A boar from the house's own wood has been eating oats on three holdings for a tenday. In this
      province, boars kill people about once a generation, even armed riders on horses. The wood
      belongs to the house, so the boar and the trouble it causes are the house's responsibility.
      Everyone at Wick understands that. Nobody has managed to drive it away. {HUNTER} has the dogs
      ready.
  - address: "content:events/beasts.yaml#events[id=the_boar_in_the_oats].interaction.choices[id=hunt_it].label"
    of: "a062255cacfd10b0"
    plainenglish: >-
      Hunt the boar this week with four men and the dogs.
  - address: "content:events/beasts.yaml#events[id=the_boar_in_the_oats].interaction.choices[id=hunt_it].outcomes[id=killed].text"
    of: "e5ae907413c13f30"
    plainenglish: >-
      The hunt takes two days and four men, and one dog dies. A sow weighing about nine score is laid
      on the board at Slaughter. The boar no longer troubles the three holdings. News of the hunt
      spreads through the province, as it always does. That attention is worth more to the family than
      the lost oats.
  - address: "content:events/beasts.yaml#events[id=the_boar_in_the_oats].interaction.choices[id=hunt_it].outcomes[id=it_goes_wrong].text"
    of: "2b19e8f2f670f40e"
    plainenglish: >-
      The boar charges back through the hunting line toward a man who is not braced for it. It knocks
      {HUNTER} down and cuts his thigh to the bone. Four men carry him out of the wood. Somebody else
      kills the boar four tendays later, but nobody mentions that afterward.
  - address: "content:events/beasts.yaml#events[id=the_boar_in_the_oats].interaction.choices[id=pay_for_the_oats].label"
    of: "ecf1e9cbaaad9497"
    plainenglish: >-
      Pay for the ruined oats and leave the boar in the wood.
  - address: "content:events/beasts.yaml#events[id=the_boar_in_the_oats].interaction.choices[id=pay_for_the_oats].outcomes[id=paid_for].text"
    of: "3be5c66a40c70d86"
    plainenglish: >-
      At Thaw, the house pays eleven crowns in full to the three holdings, without arguing. Nobody
      enters the wood for two years, and the boar stays there. Paying is the cheapest and most
      sensible answer. But the landed family has refused to hunt, and people across the province keep
      talking about it.
  - address: "content:events/beasts.yaml#events[id=the_oxen_and_the_plough_team].title"
    of: "17d7fee59bcb0649"
    plainenglish: >-
      The Year's Sowing Depends on Eight Oxen at Three Crowns Each
  - address: "content:events/beasts.yaml#events[id=the_oxen_and_the_plough_team].body"
    of: "9df1c182d48bba46"
    plainenglish: >-
      An ox costs three crowns, and a plough team needs eight. Four holdings share one team owned by
      the house. A month before Seedmonth, two of the eight oxen go lame in the same tenday. The
      remaining six cannot pull a heavy plough through Nethering clay. The four holdings owe the
      labour-days needed to work the team.
  - address: "content:events/beasts.yaml#events[id=the_oxen_and_the_plough_team].interaction.choices[id=buy_two].label"
    of: "5bde2163ec8acc67"
    plainenglish: >-
      Buy two oxen for six crowns so the sowing can go ahead.
  - address: "content:events/beasts.yaml#events[id=the_oxen_and_the_plough_team].interaction.choices[id=buy_two].outcomes[id=bought_two].text"
    of: "a79e34c0294db4cc"
    plainenglish: >-
      The house spends six crowns at the Bramme fair on two oxen it would not have chosen if there had
      been more time. The full team of eight is in the field on the eighth of Seedmonth, and all four
      holdings are sown on time. Nobody thanks the house for something that was supposed to happen
      anyway.
  - address: "content:events/beasts.yaml#events[id=the_oxen_and_the_plough_team].interaction.choices[id=sow_with_six].label"
    of: "47df247dac7bbf91"
    plainenglish: >-
      Sow with the six remaining oxen. It will take longer, but the work will be done.
  - address: "content:events/beasts.yaml#events[id=the_oxen_and_the_plough_team].interaction.choices[id=sow_with_six].outcomes[id=six].text"
    of: "e26e5cdcd2007df8"
    plainenglish: >-
      With six oxen pulling through the clay, ploughing takes four tendays instead of two. Two of the
      four holdings are sown too late, and their Harvest is short by about the price of two oxen. The
      tenants still work every labour-day they owe, so the hall's accounts show nothing missing. The
      two holdings have less to eat. The steward works out the figures afterward and says nothing.
  - address: "content:events/beasts.yaml#events[id=the_terrier_and_the_barn].title"
    of: "1ee00be81a4ac9cc"
    plainenglish: >-
      A Terrier Is the Only Answer to the Rats
  - address: "content:events/beasts.yaml#events[id=the_terrier_and_the_barn].body"
    of: "741c40227fcab3f6"
    plainenglish: >-
      The house has kept a terrier at Ardwen to catch rats for as long as the records go back. The
      current dog is old, and the barn is losing about four crowns' worth of grain each season to
      pests a cat cannot stop. A good terrier pup from a litter at Bramme costs one crown. The yard
      man wants the old dog to spend the rest of its life indoors, though terriers are not usually
      kept for comfort.
  - address: "content:events/beasts.yaml#events[id=the_terrier_and_the_barn].interaction.outcomes[id=both].text"
    of: "5d353b88a3688e7c"
    plainenglish: >-
      The yard man buys a pup for one crown and gives the old terrier a sack beside the kitchen fire
      until Thaw. It is what everyone wanted, though nobody was willing to suggest it. He arranges it
      himself and announces the decision on a Tuesday morning.
  - address: "content:events/beasts.yaml#events[id=telling_the_bees_again].title"
    of: "23adda3d6bd8efa1"
    plainenglish: >-
      Someone Must Go and Tell the Bees
  - address: "content:events/beasts.yaml#events[id=telling_the_bees_again].body"
    of: "fbc8fdfd686c3569"
    plainenglish: >-
      When the Head dies, someone goes to the hives before dark and tells the bees, plainly and
      out loud. By custom you must tell them the truth. That makes the hives the one place at
      Ardwen where this family has never been able to bend the record the way its chronicle
      does. {TELLER} is going. If a hive leaves in the month after a death, it is the worst
      household omen there is. After the last death, two of the six hives left.
  - address: "content:events/beasts.yaml#events[id=telling_the_bees_again].interaction.choices[id=tell_them_everything].label"
    of: "cf45ccf68319b7e2"
    plainenglish: >-
      Tell them everything, as the custom requires.
  - address: "content:events/beasts.yaml#events[id=telling_the_bees_again].interaction.choices[id=tell_them_everything].outcomes[id=told_whole].text"
    of: "bbac4c979363384b"
    plainenglish: >-
      Someone of the blood tells all six hives the truth at dusk, out loud. That includes the
      part that is not in the chronicle and never will be. The hives stay. Whatever else this
      family has done with its records, it has never lied to the bees. Some people in the
      household think that is the only honest thing about it.
  - address: "content:events/beasts.yaml#events[id=telling_the_bees_again].interaction.choices[id=tell_them_the_short_version].label"
    of: "36de362538692c99"
    plainenglish: >-
      Tell them what the chronicle says. It is only a custom about bees.
  - address: "content:events/beasts.yaml#events[id=telling_the_bees_again].interaction.choices[id=tell_them_the_short_version].outcomes[id=told_short].text"
    of: "5755d1310d6f4c95"
    plainenglish: >-
      Someone tells the six hives the chronicle's version at dusk, properly, knowing it is the
      short version and doing it anyway. By Greening, two of the six hives are gone. There is no
      connection, and there cannot be one. Everyone in the household believes there is.
  - address: "content:events/beasts.yaml#events[id=the_ladys_merlin_on_the_glove].title"
    of: "41666e76bd96e89a"
    plainenglish: >-
      A Bird That Shows Rank
  - address: "content:events/beasts.yaml#events[id=the_ladys_merlin_on_the_glove].body"
    of: "4d0569490ba77fd5"
    plainenglish: >-
      Custom, not law, decides who may hunt with hawks, and the rank of a bird shows the rank of
      its owner. At a fair, the bird a woman carries shows her family's standing more exactly
      than anything she wears. {LADY} carries a merlin, which is the right bird for this house.
      Her cousin at Cawdry has been given a peregrine, which is too high for that house, and
      nobody at Cawdry has corrected it. The Ingathering fair is in four tendays.
  - address: "content:events/beasts.yaml#events[id=the_ladys_merlin_on_the_glove].interaction.choices[id=keep_the_merlin].label"
    of: "2732151273f119ce"
    plainenglish: >-
      The merlin is the right bird. Carry the right bird.
  - address: "content:events/beasts.yaml#events[id=the_ladys_merlin_on_the_glove].interaction.choices[id=keep_the_merlin].outcomes[id=merlin].text"
    of: "0d7d50c10feb1fad"
    plainenglish: >-
      She carries a merlin at the fair, which is right for this family, and everyone who
      understands these things reads it correctly. Four yards away, her cousin carries a bird
      she has no right to, and everyone reads that correctly too. Nobody says anything. Both
      women know exactly what has been said.
  - address: "content:events/beasts.yaml#events[id=the_ladys_merlin_on_the_glove].interaction.choices[id=get_her_a_better_bird].label"
    of: "34043513d5904a7f"
    plainenglish: >-
      Get her a better bird. Nobody corrected Cawdry either.
  - address: "content:events/beasts.yaml#events[id=the_ladys_merlin_on_the_glove].interaction.choices[id=get_her_a_better_bird].outcomes[id=better_bird].text"
    of: "d10e964890b5d8d4"
    plainenglish: >-
      Nine crowns buys a bird one rank above this house, and she carries it at the fair. Nobody
      comments. Corrections are made by stewards with lists, and no steward keeps a list about
      hawks. It works. It works, and it is the first thing this family has ever claimed that it
      has no right to.
  - address: "content:events/beasts.yaml#events[id=the_ladys_merlin_on_the_glove].interaction.choices[id=get_her_a_better_bird].outcomes[id=somebody_does_correct].text"
    of: "216a448dc80ae309"
    plainenglish: >-
      It costs nine crowns. Then a Warden's steward makes one polite remark about birds at the
      wrong moment, in front of the wrong four people. Nothing else happens. The bird is never
      carried again. It sits in the mews for eleven years, a very expensive thing.
  - address: "content:events/beasts.yaml#events[id=the_feral_pack_after_the_winter].title"
    of: "dbf4a3595f790b75"
    plainenglish: >-
      Dogs with No Master
  - address: "content:events/beasts.yaml#events[id=the_feral_pack_after_the_winter].body"
    of: "3759b77c32f8d350"
    plainenglish: >-
      After a bad winter, dogs that belonged to someone belong to no one. By Greening about nine
      of them are hunting together on the far side of the common. This is the nearest thing to a
      monster in this world, and it is nothing more than poor care of animals. They have killed
      lambs and a calf. Two of the dogs are known, and until Frostfall they belonged to people
      who still live on this land.
  - address: "content:events/beasts.yaml#events[id=the_feral_pack_after_the_winter].interaction.choices[id=put_them_down].label"
    of: "6168d47548566ef1"
    plainenglish: >-
      Kill them. All nine, this tenday, and be seen doing it.
  - address: "content:events/beasts.yaml#events[id=the_feral_pack_after_the_winter].interaction.choices[id=put_them_down].outcomes[id=put_down].text"
    of: "8199cee581cae3d1"
    plainenglish: >-
      Four men with bows kill the nine dogs in two days. Two of them are shot in front of the
      families that used to own them. Nobody had thought about that, and once it starts it
      cannot be avoided. The lambs are saved. Two families stay away from the Greening feast.
  - address: "content:events/beasts.yaml#events[id=the_feral_pack_after_the_winter].interaction.choices[id=let_the_parish_do_it].label"
    of: "898fd5e906687cbd"
    plainenglish: >-
      Leave the dogs to the parish.
  - address: "content:events/beasts.yaml#events[id=the_feral_pack_after_the_winter].interaction.choices[id=let_the_parish_do_it].outcomes[id=parish_deals].text"
    of: "66ade5a1127e7cdd"
    plainenglish: >-
      The parish deals with it badly, one dog at a time, over about six tendays. It loses nine
      more lambs, and a child loses a leg to a bite that turns bad. The last three dogs are
      still loose at Highsun. Nobody at Wick really blames the hall. Nobody at Wick forgets that
      the hall left it to them, either.
  - address: "content:events/beasts.yaml#events[id=the_pigs_go_into_the_wood].title"
    of: "d06bf233882ba687"
    plainenglish: >-
      Feeding the Pigs in the Wood
  - address: "content:events/beasts.yaml#events[id=the_pigs_go_into_the_wood].body"
    of: "b06816641e113e60"
    plainenglish: >-
      The pig is the most important animal at Wick and the least dignified. In Smoke it goes
      into the woods to feed on fallen nuts, it is killed at Slaughter, and it is eaten all
      year. This year there are few nuts, and the wood can feed only about half the usual number
      of pigs. The woodward has drawn up an order for which pigs go in. By any measure his order
      is the right one, and it puts four families who are already short at the bottom.
  - address: "content:events/beasts.yaml#events[id=the_pigs_go_into_the_wood].interaction.choices[id=take_the_woodwards_order].label"
    of: "5e325a1d86178b41"
    plainenglish: >-
      Follow his order. He knows the wood and the animals.
  - address: "content:events/beasts.yaml#events[id=the_pigs_go_into_the_wood].interaction.choices[id=take_the_woodwards_order].outcomes[id=his_order].text"
    of: "b8930953a8d5b6df"
    plainenglish: >-
      The wood feeds what it can, and the pigs that go in come out fat. Four families go into
      Frostfall without a pig to kill. They will not starve, but it is the difference between a
      winter and a bad winter. The order is right. Everyone it affects knows it is right.
  - address: "content:events/beasts.yaml#events[id=the_pigs_go_into_the_wood].interaction.choices[id=split_it_by_need].label"
    of: "d33843d34cd309b7"
    plainenglish: "Put the four poorest families first and feed the surplus pigs on the home demesne."
  - address: "content:events/beasts.yaml#events[id=the_pigs_go_into_the_wood].interaction.choices[id=split_it_by_need].outcomes[id=by_need].text"
    of: "6b553f003206bc44"
    plainenglish: >-
      The four poorest families get their pigs into the wood. Extra pigs feed on the home
      demesne and damage the seedbeds for next year. Wick has pork for winter, but the house
      ground will yield less.
