# THE KITCHEN, THE STORES AND THE STILL-ROOM.
#
# COMMON. Bread and pottage twice a day at every level, small beer for
# everyone including the children because the water is not trustworthy, salt
# pork after Slaughter, and fresh meat only when something is killed. A great
# house eats more of the same food, not different food.
#
# Half this file is decided by `state` or by nothing at all, and that is
# deliberate. The docket is a finite resource — `attention.test.ts` holds the
# whole game to it — and a hundred new common templates that all stop the
# clock would spend the player's year on the pantry. What a kitchen mostly
# does is happen. The scenes that ask are the ones where the answer is not
# already in the coffer.
events:
  - id: the_brewing_goes_wrong
    title: Four Barrels, and All of Them Sour
    tier: family
    frequency: common
    weight: 80
    tags: [food, servants, money, household]
    purposes: [buy_patience, change_relationship, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      Small beer is what everybody in this house drinks, including the
      children, because the water is not trustworthy and has not been since
      the founding. Four barrels have gone sour in the same tenday, which the
      brewer says is the weather and the cook says is the brewer. The house
      can buy in from the alewife at Wick at four times what it costs to make.
      It can also drink the water for a fortnight and find out who was right.
    interaction:
      kind: choice
      choices:
        - id: buy_from_the_alewife
          label: Buy in from Wick until the next brewing takes.
          outcomes:
            - id: bought_in
              weight: 100
              text: >-
                Nine crowns for a fortnight of somebody else's beer, and an
                alewife who has never sold to the hall before and now has a
                figure in her head about what the hall drinks. The next
                brewing takes. Nobody ever establishes whether it was the
                weather or the brewer.
              effects:
                - { kind: treasury, delta: -9 }
        - id: drink_the_water
          label: Drink the water. It is a fortnight.
          outcomes:
            - id: the_flux
              weight: 58
              text: >-
                Eleven days in and four of the household have the flux,
                including two of the children, and the brewer is vindicated
                in a way that gives him no pleasure at all. It passes. It
                passes at the cost of a fortnight in which nobody in this
                house did any work worth counting.
              effects:
                - { kind: attribute, target: household, attr: health, delta: -3 }
            - id: nothing_happens
              weight: 42
              text: >-
                Nothing whatever happens, the well being better than anybody
                credits it and the fortnight being dry, and the house saves
                nine crowns and learns a wrong lesson it will act on again in
                about forty years.
              effects:
                - { kind: flag, flag: the_house_drank_the_water, set: true }

  - id: the_cook_and_the_second_kitchen
    title: The Cook Has an Opinion About the Bread
    tier: family
    frequency: common
    weight: 75
    tags: [food, servants, household, quarrel]
    purposes: [change_relationship, change_standing, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      Rye in the Nethering, wheat in the south, and the cook has been at
      Ardwen thirty-one years and has views about which of them belongs on
      this board. The steward has costed it: wheat for the high table only is
      six crowns a year and wheat for everybody is nineteen. The cook thinks a
      house that feeds its own people rye and its guests wheat is a house that
      has told its people something. She has not said this to anybody except
      the steward, twice, at length.
    interaction:
      kind: choice
      choices:
        - id: wheat_for_the_hall
          label: Wheat for everybody. One bread on every table.
          outcomes:
            - id: wheat_throughout
              weight: 100
              text: >-
                Nineteen crowns a year and one bread on one board, and the
                indoor servants notice inside a tenday and say nothing about
                it for eleven years and then say something about it at exactly
                the moment it matters most.
              effects:
                - { kind: treasury, delta: -19 }
                - { kind: relationship, from: household, to: head, sentiment: 12 }
        - id: keep_the_two_breads
          label: Two breads. That is how every house in the province does it.
          outcomes:
            - id: two_breads
              weight: 100
              text: >-
                It is how every house in the province does it and it costs six
                crowns and nobody complains, because complaining about bread
                is not a thing a servant on three marks a year does. The cook
                goes on making both. She makes the rye slightly better than
                she has to, for thirty-one years, and nobody notices that
                either.
              effects:
                - { kind: treasury, delta: -6 }

  - id: the_still_room_in_greening
    title: The Still-Room
    tier: family
    frequency: common
    weight: 70
    tags: [medicine, women, household, knowledge]
    purposes: [change_relationship, establish_magic_rule, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      LADY:
        role: family_member
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 18 } }]
    body: >-
      The still-room is where a great house keeps what it knows about bodies,
      and it is kept by women, and none of it is written down anywhere except
      in the hand of whoever kept it last. {LADY} has the keys this year.
      There is a book of receipts in the press that goes back four
      generations, in four hands, and about a third of it is nonsense and
      about a third of it works and nobody has ever separated the two. The
      physician at Bramme would charge three crowns to look at it.
    interaction:
      kind: choice
      choices:
        - id: show_the_physician
          label: Show him the book. Three crowns to know which third is which.
          outcomes:
            - id: he_reads_it
              weight: 100
              text: >-
                Three crowns and an afternoon, and a man who marks nine
                receipts as useful, eleven as harmless and four as things that
                will kill a person in the wrong quantity. He is right about the
                four. He is also carrying, back to Bramme, a very clear
                picture of what this household treats and how often.
              effects:
                - { kind: treasury, delta: -3 }
                - { kind: knowledge, op: grant, flag: knows_which_receipts_work }
                - { kind: attribute, target: household, attr: health, delta: 1 }
        - id: keep_it_in_the_press
          label: Keep it in the press. It has done for four generations.
          outcomes:
            - id: kept
              weight: 100
              text: >-
                It stays where it is and {LADY} adds to it in her own hand,
                which is the fifth, and the proportion of it that works stays
                roughly what it was. The house treats its own and mostly does
                no harm. Nobody outside this hall has any idea what is in that
                press and that is worth something nobody here has priced.
              effects:
                - { kind: relationship, from: { slot: LADY }, to: head, sentiment: 8 }

  - id: what_hangs_in_smoke
    title: What Hangs in Smoke
    tier: family
    frequency: common
    weight: 75
    tags: [food, winter, tenants, household]
    purposes: [buy_patience, change_standing, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      The kill hangs in the smoke room from Slaughter and comes down through
      the winter, and how much of it is left at Thaw is the single most
      reliable measure of how a house has managed itself. This year it is
      gone by Deepwinter, three tendays early, and the steward has been
      counting since Longnight and saying nothing. Somebody is taking it.
      There are eleven people with a reason to be in that room and nine of
      them are indoor servants.
    interaction:
      kind: choice
      # A house with nothing in the coffer cannot buy its way out of a short
      # winter and does not deliberate about it; a house with money buys meat
      # and does not go looking for a thief among nine people it lives with.
      decidedBy:
        state:
          - when: { treasury: { op: lt, value: 140 } }
            take: find_out_who
            because: there is nothing to buy the missing meat back with
          - take: buy_the_difference
      choices:
        - id: buy_the_difference
          label: Buy the difference at Bramme and put a lock on the door.
          outcomes:
            - id: bought_and_locked
              weight: 100
              text: >-
                Fourteen crowns of somebody else's salt pork and a lock that
                the steward keeps, and the taking stops, and nobody is ever
                accused of anything. Nine people know that the house knew.
                That is a more useful thing to have established than a name
                would have been.
              effects:
                - { kind: treasury, delta: -14 }
        - id: find_out_who
          label: Find out who. Eleven people and a short winter.
          outcomes:
            - id: it_was_the_yard_man
              weight: 62
              text: >-
                It was the yard man, who has four at home and a wife who is
                ill, and who does not deny it and does not apologise either.
                He is dismissed, because a house that does not dismiss him
                cannot dismiss anybody. Everybody in the kitchen knew, and
                every one of them will remember that the house asked.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -12 }
            - id: nobody_admits_it
              weight: 38
              text: >-
                Four days of asking and nobody admits anything and the meat is
                still gone, and the house goes into Thaw eating peas and
                saying so. The taking does not resume. The atmosphere in that
                kitchen does not recover for two years.
              effects:
                - { kind: attribute, target: household, attr: health, delta: -1 }
                - { kind: relationship, from: household, to: head, sentiment: -8 }

  - id: honey_and_nothing_else
    title: There Is No Other Sweetener
    tier: family
    frequency: common
    weight: 70
    tags: [food, bees, custom, household]
    purposes: [change_relationship, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      Honey is the only sweetener there is and the hives are the household's
      conscience besides, and this year they have given about a third of what
      they gave last year. The bee-keeper says it is the wet Greening. He also
      says, without being asked and while looking at the middle distance, that
      they have been quieter since the funeral. Nobody in the yard follows up
      on that and everybody in the yard hears it.
    interaction:
      kind: narration
      outcomes:
        - id: a_thin_year
          weight: 100
          text: >-
            A thin year for honey and a thin year for the cakes at Greening,
            and the household eats plainer and does not remark on it, and
            somebody carries the bee-keeper's remark down to Wick inside the
            tenday because a remark like that is worth a drink.
          effects:
            - { kind: rumour, op: seed, id: rumour_what_the_bees_have_been_since, accuracy: 0.3 }

  - id: the_last_of_the_cheese
    title: A Quantity of Bad Cheese
    tier: family
    frequency: common
    weight: 65
    tags: [food, tenants, household, hardship]
    purposes: [buy_patience, change_relationship, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      Rent taken in kind arrives as barley, pigs, and a quantity of cheese
      that the hall will still be working through at Greening, which is the
      standing joke of every house in this province. This year's is worse than
      usual and the cook has said so in terms. There is enough of it to feed
      the household for six tendays and it is not good enough to put in front
      of anybody the house wants to impress.
    interaction:
      kind: choice
      choices:
        - id: eat_it
          label: Eat it. It was paid as rent and it is food.
          outcomes:
            - id: eaten
              weight: 100
              text: >-
                Six tendays of it, and the household eats what the tenants who
                made it eat, which is the whole argument and which the cook
                makes at length and which is entirely correct. Nobody enjoys a
                single meal of it. The rent is in and the books are level and
                that is what a rent in kind is.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -5 }
        - id: send_it_back_down
          label: Send it back down to Wick and buy better.
          outcomes:
            - id: sent_back
              weight: 100
              text: >-
                Six crowns of good cheese out of Bramme and a cartload of the
                other sort going back down the hill in daylight past the
                people who made it. Every farm on that lane understands
                precisely what has been said. Two of them make better cheese
                the following year and one of them never speaks to the
                steward again.
              effects:
                - { kind: treasury, delta: -6 }
                - { kind: respect, delta: -1 }

  - id: the_fast_before_the_hollow_days
    title: Nine Days of Not Much
    tier: family
    frequency: common
    weight: 70
    tags: [church, food, custom, household]
    purposes: [buy_patience, establish_magic_rule, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      The Church asks for a fast through the nine days of the Quieting and
      what it means in practice is no meat, which in Longnight in the
      Nethering is the difference between a household that works and one that
      sits by the fire. Every house in this province keeps it, more or less.
      The cook has laid out both plans on the board. Nobody from the chapter
      house is going to walk eleven miles in that weather to look at anybody's
      table.
    interaction:
      kind: choice
      choices:
        - id: keep_the_fast
          label: Keep it properly. Nine days, no meat, the whole household.
          outcomes:
            - id: kept
              weight: 100
              text: >-
                Nine days of fish, peas and small beer, and a household that
                is slower and colder and knows exactly why, and a keeper at
                Wick who is told about it by one of the maids and mentions it
                once, in the right ear, four years later.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: attribute, target: household, attr: health, delta: -1 }
        - id: keep_it_at_the_high_table
          label: Keep it at the high table. The kitchen eats what it needs to.
          outcomes:
            - id: kept_upstairs
              weight: 100
              text: >-
                The family fasts, the kitchen does not, and everybody in the
                building knows the arrangement inside a day and considers it
                entirely reasonable, which it is. It is also the sort of thing
                that gets described differently by somebody who has left the
                household on bad terms.
              effects:
                - { kind: rumour, op: seed, id: rumour_who_fasted_at_ardwen, accuracy: 0.4 }

  - id: the_orchard_in_a_good_year
    title: More Apples Than Anybody Can Use
    tier: family
    frequency: common
    weight: 70
    tags: [food, tenants, money, harvest]
    purposes: [buy_patience, change_relationship, change_standing]
    slots:
      HEAD: { role: head }
    body: >-
      The orchard has done what an orchard does about twice in a generation
      and there are more apples on the ground than in the trees. Pressed, it
      is cider the house does not need and cannot store past Thaw. Given
      away, it is a thing eleven tenant families remember. Left, it is a
      quantity of rot and a great many wasps, and the woodward has raised it
      twice.
    interaction:
      kind: choice
      choices:
        - id: open_the_orchard
          label: Open the orchard. Anybody from Wick, four days, take what you carry.
          outcomes:
            - id: opened
              weight: 100
              text: >-
                Four days of the whole village in the house's orchard with
                sacks, and children in the trees, and about nine crowns of
                fruit gone that was going to rot anyway. It is the cheapest
                thing this family does all decade and it is spoken of at Wick
                for thirty years, which nobody at Ardwen ever quite believes.
              effects:
                - { kind: treasury, delta: -2 }
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: household, to: head, sentiment: 10 }
        - id: press_it_all
          label: Press the lot. Cider keeps better than goodwill.
          outcomes:
            - id: pressed
              weight: 100
              text: >-
                Two tendays, every hand the house has, and enough cider to
                drown the hall in, of which about half is still drinkable at
                Thaw and the rest is vinegar, which the still-room is glad of.
                The wasps go to somebody else's orchard. Nobody at Wick
                mentions it and nobody at Wick forgets it either.
              effects:
                - { kind: treasury, delta: 7 }
                - { kind: relationship, from: household, to: head, sentiment: -4 }

  - id: the_spice_box
    title: What Is in the Spice Box
    tier: head
    frequency: common
    weight: 65
    tags: [food, money, standing, trade]
    purposes: [change_standing, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      A great house eats more spice than a small one and that is most of what
      the difference on a plate amounts to, and the box at Ardwen has been
      running on the same pepper since about four winters ago. The Anvarine
      agent will take an order at the Ingathering fair for delivery in eleven
      months. Eleven crowns fills the box for four years. An empty spice box
      at a feast is a thing that is tasted rather than seen, which is worse.
    interaction:
      kind: choice
      choices:
        - id: fill_the_box
          label: Fill it. Eleven crowns and four years of not thinking about it.
          outcomes:
            - id: filled
              weight: 100
              text: >-
                Eleven crowns and eleven months, and a box that will see out
                two Heads. The Greening feast tastes like a Greening feast at
                a house three lines above this one, which four of the guests
                notice and none of them mention, which is exactly the correct
                result.
              effects:
                - { kind: treasury, delta: -11 }
                - { kind: respect, delta: 1 }
        - id: make_it_last
          label: Make it last. Nobody has ever complained.
          outcomes:
            - id: made_to_last
              weight: 100
              text: >-
                Nobody has ever complained and nobody ever will, and the two
                feasts a year taste like what a middling house can afford,
                which is what this is. A guest up from Cawdry says the word
                honest about the food, warmly, and means it warmly, and it
                takes the household about four days to work out why it stung.
              effects:
                - { kind: branch, op: slight, amount: 8 }
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_what_the_table_at_ardwen_tastes_of, accuracy: 0.4 }

  - id: the_salt_fish_from_sarrow
    title: Eleven Days East, in Barrels
    tier: family
    frequency: common
    weight: 70
    tags: [food, trade, money, winter]
    purposes: [buy_patience, change_standing, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      Salt fish comes eleven days overland from Sarrow through four hands and
      is what a household in this province eats on every fast day of the year,
      which is a great many days. The drover who brings it has been bringing
      it for nineteen years and is late. He is four tendays late, which has
      never happened, and the fish is the whole of the house's Longnight
      provision.
    interaction:
      kind: narration
      outcomes:
        - id: he_comes_at_last
          weight: 62
          text: >-
            He comes in the second tenday of Frostfall with a broken axle
            behind him and four barrels short, and the shortfall is bought at
            Bramme at Bramme's own idea of a winter price, and the house eats
            fish on the fast days as it always has.
          effects:
            - { kind: treasury, delta: -8 }
        - id: he_does_not_come
          weight: 38
          text: >-
            He does not come at all, that year or any year after, and nobody
            on this road ever learns what happened to him. The house buys at
            Bramme for nineteen years until his son takes up the route, and
            his son does not know the family and prices accordingly.
          effects:
            - { kind: treasury, delta: -14 }
            - { kind: rumour, op: seed, id: rumour_the_drover_who_did_not_come, accuracy: 0.35 }

proseVariants:
  - address: "content:events/the_kitchen.yaml#events[id=the_brewing_goes_wrong].title"
    of: 2775d074752505e0
    plainenglish: >-
      Four Barrels of Sour Beer
  - address: "content:events/the_kitchen.yaml#events[id=the_brewing_goes_wrong].body"
    of: 7801c8f9cb42d03d
    plainenglish: >-
      Everyone in the house, including the children, drinks small beer because the water has
      been unsafe since the founding. Four barrels have gone sour in ten days. The brewer blames
      the weather; the cook blames the brewer. Buying beer from the alewife at Wick costs four
      times as much as brewing it here. The other option is to drink water for two weeks and see
      who was right.
  - address: "content:events/the_kitchen.yaml#events[id=the_brewing_goes_wrong].interaction.choices[id=buy_from_the_alewife].label"
    of: dfad2ed6c6390f5a
    plainenglish: >-
      Buy beer from Wick until the next batch is ready.
  - address: "content:events/the_kitchen.yaml#events[id=the_brewing_goes_wrong].interaction.choices[id=buy_from_the_alewife].outcomes[id=bought_in].text"
    of: f97e956a7cd2161e
    plainenglish: >-
      The house spends nine crowns on two weeks of beer from an alewife who has never supplied
      the hall before. She now knows how much beer the household drinks. The next batch brews
      successfully, but nobody discovers whether the weather or the brewer caused the problem.
  - address: "content:events/the_kitchen.yaml#events[id=the_brewing_goes_wrong].interaction.choices[id=drink_the_water].label"
    of: 7b59d0ba79f46fd6
    plainenglish: >-
      Drink the water for the next two weeks.
  - address: "content:events/the_kitchen.yaml#events[id=the_brewing_goes_wrong].interaction.choices[id=drink_the_water].outcomes[id=the_flux].text"
    of: 8be326f17b3f1b95
    plainenglish: >-
      After eleven days, four people in the household develop the flux, including two children.
      The household accepts that the brewer was right, although he takes no pleasure in it. The
      illness passes, but the house loses two weeks of useful work.
  - address: "content:events/the_kitchen.yaml#events[id=the_brewing_goes_wrong].interaction.choices[id=drink_the_water].outcomes[id=nothing_happens].text"
    of: b760f1fa219f88d6
    plainenglish: >-
      No one falls ill. The well water was safer than anyone expected, and the fortnight was
      dry. The house saves nine crowns, but wrongly concludes that drinking the water is a good
      idea. About forty years later, it will act on that mistaken lesson.

# Reviewed Plain English variants for the remaining kitchen scenes (#415).
  - address: "content:events/the_kitchen.yaml#events[id=the_cook_and_the_second_kitchen].title"
    of: 225af23d43a6d709
    plainenglish: >-
      The Cook Wants Everyone to Eat the Same Bread
  - address: "content:events/the_kitchen.yaml#events[id=the_cook_and_the_second_kitchen].body"
    of: 7a3dd7edcf6a0951
    plainenglish: >-
      People in the Nethering eat rye bread; people in the south eat wheat. The cook has
      worked at Ardwen for thirty-one years and has firm ideas about which bread belongs
      here. The steward has calculated that wheat for the high table costs six crowns a
      year, while wheat for everyone costs nineteen. The cook thinks giving servants rye
      and guests wheat tells the servants what the house thinks of them. She has said this
      only to the steward, twice and at length.
  - address: "content:events/the_kitchen.yaml#events[id=the_cook_and_the_second_kitchen].interaction.choices[id=wheat_for_the_hall].label"
    of: 426047e4b3cfb820
    plainenglish: >-
      Serve wheat bread to everyone, rather than keeping a separate bread for the
      high table.
  - address: "content:events/the_kitchen.yaml#events[id=the_cook_and_the_second_kitchen].interaction.choices[id=wheat_for_the_hall].outcomes[id=wheat_throughout].text"
    of: 7626adf8b924f074
    plainenglish: >-
      The house spends nineteen crowns a year and serves everyone the same bread. The
      indoor servants notice within ten days but say nothing for eleven years. When they
      finally mention it, the timing matters greatly.
  - address: "content:events/the_kitchen.yaml#events[id=the_cook_and_the_second_kitchen].interaction.choices[id=keep_the_two_breads].label"
    of: a361f5d00c3ed7b4
    plainenglish: >-
      Keep serving two kinds of bread. Every house in the province does it.
  - address: "content:events/the_kitchen.yaml#events[id=the_cook_and_the_second_kitchen].interaction.choices[id=keep_the_two_breads].outcomes[id=two_breads].text"
    of: 340867ae0fd7dc02
    plainenglish: >-
      Every house in the province serves two kinds of bread, and doing so costs six crowns.
      The servants do not complain: a servant earning three marks a year cannot easily
      object to the food. The cook keeps making both breads. For thirty-one years she makes
      the rye better than she needs to, and nobody notices.
  - address: "content:events/the_kitchen.yaml#events[id=the_still_room_in_greening].title"
    of: 08b70ce6f515a722
    plainenglish: >-
      The Household's Medicine Book
  - address: "content:events/the_kitchen.yaml#events[id=the_still_room_in_greening].body"
    of: 187ed9f2a5917ba6
    plainenglish: >-
      The still-room holds the household's knowledge about treating illness. Women keep
      that knowledge, and little is written down beyond what each keeper leaves for the
      next. {LADY} holds the keys this year. A book of remedies has been passed down
      through four generations, written by four different women. About one third of the
      remedies are useless and one third work, but nobody has sorted them. The physician at
      Bramme would charge three crowns to examine the book.
  - address: "content:events/the_kitchen.yaml#events[id=the_still_room_in_greening].interaction.choices[id=show_the_physician].label"
    of: 738cbd19089219d5
    plainenglish: >-
      Show the physician the book. Pay three crowns to find out which remedies work.
  - address: "content:events/the_kitchen.yaml#events[id=the_still_room_in_greening].interaction.choices[id=show_the_physician].outcomes[id=he_reads_it].text"
    of: 898e67e7d453e7e3
    plainenglish: >-
      The physician spends an afternoon reading the book for three crowns. He marks nine
      remedies as useful, eleven as harmless and four as dangerous in the wrong amounts. He
      is right about the four dangerous ones. But he returns to Bramme knowing exactly what
      illnesses the household treats and how often.
  - address: "content:events/the_kitchen.yaml#events[id=the_still_room_in_greening].interaction.choices[id=keep_it_in_the_press].label"
    of: 65491ca12037279d
    plainenglish: >-
      Keep the book in its cupboard. The family has used it for four generations.
  - address: "content:events/the_kitchen.yaml#events[id=the_still_room_in_greening].interaction.choices[id=keep_it_in_the_press].outcomes[id=kept].text"
    of: 8ee3027cea13e148
    plainenglish: >-
      The book stays where it is. {LADY} adds notes in her own handwriting, becoming its
      fifth keeper. Roughly the same share of remedies continues to work. The household
      treats its own people and usually causes no harm. Nobody outside the hall knows what
      the book contains, and the family considers that privacy valuable.
  - address: "content:events/the_kitchen.yaml#events[id=what_hangs_in_smoke].title"
    of: a9bc55c84841f144
    plainenglish: >-
      The Winter Meat Is Missing
  - address: "content:events/the_kitchen.yaml#events[id=what_hangs_in_smoke].body"
    of: 2dd5f20bc86e18e7
    plainenglish: >-
      Meat from Slaughter hangs in the smoke room and feeds the household through winter.
      How much is left at Thaw usually shows how carefully the house has managed its
      stores. This year the meat is gone by Deepwinter, three tendays early. The steward
      has counted it since Longnight but said nothing. Someone has been taking it. Eleven
      people have a reason to enter the smoke room, including nine indoor servants.
  - address: "content:events/the_kitchen.yaml#events[id=what_hangs_in_smoke].interaction.choices[id=buy_the_difference].label"
    of: 34b03faa174ad46e
    plainenglish: >-
      Buy replacement meat at Bramme and lock the smoke-room door.
  - address: "content:events/the_kitchen.yaml#events[id=what_hangs_in_smoke].interaction.choices[id=buy_the_difference].outcomes[id=bought_and_locked].text"
    of: bef96cff3030e8cb
    plainenglish: >-
      The house spends fourteen crowns on salt pork from elsewhere and puts a lock on the
      door. The steward keeps the key. The meat stops disappearing and nobody is accused.
      Nine people understand that the house knew someone was taking it. The household finds
      that knowledge more useful than naming a culprit.
  - address: "content:events/the_kitchen.yaml#events[id=what_hangs_in_smoke].interaction.choices[id=find_out_who].label"
    of: 83fba4e93268a695
    plainenglish: >-
      Find out who took the meat. Eleven people had access, and winter is short of food.
  - address: "content:events/the_kitchen.yaml#events[id=what_hangs_in_smoke].interaction.choices[id=find_out_who].outcomes[id=it_was_the_yard_man].text"
    of: cd071c563c50e122
    plainenglish: >-
      The yard man took the meat. He has four people at home and a sick wife. He neither
      denies it nor apologises. The house dismisses him because keeping him would make
      future dismissals harder. Everyone in the kitchen already knew. They will remember
      that the house asked about it.
  - address: "content:events/the_kitchen.yaml#events[id=what_hangs_in_smoke].interaction.choices[id=find_out_who].outcomes[id=nobody_admits_it].text"
    of: d41538b39594a79f
    plainenglish: >-
      After four days of questions, nobody admits taking the meat. It is still missing, so
      the household eats peas at Thaw and openly complains about it. Nobody takes more
      meat, but trust in the kitchen does not recover for two years.
  - address: "content:events/the_kitchen.yaml#events[id=honey_and_nothing_else].title"
    of: 991692dc2bf7e920
    plainenglish: >-
      The Beehives Give Less Honey
  - address: "content:events/the_kitchen.yaml#events[id=honey_and_nothing_else].body"
    of: a52c62a159a11edd
    plainenglish: >-
      Honey is the only sweetener the household has, and people also treat the bees as a
      sign of the house's condition. This year the hives produce about one third as much
      honey as last year. The beekeeper blames the wet Greening. Without being asked, and
      without looking anyone in the eye, he adds that the bees have been quieter since the
      funeral. Everyone in the yard hears him. Nobody asks what he means.
  - address: "content:events/the_kitchen.yaml#events[id=honey_and_nothing_else].interaction.outcomes[id=a_thin_year].text"
    of: fd6d92e8a6ac563c
    plainenglish: >-
      The household has less honey and fewer cakes at Greening. Everyone eats simpler food
      without commenting on it. Someone repeats the beekeeper's remark in Wick within ten
      days, because that kind of story will earn a drink.
  - address: "content:events/the_kitchen.yaml#events[id=the_last_of_the_cheese].title"
    of: dc38582abe6eb3ce
    plainenglish: >-
      Too Much Bad Cheese
  - address: "content:events/the_kitchen.yaml#events[id=the_last_of_the_cheese].body"
    of: 8f8117d50fd4e991
    plainenglish: >-
      Tenants pay some rent in barley, pigs and cheese. The hall receives so much cheese
      that it usually lasts until Greening, a standing joke among houses in the province.
      This year's cheese is worse than usual, and the cook has said so clearly. There is
      enough for six tendays of meals, but it is too poor to serve to important guests.
  - address: "content:events/the_kitchen.yaml#events[id=the_last_of_the_cheese].interaction.choices[id=eat_it].label"
    of: 298d91bdf1bfcb69
    plainenglish: >-
      Eat the cheese. It was paid as rent, and it is food.
  - address: "content:events/the_kitchen.yaml#events[id=the_last_of_the_cheese].interaction.choices[id=eat_it].outcomes[id=eaten].text"
    of: da70278f5ee2b8b3
    plainenglish: >-
      The household eats the cheese for six tendays. The cook argues that the family should
      eat the same cheese as the tenants who made it, and she is right. Nobody enjoys
      eating it. The rent has been collected and the accounts balance, which is what
      payment in goods means.
  - address: "content:events/the_kitchen.yaml#events[id=the_last_of_the_cheese].interaction.choices[id=send_it_back_down].label"
    of: 0218f4f1db7d04a5
    plainenglish: >-
      Send the bad cheese back to Wick and buy better cheese.
  - address: "content:events/the_kitchen.yaml#events[id=the_last_of_the_cheese].interaction.choices[id=send_it_back_down].outcomes[id=sent_back].text"
    of: e61a541aa3c6744e
    plainenglish: >-
      The house buys six crowns' worth of good cheese in Bramme and sends a cartload of bad
      cheese down the hill past the people who made it, in full daylight. Every farm on the
      road understands the insult. Two farms make better cheese the following year. Another
      tenant never speaks to the steward again.
  - address: "content:events/the_kitchen.yaml#events[id=the_fast_before_the_hollow_days].title"
    of: 65925669b3d2740d
    plainenglish: >-
      Nine Days Without Meat
  - address: "content:events/the_kitchen.yaml#events[id=the_fast_before_the_hollow_days].body"
    of: 0b2580414601b215
    plainenglish: >-
      The Church asks households to eat no meat during the nine days of the Quieting. In
      Longnight in the Nethering, going without meat can leave people too cold and tired to
      work. Nearly every house in the province keeps the fast, at least in part. The cook
      has written out two meal plans. Nobody from the chapter house is likely to travel
      eleven miles in this weather to inspect what anyone eats.
  - address: "content:events/the_kitchen.yaml#events[id=the_fast_before_the_hollow_days].interaction.choices[id=keep_the_fast].label"
    of: 76047a4a2fb6a306
    plainenglish: >-
      Keep the fast fully. Nobody in the household eats meat for nine days.
  - address: "content:events/the_kitchen.yaml#events[id=the_fast_before_the_hollow_days].interaction.choices[id=keep_the_fast].outcomes[id=kept].text"
    of: b07079e65567b3a2
    plainenglish: >-
      For nine days everyone eats fish, peas and small beer. The household works more
      slowly and feels colder, and everyone knows why. A maid tells a keeper at Wick that
      the house observed the fast. Four years later, that keeper mentions it to someone
      whose opinion matters.
  - address: "content:events/the_kitchen.yaml#events[id=the_fast_before_the_hollow_days].interaction.choices[id=keep_it_at_the_high_table].label"
    of: 35e81d9cf2d37968
    plainenglish: >-
      Make the family fast at the high table. Let the kitchen staff eat the meat they need.
  - address: "content:events/the_kitchen.yaml#events[id=the_fast_before_the_hollow_days].interaction.choices[id=keep_it_at_the_high_table].outcomes[id=kept_upstairs].text"
    of: 8a0e876ab630804e
    plainenglish: >-
      The family eats no meat, but the kitchen staff do. Everyone in the building knows
      within a day and accepts the arrangement as reasonable. A servant who later leaves on
      bad terms could describe the same arrangement very differently.
  - address: "content:events/the_kitchen.yaml#events[id=the_orchard_in_a_good_year].title"
    of: 1265c96fabe5122b
    plainenglish: >-
      More Apples Than the House Can Use
  - address: "content:events/the_kitchen.yaml#events[id=the_orchard_in_a_good_year].body"
    of: 8cef465eb687b33a
    plainenglish: >-
      About twice in a generation, the orchard produces more apples than the household can
      use. There are more apples on the ground than on the trees. Pressing them would make
      cider the house does not need and cannot keep past Thaw. Giving them away would help
      eleven tenant families, who would remember it. Leaving the fruit to rot would attract
      many wasps. The woodward has already raised the problem twice.
  - address: "content:events/the_kitchen.yaml#events[id=the_orchard_in_a_good_year].interaction.choices[id=open_the_orchard].label"
    of: 41a867d7f93a10fb
    plainenglish: >-
      Open the orchard to Wick for four days. People may take whatever apples they can
      carry.
  - address: "content:events/the_kitchen.yaml#events[id=the_orchard_in_a_good_year].interaction.choices[id=open_the_orchard].outcomes[id=opened].text"
    of: cd03ab7e2be54d5a
    plainenglish: >-
      For four days, people from the whole village come to the orchard with sacks, and
      children climb the trees. They take about nine crowns' worth of fruit that would
      otherwise have rotted. It costs the family little, and people in Wick talk about the
      gift for thirty years. Nobody at Ardwen quite believes the story lasted so long.
  - address: "content:events/the_kitchen.yaml#events[id=the_orchard_in_a_good_year].interaction.choices[id=press_it_all].label"
    of: fd76dbef3c24cf8b
    plainenglish: >-
      Press every apple for cider. Cider is more useful than goodwill.
  - address: "content:events/the_kitchen.yaml#events[id=the_orchard_in_a_good_year].interaction.choices[id=press_it_all].outcomes[id=pressed].text"
    of: 9a41ba85fc612c51
    plainenglish: >-
      The work takes two tendays and everyone the house can spare. They make an enormous
      amount of cider. By Thaw, about half is still drinkable; the rest has turned to
      vinegar, which the still-room can use. The wasps settle in someone else's orchard.
      Nobody in Wick talks about the decision, but nobody forgets it either.
  - address: "content:events/the_kitchen.yaml#events[id=the_spice_box].title"
    of: a8d587e83567ce74
    plainenglish: >-
      The Spice Box Is Running Empty
  - address: "content:events/the_kitchen.yaml#events[id=the_spice_box].body"
    of: dacb9b948ce60378
    plainenglish: >-
      Great houses serve more spices than small houses. Ardwen has been stretching the same
      supply of pepper for about four winters. An agent from Anvary will take an order at
      the Ingathering fair, to be delivered eleven months later. Eleven crowns will fill
      the spice box for four years. Guests notice an empty spice box in the taste of their
      food, even if they cannot see it.
  - address: "content:events/the_kitchen.yaml#events[id=the_spice_box].interaction.choices[id=fill_the_box].label"
    of: 1299439b3e875507
    plainenglish: >-
      Order spices. Eleven crowns will cover the next four years.
  - address: "content:events/the_kitchen.yaml#events[id=the_spice_box].interaction.choices[id=fill_the_box].outcomes[id=filled].text"
    of: 831d3827a6475c53
    plainenglish: >-
      The house pays eleven crowns and receives the spices eleven months later. The full
      box lasts through the rule of two Heads. At the Greening feast, the food tastes like
      that of a house ranked three places higher. Four guests notice, and none of them says
      anything. That is the result the house wanted.
  - address: "content:events/the_kitchen.yaml#events[id=the_spice_box].interaction.choices[id=make_it_last].label"
    of: 8b16319f69bce6fb
    plainenglish: >-
      Make the remaining spices last. No guest has complained.
  - address: "content:events/the_kitchen.yaml#events[id=the_spice_box].interaction.choices[id=make_it_last].outcomes[id=made_to_last].text"
    of: c229a0a6ea4d02b2
    plainenglish: >-
      Nobody complains. At the two yearly feasts, the food tastes like what a house of
      middling standing can afford, which is exactly what this house is. A guest from
      Cawdry warmly calls the food honest. He means it as praise, but the household spends
      four days wondering why it felt insulting.
  - address: "content:events/the_kitchen.yaml#events[id=the_salt_fish_from_sarrow].title"
    of: 717e7d8af93d0336
    plainenglish: >-
      The Salt Fish Arrives Late
  - address: "content:events/the_kitchen.yaml#events[id=the_salt_fish_from_sarrow].body"
    of: 0bcecd93850cd727
    plainenglish: >-
      Salt fish travels eleven days by land from Sarrow, passing through four traders
      before reaching the household. It is the usual food here on the many Church fast
      days. The drover who brings it has used this route for nineteen years. This year he
      is four tendays late, which has never happened before. The entire household's supply
      of fish for Longnight was due with him.
  - address: "content:events/the_kitchen.yaml#events[id=the_salt_fish_from_sarrow].interaction.outcomes[id=he_comes_at_last].text"
    of: 6d829a85e1feaf81
    plainenglish: >-
      The drover arrives in the second tenday of Frostfall. His cart has a broken axle and
      he is four barrels short. The house buys the missing fish at Bramme for Bramme's high
      winter price. The family still eats fish on every fast day, as usual.
  - address: "content:events/the_kitchen.yaml#events[id=the_salt_fish_from_sarrow].interaction.outcomes[id=he_does_not_come].text"
    of: 433ca91e09f347e2
    plainenglish: >-
      The drover never arrives that year or in any later year. Nobody on the road learns
      what happened to him. The house buys fish at Bramme for nineteen years, until the
      drover's son takes over the route. The son does not know the family and charges them
      accordingly.
