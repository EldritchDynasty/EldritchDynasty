# THE BLOOD, AT FULL WEIGHT.
#
# RARE. A tier obligation, not a volume knob: every template here carries a
# Record block, seeds a rumour, and is named in the chronicle forever, and
# every one of them is answered by two accounts that do not agree.
#
# What separates a rare scene from a common one in this file is that the
# family cannot put it back. A wolf-year ends. A roof gets mended. Nothing
# below is over when it stops happening: it is a thing the house will be
# explaining in 1500, and the explanation is whatever the chronicler wrote
# down in the week it happened.
#
# Invariant 1 throughout. Madness lands only on a slot already gated to
# somebody who can express, which is why every scene that deals it casts a
# male, expressing slot and no scene here deals it to a woman under any
# provocation. The women of this family carry and never express, and an event
# that forgets that is a rules patch wearing a story.
events:
  - id: the_year_two_woke
    title: Two in One Year
    tier: family
    frequency: rare
    weight: 130
    tags: [awakening, blood, signs, records]
    purposes: [establish_magic_rule, force_record_choice, test_magic_rule]
    slots:
      HEAD: { role: head }
      # Both natural Awakenings happen in this scene, whichever answer the
      # house gives. Neither man is already awake or declared mundane.
      # Thirty and above belongs to the distinct Late Waking; keep this pair
      # below that boundary. Every outcome commits both Awakenings before cost.
      FIRST:
        role: unwoken
        filters: [{ sex: male }, { status: [alive] }, { canExpress: true }, { declaredMundane: false }, { age: { op: gte, value: 9 } }, { age: { op: lte, value: 29 } }]
      SECOND:
        role: unwoken
        filters:
          - { sex: male }
          - { status: [alive] }
          - { canExpress: true }
          - { declaredMundane: false }
          - { age: { op: gte, value: 9 } }
          - { age: { op: lte, value: 29 } }
          - { relation: not, of: FIRST }
    body: >-
      {FIRST} wakes in Greening and {SECOND} wakes before Slaughter, in the
      same house, in the same year, and there is nothing in any book at Ardwen
      that says this happens. The archivist goes back four hundred years of
      entries in eleven days and finds no second instance anywhere. Both
      are well. Both are watched by everybody in the hall from the second
      week on, and by Frostfall they have both noticed being watched.
    interaction:
      kind: choice
      choices:
        - id: keep_them_together
          label: Keep them both here, where they can be seen.
          outcomes:
            - id: both_at_ardwen
              weight: 62
              text: >-
                Two of them under one roof for nine years, and the house
                learns more about what it is in that time than in the previous
                two centuries, all of it by watching and none of it written
                down properly. They are inseparable until they are not. The
                year they stop speaking, both of them are already past the age
                where any of it can be undone.
              effects:
                - { kind: awakening, target: { slot: FIRST }, forced: false }
                - { kind: awakening, target: { slot: SECOND }, forced: false }
                - { kind: madness, target: { slot: FIRST }, delta: 9 }
                - { kind: madness, target: { slot: SECOND }, delta: 9 }
                - { kind: relationship, from: { slot: SECOND }, to: { slot: FIRST }, sentiment: -18 }
            - id: it_holds
              weight: 38
              text: >-
                Nine years, and nothing goes wrong at all, and the house has
                two expressing men of one generation for the first time since
                the founding. The province notices the second one about four
                years after it stops being deniable.
              effects:
                - { kind: awakening, target: { slot: FIRST }, forced: false }
                - { kind: awakening, target: { slot: SECOND }, forced: false }
                - { kind: madness, target: { slot: SECOND }, delta: 6 }
                - { kind: respect, delta: 2 }
        - id: send_one_out
          label: Send the second to the smaller house before anyone counts.
          outcomes:
            - id: four_miles_off
              weight: 100
              text: >-
                Four miles of bad gravel and a hall with six people in it. At
                the gate, {SECOND} is told that this is for the good of the
                family and not told which part of the family. He is
                perfectly correct about that for the rest of his life. The
                cadet line he founds is the one that asks, two generations later, what
                exactly it was sent away for.
              effects:
                - { kind: awakening, target: { slot: FIRST }, forced: false }
                - { kind: awakening, target: { slot: SECOND }, forced: false }
                - { kind: madness, target: { slot: SECOND }, delta: 4 }
                - { kind: branch, op: slight, amount: 18 }
                - { kind: relationship, from: { slot: SECOND }, to: head, sentiment: -24 }
    record:
      subject: the year two of ours woke
      options:
        record:
          chronicle: >-
            Two of this house woke in one year, in one hall, which is in no
            entry we hold and in no book we have found. Whoever reads this
            after us should know that it is possible and that we did not know
            it was.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: SECOND }, text: woke in the same year and hall as another of the house }
        omit:
          chronicle: null
        embellish:
          chronicle: One of this house woke in Greening, in the ordinary way, at the ordinary age, and there is nothing further to enter for that year.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: SECOND }, text: was of the household and did not wake that year }
          discrepancy:
            id: the_second_waking
            severity: total
            provableBy: [the_church, house_marrow, commons]
    rumour: { id: rumour_two_in_one_year, accuracy: 0.4, spread: 3 }
    accounts: [the_greening_and_the_slaughter, ardwen_archivists_note_on_the_year]

  - id: iron_will_not_hold_an_edge
    title: Nothing in That Room Will Take a Whetstone
    tier: head
    frequency: rare
    weight: 120
    tags: [signs, blood, smith, commons]
    purposes: [establish_magic_rule, plant_rumour, force_record_choice]
    slots:
      HEAD: { role: head }
      KIN:
        role: family_member
        filters: [{ sex: male }, { status: [alive] }, { canExpress: true }, { awakened: true }, { age: { op: gte, value: 15 } }]
    body: >-
      Every blade that spends a night in the east chamber comes out of it
      soft, and it has been true since Slaughter, and the smith at Wick has
      now said so in the alehouse to eleven people. He is not accusing anybody
      of anything and he has a theory, which is worse, because his theory is
      about which room {KIN} sleeps in. Iron is the one thing in this world
      that everybody agrees dulls where the blood is. The house can rebuild
      the room, or it can move a grown man out of his own chamber in front of
      the whole household.
    interaction:
      kind: choice
      choices:
        - id: rebuild_the_room
          label: Rebuild it. New floor, new lintel, and a reason given.
          outcomes:
            - id: rebuilt
              weight: 100
              text: >-
                Thirty-one crowns, a mason, a carpenter and six tendays, and a
                stated reason about damp that is true of every room in this
                house and was never a reason before. The blades come out of it
                soft afterwards exactly as often as they did before. The smith
                stops saying so in the alehouse, which is not the same as
                stopping.
              effects:
                - { kind: treasury, delta: -31 }
                - { kind: rumour, op: seed, id: rumour_the_room_they_rebuilt, accuracy: 0.55 }
        - id: move_him
          label: Move him, and say nothing about why.
          outcomes:
            - id: moved
              weight: 62
              text: >-
                He takes the west chamber without a word and the east one is
                given to a guest within the month, and every blade in it holds
                its edge from that day on. Four people in the household draw
                the correct conclusion inside a year. None of them says it out
                loud, then or ever, and one of them tells a daughter on a
                deathbed in 1191.
              effects:
                - { kind: relationship, from: { slot: KIN }, to: head, sentiment: -12 }
            - id: it_follows_him
              weight: 38
              text: >-
                It follows him. The west chamber goes soft inside a tenday and
                so does the long room when he sits in it, and by Thaw the
                kitchen has stopped putting knives on the board when he eats
                and has not been told to.
              effects:
                - { kind: madness, target: { slot: KIN }, delta: 8 }
                - { kind: rumour, op: seed, id: rumour_the_knives_off_the_board, accuracy: 0.7 }
    record:
      subject: what dulls in the east chamber
      options:
        record:
          chronicle: >-
            Iron went soft in the east chamber and then in whatever room he
            sat in, and it was not the room. Whoever holds this house after us
            should stop rebuilding rooms.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: 'learned the iron went soft in whatever room he sat in, not only the east chamber' }
        omit:
          chronicle: null
        embellish:
          chronicle: The east chamber was found damp at the lintel and was rebuilt, at thirty-one crowns, and the trouble with the blades ended with the damp.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: found the east chamber damp and rebuilt it }
          discrepancy:
            id: the_damp_at_the_lintel
            severity: major
            provableBy: [commons, house_hesk]
    rumour: { id: rumour_what_the_smith_says, accuracy: 0.5, spread: 3 }
    accounts: [the_smiths_account_of_the_edge, the_stewards_note_on_the_damp]

  - id: the_daughter_who_shows_a_sign
    title: She Shows What Only the Men Show
    tier: family
    frequency: rare
    weight: 125
    tags: [signs, blood, marriage, women]
    purposes: [establish_magic_rule, plant_rumour, test_magic_rule]
    slots:
      HEAD: { role: head }
      DAUGHTER:
        role: family_member
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 11 } }, { age: { op: lte, value: 23 } }]
      MIDWIFE: { role: retainer, filters: [{ status: [alive] }, { sex: female }] }
    body: >-
      Milk turns sweet in the dairy on the days {DAUGHTER} works there, and the
      terrier will not go under the settle while she is on it, and the hall has
      been quietly keeping count since Highsun. Every one of those is a sign a
      broker would price, and every one of them is a sign this family has only
      ever seen around men. {MIDWIFE} says what the whole trade says, which is
      that women carry and do not express and that has never once had an
      exception. She says it twice, and the second time she is answering a
      question nobody asked.
    interaction:
      kind: choice
      choices:
        - id: have_her_looked_at
          label: Have the midwife look at her properly, and write down what she finds.
          outcomes:
            - id: nothing_to_find
              weight: 66
              text: >-
                Four days, a great deal of embarrassment, and a written note
                that says an ordinary girl of sixteen in ordinary health. The
                signs go on happening. The note and the signs sit in the same
                press for two hundred years disagreeing with each other, and
                the note is the one the heralds are shown.
              effects:
                - { kind: relationship, from: { slot: DAUGHTER }, to: head, sentiment: -14 }
            - id: she_carries_it
              weight: 34
              text: >-
                What the midwife finds is what the trade has always said she
                would find, which is nothing at all, and what she says at the
                end of the fourth day is that this girl's sons are the thing
                to watch and that she has said so about four girls in her life
                and been right about three.
              effects:
                - { kind: trait, target: { slot: DAUGHTER }, trait: sign_of_the_blood, op: add }
                - { kind: respect, delta: 1 }
        - id: send_her_to_coln
          label: Send her to Coln for a year. Let the counting stop.
          outcomes:
            - id: a_year_away
              weight: 100
              text: >-
                A year at a shrine fifty miles south under the Church's
                protection, which is the most respectable absence available to
                anybody in this kingdom, and a household that stops counting
                because there is nothing in front of it to count. She comes
                back at seventeen and the dairy is normal and the terrier goes
                where it likes. Two of the maids have married out of Wick by
                then and taken the whole of it with them.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: rumour, op: seed, id: rumour_the_year_she_was_away, accuracy: 0.3 }
                - { kind: relationship, from: { slot: DAUGHTER }, to: head, sentiment: -8 }
    record:
      subject: the signs around the girl
      options:
        record:
          chronicle: >-
            The signs were on a daughter of this house and not a son, and the
            midwife found nothing in her, and both of those are true at once
            and we do not know what to do with that.
          effects: []
          claims:
            - { kind: deed, target: { slot: DAUGHTER }, text: showed the signs while the midwife found nothing in her }
        omit:
          chronicle: null
        embellish:
          chronicle: A daughter of this house was examined by the household midwife and found sound and ordinary, and the talk in the dairy was talk.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: trait, target: { slot: DAUGHTER }, trait: sign_of_the_blood, has: false }
          discrepancy:
            id: the_dairy_and_the_terrier
            severity: minor
            provableBy: [commons, house_calder]
    rumour: { id: rumour_the_girl_the_dogs_avoid, accuracy: 0.25, spread: 2 }
    accounts: [what_the_dairymaids_counted, the_midwifes_written_note]

  - id: a_head_at_the_top_of_it
    title: He Is Still Perfectly Reasonable
    tier: head
    frequency: rare
    weight: 130
    tags: [madness, blood, succession, household]
    purposes: [change_relationship, force_record_choice, test_magic_rule]
    slots:
      HEAD: { role: head, filters: [{ sex: male }, { canExpress: true }, { awakened: true }] }
      HEIR:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 18 } }, { relation: not, of: HEAD }]
    body: >-
      He is not raving and he has never raved, and that is the part the
      household cannot explain to anybody outside it. He is perfectly
      reasonable for nine days and on the tenth he gives an order that is
      correct in every particular except the one that matters, and the steward
      has begun writing the orders down before carrying them out. {HEIR} has
      been handed the same problem every generation of this family has been
      handed, and no generation has written down what it did.
    interaction:
      kind: choice
      choices:
        - id: keep_him_in_the_chair
          label: He holds the seal. Steward the orders and say nothing.
          outcomes:
            - id: he_holds_it
              weight: 55
              text: >-
                Eleven more years in the chair with the steward and {HEIR}
                between him and the province, and nobody outside this house
                ever knows, and the house's standing does not slip a line. It
                costs the two of them everything they had left of him.
              effects:
                - { kind: madness, target: { slot: HEAD }, delta: 10 }
                - { kind: relationship, from: { slot: HEIR }, to: head, sentiment: -16 }
                - { kind: respect, delta: 1 }
            - id: an_order_gets_out
              weight: 45
              text: >-
                One order gets past the steward in Ingathering and goes to
                Cawdry over a seal that everybody in that building recognises.
                It is not madness on the face of it. It is only wrong, and
                specifically wrong, in a way that takes four years and an
                advocate to unwind.
              effects:
                - { kind: madness, target: { slot: HEAD }, delta: 14 }
                - { kind: treasury, delta: -38 }
                - { kind: respect, delta: -1 }
        - id: take_it_off_him
          label: Take the seal off him, in the long room, in front of the household.
          outcomes:
            - id: taken
              weight: 100
              text: >-
                He gives it up without one word of argument, which is somehow
                the worst part of the afternoon, and sits at the board for
                four more years as a man everybody defers to about nothing.
                The household saw it done. Nine of them are still alive in
                1180 and every one of them tells it differently.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -12 }
                - { kind: rumour, op: seed, id: rumour_the_seal_taken_in_the_long_room, accuracy: 0.6 }
    record:
      subject: how the seal left his hand
      options:
        record:
          chronicle: >-
            The Head of this house was set aside by his own household in the
            long room, being reasonable to the last, and the seal was carried
            out of the room by somebody else.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: was set aside by his own household and did not lay down the seal by choice }
        omit:
          chronicle: null
        embellish:
          chronicle: The Head of this house laid down the seal in his own time and of his own judgement, being tired, and lived four years after in the honour of the hall.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: laid down the seal of his own judgement }
          discrepancy:
            id: how_the_seal_left_his_hand
            severity: major
            provableBy: [commons, house_ilm, the_church]
    rumour: { id: rumour_the_reasonable_man, accuracy: 0.45, spread: 3 }
    accounts: [the_ninth_day_and_the_tenth, the_hall_servants_telling]

  - id: the_witness_at_the_wall
    title: Somebody Was Standing at the Wall
    tier: head
    frequency: rare
    weight: 120
    tags: [secrecy, commons, blood, custom]
    purposes: [buy_patience, plant_rumour, test_magic_rule]
    slots:
      HEAD: { role: head }
      SEEN:
        role: family_member
        filters: [{ sex: male }, { status: [alive] }, { age: { op: gte, value: 14 } }]
      WITNESS: { role: outsider, filters: [{ status: [alive] }, { age: { op: gte, value: 16 } }] }
    body: >-
      Whatever happened in the yard happened at the hour nobody is meant to be
      in it, and {WITNESS} was at the wall, and there is no version of the
      next hour in which that is undone. He is a carter's man from four
      parishes off with no badge, no land and nowhere in particular to be. He
      has not asked for anything and has not gone down the hill either. {SEEN}
      is standing in the middle of the yard with everybody in the house
      looking at him instead.
    interaction:
      kind: choice
      choices:
        - id: pay_him_off
          label: Pay him, and put him on the road before first light.
          outcomes:
            - id: paid
              weight: 55
              text: >-
                Eleven crowns, a horse he was not expecting and a road out of
                the province, and he takes all three and is gone by dawn and
                is never seen at Wick again. A man paid eleven crowns to leave
                has been told exactly how much what he saw is worth. He tells
                it for the rest of his life, in five counties, for drink.
              effects:
                - { kind: treasury, delta: -11 }
                - { kind: rumour, op: seed, id: rumour_the_man_who_was_paid_to_go, accuracy: 0.65 }
            - id: he_stays_bought
              weight: 45
              text: >-
                Eleven crowns and a road, and he goes east and dies of a fever
                at Sarrow inside four years without having said one word about
                it to anybody, which the house never learns and could not have
                counted on.
              effects:
                - { kind: treasury, delta: -11 }
        - id: the_third_night
          label: Feed him. Let him stay a third night.
          outcomes:
            - id: of_the_household
              weight: 100
              text: >-
                On the third night he becomes of the household, which both
                sides understand perfectly, and he eats at the low table and
                falls under this house's low justice and cannot be asked
                anything by anybody without the house's leave. He is a good
                yard man for thirty-one years. The house has acquired a person
                it would rather not have to explain, which is what the custom
                is for and has always been for.
              effects:
                - { kind: treasury, delta: -3 }
                - { kind: relationship, from: household, to: head, sentiment: 8 }
    record:
      subject: the man at the wall
      options:
        record:
          chronicle: >-
            There was a man at the wall at the wrong hour and he saw what
            there was to see, and this house kept him rather than paid him,
            and he was of our household for thirty-one years afterwards.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: kept the man who saw the wall that night in the household for thirty-one years }
        omit:
          chronicle: null
        embellish:
          chronicle: A carter's man was given the door for two nights in a hard week and went on his road, and there is nothing further in it.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: gave a traveller two nights and no more }
          discrepancy:
            id: the_man_at_the_wall
            severity: major
            provableBy: [commons, the_church]
    rumour: { id: rumour_what_was_seen_from_the_wall, accuracy: 0.4, spread: 3 }
    accounts: [what_the_carters_man_told_in_five_counties, the_ardwen_yard_book]

  - id: the_generation_with_no_son
    title: Not One of Them Woke
    tier: family
    frequency: rare
    weight: 125
    tags: [blood, succession, cadets, marriage]
    purposes: [advance_clause, change_standing, establish_magic_rule]
    slots:
      HEAD: { role: head }
      CADET: { role: cadet, filters: [{ sex: male }, { status: [alive] }, { age: { op: gte, value: 16 } }] }
    body: >-
      Four sons of this generation reached the age and not one of them woke,
      and the archivist has checked the entries twice because that is what the
      archivist is for. There is no fault in it and nowhere to look for one.
      The blood does what the blood does and the family has never had a word
      for a year like this except the year itself. {CADET} is four miles off
      in a hall with six people in it, and {CADET} woke at eleven, in front of
      two witnesses, and everybody in both houses has known that since it
      happened.
    interaction:
      kind: choice
      choices:
        - id: recall_the_cadet
          label: Recall him. The main house needs what he has.
          outcomes:
            - id: recalled
              weight: 100
              text: >-
                He comes up the hill at nineteen with one chest and a
                grievance he is far too well brought up to name, and he is
                seated where his father was never seated. His own hall keeps
                the road it was given and the road is still bad. Everything
                this family does for the next four generations is downstream
                of an afternoon in which one branch was told it had something
                the other one wanted.
              effects:
                - { kind: branch, op: slight, amount: 22 }
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: { slot: CADET }, to: head, sentiment: -10 }
        - id: marry_outward
          label: Marry outward and wait. It has come back before.
          outcomes:
            - id: married_out
              weight: 62
              text: >-
                Two matches in nine years, neither of them what the house
                would have taken in a better decade, and a generation that
                holds the seat on land and manners and nothing else at all.
                The blood comes back in the grandsons. It comes back thinner
                and it comes back.
              effects:
                - { kind: treasury, delta: -22 }
                - { kind: respect, delta: -1 }
            - id: it_does_not_come_back
              weight: 38
              text: >-
                Two matches, nine years, and the grandsons are as mundane as
                their fathers, and the house goes into the following century
                holding an heirloom nobody in it can use and a contract
                nobody in it can answer. The cadet hall four miles off has
                three expressing men in it by then.
              effects:
                - { kind: branch, op: appease, amount: 8 }
                - { kind: respect, delta: -1 }
    record:
      subject: the generation in which nobody woke
      options:
        record:
          chronicle: >-
            Four sons reached the age in this generation and not one of them
            woke, and the entries were checked twice. It has happened once
            before, in 1096, and the house did not write down what it did.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: saw four sons reach their age and not one of them wake }
        omit:
          chronicle: null
        embellish:
          chronicle: The sons of this generation came to their age in the ordinary way and the house was well provided in every particular.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: brought four sons to their age in the ordinary way }
          discrepancy:
            id: the_quiet_generation
            severity: total
            provableBy: [house_marrow, house_calder, the_church]
    rumour: { id: rumour_the_year_nobody_woke, accuracy: 0.35, spread: 2 }
    accounts: [the_cadet_halls_own_reckoning, the_archivists_second_check]

  - id: what_the_hounds_will_not_pass
    title: The Dogs Stop at the Turn
    tier: head
    frequency: rare
    weight: 120
    tags: [signs, dogs, hall, secrecy]
    purposes: [establish_magic_rule, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      KIN:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 14 } }, { relation: not, of: HEAD }]
    body: >-
      The hall hounds will go anywhere in this house and they will not go past
      the turn in the cellar stair, and they have not since Deepwinter. They
      are not frightened. They stop, and they wait, and they look at whoever is
      carrying the light until that person goes on alone or does not. Dogs are
      the one instrument in this house that cannot be bribed, questioned,
      contradicted or entered in a book, and {KIN} has now taken a lamp down
      there three nights running.
    interaction:
      kind: choice
      choices:
        - id: go_down_and_look
          label: Go down. Take two men and a lamp and look at it properly.
          outcomes:
            - id: nothing_down_there
              weight: 48
              text: >-
                Four hours, three men and every stone of it, and there is
                nothing down there but stone, damp, and a drain that goes
                somewhere nobody has ever traced. The dogs still stop at the
                turn. They stop at it for eleven more years and then one
                spring they do not, and nobody can tell you what changed.
              effects:
                - { kind: treasury, delta: -2 }
            - id: the_drain
              weight: 52
              text: >-
                The drain is cut, not worn, and it is cut to a width and a fall
                that has one purpose, and at the bottom of it there is a
                quantity of what the mason from Bramme will describe in a
                deposition in 1211 as ordinary yard waste. He is paid for the
                deposition. He is not lying in it, exactly.
              effects:
                - { kind: treasury, delta: -6 }
                - { kind: rumour, op: seed, id: rumour_the_drain_below_the_stair, accuracy: 0.5 }
        - id: brick_the_turn
          label: Brick the stair below the turn and be done with it.
          outcomes:
            - id: bricked
              weight: 100
              text: >-
                Nine crowns, a morning, and a wall where a stair was, and the
                hounds go everywhere in this house again from the following
                day. Nobody in this family is ever told why the cellar is the
                shape it is. In 1330 somebody unbricks it, because somebody
                always does.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: flag, flag: the_stair_below_the_turn_bricked, set: true }
                - { kind: rumour, op: seed, id: rumour_the_wall_where_a_stair_was, accuracy: 0.45 }
                - { kind: schedule, event: the_mason_reaches_the_turn, inYears: 1 }
    record:
      subject: what is below the turn in the stair
      options:
        record:
          chronicle: >-
            The hounds would not pass the turn in the cellar stair, so we went
            down, and there is a cut drain at the bottom of it with a fall to
            it, and we do not know what this house cut it for.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: went below the cellar turn the hounds refused and found a cut drain there }
        omit:
          chronicle: null
        embellish:
          chronicle: The cellar stair was found unsound below the turn and was walled, at nine crowns, on the mason's own advice.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: walled the cellar stair on the mason's advice }
          discrepancy:
            id: the_stair_below_the_turn
            severity: major
            provableBy: [house_hesk, commons]
    rumour: { id: rumour_where_the_dogs_stop, accuracy: 0.4, spread: 2 }
    accounts: [the_masons_deposition_of_1211, the_kennelmans_own_account]

  - id: the_ninth_night_it_answered
    title: On the Ninth Night, Something Answers
    tier: family
    frequency: rare
    weight: 115
    tags: [church, liturgy, blood, signs]
    purposes: [advance_clause, establish_magic_rule, force_record_choice]
    slots:
      HEAD: { role: head }
      SAYER:
        role: family_member
        filters: [{ sex: male }, { status: [alive] }, { canExpress: true }, { awakened: true }, { age: { op: gte, value: 16 } }]
    body: >-
      The Quieting is said at dusk for nine nights and on the ninth the house
      says it in its own chapel, which the family does perhaps twice in a
      century, and the ninth petition is the one the liturgy gives to the
      congregation to answer. Nobody answers it. It is answered anyway, from
      the far end of the chapel, in the pause where the answer goes, in a voice
      that four people afterwards describe as their own. {SAYER} is holding the
      book and does not close it.
    interaction:
      kind: choice
      choices:
        - id: go_on_to_the_tenth
          label: Go on. There is a tenth petition in the older rite.
          outcomes:
            - id: the_tenth
              weight: 55
              text: >-
                He says the tenth petition into a chapel where nothing at all
                is now happening, and the nothing is the loudest thing anybody
                present has ever stood in. Whatever answered the ninth does not
                answer the tenth. Two of the four present will not enter that
                chapel again in their lives and neither of them gives a reason
                anybody can write down.
              effects:
                - { kind: madness, target: { slot: SAYER }, delta: 16 }
            - id: nothing_further
              weight: 45
              text: >-
                He says the tenth and it is four words of dead language in a
                cold room and nothing whatsoever comes of it, and everybody
                goes to bed, and in the morning it is the sort of thing a
                household agrees without discussion to have imagined.
              effects:
                - { kind: madness, target: { slot: SAYER }, delta: 6 }
        - id: close_the_book
          label: Close the book. Nine is what the Church gives and nine is enough.
          outcomes:
            - id: closed
              weight: 100
              text: >-
                The book shuts on the ninth and the four of them are out of
                the chapel inside a minute and the door is not locked, because
                locking it would be a thing somebody could ask about. The
                house says the Quieting at Bramme every year after that, for
                two hundred and eleven years, without one exception.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_why_they_go_down_to_bramme, accuracy: 0.35 }
    record:
      subject: what answered the ninth petition
      options:
        record:
          chronicle: >-
            The ninth petition was answered in our own chapel by nobody who
            was in it, and four of us heard it, and each of the four says it
            was his own voice.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: heard the ninth petition answered in his own voice by nobody in the chapel }
        omit:
          chronicle: null
        embellish:
          chronicle: The Quieting was said entire in our own chapel on all nine nights, in the proper form, and the house was the better for it.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: said the Quieting entire in the house's own chapel }
          discrepancy:
            id: the_answered_petition
            severity: total
            provableBy: [the_church, house_ilm]
    rumour: { id: rumour_the_voice_in_the_chapel, accuracy: 0.3, spread: 3 }
    accounts: [the_four_who_were_in_the_chapel, the_wick_keepers_marginal_note]

  # THE LATE WAKING (§11, issue #1797). "After 30 — Rare. The Late Waking —
  # always a scripted moment." From thirty a man who can express wakes only
  # here: `rollAwakening` no longer wakes him silently (LATE_WAKING_AGE). The
  # waking is the premise, so every outcome carries it, and it is NATURAL
  # (`forced: false`) — no rite was performed and nothing was paid for it.
  # What the player decides is what the house does with a man it had stopped
  # watching. A man the Head has declared mundane (#1794) is never cast.
  - id: the_late_waking
    title: The Late Waking
    tier: individual
    frequency: rare
    # 1500, measured on 24 Long Lines (seeds 5100-5123, chronicler): 130 fired
    # once in 24 runs, 600 six times, 1500 thirteen times in nine runs, 3000
    # twelve. Something other than weight binds above ~1500 (the rare tier's
    # cooldown and this narrow cast). Thirteen in 24 matches the ~11 silent
    # late wakings `rollAwakening` produced before LATE_WAKING_AGE, so the
    # house loses no late wakings: each is now a scene instead of a log line.
    weight: 1500
    tags: [awakening, blood, signs, records]
    purposes: [establish_magic_rule, force_record_choice, change_relationship]
    slots:
      HEAD: { role: head }
      MAN:
        role: unwoken
        filters:
          - { sex: male }
          - { status: [alive] }
          - { canExpress: true }
          - { declaredMundane: false }
          - { membership: [blood, cadet] }
          - { age: { op: gte, value: 30 } }
          - { relation: not, of: HEAD }
    body: >-
      The dogs come back into the long room in the second week of Frostfall,
      and then they will not stay in it. {MAN} has sat at the low end of that
      table for more than thirty years. Every sign the midwives know went past
      him as a boy, the iron and the milk and the dogs, and nothing came of any
      of it, and in time the house stopped asking. Now the knives on his side
      of the board will not hold an edge, and he sleeps with the shutters open
      in the cold. Nobody wakes this late. The archivist says so, goes to find
      out whether it is true, and comes back quieter, and for the first time in
      twenty years every head at the table turns the same way at supper. The
      house is watching now.
    interaction:
      kind: choice
      choices:
        - id: say_it_aloud
          label: Say it aloud at the table. Thirty years is long enough to wait.
          outcomes:
            - id: woke_late
              weight: 70
              text: >-
                It is said at supper, plainly, and nobody at the table finishes
                eating. Inside the month two houses write to ask whether it is
                true, and the chapter house at Bramme writes to ask how. He
                answers the first letter himself. The house answers the second,
                slowly.
              effects:
                - { kind: awakening, target: { slot: MAN }, forced: false }
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: { slot: MAN }, to: head, sentiment: 12 }
            - id: all_at_once
              weight: 30
              text: >-
                It comes all at once, the way a weir goes, and for a season he
                does not sleep in any room for long. The house says it aloud
                anyway, because half the household has already seen it. What
                the blood held back for thirty years it does not hand over
                gently.
              effects:
                - { kind: awakening, target: { slot: MAN }, forced: false }
                - { kind: madness, target: { slot: MAN }, delta: 12 }
                - { kind: respect, delta: 1 }
        - id: keep_it_within_the_walls
          label: Keep it within the walls until the house knows what it is.
          outcomes:
            - id: kept_quiet
              weight: 100
              text: >-
                The knives are moved, the shutters are fastened, and the house
                goes on as though nothing had happened at the low end of the
                table. He is not a fool. He was waited for until he was
                twenty, forgotten until he was thirty, and hidden inside a
                season, and he notices the difference.
              effects:
                - { kind: awakening, target: { slot: MAN }, forced: false }
                - { kind: relationship, from: { slot: MAN }, to: head, sentiment: -14 }
    record:
      subject: the man who woke past thirty
      options:
        record:
          chronicle: >-
            A man of this house woke past his thirtieth year, long after every
            sign had passed him by as a boy. We had stopped watching him.
            Whoever reads this should not stop so soon.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: MAN }, text: 'woke past his thirtieth year, after the house had stopped watching him' }
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            A son of this house woke in his boyhood, as the blood of this house
            always has, and was kept from the world until he was ready for it.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: MAN }, text: 'woke as a boy, and was kept from the world until he was ready' }
          discrepancy:
            id: the_late_waking_lie
            severity: minor
            provableBy: [the_church, house_marrow]
    rumour: { id: rumour_the_man_who_woke_late, accuracy: 0.6, spread: 2 }
    accounts: [the_low_end_of_the_table, the_bramme_clerks_query]

proseVariants:
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].title"
    of: "74fe74252f509e01"
    plainenglish: >-
      Two Woke in One Year
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].body"
    of: "366df42cd60e1d20"
    plainenglish: "{FIRST} awakens in Greening and {SECOND} before Slaughter, both in the same house and year. The archivist searches four hundred years of entries in eleven days and finds no other example. Both are well. Everyone in the hall watches them from the second week, and by Frostfall both know they are being watched."
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].interaction.choices[id=keep_them_together].label"
    of: "3616fe0a21c10c76"
    plainenglish: >-
      Keep them both here, where they can be watched.
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].interaction.choices[id=keep_them_together].outcomes[id=both_at_ardwen].text"
    of: "86be724c0df6a278"
    plainenglish: >-
      For nine years the two of them live under one roof, and the house learns more about what
      it is than in the previous two centuries, all of it by watching and none of it properly
      written down. They are inseparable until they are not. By the year they stop speaking,
      both are too old for any of it to be undone.
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].interaction.choices[id=keep_them_together].outcomes[id=it_holds].text"
    of: "47e95f9e9d60ab92"
    plainenglish: >-
      Nine years, and nothing goes wrong. For the first time since the house was founded, it has
      two men of one generation who can use the power. The province notices the second one about
      four years after it can no longer be denied.
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].interaction.choices[id=send_one_out].label"
    of: "2210b0db0a30dae7"
    plainenglish: "Send the second to the smaller hall before anyone starts counting."
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].interaction.choices[id=send_one_out].outcomes[id=four_miles_off].text"
    of: "0e251803561a3e17"
    plainenglish: "The family sends {SECOND} to a small hall four miles away, down a bad gravel road, with six people living there. At the gate, he is told it is for the family’s good, but nobody says which part of the family benefits. He remembers that distinction for the rest of his life. Two generations later, the branch he founds asks why it was sent away."
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].record.subject"
    of: "d0bfe497649719fb"
    plainenglish: >-
      the year two of our family woke
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].record.options.record.chronicle"
    of: "dba3fd3d7909b6a1"
    plainenglish: >-
      The power woke in two of this house in one year, in one hall. That is in no record we have
      and no book we have found. Whoever reads this after us should know that it can happen, and
      that we did not know it could.
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].record.options.record.claims[0].text"
    of: "21dbb0f5c1389309"
    plainenglish: >-
      woke in the same year and the same hall as another of the house
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].record.options.embellish.chronicle"
    of: "58c4c204d40cd6f0"
    plainenglish: >-
      The power woke in one of this house in Greening, in the normal way and at the normal age,
      and nothing else needs recording for that year.
  - address: "content:events/rare_blood.yaml#events[id=the_year_two_woke].record.options.embellish.claims[0].text"
    of: "06ad51da5fb9738e"
    plainenglish: >-
      lived in the household and did not wake that year
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].title"
    of: "19b8029e6527326a"
    plainenglish: >-
      No Blade in That Room Stays Sharp
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].body"
    of: "1003ef650687dbc9"
    plainenglish: >-
      Every blade that spends a night in the east bedroom comes out blunt. It has been happening
      since Slaughter, and the smith at Wick has now said so in the alehouse to eleven people.
      He is not accusing anyone, but he has a theory, which is worse, because his theory is
      about which room {KIN} sleeps in. Iron is the one thing everyone in this world agrees goes
      dull where the blood is. The house can rebuild the room, or it can move a grown man out of
      his own bedroom in front of the whole household.
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].interaction.choices[id=rebuild_the_room].label"
    of: "1c37acb634367c02"
    plainenglish: >-
      Rebuild it: new floor, new beam over the door, and an explanation.
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].interaction.choices[id=rebuild_the_room].outcomes[id=rebuilt].text"
    of: "1882c0c8f07595cc"
    plainenglish: >-
      Thirty-one crowns, a mason, a carpenter and six tendays, and an explanation about damp
      that is true of every room in this house and was never a reason before. Afterwards, blades
      come out of that room blunt just as often as before. The smith stops saying so in the
      alehouse, which is not the same as stopping.
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].interaction.choices[id=move_him].label"
    of: "765a9ba4284ad008"
    plainenglish: >-
      Give him another room, and do not explain why.
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].interaction.choices[id=move_him].outcomes[id=moved].text"
    of: "f28fe465969a0641"
    plainenglish: >-
      He moves into the west bedroom without a word, and within the month the east room is given
      to a guest. From that day, every blade in it stays sharp. Within a year, four people in
      the household reach the right conclusion. None of them ever says it out loud, though in
      1191 one of them tells a daughter on their deathbed.
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].interaction.choices[id=move_him].outcomes[id=it_follows_him].text"
    of: "0047b3f5d60aed01"
    plainenglish: >-
      It follows him. Within a tenday blades go blunt in the west bedroom, and in the long room
      whenever he sits there. By Thaw the kitchen has stopped putting knives on the table when
      he eats, without being told to.
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].record.subject"
    of: "0ad7db3033ad6cac"
    plainenglish: >-
      what makes blades go dull in the east bedroom
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].record.options.record.chronicle"
    of: "687fc988967d86c4"
    plainenglish: >-
      Iron went blunt in the east bedroom, and then in whatever room he sat in. It was not the
      room. Whoever runs this house after us should stop rebuilding rooms.
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].record.options.record.claims[0].text"
    of: "9c518c64bfecf440"
    plainenglish: >-
      learned that iron went blunt in whatever room he sat in, not just the east bedroom
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].record.options.embellish.chronicle"
    of: "6f22b761e4bcf775"
    plainenglish: >-
      The east bedroom was found to have damp above the door and was rebuilt for thirty-one
      crowns, and the trouble with the blades ended with the damp.
  - address: "content:events/rare_blood.yaml#events[id=iron_will_not_hold_an_edge].record.options.embellish.claims[0].text"
    of: "2dfd29f6f3d8886a"
    plainenglish: >-
      found damp in the east bedroom and rebuilt it
  - address: "content:events/rare_blood.yaml#events[id=the_daughter_who_shows_a_sign].title"
    of: "38d9b70d30204f19"
    plainenglish: >-
      She Shows Signs Only Men Have Ever Shown
  - address: "content:events/rare_blood.yaml#events[id=the_daughter_who_shows_a_sign].body"
    of: "a444882c75f922f8"
    plainenglish: >-
      On the days {DAUGHTER} works in the dairy, the milk turns sweet. The terrier will not go
      under the bench while she is sitting on it. Since Highsun the hall has been quietly
      keeping count. A matchmaker would put a price on every one of those signs, and this family
      has only ever seen them around men. {MIDWIFE} says what everyone in her trade says: women
      carry the blood but never show the power, and there has never been a single exception. She
      says it twice, and the second time she is answering a question nobody asked.
  - address: "content:events/rare_blood.yaml#events[id=the_daughter_who_shows_a_sign].interaction.choices[id=have_her_looked_at].label"
    of: "a00594c19d91d55d"
    plainenglish: >-
      Have the midwife examine her properly, and write down what she finds.
  - address: "content:events/rare_blood.yaml#events[id=the_daughter_who_shows_a_sign].interaction.choices[id=have_her_looked_at].outcomes[id=nothing_to_find].text"
    of: "9c058a96ccd6f8ca"
    plainenglish: >-
      Four days and a great deal of embarrassment, ending in a written note: an ordinary girl of
      sixteen in ordinary health. The signs keep happening. For two hundred years the note and
      the signs sit in the same cupboard, contradicting each other, and the note is the one
      shown to the heralds.
  - address: "content:events/rare_blood.yaml#events[id=the_daughter_who_shows_a_sign].interaction.choices[id=have_her_looked_at].outcomes[id=she_carries_it].text"
    of: "7f22856ac9d3ab7e"
    plainenglish: >-
      The midwife finds what her trade has always said she would find, which is nothing at all.
      At the end of the fourth day she says it is this girl's sons who need watching. She has
      said that about four girls in her life, and been right about three.
  - address: "content:events/rare_blood.yaml#events[id=the_daughter_who_shows_a_sign].interaction.choices[id=send_her_to_coln].label"
    of: "bbaf7bb77a1356eb"
    plainenglish: >-
      Send her to the shrine at Coln for a year, so the counting stops.
  - address: "content:events/rare_blood.yaml#events[id=the_daughter_who_shows_a_sign].interaction.choices[id=send_her_to_coln].outcomes[id=a_year_away].text"
    of: "fc09c9e79f9fe86b"
    plainenglish: >-
      A year at a shrine fifty miles south, under the Church's protection, is the most
      respectable absence anyone in this kingdom can have. With nothing in front of it to count,
      the household stops counting. She comes back at seventeen. The dairy is normal and the
      terrier goes where it likes. By then two of the maids have married out of Wick and taken
      the whole story with them.
  - address: "content:events/rare_blood.yaml#events[id=the_daughter_who_shows_a_sign].record.subject"
    of: "418f407ab6dd3656"
    plainenglish: >-
      the signs seen around the girl
  - address: "content:events/rare_blood.yaml#events[id=the_daughter_who_shows_a_sign].record.options.record.chronicle"
    of: "4ec7bb2efadfa04a"
    plainenglish: >-
      The signs appeared around a daughter of this house, not a son, and the midwife found
      nothing in her. Both are true at once, and we do not know what to do with that.
  - address: "content:events/rare_blood.yaml#events[id=the_daughter_who_shows_a_sign].record.options.record.claims[0].text"
    of: "652d1af83ff80094"
    plainenglish: >-
      showed the signs, although the midwife found nothing in her
  - address: "content:events/rare_blood.yaml#events[id=the_daughter_who_shows_a_sign].record.options.embellish.chronicle"
    of: "1c4d1772898a6e0e"
    plainenglish: >-
      A daughter of this house was examined by the household midwife and found healthy and
      ordinary, and the talk in the dairy was only talk.
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].title"
    of: "63f3b60e20fe9852"
    plainenglish: >-
      He Still Sounds Perfectly Reasonable
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].body"
    of: "d9c009675926a90b"
    plainenglish: >-
      He does not rave, and he never has, and that is what the household cannot explain to
      anyone outside it. He is perfectly reasonable for nine days. On the tenth he gives an
      order that is right in every detail except the one that matters, and the steward has
      started writing his orders down before carrying them out. {HEIR} now faces the same
      problem every generation of this family has faced, and no generation has ever written down
      what it did.
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].interaction.choices[id=keep_him_in_the_chair].label"
    of: "2f6ec1e597cd9609"
    plainenglish: >-
      He holds the seal. Have the steward check his orders, and say nothing.
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].interaction.choices[id=keep_him_in_the_chair].outcomes[id=he_holds_it].text"
    of: "afc2c19b46ccd58f"
    plainenglish: >-
      Eleven more years as Head, with the steward and {HEIR} standing between him and the
      province. Nobody outside this house ever knows, and the house does not drop a single rank.
      It costs those two everything they had left of him.
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].interaction.choices[id=keep_him_in_the_chair].outcomes[id=an_order_gets_out].text"
    of: "6e6df5d16d29ae05"
    plainenglish: >-
      In Ingathering one order gets past the steward and goes to Cawdry under a seal everyone
      there recognises. It does not look like madness. It is just wrong, wrong in a very
      specific way, and it takes four years and a lawyer to undo.
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].interaction.choices[id=take_it_off_him].label"
    of: "786f06eb293cb8c7"
    plainenglish: >-
      Take the seal from him, in the long room, in front of the household.
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].interaction.choices[id=take_it_off_him].outcomes[id=taken].text"
    of: "16f095d39e487cff"
    plainenglish: >-
      He gives it up without a single word of argument, which is somehow the worst part of the
      afternoon. For four more years he sits at the table as a man everyone defers to about
      nothing. The household watched it happen. In 1180 nine of them are still alive, and each
      tells it differently.
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].record.subject"
    of: "bddff5bda358d281"
    plainenglish: >-
      how the seal was taken from him
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].record.options.record.chronicle"
    of: "f0b378a1055f3eb5"
    plainenglish: >-
      The Head of this house was removed by his own household in the long room, reasonable to
      the very end, and someone else carried the seal out of the room.
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].record.options.record.claims[0].text"
    of: "12288c750b27f689"
    plainenglish: >-
      was removed by his own household and did not give up the seal by choice
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].record.options.embellish.chronicle"
    of: "b714c658321c18e4"
    plainenglish: >-
      The Head of this house gave up the seal in his own time and by his own decision, being
      tired, and lived four more years honoured by the hall.
  - address: "content:events/rare_blood.yaml#events[id=a_head_at_the_top_of_it].record.options.embellish.claims[0].text"
    of: "ae61ae73b2195637"
    plainenglish: >-
      gave up the seal by his own decision
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].title"
    of: "b60da5e2bcd7b5c6"
    plainenglish: >-
      Someone Was Standing by the Wall
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].body"
    of: "eda723db7a65530f"
    plainenglish: >-
      Whatever happened in the yard happened at an hour when nobody should be there. {WITNESS}
      was by the wall, and nothing in the next hour can change that. He is a carter's helper
      from four parishes away, with no badge, no land and nowhere in particular to be. He has
      not asked for anything, and he has not gone back down the hill either. {SEEN} is standing
      in the middle of the yard, but everyone in the house is looking at the man by the wall.
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].interaction.choices[id=pay_him_off].label"
    of: "4ef20cc29497646e"
    plainenglish: >-
      Pay him, and get him on the road before first light.
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].interaction.choices[id=pay_him_off].outcomes[id=paid].text"
    of: "66709c84c969e520"
    plainenglish: >-
      Eleven crowns, a horse he did not expect, and a road out of the province. He takes all
      three, is gone by dawn, and is never seen at Wick again. But a man paid eleven crowns to
      leave has been told exactly how much what he saw is worth. For the rest of his life he
      tells the story in five counties, for drinks.
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].interaction.choices[id=pay_him_off].outcomes[id=he_stays_bought].text"
    of: "85ae4766822c689a"
    plainenglish: >-
      Eleven crowns and a road. He goes east and dies of a fever at Sarrow within four years,
      without ever saying a word about it to anyone. The house never learns this, and could not
      have counted on it.
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].interaction.choices[id=the_third_night].label"
    of: "f04b5cb57a051c19"
    plainenglish: >-
      Feed him, and let him stay a third night.
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].interaction.choices[id=the_third_night].outcomes[id=of_the_household].text"
    of: "23d8cf7b23858657"
    plainenglish: >-
      By custom, on the third night he becomes part of the household, and both sides understand
      that perfectly. He eats at the low table, he falls under this house's own minor courts,
      and nobody can question him without the house's permission. He is a good yard man for
      thirty-one years. The house now has someone it would rather not have to explain, which is
      exactly what the custom is for, and always has been.
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].record.subject"
    of: "563ba6de3614df7a"
    plainenglish: >-
      the man by the wall
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].record.options.record.chronicle"
    of: "83b9179003bea33c"
    plainenglish: >-
      A man was by the wall at the wrong hour and saw what there was to see. This house kept him
      instead of paying him off, and he was part of our household for thirty-one years after.
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].record.options.record.claims[0].text"
    of: "f50e9552503a4f6e"
    plainenglish: >-
      kept the man who was by the wall that night in the household for thirty-one years
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].record.options.embellish.chronicle"
    of: "6065e9a3b12cdb2f"
    plainenglish: >-
      A carter's helper was given shelter for two nights in a hard week and went on his way, and
      there is nothing more to it.
  - address: "content:events/rare_blood.yaml#events[id=the_witness_at_the_wall].record.options.embellish.claims[0].text"
    of: "ef821590e512511c"
    plainenglish: >-
      gave a traveller two nights' shelter and nothing more
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].title"
    of: "ffebea27003c43bb"
    plainenglish: >-
      The Power Woke in None of Them
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].body"
    of: "8ed7eaef2706c633"
    plainenglish: >-
      Four sons of this generation reached the age when the power wakes, and it woke in none of
      them. The archivist has checked the records twice, because that is what the archivist is
      for. Nobody is at fault, and there is nowhere to look for a fault. The blood does what it
      does, and the family has never had a word for a year like this, except the year itself.
      {CADET} lives four miles away in a hall of six people. The power woke in {CADET} at
      eleven, in front of two witnesses, and everyone in both houses has known it ever since.
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].interaction.choices[id=recall_the_cadet].label"
    of: "a33233f64efe53b2"
    plainenglish: >-
      Call him back. The main house needs what he has.
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].interaction.choices[id=recall_the_cadet].outcomes[id=recalled].text"
    of: "2bda06786b4addec"
    plainenglish: >-
      He comes up the hill at nineteen with one chest and a grievance he is far too well brought
      up to mention, and he is seated where his father was never seated. His own hall keeps the
      road it was given, and the road is still bad. For four generations, everything this family
      does follows from one afternoon when one branch was told it had something the other branch
      wanted.
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].interaction.choices[id=marry_outward].label"
    of: "e0a2e1e5eab0c879"
    plainenglish: >-
      Marry outside the family and wait. It has come back before.
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].interaction.choices[id=marry_outward].outcomes[id=married_out].text"
    of: "651565a2d4c58da6"
    plainenglish: >-
      Two marriages in nine years, neither of them one the house would have accepted in a better
      decade. This generation holds its place on land and good manners and nothing else. The
      blood comes back in the grandsons. It comes back weaker, but it comes back.
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].interaction.choices[id=marry_outward].outcomes[id=it_does_not_come_back].text"
    of: "d4129cc6a8e8bb4a"
    plainenglish: >-
      Two marriages in nine years, and the grandsons are as ordinary as their fathers. The house
      goes into the next century holding a family treasure nobody in it can use and a pact
      nobody in it can answer. By then the branch hall four miles away has three men in it who
      can use the power.
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].record.subject"
    of: "72137c23189ea18f"
    plainenglish: >-
      the generation in which the power woke in nobody
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].record.options.record.chronicle"
    of: "097fffe0b4027eac"
    plainenglish: >-
      Four sons of this generation reached the age, and the power woke in none of them. The
      records were checked twice. It has happened once before, in 1096, and the house did not
      write down what it did.
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].record.options.record.claims[0].text"
    of: "bd50aa462ee8cc0a"
    plainenglish: >-
      saw four sons reach the age, and the power wake in none of them
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].record.options.embellish.chronicle"
    of: "8e53d8a81cda8abc"
    plainenglish: >-
      The sons of this generation came of age in the normal way, and the house was well provided
      for in every respect.
  - address: "content:events/rare_blood.yaml#events[id=the_generation_with_no_son].record.options.embellish.claims[0].text"
    of: "6449aa9a7a53d28e"
    plainenglish: >-
      raised four sons to the age in the normal way
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].title"
    of: "0417830c9ea641b0"
    plainenglish: >-
      The Dogs Stop at the Bend in the Stairs
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].body"
    of: "2abcb9827ff3dcc6"
    plainenglish: >-
      The hall hounds will go anywhere in this house except past the bend in the cellar stairs,
      and they have not gone past it since Deepwinter. They are not frightened. They stop, wait,
      and look at whoever is carrying the light, until that person goes on alone or does not.
      Dogs are the one thing in this house that cannot be bribed, questioned, argued with or
      written into a book. {KIN} has now taken a lamp down there three nights in a row.
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].interaction.choices[id=go_down_and_look].label"
    of: "c00d9ce11dff4ddd"
    plainenglish: >-
      Go down. Take two men and a lamp and look properly.
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].interaction.choices[id=go_down_and_look].outcomes[id=nothing_down_there].text"
    of: "386b08540a62d6f8"
    plainenglish: >-
      Four hours, three men, and every stone checked. There is nothing down there but stone,
      damp, and a drain that leads somewhere nobody has ever followed. The dogs still stop at
      the bend. They stop there for eleven more years, and then one spring they do not, and
      nobody can say what changed.
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].interaction.choices[id=go_down_and_look].outcomes[id=the_drain].text"
    of: "217e7c60a14c8dd4"
    plainenglish: >-
      The drain was cut on purpose, not worn by water, and its width and slope are made for one
      purpose only. At the bottom is a quantity of something that the mason from Bramme, in a
      sworn statement in 1211, will call ordinary yard waste. He is paid for the statement. He
      is not exactly lying in it.
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].interaction.choices[id=brick_the_turn].label"
    of: "cfe9c4d4317deda8"
    plainenglish: >-
      Brick up the stairs below the bend and be done with it.
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].interaction.choices[id=brick_the_turn].outcomes[id=bricked].text"
    of: "c8bc810c3559f148"
    plainenglish: >-
      Nine crowns and a morning, and where there was a staircase there is a wall. From the next
      day, the hounds go everywhere in the house again. Nobody in this family is ever told why
      the cellar is shaped the way it is. In 1330 someone knocks the wall down, because someone
      always does.
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].record.subject"
    of: "7942d4efc7f360b3"
    plainenglish: >-
      what lies below the bend in the stairs
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].record.options.record.chronicle"
    of: "da4d0a9bc68fd447"
    plainenglish: >-
      The hounds would not go past the bend in the cellar stairs, so we went down. At the bottom
      is a drain, cut with a slope, and we do not know what this house cut it for.
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].record.options.record.claims[0].text"
    of: "e7aa4f5dc4ff3c81"
    plainenglish: >-
      went below the bend in the cellar stairs that the hounds refused to pass, and found a cut
      drain
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].record.options.embellish.chronicle"
    of: "2c0195d2adb2ca0e"
    plainenglish: >-
      The cellar stairs were found unsafe below the bend and were walled up for nine crowns, on
      the mason's own advice.
  - address: "content:events/rare_blood.yaml#events[id=what_the_hounds_will_not_pass].record.options.embellish.claims[0].text"
    of: "7d830de5b952b6b1"
    plainenglish: >-
      walled up the cellar stairs on the mason's advice
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].title"
    of: "a6fdc4338d40ffcf"
    plainenglish: >-
      On the Ninth Night, Something Answered
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].body"
    of: "64296bf41003fef0"
    plainenglish: >-
      The Quieting prayer is said at dusk for nine nights. On the ninth, the house says it in
      its own chapel, which the family does maybe twice a century. The ninth petition is the one
      where the people present are meant to answer. Nobody answers it. It is answered anyway,
      from the far end of the chapel, in the pause where the answer belongs, in a voice that
      four people later describe as their own. {SAYER} is holding the book, and does not close
      it.
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].interaction.choices[id=go_on_to_the_tenth].label"
    of: "9ed228c88112f11c"
    plainenglish: >-
      Keep going. The older form of the prayer has a tenth petition.
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].interaction.choices[id=go_on_to_the_tenth].outcomes[id=the_tenth].text"
    of: "23b6117f2bfb1b8b"
    plainenglish: >-
      He says the tenth petition into a chapel where nothing at all is happening now, and that
      nothing is the loudest thing anyone there has ever stood in. Whatever answered the ninth
      does not answer the tenth. Two of the four will never enter that chapel again as long as
      they live, and neither gives a reason anyone could write down.
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].interaction.choices[id=go_on_to_the_tenth].outcomes[id=nothing_further].text"
    of: "b5c589a4c8e4a390"
    plainenglish: >-
      He says the tenth: four words of a dead language in a cold room. Nothing at all comes of
      it, and everyone goes to bed. By morning it is the kind of thing a household agrees,
      without discussing it, that it imagined.
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].interaction.choices[id=close_the_book].label"
    of: "dee8de940b215c80"
    plainenglish: >-
      Close the book. The Church gives nine, and nine is enough.
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].interaction.choices[id=close_the_book].outcomes[id=closed].text"
    of: "f7d80301d4899215"
    plainenglish: >-
      The book shuts at the ninth, and all four of them are out of the chapel within a minute.
      The door is not locked, because locking it would be something people could ask about. From
      then on the house says the Quieting at Bramme every year, for two hundred and eleven
      years, without a single exception.
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].record.subject"
    of: "9ddaffe21f773f8e"
    plainenglish: >-
      what gave the answer to the ninth petition
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].record.options.record.chronicle"
    of: "018bb0c94d4f0acd"
    plainenglish: >-
      In our own chapel the ninth petition was answered by nobody who was there. Four of us
      heard it, and each of the four says it was his own voice.
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].record.options.record.claims[0].text"
    of: "0a394a8e0798f3ba"
    plainenglish: >-
      heard the ninth petition answered, in his own voice, by nobody in the chapel
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].record.options.embellish.chronicle"
    of: "1913a70cd4f219b0"
    plainenglish: >-
      The whole Quieting was said in our own chapel on all nine nights, in the proper form, and
      the house was better for it.
  - address: "content:events/rare_blood.yaml#events[id=the_ninth_night_it_answered].record.options.embellish.claims[0].text"
    of: "aff73cafbfa4f1e3"
    plainenglish: >-
      said the whole Quieting in the house's own chapel
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].title"
    of: "47634683511fb33f"
    plainenglish: >-
      The Late Awakening
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].body"
    of: "90c1ccbc040b7298"
    plainenglish: >-
      In the second week of Frostfall the dogs come back into the long room,
      and then they will not stay there. {MAN} has sat at the far end of that
      table for more than thirty years. As a boy he showed none of the signs
      the midwives look for: the dull iron, the sweet milk, the restless dogs.
      Nothing happened, and after a while the family stopped asking. Now the
      knives near him will not stay sharp, and he sleeps with the shutters
      open in the cold. Nobody awakens this late. The archivist says so, goes
      to check whether that is true, and comes back quieter. For the first
      time in twenty years, everyone at supper looks at him. The family is
      watching him now.
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].interaction.choices[id=say_it_aloud].label"
    of: "56e51126dcbf3e3a"
    plainenglish: >-
      Announce it at the table. Thirty years is long enough to wait.
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].interaction.choices[id=say_it_aloud].outcomes[id=woke_late].text"
    of: "812c6858fee25e4c"
    plainenglish: >-
      It is announced at supper, and nobody at the table finishes eating.
      Within a month two houses write to ask whether it is true, and the
      Church chapter house at Bramme writes to ask how. He answers the first
      letter himself. The family takes its time answering the second.
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].interaction.choices[id=say_it_aloud].outcomes[id=all_at_once].text"
    of: "e37eacaff190d143"
    plainenglish: >-
      The power arrives all at once, like a dam breaking, and for a season he
      cannot sleep in any room for long. The family announces it anyway,
      because half the household has already seen it. The blood held this back
      for thirty years, and it does not arrive gently.
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].interaction.choices[id=keep_it_within_the_walls].label"
    of: "5e6b01b445c42000"
    plainenglish: >-
      Keep it secret inside the house until the family understands it.
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].interaction.choices[id=keep_it_within_the_walls].outcomes[id=kept_quiet].text"
    of: "a1af1391a5e40e75"
    plainenglish: >-
      The knives are moved, the shutters are closed, and the family carries on
      as if nothing had happened. He is not a fool. The family waited for him
      until he was twenty, forgot him until he was thirty, and then hid him
      within a season. He notices the difference.
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].record.subject"
    of: "bf42bdb2966b7a76"
    plainenglish: >-
      the man who awakened after age thirty
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].record.options.record.chronicle"
    of: "0a1d10a7ea91c643"
    plainenglish: >-
      A man of this family awakened after his thirtieth year, long after he
      had shown no signs as a boy. We had stopped watching him. Whoever reads
      this should not give up so soon.
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].record.options.record.claims[0].text"
    of: "b9a77fd346369227"
    plainenglish: >-
      awakened after his thirtieth year, after the family had stopped watching
      him
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].record.options.embellish.chronicle"
    of: "a73df1d1fcb860f5"
    plainenglish: >-
      A son of this family awakened as a boy, as the family blood always does,
      and was kept out of public view until he was ready.
  - address: "content:events/rare_blood.yaml#events[id=the_late_waking].record.options.embellish.claims[0].text"
    of: "18622f38b37484fc"
    plainenglish: >-
      awakened as a boy, and was kept out of public view until he was ready
