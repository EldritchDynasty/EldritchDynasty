  - id: the_widow_who_declines
    title: A Widow's Year, and Then She Says No
    tier: head
    frequency: rare
    weight: 115
    tags: [marriage, kin, standing, custom]
    purposes: [buy_patience, change_relationship, change_standing]
    slots:
      HEAD: { role: head }
      WIDOW:
        role: family_member
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 24 } }, { age: { op: lte, value: 48 } }]
    body: >-
      A widow's year is a year, and after it remarriage is expected rather
      than permitted, and a widow who declines is doing something legible to
      absolutely everybody. {WIDOW} has declined. She has declined three
      offers, one of them from a house two lines above this one, and she has
      given the same four words each time and has never given a fifth. She
      holds her dower in this house for life and cannot be moved out of it by
      anybody, which is the law and is why the law was written.
    interaction:
      kind: choice
      choices:
        - id: back_her
          label: Back her. Say so at Greening in front of the province.
          outcomes:
            - id: backed
              weight: 100
              text: >-
                Said at the Greening board with ninety people in the room, in
                one sentence, and not explained afterwards to anybody who
                asked. Two houses stop calling. One house starts. She runs the
                indoor side of this hall for twenty-six more years and is the
                reason four of its worst decades are survivable, and none of
                that is in any entry anywhere.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: relationship, from: { slot: WIDOW }, to: head, sentiment: 24 }
                - { kind: relationship, from: household, to: head, sentiment: 10 }
        - id: press_her
          label: Press her. A dower held for life against a house two lines above us.
          outcomes:
            - id: pressed
              weight: 55
              text: >-
                She marries the fourth offer in the second year and goes, with
                her dower, to a house two lines above this one, and the
                alliance is real and holds for forty years and is worth
                everything the family said it would be worth. She writes at
                Thaw. The letters are correct and warm and there is nothing in
                any of them.
              effects:
                - { kind: respect, delta: 2 }
                - { kind: treasury, delta: 30 }
                - { kind: relationship, from: { slot: WIDOW }, to: head, sentiment: -28 }
            - id: she_holds
              weight: 45
              text: >-
                She does not marry and does not leave and cannot be made to do
                either, and the pressing goes on for four years in a hall of
                fourteen people who all hear all of it. The province works out
                what is happening at Ardwen inside two seasons, because a
                province always does, and the version it settles on is worse
                than the truth and closer to it than the family would like.
              effects:
                - { kind: respect, delta: -2 }
                - { kind: relationship, from: household, to: head, sentiment: -18 }
                - { kind: rumour, op: seed, id: rumour_what_they_did_to_the_widow, accuracy: 0.6 }
    record:
      subject: the widow, and what was done about her
      options:
        record:
          chronicle: >-
            She declined three offers with the same four words and this house
            pressed her for four years in front of its own household, and she
            did not move.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: pressed the widow to remarry for four years after she refused three offers }
        omit:
          chronicle: null
        embellish:
          chronicle: A widow of this house kept her year and then her own counsel, and was maintained in her dower with the household's whole goodwill.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: maintained the widow in her dower with the household's goodwill }
          discrepancy:
            id: how_the_widow_was_treated
            severity: major
            provableBy: [commons, house_calder, the_church]
    rumour: { id: rumour_the_widow_at_ardwen, accuracy: 0.55, spread: 3 }
    accounts: [the_widows_four_words, what_two_houses_stopped_calling_about]

  - id: the_ward_who_grew_up_here
    title: She Has Been in This Hall Since She Was Six
    tier: head
    frequency: rare
    weight: 120
    tags: [kin, secrecy, marriage, rival]
    purposes: [buy_patience, change_relationship, test_magic_rule]
    slots:
      HEAD: { role: head }
      WARD:
        role: outsider
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 16 } }, { age: { op: lte, value: 24 } }]
    body: >-
      {WARD} came here at six to hold an alliance that the house that sent her
      no longer needs, and she is nineteen now, and she has eaten at this
      board through every winter of her life and been in every room of this
      house without anybody thinking about it once. Her own family has written
      to ask for her back. She knows this household the way somebody knows a
      house they grew up in, which is to say completely and without ever
      having been told anything.
    interaction:
      kind: choice
      choices:
        - id: marry_her_in
          label: Marry her in. She is one of ours in everything but the entry.
          outcomes:
            - id: married_in_ward
              weight: 100
              text: >-
                A match inside the household, a letter to Cawdry that is
                courteous and final, and a woman of nineteen who becomes a
                woman of this family with a marriage entry to prove it. Her
                own house is insulted for a generation and says so twice. What
                she knows is now inside the wall permanently, which is the
                whole of why it was done, and she understands that perfectly
                and marries him anyway.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: treasury, delta: -30 }
                - { kind: knowledge, op: grant, flag: knows_the_ward_was_married_in }
        - id: send_her_home
          label: Send her home. She was a ward and the ward is over.
          outcomes:
            - id: sent_home
              weight: 55
              text: >-
                Thirteen years, one cart, and a woman who is home in four days
                in a house she does not remember, with everything she knows
                about this one, and nobody at Ardwen has ever asked what that
                is. She marries at Cawdry in two years. She is asked about
                Ardwen at every table she sits at for the rest of her life and
                answers courteously and briefly, and never once badly.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_what_the_ward_could_tell_them, accuracy: 0.35 }
            - id: she_talks
              weight: 45
              text: >-
                Thirteen years, one cart, and a woman who is asked about
                Ardwen at every table she sits at and who, at one of them, in
                the fourth year, in company, answers a question properly
                rather than briefly. It is not malice and it is not even
                indiscretion. It is a thing she saw when she was eleven and
                has never had a reason to think unusual.
              effects:
                - { kind: respect, delta: -1 }
    record:
      subject: the ward, and where she went
      options:
        record:
          chronicle: >-
            The ward who came to us at six went home at nineteen with
            thirteen years of this household in her head, and nobody here ever
            asked her what she had seen in it.
          effects: []
          claims:
            - { kind: deed, target: { slot: WARD }, text: went home at nineteen after thirteen years in this household }
        omit:
          chronicle: null
        embellish:
          chronicle: The ward was returned to her family at nineteen in health and learning, with the alliance kept whole on both sides and thanks given.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: WARD }, text: was returned to her family with the alliance kept whole }
          discrepancy:
            id: how_the_ward_left
            severity: major
            provableBy: [house_calder, commons]
    rumour: { id: rumour_thirteen_years_in_that_hall, accuracy: 0.45, spread: 2 }
    accounts: [the_wards_own_answer_at_table, the_letter_from_her_family]
