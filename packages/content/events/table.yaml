# THE TABLE AND THE LADDER (core/src/table.ts, core/src/ascension.ts).
#
# Standing orders and rungs are simulation: a term of tutoring is a number and
# a year, and a rung is a gate. These are the scenes they happen in. Without
# them the player reads that a child "finished the term" and never once meets
# the tutor.
#
# COMMON, for the reason `assize.yaml` gives: the uncommon cooldown is global
# to its tier and texture belongs where there is no cooldown at all.
events:
  - id: the_house_decides_for_him
    title: Before He Is Old Enough to Ask
    tier: individual
    frequency: common
    weight: 60
    tags: [table, tutor, money]
    purposes: [buy_patience, change_relationship, change_standing]
    # The `tutor` effect (issue #128), unprompted by any standing order — the
    # door §13 shipped with was the player's own, and a house does not wait
    # to be told twice that a child is worth the money.
    slots:
      HEAD: { role: head }
      CHILD:
        role: child
        filters: [{ inTerm: false }, { age: { op: gte, value: 6 } }, { age: { op: lte, value: 14 } }]
    body: >-
      Nobody asks {CHILD} first. {HEAD} decides it the way the house decides
      anything that costs money — at the table, without the child in the
      room — and the tutor arrives before {CHILD} understands what has just
      been agreed to.
    interaction:
      kind: narration
      outcomes:
        - id: begun
          weight: 100
          text: >-
            {CHILD} takes to it, or does not, and either way it is eight
            years now spoken for that were nobody's to spend but the house's.
          effects:
            - { kind: tutor, target: { slot: CHILD }, attr: mind, op: begin }

  - id: the_term_begins
    title: Forty Crowns and a Winter
    tier: individual
    frequency: common
    weight: 110
    tags: [table, tutor, money]
    purposes: [buy_patience, change_relationship, worldbuild_through_action]
    # PUPIL is filtered `inTerm: true` (issue #128): before the tutor Effect
    # and the steward's own diligence, 0 terms ever completed in a played
    # batch and this fired on any child in the house regardless — the scene
    # about paying a tutor, in 88% of runs, for a system that never ran.
    slots:
      PUPIL: { role: child, filters: [{ inTerm: true }, { age: { op: gte, value: 9 } }] }
      TUTOR: { role: tutor, optional: true }
    body: >-
      Forty crowns buys a full term and the man who comes for it wants half up
      front, in the hall, counted out where the household can hear it. That is
      the part {PUPIL} will remember: not the lessons, the counting. Forty
      crowns is a servant's wage for thirteen years. It is also the price of a
      minor spellbook, which is the arithmetic the house does not say out loud
      in front of the child it has just spent it on.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            He is thorough, and dull, and he does not once ask what the family
            is for. The house has paid for worse.

  - id: the_commission_bought
    title: A Place, and What It Cost
    tier: head
    frequency: common
    weight: 105
    tags: [table, career, money]
    purposes: [change_standing, worldbuild_through_action, plant_rumour]
    # SON is cast from `newly_placed` (issue #127): the man the steward
    # actually bought a place for this year, not any adult who happens to be
    # standing nearby. Alive and past seventeen follow from the role itself —
    # `placePosts` never buys a commission for anyone younger.
    slots:
      HEAD: { role: head }
      SON: { role: newly_placed }
    body: >-
      A place is not applied for. It is bought, from a man who does not call it
      that, over two days and a great deal of wine, and the figure is settled
      before anybody says what the post is. {SON} is not in the room for any of
      it. When {HEAD} comes back the thing is done and there is a date on it.
    interaction:
      kind: choice
      choices:
        - id: tell_him
          label: Tell him what it cost.
          outcomes:
            - id: told
              weight: 100
              text: >-
                He takes the number badly and takes the post anyway, and works
                like a man paying something off, which he is.
        - id: never_say
          label: Never mention the figure.
          outcomes:
            - id: unsaid
              weight: 100
              text: >-
                He finds out in nine years from somebody who is not family, and
                the nine years are what he minds.
              effects:
                - { kind: branch, op: slight, amount: 5 }

  - id: the_boy_who_woke
    title: It Took
    tier: individual
    frequency: common
    weight: 100
    tags: [ladder, awakening, blood]
    purposes: [establish_magic_rule, change_relationship, buy_patience]
    # 30, because `ascension` is a PRESSURE signal now (issue #41,
    # `selection.ts`) and this is the one piece of ladder TEXTURE among four
    # ladder DEMANDS. Promoted with them and unrationed it fired 83 times in a
    # thousand years, which is a house that holds the same ceremony every
    # twelve years and a chronicle that says so.
    cooldownYears: 30
    conditions: { ascension: { atLeast: touched } }
    slots:
      WOKEN: { role: family_member, filters: [{ awakened: true }, { status: [alive] }] }
      HEAD: { role: head }
    body: >-
      Nobody in the house says the word. The midwife's mother said it once,
      forty years ago, and was moved to the kitchens for a season. What they
      say instead is that it took, and they say it the way they would say a
      graft took, or a fever, and {HEAD} does not correct them because there
      is no better word and because the graft and the fever are both closer
      than anybody wants.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            {WOKEN} sleeps through the afternoon and wakes hungry. It is the
            most ordinary day of that century.

  - id: the_quarrel_nobody_started
    title: An Old Account
    tier: family
    frequency: common
    weight: 105
    tags: [grudge, cadet, inheritance]
    purposes: [change_relationship, plant_rumour, change_standing]
    slots:
      COUSIN: { role: cadet, filters: [{ status: [alive] }] }
      HEAD: { role: head }
    body: >-
      {COUSIN} will not come to the burial and gives a reason about the roads.
      The roads are fine. What is actually the matter happened before either of
      them was born, to people neither of them met, over a room in a house that
      has since been sold. Neither could tell you the details. Both could tell
      you who was in the wrong.
    interaction:
      kind: choice
      choices:
        - id: send_word
          label: Send word. Ask what it would take.
          outcomes:
            - id: mended
              weight: 45
              text: >-
                It takes a letter, a visit and a piece of ground the house did
                not much want. He comes to the next one.
              effects:
                - { kind: branch, op: appease, amount: 14 }
                - { kind: treasury, delta: -30 }
            - id: refused
              weight: 55
              text: >-
                The letter comes back with the seal unbroken, which takes some
                doing, and some deciding, and some time.
              effects:
                - { kind: branch, op: slight, amount: 6 }
        - id: let_it_stand
          label: Let it stand. It has stood this long.
          outcomes:
            - id: stood
              weight: 100
              text: >-
                It stands. In sixty years somebody will inherit it along with
                the furniture and be told which chair not to offer him.

  - id: the_shelf_and_the_boy
    title: Somebody Has to Read Them
    tier: individual
    frequency: common
    weight: 110
    tags: [ladder, library, study]
    purposes: [establish_magic_rule, worldbuild_through_action, test_magic_rule]
    slots:
      READER: { role: family_member, filters: [{ status: [alive] }, { age: { op: gte, value: 14 } }] }
    body: >-
      The books are in the second room off the long hall because the first room
      is damp, and they are read by whoever the house can spare, which is
      generally whoever it has least other use for. Six years for a minor
      working. Nine for anything worth the shelf it sits on. {READER} is given
      a candle allowance and a chair by the window and no particular
      instruction about what happens if it goes badly.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            The candle allowance is the part the steward argues about. It is
            always the candle allowance.

proseVariants:
  - address: "content:events/table.yaml#events[id=the_house_decides_for_him].title"
    of: af9df5ce73f8559a
    plainenglish: >-
      A Decision Made Before the Child Can Ask
  - address: "content:events/table.yaml#events[id=the_house_decides_for_him].body"
    of: d0bfd164a5fa5770
    plainenglish: >-
      No one asks {CHILD} for an opinion. {HEAD} decides to hire a tutor at the family
      table, without the child present. The tutor arrives before {CHILD} understands what
      the adults have agreed to.
  - address: "content:events/table.yaml#events[id=the_house_decides_for_him].interaction.outcomes[id=begun].text"
    of: d3b632705b795474
    plainenglish: >-
      {CHILD} might enjoy the lessons or dislike them. Either way, the house has
      committed eight years of the child's life to tutoring without asking first.
  - address: "content:events/table.yaml#events[id=the_term_begins].title"
    of: e1c2216c1ba5ae38
    plainenglish: >-
      A Tutor's Term Costs Forty Crowns
  - address: "content:events/table.yaml#events[id=the_term_begins].body"
    of: 46aa424c20216958
    plainenglish: >-
      A full term of tutoring costs forty crowns. The tutor demands half of that money in
      advance, counted out in the hall where the household can hear. {PUPIL} will
      remember the counting more than the lessons. Forty crowns equals thirteen years of
      a servant's wages or the price of a minor spellbook. The adults know that
      comparison but do not say it in front of the child.
  - address: "content:events/table.yaml#events[id=the_term_begins].interaction.outcomes[id=only].text"
    of: 9f35d17600265bea
    plainenglish: >-
      The tutor is careful but boring. He never questions the family's purpose. The house
      has paid tutors who were less useful than this one.
  - address: "content:events/table.yaml#events[id=the_commission_bought].title"
    of: f2c30170a7d75c7c
    plainenglish: >-
      The Price of a Position
  - address: "content:events/table.yaml#events[id=the_commission_bought].body"
    of: 63a0878ccd5a30a8
    plainenglish: >-
      The family buys a position from a man who refuses to describe the transaction as a
      sale. The negotiations take two days and involve plenty of wine. They agree on the
      price before discussing the duties of the post. {SON} is not present. By the time
      {HEAD} returns, the purchase is settled and the position has a start date.
  - address: "content:events/table.yaml#events[id=the_commission_bought].interaction.choices[id=tell_him].label"
    of: c1b6cdfa62d212c6
    plainenglish: >-
      Tell him how much the position cost.
  - address: "content:events/table.yaml#events[id=the_commission_bought].interaction.choices[id=tell_him].outcomes[id=told].text"
    of: 9dacecc7eaf4cad3
    plainenglish: >-
      He is upset by the price but accepts the position. He works as though he has a debt
      to repay, because he does.
  - address: "content:events/table.yaml#events[id=the_commission_bought].interaction.choices[id=never_say].label"
    of: 4f0758eaafccfc7e
    plainenglish: >-
      Do not tell him the price.
  - address: "content:events/table.yaml#events[id=the_commission_bought].interaction.choices[id=never_say].outcomes[id=unsaid].text"
    of: d900d36e9b9c0b62
    plainenglish: >-
      Nine years later, someone outside the family tells him the price. What upsets him
      most is that his own family hid it from him for nine years.
  - address: "content:events/table.yaml#events[id=the_boy_who_woke].title"
    of: 6faf09ab5a3938b7
    plainenglish: >-
      They Say It Worked
  - address: "content:events/table.yaml#events[id=the_boy_who_woke].body"
    of: e34614e5c5ae5dc1
    plainenglish: >-
      No one in the house says the word for what happened. The midwife's mother said it
      once forty years ago and was sent to work in the kitchens for a season. Instead,
      the family says that it took, as they might say of a graft or a fever. {HEAD} does
      not correct them. There is no better word, and both comparisons are closer to the
      truth than the family wants to admit.
  - address: "content:events/table.yaml#events[id=the_boy_who_woke].interaction.outcomes[id=only].text"
    of: f6729a87f3ed8703
    plainenglish: >-
      {WOKEN} sleeps all afternoon, then wakes up hungry. The rest of that day is
      completely ordinary.
  - address: "content:events/table.yaml#events[id=the_quarrel_nobody_started].title"
    of: c504022476797368
    plainenglish: >-
      A Dispute Inherited from Earlier Generations
  - address: "content:events/table.yaml#events[id=the_quarrel_nobody_started].body"
    of: 5a75a1689c0af054
    plainenglish: >-
      {COUSIN} refuses to attend a burial and blames the roads, though the roads are in
      good condition. The real dispute began before either person was born. It involved
      people they never met and a room in a house that has since been sold. Neither of
      them knows the details, but both are certain which side was wrong.
  - address: "content:events/table.yaml#events[id=the_quarrel_nobody_started].interaction.choices[id=send_word].label"
    of: 162616a12f7bf7c5
    plainenglish: >-
      Write to the cousin and ask how to settle the dispute.
  - address: "content:events/table.yaml#events[id=the_quarrel_nobody_started].interaction.choices[id=send_word].outcomes[id=mended].text"
    of: a4941f5480d5c788
    plainenglish: >-
      Settling the dispute takes a letter, a visit and a piece of land the house did not
      particularly want. The cousin attends the next burial.
  - address: "content:events/table.yaml#events[id=the_quarrel_nobody_started].interaction.choices[id=send_word].outcomes[id=refused].text"
    of: 17af466685ecc3ba
    plainenglish: >-
      The cousin sends the letter back without breaking its seal. Returning it unopened
      took a deliberate decision and some time.
  - address: "content:events/table.yaml#events[id=the_quarrel_nobody_started].interaction.choices[id=let_it_stand].label"
    of: 82d174f101d9ba95
    plainenglish: >-
      Leave the old dispute unresolved.
  - address: "content:events/table.yaml#events[id=the_quarrel_nobody_started].interaction.choices[id=let_it_stand].outcomes[id=stood].text"
    of: f2652024fb0dc978
    plainenglish: >-
      The dispute continues. In sixty years someone will inherit it along with the
      furniture and be told which chair not to offer the other person.
  - address: "content:events/table.yaml#events[id=the_shelf_and_the_boy].title"
    of: c6c7bd682cd568c4
    plainenglish: >-
      Someone Must Study the Books
  - address: "content:events/table.yaml#events[id=the_shelf_and_the_boy].body"
    of: f08824ed083b6789
    plainenglish: >-
      The house keeps its books in the second room off the long hall because the first
      room is damp. Whoever the family can spare studies them, usually someone with few
      other duties. Learning a minor working takes six years. A more valuable working
      takes nine. {READER} receives money for candles and a chair by the window, but no
      guidance about what to do if the study goes badly.
  - address: "content:events/table.yaml#events[id=the_shelf_and_the_boy].interaction.outcomes[id=only].text"
    of: a8577d883ea69104
    plainenglish: >-
      The steward repeatedly argues about how much money to allow for the candles.
