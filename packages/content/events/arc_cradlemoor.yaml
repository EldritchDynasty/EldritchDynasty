# Nodes of arc_cradlemoor_drained, plus the ordinary event that starts it.
#
# `cradlemoor_wants_draining` is not itself a node — it is gated like any
# other content and carries the `arc: op: start` effect, exactly as
# `retainers.yaml`'s pension scene starts `arc_what_went_with_her`. The
# three events below it ARE nodes (`arc: { of, node }`), which excludes each
# from ordinary selection entirely: they fire only when their turn in the
# story comes due.
events:
  - id: cradlemoor_wants_draining
    title: What Cradlemoor Wants
    tier: head
    frequency: uncommon
    weight: 1000
    repeatable: false
    conditions: { all: [{ not: { holdsParcel: cradlemoor } }, { arcCanFinish: arc_cradlemoor_drained }] }
    tags: [land, investment, arc]
    purposes: [buy_patience, change_standing, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      Cradlemoor has changed hands four times since anyone living can say
      for certain, and every family that let it go said the same thing on
      the way out: worth having, once it is drained, and not worth
      draining. It sits low against the boggy ground toward Wick, and every
      wet spring proves both halves of that sentence at once. Old Renn
      wants shot of it again. He names the price a man names when he wants
      shot of something, and {HEAD} has heard three fathers' worth of
      family opinion on what it would actually cost to fix, none of it
      agreeing with the other two.
    interaction:
      kind: choice
      choices:
        - id: commit_to_draining
          label: Buy it, and start the work properly. Somebody has to.
          outcomes:
            - id: bought_and_begun
              weight: 100
              tags: [land, money]
              text: >-
                The price is what a bog costs, which is not much, and
                {HEAD} signs for it the same afternoon a digger up from
                Bramme walks the boundary and gives the only honest answer
                there is: years, not seasons. {HEAD} pays for the first of
                them without knowing which of his own descendants will be
                the one who pays for the last.
              effects:
                - { kind: treasury, delta: -35 }
                - { kind: land, op: grant, parcel: cradlemoor }
                - { kind: arc, op: start, arc: arc_cradlemoor_drained }
        - id: leave_it_be
          label: Let Renn find some other family to sell his weather to.
          outcomes:
            - id: declined
              weight: 100
              tags: [land, restraint]
              text: >-
                Cradlemoor goes onto somebody else's roll before the year
                is out, and will change hands again inside a generation,
                the way it always has. Some ground costs more to fix than
                it will ever pay back, and the house has other ground that
                does not ask to be forgiven for existing.
              effects:
                - { kind: respect, delta: 1 }
    rumour: { id: rumour_who_bought_cradlemoor, accuracy: 0.6, spread: 2 }

  - id: cradlemoor_first_season
    title: The First Channel
    tier: head
    frequency: uncommon
    weight: 100
    tags: [land, investment, arc]
    purposes: [worldbuild_through_action, buy_patience, plant_rumour]
    arc: { of: arc_cradlemoor_drained, node: begin }
    slots:
      HEAD: { role: head }
    body: >-
      The digger from Bramme is as good as his word and as expensive as his
      warning. The first season goes into cutting the main channel down to
      the old streambed, which nobody living remembered was there until the
      spades found it two feet under the reeds. {HEAD} walks the length of
      it once, in boots that do not survive the walking, and writes the
      cost into the roll under a word it has not carried before. It will
      carry that word again.
    interaction:
      kind: narration
      outcomes:
        - id: channel_cut
          weight: 100
          text: >-
            The channel holds through the autumn rains, which the digger
            calls a good sign and {HEAD} calls the least Cradlemoor could
            do for what it cost. Nobody pretends the work is finished. It
            is, at least, begun.
          effects:
            - { kind: treasury, delta: -15 }
    rumour: { id: rumour_cradlemoor_being_drained, accuracy: 0.55, spread: 1 }

  - id: cradlemoor_the_ditches_hold
    title: The Ditches Hold, or They Do Not
    tier: head
    frequency: uncommon
    weight: 100
    tags: [land, investment, arc, inheritance]
    purposes: [worldbuild_through_action, change_standing, force_record_choice]
    arc: { of: arc_cradlemoor_drained, node: ditches }
    slots:
      HEAD: { role: head }
    body: >-
      {HEAD} did not buy Cradlemoor and did not choose to drain it, and
      inherits the ditches and the argument about them in the same week he
      inherits the seal. The channel holds in a dry year and floods in a
      wet one, which the diggers call ordinary and the rent roll calls
      nothing at all, because a half-drained field pays like a bog with
      better manners. Two generations' worth of coin is already in the
      ground. A third generation's worth would probably finish it, which is
      what the last digger said too.
    interaction:
      kind: choice
      choices:
        - id: keep_paying
          label: Finish what his grandfather started. It has come this far.
          outcomes:
            - id: kept_paying
              weight: 100
              tags: [land, money]
              text: >-
                {HEAD} signs the same order his father signed and his
                grandfather signed before that, for a sum that has not
                gotten any smaller with age. The diggers cut a second
                channel to take the overflow the first one cannot carry
                alone, and Cradlemoor pays a little better than it did,
                which is not yet the point.
              effects:
                - { kind: treasury, delta: -40 }
                - { kind: land, op: restore, parcel: cradlemoor, magnitude: 2 }
        - id: let_it_lapse
          label: Let the ditches silt up. The house has paid enough into a hole in the ground.
          outcomes:
            - id: lapsed
              weight: 100
              tags: [land, restraint]
              text: >-
                {HEAD} says no, and means it, and the diggers are not sent
                for again. The channels silt up over the next few winters
                at their own pace, unhurried about it the way ground always
                is, and Cradlemoor settles back into being exactly what it
                was when Old Renn sold it: worth having, once it is
                drained, and not worth draining.
              effects:
                - { kind: respect, delta: 1 }
    record:
      subject: what became of Cradlemoor
      options:
        record:
          chronicle: >-
            Two generations paid to drain Cradlemoor before this one had to
            decide whether a third would. What was decided is written
            below, and the digging accounts are still in the house's own
            hand for anyone who wants to check the sum against the claim.
          claims:
            - { kind: deed, target: head, text: inherited two generations of drainage accounts and had to decide whether to pay for a third }
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            The family has always known what to do with poor ground: work
            it properly, and it stops being poor ground.
          claims:
            - { kind: attr, target: head, attr: mind, value: 0 }
          discrepancy:
            id: cradlemoor_always_known
            severity: minor
            provableBy: [house_marrow, house_calder]

  - id: cradlemoor_the_ground_finally_holds
    title: What Three Heads Bought
    tier: head
    frequency: rare
    weight: 100
    tags: [land, investment, arc]
    purposes: [worldbuild_through_action, plant_rumour, force_record_choice]
    arc: { of: arc_cradlemoor_drained, node: payoff }
    slots:
      HEAD: { role: head }
    body: >-
      {HEAD} is the third of the family to inherit an argument about
      Cradlemoor, and the first to inherit ground instead of a question.
      The channel his grandfather cut and his father paid to keep open has
      done, this year, the one thing three generations were promised it
      would eventually do: held all the way through a wet spring without
      being asked to. The tenant does not remark on it, because the tenant
      has never known Cradlemoor any other way, which is exactly the point
      of sixty years of work nobody outside this family will ever hear
      about.
    interaction:
      kind: narration
      outcomes:
        - id: finally_holds
          weight: 100
          text: >-
            The rent roll for Cradlemoor this year reads like an ordinary
            farm's, for the first time since anyone on it can remember it
            reading like anything at all. {HEAD} does not hold a feast for
            a ditch. He does write the year down, in the same hand his
            grandfather used for the first one, which is as close as this
            family comes to admitting what something cost.
          effects:
            - { kind: land, op: restore, parcel: cradlemoor, magnitude: 6 }
            - { kind: respect, delta: 1 }
    record:
      subject: Cradlemoor, drained
      options:
        record:
          chronicle: >-
            Sixty years and three Heads to drain one poor field, set down
            here in full, because a debt this house actually paid off is
            worth the ink a debt it merely claims to have paid never is.
          claims:
            - { kind: deed, target: head, text: inherited Cradlemoor after sixty years of the family's drainage work finally held }
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            The house does not let good ground go to waste, and never has.
          claims:
            - { kind: attr, target: head, attr: mind, value: 0 }
          discrepancy:
            id: cradlemoor_never_wasted
            severity: minor
            provableBy: [house_marrow, house_calder]
    rumour: { id: rumour_cradlemoor_finally_pays, accuracy: 0.7, spread: 2 }
proseVariants:
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_wants_draining].title"
    of: f0c842b05fa6f374
    plainenglish: >-
      What Cradlemoor Needs
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_wants_draining].body"
    of: 92ef9c9709367643
    plainenglish: >-
      Cradlemoor has changed owners four times in living memory. Each family said the land would be
      valuable if someone drained it, but draining it was too expensive. It lies near the bogs
      toward Wick and floods every wet spring. Old Renn now wants to sell it. His asking price
      reflects how eager he is to leave. {HEAD} has heard three generations of conflicting advice
      about what the drainage would actually cost.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_wants_draining].interaction.choices[id=commit_to_draining].label"
    of: e28ccb5bbc339a4f
    plainenglish: >-
      Buy Cradlemoor and begin draining it properly.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_wants_draining].interaction.choices[id=commit_to_draining].outcomes[id=bought_and_begun].text"
    of: e73e62b8071a6164
    plainenglish: >-
      Cradlemoor is cheap because it is a bog. {HEAD} signs the purchase that afternoon. A digger
      from Bramme walks the boundary and says the drainage will take years, not seasons. {HEAD} pays
      for the first stage, without knowing which descendant will pay for the last.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_wants_draining].interaction.choices[id=leave_it_be].label"
    of: 91ebdfb28b36f27e
    plainenglish: >-
      Leave Cradlemoor for Renn to sell to another family.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_wants_draining].interaction.choices[id=leave_it_be].outcomes[id=declined].text"
    of: 97021c0c7cfc26b0
    plainenglish: >-
      Someone else buys Cradlemoor before the year ends. It will probably be sold again within a
      generation, as it has been before. Draining some land costs more than that land will ever
      earn. The house has other fields that do not require this much work.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_first_season].title"
    of: 6df4600944058505
    plainenglish: >-
      The First Drainage Channel
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_first_season].body"
    of: a0db163dd3c5d4b1
    plainenglish: >-
      The digger from Bramme keeps his promise, but the work costs as much as he warned. During the
      first season, his workers cut a main channel down to an old streambed. They find it two feet
      beneath the reeds; no one alive knew it was there. {HEAD} walks the channel and ruins his
      boots. He records the expense in the accounts under a new heading. More expenses will follow.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_first_season].interaction.outcomes[id=channel_cut].text"
    of: fbf4861533a5ed09
    plainenglish: >-
      The new channel survives the autumn rain. The digger calls that a good sign. {HEAD} thinks it
      is the least the land can do after so much expense. The drainage is still unfinished, but the
      work has begun.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ditches_hold].title"
    of: 1f35c1ec784b9b58
    plainenglish: >-
      Whether the Ditches Will Hold
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ditches_hold].body"
    of: fc7784fae30280a6
    plainenglish: >-
      {HEAD} did not buy Cradlemoor or decide to drain it. He inherits the estate and the unfinished
      work when he inherits the family seal. The channel stays open in dry years but floods in wet
      ones. Because the field is only partly drained, its rent is still as low as a bog's. The
      family has already spent two generations of money on it. The diggers say one more generation
      of spending should finish the work, just as the previous digger said.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ditches_hold].interaction.choices[id=keep_paying].label"
    of: a78b5437efa3b4fb
    plainenglish: >-
      Finish the drainage work his grandfather started.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ditches_hold].interaction.choices[id=keep_paying].outcomes[id=kept_paying].text"
    of: 3b7733ded6668a9a
    plainenglish: >-
      {HEAD} signs the same order that his father and grandfather signed. It still costs just as
      much. The diggers cut a second channel to carry water the first cannot handle alone.
      Cradlemoor starts to earn a little more rent, but the investment has not yet paid off.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ditches_hold].interaction.choices[id=let_it_lapse].label"
    of: 643d1bff6d5a00db
    plainenglish: >-
      Stop paying for the drainage and let the ditches fill with silt.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ditches_hold].interaction.choices[id=let_it_lapse].outcomes[id=lapsed].text"
    of: 8625cb572b3af933
    plainenglish: >-
      {HEAD} refuses to spend more, so the diggers do not return. Over the next few winters, silt
      gradually fills the channels. Cradlemoor becomes the same wet ground Old Renn sold: it might
      be valuable after drainage, but draining it costs too much.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ditches_hold].record.subject"
    of: 5207a647f725b18b
    plainenglish: >-
      what happened to Cradlemoor
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ditches_hold].record.options.record.chronicle"
    of: c54747b4a5311e90
    plainenglish: >-
      Two earlier generations paid to drain Cradlemoor. This generation had to decide whether to pay
      for a third. The decision is recorded below. The house still keeps the digging accounts, so
      anyone can compare the actual spending with what this record claims.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ditches_hold].record.options.embellish.chronicle"
    of: f21f24df6521740b
    plainenglish: >-
      Our family has always known how to improve poor land. Once we work it properly, it becomes
      good land.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ground_finally_holds].title"
    of: 9cdac0d7b944a8bb
    plainenglish: >-
      What Three Generations Paid For
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ground_finally_holds].body"
    of: bde5e119f408fa55
    plainenglish: >-
      {HEAD} is the third generation to inherit the drainage work at Cradlemoor. Unlike his
      predecessors, he finally inherits usable ground. The channel his grandfather dug and his
      father maintained now stays open through a wet spring. That is what the family has spent sixty
      years trying to achieve. The tenant thinks this is normal, because he has never known the land
      any other way. People outside the family will never know how much work it took.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ground_finally_holds].interaction.outcomes[id=finally_holds].text"
    of: 0533d6e4b0b88878
    plainenglish: >-
      For the first time anyone remembers, Cradlemoor's rent accounts look like those of an ordinary
      farm. {HEAD} does not hold a celebration for a drainage ditch. He writes down the year, using
      the same handwriting style as his grandfather did when the work began. That is how the family
      acknowledges what it cost.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ground_finally_holds].record.subject"
    of: df45c01e862829d2
    plainenglish: >-
      Cradlemoor after drainage
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ground_finally_holds].record.options.record.chronicle"
    of: 0ffcc5a7431a7b9b
    plainenglish: >-
      Draining one poor field took sixty years and three family Heads. The full account is kept
      here. This time the house really paid off the debt it took on, rather than merely claiming it
      had done so.
  - address: "content:events/arc_cradlemoor.yaml#events[id=cradlemoor_the_ground_finally_holds].record.options.embellish.chronicle"
    of: bfb1d10f70c32253
    plainenglish: >-
      Our house never wastes good land, and it never has.
