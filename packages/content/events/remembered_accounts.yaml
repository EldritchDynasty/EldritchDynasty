  - id: the_chapter_house_closes_its_door
    title: The Chapter House Closes Its Door
    tier: head
    frequency: uncommon
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - force_record_choice
      - change_standing
      - change_relationship
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: church_hostile
          is: true
    body: A letter asking the chapter house to witness the family papers comes back with the wax
      unbroken. The same office that was not asked about the widening will not put its seal beside
      the result. The papers must travel to Caster instead.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay to have the papers witnessed at Caster.
          outcomes:
            - id: answered
              weight: 100
              text: A rider takes the papers to Caster and waits for the civil clerk. His fee and the clerk’s fee
                arrive on one sheet.
              effects:
                - kind: treasury
                  delta: -24
        - id: keep_our_terms
          label: Use the papers without a witness.
          outcomes:
            - id: stood
              weight: 100
              text: The papers are read as the house’s own assertion. The missing Church seal is noticed before
                the names are.
              effects:
                - kind: respect
                  delta: -2
                - kind: rumour
                  op: seed
                  id: rumour_the_chapter_house_closes_its_door
                  accuracy: 0.7
