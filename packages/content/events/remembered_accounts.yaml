    plainenglish: Show the Rite’s Permission
  - address: content:events/remembered_accounts.yaml#events[id=the_permission_is_read_back].record.options.record.chronicle
    of: 7176c2ce0ab0232a
    plainenglish: The keeper at Wick asks about the chapter house’s permission for the family’s rite.
      The original letter is still stored. Showing it will answer the question, but will also reveal
      what the rite’s permission covered.
  - address: content:events/remembered_accounts.yaml#events[id=the_permission_is_read_back].record.options.embellish.chronicle
    of: 4701cff75eb0b3bb
    plainenglish: The family said that nobody had raised a later question about this matter or asked it
      to provide evidence.
  - address: content:events/remembered_accounts.yaml#events[id=the_answer_was_a_refusal].title
    of: 444be3c4221a43e8
    plainenglish: Correct the Mistaken Permission
  - address: content:events/remembered_accounts.yaml#events[id=the_answer_was_a_refusal].body
    of: 5b6f3dbd73322259
    plainenglish: A new clerk has mistaken the chapter house’s courteous refusal for permission and
      copied it into a petition. The family’s earlier account explains the refusal. The petition has
      not been sent yet.
  - address: content:events/remembered_accounts.yaml#events[id=the_answer_was_a_refusal].interaction.choices[id=answer_the_account].label
    of: 65181ed38e8d8107
    plainenglish: Pay to correct the petition.
  - address: content:events/remembered_accounts.yaml#events[id=the_answer_was_a_refusal].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 4375ff220b5a9ac6
    plainenglish: The clerk removes the mistaken permission. The corrected petition goes to Bramme with
      the actual refusal attached.
  - address: content:events/remembered_accounts.yaml#events[id=the_answer_was_a_refusal].interaction.choices[id=keep_our_terms].label
    of: cd9c64ca6f4cfb2e
    plainenglish: Send it without mentioning the refusal.
  - address: content:events/remembered_accounts.yaml#events[id=the_answer_was_a_refusal].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: c001aaef6dc1a393
    plainenglish: Bramme returns its own copy of the refusal and asks why the family treated it as permission.
  - address: content:events/remembered_accounts.yaml#events[id=the_answer_was_a_refusal].record.subject
    of: 444be3c4221a43e8
    plainenglish: Correct the Mistaken Permission
  - address: content:events/remembered_accounts.yaml#events[id=the_answer_was_a_refusal].record.options.record.chronicle
    of: 5b6f3dbd73322259
    plainenglish: A new clerk has mistaken the chapter house’s courteous refusal for permission and
      copied it into a petition. The family’s earlier account explains the refusal. The petition has
      not been sent yet.
  - address: content:events/remembered_accounts.yaml#events[id=the_answer_was_a_refusal].record.options.embellish.chronicle
    of: 16023507f79b6c83
    plainenglish: The family said that nobody had raised a later question about this matter or asked it
      to provide evidence.
  - address: content:events/remembered_accounts.yaml#events[id=the_three_volumes_are_sorted].title
    of: 5bccbe36a26309ba
    plainenglish: Bind the Three Looted Spellbooks
  - address: content:events/remembered_accounts.yaml#events[id=the_three_volumes_are_sorted].body
    of: ec8f29599568b9fd
    plainenglish: The books bought in the looted library have been sorted. Three useful volumes cover
      Life, Death and Darkness. All their pages remain, but the bindings have failed. A binder at
      Bramme asks twelve crowns to repair them.
  - address: content:events/remembered_accounts.yaml#events[id=the_three_volumes_are_sorted].interaction.choices[id=answer_the_account].label
    of: 4e981e9816a14ff4
    plainenglish: Pay twelve crowns to bind the books.
  - address: content:events/remembered_accounts.yaml#events[id=the_three_volumes_are_sorted].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 72600d4e1cc22892
    plainenglish: The binder returns physical copies of the Lesser Workings of Life, Death and Darkness,
      ready for study. The other books stay in the chest.
  - address: content:events/remembered_accounts.yaml#events[id=the_three_volumes_are_sorted].interaction.choices[id=keep_our_terms].label
    of: 924c661ab32d126e
    plainenglish: Sell the unbound pages.
  - address: content:events/remembered_accounts.yaml#events[id=the_three_volumes_are_sorted].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: 14224f990107a07d
    plainenglish: The binder buys the pages and takes the chest. The family receives money instead of
      keeping those books.
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_asks_for_her_mother].title
    of: df62c40b2d3d0adf
    plainenglish: The Bride’s Missing Family Records
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_asks_for_her_mother].body
    of: 4a1746ed6428c779
    plainenglish: A herald checking the Rimefell marriage finds the wedding entry but no attested
      descent for the bride. He stops at her mother’s name. The family must obtain the missing
      northern records or have the gap officially noted.
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_asks_for_her_mother].interaction.choices[id=answer_the_account].label
    of: a9bc201b9ea13fd7
    plainenglish: Pay for an attested northern descent.
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_asks_for_her_mother].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 4f9a0b2d52ded201
    plainenglish: A rider brings back a northern attestation and charges for the journey. The herald
      attaches it instead of relying on the family’s account.
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_asks_for_her_mother].interaction.choices[id=keep_our_terms].label
    of: 4157d75ebc2da08a
    plainenglish: Record that the mother’s line is unproved.
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_asks_for_her_mother].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: 72e2177ca6ce1bf0
    plainenglish: The herald marks the mother’s line as unproved. Every certified descent copied from it
      will repeat the warning.
  - address: content:events/remembered_accounts.yaml#events[id=the_factor_remembers_the_receipt].title
    of: 7615e5644003ffb0
    plainenglish: Use the Better Braccish Rate
  - address: content:events/remembered_accounts.yaml#events[id=the_factor_remembers_the_receipt].body
    of: 1696364c3ba074b8
    plainenglish: "A Braccish factor attaches the old paid receipt to the next remittance account. On
      four hundred crowns the fee is seven crowns instead of eight: 1.75% instead of the usual 2%.
      He offers to collect the fee now."
  - address: content:events/remembered_accounts.yaml#events[id=the_factor_remembers_the_receipt].interaction.choices[id=answer_the_account].label
    of: 77933e7a8b3eceae
    plainenglish: Pay the seven-crown fee.
  - address: content:events/remembered_accounts.yaml#events[id=the_factor_remembers_the_receipt].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: dec8d4080227e5ec
    plainenglish: The family pays seven crowns for the remittance fee. The factor keeps the old receipt
      with its account.
  - address: content:events/remembered_accounts.yaml#events[id=the_factor_remembers_the_receipt].interaction.choices[id=keep_our_terms].label
    of: 832ff2e68e5166c2
    plainenglish: Buy a certified copy of the lower rate.
  - address: content:events/remembered_accounts.yaml#events[id=the_factor_remembers_the_receipt].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: 3f4ccec142e535d5
    plainenglish: For one crown the factor certifies the favourable terms. The family keeps proof to
      show other counting houses.
  - address: content:events/remembered_accounts.yaml#events[id=the_sideways_seal_on_the_lease].title
    of: 6033d4c08e8e7774
    plainenglish: A Lease Needs Proof of the Seal
  - address: content:events/remembered_accounts.yaml#events[id=the_sideways_seal_on_the_lease].body
    of: d7a6852ffd5b045b
    plainenglish: Caster returns a lease with its seal impression circled in red. The clerk questions
      whether possessing the seal proves the right to use it after the concession in the hall. He
      will accept an instrument witnessed by both halls.
  - address: content:events/remembered_accounts.yaml#events[id=the_sideways_seal_on_the_lease].interaction.choices[id=answer_the_account].label
    of: 074a3f223200a936
    plainenglish: Pay for witnesses from both halls.
  - address: content:events/remembered_accounts.yaml#events[id=the_sideways_seal_on_the_lease].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: a91eb37144866405
    plainenglish: Two witnesses take the instrument to Caster. Their attestations allow the lease to be enrolled.
  - address: content:events/remembered_accounts.yaml#events[id=the_sideways_seal_on_the_lease].interaction.choices[id=keep_our_terms].label
    of: 00739536fa330bda
    plainenglish: Insist that the seal alone is enough.
  - address: content:events/remembered_accounts.yaml#events[id=the_sideways_seal_on_the_lease].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: 9b7d65dfed5489eb
    plainenglish: Caster returns the lease without enrolling it. The objection is recorded beside the
      family’s name.
  - address: content:events/remembered_accounts.yaml#events[id=the_stewards_list_of_doors].title
    of: f0cb213c35e46b70
    plainenglish: The Former Steward Names the Closed Rooms
  - address: content:events/remembered_accounts.yaml#events[id=the_stewards_list_of_doors].body
    of: bd8f587ce2d559b0
    plainenglish: The steward who left has given Bramme a list of doors he was forbidden to open. It
      names rooms but alleges no specific crime. A clerk asks to inspect those rooms with witnesses.
  - address: content:events/remembered_accounts.yaml#events[id=the_stewards_list_of_doors].interaction.choices[id=answer_the_account].label
    of: 6f0e0ef74ef67373
    plainenglish: Pay for a witnessed inspection of the rooms.
  - address: content:events/remembered_accounts.yaml#events[id=the_stewards_list_of_doors].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: a6d603c4592a0858
    plainenglish: A notary and the clerk inspect the opened rooms. The family pays and keeps their
      written findings.
  - address: content:events/remembered_accounts.yaml#events[id=the_stewards_list_of_doors].interaction.choices[id=keep_our_terms].label
    of: 5b136a4ff656a513
    plainenglish: Do not let the clerk enter.
  - address: content:events/remembered_accounts.yaml#events[id=the_stewards_list_of_doors].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: d216f7482d8d3454
    plainenglish: The clerk attaches the refusal to the steward’s list. There is now an external record
      of the doors the family will not open.
  - address: content:events/remembered_accounts.yaml#events[id=the_index_has_our_page].title
    of: 66fe62e9410fdc35
    plainenglish: The Refused Archivist Publishes a Reference
  - address: content:events/remembered_accounts.yaml#events[id=the_index_has_our_page].body
    of: 0588da6585b09cf1
    plainenglish: A Bramme index identifies the page the archivist refused to overlook without payment.
      It gives the shelf, gathering and year. Paying him now would not remove copies of the index
      already held by other readers.
  - address: content:events/remembered_accounts.yaml#events[id=the_index_has_our_page].interaction.choices[id=answer_the_account].label
    of: 93bdc78bfaa1317f
    plainenglish: Pay a notary to file an answer.
  - address: content:events/remembered_accounts.yaml#events[id=the_index_has_our_page].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: f9c6c89fe4f7eac3
    plainenglish: The notary compares the cited page with the family account. The family pays for a
      response that can be filed beside the reference.
  - address: content:events/remembered_accounts.yaml#events[id=the_index_has_our_page].interaction.choices[id=keep_our_terms].label
    of: beaebd8cc19579c8
    plainenglish: Leave the published reference unanswered.
  - address: content:events/remembered_accounts.yaml#events[id=the_index_has_our_page].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: e0f14e7125e29e35
    plainenglish: The reference remains in circulation. The cited page is read alongside the family’s account.
  - address: content:events/remembered_accounts.yaml#events[id=the_grievance_reaches_the_assembly].title
    of: 6346f550e732ba94
    plainenglish: The Town Takes Its Grievance to the Assembly
  - address: content:events/remembered_accounts.yaml#events[id=the_grievance_reaches_the_assembly].body
    of: 14ced1864135b1c2
    plainenglish: Bramme’s burgesses send their dated grievance to the Assembly with the family’s
      petition. Their delegate has kept the ruling the family obtained over their objections. The
      Assembly will hear the grievance first.
  - address: content:events/remembered_accounts.yaml#events[id=the_grievance_reaches_the_assembly].interaction.choices[id=answer_the_account].label
    of: 324d6f679c76e9f3
    plainenglish: Pay the town’s recorded costs to settle.
  - address: content:events/remembered_accounts.yaml#events[id=the_grievance_reaches_the_assembly].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 3038cef9f00fdfa5
    plainenglish: The town records the settlement and withdraws its objection to the hearing. The family
      pays its recorded costs.
  - address: content:events/remembered_accounts.yaml#events[id=the_grievance_reaches_the_assembly].interaction.choices[id=keep_our_terms].label
    of: c7f5ac580248df74
    plainenglish: Rely on the earlier ruling.
  - address: content:events/remembered_accounts.yaml#events[id=the_grievance_reaches_the_assembly].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: c1e0797929ff78dd
    plainenglish: The earlier ruling stays in force, but the delegate reads the grievance before the
      family’s petition is heard.
  - address: content:events/remembered_accounts.yaml#events[id=the_son_brings_the_written_terms].title
    of: e6f957fae93cf22e
    plainenglish: The Written Rent Limits a New Charge
  - address: content:events/remembered_accounts.yaml#events[id=the_son_brings_the_written_terms].body
    of: c6ba65d9f9ab999d
    plainenglish: A tenant’s son produces the witnessed tenancy terms after a new steward demands a
      charge they do not allow. Both copies specify the same rent. The steward has already sent men
      to collect more.
  - address: content:events/remembered_accounts.yaml#events[id=the_son_brings_the_written_terms].interaction.choices[id=answer_the_account].label
    of: fe1ea165bd843089
    plainenglish: Return the eight crowns charged in excess.
  - address: content:events/remembered_accounts.yaml#events[id=the_son_brings_the_written_terms].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 8581a376bbbafb62
    plainenglish: The son takes back eight crowns. The steward enters the agreed written rent in the
      working roll.
  - address: content:events/remembered_accounts.yaml#events[id=the_son_brings_the_written_terms].interaction.choices[id=keep_our_terms].label
    of: 60bc9a9a9ff133ae
    plainenglish: Keep the charge and challenge the written terms.
  - address: content:events/remembered_accounts.yaml#events[id=the_son_brings_the_written_terms].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: 0b1341ae4865bb4a
    plainenglish: The tenant takes his document to Bramme. The family’s seal is read out under the terms
      it has refused to honour.
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_opens_the_old_question].title
    of: 23ffd3c327bb291f
    plainenglish: The Herald Reopens an Unproved Descent
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_opens_the_old_question].body
    of: 95a7465d5ab518c1
    plainenglish: A later marriage requires the elder descent that was not supplied at the earlier
      visitation. The herald finds the old unanswered question in the margin. It will be copied into
      the new descent unless the family supplies proof.
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_opens_the_old_question].interaction.choices[id=answer_the_account].label
    of: 8db6bf6c9b8187c8
    plainenglish: Pay to search the parish records.
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_opens_the_old_question].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 5d67ce8800942abc
    plainenglish: Wick and Bramme compare their surviving rolls and record their search beside the old
      question. The family pays both offices.
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_opens_the_old_question].interaction.choices[id=keep_our_terms].label
    of: a944351bb615c0cf
    plainenglish: Keep the line without proving it.
  - address: content:events/remembered_accounts.yaml#events[id=the_herald_opens_the_old_question].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: 59b626861eb0add2
    plainenglish: The herald copies the warning into the marriage descent. The other family receives it
      with the same reservation.
  - address: content:events/remembered_accounts.yaml#events[id=the_price_after_the_fires].title
    of: f409a3b5a3ca2e11
    plainenglish: Certify What Survived the Library Fires
  - address: content:events/remembered_accounts.yaml#events[id=the_price_after_the_fires].body
    of: c9947717a825b80b
    plainenglish: A Bramme bookseller requests a list of books that survived the nine library fires and
      names the family as a holder. A notary can certify the family’s inventory whether the shelves
      are empty or full. The bookseller wants a certified answer to show other houses.
  - address: content:events/remembered_accounts.yaml#events[id=the_price_after_the_fires].interaction.choices[id=answer_the_account].label
    of: 52640a5be574eb67
    plainenglish: Pay eight crowns to certify the inventory.
  - address: content:events/remembered_accounts.yaml#events[id=the_price_after_the_fires].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 093c7fc905b1dca5
    plainenglish: The certified inventory goes to Bramme. The family pays eight crowns to place its list
      beside the bookseller’s account.
  - address: content:events/remembered_accounts.yaml#events[id=the_price_after_the_fires].interaction.choices[id=keep_our_terms].label
    of: 93de8f65b3d78739
    plainenglish: Do not certify the family’s inventory.
  - address: content:events/remembered_accounts.yaml#events[id=the_price_after_the_fires].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: 4556517b47206f4f
    plainenglish: The bookseller sends other houses the petition with the refusal attached. They learn
      that the family would not certify what it kept.
  - address: content:events/remembered_accounts.yaml#events[id=the_cellar_shelf_is_found].title
    of: dd148079b2b0902d
    plainenglish: The Hidden Cellar Books Are Questioned
  - address: content:events/remembered_accounts.yaml#events[id=the_cellar_shelf_is_found].body
    of: eb4a00537134bd4f
    plainenglish: A chapter house clerk asks about wet leather in the second cellar. The shelf hidden
      during the Crusade is still listed as something visitors must not see. He offers to witness
      the removal of the named Death and Darkness books.
  - address: content:events/remembered_accounts.yaml#events[id=the_cellar_shelf_is_found].interaction.choices[id=answer_the_account].label
    of: 6993c4f1d989ee45
    plainenglish: Pay to repair and close the damp recess.
  - address: content:events/remembered_accounts.yaml#events[id=the_cellar_shelf_is_found].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: df33cf4ef6b66622
    plainenglish: A mason closes the recess while the clerk witnesses the empty shelf. The family pays
      for repairs and keeps its copies.
  - address: content:events/remembered_accounts.yaml#events[id=the_cellar_shelf_is_found].interaction.choices[id=keep_our_terms].label
    of: f1d78d50d6756724
    plainenglish: Hand over any held copies named on the list.
  - address: content:events/remembered_accounts.yaml#events[id=the_cellar_shelf_is_found].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: a90d138ed7fb7162
    plainenglish: Held copies of the Lesser Workings of Death and Darkness are removed under receipt.
      Learned knowledge remains, but studies of missing copies stop.
  - address: content:events/remembered_accounts.yaml#events[id=the_mason_reaches_the_turn].title
    of: 62660d4156ce64b5
    plainenglish: The Bricked Stair Has Been Opened
  - address: content:events/remembered_accounts.yaml#events[id=the_mason_reaches_the_turn].body
    of: 21788cdf39c4e6e3
    plainenglish: A mason reaches the stair that the family had bricked up. Someone has opened the wall
      from the upper step. Old bricks lie beside newer mortar. The mason waits before taking his
      tools below.
  - address: content:events/remembered_accounts.yaml#events[id=the_mason_reaches_the_turn].interaction.choices[id=answer_the_account].label
    of: 147495344e6bb678
    plainenglish: Pay to close the stair again with a witness.
  - address: content:events/remembered_accounts.yaml#events[id=the_mason_reaches_the_turn].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: ca8fc77e7509c62a
    plainenglish: The steward watches the mason rebuild the wall. The bill identifies the stair and the repair.
  - address: content:events/remembered_accounts.yaml#events[id=the_mason_reaches_the_turn].interaction.choices[id=keep_our_terms].label
    of: 860a7077b64858f3
    plainenglish: Keep the stair open for the household to see.
  - address: content:events/remembered_accounts.yaml#events[id=the_mason_reaches_the_turn].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: d7be58642cdbe410
    plainenglish: Workers remove the bricks and leave the stair open. They tell people at Wick which
      wall the family had kept closed.
  - address: content:events/remembered_accounts.yaml#events[id=the_codex_in_the_eastern_invoice].title
    of: 43267d6ac6250b9e
    plainenglish: A Chance to Recover the Marrow Codex
  - address: content:events/remembered_accounts.yaml#events[id=the_codex_in_the_eastern_invoice].body
    of: 75c48ac909d1e425
    plainenglish: An eastern invoice received at Sarrow identifies the Marrow Codex in the shipment the
      family learned about. A bookseller offers to arrange its return for an attested payment.
      Alternatively, he will buy the family’s dated shipment information.
  - address: content:events/remembered_accounts.yaml#events[id=the_codex_in_the_eastern_invoice].interaction.choices[id=answer_the_account].label
    of: cf7d9efedf7e66d2
    plainenglish: Pay ninety crowns to recover the Codex.
  - address: content:events/remembered_accounts.yaml#events[id=the_codex_in_the_eastern_invoice].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 6d0d62c86bd50e34
    plainenglish: The bookseller takes ninety crowns and sends the family a physical copy of the Marrow
      Codex. It still needs to be studied; nobody learns it automatically.
  - address: content:events/remembered_accounts.yaml#events[id=the_codex_in_the_eastern_invoice].interaction.choices[id=keep_our_terms].label
    of: 2b335e18622ecf44
    plainenglish: Sell the details of the shipment instead.
  - address: content:events/remembered_accounts.yaml#events[id=the_codex_in_the_eastern_invoice].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: 87e9a99c14c725e8
    plainenglish: The bookseller pays six crowns for the dates and crate mark. The family keeps its
      knowledge of the route, but the book goes to someone else.
  - address: content:events/remembered_accounts.yaml#events[id=the_quire_beside_the_descent].title
    of: 81a340afa84be1a3
    plainenglish: Compare the Kept Quire with the Descent
  - address: content:events/remembered_accounts.yaml#events[id=the_quire_beside_the_descent].body
    of: 3f76c4069c75b8da
    plainenglish: The preserved quire is compared with a new heraldic descent. The male line agrees for
      four generations, but the mothers differ. The clerk can send both accounts for attestation or
      send the heralds’ account with the disagreement declared.
  - address: content:events/remembered_accounts.yaml#events[id=the_quire_beside_the_descent].interaction.choices[id=answer_the_account].label
    of: 2783b52541268b31
    plainenglish: Pay to compare both written accounts.
  - address: content:events/remembered_accounts.yaml#events[id=the_quire_beside_the_descent].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 85bd1ad387a94f97
    plainenglish: Both documents go to Bramme together. The family pays for a comparison and preserves
      the signed disagreement with the quire.
  - address: content:events/remembered_accounts.yaml#events[id=the_quire_beside_the_descent].interaction.choices[id=keep_our_terms].label
    of: d184320f22ffcabb
    plainenglish: Declare the disagreement unresolved.
  - address: content:events/remembered_accounts.yaml#events[id=the_quire_beside_the_descent].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: b0664091f410528d
    plainenglish: The herald marks the maternal descent as disputed. The family’s silence does not make
      either account official truth.
  - address: content:events/remembered_accounts.yaml#events[id=the_business_without_the_seal].title
    of: 3594528668e756b2
    plainenglish: Another Transaction Needs the Missing Seal
  - address: content:events/remembered_accounts.yaml#events[id=the_business_without_the_seal].body
    of: 042629adc4f7e8a1
    plainenglish: A new instrument requires the seal missing from its box, and the quiet search has not
      found it. Caster will accept a witnessed notarial instrument for this transaction. The earlier
      excuses will not replace a seal impression again.
  - address: content:events/remembered_accounts.yaml#events[id=the_business_without_the_seal].interaction.choices[id=answer_the_account].label
    of: db620532c884b566
    plainenglish: Pay eighteen crowns for a notarial instrument.
  - address: content:events/remembered_accounts.yaml#events[id=the_business_without_the_seal].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 6117ee22d1a910de
    plainenglish: Caster witnesses the instrument without the missing seal’s impression. The family pays
      the additional fee.
  - address: content:events/remembered_accounts.yaml#events[id=the_business_without_the_seal].interaction.choices[id=keep_our_terms].label
    of: 6cecfedbca3deff7
    plainenglish: State that the seal cannot be produced.
  - address: content:events/remembered_accounts.yaml#events[id=the_business_without_the_seal].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: 4db51f563a2ec16a
    plainenglish: The clerk records the missing regalia. The transaction waits, and the record is sent
      outside the family.
  - address: content:events/remembered_accounts.yaml#events[id=the_old_list_reaches_the_cellar].title
    of: 3dd7f366271ea562
    plainenglish: The Church Asks for a Plan of the Third Room
  - address: content:events/remembered_accounts.yaml#events[id=the_old_list_reaches_the_cellar].body
    of: 6a70eb4ad39d41ae
    plainenglish: The chapter house compares the old cellar list with the third room mentioned in the
      family’s own record. The written page tells its clerk where to start. He asks for a witnessed
      plan rather than another list.
  - address: content:events/remembered_accounts.yaml#events[id=the_old_list_reaches_the_cellar].interaction.choices[id=answer_the_account].label
    of: 26c49df608f47c6a
    plainenglish: Pay for a witnessed plan of the room.
  - address: content:events/remembered_accounts.yaml#events[id=the_old_list_reaches_the_cellar].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 5cfee2662fc3c3c2
    plainenglish: A surveyor draws the third room and files its plan with the old cellar list. The
      family pays for both copies.
  - address: content:events/remembered_accounts.yaml#events[id=the_old_list_reaches_the_cellar].interaction.choices[id=keep_our_terms].label
    of: df46ca71c189be6d
    plainenglish: Do not supply a plan.
  - address: content:events/remembered_accounts.yaml#events[id=the_old_list_reaches_the_cellar].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: 9020b0695def7fe5
    plainenglish: The clerk files the refusal with the old list. The record now shows that the family
      wrote about a room it will not show.
  - address: content:events/remembered_accounts.yaml#events[id=the_ward_answers_cawdry].title
    of: ef3e0cf93d605a2d
    plainenglish: Cawdry Questions the Married-In Ward
  - address: content:events/remembered_accounts.yaml#events[id=the_ward_answers_cawdry].body
    of: db797028e8f72604
    plainenglish: Cawdry asks the ward who married into the family to describe her years in its
      household. The family kept her there to keep her knowledge private. Cawdry now cites her
      marriage entry as the reason for asking.
  - address: content:events/remembered_accounts.yaml#events[id=the_ward_answers_cawdry].interaction.choices[id=answer_the_account].label
    of: f1c7a37a7c1643ae
    plainenglish: Pay for an answer she agrees to give.
  - address: content:events/remembered_accounts.yaml#events[id=the_ward_answers_cawdry].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: 3be27d24cfa4ff38
    plainenglish: A notary witnesses her agreed answer. The family pays to keep it with the marriage record.
  - address: content:events/remembered_accounts.yaml#events[id=the_ward_answers_cawdry].interaction.choices[id=keep_our_terms].label
    of: 806075477a4e4583
    plainenglish: Send no answer to Cawdry.
  - address: content:events/remembered_accounts.yaml#events[id=the_ward_answers_cawdry].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: bc98e844484a8368
    plainenglish: Cawdry receives the family’s refusal instead of her account. Her marriage entry is
      read with the old insult to her birth family.
  - address: content:events/remembered_accounts.yaml#events[id=the_case_book_is_cited].title
    of: ed611c93936b088f
    plainenglish: An Inquiry Cites the Physician’s Notes
  - address: content:events/remembered_accounts.yaml#events[id=the_case_book_is_cited].body
    of: ed6d7db0f49adbcc
    plainenglish: A parish inquiry cites a visit recorded in the physician’s case-book. The family knows
      the visit and the three matters absent from its own record. An attested medical extract can
      answer without denying that the visit happened.
  - address: content:events/remembered_accounts.yaml#events[id=the_case_book_is_cited].interaction.choices[id=answer_the_account].label
    of: 6234c335390c5f51
    plainenglish: Pay seven crowns for a medical extract.
  - address: content:events/remembered_accounts.yaml#events[id=the_case_book_is_cited].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: bbb3e85a3e25d6be
    plainenglish: The medical extract is witnessed at Bramme and sent in reply. The family pays the copying fee.
  - address: content:events/remembered_accounts.yaml#events[id=the_case_book_is_cited].interaction.choices[id=keep_our_terms].label
    of: dcbdeee017abbfec
    plainenglish: Do not answer the case-book entry.
  - address: content:events/remembered_accounts.yaml#events[id=the_case_book_is_cited].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: dec9306d31ce7e09
    plainenglish: The inquiry records that the family knew the entry but supplied no answer. The parish
      can still consult the case-book.
  - address: content:events/remembered_accounts.yaml#events[id=the_fourth_yssene_clause].title
    of: cc4ff87285c8fcc6
    plainenglish: Translate the Fourth Yssene Clause
  - address: content:events/remembered_accounts.yaml#events[id=the_fourth_yssene_clause].body
    of: d8ad6702b90ac2ce
    plainenglish: A translator at Sarrow reads the fourth clause of the old Yssene marriage offer. Under
      the law across the Grey, children of that marriage would have a claim on the family’s house.
      The family can certify the translation or record that the terms remain disputed.
  - address: content:events/remembered_accounts.yaml#events[id=the_fourth_yssene_clause].interaction.choices[id=answer_the_account].label
    of: 05fdbf08dfea5ca4
    plainenglish: Pay nine crowns for a certified translation.
  - address: content:events/remembered_accounts.yaml#events[id=the_fourth_yssene_clause].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: a8616e178a6f02fb
    plainenglish: The certified translation is stored with the offer. It records both the foreign claim
      and Aubren’s refusal to recognise it, without deciding which law should prevail.
  - address: content:events/remembered_accounts.yaml#events[id=the_fourth_yssene_clause].interaction.choices[id=keep_our_terms].label
    of: 299b88d0bb81be54
    plainenglish: Register the terms as disputed without translating.
  - address: content:events/remembered_accounts.yaml#events[id=the_fourth_yssene_clause].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: 29ce1d1271b16b46
    plainenglish: The official roll notes that the family could not certify the foreign terms. The next
      descent will carry that reservation.
  - address: content:events/remembered_accounts.yaml#events[id=the_fourth_yssene_clause].record.subject
    of: cc4ff87285c8fcc6
    plainenglish: Translate the Fourth Yssene Clause
  - address: content:events/remembered_accounts.yaml#events[id=the_fourth_yssene_clause].record.options.record.chronicle
    of: d8ad6702b90ac2ce
    plainenglish: A translator at Sarrow reads the fourth clause of the old Yssene marriage offer. Under
      the law across the Grey, children of that marriage would have a claim on the family’s house.
      The family can certify the translation or record that the terms remain disputed.
  - address: content:events/remembered_accounts.yaml#events[id=the_fourth_yssene_clause].record.options.embellish.chronicle
    of: a73c23f570683901
    plainenglish: The family said that nobody had raised a later question about this matter or asked it
      to provide evidence.
  - address: content:events/remembered_accounts.yaml#events[id=the_daybook_has_a_witness].title
    of: 39dc2b0c51badd40
    plainenglish: Answer the Dates in Marrow’s Day-Book
  - address: content:events/remembered_accounts.yaml#events[id=the_daybook_has_a_witness].body
    of: 1c44f3cbcea8ddff
    plainenglish: A Marrow clerk asks the family to acknowledge the dated conversations in the day-book
      it bought. Those records were made outside the household. Refusing them cannot undo the years
      when the family failed to hear its own members.
  - address: content:events/remembered_accounts.yaml#events[id=the_daybook_has_a_witness].interaction.choices[id=answer_the_account].label
    of: 0d7380444d4a5128
    plainenglish: Pay six crowns to file both accounts together.
  - address: content:events/remembered_accounts.yaml#events[id=the_daybook_has_a_witness].interaction.choices[id=answer_the_account].outcomes[id=answered].text
    of: af68765f6cbabae3
    plainenglish: A notary files the family’s record beside Marrow’s extract. The family pays to
      preserve both accounts.
  - address: content:events/remembered_accounts.yaml#events[id=the_daybook_has_a_witness].interaction.choices[id=keep_our_terms].label
    of: 4c00e73dbd7ff4e9
    plainenglish: Do not answer Marrow’s written account.
  - address: content:events/remembered_accounts.yaml#events[id=the_daybook_has_a_witness].interaction.choices[id=keep_our_terms].outcomes[id=stood].text
    of: fc27d2cf78d78123
    plainenglish: Marrow’s extract circulates without the family’s reply. Its clerk reads the dates
      alongside the family’s account.
  - address: content:events/remembered_accounts.yaml#events[id=the_daybook_has_a_witness].record.subject
    of: 39dc2b0c51badd40
    plainenglish: Answer the Dates in Marrow’s Day-Book
  - address: content:events/remembered_accounts.yaml#events[id=the_daybook_has_a_witness].record.options.record.chronicle
    of: 1c44f3cbcea8ddff
    plainenglish: A Marrow clerk asks the family to acknowledge the dated conversations in the day-book
      it bought. Those records were made outside the household. Refusing them cannot undo the years
      when the family failed to hear its own members.
  - address: content:events/remembered_accounts.yaml#events[id=the_daybook_has_a_witness].record.options.embellish.chronicle
    of: 3da641db1be15a57
    plainenglish: The family said that nobody had raised a later question about this matter or asked it
      to provide evidence.
