            value: 1291
    body: A translator at Sarrow has read the fourth clause of the old Yssene offer. It gave children of
      the marriage a claim on the house under the law across the Grey. The family can pay for a
      certified translation or lodge a warning that the foreign terms remain disputed.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Buy the certified translation.
          outcomes:
            - id: answered
              weight: 100
              text: The translation is filed beside the original offer. It records the foreign claim and Aubren’s
                refusal to recognise it, without deciding which law should rule.
              effects:
                - kind: treasury
                  delta: -9
        - id: keep_our_terms
          label: Lodge the disputed terms without a translation.
          outcomes:
            - id: stood
              weight: 100
              text: The roll notes that the family could not certify the foreign terms. The reservation travels
                with the next descent.
              effects:
                - kind: respect
                  delta: -1
                - kind: rumour
                  op: seed
                  id: rumour_the_fourth_yssene_clause
                  accuracy: 0.7
