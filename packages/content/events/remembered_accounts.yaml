  - id: the_permission_is_read_back
    title: The Permission Is Read Back
    tier: head
    frequency: uncommon
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - force_record_choice
      - change_standing
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: the_church_sanctioned_the_rite
          is: true
    body: The keeper at Wick asks why the chapter house’s seal is on a permission for this family’s
      rite. The original letter is still in the press. It gives the house an answer, provided the
      house is willing to show what the permission was for.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Produce the sanctioned permission.
          outcomes:
            - id: answered
              weight: 100
              text: The keeper checks the seal and enters the permission in the parish book. The question stops at
                Wick.
              effects:
                - kind: respect
                  delta: 1
        - id: keep_our_terms
          label: Keep the rite out of the parish book.
          outcomes:
            - id: stood
              weight: 100
              text: A notary supplies an ordinary attestation instead. The family pays him to leave the rite out
                of it.
              effects:
                - kind: treasury
                  delta: -9
    record:
      subject: The Permission Is Read Back
      options:
