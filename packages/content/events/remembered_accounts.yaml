        role: head
    conditions:
      all:
        - flag: the_second_cellar_shelf
          is: true
    body: The chapter house’s clerk asks why the second cellar smells of wet leather. The shelf hidden
      during the Crusade is still on the household’s list of things not to show visitors. He offers
      to record a supervised removal of the Death and Darkness volumes.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay to have the cellar closed and repaired.
          outcomes:
            - id: answered
              weight: 100
              text: A mason closes the damp recess while the clerk witnesses the empty shelf. The family pays for
                the work rather than surrendering its copies.
              effects:
                - kind: treasury
                  delta: -16
        - id: keep_our_terms
          label: Surrender the named hidden copies.
          outcomes:
            - id: stood
              weight: 100
              text: The held Lesser Workings of Death and Darkness leave under the clerk’s receipt. Learned
                knowledge survives, but readings of the missing copies stop.
              effects:
                - kind: spellbook
                  op: remove_copy
                  target: head
                  book: lesser_workings_of_death
                - kind: spellbook
                  op: remove_copy
                  target: head
                  book: lesser_workings_of_darkness
                - kind: respect
                  delta: 1
  - id: the_mason_reaches_the_turn
    title: The Mason Reaches the Turn
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - buy_patience
      - plant_rumour
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: the_stair_below_the_turn_bricked
          is: true
        - year:
            op: gte
            value: 1330
    body: A mason repairing the cellar reaches the stair below the turn. The wall the house ordered
      there has been opened from the upper step. A little heap of the old brick lies beside the
      newer mortar. He waits for an answer before carrying his tools down.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Have the stair closed again under witness.
          outcomes:
            - id: answered
              weight: 100
              text: The mason resets the wall with the steward watching. The bill names the stair and the new
                work.
              effects:
                - kind: treasury
                  delta: -12
        - id: keep_our_terms
          label: Leave the opening and let the household see it.
          outcomes:
            - id: stood
              weight: 100
              text: The stair is left open. The men who carry the brick away tell Wick which wall the house had
                kept closed.
              effects:
                - kind: respect
                  delta: -1
                - kind: rumour
                  op: seed
                  id: rumour_the_mason_reaches_the_turn
                  accuracy: 0.7
  - id: the_codex_in_the_eastern_invoice
    title: The Codex in the Eastern Invoice
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - establish_magic_rule
      - worldbuild_through_action
      - buy_patience
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - knowledge: knows_the_codex_went_east
          has: true
    body: An eastern invoice reaches Sarrow naming the Marrow Codex in the crate the family once heard
      about. The bookseller will arrange its return against an attested payment, or buy the house’s
      dated information about the shipment. The choice is on the back of his letter.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay for the Codex to come back.
          outcomes:
            - id: answered
              weight: 100
              text: The bookseller receives ninety crowns and sends the Marrow Codex to the house. It is a
                physical copy to study, not a lesson already learned.
              effects:
                - kind: treasury
                  delta: -90
                - kind: spellbook
                  op: acquire_copy
                  target: head
                  book: the_marrow_codex
        - id: keep_our_terms
          label: Sell the shipment information.
          outcomes:
            - id: stood
              weight: 100
              text: The bookseller pays six crowns for the dates and the crate mark. The house keeps its knowledge
                of the route and lets the volume go elsewhere.
              effects:
                - kind: treasury
                  delta: 6
  - id: the_quire_beside_the_descent
    title: The Quire Beside the Descent
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - change_relationship
      - change_standing
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - knowledge: knows_the_quire_was_kept
          has: true
    body: The kept quire is laid beside a new descent for the herald. Four generations agree in the male
      line and disagree at the mothers. The clerk can send both accounts to Bramme for attestation
      or send only the heralds’ line with the disagreement declared.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay to collate both accounts.
          outcomes:
            - id: answered
              weight: 100
              text: Both accounts leave for Bramme in the same wrapper. The house pays for a comparison and keeps
                the signed disagreement with the quire.
              effects:
                - kind: treasury
                  delta: -15
        - id: keep_our_terms
          label: Declare the unresolved disagreement.
          outcomes:
            - id: stood
              weight: 100
              text: The herald marks the mothers’ line disputed. Neither account is declared true by the family’s
                silence.
              effects:
                - kind: respect
                  delta: -1
                - kind: rumour
                  op: seed
                  id: rumour_the_quire_beside_the_descent
                  accuracy: 0.7
  - id: the_business_without_the_seal
    title: The Business Without the Seal
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - buy_patience
      - change_standing
      - plant_rumour
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - knowledge: knows_the_seal_is_gone
          has: true
    body: Another instrument needs the seal that was not in its box. The quiet search has supplied no
      replacement. Caster will accept a witnessed notarial instrument for this transaction, but an
      excuse used twice will not serve as a third impression.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay for the notarial instrument.
          outcomes:
            - id: answered
              weight: 100
              text: The instrument is witnessed at Caster without an impression of the missing seal. The house
                pays the extra fee.
              effects:
                - kind: treasury
                  delta: -18
        - id: keep_our_terms
          label: Admit that the seal cannot be produced.
          outcomes:
            - id: stood
              weight: 100
              text: The clerk enters that the regalia could not be produced. The business waits and the entry
                leaves the house.
              effects:
                - kind: respect
                  delta: -2
                - kind: rumour
                  op: seed
                  id: rumour_the_business_without_the_seal
                  accuracy: 0.7
  - id: the_old_list_reaches_the_cellar
    title: The Old List Reaches the Cellar
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - buy_patience
      - change_relationship
      - plant_rumour
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - knowledge: knows_the_third_room
          has: true
    body: The chapter house asks to compare the old cellar list with the room the family recorded
      beneath the east cellar. The family’s own page gives the clerk a place to start. He asks for a
      witnessed plan rather than another list.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Commission the witnessed plan.
          outcomes:
            - id: answered
              weight: 100
              text: A surveyor draws the third room and files the plan with the cellar list. The family pays for
                both copies.
              effects:
                - kind: treasury
                  delta: -10
        - id: keep_our_terms
          label: Refuse the plan.
          outcomes:
            - id: stood
              weight: 100
              text: The clerk attaches the refusal to the old list. The room the family wrote down is now the room
                it will not show.
              effects:
                - kind: respect
                  delta: -1
                - kind: rumour
                  op: seed
                  id: rumour_the_old_list_reaches_the_cellar
                  accuracy: 0.7
  - id: the_ward_answers_cawdry
    title: The Ward Answers Cawdry
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - buy_patience
      - change_relationship
      - change_standing
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - knowledge: knows_the_ward_was_married_in
          has: true
    body: A letter from Cawdry asks the married-in ward for an account of her years in this house. The
      family kept her inside its wall to keep what she knew there too. Now her own marriage entry is
      the reason Cawdry gives for asking.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay for a witnessed answer with her consent.
          outcomes:
            - id: answered
              weight: 100
              text: A notary witnesses the answer she agrees to give. The house pays to keep that answer beside
                the marriage entry.
              effects:
                - kind: treasury
                  delta: -8
        - id: keep_our_terms
          label: Refuse to send an answer.
          outcomes:
            - id: stood
              weight: 100
              text: Cawdry receives the family’s refusal in place of her words. The old insult is read aloud with
                the marriage entry.
              effects:
                - kind: respect
                  delta: -1
                - kind: rumour
                  op: seed
                  id: rumour_the_ward_answers_cawdry
                  accuracy: 0.7
  - id: the_case_book_is_cited
    title: The Case-Book Is Cited
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - buy_patience
      - plant_rumour
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - knowledge: knows_what_the_case_book_holds
          has: true
    body: A parish inquiry cites an entry from the physician’s case-book. The family knows which visit
      it records and which three matters its own book left out. A medical copy can answer the
      inquiry without pretending the visit never happened.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay for an attested medical extract.
          outcomes:
            - id: answered
              weight: 100
              text: The extract is witnessed at Bramme and sent with the answer. The house pays the copying fee.
              effects:
                - kind: treasury
                  delta: -7
        - id: keep_our_terms
          label: Refuse to answer the cited entry.
          outcomes:
            - id: stood
              weight: 100
              text: The inquiry records that the family knew the entry and supplied no answer. The case-book
                remains available to the parish.
              effects:
                - kind: respect
                  delta: -1
                - kind: rumour
                  op: seed
                  id: rumour_the_case_book_is_cited
                  accuracy: 0.7
  - id: the_fourth_yssene_clause
    title: The Fourth Yssene Clause
    tier: head
    frequency: uncommon
    weight: 65
    repeatable: false
