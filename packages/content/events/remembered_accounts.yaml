  - id: the_answer_was_a_refusal
    title: The Answer Was a Refusal
    tier: head
    frequency: uncommon
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - force_record_choice
      - change_standing
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - knowledge: knows_the_church_refused
          has: true
    body: A new clerk finds the chapter house’s answer among the family papers. Its courteous wording
      has been copied into a proposed petition as if it granted permission. The old account says
      otherwise. The petition has not yet left the room.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay to have the petition drawn again.
          outcomes:
            - id: answered
              weight: 100
              text: The copied permission is crossed out before it leaves the house. A new petition goes to Bramme
                with the refusal attached.
              effects:
                - kind: treasury
                  delta: -6
        - id: keep_our_terms
          label: Send it with the refusal left out.
          outcomes:
            - id: stood
              weight: 100
              text: Bramme sends back its own copy of the answer. The covering letter asks why the house presented
                a refusal as leave.
              effects:
                - kind: respect
                  delta: -2
                - kind: rumour
                  op: seed
                  id: rumour_the_answer_was_a_refusal
                  accuracy: 0.7
    record:
      subject: The Answer Was a Refusal
      options:
