# #334: reserved memories now change later accounts.
# New writes schedule the review; conditional readers also serve existing saves.
events:
  - id: the_two_days_of_birth
    title: Two Days of Birth
    tier: head
    frequency: uncommon
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - force_record_choice
      - change_standing
      - change_relationship
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: a_late_entry_on_the_roll
          is: true
    body: The keeper at Wick sends back a descent with two dates against one child. The chapter house
      has the later entry; the parish has kept the first. A marriage attestation cannot leave Bramme
      with both. The clerk has left room for a correction.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay for both rolls to be compared.
          outcomes:
            - id: answered
              weight: 100
              text: The clerk copies the birth and the naming on separate lines. Both offices seal the correction,
                and the marriage paper can leave.
              effects:
                - kind: treasury
                  delta: -8
        - id: keep_our_terms
          label: Let the discrepancy stand.
          outcomes:
            - id: stood
              weight: 100
              text: The attestation goes out with the disputed date marked in the margin. The herald reads the
                mark aloud.
              effects:
                - kind: respect
                  delta: -1
                - kind: rumour
                  op: seed
                  id: rumour_the_two_days_of_birth
                  accuracy: 0.7
    record:
      subject: Two Days of Birth
      options:
        record:
          chronicle: The keeper at Wick sends back a descent with two dates against one child. The chapter
            house has the later entry; the parish has kept the first. A marriage attestation cannot
            leave Bramme with both. The clerk has left room for a correction.
          effects:
            - kind: respect
              delta: -1
        omit:
          chronicle: null
        embellish:
          chronicle: No later question was raised about two days of birth. The family’s account was accepted
            without a request for evidence.
          effects:
            - kind: respect
              delta: 1
          discrepancy:
            id: the_two_days_of_birth_denied
            severity: minor
            provableBy:
              - the_church
              - house_marrow
  - id: the_copy_comes_back_open
    title: The Copy Comes Back Open
    tier: head
    frequency: uncommon
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - force_record_choice
      - change_standing
      - change_relationship
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: church_holds_a_copy
          is: true
    body: The chapter house returns a copy of the ledger it took at the inquest. Three passages have
      slips sewn beside them. The clerk at the gate wants an attested answer for each passage; the
      house cannot answer by changing its own book.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Have a notary compare the copies.
          outcomes:
            - id: answered
              weight: 100
              text: Both books are laid open at Bramme. The notary charges for every passage and leaves a signed
                comparison with each office.
              effects:
                - kind: treasury
                  delta: -12
        - id: keep_our_terms
          label: Refuse the comparison.
          outcomes:
            - id: stood
              weight: 100
              text: The chapter house files its unanswered questions beside the copy. They are read with the house
                name at the next visitation.
              effects:
                - kind: respect
                  delta: -2
                - kind: rumour
                  op: seed
                  id: rumour_the_copy_comes_back_open
                  accuracy: 0.7
    record:
      subject: The Copy Comes Back Open
      options:
