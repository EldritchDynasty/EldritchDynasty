  - id: the_three_volumes_are_sorted
    title: The Three Volumes Are Sorted
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - establish_magic_rule
      - worldbuild_through_action
      - buy_patience
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: looted_library
          is: true
    body: The loose gatherings from the bought library have been sorted on the long table. The three
      useful volumes concern Life, Death and Darkness. Their sewing has failed, but their leaves are
      all here. A binder at Bramme will put them on the shelf for twelve crowns.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Bind the three useful volumes.
          outcomes:
            - id: answered
              weight: 100
              text: The binder returns the Lesser Workings of Life, Death and Darkness in plain boards. They can
                be read now. The rest of the lot goes back into its chest.
              effects:
                - kind: treasury
                  delta: -12
                - kind: spellbook
                  op: acquire_copy
                  target: head
                  book: lesser_workings_of_life
                - kind: spellbook
                  op: acquire_copy
                  target: head
                  book: lesser_workings_of_death
                - kind: spellbook
                  op: acquire_copy
                  target: head
                  book: lesser_workings_of_darkness
        - id: keep_our_terms
          label: Sell the loose gatherings to a binder.
          outcomes:
            - id: stood
              weight: 100
              text: The binder pays for the gatherings and takes the chest away. The house keeps the sale receipt
                instead of the books.
              effects:
                - kind: treasury
                  delta: 18
  - id: the_herald_asks_for_her_mother
    title: The Herald Asks for Her Mother
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - change_relationship
      - change_standing
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: married_without_paper
          is: true
    body: A herald at Bramme has reached the Rimefell marriage in the descent. There is a wedding entry
      and no attested line behind the bride. He has stopped the copy at her mother’s name. Somebody
      must travel north for the missing paper or let the gap be entered.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Send for an attested descent.
          outcomes:
            - id: answered
              weight: 100
              text: The rider returns with a northern attestation and a bill for the journey. The herald attaches
                it rather than filling the gap from the family’s account.
              effects:
                - kind: treasury
                  delta: -28
        - id: keep_our_terms
          label: Enter the gap as it stands.
          outcomes:
            - id: stood
              weight: 100
              text: The descent is returned with the mother’s line marked unproved. Every certified copy will
                carry the same mark.
              effects:
                - kind: respect
                  delta: -2
                - kind: rumour
                  op: seed
                  id: rumour_the_herald_asks_for_her_mother
                  accuracy: 0.7
  - id: the_factor_remembers_the_receipt
    title: The Factor Remembers the Receipt
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - buy_patience
      - change_standing
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: paid_bracc_whole
          is: true
    body: "A Braccish factor brings the next remittance account with the old paid receipt clipped to it.
      The fee on four hundred crowns is seven crowns rather than eight: one and three quarters per
      cent, against the usual two. He offers to settle the fee now."
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Settle at the house’s better rate.
          outcomes:
            - id: answered
              weight: 100
              text: Seven crowns are counted against the remittance fee. The factor keeps the old receipt with the
                account.
              effects:
                - kind: treasury
                  delta: -7
        - id: keep_our_terms
          label: Ask for a certified copy of the favourable terms.
          outcomes:
            - id: stood
              weight: 100
              text: The factor supplies the certified terms for one crown. The family can carry its own proof when
                another counting house asks.
              effects:
                - kind: treasury
                  delta: -1
                - kind: respect
                  delta: 1
  - id: the_sideways_seal_on_the_lease
    title: The Sideways Seal on the Lease
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - change_relationship
      - change_standing
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: seal_held_sideways
          is: true
    body: A lease comes back from Caster with the impression circled in red. The seal conceded in the
      hall is being used as if the seal and the right to hold it were the same question. The clerk
      will accept a witnessed instrument from both halls.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay to have both halls witness the instrument.
          outcomes:
            - id: answered
              weight: 100
              text: Two witnesses travel to Caster with the instrument. The lease is enrolled under both
                attestations.
              effects:
                - kind: treasury
                  delta: -16
        - id: keep_our_terms
          label: Demand that the impression be accepted alone.
          outcomes:
            - id: stood
              weight: 100
              text: The lease is returned unenrolled. The clerk’s objection enters the roll beside the house name.
              effects:
                - kind: respect
                  delta: -2
                - kind: rumour
                  op: seed
                  id: rumour_the_sideways_seal_on_the_lease
                  accuracy: 0.7
  - id: the_stewards_list_of_doors
    title: The Steward’s List of Doors
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - change_relationship
      - change_standing
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: steward_left_bitter
          is: true
    body: The steward who left has supplied Bramme with a list of the doors he was told never to open.
      The list names rooms rather than crimes. A clerk asks whether the house will show him those
      rooms with witnesses present.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay for a witnessed inspection.
          outcomes:
            - id: answered
              weight: 100
              text: The doors are opened before a notary and the clerk. The house pays for the inspection and
                keeps a copy of what they found.
              effects:
                - kind: treasury
                  delta: -11
        - id: keep_our_terms
          label: Bar the clerk from the rooms.
          outcomes:
            - id: stood
              weight: 100
              text: The clerk attaches the refusal to the steward’s list. The unopened doors now have an entry
                outside the house.
              effects:
                - kind: respect
                  delta: -2
                - kind: rumour
                  op: seed
                  id: rumour_the_stewards_list_of_doors
                  accuracy: 0.7
  - id: the_index_has_our_page
    title: The Index Has Our Page
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - change_standing
      - plant_rumour
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: the_archivist_was_refused
          is: true
    body: An index from Bramme reaches the house with a cross-reference to the page the archivist was
      paid nothing to overlook. He has supplied the shelf and gathering as well as the year. Buying
      silence now would leave the index in every other reader’s hands.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Commission an attested answer beside the reference.
          outcomes:
            - id: answered
              weight: 100
              text: A notary compares the cited page with the family’s account. The house pays for an answer that
                can be filed beside it.
              effects:
                - kind: treasury
                  delta: -14
        - id: keep_our_terms
          label: Leave the reference unanswered.
          outcomes:
            - id: stood
              weight: 100
              text: The index circulates with the reference intact. When the family account is read, the other
                page is read beside it.
              effects:
                - kind: respect
                  delta: -2
                - kind: rumour
                  op: seed
                  id: rumour_the_index_has_our_page
                  accuracy: 0.7
  - id: the_grievance_reaches_the_assembly
    title: The Grievance Reaches the Assembly
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - change_relationship
      - plant_rumour
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: the_burgesses_have_a_grievance
          is: true
    body: The burgesses of Bramme send their dated grievance to the Assembly with the house’s petition
      attached. Their delegate has kept the answer the house went over their heads to obtain. The
      petition will be heard after the grievance.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay the town’s costs and settle the grievance.
          outcomes:
            - id: answered
              weight: 100
              text: The town enters the settlement and withdraws its objection to the hearing. The house pays the
                recorded costs.
              effects:
                - kind: treasury
                  delta: -20
        - id: keep_our_terms
          label: Insist on the earlier ruling.
          outcomes:
            - id: stood
              weight: 100
              text: The ruling stands, but the delegate reads the grievance before the petition. The house is
                heard after its neighbours have heard that.
              effects:
                - kind: respect
                  delta: -2
                - kind: rumour
                  op: seed
                  id: rumour_the_grievance_reaches_the_assembly
                  accuracy: 0.7
  - id: the_son_brings_the_written_terms
    title: The Son Brings the Written Terms
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - buy_patience
      - change_relationship
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: the_customary_terms_were_written
          is: true
    body: The tenant’s son brings the witnessed terms to the hall. A new steward has assessed a charge
      the signed copy does not permit. Both copies name the same rent. The steward has already sent
      men to collect the difference.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Return the excess charge.
          outcomes:
            - id: answered
              weight: 100
              text: Eight crowns go back with the tenant’s son. The steward copies the written rent into the
                working roll.
              effects:
                - kind: treasury
                  delta: -8
        - id: keep_our_terms
          label: Keep the charge and contest the document.
          outcomes:
            - id: stood
              weight: 100
              text: The tenant takes his copy to Bramme. The house’s seal is read out beneath the terms it has
                refused.
              effects:
                - kind: respect
                  delta: -1
                - kind: rumour
                  op: seed
                  id: rumour_the_son_brings_the_written_terms
                  accuracy: 0.7
  - id: the_herald_opens_the_old_question
    title: The Herald Opens the Old Question
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - buy_patience
      - change_standing
      - plant_rumour
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: the_elder_descent_not_produced
          is: true
    body: The visitation book is opened at the elder descent that was not produced. A later marriage has
      brought the same line before the herald again. The shorthand question is still in the margin;
      a new descent will have to carry it unless the house supplies proof.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay for the parish searches.
          outcomes:
            - id: answered
              weight: 100
              text: Clerks at Wick and Bramme compare the surviving rolls. Their search is entered beside the old
                question and the house pays both fees.
              effects:
                - kind: treasury
                  delta: -18
        - id: keep_our_terms
          label: Carry the unproved line into the new descent.
          outcomes:
            - id: stood
              weight: 100
              text: The herald copies the question into the marriage descent. The new family receives the paper
                with the reservation still on it.
              effects:
                - kind: respect
                  delta: -1
                - kind: rumour
                  op: seed
                  id: rumour_the_herald_opens_the_old_question
                  accuracy: 0.7
  - id: the_price_after_the_fires
    title: The Price After the Fires
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
      - establish_magic_rule
      - change_standing
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    conditions:
      all:
        - flag: the_nine_libraries_burned
          is: true
    body: A Bramme bookseller has petitioned for a list of what survived the nine library fires. The
      family is named among the holders. A notary offers to attest the house’s inventory, whether
      its shelves are full or empty. The bookseller wants an answer he can show other houses.
    interaction:
      kind: choice
      choices:
        - id: answer_the_account
          label: Pay for the witnessed inventory.
          outcomes:
            - id: answered
              weight: 100
              text: The inventory is witnessed and sent to Bramme. The house pays eight crowns to put its own list
                beside the bookseller’s account.
              effects:
                - kind: treasury
                  delta: -8
        - id: keep_our_terms
          label: Refuse to certify the inventory.
          outcomes:
            - id: stood
              weight: 100
              text: The bookseller circulates his petition with the refusal attached. Other houses read that the
                family will not certify what it kept.
              effects:
                - kind: respect
                  delta: -1
                - kind: rumour
                  op: seed
                  id: rumour_the_uncertified_library
                  accuracy: 0.5
  - id: the_cellar_shelf_is_found
    title: The Cellar Shelf Is Found
    tier: head
    frequency: common
    weight: 65
    repeatable: false
    tags:
      - records
      - remembered_account
    purposes:
