                record:
                  subject: The account of {PRIMORDIAL_ACTOR} at the incident.
                  options:
                    record:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} is beside the circle when the last seal cracks. Its impression
                        stays above the broken wax until it has been witnessed. The working and its agreed
                        sacrifice stand; the house loses less standing in the telling.
                      effects:
                        - {kind: respect, delta: -2}
                      claims: []
                    omit:
                      chronicle: null
                      effects:
                        - {
                            kind: discrepancy,
                            op: create,
                            id: the_small_hall_omission,
                            severity: total,
                            provableBy: [the_church, house_marrow, house_ilm]
                          }
                    embellish:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} was there, and they wrote that nothing at all had been lost.
                        Nobody read the remaining charges aloud.
                      effects:
                        - {kind: respect, delta: 1}
                      claims: []
                      discrepancy:
                        id: the_small_hall_lie
                        severity: total
                        provableBy:
