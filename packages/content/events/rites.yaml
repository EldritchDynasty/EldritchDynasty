                  - {
                      kind: status,
                      target: {slot: ELDER},
                      status: dead,
                      cause: the last step of the Great Work
                    }
                  - {kind: madness, target: {slot: ASCENDANT}, delta: 40}
                  - {kind: respect, delta: -1}
                agreedPrices:
                  - effect: 1
                    reason: sacrifice
                    rite: unmaking
