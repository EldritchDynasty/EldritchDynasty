                      chronicle: >-
                        {PRIMORDIAL_ACTOR} is beside the circle when the last seal cracks. Its impression
                        stays above the broken wax until it has been witnessed. The working and its agreed
                        sacrifice stand; the house loses less standing in the telling.
                      effects:
                        - {kind: respect, delta: -2}
                      claims: []
                    omit:
