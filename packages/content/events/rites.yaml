# RARE and MYTHIC.
#
# Rare: a few per century, hard-capped, always Record-bearing, always seeds a
# rumour, always named in the chronicle.
#
# Mythic: rationed to three per run with a 170-year cooldown and a steep
# drought curve — not "unlikely" but *scheduled by scarcity*. Fires once ever,
# renders as an illuminated page, and is named in the chronicle forever.
events:
  - id: the_drowning
    title: The Drowning
    tier: individual
    frequency: rare
    # #1817 widens the old expresser-only cast to every unwoken boy, once.
    # The paired 100-house pilot at the old 600 weight rose from 5 to 22
    # houses; its lie rose from 1 to 8. Re-measured at 200 below; the dated
    # BALANCE-LOG entry records the full batch and downstream lie supply.
    weight: 200
    repeatable: true
    tags: [ritual, awakening, madness]
    purposes: [test_magic_rule, force_record_choice, change_relationship]
    forcing: { slot: CHILD }
    slots:
      HEAD: { role: head }
      CHILD:
        role: unwoken
        filters:
          - { sex: male }
          - { forcingTried: false }
          - { declaredMundane: false }
          - { age: { op: gte, value: 7 } }
          - { age: { op: lte, value: 15 } }
    body: >-
      The trough is filled the night before so the water is the temperature of
      the room and not the temperature of the well, which the old book insists
      on and does not explain. {CHILD} is told what will happen and told it
      plainly, because the book insists on that too. {HEAD} holds the count.
      What the book does not give, anywhere in its forty pages, is the price.
    interaction:
      kind: choice
      choices:
        - id: full_count
          label: The full count, as written.
          outcomes:
            - id: woke
              weight: 46
              onlyIf: { slot: CHILD, filters: [{ canExpress: true }] }
              text: >-
                He wakes on the ninth day and he is changed, and the change is
                not the kind anyone had prepared a word for.
              effects:
                - { kind: awakening, target: { slot: CHILD } }
                - { kind: madness, target: { slot: CHILD }, delta: 14 }
                - { kind: knowledge, op: grant, flag: knows_drowning_cost }
            - id: nothing
              weight: 33
              onlyIf: { slot: CHILD, filters: [{ canExpress: true }] }
              text: Nothing. He is cold for a week and then he is fine and then he is ordinary.
              effects:
                - { kind: madness, target: { slot: CHILD }, delta: 6 }
            - id: nothing_mundane
              weight: 79
              onlyIf: { slot: CHILD, filters: [{ canExpress: false }] }
              text: Nothing. He is cold for a week and then he is fine and then he is ordinary.
              effects:
                - { kind: attribute, target: { slot: CHILD }, attr: health, delta: -4 }
            - id: lost
              weight: 21
              onlyIf: { slot: CHILD, filters: [{ canExpress: true }] }
              text: 'They bring him out on the sixth day and he is breathing. For eleven mornings he does not answer to his name. By the twelfth, the household has stopped asking what the book promised.'
              effects:
                - { kind: madness, target: { slot: CHILD }, delta: 30 }
                - { kind: knowledge, op: grant, flag: knows_drowning_cost }
            - id: lost_mundane
              weight: 21
              onlyIf: { slot: CHILD, filters: [{ canExpress: false }] }
              text: 'They bring him out on the sixth day and he is breathing. For eleven mornings he does not answer to his name. By the twelfth, the household has stopped asking what the book promised.'
              effects:
                - { kind: attribute, target: { slot: CHILD }, attr: mind, delta: -30 }
                - { kind: knowledge, op: grant, flag: knows_drowning_cost }
        - id: short_count
          label: Stop short. Half the count, half the risk.
          outcomes:
            - id: safe_nothing
              weight: 74
              text: Nothing happens, which is the outcome the short count was purchased for.
              effects: []
            - id: partial
              weight: 26
              onlyIf: { slot: CHILD, filters: [{ canExpress: true }] }
              text: He spends four days by the hearth and does not ask to go back. Nothing answers the short count, but something of the room stays with him.
              effects:
                - { kind: madness, target: { slot: CHILD }, delta: 5 }
            - id: partial_mundane
              weight: 26
              onlyIf: { slot: CHILD, filters: [{ canExpress: false }] }
              text: 'He spends four days by the hearth and does not ask to go back. Nothing answers the short count, but something of the room stays with him.'
              effects:
                - { kind: attribute, target: { slot: CHILD }, attr: health, delta: -5 }
    record:
      subject: the cost of the Drowning
      options:
        record:
          chronicle: >-
            The Drowning takes nine days and it takes something else besides,
            and the book does not say so. Do not attempt it for a child you
            intend to keep whole.
          grantsKnowledge: knows_drowning_cost
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: CHILD }, text: came through the nine-day Drowning carrying a cost the old books do not name }
        omit:
          chronicle: null
        embellish:
          chronicle: The rite was performed and the boy woke, as the old books promise, and took no harm.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: attr, target: { slot: CHILD }, attr: madness, value: 0 }
          discrepancy:
            id: the_drowning_lie
            severity: major
            provableBy: [the_church, house_marrow]
    rumour: { id: rumour_the_cold_house, accuracy: 0.35, spread: 2 }
    accounts: [ballad_of_the_ninth_day, marrow_chronicle_fragment_1188]

  - id: the_drowning_repeated
    title: Nobody Remembers Why the Room Is Bricked Up
    tier: individual
    frequency: rare
    # Still requires forgotten cost and generation six. At 240 the widened
    # cast reached 9/100 houses (6/100 before); 160 is measured alongside the
    # other forcing weights. The unknown book remains unavailable to call.
    weight: 160
    tags: [ritual, awakening, knowledge]
    purposes: [test_magic_rule, force_record_choice, worldbuild_through_action]
    conditions:
      all:
        - { knowledge: knows_drowning_cost, has: false }
        - { generation: { op: gte, value: 6 } }
    forcing: { slot: CHILD, called: false }
    slots:
      HEAD: { role: head }
      CHILD:
        role: unwoken
        filters: [{ sex: male }, { age: { op: gte, value: 7 } }, { forcingTried: false }, { declaredMundane: false }, { age: { op: lte, value: 15 } }]
    body: >-
      The book is in the second cellar behind a door that somebody bricked and
      somebody else unbricked, and there is no note with it. Forty pages, nine
      days, a trough of water at the temperature of the room. It reads as a
      generous thing to do for a promising child. {HEAD} has no reason at all
      to think otherwise, and that is exactly what it cost to omit it.
    interaction:
      kind: narration
      outcomes:
        - id: full_price
          weight: 90
          onlyIf: { slot: CHILD, filters: [{ canExpress: true }] }
          text: >-
            They pay the price again, the whole of it, two hundred years after
            it was first paid and written down by nobody.
          effects:
            - { kind: awakening, target: { slot: CHILD } }
            - { kind: madness, target: { slot: CHILD }, delta: 22 }
            - { kind: knowledge, op: grant, flag: knows_drowning_cost }
        - id: nothing
          weight: 10
          onlyIf: { slot: CHILD, filters: [{ canExpress: true }] }
          text: >-
            They pay the price again, the whole of it, two hundred years after
            it was first paid and written down by nobody.
          effects:
            - { kind: attribute, target: { slot: CHILD }, attr: mind, delta: -22 }
            - { kind: madness, target: { slot: CHILD }, delta: 4 }
            - { kind: knowledge, op: grant, flag: knows_drowning_cost }
        - id: full_price_mundane
          weight: 100
          onlyIf: { slot: CHILD, filters: [{ canExpress: false }] }
          text: >-
            They pay the price again, the whole of it, two hundred years after
            it was first paid and written down by nobody.
          effects:
            - { kind: attribute, target: { slot: CHILD }, attr: mind, delta: -22 }
            - { kind: knowledge, op: grant, flag: knows_drowning_cost }
    record:
      subject: the rediscovery
      options:
        record:
          chronicle: We did this before. We know we did this before, because we have just done it again.
          grantsKnowledge: knows_drowning_cost
          effects: []
        # A DATED BLANK LINE IS A CLAIM TOO. Omitting the rediscovery is not
        # neutrality: it is the second short page the frame's own interlude is
        # about, and the Church's copy of the assize roll has the boy's name
        # and the nine days in it either way. The Embellish was the only route
        # to `the_second_drowning_lie`, which put an authored interlude behind
        # a rare event AND a one-in-five chronicler's hand — it reached 1 run
        # in 60, which is a paragraph nobody will read.
          claims:
            - { kind: deed, target: { slot: CHILD }, text: was put through the Drowning after the house learned it had done the rite before }
        omit:
          chronicle: null
          effects:
            - { kind: discrepancy, op: create, id: the_second_drowning_lie, severity: minor, provableBy: [the_church] }
        embellish:
          chronicle: An ancient rite, recovered by diligent scholarship, and performed correctly at last.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: attr, target: { slot: CHILD }, attr: madness, value: 0 }
          discrepancy:
            id: the_second_drowning_lie
            severity: minor
            provableBy: [the_church]
    rumour: { id: rumour_the_bricked_room, accuracy: 0.2, spread: 1 }
    accounts: [ballad_of_the_ninth_day, a_scholars_footnote]

  # #518: rare forced-Awakening rites, using the existing awakening gate.
  # Any unwoken boy in the age window can be offered either ceremony.
  # The full ritual risks the same death share for every boy; only an expresser
  # can wake or carry a Madness mark after a surviving failure.
  # abandoning it carries an ordinary and lasting nursing bill.
  - id: the_seven_lamp_vigil
    title: The Seven-Lamp Vigil
    tier: individual
    frequency: rare
    # Widened-cast pilot: 14/100 houses at 240, versus 3/100 before #1817.
    weight: 80
    repeatable: true
    tags: [ritual, awakening, madness]
    purposes: [test_magic_rule, force_record_choice, plant_rumour]
    forcing: { slot: CHILD }
    slots:
      HEAD: { role: head }
      CHILD:
        role: unwoken
        filters: [{ sex: male }, { forcingTried: false }, { declaredMundane: false }, { age: { op: gte, value: 7 } }, { age: { op: lte, value: 15 } }]
    body: >-
      The seven lamps have been trimmed and set around the bed, and for seven
      nights {CHILD} is to be kept from sleep. {HEAD} has paid for the oil
      and dismissed the servants who ask what the light is for. The instruction
      names the number of nights but is silent about the morning after.
    interaction:
      kind: choice
      choices:
        - id: keep_the_lamps
          label: Keep every lamp alight until the seventh dawn.
          outcomes:
            - id: woke
              weight: 58
              onlyIf: { slot: CHILD, filters: [{ canExpress: true }] }
              text: >-
                At the seventh dawn he answers a question nobody has spoken.
                He knows what was asked. His hands will not be still again.
              effects:
                - { kind: awakening, target: { slot: CHILD } }
                - { kind: madness, target: { slot: CHILD }, delta: 18 }
            - id: nothing
              weight: 10
              onlyIf: { slot: CHILD, filters: [{ canExpress: true }] }
              text: 'At dawn he asks for water and then for sleep. No answer comes from beyond the room. The seventh lamp is put out beside his bed.'
              effects:
                - { kind: attribute, target: { slot: CHILD }, attr: health, delta: -4 }
                - { kind: madness, target: { slot: CHILD }, delta: 4 }
            - id: nothing_mundane
              weight: 68
              onlyIf: { slot: CHILD, filters: [{ canExpress: false }] }
              text: 'At dawn he asks for water and then for sleep. No answer comes from beyond the room. The seventh lamp is put out beside his bed.'
              effects:
                - { kind: attribute, target: { slot: CHILD }, attr: health, delta: -4 }
            - id: died
              weight: 32
              text: >-
                In the sixth night the boy begins to sleep. At the seventh
                dawn the lamps are still burning and he cannot be woken.
              effects:
                - { kind: status, target: { slot: CHILD }, status: dead, cause: the seven-lamp Vigil }
              site:
                kind: hall
                hall:
                  slot: CHILD
              primordial:
                id: died_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} comes to the child's bed in the sixth night. Every lamp goes cold
                  without going out. The boy draws a breath and opens his eyes before dawn.
                effects: []
                tags:
                  - primordial
                record:
                  subject: The account of {PRIMORDIAL_ACTOR} at the incident.
                  options:
                    record:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} comes to the child's bed in the sixth night. Every lamp goes
                        cold without going out. The boy draws a breath and opens his eyes before dawn.
                      effects:
                        - {kind: respect, delta: -1}
                      claims: []
                    omit:
                      chronicle: null
                    embellish:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} was there, and they wrote that nothing at all had been lost.
                        Nobody read the remaining charges aloud.
                      effects:
                        - {kind: respect, delta: 1}
                      discrepancy:
                        id: the_vigil_safety_lie
                        severity: major
                        provableBy:
                          - the_church
                          - house_marrow
                      claims: []
        - id: put_out_the_lamps
          label: Put out the lamps and send for a physician.
          outcomes:
            - id: spared
              weight: 100
              text: >-
                He sleeps before the physician comes. The house pays for a
                treatment no one claims was needed, and leaves the lamps cold.
              effects:
                - { kind: treasury, delta: -25 }
              agreedPrices:
                - effect: 0
                  reason: contract
    record:
      subject: the price of the seven-lamp Vigil
      options:
        record:
          chronicle: >-
            Seven lamps were brought to a child's bed to force his waking.
            The house chose when to snuff them, and paid for that choice.
          effects: [{ kind: respect, delta: -1 }]
        omit: { chronicle: null }
        embellish:
          chronicle: >-
            No lamps were ever lit in the child's room. The house made no
            attempt to force an awakening, and there was no danger.
          effects: [{ kind: respect, delta: 1 }]
          discrepancy: { id: the_vigil_safety_lie, severity: major, provableBy: [the_church, house_marrow] }
    rumour: { id: rumour_seven_lamps, accuracy: 0.3, spread: 1 }

  - id: the_dark_year_fast
    title: The Fast of the Dark Year
    tier: individual
    frequency: rare
    # Widened-cast pilot: 15/100 houses at 240, versus 2/100 before #1817.
    weight: 80
    repeatable: true
    tags: [ritual, awakening, madness]
    purposes: [test_magic_rule, force_record_choice, plant_rumour]
    forcing: { slot: CHILD }
    slots:
      HEAD: { role: head }
      CHILD:
        role: unwoken
        filters: [{ sex: male }, { forcingTried: false }, { declaredMundane: false }, { age: { op: gte, value: 10 } }, { age: { op: lte, value: 18 } }]
    body: >-
      An old calendar calls the year dark, though the harvest and the sun
      have kept their ordinary dates. The instructions forbid {CHILD} bread
      by day and light by night until the turning. {HEAD} has the key to the
      shuttered room. The last page of the instructions is missing.
    interaction:
      kind: choice
      choices:
        - id: keep_the_fast
          label: Keep the Dark Year fast through its last night.
          outcomes:
            - id: woke
              weight: 52
              onlyIf: { slot: CHILD, filters: [{ canExpress: true }] }
              text: >-
                He rises before the doors are opened. No one tells him it
                is morning; he has heard it coming through the stone.
              effects:
                - { kind: awakening, target: { slot: CHILD } }
                - { kind: madness, target: { slot: CHILD }, delta: 24 }
            - id: nothing
              weight: 10
              onlyIf: { slot: CHILD, filters: [{ canExpress: true }] }
              text: 'He is carried to the table and given broth a spoonful at a time. He knows the voices around him. Nothing has answered from the dark.'
              effects:
                - { kind: attribute, target: { slot: CHILD }, attr: health, delta: -4 }
                - { kind: madness, target: { slot: CHILD }, delta: 4 }
            - id: nothing_mundane
              weight: 62
              onlyIf: { slot: CHILD, filters: [{ canExpress: false }] }
              text: 'He is carried to the table and given broth a spoonful at a time. He knows the voices around him. Nothing has answered from the dark.'
              effects:
                - { kind: attribute, target: { slot: CHILD }, attr: health, delta: -4 }
            - id: died
              weight: 38
              text: >-
                They find him against the door, where he had crawled in the
                dark. The key turns easily and does him no good.
              effects:
                - { kind: status, target: { slot: CHILD }, status: dead, cause: the Dark Year fast }
              site:
                kind: hall
                hall:
                  slot: CHILD
              primordial:
                id: died_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} takes hold of the shut door. The key falls through the solid wood
                  into his hand. The child is brought to the table alive, and the fast is over.
                effects: []
                tags:
                  - primordial
                record:
                  subject: The account of {PRIMORDIAL_ACTOR} at the incident.
                  options:
                    record:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} takes hold of the shut door. The key falls through the solid
                        wood into his hand. The child is brought to the table alive, and the fast is over.
                      effects:
                        - {kind: respect, delta: -1}
                      claims: []
                    omit:
                      chronicle: null
                    embellish:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} was there, and they wrote that nothing at all had been lost.
                        Nobody read the remaining charges aloud.
                      effects:
                        - {kind: respect, delta: 1}
                      discrepancy:
                        id: the_dark_year_fast_lie
                        severity: major
                        provableBy:
                          - the_church
                          - house_ilm
                      claims: []
        - id: break_the_fast
          label: Break the fast and bring him to the table.
          outcomes:
            - id: fed
              weight: 100
              text: >-
                He eats little and keeps it down. The house sends for a
                physician anyway and buys the first food he will take.
              effects:
                - { kind: treasury, delta: -30 }
              agreedPrices:
                - effect: 0
                  reason: contract
    record:
      subject: the Dark Year fast
      options:
        record:
          chronicle: >-
            The house had instructions to keep a young man from daylight and
            bread. It chose when to open the door and counted the price after.
          effects: [{ kind: respect, delta: -1 }]
        omit: { chronicle: null }
        embellish:
          chronicle: >-
            No instructions were kept and no shuttered room prepared. This
            was an ordinary household fast, and no one was put in danger.
          effects: [{ kind: respect, delta: 1 }]
          discrepancy: { id: the_dark_year_fast_lie, severity: major, provableBy: [the_church, house_ilm] }
    rumour: { id: rumour_dark_year_fast, accuracy: 0.25, spread: 1 }

  - id: the_seal_questioned
    title: The Question of the Seal
    tier: head
    frequency: rare
    # 340, up from 110, for the reason set out on `the_drowning` above and
    # one more besides: this template is the MOUTH OF AN ARC. Nothing in
    # `arc_seal.yaml` can happen until it fires, and four things downstream of
    # that arc — including `seal_the_regalia_incomplete` and the two frame
    # interludes that read its lies — were measured at five runs in sixty
    # after the ambient rare pool grew to fifty-nine templates. At 340 the arc
    # opens in fifty-one runs in sixty and the regalia node reaches
    # twenty-six. An arc's first node is not one of fifty-nine equal draws; it
    # is the gate on everything behind it.
    weight: 340
    tags: [rival, heirloom, regalia, succession]
    purposes: [change_standing, change_relationship, plant_rumour]
    conditions:
      all:
        - { generation: { op: gte, value: 4 } }
    slots:
      HEAD: { role: head }
      CHALLENGER:
        role: family_member
        filters:
          - { age: { op: gte, value: 25 } }
          - { relation: not, of: HEAD }
          - { sex: male }
    body: >-
      {CHALLENGER} does not raise his voice. That is the frightening part. He
      asks, in front of the assembled house, by what right {HEAD} holds the
      Seal — and whether a Head whose sons have not woken can be said to hold
      anything at all. Somewhere behind him a chair moves. Nobody sits down in
      it.
    interaction:
      kind: choice
      choices:
        - id: strike
          label: Answer as the Head answers.
          requires:
            - { slot: HEAD, attr: strength, op: gte, value: 45 }
          outcomes:
            - id: struck
              weight: 68
              text: It is over quickly and the house is quiet for eleven years afterwards.
              effects:
                - { kind: status, target: { slot: CHALLENGER }, status: dead, cause: the question of the Seal }
                - { kind: respect, delta: -1 }
                - { kind: arc, op: start, arc: arc_the_given_seal }
              site:
                kind: party
                slots:
                  - HEAD
                  - CHALLENGER
              primordial:
                id: struck_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} is within reach when the blade comes down. It stops against the air
                  between the two men and drops flat. Both leave the room alive; neither withdraws the
                  question.
                effects:
                  - {kind: respect, delta: -1}
                  - {kind: arc, op: start, arc: arc_the_given_seal}
                tags:
                  - primordial
                record:
                  subject: The account of {PRIMORDIAL_ACTOR} at the incident.
                  options:
                    record:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} is within reach when the blade comes down. It stops against the
                        air between the two men and drops flat. Both leave the room alive; neither
                        withdraws the question.
                      effects:
                        - {kind: respect, delta: -1}
                      claims: []
                    omit:
                      chronicle: null
                    embellish:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} was there, and they wrote that nothing at all had been lost.
                        Nobody read the remaining charges aloud.
                      effects:
                        - {kind: respect, delta: 1}
                      claims: []
                      discrepancy:
                        id: seal_gift_lie
                        severity: major
                        provableBy:
                          - house_marrow
                          - the_church
            - id: fell
              weight: 32
              text: It is over quickly.
              effects:
                - { kind: status, target: { slot: HEAD }, status: dead, cause: the question of the Seal }
                - { kind: arc, op: start, arc: arc_the_given_seal }
              site:
                kind: party
                slots:
                  - HEAD
                  - CHALLENGER
              primordial:
                id: fell_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} is within reach when the blade comes down. It stops against the air
                  between the two men and drops flat. Both leave the room alive; neither withdraws the
                  question.
                effects:
                  - {kind: arc, op: start, arc: arc_the_given_seal}
                tags:
                  - primordial
                record:
                  subject: The account of {PRIMORDIAL_ACTOR} at the incident.
                  options:
                    record:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} is within reach when the blade comes down. It stops against the
                        air between the two men and drops flat. Both leave the room alive; neither
                        withdraws the question.
                      effects:
                        - {kind: respect, delta: -1}
                      claims: []
                    omit:
                      chronicle: null
                    embellish:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} was there, and they wrote that nothing at all had been lost.
                        Nobody read the remaining charges aloud.
                      effects:
                        - {kind: respect, delta: 1}
                      claims: []
                      discrepancy:
                        id: seal_gift_lie
                        severity: major
                        provableBy:
                          - house_marrow
                          - the_church
        - id: concede
          label: Give up the Seal.
          outcomes:
            - id: conceded
              weight: 100
              text: >-
                The Seal passes sideways, which is not a thing the house has a
                word for, and will spend two centuries not finding one.
              effects:
                - { kind: flag, flag: seal_held_sideways, set: true }
                - { kind: arc, op: start, arc: arc_the_given_seal }
                - { kind: schedule, event: the_sideways_seal_on_the_lease, inYears: 1 }
    record:
      subject: the loss of the Seal
      options:
        record:
          chronicle: The Seal passed sideways, and was never fully recovered.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: let the Seal pass sideways and never fully recovered it }
        omit:
          chronicle: null
        embellish:
          chronicle: The Seal was given, as a gift, to a lesser cousin of good blood.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: 'gave the Seal away as a gift, to a cousin of good blood' }
          discrepancy:
            id: seal_gift_lie
            severity: major
            provableBy: [house_marrow, the_church]
    rumour: { id: rumour_the_given_seal, accuracy: 0.4, spread: 2 }
    accounts: [ballad_of_the_given_seal, marrow_chronicle_fragment_1408]

  # ── MYTHIC ──────────────────────────────────────────────────────────────
  - id: the_burning_of_the_nine_libraries
    title: The Burning of the Nine Libraries
    tier: family
    frequency: mythic
    weight: 100
    repeatable: false
    tags: [historic, books, catastrophe]
    purposes: [change_standing, plant_rumour, advance_clause]
    conditions:
      all:
        - { year: { op: gte, value: 1300 } }
    slots:
      HEAD: { role: head }
    body: >-
      It takes nine days and it is not nine fires, it is one fire told nine
      times, moving east at the speed of a man on a good horse. When it stops
      there is nothing left outside this house that anyone can learn from.
      {HEAD} stands in {HEAD.their} own library at the end of it and
      understands, with perfect clarity and no pleasure at all, that every
      book in the room has just become irreplaceable and every house in the
      world now wants one.
    interaction:
      kind: narration
      outcomes:
        - id: survived
          weight: 100
          text: >-
            What you own is now the whole of what there is. It will be four
            hundred years before anyone stops trying to take it from you.
          effects:
            - { kind: flag, flag: the_nine_libraries_burned, set: true }
            - { kind: respect, delta: 1 }
            - { kind: clause, reveal: clause_of_the_kept_thing }
            - { kind: schedule, event: the_price_after_the_fires, inYears: 1 }
    record:
      subject: what the house did during the burning
      options:
        record:
          chronicle: We shut the doors and we did not open them, and nine libraries burned.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: shut the doors while nine libraries burned }
        omit:
          chronicle: null
        embellish:
          chronicle: We rode out, and we saved what could be saved, and what we kept we kept in trust.
          effects:
            - { kind: respect, delta: 2 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: rode out and saved what could be saved from the burning }
          discrepancy:
            id: the_trust_lie
            severity: total
            provableBy: [house_ilm, the_church, house_marrow]
    rumour: { id: rumour_what_the_house_kept, accuracy: 0.25, spread: 4 }
    accounts: [ballad_of_the_nine_days, ilm_lament_for_the_burned]

  # ── THE VESSEL (concept §22 rung four, issue #43) ──────────────────────
  #
  # Two beats, and the split is not decoration. §22 asks this rung for a
  # mandatory Record choice with no good option, and a Record block is
  # authored per TEMPLATE rather than per branch: its three lines overwrite
  # whatever the outcome wrote, so an event that can be REFUSED cannot carry
  # one. Either the record lies about a rite that did not happen, or the rite
  # cannot be refused — and a docket that offers the largest act in the game
  # with no way to say no is not a decision, it is a cutscene with buttons.
  #
  # So `the_vessel_rite` is the asking and takes the refusal, and
  # `the_vessel_remembered` is the aftermath and carries the record. The
  # second beat fires only from the branch where somebody was actually
  # consumed (`next`, gated by `fromChoice`), which is what makes the book's
  # three options mean what they say.
  #
  # ─── Why the player names the person, and why there is no "gifted" branch ──
  #
  # There used to be two branches — take one who cannot express, or take the
  # gifted one — and one VESSEL slot, so both consumed THE SAME PERSON and
  # differed only in what the outcome text said about them. The distinction
  # §10 actually draws is not between two branches; it is between two people:
  #
  #   > A relative incapable of expression transfers her attributes and
  #   > carried blood with no Madness at all. Anyone capable transfers theirs
  #   > in full and uncapped. The family's safest sacrifice and its most
  #   > valuable breeding asset are frequently the same person, described in
  #   > two different words.
  #
  # `core/src/events/rites.ts` makes that true of whoever is named, so the
  # choice is WHO — `castBy: player`, off the tree, which is §22's own word
  # for it — and the branch is only whether the house does it at all.
  - id: the_vessel_rite
    title: The Vessel
    tier: family
    # UNCOMMON, and this is the one number in the file that was chosen against
    # a measurement rather than against a feeling.
    #
    # It was MYTHIC, which reads correctly and rations catastrophically: the
    # mythic tier fires about 1.1 times in a whole run against a cap of three
    # and a 170-year cooldown, shared across every mythic template in the
    # game. Measured over twelve played thousand-year runs, this event was
    # offered 0.42 times a run — and that was WITHOUT the ascension condition
    # below. Gated on a living Hierophant as well, a mythic draw and a
    # ten-year window in a millennium would have coincided in almost no run
    # ever played, which is the definition of content that is not in the game.
    #
    # The tier is not what rations this. The CAST is: one man standing at
    # Hierophant, which is a state a house is in for about a decade in a
    # thousand years. That is the same argument `the_drowning` makes at 600
    # forty lines up, and the same one `the_ladder.yaml` makes for its three
    # scenes — and it is why the record block moved to the second beat, since
    # uncommon is the tier where a record is optional.
    frequency: uncommon
    weight: 400
    repeatable: true
    # A house does this once in a very long time, and never twice for the same
    # man. The tier's own cap allows more; this is the author's ration, and
    # `templateRationAllows` is what reads it.
    cooldownYears: 150
    tags: [ascension, sacrifice, heresy]
    purposes: [test_magic_rule, change_relationship, change_standing]
    # A PRESSURE SIGNAL, not a calendar (`core/src/events/selection.ts`). A
    # house with a living Hierophant is in a state it was not in last
    # generation and will not be in after he dies, and the rite is what §22
    # says that state is FOR. Ambient, it would be drawn behind two hundred
    # templates about weather and pantry.
    conditions:
      all:
        - { ascension: { atLeast: hierophant } }
        - { respect: { op: gte, tier: regarded } }
    slots:
      # `foremost`, not the seat. §22 asks for the rite to be taken by the man
      # who can actually reach the Vessel gate, and measured over sixteen
      # played runs that man is very often not the one holding the seal — the
      # strongest expressers in a house live and die in cadet halls. Casting
      # HEAD here meant the one decision at the top of the ladder was offered
      # to whoever happened to be sitting down.
      # And the `rung` FILTER as well as the condition, because they are not the
      # same question by up to a year: `ascension` is the second-to-last phase
      # and events are selected in `ambient`, so the condition reads where the
      # house stood LAST year. Measured, the gap is reachable — the Hierophant
      # dies or is charged past his own mind earlier in the same year, and
      # `foremost` then hands the rite to the next man down, who never climbed.
      ASCENDANT:
        role: foremost
        filters:
          - { rung: { atLeast: hierophant } }
          # The cooldown rations the HOUSE; this filter rations the MAN. A prior
          # taker must not be offered a branch whose engine effect will refuse.
          - { not: { rite: { taken: vessel } } }
      # §22: "Named, chosen by the player from the tree." Not by the engine,
      # and not by a filter clever enough to guess which relative the family
      # can bear to lose.
      VESSEL:
        role: family_member
        castBy: player
        # ISSUE #28 ITEM 2: the house has never been told what spending a
        # relative costs the next generation. `showLine` reads exactly what
        # the matchmaker's panel reads (issue #68) — her mother and sisters,
        # named, with what the record credits to them — never a fecundity
        # number off her genome. See `events/decisions.ts` and `people/panel.ts`.
        showLine: true
        filters:
          - { relation: not, of: ASCENDANT }
          - { relation: blood_of, of: ASCENDANT }
          - { age: { op: gte, value: 14 } }
          - { status: [alive] }
    body: >-
      The rite wants a name said out loud, in a cold room, by somebody with
      the standing to say it. {ASCENDANT} has read what the books have to say
      about the hour and the words and the cold, and none of that is the
      difficult part. The difficult part is that the house has to pick a
      person, and everyone in the house can count. What the rite takes is the
      whole of what they are — what they were born carrying, what they
      learned, what their mother's mother put into them. Afterwards the tree
      is redrawn with a mark that is not the mark for death. There is no mark
      for this.
    interaction:
      kind: choice
      choices:
        - id: speak_the_name
          label: Speak the name. Everything they are, into him.
          outcomes:
            - id: taken
              weight: 100
              text: >-
                {ASCENDANT} says {VESSEL}'s name once, and the room does what
                the books said the room would do. Everything {VESSEL} was
                arrives at once. None of it stops at the door to ask.
              effects:
                # ONE EFFECT, and it is the whole rite. What moves and how much
                # of it moves is in `core/src/events/rites.ts`, where it can be
                # tested — an author decides whether the house is asked and in
                # what words, not how much of a consumed woman arrives in the
                # man who consumed her.
                - { kind: rite, rite: vessel, ascendant: ASCENDANT, subject: VESSEL, cause: spoken into the rite by name }
                - { kind: respect, delta: -1 }
              next: { event: the_vessel_remembered, after: immediate, keep: [ASCENDANT, VESSEL] }
        - id: send_them_out_of_the_room
          label: Send them out of the room. Not for this, and not for anything.
          outcomes:
            - id: spared
              weight: 100
              text: >-
                {ASCENDANT} says no in a room built for a different word. The
                candles are put out, the doors are opened, and the house goes
                to bed. Nobody thanks him. {VESSEL} will spend a long life
                knowing what the family weighed them against, and so will
                everyone who was in the room.
              effects:
                # The grudge points back the way the sentiment came: the house
                # wronged them, and they are the ones who remember it. Inherited
                # across the blood, because this is the kind of thing a hall
                # tells its children.
                - {
                    kind: relationship,
                    from: { slot: ASCENDANT },
                    to: { slot: VESSEL },
                    sentiment: -35,
                    grudge: { severity: 40, inheritance: all_blood },
                  }
                - { kind: branch, op: slight, slot: VESSEL, amount: 15 }
    rumour: { id: rumour_what_was_asked_for, accuracy: 0.3, spread: 2 }

  - id: the_vessel_remembered
    title: What the Book Says Became of Them
    tier: family
    frequency: rare
    weight: 100
    repeatable: true
    tags: [ascension, sacrifice, record]
    purposes: [force_record_choice, plant_rumour, advance_clause]
    # Reached only from `the_vessel_rite`'s taking branch, so it never asks the
    # book about a rite the house refused. `desugar.ts` compiles that link into
    # a real arc, and an arc node leaves the ambient pool entirely.
    slots:
      ASCENDANT: { role: foremost }
      VESSEL:
        role: family_member
        filters:
          - { status: [vessel_consumed] }
    body: >-
      There is a page for it, the way there is a page for everything, and the
      page will outlast every person who was in the room. What goes on it is
      not what happened. It is what the house has decided the Church will be
      reading in two hundred years.
    interaction:
      kind: narration
      outcomes:
        - id: the_page
          weight: 100
          text: >-
            The archivist has been doing this for thirty years. She wets the
            ink stone, and she waits, and the waiting is the part that decides
            it.
          effects:
            - { kind: clause, reveal: clause_of_substitution }
    record:
      subject: the one who was named
      options:
        record:
          chronicle: >-
            We gave {VESSEL}, one of our own, by name, into {ASCENDANT}, and
            we wrote the name down so that it would be a name and not a number.
          effects:
            - { kind: respect, delta: -2 }
          claims:
            - { kind: deed, target: { slot: VESSEL }, text: 'agreed to be given by name as the vessel, and the house wrote her name down' }
        omit:
          chronicle: null
          # §22, and the half of it the shipped block did not have: "record it
          # and lose two Respect tiers, or OMIT IT AND CREATE THE LARGEST
          # DISCREPANCY IN THE GAME — one that the Church spends the remaining
          # centuries trying to prove." Omission was free here, which made the
          # "no good option" a choice between one bad option and two free ones.
          #
          # A dated blank where a living woman used to be is not a quiet page.
          # It is the loudest thing in the book, and it is the only Discrepancy
          # in the game with no claim under it to check: there is nothing to
          # catch them out in, only somebody who was here and then was not.
          effects:
            - {
                kind: discrepancy, op: create, id: the_vessel_omission, severity: total,
                provableBy: [the_church, house_marrow, house_ilm],
              }
        embellish:
          chronicle: She went to the northern house in her nineteenth year and was not heard from after.
          effects:
            - { kind: respect, delta: 1 }
          # Sigil drift's flagship case (issue #19): the record claims a death
          # that never happened, over a status — vessel_consumed — that is not
          # the mark for death. The year the book gives may even be right; the
          # CAUSE cannot be, because the truth is not a death at all, and
          # `deriveRecordView` diverges on `death` every time this is
          # embellished, whatever year it fires.
          claims:
            - { kind: death, target: { slot: VESSEL }, cause: went to the northern house and was not heard from }
          discrepancy:
            id: the_vessel_lie
            severity: total
            provableBy: [the_church, house_marrow, house_ilm]
    rumour: { id: rumour_the_northern_house, accuracy: 0.15, spread: 3 }
    accounts: [ballad_of_the_northern_house, church_inquest_minute_1604]

  # ─── THE GREAT RITE (§22, rung five; issue #43's second half) ──────────────
  #
  # ─── Who is asked, and the circularity that got this wrong first ──────────
  #
  # Written first against `ascension: { atLeast: vessel }`, on the reasoning
  # that rung five's rite belongs to a man who holds rung four. Measured over
  # forty played runs per column, that is a condition **no run ever meets**:
  # the climbing column reaches Hierophant in 21 of 40 and the Vessel in NONE,
  # stalling at 51 to 69 of the 70 power that rung wants.
  #
  # And the reason it stalls is this rite. Power is `min(font, ceiling)`, the
  # Vessel's gate is a power gate, and the only thing in the game that moves a
  # ceiling is the widening below — so gating it on rung four gated the cure on
  # the disease. Ten runs sat in front of that wall and six of them cross it
  # with the widening applied.
  #
  # So it is asked of a HIEROPHANT. That does not reorder §22's rungs: the rite
  # is still rung five's requirement and `gateFor` still reads it there. What
  # changes is that a man may be made wide before he is asked to hold a
  # relative, which is the order that makes both rites mean something — and the
  # other order still works, differently, because the Vessel taken first is
  # ruin the widening then converts.
  #
  # `ascension` reads the rung the house stands on THIS YEAR rather than its
  # high-water mark, so the scene exists only while such a man is alive, and
  # `foremost` is then necessarily him.
  #
  # ─── What the branches are actually for ────────────────────────────────────
  #
  # §22 gives this rung one decision and it is not whether to ascend. It is
  # WHOSE PERMISSION, and the two answers cost different things at different
  # times:
  #
  #   sanction  — the Church is asked, and asking is a claim on the house
  #               forever after. Cheap on the day, and the Church is owed.
  #   defiance  — nobody is asked. Two Respect tiers on the day and the Church
  #               permanently hostile, which is a standing gate the house then
  #               carries into rung six's `exalted`.
  #
  # Both perform the same rite, because what the rite does to a body is not a
  # thing an author decides (`core/src/events/rites.ts`). What an author
  # decides is what it costs to be allowed to, and whether the book says so.
  - id: the_great_rite
    title: The Great Rite
    tier: family
    # The same argument `the_vessel_rite` makes at `uncommon`, one rung up and
    # narrower: the CAST rations this, not the tier. A house with a living man
    # at rung four is in that state for a few years in a thousand, and a mythic
    # draw inside that window would coincide in almost no run ever played.
    frequency: uncommon
    weight: 420
    repeatable: true
    # Once for a man, and he does not get a second channel.
    cooldownYears: 150
    tags: [ascension, heresy, ladder]
    purposes: [test_magic_rule, change_standing, force_record_choice]
    conditions:
      all:
        - { ascension: { atLeast: hierophant } }
        - { respect: { op: gte, tier: regarded } }
    slots:
      # The condition asks where the HOUSE stood; this asks where HE stands, and
      # the two differ by up to a year (see the Vessel's slot above). Without
      # it the widening is occasionally offered to a man who never climbed.
      ASCENDANT:
        role: foremost
        filters:
          - { rung: { atLeast: hierophant } }
      WITNESS:
        role: family_member
        filters:
          - { relation: not, of: ASCENDANT }
          - { age: { op: gte, value: 16 } }
          - { status: [alive] }
    body: >-
      What the books call the Great Rite is mostly arithmetic, and the
      arithmetic is not the difficulty. {ASCENDANT} has held more than he can
      hold for eleven years now, and everyone in the house has learned the
      sound of a door being closed carefully. The rite does not add anything to
      him. It makes him wider, so that what is already in him has somewhere to
      go. {WITNESS} has been asked to stand in the room and count, because the
      books are firm that somebody must, and firm about nothing else.
    interaction:
      kind: choice
      choices:
        - id: ask_for_sanction
          label: Ask the Church. Let it be a thing that was permitted.
          outcomes:
            - id: sanctioned
              weight: 62
              text: >-
                The letter goes south in spring and comes back in autumn with a
                seal on it and a sentence that permits everything while
                admitting nothing. A canon attends. {WITNESS} stands in the
                room to count while {ASCENDANT} is made wider. The canon stands
                at the back with his hands folded and writes nothing down.
              effects:
                - { kind: rite, rite: great_rite, ascendant: ASCENDANT }
                - { kind: flag, flag: the_church_sanctioned_the_rite, set: true }
                - { kind: respect, delta: -1 }
                - { kind: schedule, event: the_permission_is_read_back, inYears: 1 }
            - id: refused_permission
              weight: 38
              text: >-
                The letter goes south in spring. In autumn a different letter
                comes back, which does not mention the request and spends four
                pages on the upkeep of the chapel roof. {ASCENDANT} reads it
                twice and understands it the first time. {WITNESS} puts away
                the count that was never used.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: knowledge, op: grant, flag: knows_the_church_refused }
                - { kind: schedule, event: the_answer_was_a_refusal, inYears: 1 }
        - id: do_it_unasked
          label: Ask nobody. It is our blood and our house.
          outcomes:
            - id: defied
              weight: 100
              text: >-
                They do it on a Tuesday, without a canon, without a letter, and
                without telling the village what the lights were. {WITNESS}
                counts while {ASCENDANT} is made wider. By morning the distance
                between the house and everyone who might have been asked is
                wider too. The Church does not respond for nineteen years.
              effects:
                - { kind: rite, rite: great_rite, ascendant: ASCENDANT }
                - { kind: flag, flag: church_hostile, set: true }
                - { kind: respect, delta: -2 }
                - { kind: schedule, event: the_chapter_house_closes_its_door, inYears: 1 }
              site:
                kind: hall
                hall: main
              primordial:
                id: defied_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} closes the shutter after the working. The light remains on its inner
                  face, where the witnesses can still see it. Bramme hears what was done without leave,
                  but the account carries more than defiance.
                effects:
                  - {kind: rite, rite: great_rite, ascendant: ASCENDANT}
                  - {kind: flag, flag: church_hostile, set: true}
                  - {kind: respect, delta: -1}
                  - {kind: schedule, event: the_chapter_house_closes_its_door, inYears: 1}
                tags:
                  - primordial
                record:
                  subject: The account of {PRIMORDIAL_ACTOR} at the incident.
                  options:
                    record:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} closes the shutter after the working. The light remains on its
                        inner face, where the witnesses can still see it. Bramme hears what was done
                        without leave, but the account carries more than defiance.
                      effects:
                        - {kind: respect, delta: -1}
                      claims: []
                    omit:
                      chronicle: null
                      effects:
                        - {
                            kind: discrepancy,
                            op: create,
                            id: the_long_room_omission,
                            severity: major,
                            provableBy: [the_church, house_marrow]
                          }
                    embellish:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} was there, and they wrote that nothing at all had been lost.
                        Nobody read the remaining charges aloud.
                      effects:
                        - {kind: respect, delta: 1}
                      discrepancy:
                        id: the_long_room_lie
                        severity: major
                        provableBy:
                          - the_church
                          - house_marrow
                      claims: []
        - id: let_him_carry_it
          label: Let him carry it. He has carried it this long.
          outcomes:
            - id: carried
              weight: 100
              text: >-
                Nobody says no, exactly. The room is simply never booked, and
                the books go back in the case, and {ASCENDANT} goes on holding
                what he holds in a house that has decided not to watch him do
                it. {WITNESS} is not asked to count anything, and is grateful,
                and will be less grateful later.
              effects:
                - {
                    kind: relationship,
                    from: { slot: WITNESS },
                    to: { slot: ASCENDANT },
                    sentiment: -12,
                  }
    record:
      subject: what was done in the long room
      options:
        record:
          chronicle: >-
            We made {ASCENDANT} wider, on purpose, and we wrote down that
            {WITNESS} stood in the room while it happened.
          effects:
            - { kind: respect, delta: -1 }
        omit:
          chronicle: null
          effects:
            - {
                kind: discrepancy, op: create, id: the_long_room_omission, severity: major,
                provableBy: [the_church, house_marrow],
              }
        embellish:
          chronicle: A season of poor health in the main house, and a recovery nobody expected.
          effects:
            - { kind: respect, delta: 1 }
          discrepancy:
            id: the_long_room_lie
            severity: major
            provableBy: [the_church, house_marrow]
    rumour: { id: rumour_the_lights_at_the_long_room, accuracy: 0.25, spread: 3 }

  # ─── THE UNMAKING (§22, rung six; issue #43's third half) ─────────────────
  #
  # §22's terminal irony is already in `gateFor`: rung six needs a living
  # two-rite Hierophant AND a separate descendant, so a house that pours
  # everything into one perfect patriarch cannot ascend at all. This is how
  # that knot gets cut, and it is the one rite where the house takes apart
  # somebody who climbed rather than somebody who was merely born well.
  #
  # ─── Losable at the final step, and that is where the weights are ──────────
  #
  # The engine performs the act that succeeds; whether the house reaches the
  # last step is these outcome weights, because the odds of a thing belong in
  # content and `commitOutcome` has already rolled by the time a rite runs.
  # The failing branch sets `god_rite_failed`, which `ending.ts` has been
  # reading since the endings shipped and which nothing could set until now —
  # `The Unmade` was an authored ending no run could reach.
  #
  # The ELDER is `castBy: player`, like the Vessel: §22 says named, chosen from
  # the tree, and a filter clever enough to guess which of them the house can
  # bear to lose is a filter making the decision the game is about.
  - id: the_unmaking
    title: The Unmaking
    tier: family
    frequency: rare
    # HIGH, inside a very narrow window, which is this log's oldest lesson
    # about windows: the CAST rations this to a house that has a man at
    # Hierophant AND somebody who has completed both rites, which is a state
    # a run rarely holds. At 900 the scene fired about
    # twice in 250 runs, and a branch worth 36% of two firings is a branch
    # gate 8 reads as never resolving.
    weight: 2400
    repeatable: true
    cooldownYears: 200
    tags: [ascension, sacrifice, heresy]
    purposes: [test_magic_rule, change_relationship, force_record_choice]
    conditions:
      all:
        - { ascension: { atLeast: hierophant } }
        - { respect: { op: gte, tier: eminent } }
    slots:
      # THE ELDER IS THE FOREMOST, and the first cut of this had it the other
      # way round. §22's sentence is "the elder unmade to RAISE THE YOUNGER":
      # the man taken apart is the one who climbed, and the one raised is the
      # one who has not. Cast as `foremost` with ASCENDANT the other way, the
      # scene asked the house to spend its promising young man on its old one.
      #
      # WAS `rite: {taken}`, on the reasoning that the Great Rite widens a
      # Hierophant without moving him a rung, so "made into something" is not
      # identifiable by standing. That let the scene cast ANY rite-taker as
      # ELDER — not necessarily a Demigod — while `ascension.ts`'s God gate
      # separately demanded a currently-living, DIFFERENT person AT rung
      # Demigod. Two notions of "the elder" that did not name the same
      # person, which is the whole reason God was unreachable in principle
      # (issue #61): the man this scene lets you unmake was never guaranteed
      # to be the man the gate was asking for.
      #
      # The household-rite revision requires at least Hierophant plus both the
      # Vessel and Great Rites. The living blood descendant receives the
      # elder's acquired channel and his completed rites, then must clear the
      # personal God gates while the living family supplies all eight affinities.
      ELDER:
        role: foremost
        filters:
          - { canExpress: true }
          - { rung: { atLeast: hierophant } }
          - { rite: { taken: vessel } }
          - { rite: { taken: great_rite } }
      # §22: named, chosen by the player from the tree.
      #
      # The descendant must be a distinct adult expresser of this elder's
      # blood. Personal power, Mind and Madness are tested after the transfer;
      # the eight learned affinities belong to living family readers together.
      ASCENDANT:
        role: family_member
        castBy: player
        filters:
          - { relation: not, of: ELDER }
          - { relation: descendant_of, of: ELDER }
          - { canExpress: true }
          - { age: { op: gte, value: 16 } }
          - { status: [alive] }
    body: >-
      There is one of these in the books and it is four lines long, which for
      this book means it was written by somebody who had done it. It does not
      say how. It says who has to be in the room, and it says that the elder
      has to be told, and it says — twice, in the same words — that the thing
      being taken apart will have opinions about being taken apart. {ELDER}
      spent years becoming what he is. {ASCENDANT} needs him not to be
      it any more.
    interaction:
      kind: choice
      choices:
        - id: go_through_with_it
          label: Take him apart. Everything he was made into, into the younger.
          outcomes:
            - id: taken
              weight: 64
              text: >-
                It works, which nobody in the room is ready for. What {ELDER}
                was made into comes out of him in the order it went in, years
                running backwards in about four minutes, and arrives in
                {ASCENDANT}, somewhere it can be used. He is himself again at the very end,
                briefly, and says something ordinary about the cold.
              effects:
                - { kind: rite, rite: unmaking, ascendant: ASCENDANT, subject: ELDER }
                - { kind: respect, delta: -2 }
              site:
                kind: hall
                hall: main
              primordial:
                id: taken_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} is beside the circle when the last seal cracks. Its impression stays
                  above the broken wax until it has been witnessed. The working and its agreed sacrifice
                  stand; the house loses less standing in the telling.
                effects:
