                      effects:
                        - {
                            kind: discrepancy,
                            op: create,
                            id: the_small_hall_omission,
                            severity: total,
                            provableBy: [the_church, house_marrow, house_ilm]
                          }
                    embellish:
                      chronicle: >-
                        {PRIMORDIAL_ACTOR} was there, and they wrote that nothing at all had been lost.
                        Nobody read the remaining charges aloud.
                      effects:
                        - {kind: respect, delta: 1}
                      claims: []
                      discrepancy:
                        id: the_small_hall_lie
                        severity: total
                        provableBy:
                          - the_church
                          - house_marrow
                          - house_ilm
            - id: failed_at_the_last_step
              weight: 36
              # THE RUN, LOST AT THE FINAL STEP (§22, §23's `unmade`). The flag
              # `ending.ts` has read since the endings shipped and which nothing
