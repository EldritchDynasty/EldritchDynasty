  - address: content:events/family_challenges.yaml#events[id=the_wick_bridge_load].body
    of: 82096c8b9c4e04bf
    plainenglish: A cart carrying flour to Ardwen has broken an axle at Wick bridge. Rain is coming. The
      village will lend the family a rope if a relative goes to direct the lift. Only one person can
      work beside the wheel.
  - address: content:events/family_challenges.yaml#events[id=the_wick_bridge_load].record.subject
    of: 112ae1b4d5765170
    plainenglish: the broken flour cart at Wick bridge
  - address: content:events/family_challenges.yaml#events[id=the_wick_bridge_load].record.options.record.chronicle
    of: 61870d3e7e12146a
    plainenglish: "{SENT} went to help with the broken flour cart at Wick bridge. The family paid the costs."
  - address: content:events/family_challenges.yaml#events[id=the_wick_bridge_load].record.options.embellish.chronicle
    of: 30fb44330b58deff
    plainenglish: "{SENT} lifted the flour cart at Wick bridge alone and was not hurt."
  - address: content:events/family_challenges.yaml#events[id=the_wick_bridge_load].interaction.choices[id=lifted].label
    of: a1cdadfe3af49192
    plainenglish: The flour stays dry.
  - address: content:events/family_challenges.yaml#events[id=the_wick_bridge_load].interaction.choices[id=lifted].outcomes[id=clear].text
    of: 8820199f1c7f0b6b
