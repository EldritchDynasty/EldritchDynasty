      choices:
        - id: use_life
          label: Ask a Life reader to tend those who still breathe.
          check: known_working
          outcomes:
            - id: held
              weight: 100
              text: "{HEALER} works through the lessons already learned from the Life book. The sick can drink
                again, and the house pays for broth instead of another watch."
              effects:
                - kind: treasury
                  delta: -10
              site:
                kind: hall
                hall: main
              primordial:
                id: held_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} sits down beside the watch. The wash water stays warm through the
                  night without a coal under it, and fewer cloths have to be burned. Paid help is still
                  needed.
                effects:
                  - {kind: treasury, delta: -5}
                tags:
                  - primordial
                record: null
