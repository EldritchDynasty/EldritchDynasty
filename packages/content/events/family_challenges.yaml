            outcome: held
          - atLeast: -1000000
            outcome: lost
    interaction:
      kind: choice
      choices:
        - id: use_aero
          label: Turn the gust away from the open roof.
          check: known_working
          outcomes:
            - id: held
              weight: 100
              text: "{WIND} turns the gust along the outer wall. The loose slates land in the yard instead of the
                bed."
              effects:
                - kind: treasury
                  delta: -10
              site:
                kind: hall
                hall: main
              primordial:
                id: held_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} braces the open door. The falling beam hangs above the bed until it
                  has been carried out, then settles across the empty room. Some slates and timber are
                  lost.
                effects:
                  - {kind: treasury, delta: -5}
                tags:
                  - primordial
                record: null
            - id: lost
              weight: 100
              text: No living reader in the house has learned the aero working. The family clears the room before
                the beam falls. Rebuilding it costs more than the mason's first price.
