      replacement axle, and the flour remains dry."
  - address: content:events/family_challenges.yaml#events[id=the_wick_bridge_load].interaction.choices[id=paid].label
    of: 7e9362d74f972a23
    plainenglish: The family must pay for the spoiled flour.
