  - id: the_wick_bridge_load
    title: The Load at Wick Bridge
    tier: family
    frequency: uncommon
    weight: 65
    repeatable: true
    tags:
      - family_challenge
      - dispatch
      - rescue
    purposes:
      - change_relationship
      - worldbuild_through_action
