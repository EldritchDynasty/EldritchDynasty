    body: The latch at Ardwen is too hot to lift. Smoke comes through the grain-store door, and the
      bucket line has stopped at an empty trough. The family has heard of two workings that might
      save what is left. The roof has begun to tick.
    checks:
      - id: known_working
        pool:
          kind: family_knows
          affinity: fluid
        difficulty: 1
        variance: none
        bands:
          - atLeast: 0
            outcome: held
          - atLeast: -1000000
            outcome: lost
      - id: practised_working
        pool:
          kind: slot
          slot: HEAT
          attrs:
            - attr: thermal
              weight: 0.7
            - attr: mind
              weight: 0.3
        difficulty: 20
        variance: none
        bands:
          - atLeast: 0
            outcome: held
          - atLeast: -1000000
            outcome: lost
      - id: family_work
        pool:
          kind: family_sum
          attr: strength
        difficulty: 1500
        variance: none
        bands:
          - atLeast: 0
            outcome: held
          - atLeast: -1000000
            outcome: lost
      - id: specialist_work
        pool:
          kind: slot
          slot: EXPERT
          attrs:
            - attr: strength
              weight: 0.65
            - attr: agility
              weight: 0.35
        difficulty: 45
        variance: none
        bands:
          - atLeast: 0
            outcome: held
          - atLeast: -1000000
            outcome: lost
    interaction:
      kind: choice
      choices:
        - id: use_fluid
          label: Call water into the trough.
          check: known_working
          outcomes:
