              weight: 100
              text: "{WATER} fills the trough before the next bucket comes back. The family pays for a scorched
                door instead of a winter of grain."
              effects:
                - kind: treasury
                  delta: -10
              site:
                kind: hall
                hall: main
              primordial:
                id: held_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} is on the bucket line when the smoke stops at the door. The sacks
                  nearest the wall come out dry and cold. The scorched grain and broken door still cost
                  the house.
                effects:
                  - {kind: treasury, delta: -5}
                tags:
                  - primordial
                record: null
            - id: lost
              weight: 100
              text: No living reader in the house has learned the fluid working. By morning the grain has swollen
                into a black lump. The miller at Wick charges for another load.
