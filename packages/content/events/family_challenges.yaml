          slot: EXPERT
          attrs:
            - attr: mind
              weight: 0.65
            - attr: health
              weight: 0.35
        difficulty: 45
        variance: none
        bands:
          - atLeast: 0
            outcome: held
          - atLeast: -1000000
            outcome: lost
