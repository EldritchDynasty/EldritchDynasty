# THE TWO MAGICS, IN PUBLIC.
#
# World §14 and §15 in scenes. Mystic practice is a licensed trade with a fee
# schedule, taught six weeks away in a foreign country, practised by warranted
# men and women who charge by the job; it carries no Madness and it is nobody's
# secret. The other one is in this family and in no other line anywhere, and
# every scene in this file is a place where a member of the household watches
# the ordinary, legal, purchasable version of the impossible go past and has to
# say nothing at all.
#
# `advance_clause` is the third purpose on every template here, and it is
# honest: the contract is the only reason the difference between those two
# things matters to anybody, and a house that forgets which of the two it owns
# is a house that mishandles the Ledger four hundred years later.
#
# COMMON tier. The trade is not an occasion. It has a fee schedule.
events:
  - id: the_warrant_on_the_wall
    title: The Warrant on the Wall
    tier: family
    frequency: common
    weight: 70
    tags: [mystic, law, bramme, trade]
    purposes: [advance_clause, buy_patience, establish_magic_rule]
    slots:
      WATCHER:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 12 } }]
    body: >-
      The warrant is nailed to the chapter-house wall at Bramme where the fair
      notices go, and it is a piece of paper with a seal on it and a schedule
      of charges underneath. Damp out of a wall, four mites the yard. A fire
      held in a wet season, two marks and found. Unwarranted practice is a
      crime in the magistrate's court and in the Church's, and the second one
      is the one that ruins people. {WATCHER} reads the whole schedule twice
      and works out on the walk home that there is no line on it for what this
      family is.
    interaction:
      kind: narration
      outcomes:
        - id: read_it
          weight: 100
          text: >-
            There is a price for every impossible thing a person is allowed to
            do, and it is small, and it is public. Nothing this house owns
            appears anywhere on that wall.
          effects:
            - { kind: treasury, delta: -2 }
            - { kind: attribute, target: { slot: WATCHER }, attr: mind, delta: 1 }

  - id: the_threshold_four_at_the_fair
    title: The Threshold Four
    tier: family
    frequency: common
    weight: 75
    tags: [mystic, women, fair, trade]
    purposes: [advance_clause, change_standing, establish_magic_rule]
    slots:
      DAUGHTER:
        role: family_member
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 12 } }]
    body: >-
      The warranted woman at the Ingathering fair takes a rot out of a
      ploughshare handle for six mites and will not be drawn on anything else.
      She works Life and she works Death, she will talk about Light for as long
      as anybody buys her beer, and when a burgess asks her to warm a pot she
      says the word Elemental and goes back to the handle. Four of the eight
      are hers by right of the Colleges and the other four are not, and she has
      never in her life pretended otherwise. {DAUGHTER} watches this for most
      of an afternoon.
    interaction:
      kind: choice
      choices:
        - id: buy_her_an_hour
          label: Buy an hour of her time and let the girl ask.
          outcomes:
            - id: an_hour
              weight: 100
              text: >-
                Two marks for the hour, which is court rate and she knows it.
                What she says is that the wall between the four and the four is
                not in the books, it is in the reader, and that a woman who
                spends nine years proving otherwise has spent nine years. Then
                she asks the girl a question that nobody in the family has ever
                thought to ask her.
              effects:
                - { kind: treasury, delta: -2 }
                - { kind: attribute, target: { slot: DAUGHTER }, attr: mind, delta: 2 }
                - { kind: respect, delta: 1 }
        - id: take_her_home
          label: Take the girl home before anybody sees whose daughter she is.
          outcomes:
            - id: home_early
              weight: 100
              text: >-
                It is the safe answer and everybody in the cart knows it is the
                safe answer. The girl asks the question in the cart instead,
                and gets it answered by a mother who has never once been within
                six weeks of a College.
              effects:
                - { kind: treasury, delta: -3 }
                - { kind: relationship, from: { slot: DAUGHTER }, to: head, sentiment: -8 }

  - id: the_college_agent_takes_the_order
    title: A Catalogue and No Stock
    tier: head
    frequency: common
    weight: 70
    tags: [books, anvary, money, library]
    purposes: [advance_clause, change_standing, establish_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      The stationers' agent is Anvarine, travels with a catalogue and no stock
      at all, takes the order in the long room and delivers in eleven months.
      That is the whole of the book trade at this distance: a list, a deposit,
      a winter, and a crate off the Sarrow road the following Harvest. A fair
      copy of an ordinary book is half a year of somebody's life and is priced
      like it. What the agent writes in his own book is what this house asked
      for, and that copy goes back to Corran.
    interaction:
      kind: choice
      choices:
        - id: order_plainly
          label: Order plainly, under the house's own name.
          outcomes:
            - id: ordered
              weight: 100
              text: >-
                Eleven crowns down against sixty-two, and it comes the
                following Harvest and it is the right book. A house that buys
                openly is a house with a library, and a library is a thing the
                Roll of Houses can be made to notice.
              effects:
                - { kind: treasury, delta: -62 }
                - { kind: respect, delta: 1 }
        - id: order_through_bramme
          label: Order it through a Bramme merchant and pay his cut.
          outcomes:
            - id: through_a_third_hand
              weight: 100
              text: >-
                Sixty-two and eight for the merchant, and the entry in the
                Corran book has a Bramme name on it instead of this one. It is
                cheap for what it buys and it looks exactly like what it is,
                which is a house that did not want to be on a list.
              effects:
                - { kind: treasury, delta: -70 }
                - { kind: rumour, op: seed, id: rumour_the_bramme_name_on_the_order, accuracy: 0.4 }

  - id: what_the_liturgy_wards_against
    title: What the Quieting Is For
    tier: family
    frequency: common
    weight: 75
    tags: [church, hollow_days, doctrine, night]
    purposes: [advance_clause, establish_magic_rule, plant_rumour]
    slots:
      LISTENER:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 14 } }]
    body: >-
      Nine nights at dusk in the chapter house at Bramme, and the house is
      expected at least once and is noticed when it is not. The Quieting is
      said in Old Ambric and most of the room does not follow it. {LISTENER}
      follows it. The fourth of the nine petitions asks, in plain grammar, for
      the household to be kept from a thing the Church's own doctrine holds to
      be a peasant superstition that does not exist.
    interaction:
      kind: choice
      choices:
        - id: ask_the_keeper
          label: Ask the keeper afterwards what the fourth petition means.
          outcomes:
            - id: he_answers
              weight: 100
              text: >-
                He says it is a figure. He says it four times, in three
                different ways, none of them the same length, and he is a
                pleasant man who has never lied to this family about anything
                else. Then he asks who was reading over the household's
                shoulder, and writes nothing down, and remembers it for
                thirty years.
              effects:
                - { kind: treasury, delta: -10 }
                - { kind: attribute, target: { slot: LISTENER }, attr: mind, delta: 2 }
                - { kind: rumour, op: seed, id: rumour_who_reads_the_liturgy, accuracy: 0.3 }
        - id: say_nothing_about_it
          label: Say nothing. Nine nights, and home.
          outcomes:
            - id: nothing_said
              weight: 100
              text: >-
                The family goes on the second night and the seventh and is
                seen, which is the entire purpose of going. Eleven hundred
                years of organisation have been warding against this household
                every winter evening since before the kingdom, free of charge,
                without ever once being told.
              effects:
                - { kind: treasury, delta: -7 }
                - { kind: respect, delta: 1 }

  - id: the_signs_disagree
    title: Three Brokers, Three Theories
    tier: head
    frequency: common
    weight: 70
    tags: [marriage, signs, folklore, blood]
    purposes: [advance_clause, establish_magic_rule, plant_rumour]
    slots:
      HEAD: { role: head }
      GIRL:
        role: family_member
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 13 } }, { age: { op: lte, value: 24 } }]
    body: >-
      Every marriage-broker in the province has a theory about the sign of the
      blood and no two of them agree. One reads the hairline. One reads whether
      a girl was born inside the Hollow Days. The third has a chart, and the
      chart has been in his family for four generations, and it contradicts the
      other two on every point including the ones where they contradict each
      other. All three have been right about {GIRL}, in different directions,
      for eleven marks apiece.
    interaction:
      kind: choice
      choices:
        - id: buy_the_best_reading
          label: Buy the reading that suits the house and let it travel.
          outcomes:
            - id: bought_reading
              weight: 100
              text: >-
                Eleven marks for the chart man, because the chart is the one
                that looks like evidence, and the reading goes down to Bramme
                with him inside a tenday. It is worth about four crowns on a
                dowry and it is worth nothing at all in a room where somebody
                has the other two readings.
              effects:
                - { kind: treasury, delta: -1 }
                - { kind: attribute, target: { slot: GIRL }, attr: charm, delta: 3 }
                - { kind: rumour, op: seed, id: rumour_the_chart_at_bramme, accuracy: 0.2 }
        - id: buy_all_three
          label: Buy all three and keep them in the same drawer.
          outcomes:
            - id: all_three
              weight: 100
              text: >-
                Thirty-three marks for three pieces of paper that cancel each
                other out, which is precisely why the house wants all three.
                Signs are real, cheap and unreliable, and a drawer with three
                contradictory readings in it is the closest thing to proof of
                that anybody in the Nethering owns.
              effects:
                - { kind: treasury, delta: -2 }
                - { kind: knowledge, op: grant, flag: knows_the_signs_disagree }

  - id: it_does_not_come_when_called
    title: It Does Not Come When Called
    tier: individual
    frequency: common
    weight: 80
    tags: [eldritch, blood, failure, night]
    purposes: [advance_clause, establish_magic_rule, test_magic_rule]
    slots:
      TRIER:
        role: family_member
        filters: [{ canExpress: true }, { status: [alive] }, { age: { op: gte, value: 17 } }]
    body: >-
      Three nights in the second cellar with the door wedged, because the third
      night is the one the book in the press says matters, and the book in the
      press is about a rite for something else entirely. {TRIER} has the
      spacing right and the hours right and has fasted since Slaughter. Nothing
      happens on any of the three nights. It happened once, unasked, in a
      corridor in the middle of an argument about a horse.
    interaction:
      kind: narration
      outcomes:
        - id: nothing_at_all
          weight: 100
          tags: [signs]
          text: >-
            He comes up on the fourth morning cold through and furious and
            entirely himself. There is no schedule. There has never been a
            schedule, and every generation of this family works that out
            privately and tells the next one nothing.
          effects:
            - { kind: treasury, delta: -3 }
            - { kind: attribute, target: { slot: TRIER }, attr: health, delta: -4 }
            - { kind: madness, target: { slot: TRIER }, delta: 3 }
            - { kind: knowledge, op: grant, flag: knows_it_cannot_be_called }

  - id: the_smith_and_the_dull_edge
    title: The Smith's Theory
    tier: family
    frequency: common
    weight: 75
    tags: [iron, village, smith, signs]
    purposes: [advance_clause, establish_magic_rule, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      The smith at Wick has been shoeing and edging for this house for
      twenty-six years and has developed a theory, which he offers to {HEAD} in
      the yard with the air of a man doing a favour. Blades off the hall go
      back dull faster than blades off anywhere else in the parish. He has
      counted. His theory is the water in the hall well, and he would like
      permission to take a jug of it away and settle the matter, and he is
      being generous, because his other theory is the one Wick has.
    interaction:
      kind: choice
      choices:
        - id: give_him_the_jug
          label: Give him the jug.
          outcomes:
            - id: he_tests_it
              weight: 100
              text: >-
                He quenches in it for a season and gets exactly the same edge
                he gets out of the beck, and he says so, publicly, at the
                alehouse, because he is an honest man. Having eliminated the
                water, he stops talking about the well, and the parish notices
                which theory he has left.
              effects:
                - { kind: treasury, delta: -7 }
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_the_smiths_other_theory, accuracy: 0.5 }
        - id: pay_him_to_stop_counting
          label: Pay the year's ironwork in advance and let the theory die.
          outcomes:
            - id: paid_forward
              weight: 100
              text: >-
                Nine crowns on the nail for work not yet done, which no house
                in the Nethering has ever done for a village smith. He is
                delighted and mildly insulted and stops counting. His son
                starts counting in about forty years, from scratch, and gets
                further.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: respect, delta: 1 }

# Plain English alternatives for the common-tier two-magics/trade scenes (#834).
# Only alternate authored wording is added; original text and mechanics are unchanged.
proseVariants:
  - address: "content:events/the_trade.yaml#events[id=the_warrant_on_the_wall].title"
    of: 9af109eb7b5b4137
    plainenglish: >-
      The Public Licence on the Wall
  - address: "content:events/the_trade.yaml#events[id=the_warrant_on_the_wall].body"
    of: 12649023b58e5457
    plainenglish: >-
      At Bramme, a licence is nailed to the chapter-house wall where notices about the fair are posted. It has an official seal and a list of charges. Removing damp from a wall costs four mites per yard. Keeping a fire burning during a wet season costs two marks, with food and lodging provided. Practising magic without a licence is a crime in both the magistrate's court and the Church's court. A conviction by the Church is the one that can ruin a person's life. {WATCHER} reads the price list twice. On the way home, they realise that nothing on it describes what their family can do.
  - address: "content:events/the_trade.yaml#events[id=the_warrant_on_the_wall].interaction.outcomes[id=read_it].text"
    of: b5f9354f4028d773
    plainenglish: >-
      Each kind of permitted magic has a public price, and the prices are low. The power this family possesses is not listed anywhere on the wall.
  - address: "content:events/the_trade.yaml#events[id=the_threshold_four_at_the_fair].title"
    of: 0f0ed0a53913f1a9
    plainenglish: >-
      The Four Kinds of Magic Women Can Practise
  - address: "content:events/the_trade.yaml#events[id=the_threshold_four_at_the_fair].body"
    of: 51f390dbc8c7a1e7
    plainenglish: >-
      At the Ingathering fair, a licensed woman removes rot from a plough handle for six mites. She refuses to discuss anything beyond her work. She can use Life and Death magic, and will discuss Light for as long as someone keeps buying her beer. When a merchant asks her to warm a pot, she tells him that is Elemental magic and returns to the handle. The Colleges allow her to practise four of the eight kinds of Mystic magic, but not the other four. She has never claimed otherwise. {DAUGHTER} watches her for most of the afternoon.
  - address: "content:events/the_trade.yaml#events[id=the_threshold_four_at_the_fair].interaction.choices[id=buy_her_an_hour].label"
    of: d7bcebb3a9e2ad0f
    plainenglish: >-
      Pay for an hour with the practitioner and let the girl ask questions.
  - address: "content:events/the_trade.yaml#events[id=the_threshold_four_at_the_fair].interaction.choices[id=buy_her_an_hour].outcomes[id=an_hour].text"
    of: 85a507bfd22e28bb
    plainenglish: >-
      She charges two marks for the hour, the official court rate. She explains that the difference between the four kinds a woman can use and the other four is not in the textbooks. It comes from the person reading them. A woman who spends nine years trying to prove otherwise has wasted nine years. Then she asks the girl something nobody in the family has thought to ask her.
  - address: "content:events/the_trade.yaml#events[id=the_threshold_four_at_the_fair].interaction.choices[id=take_her_home].label"
    of: 7a82b305ed56a3e1
    plainenglish: >-
      Take the girl home before anyone recognises which family's daughter she is.
  - address: "content:events/the_trade.yaml#events[id=the_threshold_four_at_the_fair].interaction.choices[id=take_her_home].outcomes[id=home_early].text"
    of: 069d740adcf47f26
    plainenglish: >-
      Taking her home is the safer choice, and everyone in the cart knows it. The girl asks her question on the journey instead. Her mother answers, even though she has never been anywhere near the Colleges, six weeks away.
  - address: "content:events/the_trade.yaml#events[id=the_college_agent_takes_the_order].title"
    of: a9bb349d59c4b921
    plainenglish: >-
      The Book Agent Who Carries Only a Catalogue
  - address: "content:events/the_trade.yaml#events[id=the_college_agent_takes_the_order].body"
    of: ded1d9cbb4832417
    plainenglish: >-
      An agent from Anvary visits the long room with a book catalogue but no books to sell directly. He takes an order and delivers the book eleven months later. At this distance, buying books means choosing from a list, paying a deposit, waiting through winter, and receiving a crate from the Sarrow road at the next Harvest. Making a fair copy of an ordinary book takes someone six months, so it costs a great deal. The agent writes down what this house orders in his own ledger. That record goes back to Corran.
  - address: "content:events/the_trade.yaml#events[id=the_college_agent_takes_the_order].interaction.choices[id=order_plainly].label"
    of: fc794f04848484e8
    plainenglish: >-
      Order the book openly under the house's own name.
  - address: "content:events/the_trade.yaml#events[id=the_college_agent_takes_the_order].interaction.choices[id=order_plainly].outcomes[id=ordered].text"
    of: 4527c90f4ae4831b
    plainenglish: >-
      The house pays eleven crowns in advance towards the total price of sixty-two. The correct book arrives at the next Harvest. An openly purchased book becomes part of a library that the Roll of Houses can recognise.
  - address: "content:events/the_trade.yaml#events[id=the_college_agent_takes_the_order].interaction.choices[id=order_through_bramme].label"
    of: a4fa08c963d18c25
    plainenglish: >-
      Order the book through a merchant at Bramme and pay his fee.
  - address: "content:events/the_trade.yaml#events[id=the_college_agent_takes_the_order].interaction.choices[id=order_through_bramme].outcomes[id=through_a_third_hand].text"
    of: c54d59541c4e7528
    plainenglish: >-
      The book costs sixty-two crowns, plus eight for the merchant. In the ledger at Corran, the buyer is recorded under a Bramme merchant's name instead of the house's name. The extra cost is small for the privacy it buys, but the arrangement makes clear that the house does not want its name recorded.
  - address: "content:events/the_trade.yaml#events[id=what_the_liturgy_wards_against].title"
    of: e7b00123a515ec1f
    plainenglish: >-
      What the Church's Night Prayer Protects Against
  - address: "content:events/the_trade.yaml#events[id=what_the_liturgy_wards_against].body"
    of: ddc50a2e30f998a2
    plainenglish: >-
      The Quieting is held at dusk for nine nights in the chapter house at Bramme. Every household is expected to attend at least once, and anyone who stays away is noticed. The prayer is spoken in Old Ambric, which most people in the room do not understand. {LISTENER} understands it. The fourth of the nine requests asks for the household to be protected from something the Church's own teaching calls a peasant superstition that does not exist.
  - address: "content:events/the_trade.yaml#events[id=what_the_liturgy_wards_against].interaction.choices[id=ask_the_keeper].label"
    of: 3ec3343bf85204ef
    plainenglish: >-
      Ask the keeper afterward what the fourth request means.
  - address: "content:events/the_trade.yaml#events[id=what_the_liturgy_wards_against].interaction.choices[id=ask_the_keeper].outcomes[id=he_answers].text"
    of: a6eb35aea58d5662
    plainenglish: >-
      The keeper says the words are a figure of speech. He repeats that explanation four times in three different ways. He is a kind man who has never lied to this family about anything else. Then he asks who was reading the prayer over the household's shoulder. He writes nothing down but remembers the conversation for thirty years.
  - address: "content:events/the_trade.yaml#events[id=what_the_liturgy_wards_against].interaction.choices[id=say_nothing_about_it].label"
    of: 09a16490a9172454
    plainenglish: >-
      Say nothing about the prayer. Attend and then go home.
  - address: "content:events/the_trade.yaml#events[id=what_the_liturgy_wards_against].interaction.choices[id=say_nothing_about_it].outcomes[id=nothing_said].text"
    of: fb0bf5ca980c89c6
    plainenglish: >-
      The family attends on the second and seventh nights, so everyone sees that they came. For eleven hundred years, the Church has performed this protection every winter evening, since before the kingdom was founded. The Church has never been told that it is protecting this particular family.
  - address: "content:events/the_trade.yaml#events[id=the_signs_disagree].title"
    of: 33dc2b80bd61d174
    plainenglish: >-
      Three Marriage Brokers Disagree
  - address: "content:events/the_trade.yaml#events[id=the_signs_disagree].body"
    of: f46418b0d59ca954
    plainenglish: >-
      Every marriage broker in the province claims to know how to recognise signs of the family's blood, but their methods disagree. One looks at the hairline. Another checks whether a girl was born during the Hollow Days. The third uses a chart handed down through his family for four generations. His chart disagrees with both the others, even where those two disagree with each other. Each broker has given a different reading of {GIRL}, and each charged eleven marks.
  - address: "content:events/the_trade.yaml#events[id=the_signs_disagree].interaction.choices[id=buy_the_best_reading].label"
    of: 8f750c1b6008216f
    plainenglish: >-
      Pay for the reading that helps the house most and spread the story.
  - address: "content:events/the_trade.yaml#events[id=the_signs_disagree].interaction.choices[id=buy_the_best_reading].outcomes[id=bought_reading].text"
    of: 687d83867f50a122
    plainenglish: >-
      The house pays the broker with the chart eleven marks, because the chart looks the most like evidence. Within ten days, the broker takes his reading to Bramme. It could add around four crowns to a dowry, but it is worthless to anyone who has seen the other two readings.
  - address: "content:events/the_trade.yaml#events[id=the_signs_disagree].interaction.choices[id=buy_all_three].label"
    of: 4a3f5beb68a48f97
    plainenglish: >-
      Pay for all three readings and keep them together in one drawer.
  - address: "content:events/the_trade.yaml#events[id=the_signs_disagree].interaction.choices[id=buy_all_three].outcomes[id=all_three].text"
    of: 740dda0312d6a39f
    plainenglish: >-
      The family pays thirty-three marks for three documents that contradict one another. That is exactly why they want all three. The signs exist and are cheap to interpret, but the interpretations are unreliable. Keeping three conflicting readings together is the closest thing anyone in the Nethering has to proof of that.
  - address: "content:events/the_trade.yaml#events[id=it_does_not_come_when_called].title"
    of: 8b453771912b641d
    plainenglish: >-
      The Family's Power Cannot Be Summoned
  - address: "content:events/the_trade.yaml#events[id=it_does_not_come_when_called].body"
    of: a601eb156fbf7be1
    plainenglish: >-
      {TRIER} spends three nights in the second cellar with the door wedged shut. The book stored in the cupboard says the third night matters, although it describes a ritual for something else. He follows the timing and spacing exactly and has not eaten since Slaughter. Nothing happens on any of the three nights. Yet his power once appeared without warning during an argument about a horse in a corridor.
  - address: "content:events/the_trade.yaml#events[id=it_does_not_come_when_called].interaction.outcomes[id=nothing_at_all].text"
    of: 879e34beafdd8f6a
    plainenglish: >-
      On the fourth morning he comes upstairs freezing cold and angry, but otherwise unchanged. There is no reliable timetable for this power. There never has been. Every generation of the family discovers this for itself and fails to tell the next.
  - address: "content:events/the_trade.yaml#events[id=the_smith_and_the_dull_edge].title"
    of: 6fadef5e6682d5e2
    plainenglish: >-
      The Blacksmith's Explanation for Dull Blades
  - address: "content:events/the_trade.yaml#events[id=the_smith_and_the_dull_edge].body"
    of: ef53e22621262052
    plainenglish: >-
      The smith at Wick has made horseshoes and sharpened blades for this house for twenty-six years. He tells {HEAD} about a pattern he has noticed, believing he is doing the family a favour. Blades from the hall become dull more quickly than blades from anywhere else in the parish. He has counted the cases. He thinks the water from the hall's well might be responsible. He asks to take a jug of it and test his idea. He offers this as a kindness because he knows the people of Wick have another explanation.
  - address: "content:events/the_trade.yaml#events[id=the_smith_and_the_dull_edge].interaction.choices[id=give_him_the_jug].label"
    of: 283f788345c45b47
    plainenglish: >-
      Give the smith a jug of water from the hall's well.
  - address: "content:events/the_trade.yaml#events[id=the_smith_and_the_dull_edge].interaction.choices[id=give_him_the_jug].outcomes[id=he_tests_it].text"
    of: a82c43966c1c9402
    plainenglish: >-
      The smith uses the water to cool hot metal for a season. The blades turn out exactly as they do when he uses stream water. Because he is honest, he announces the result publicly at the alehouse. He no longer thinks the well is responsible. The parish notices that only his other theory remains.
  - address: "content:events/the_trade.yaml#events[id=the_smith_and_the_dull_edge].interaction.choices[id=pay_him_to_stop_counting].label"
    of: 60b7ff05a048bee9
    plainenglish: >-
      Pay for the year's ironwork in advance so the smith stops investigating.
  - address: "content:events/the_trade.yaml#events[id=the_smith_and_the_dull_edge].interaction.choices[id=pay_him_to_stop_counting].outcomes[id=paid_forward].text"
    of: 6caa1ff36c3ccb77
    plainenglish: >-
      The house pays nine crowns in advance for work the smith has not yet done. No other house in the Nethering has ever paid a village smith that way. He is pleased, but also a little offended, and stops keeping count. About forty years later, his son starts counting from the beginning and discovers more.
