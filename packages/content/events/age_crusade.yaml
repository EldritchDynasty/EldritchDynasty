# THE CRUSADE — institutional register.
#
# The Church of the Nine Quiet Names is not hunting the family. It is auditing
# the province, and the family is in the province. That distinction is the
# whole texture of this Age: nobody accuses anyone, everyone is courteous, and
# the house spends thirty years being asked reasonable questions.
#
# Threshold rule, from the world file §14: Light and Life are safe. Death and
# Darkness are a hearing at the assize. The Church's public position is that
# Eldritch Power does not exist, while Church law keeps "the blood" as a legal
# category — and both of those are true at the same time, on purpose.
events:
  - id: the_priest_in_the_west_wing
    title: A Reader, Quartered
    tier: family
    frequency: common
    weight: 85
    tags: [church, crusade, surveillance]
    purposes: [worldbuild_through_action, change_relationship, establish_magic_rule]
    ages: { only: [the_crusade] }
    slots:
      HEAD: { role: head }
      PRIEST:
        role: outsider
        filters: [{ sex: male }, { age: { op: gte, value: 25 } }]
    body: >-
      There is a second bell now, rung at an hour the house has never rung
      anything, and the household has learned to wake for it. The chapter house
      at Bramme has quartered a reader on Ardwen for the duration, which is the
      polite arrangement and also the other kind. {PRIEST} is courteous, eats
      little, and writes in the evenings. He has asked twice about the chapel
      the family does not use, once about the second cellar, and not once about
      anything that would tell {HEAD} what he was sent here to find. The house
      is not being watched, in the sense that nobody has said so. The bell goes
      at four.
    interaction:
      kind: choice
      choices:
        - id: house_him_well
          label: House him well. A guest writes differently from a lodger.
          outcomes:
            - id: warmed
              weight: 68
              text: >-
                He is given the good room and the good wine and a chair at the
                third night, and what he writes that winter is dull, and dull
                is the best outcome available.
              effects:
                - { kind: treasury, delta: -10 }
                - { kind: relationship, from: head, to: { slot: PRIEST }, sentiment: 12 }
            - id: unmoved
              weight: 32
              text: >-
                He thanks the house for the room and goes on writing exactly
                what he was going to write, which is what a serious man does.
              effects:
                - { kind: treasury, delta: -10 }
        - id: arms_length
          label: Correct, cold, and nothing offered.
          outcomes:
            - id: noted
              weight: 100
              text: >-
                Nothing is refused him and nothing is offered, and a reader
                notices the second one faster than he notices the first.
              effects:
                - { kind: relationship, from: head, to: { slot: PRIEST }, sentiment: -10 }

  - id: the_shelf_that_has_to_go
    title: Two Rows on the Trestle
    tier: head
    frequency: uncommon
    weight: 75
    cooldownYears: 40
    tags: [church, crusade, books, library]
    purposes: [establish_magic_rule, change_standing, worldbuild_through_action]
    ages: { only: [the_crusade] }
    conditions:
      all:
        - { ageElapsed: { op: gte, years: 6 } }
    slots:
      HEAD: { role: head }
      ARCHIVIST: { role: retainer, filters: [{ status: [alive] }] }
    body: >-
      The east cellar is dry, which is the only reason any of it has lasted
      this long. {ARCHIVIST} has laid the house's books out in two rows on the
      trestle, and the rows are not by subject or by age or by what they cost.
      One row is Light and Life and the four elemental hands, and nobody in
      Bramme would look twice at any of it. The other row is Death and
      Darkness, and in an ordinary decade it is worth four hundred crowns and a
      good deal of quiet respect, and in this decade it is worth a hearing at
      the assize and whatever the assize decides after that. The Church has not
      changed its doctrine; it has only changed how hard it is looking, which
      is the same thing done cheaper. The trestle is still out.
    interaction:
      kind: choice
      choices:
        - id: burn_them
          label: Burn the second row. Books are replaceable and hearings are not.
          outcomes:
            - id: burned
              weight: 100
              text: >-
                It takes an afternoon and the smoke is visible from Wick, which
                is the point of doing it in the yard. Four hundred crowns of
                paper and nine years of somebody's life, and the house is now
                the kind of house that can be inspected without an argument.
              effects:
                - { kind: respect, delta: 1 }
        - id: hide_them
          label: The second cellar. It has held worse.
          outcomes:
            - id: hidden
              weight: 100
              text: >-
                The second cellar is cold and it is not dry, and the difference
                between those two words costs the house something every winter
                it leaves them down there.
              effects:
                - { kind: spellbook, op: degrade, target: head, book: lesser_workings_of_death }
                - { kind: spellbook, op: degrade, target: head, book: lesser_workings_of_darkness }
                - { kind: flag, flag: the_second_cellar_shelf, set: true }
        - id: sell_them
          label: Sell them east while there is still a buyer.
          outcomes:
            - id: sold
              weight: 100
              text: >-
                A broker at Sarrow pays a third of what they are worth and does
                not ask where they came from, and both of those are the same
                fact wearing two faces.
              effects:
                - { kind: treasury, delta: 110 }
                - { kind: respect, delta: -1 }

  - id: what_the_chapel_is_for
    title: The Stone in the Chapel
    tier: record
    frequency: uncommon
    weight: 70
    cooldownYears: 55
    tags: [church, crusade, chapel, record]
    purposes: [change_relationship, force_record_choice, establish_magic_rule]
    ages: { only: [the_crusade] }
    slots:
      HEAD: { role: head }
      WIFE: { role: spouse, filters: [{ sex: female }], optional: true }
    body: >-
      The chapel is cold in a way the rest of the house is not, because nothing
      has been burned in it for sixty years. It has a roof, a door, eight seats
      and a stone the family has never been able to decide about. Under a
      Crusade an unused chapel stops being a household eccentricity and becomes
      a sentence that somebody else can finish for you. {WIFE} wants it opened,
      swept, and used on the third night like every other house in the
      province, and she is right, and everyone at the table can hear that she
      is right. The stone is the difficulty: it is older than the chapel,
      nobody in the family put it there, and the chronicle has never once
      described it. Nobody wants it swept.
    absentBody: >-
      The chapel is cold in a way the rest of the house is not, because nothing
      has been burned in it for sixty years. It has a roof, a door, eight seats
      and a stone the family has never been able to decide about. Under a
      Crusade an unused chapel stops being a household eccentricity and becomes
      a sentence that somebody else can finish for you. The province opens its
      chapels on the third night and this house has not opened its own since
      the year of the bad roof, which is the reason given and has not been the
      reason for forty years. The stone is the difficulty: it is older than the
      chapel, nobody in the family put it there, and the chronicle has never
      once described it. Nobody wants it swept.
    interaction:
      kind: choice
      choices:
        - id: open_it
          label: Open it, sweep it, use it. Let them see an ordinary chapel.
          outcomes:
            - id: opened
              weight: 100
              text: >-
                It is swept, aired, and used on the third night, and the
                province notes that the Eldritch House keeps its chapel like
                anybody else. The stone is where it was. Somebody has put a
                cloth over it.
              effects:
                - { kind: treasury, delta: -8 }
                - { kind: respect, delta: 1 }
        - id: keep_it_shut
          label: Keep it shut. A swept chapel invites a visitor.
          outcomes:
            - id: shut
              weight: 100
              text: >-
                The door stays closed and the reason given is the roof, and the
                roof has been the reason for so long that two of the children
                believe it.
              effects:
                - { kind: flag, flag: the_chapel_stayed_shut, set: true }
                - { kind: respect, delta: -1 }
    record:
      subject: the stone in the chapel
      options:
        record:
          chronicle: The chapel was opened for the third night. The stone in it is older than the chapel and this house did not set it there.
          grantsKnowledge: knows_the_chapel_stone
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: 'keeps an altar stone older than the chapel, which this house did not set there' }
        omit:
          chronicle: null
        embellish:
          chronicle: The chapel was opened for the third night, and the altar stone in it was laid by the founder's own hand.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: keeps the founder's own altar stone in the house chapel }
          discrepancy:
            id: the_chapel_stone_lie
            severity: major
            provableBy: [the_church]

  # The Crusade is when a house's own paperwork becomes the instrument used on
  # it. A chronicler in post is what makes that survivable; he is also, half
  # the time, Church-schooled, and the registrar knows his hand.
  - id: the_registrar_asks_for_the_book
    title: The Registrar Asks for the Book
    tier: head
    frequency: uncommon
    weight: 125
    tags: [crusade, records, church, law]
    purposes: [advance_clause, change_standing, force_record_choice]
    ages: { only: [the_crusade] }
    conditions:
      all:
        - { unlocked: fair_hand }
    slots:
      HEAD: { role: head }
      CHRONICLER: { role: retainer, filters: [{ trait: keeps_a_fair_hand, has: true }] }
    body: >-
      The registrar comes up from the chapter house at Bramme with two clerks
      and a letter, and he is polite the whole way through, which is how you
      know how much of his mind is already made up. The Church court may
      require the house book. It has always been able to require it. In four
      hundred years it has never once bothered, and it is bothering now because
      it is bothering everywhere. {CHRONICLER} was schooled by these people. He
      knows the registrar's own teacher's hand and he knows exactly which four
      entries in nine hundred pages a man trained the way he was trained will
      stop at. Out in the yard a clerk is walking the horses to the trough and
      back, unhurried, the way a man walks who has done this at eleven houses
      this season. That is the whole of the time there is.
    interaction:
      kind: choice
      choices:
        - id: hand_it_over
          label: Hand it over. All nine hundred pages, and let him read as long as he likes.
          outcomes:
            # One ending, not two. Crusade-only and gated on the post being
            # filled, this scene reaches a few runs in a hundred, and gate 8
            # caught the 34-weight half of this branch resolving in none of
            # them. What that branch was for is in the surviving text: the
            # minute, and the entry the minute stops at.
            - id: read_and_returned
              weight: 100
              text: >-
                Six days in the long room with a clerk turning the pages for
                him. He stops once, on the sixth afternoon, at the fourth of
                the four, and reads it twice, and asks a question about a date
                that has no good answer; the chronicler gives him the answer
                that is merely true, and the pause before it gets written down
                along with the answer. Then he thanks the house and takes
                nothing. The minute he leaves behind says this book was
                produced entire and read entire, and one day that will be worth
                more than the roof.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: discrepancy, op: create, id: the_registrars_marginal_note, severity: minor, provableBy: [the_church] }
        - id: send_a_copy
          label: Send a copy. Made this week, in his own fair hand, of the parts that are asked for.
          outcomes:
            - id: copy_accepted
              weight: 100
              text: >-
                The registrar takes the copy because the hand is a hand he
                trusts, and because refusing it would mean saying out loud what
                he came for. He is on the road by noon. Everyone in the yard
                understands that a thing has just been bought and that nobody
                has said the price.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: flag, flag: sent_the_church_a_copy, set: true }
    record:
      subject: what the Church was given
      options:
        record:
          chronicle: >-
            The registrar of Bramme required this book in the Crusade and was
            given what he was given. Whoever holds this next: he wrote a minute
            about it, and their minute outlives ours.
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            The Church asked to see the house book, found it in perfect order,
            and departed satisfied — as it has every time it has asked.
          effects:
            - { kind: respect, delta: 1 }
          discrepancy:
            id: the_registrars_marginal_note
            severity: major
            provableBy: [the_church, house_ilm]

proseVariants:
  - address: "content:events/age_crusade.yaml#events[id=the_priest_in_the_west_wing].title"
    of: "1afb0dd82b8254cc"
    plainenglish: >-
      A Church Reader Comes to Stay
  - address: "content:events/age_crusade.yaml#events[id=the_priest_in_the_west_wing].body"
    of: "c3fbe158fa692e1c"
    plainenglish: >-
      A second bell now rings at four in the morning, and the household has learned to wake
      for it. The chapter house at Bramme has sent a reader to live at Ardwen for the
      duration of the Crusade. Officially, this is a polite arrangement. {PRIEST} is
      courteous, eats little, and writes notes each evening. He has asked twice about the
      unused chapel and once about the second cellar. He has not told {HEAD} what he came to
      investigate. Nobody has officially said the house is under watch.
  - address: "content:events/age_crusade.yaml#events[id=the_priest_in_the_west_wing].interaction.choices[id=house_him_well].label"
    of: "030d3f6ef01b0eb2"
    plainenglish: >-
      Give him a comfortable welcome. A well-treated guest may write a kinder report.
  - address: "content:events/age_crusade.yaml#events[id=the_priest_in_the_west_wing].interaction.choices[id=house_him_well].outcomes[id=warmed].text"
    of: "ed5b91ed3351a3a9"
    plainenglish: >-
      He gets the best room, good wine, and a place at the table on the third night. His
      report that winter says very little of interest. That is the best result the house
      could hope for.
  - address: "content:events/age_crusade.yaml#events[id=the_priest_in_the_west_wing].interaction.choices[id=house_him_well].outcomes[id=unmoved].text"
    of: "11eb7bfa4a1800e6"
    plainenglish: >-
      He thanks the house for the room, then writes exactly the report he had already
      planned. The welcome has not changed his mind.
  - address: "content:events/age_crusade.yaml#events[id=the_priest_in_the_west_wing].interaction.choices[id=arms_length].label"
    of: "19a84cc896cb46d4"
    plainenglish: >-
      Be formally polite, but offer him nothing extra.
  - address: "content:events/age_crusade.yaml#events[id=the_priest_in_the_west_wing].interaction.choices[id=arms_length].outcomes[id=noted].text"
    of: "a0dcd95b434cf73f"
    plainenglish: >-
      The house refuses none of his requests, but offers nothing beyond them. He notices the
      lack of welcome sooner than he notices their cooperation.
  - address: "content:events/age_crusade.yaml#events[id=the_shelf_that_has_to_go].title"
    of: "6612053550727461"
    plainenglish: >-
      Two Rows of Books on a Table
  - address: "content:events/age_crusade.yaml#events[id=the_shelf_that_has_to_go].body"
    of: "620205bf6dbd3ce3"
    plainenglish: >-
      The east cellar is dry, which has helped preserve the family's books. {ARCHIVIST} lays
      them in two rows on a table, not sorted by subject, age, or price. The first row holds
      Light and Life books and works on the four elemental arts. Nobody in Bramme would
      object to them. The second row holds Death and Darkness books. In ordinary times they
      would be worth four hundred crowns and bring quiet respect. During the Crusade,
      keeping them could mean a hearing at the assize, with whatever punishment the court
      decides. Church doctrine has not changed; the Church is simply inspecting houses more
      closely. The books are still on the table, awaiting a decision.
  - address: "content:events/age_crusade.yaml#events[id=the_shelf_that_has_to_go].interaction.choices[id=burn_them].label"
    of: "bbd938c02f3092ec"
    plainenglish: >-
      Burn the Death and Darkness books. Books can be replaced, but a court hearing cannot
      be undone.
  - address: "content:events/age_crusade.yaml#events[id=the_shelf_that_has_to_go].interaction.choices[id=burn_them].outcomes[id=burned].text"
    of: "8af113031372dbf7"
    plainenglish: >-
      The books take an afternoon to burn in the yard. People in Wick can see the smoke,
      which is why the fire was lit outside. The house destroys four hundred crowns' worth
      of books and the result of nine years of someone's work. Inspectors can now examine
      the house without arguing over those books.
  - address: "content:events/age_crusade.yaml#events[id=the_shelf_that_has_to_go].interaction.choices[id=hide_them].label"
    of: "9244822fb078595b"
    plainenglish: >-
      Hide the books in the second cellar. It has concealed worse things.
  - address: "content:events/age_crusade.yaml#events[id=the_shelf_that_has_to_go].interaction.choices[id=hide_them].outcomes[id=hidden].text"
    of: "ddbc3b6a684627a6"
    plainenglish: >-
      The second cellar is cold but damp. Every winter that the books stay there, the
      moisture damages them a little more.
  - address: "content:events/age_crusade.yaml#events[id=the_shelf_that_has_to_go].interaction.choices[id=sell_them].label"
    of: "04e8ff51d08a9525"
    plainenglish: >-
      Sell the books to a buyer in the east while someone will still buy them.
  - address: "content:events/age_crusade.yaml#events[id=the_shelf_that_has_to_go].interaction.choices[id=sell_them].outcomes[id=sold].text"
    of: "7a774badfbe51cb1"
    plainenglish: >-
      A broker in Sarrow pays only one-third of what the books are worth. He asks nothing
      about where they came from. His silence explains his low offer.
  - address: "content:events/age_crusade.yaml#events[id=what_the_chapel_is_for].title"
    of: "69dc584acc12a5de"
    plainenglish: >-
      The Old Stone in the Chapel
  - address: "content:events/age_crusade.yaml#events[id=what_the_chapel_is_for].body"
    of: "0bd99c90047fbbac"
    plainenglish: >-
      No fire has burned in the chapel for sixty years, so it is colder than the rest of the
