  - address: "content:events/age_crusade.yaml#events[id=what_the_chapel_is_for].record.options.embellish.claims[0].text"
    of: "f3d60de9316c01e5"
    plainenglish: >-
      keeps the altar stone that the founder placed in the house chapel
  - address: "content:events/age_crusade.yaml#events[id=the_registrar_asks_for_the_book].title"
    of: "7f88c14c2b3efe20"
    plainenglish: >-
      The Church Registrar Requests the House Book
  - address: "content:events/age_crusade.yaml#events[id=the_registrar_asks_for_the_book].body"
    of: "3a6f6fdfd5eba5eb"
    plainenglish: >-
      The registrar arrives from the chapter house at Bramme with two clerks and a letter.
      He is polite, but seems to have made up his mind. The Church court has always had the
      power to demand the house book. In four hundred years, it has never used that power,
      but now it is inspecting houses across the province. {CHRONICLER} was taught by these
      same people. He recognises the handwriting of the registrar's teacher and knows
      exactly which four entries in nine hundred pages the registrar will examine. Outside,
      a clerk walks the horses between the yard and the trough. The clerks are in no hurry,
      but the house has almost no time to prepare.
  - address: "content:events/age_crusade.yaml#events[id=the_registrar_asks_for_the_book].interaction.choices[id=hand_it_over].label"
    of: "e388206906610625"
    plainenglish: >-
      Give him all nine hundred pages of the book. Let him read for as long as he wants.
  - address: "content:events/age_crusade.yaml#events[id=the_registrar_asks_for_the_book].interaction.choices[id=hand_it_over].outcomes[id=read_and_returned].text"
    of: "0afaae3de7282341"
    plainenglish: >-
      The registrar spends six days in the long room while a clerk turns the pages for him.
      On the sixth afternoon, he stops at the fourth of the four entries, reads it twice,
      and asks about a date that has no good explanation. The chronicler gives an answer
      that is true, but hesitates first. The registrar writes down both the answer and the
      pause. He thanks the house and takes nothing. His official minute says the entire book
      was handed over and read. One day, that record may protect the house more than its
      roof.
  - address: "content:events/age_crusade.yaml#events[id=the_registrar_asks_for_the_book].interaction.choices[id=send_a_copy].label"
    of: "bcbbcbf43d87ed90"
    plainenglish: >-
      Send only copies of the requested passages, made this week in the chronicler's own
      careful handwriting.
  - address: "content:events/age_crusade.yaml#events[id=the_registrar_asks_for_the_book].interaction.choices[id=send_a_copy].outcomes[id=copy_accepted].text"
    of: "b7430ebc1e4be168"
    plainenglish: >-
      The registrar accepts the copy because he trusts the handwriting, and rejecting it
      would force him to explain why he came. He leaves before noon. Everyone in the yard
      understands that the house has gained something, but nobody knows what the price will
      be.
