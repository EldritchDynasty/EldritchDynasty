    plainenglish: >-
      {SICK} has had a fever for three days, and the midwife has stopped saying her usual
      reassuring words. In this province, two children in three live to the age of five. This
      family has buried its share and knows the odds without anyone spelling them out. The
      doctor at Bramme will come for three crowns and a night's food and bed. He will bleed the
