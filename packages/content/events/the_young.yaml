# THE CHILDREN OF THE HOUSE (world §21, §23).
#
# COMMON, for the tier reasons at the top of village.yaml.
#
# Perhaps two in three reach five. Every family in this world has buried
# children and none of them find it acceptable; the flat way people speak of it
# is not indifference and is never written here as indifference.
#
# A child is not named for eleven days, and iron lies over the birthing-room
# door for the whole of them. Half the province thinks that is about illness
# and half thinks it is not, and both halves do it — which is the shape this
# file works in generally. Every scene here is a decision about a person who
# cannot yet be asked, made by people who will be dead before it pays out, and
# that is the game in miniature.
events:
  - id: the_iron_over_the_door
    title: Eleven Days of Iron
    tier: family
    frequency: common
    weight: 80
    tags: [birth, custom, church, signs]
    purposes: [establish_magic_rule, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      MOTHER:
        role: family_member
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 16 } }, { age: { op: lte, value: 44 } }]
    body: >-
      A ploughshare goes over the birthing-room door the hour the labour
      starts and stays there for eleven days, and half the Nethering will tell
      you it keeps out the damp air and half will not tell you anything at
      all. {MOTHER} is four days in and doing well. The keeper is up from Wick
      to see her and has stopped in the passage under the iron, looking at it,
      the way a man looks at a thing he has decided not to mention. He is a
      pleasant man on nine marks a year who has christened eleven of this
      family.
    interaction:
      kind: choice
      choices:
        - id: take_it_down
          label: Take it down while he is in the house.
          outcomes:
            - id: taken_down
              weight: 100
              text: >-
                It comes down in about four seconds and goes back up in about
                four more, after he has gone, and everybody who saw both
                understands the whole of it. He says nothing, blesses the
                child at eleven days, and enters it on the roll. The two maids
                who watched the share come down talk about it for a year.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_what_came_down_off_the_door, accuracy: 0.4 }
        - id: leave_the_iron
          label: Leave it. Every house in the province does this.
          outcomes:
            - id: left_up
              weight: 100
              tags: [self_expression]
              text: >-
                Every house in the province does do this, and he knows it, and
                he walks under it and does his office and takes his dinner and
                goes. What he does not do is ask, in a house where he has
                asked about everything else for nineteen years. That is the
                part worth noticing and nobody in the passage notices it.

  - id: two_in_three_reach_five
    title: The Third of Three
    tier: family
    frequency: common
    weight: 85
    tags: [child, medicine, money, hardship]
    purposes: [buy_patience, change_relationship, change_standing]
    slots:
      HEAD: { role: head }
      SICK:
        role: child
        filters: [{ status: [alive] }, { age: { op: gte, value: 2 } }, { age: { op: lte, value: 9 } }]
    body: >-
      {SICK} has had the fever three days and the midwife has stopped saying
      the thing she says. Two in three reach five in this province and this
      family has buried its share and knows the arithmetic without anybody
      having to lay it out. The physician at Bramme will come for three crowns
      and a night's board, will bleed, purge and poultice, and will be honest
      about which of the three he expects to do anything. The midwife thinks
      the room should be warm and quiet and that is all she thinks.
    interaction:
      kind: choice
      choices:
        - id: send_for_bramme
          label: Send for him. Three crowns is not a reason.
          outcomes:
            - id: he_comes
              weight: 55
              text: >-
                He comes in the dark, bleeds four ounces, leaves a poultice
                that smells of vinegar and something worse, and sits up the
                rest of the night with the mother, which is the part that
                turns out to matter. The fever breaks on the sixth day.
              effects:
                - { kind: treasury, delta: -4 }
                - { kind: relationship, from: household, to: head, sentiment: 8 }
              agreedPrices:
                - effect: 0
                  reason: contract
            - id: he_comes_too_late
              weight: 45
              tags: [hard]
              text: >-
                The road is what the road is in Frostfall and he is nine hours
                on it. He does everything correctly and charges for none of
                it, and stays for the eleven days of grey, which nobody asked
                him to do.
              effects:
                - { kind: status, target: { slot: SICK }, status: dead, cause: fever }
                - { kind: treasury, delta: -2 }
              agreedPrices:
                - effect: 1
                  reason: contract
              site:
                kind: hall
                hall:
                  slot: SICK
              primordial:
                id: he_comes_too_late_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} sits beside the fever bed. The water in the cup turns cold while the
                  child's hands grow warm. By morning there is breath enough to ask for a drink.
                effects:
                  - {kind: treasury, delta: -2}
                agreedPrices:
                  - effect: 0
                    reason: contract
                tags:
                  - hard
                  - primordial
                record: null
        - id: keep_the_room_warm
          label: Keep the room warm and quiet. The midwife has seen more of these.
          outcomes:
            - id: it_breaks
              weight: 55
              text: >-
                Four grates lit for one room, somebody awake in it every hour
                for five days, and on the fifth the fever goes the way fevers
                go, without anybody being able to say what did it. The midwife
                will not be thanked and says so before anybody tries.
              effects:
                - { kind: treasury, delta: -3 }
                - { kind: relationship, from: household, to: head, sentiment: 5 }
              agreedPrices:
                - effect: 0
                  reason: contract
            - id: it_does_not_break
              weight: 45
              tags: [hard]
              text: >-
                It does not break. Eleven days of grey, undyed wool, and the
                house cancels nothing because work is the mourning, and the
                place at the board is left until the next feast and then
                filled without comment. That is the moment the family knows.
              effects:
                - { kind: status, target: { slot: SICK }, status: dead, cause: fever }
                - { kind: respect, delta: -1 }
              site:
                kind: hall
                hall:
                  slot: SICK
              primordial:
                id: it_does_not_break_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} sits beside the fever bed. The water in the cup turns cold while the
                  child's hands grow warm. By morning there is breath enough to ask for a drink.
                effects:
                  - {kind: respect, delta: -1}
                tags:
                  - hard
                  - primordial
                record: null

  - id: the_fostering_offer
    title: A Ward, and What a Ward Is For
    tier: head
    frequency: common
    weight: 80
    tags: [marriage, kin, standing, rival]
    purposes: [buy_patience, change_relationship, plant_rumour]
    slots:
      HEAD: { role: head }
      DAUGHTER:
        role: family_member
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 7 } }, { age: { op: lte, value: 14 } }]
    body: >-
      A house at Cawdry with two hundred more acres and a seat on the Roll
      three lines above this one would take {DAUGHTER} as a ward until she is
      seventeen. It is normal, it is legal, it is how alliances are held
      together in this kingdom, and it puts a child of the blood in somebody
      else's hall for nine years. Their letter is warm and mentions her twice
      by name. It also mentions, in the last line, that their own physician is
      resident.
    interaction:
      kind: choice
      choices:
        - id: send_her
          label: Send her. Nine years, and a house three lines above us.
          outcomes:
            - id: fostered_out
              weight: 100
              text: >-
                She goes at Greening with two chests and a maid, and writes
                once a season in a hand that improves visibly across the first
                two years. The alliance holds for forty. Somebody in another
                county now watches a girl of this family grow up at close
                range, every day, for nine years, and writes their own letters.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_the_girl_at_cawdry, accuracy: 0.35 }
        - id: keep_her_home
          label: Keep her. There are things in this house nobody learns in nine years.
          outcomes:
            - id: kept
              weight: 100
              text: >-
                The refusal is written carefully enough to take three drafts
                and is understood at Cawdry inside a tenday as exactly what it
                is, which is a house declining to be looked at. The alliance
                does not form. She is at the Greening feast every year of her
                life and the household is better for it in ways nothing
                measures.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: relationship, from: { slot: DAUGHTER }, to: head, sentiment: 10 }

  - id: the_boy_who_will_not_read
    title: A Head Who Cannot Read
    tier: head
    frequency: common
    weight: 80
    tags: [study, tutor, standing, child]
    purposes: [change_relationship, change_standing, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      TUTOR: { role: tutor, filters: [{ status: [alive] }] }
      BOY:
        role: child
        filters: [{ sex: male }, { status: [alive] }, { age: { op: gte, value: 9 } }, { age: { op: lte, value: 15 } }]
    body: >-
      {TUTOR} has had {BOY} at the long room table for four years and the boy
      can sign his name and cannot read a lease. Nobody is illiterate at the
      top of this world and almost nobody is literate at the bottom, and a
      Head who cannot read is a scandal his grandchildren will still be
      explaining. The tutor says, carefully, that the boy is not stupid and is
      not going to learn this from him. He also says the boy can do sums in
      his head faster than the steward can do them on paper.
    interaction:
      kind: choice
      choices:
        - id: keep_him_at_it
          label: Keep him at the table until it takes.
          outcomes:
            - id: it_takes
              weight: 55
              text: >-
                Three more years, most of them ugly, and somewhere in the
                second one it comes loose all at once the way it does. He
                reads a lease at fifteen and reads it properly. He does not
                pick up a book for pleasure once in the rest of his life.
              effects:
                - { kind: attribute, target: { slot: BOY }, attr: mind, delta: 4 }
                - { kind: relationship, from: { slot: BOY }, to: head, sentiment: -9 }
            - id: it_does_not
              weight: 45
              text: >-
                Three more years, and at the end of them he can sign his name
                and cannot read a lease, and has learned in the meantime that
                he is the family's disappointment. That part he learns
                thoroughly. The tutor asks to be released at the end of his
                term and is not replaced for two years.
              effects:
                - { kind: relationship, from: { slot: BOY }, to: head, sentiment: -16 }
                - { kind: respect, delta: -1 }
        - id: put_him_to_the_counting
          label: Put him to the steward and the accounts instead.
          outcomes:
            - id: to_the_accounts
              weight: 100
              text: >-
                He is on the rent book at fourteen and has found two errors in
                it by Thaw, one of them nineteen years old and in the previous
                steward's hand. He still cannot read a lease. The house has a
                man who knows to the mite what it is owed and cannot be left
                alone with a document, and it will be a hundred years before
                anybody works out what that cost.
              effects:
                - { kind: attribute, target: { slot: BOY }, attr: mind, delta: 2 }
                - { kind: treasury, delta: 6 }
                - { kind: relationship, from: { slot: BOY }, to: head, sentiment: 9 }

  - id: the_nurse_from_wick
    title: Whose Milk
    tier: family
    frequency: common
    weight: 75
    tags: [birth, tenants, custom, health]
    purposes: [change_relationship, establish_magic_rule, test_magic_rule]
    slots:
      HEAD: { role: head }
      MOTHER:
        role: family_member
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 16 } }, { age: { op: lte, value: 44 } }]
    body: >-
      A house of this rank puts its children out to a nurse and there are two
      women in Wick with milk this spring, and the reeve has already worked
      out which of them the house should choose and has not been asked. The
      midwife says {MOTHER} should feed the child herself and gives a reason
      that is about the mother and not about the child. The house has done it
      both ways within living memory and cannot tell you which worked better.
      Nobody in this world has a number for anything of this kind.
    interaction:
      kind: choice
      choices:
        - id: put_it_out_to_nurse
          label: Out to nurse, as the house has always done.
          outcomes:
            - id: to_the_nurse
              weight: 100
              text: >-
                Two marks a year and a cottage half a mile downhill, and the
                child is at Wick until it is weaned and comes back knowing the
                nurse's face better than its mother's, which everybody expects
                and nobody enjoys. The nurse's own children are that child's
                first friends and stay so. There is a family in Wick that says
                milk-kin for four generations and means it.
              effects:
                - { kind: treasury, delta: -2 }
                - { kind: relationship, from: household, to: head, sentiment: 4 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: she_feeds_it
          label: She feeds it herself. The midwife has a reason.
          outcomes:
            - id: she_fed_it
              weight: 100
              text: >-
                It is unusual enough at this rank to be remarked on at Bramme
                and it is not remarked on unkindly. {MOTHER} does not conceive
                again for two years, which the midwife had also said and had
                not been asked about. The child is the healthiest thing in the
                hall for a decade.
              effects:
                - { kind: attribute, target: { slot: MOTHER }, attr: health, delta: 2 }
                - { kind: relationship, from: { slot: MOTHER }, to: head, sentiment: 9 }

  - id: the_children_of_wick
    title: Down the Hill and Back by Dark
    tier: head
    frequency: common
    weight: 80
    tags: [child, tenants, standing, custom]
    purposes: [change_relationship, change_standing, test_magic_rule]
    slots:
      HEAD: { role: head }
      CHILD:
        role: child
        filters: [{ status: [alive] }, { age: { op: gte, value: 6 } }, { age: { op: lte, value: 13 } }]
    body: >-
      {CHILD} is down at Wick most days that the tutor is not looking, in the
      lane and the mill yard and the shallows below the ford, with about nine
      children whose fathers pay this house rent. The steward thinks it is a
      scandal. The reeve thinks it is the best thing that has happened to
      relations between hall and village in forty years and is far too careful
      to say so. Somebody down there taught {CHILD} the counting rhyme, all
      nine names of it, in the wrong order.
    interaction:
      kind: choice
      choices:
        - id: stop_it
          label: Stop it. There is a difference and the child should learn it.
          outcomes:
            - id: stopped
              weight: 100
              text: >-
                It stops inside a tenday and the difference is learned
                thoroughly and permanently, which is what was asked for. Nine
                children in Wick understand by Thaw that they were being
                tolerated. Twenty years on, that child is Head and cannot get
                a straight answer out of anybody in that village.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: household, to: head, sentiment: -8 }
        - id: let_them_run
          label: Let them run. There are nine years of it and then there are none.
          outcomes:
            - id: let_run
              weight: 100
              text: >-
                Nine more years of the lane and the mill yard, and a child of
                this house who knows every family in Wick by their kitchen.
                What comes back up the hill with the child is the rhyme, four
                songs, and an unshakeable opinion about the miller. Two houses
                in the province mention it at Cawdry and one of them uses the
                word familiar.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: relationship, from: household, to: head, sentiment: 7 }

  - id: the_first_boar
    title: The Warden's Deer Are the Warden's
    tier: head
    frequency: common
    weight: 75
    tags: [violence, warden, standing, kin]
    purposes: [change_standing, force_record_choice, test_magic_rule]
    slots:
      HEAD: { role: head }
      SON:
        role: family_member
        filters: [{ sex: male }, { status: [alive] }, { age: { op: gte, value: 14 } }, { age: { op: lte, value: 19 } }]
    body: >-
      {SON} is old enough for his first proper hunt and there are two places
      to take him. Boar in the house's own wood is the house's, and is
      genuinely dangerous, and kills well-armed men on horses about once a
      generation in this province. The Warden's deer are the Warden's, they
      are four miles off across a boundary nobody has walked in years, and
      they are standing in the house's own oats at first light every morning
      this month.
    interaction:
      kind: choice
      choices:
        - id: the_boar_in_our_wood
          label: Boar, in our own wood, with the dogs and four men.
          outcomes:
            - id: the_boar
              weight: 62
              text: >-
                Two hours of standing in cold water up to the shins and then
                about eleven seconds of something the boy will describe badly
                for the rest of his life. He is blooded, the sow is on the
                board at Slaughter, and the province hears about it because
                the province always hears about a boar.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: attribute, target: { slot: SON }, attr: strength, delta: 2 }
            - id: it_goes_wrong
              weight: 38
              text: >-
                The dogs turn it and it comes back through the line at the one
                man who is not braced, which is the boy. The tusk goes in
                above the knee and out again and the thigh is open to the
                bone. He is carried out of that wood by four men and he is
                walking by Greening, badly.
              effects:
                - { kind: attribute, target: { slot: SON }, attr: agility, delta: -6 }
                - { kind: treasury, delta: -4 }
              site:
                kind: party
                slots:
                  - SON
              primordial:
                id: it_goes_wrong_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} is within the line when the boar turns. The broken spear holds
                  against nothing for one breath, and the boy is dragged clear. The torn gear and the
                  nursing still cost the house.
                effects:
                  - {kind: attribute, target: {slot: SON}, attr: agility, delta: -6}
                  - {kind: treasury, delta: -2}
                tags:
                  - primordial
                record: null
        - id: the_deer_in_our_oats
          label: The deer. They are eating our oats and the boundary is a rumour.
          outcomes:
            - id: took_a_deer
              weight: 100
              text: >-
                A clean shot at eighty yards on ground that is probably the
                house's and is certainly not clearly the Warden's, and a boy
                who has now taken his first deer and cannot be told about it
                at any table. The venison is eaten inside the hall. The hide
                is buried, which is the part that tells you what everybody
                thinks the position is.
              effects:
                - { kind: treasury, delta: 2 }
                - { kind: rumour, op: seed, id: rumour_whose_ground_the_boy_shot_on, accuracy: 0.45 }

  - id: the_lessons_stop_at_twelve
    title: What a Daughter Is Taught
    tier: head
    frequency: common
    weight: 80
    tags: [study, tutor, marriage, child]
    purposes: [change_relationship, establish_magic_rule, force_record_choice]
    slots:
      HEAD: { role: head }
      TUTOR: { role: tutor, filters: [{ status: [alive] }] }
      GIRL:
        role: child
        filters: [{ sex: female }, { status: [alive] }, { age: { op: gte, value: 11 } }, { age: { op: lte, value: 15 } }]
    body: >-
      Lessons stop at twelve for a daughter in this province and start again
      as household management, which is a real education and is not the same
      education. {TUTOR} would like to keep {GIRL} at the table for three more
      years and has come to say so with a folded sheet of her Old Ambric in
      his hand. Old Ambric is the Church's liturgy, the law's formulas and a
      physician's labels, and a woman who reads it can follow an inquest.
      Nobody has ever asked this house for a daughter who can follow an
      inquest.
    interaction:
      kind: choice
      choices:
        - id: keep_her_at_the_table
          label: Three more years. Let her have the language.
          outcomes:
            - id: kept_at_it
              weight: 100
              text: >-
                Four marks a year for three years and a girl of fifteen who
                can read a formula and tell you which of two clauses is the
                older. It is remarked on at Bramme in a tone the family cannot
                quite read. In 1123 there is an inquest, and she is forty, and
                she is the only person in the room on the house's side who
                understands what is being asked.
              effects:
                - { kind: treasury, delta: -6 }
                - { kind: attribute, target: { slot: GIRL }, attr: mind, delta: 5 }
                - { kind: relationship, from: { slot: GIRL }, to: head, sentiment: 12 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: household_management
          label: Household management, as it has always been.
          outcomes:
            - id: to_the_keys
              weight: 100
              text: >-
                The keys, the stores, the wage roll and the still-room, taught
                by the steward and by her mother, and she is running the
                indoor side of this house at nineteen better than the last
                three women to do it. That is not a small thing and this
                family has never once written it down. The tutor keeps the
                folded sheet and it is in the press at his death.
              effects:
                - { kind: attribute, target: { slot: GIRL }, attr: charm, delta: 3 }
                - { kind: treasury, delta: 3 }
                - { kind: relationship, from: { slot: TUTOR }, to: head, sentiment: -7 }

