# Nodes of arc_the_second_table.
#
# The bound COUSIN may be dead by the later beats. Inheriting to the eldest
# child is deliberate: the whole point is that a courteous slight becomes a
# family possession. If that line ends, the arc ends with it.
events:
  - id: second_table_the_toast_in_the_book
    title: The Toast, Copied Fair
    tier: family
    frequency: uncommon
    weight: 100
    tags: [cadet, family, records, arc]
    purposes: [change_relationship, plant_rumour, worldbuild_through_action]
    arc: { of: arc_the_second_table, node: the_copy }
    slots:
      HEAD: { role: head }
      COUSIN:
        role: cadet
        bind: arc
        onMissing: { inherit: eldest_child }
        filters: [{ status: [alive] }]
    body: >-
      The smaller house keeps a hall book because every house keeps one, even
      when the hall is four miles down a road nobody mends. A fair copy comes
      up before the next Greening, open at the page with last year's accounts,
      and underneath the figures somebody has copied the toast exactly. It is
      not written as a complaint. That is worse. A compliment can be inherited
      just as cleanly as land when everyone knows what it stood in place of.
    interaction:
      kind: narration
      outcomes:
        - id: copied
          weight: 100
          text: >-
            {COUSIN} does not ask for the page back. He lets {HEAD} read it,
            closes the book, and takes it home again. By winter three people at
            Wick can repeat the toast and none of them can repeat the accounts.
          effects:
            - { kind: branch, op: slight, slot: COUSIN, amount: 4 }
            - { kind: rumour, op: seed, id: rumour_the_toast_at_the_second_table, accuracy: 0.7 }

  - id: second_table_the_accounts_return
    title: The Accounts Come Back
    tier: family
    frequency: uncommon
    weight: 100
    tags: [cadet, family, money, arc]
    purposes: [change_relationship, change_standing, force_record_choice]
    arc: { of: arc_the_second_table, node: the_accounts_return }
    slots:
      HEAD: { role: head }
      COUSIN:
        role: cadet
        bind: arc
        onMissing: { inherit: eldest_child }
        filters: [{ status: [alive] }]
    body: >-
      The hand is different and the columns are not. The smaller house has sent
      up its accounts again, a generation after the first set, and whoever
      taught {COUSIN} to keep them taught the same neat habit of putting the
      answer at the foot twice. This time there is no gift and no feast. The
      book arrives by a boy on a wet morning with a note asking whether Ardwen
      has any use for what the smaller house has learned to do.
    interaction:
      kind: choice
      choices:
        - id: make_it_material
          label: Give the smaller house work worth having, and pay for it.
          outcomes:
            - id: work_given
              weight: 100
              text: >-
                The work is ordinary estate work and the payment is ordinary
                money, which is precisely why it helps. For the first time the
                main house has answered a useful thing with another useful
                thing. The old toast survives in the hall book, but it stops
                being the newest entry anyone points to.
              effects:
                - { kind: treasury, delta: -30 }
                - { kind: branch, op: appease, slot: COUSIN, amount: 24 }
        - id: praise_it_again
          label: Praise it again. Ardwen has its own officers.
          outcomes:
            - id: praised_again
              weight: 100
              text: >-
                The letter is warm, specific, and beautifully sealed. It is
                read aloud at the smaller table because courtesy deserves
                courtesy. Then it is put into the same hall book as the first
                toast, one page after the other, and the road between the two
                houses stays exactly four miles long.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: branch, op: slight, slot: COUSIN, amount: 18 }

  - id: second_table_the_road_between_them
    title: Four Miles of Bad Gravel
    tier: family
    frequency: uncommon
    weight: 100
    tags: [cadet, family, roads, arc]
    purposes: [change_relationship, force_record_choice, worldbuild_through_action]
    arc: { of: arc_the_second_table, node: the_road }
    slots:
      HEAD: { role: head }
      COUSIN:
        role: cadet
        bind: arc
        onMissing: { inherit: eldest_child }
        filters: [{ status: [alive] }]
    body: >-
      The road is still four miles and still bad. Three generations of the
      smaller house have ridden it for the two feasts, carrying gifts uphill
      and stories back down, and three generations at Ardwen have called the
      distance small because four miles is small on a map. This spring the
      bridge at the halfway brook goes out. {COUSIN} sends word that his hall
      will mend its half if Ardwen will mend the other.
    interaction:
      kind: choice
      choices:
        - id: meet_halfway
          label: Mend our half. Meet them at the brook and finish it together.
          outcomes:
            - id: road_mended
              weight: 100
              text: >-
                Eighteen crowns, two gangs, and six weeks of arguing about
                gravel. By Greening a cart can make the road without losing a
                wheel, which is a small material fact after a century of
                excellent words. The first cart up it carries no gift at all.
              effects:
                - { kind: treasury, delta: -18 }
                - { kind: branch, op: appease, slot: COUSIN, amount: 20 }
                - { kind: respect, delta: 1 }
        - id: their_road
          label: It serves their hall. Let them mend what they use.
          outcomes:
            - id: road_left
              weight: 100
              text: >-
                The smaller house mends to the brook and stops there. Ardwen's
                half stays rutted, and for the next feast the family comes up
                the good two miles and the bad two miles and arrives muddy
                enough that nobody has to mention which half belongs to whom.
              effects:
                - { kind: branch, op: slight, slot: COUSIN, amount: 10 }
    record:
      subject: what the second table was owed
      options:
        record:
          chronicle: >-
            The smaller house brought us good accounts and we answered first
            with praise. Their book kept the praise. It took generations
            before the road between the two halls became a thing we could no
            longer call a compliment.
          effects: []
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            The smaller house has always been honoured according to its place,
            and the road between the halls has always been kept by common
            agreement.
          effects:
            - { kind: respect, delta: 1 }
          discrepancy:
            id: the_second_table_was_always_honoured
            severity: major
            provableBy: [commons, house_marrow]
