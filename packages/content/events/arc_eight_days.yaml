  - address: "content:events/arc_eight_days.yaml#events[id=eight_days_two_hands].body"
    of: 612706e0af3d8c9c
    plainenglish: >-
      The second cellar is so cold that the glue becomes brittle. No one has fully emptied
      this box since it was packed. Beneath the leases, {FINDER} finds two half-sheets written
      by the founder. One is written more steadily than the other. Both describe the second
      obligation, but one says the house must "keep the third thing" and the other says it
      must "keep to the third thing". Eight days and one word separate them, and that word may
      change what the house must do.
  - address: "content:events/arc_eight_days.yaml#events[id=eight_days_two_hands].absentBody"
    of: 47baedb6e85a843a
    plainenglish: >-
      Someone finds two half-sheets under the leases in a box that has not been fully emptied
      since it was packed. Both are in the founder's handwriting, although one is steadier.
      One says the house must "keep the third thing". The other, written eight days later,
      says it must "keep to the third thing". The founder could have explained the difference,
      but has lain in the family's unused chapel for four hundred years.
