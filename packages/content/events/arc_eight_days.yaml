  - address: "content:events/arc_eight_days.yaml#events[id=eight_days_and_then_it_did].interaction.choices[id=change_the_practice].label"
    of: cf913de202c580be
    plainenglish: >-
      Change the house's practice tonight. Follow the other interpretation, and make the
      change public.
  - address: "content:events/arc_eight_days.yaml#events[id=eight_days_and_then_it_did].interaction.choices[id=change_the_practice].outcomes[id=changed].text"
    of: d4651f0c7fcc1bb0
    plainenglish: >-
      In one season, the house reverses a practice followed for four generations. It costs
      money and attracts enough attention to keep the province talking all winter. Three days
      later the dogs come back, hungry and behaving normally. The ink does not return. Nobody
      knows whether changing the practice was necessary, whether it helped, or whether the ink
      was connected to the disputed wording at all.
  - address: "content:events/arc_eight_days.yaml#events[id=eight_days_and_then_it_did].interaction.choices[id=hold_the_line].label"
    of: d5817338c5c77a2c
    plainenglish: >-
