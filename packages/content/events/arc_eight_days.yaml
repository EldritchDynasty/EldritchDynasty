    of: 3b8fafac2bfe99e0
    plainenglish: >-
      The house continues the practice it has followed for two hundred years. Nothing more
      happens that anyone can clearly identify. The dogs return, but the ink remains the same
      colour as the paper. Every new Head is shown the sheet on the day they receive the seal.
      Each hears the same explanation. In nine retellings, nobody has dared to change a word
      of it.
  - address: "content:events/arc_eight_days.yaml#events[id=eight_days_and_then_it_did].record.subject"
    of: aba893a79345e75b
    plainenglish: >-
      the afternoon when the ink became invisible
  - address: "content:events/arc_eight_days.yaml#events[id=eight_days_and_then_it_did].record.options.record.chronicle"
