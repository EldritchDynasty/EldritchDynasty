      The family puts both sheets back in the same box, with a newer note explaining that they
      disagree and no living person knows which is right. This is the most honest record the
      house has written in a century. It also ensures the disagreement can still be argued
      about four hundred years later.
  - address: "content:events/arc_eight_days.yaml#events[id=eight_days_which_one_we_keep].title"
    of: 09c6812767bc41f3
    plainenglish: >-
      Which Version Will the House Follow?
  - address: "content:events/arc_eight_days.yaml#events[id=eight_days_which_one_we_keep].body"
    of: 4b182777b75b7fcb
    plainenglish: >-
      The house hires an advocate from Cawdry who can read Old Ambric. He charges two marks a
      day and spends four days studying the two half-sheets. He tells {HEAD} that both
      interpretations are valid and could appear in a contract like this. If it were an
      ordinary lease, he would advise asking the other party what they meant. He says this
      carefully, knowing that advice cannot be followed. {HEAD} pays him and escorts him to
      the road. The family must decide which version it has obeyed for two hundred years. No
      one alive can tell them which is correct. The people in this room must make the choice.
  - address: "content:events/arc_eight_days.yaml#events[id=eight_days_which_one_we_keep].absentBody"
    of: f749937c7e489680
    plainenglish: >-
