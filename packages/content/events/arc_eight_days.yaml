    plainenglish: >-
      Then the Ink Changed
  - address: "content:events/arc_eight_days.yaml#events[id=eight_days_and_then_it_did].body"
    of: ab483550a89b5304
    plainenglish: >-
      On an ordinary autumn afternoon, the long room smells of wet ash, though nothing has
      burned there for three days. The dogs are outside. Nobody let them out, and no one can
      explain how they got there. They stand in the rain with their backs to the hall and
      refuse food or calls to come inside. On the table lies the inventory from Ingathering.
      The ink of the second obligation has become exactly the colour of the paper. It has not
