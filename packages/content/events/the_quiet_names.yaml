  - address: "content:events/the_quiet_names.yaml#events[id=the_counting_rhyme].title"
    of: "959e63268389e84a"
    plainenglish: >-
      The Rhyme Has the Names in the Wrong Order
  - address: "content:events/the_quiet_names.yaml#events[id=the_counting_rhyme].body"
    of: "e7c7b2b922d6618d"
    plainenglish: >-
      The counting rhyme lists all nine names in the wrong order, and for four hundred years it
      has got them wrong in the same way in every province. The Church would rather nobody put
      that fact down on a table. {TUTOR} has put it down on a table. He has the rhyme's order,
      the order the prayers use, and a third order from a book the house bought at Sarrow in a
      lot of eleven. The children of Wick are singing the third one.
  - address: "content:events/the_quiet_names.yaml#events[id=the_counting_rhyme].interaction.choices[id=burn_the_note].label"
    of: "1b74d1915c93bb6d"
    plainenglish: >-
      Burn the note and tell him to stick to teaching sums.
  - address: "content:events/the_quiet_names.yaml#events[id=the_counting_rhyme].interaction.choices[id=burn_the_note].outcomes[id=burned].text"
    of: "0a04191fe1a5efc3"
    plainenglish: >-
      It burns in four seconds in the long room's fireplace, and it is absolutely the right
      decision. He does not argue. He does not forget either, and a tutor who has been told to
      stop thinking about something has a long winter ahead of him.
  - address: "content:events/the_quiet_names.yaml#events[id=the_counting_rhyme].interaction.choices[id=keep_the_note].label"
    of: "e3946521e92a70dd"
    plainenglish: >-
      Keep it. Three orders on one sheet is worth having.
  - address: "content:events/the_quiet_names.yaml#events[id=the_counting_rhyme].interaction.choices[id=keep_the_note].outcomes[id=kept_the_sheet].text"
    of: "26a8f4cbc82aa6df"
    plainenglish: >-
      It goes into the cupboard between two rolled-up leases, where this house keeps things it
      will not admit to keeping. It is one sheet of paper, and it is proof of a contradiction in
      the prayers of the Church of the Nine Quiet Names. Nobody here knows yet what that is
      worth, or to whom.
  - address: "content:events/the_quiet_names.yaml#events[id=the_counting_rhyme].record.subject"
    of: "806f5ea7adb42b5b"
    plainenglish: >-
      the three different orders of the nine names
  - address: "content:events/the_quiet_names.yaml#events[id=the_counting_rhyme].record.options.record.chronicle"
    of: "cabb734e7b0e4a7a"
    plainenglish: >-
      The tutor wrote out three orders of the nine names on one sheet, from the rhyme, the
      prayers and a book from Sarrow, and no two of them matched.
  - address: "content:events/the_quiet_names.yaml#events[id=the_counting_rhyme].record.options.record.claims[0].text"
    of: "2c87327cd4796f98"
    plainenglish: >-
      wrote out three orders of the nine names and found that no two matched
  - address: "content:events/the_quiet_names.yaml#events[id=the_counting_rhyme].record.options.embellish.chronicle"
    of: "3e6feca641dc4c6a"
    plainenglish: >-
      The tutor wrote out the order of the nine names as the prayers give it, and the children
      of Wick were corrected.
  - address: "content:events/the_quiet_names.yaml#events[id=the_counting_rhyme].record.options.embellish.claims[0].text"
    of: "a4682a8c8227aeb0"
    plainenglish: >-
      wrote out the order of the nine names as the prayers give it
