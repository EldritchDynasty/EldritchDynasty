  - address: "content:events/the_quiet_names.yaml#events[id=the_keeper_asks_about_the_fourth_petition].body"
    of: "7d87468bea72015f"
    plainenglish: >-
      The parish priest at Wick is a pleasant man on nine marks a year who has buried four of
      this family and christened eleven. In Frostfall he comes up the hill, without any of the
      formality that usually goes with asking, to ask why {KIN} has been following the Old
      Ambric text of the Quieting prayer, and especially its fourth petition. Nobody in this
      parish follows that, because nobody in this parish can read. He is not accusing anyone. He
      has brought no book and no clerk. He wants to know who taught this household its prayers.
