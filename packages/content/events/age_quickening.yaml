      moved.
  - address: "content:events/age_quickening.yaml#events[id=the_millers_boy].title"
    of: 73c68a05a75a8c59
    plainenglish: >-
      The Story Told Over the Second Cup
  - address: "content:events/age_quickening.yaml#events[id=the_millers_boy].body"
    of: 5611c1cf3f4768db
    plainenglish: >-
      The alehouse at Wick goes quiet when {STEWARD} enters, something it has not
      done in thirty years. The miller's second boy is twelve, quick, and odd. He
      has told three people that he can hear the water in the mill race change
      before it does. The village has decided this is the old gift. From there,
      people connect the gift to the house, then to the miller's wife spending a
      season at Ardwen in the year the boy was conceived. The story has already
      been told twice over the second cup. The boy is probably just good at
      listening to a mill race, and his mother was at Ardwen because the house
      needed extra hands at the Ingathering. Those facts will not stop the story.
  - address: "content:events/age_quickening.yaml#events[id=the_millers_boy].interaction.choices[id=deny_it].label"
    of: dc22d975a0f27439
    plainenglish: >-
      Deny the story in the alehouse, in front of everyone.
  - address: "content:events/age_quickening.yaml#events[id=the_millers_boy].interaction.choices[id=deny_it].outcomes[id=denied].text"
    of: 374ecff424478420
    plainenglish: >-
      A public denial in the alehouse makes the story sound more believable. By
      the Greening, the tale includes the house denying it, which makes the story
      stronger.
  - address: "content:events/age_quickening.yaml#events[id=the_millers_boy].interaction.choices[id=let_it_run].label"
    of: bebfc23bb00bccf7
    plainenglish: >-
      Let it spread. Wick has made up worse stories.
  - address: "content:events/age_quickening.yaml#events[id=the_millers_boy].interaction.choices[id=let_it_run].outcomes[id=ran].text"
    of: 7b4671adb55543d9
    plainenglish: >-
      The story spreads. Four years later, someone who heard it arranges an
      apprenticeship for the boy at Bramme because they want whatever gift the
      story promised. He proves to be an unusually good miller.
