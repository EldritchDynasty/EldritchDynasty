  - address: "content:events/age_quickening.yaml#events[id=waking_early].body"
    of: 80cb888a0d159b1e
    plainenglish: >-
      The house notices the signs before anyone sees the cause. One dog refuses to
      enter the long room, then another. {CHILD} is nine. The midwife's
      grandmother said the iron turns dull first and the milk turns sweet later.
      The iron went dull on Tuesday, and the milk turned on Friday. Her rule is
      right about two times in three. Nine is an early age to wake. In an ordinary
      century, this happens once in a generation and the house talks about it for
      two generations. But this year the Colleges are turning applicants away, and
      every market town in Aubren has gained a warranted practitioner since
