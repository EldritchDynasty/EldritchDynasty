  - address: "content:events/age_quickening.yaml#events[id=the_price_of_books].title"
    of: e359f48f852b83f3
    plainenglish: >-
      A Book Sells for a Hundred and Ten at Cawdry
  - address: "content:events/age_quickening.yaml#events[id=the_price_of_books].body"
    of: 87ff6c447729b1b8
    plainenglish: >-
      The bookseller at Cawdry is crowded and busier than ever. A lesser working
      that sold for sixty crowns in spring is offered at a hundred and forty and
      sells for a hundred and ten. The books have not changed. Demand has risen
      because, during a Quickening, workings answer some readers they would not
      have answered before. A man who spent nine years on a book that never
      answered him may spend another sixty crowns to learn whether the book was
      the problem. The house owns a shelf of books but has no money set aside to
      buy more. Every book on that shelf is worth half again as much as before,
      and nobody is selling.
  - address: "content:events/age_quickening.yaml#events[id=the_price_of_books].interaction.outcomes[id=priced_out].text"
    of: 8af632da42141e96
    plainenglish: >-
      The house buys no books this year. Its books are worth more by year's end,
      so the house is wealthier on paper without gaining useful money.
  - address: "content:events/age_quickening.yaml#events[id=the_ladder_gets_crowded].title"
    of: 0d6fb955dca07939
    plainenglish: >-
      The Line Is Longer
  - address: "content:events/age_quickening.yaml#events[id=the_ladder_gets_crowded].body"
    of: 83bdaad29c4ebec6
    plainenglish: >-
      The counting house at Bramme is crowded with people who were not there five
      years ago, and half are buying books. House Ilm has sent two lamp-wrights
      through the Colleges and paid for a third. House Calder, which never cared
      about this before, has hired a stone-wright to survey every wall it owns and
      is telling the province about it. The Eldritch House still has the same
      inherited advantage. It does not improve when the rest of the world
      improves. It cannot be bought or taught, and it cannot be shown to a herald
      in a form the herald can record. Standing is relative: the house has not
      moved, but many more people now stand in the same line.
  - address: "content:events/age_quickening.yaml#events[id=the_ladder_gets_crowded].interaction.choices[id=buy_in].label"
    of: 5e230575e7962171
    plainenglish: >-
      Join in. Send someone to the Colleges.
  - address: "content:events/age_quickening.yaml#events[id=the_ladder_gets_crowded].interaction.choices[id=buy_in].outcomes[id=enrolled].text"
    of: 55c2d99a40146026
    plainenglish: >-
      After nine years at Corran and seven hundred miles of travel, the house gets
      back a competent lamp-wright and a young man who now says the family name
      the way people say it in Anvary.
  - address: "content:events/age_quickening.yaml#events[id=the_ladder_gets_crowded].interaction.choices[id=stand_pat].label"
    of: 1f407a3766c3bbab
    plainenglish: >-
      Hold position. This house's advantage is not on that ladder.
  - address: "content:events/age_quickening.yaml#events[id=the_ladder_gets_crowded].interaction.choices[id=stand_pat].outcomes[id=stood].text"
    of: 6318c871ddb548a5
    plainenglish: >-
      The house spends nothing and explains itself to nobody. The Roll is read
