# Two things that can be bought and later used on one person.
#
# Both are RARE: hard-capped, cooldown-gated, Record-bearing, named in the
# chronicle forever. Buying one is a decision about money; using it is a
# decision about a person, and the second one is the one that hurts.
events:
  - id: the_portion_of_agelessness
    title: A Portion of Agelessness
    tier: head
    frequency: rare
    weight: 105
    repeatable: false
    tags: [auction, heirloom, portion, agelessness]
    purposes: [change_standing, establish_magic_rule, force_record_choice]
    conditions:
      all:
        - { generation: { op: gte, value: 3 } }
        - { treasury: { op: gte, value: 260 } }
    slots:
      HEAD: { role: head }
    body: >-
      The woman who sells it will not call it agelessness and will not say what
      else to call it. Her shop is cold in a way the street outside is not. On
      the counter there is a bottle the size of a thumb, and a price beside it
      that would keep the house in bread for nine years, and she has already
      worked out that {HEAD} can pay. She does not mention what it takes from
      the one who drinks. She mentions that it has never failed.
    interaction:
      kind: choice
      choices:
        - id: buy
          label: Pay her, and take the bottle home unopened.
          outcomes:
            - id: bought
              weight: 100
              text: >-
                It sits in the east cellar for as long as the house can bear to
                leave it there. Every Head who comes after is told where it is
                on the day he takes the seal, and told, in the same breath, that
                his father managed without it.
              effects:
                - { kind: treasury, delta: -240 }
                - { kind: heirloom, op: grant, heirloom: portion_of_agelessness }
        - id: decline
          label: Leave it on the counter.
          outcomes:
            - id: left
              weight: 100
              text: >-
                She does not argue and does not lower the price. She is still
                there eleven years later, and the bottle is still on the
                counter, and the house has by then had two funerals it might
                have had one of.
              effects:
                - { kind: respect, delta: 1 }
    record:
      subject: the bottle in the east cellar
      options:
        record:
          chronicle: >-
            We bought forty years from a woman who would not name what she was
            selling, and we have not yet decided who is to have them.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: bought the bottle from a woman in the east }
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            A gift, from a grateful house in the east, in thanks for a kindness
            done quietly and never spoken of.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: 'received the bottle as a gift, unbought' }
          discrepancy:
            id: the_gift_that_was_bought
            severity: major
            provableBy: [house_marrow, the_church]
    rumour: { id: rumour_the_cold_shop, accuracy: 0.35, spread: 2 }
    accounts: [ballad_of_the_thumb_sized_bottle, church_inquest_minute_1604]

  - id: the_portion_of_fertility
    title: A Portion of Fertility
    tier: head
    frequency: rare
    weight: 105
    repeatable: false
    tags: [auction, heirloom, portion, fertility]
    purposes: [change_standing, test_magic_rule, force_record_choice]
    conditions:
      all:
        - { generation: { op: gte, value: 2 } }
        - { treasury: { op: gte, value: 180 } }
    slots:
      HEAD: { role: head }
    body: >-
      The seller is a man this time, and he is frightened in a way the last one
      was not. He keeps the flask inside his coat through the whole of the
      talking and will not put it in {HEAD}'s hand until the coin is counted
      twice. Three doses, he says. Sixty years between them or it turns, and he
      says that part twice and explains it neither time. Outside, the dogs have
      gone quiet.
    interaction:
      kind: choice
      choices:
        - id: buy
          label: Count the coin twice, and take the flask.
          outcomes:
            - id: bought
              weight: 100
              text: >-
                He is gone before the money is put away. The flask holds three
                and the house will not live long enough to want fewer, which is
                the part nobody says aloud in the room where it is stored.
              effects:
                - { kind: treasury, delta: -170 }
                - { kind: heirloom, op: grant, heirloom: portion_of_fertility }
        - id: refuse
          label: Send him away. A house that buys this is a house that needs it.
          outcomes:
            - id: refused
              weight: 100
              text: >-
                He goes without arguing, which is worse, because a man who
                argues is a man who thinks you might be wrong. The steward
                closes the door and stands with his hand on it a while longer
                than closing a door takes.
              effects:
                - { kind: respect, delta: 1 }
    record:
      subject: the flask, and why it was bought
      options:
        record:
          chronicle: >-
            The line was thin and we knew it, and we bought three chances from
            a frightened man in the road.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: bought three chances from a frightened man in the road }
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            A physician of some standing attended the house that year, and the
            house was the healthier for it.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: 'engaged a physician of standing, rather than bought the flask' }
          discrepancy:
            id: the_physician_who_was_not
            severity: minor
            provableBy: [house_ilm]
    rumour: { id: rumour_three_doses, accuracy: 0.3, spread: 2 }
    accounts: [ballad_of_the_thumb_sized_bottle, a_scholars_footnote]

  - id: the_unmirrored_eye_offered
    title: The Unmirrored Eye
    tier: head
    frequency: rare
    # 260, up from 50, and the argument is `the_drowning`'s: what rations this
    # is its CONDITION and the fact that it fires ONCE EVER, not the tier. At
    # 50 it carried the lowest draw weight in an ambient rare pool that has
    # grown from nine templates to fifty-nine, and it went to zero across the
    # sixty-seed coverage batch — a non-repeatable template that loses the
    # draw is a template most runs never see at all, and there is no second
    # chance built into it the way there is for the rest of the tier.
    weight: 260
    repeatable: false
    tags: [auction, heirloom, eldritch, madness]
    purposes: [establish_magic_rule, force_record_choice, worldbuild_through_action]
    conditions:
      all:
        - { generation: { op: gte, value: 3 } }
        - { treasury: { op: gte, value: 380 } }
    slots:
      HEAD: { role: head, filters: [{ canExpress: true }] }
    body: >-
      The dealer will not say where it came from and {HEAD} does not ask twice.
      It is not a book and it is not a bottle. It is heavier than its size
      argues for, and it is priced like something the seller wants gone rather
      than something he wants to keep. Every account of it agrees on one thing:
      it works on nobody who could not have gone that way regardless.
    interaction:
      kind: choice
      choices:
        - id: buy
          label: Pay the asking price, and take it home wrapped.
          outcomes:
            - id: bought
              weight: 100
              text: >-
                It goes into the same cellar as everything else the house does
                not discuss at table. {HEAD} tells nobody where, and the house
                finds it anyway, the way a house always finds the one door it
                was told not to open.
              effects:
                - { kind: treasury, delta: -380 }
                - { kind: heirloom, op: grant, heirloom: the_unmirrored_eye }
        - id: decline
          label: Leave it on the dealer's table.
          outcomes:
            - id: left
              weight: 100
              text: >-
                He does not lower the price and does not seem surprised. It is
                still on his table a decade later, priced exactly the same,
                waiting for a house less careful than this one.
              effects:
                - { kind: respect, delta: 1 }
    record:
      subject: what was bought that year
      options:
        record:
          chronicle: >-
            We bought something we cannot describe, from a man we did not ask
            the name of, and we have used it since.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: bought the thing from a man whose name the house did not ask }
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            A relic of the house's own founding was recovered that year, and
            restored to where it belonged.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: recovered a relic of the house's own founding }
          discrepancy:
            id: the_relic_that_was_bought
            severity: major
            provableBy: [house_marrow, the_church]
    rumour: { id: rumour_the_dealers_table, accuracy: 0.25, spread: 2 }
    accounts: [ballad_of_the_thumb_sized_bottle, church_inquest_minute_1604]

