# THE HOUSE AT EXTREMITY.
#
# RARE. Ardwen is a fortified house and not a castle: a walled yard, a
# gatehouse nobody has shut in ninety years, a hall block with two wings,
# seven grates, two cellars, a chapel the family does not use, and 1,400
# acres. Everything in this file is that description being tested.
#
# These are the scenes a run is remembered by. A fire, a flood, a shut gate, a
# called debt, a seal that is not where it should be — each of them is a thing
# that happens to a building and lands on a bloodline, and each of them
# produces a document somebody else keeps. The house survives all of them,
# usually. What it does not survive is having written down the wrong version
# in the week, and then being asked about it at the term.
events:
  - id: the_hall_burns
    title: The West Wing Goes Up in Longnight
    tier: family
    frequency: rare
    weight: 135
    tags: [hall, hardship, library, money]
    purposes: [change_relationship, change_standing, force_record_choice]
    slots:
      HEAD: { role: head }
      KIN:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 12 } }, { relation: not, of: HEAD }]
    body: >-
      It starts in a grate in the west wing at about three in the morning of a
      night with a north wind on it, and by the time anybody is awake the
      whole upper floor is going. Nineteen people get out of this house in
      their shifts into a yard with frost on it. The wing holds the presses,
      the fourth shelf and both cellars' stair, and it is the wing whose roof
      has been an argument since 1090. {KIN} is the one who goes back in.
    interaction:
      kind: choice
      choices:
        - id: save_the_press
          label: The press. Everything this family is, is in that press.
          outcomes:
            - id: the_press_out
              weight: 58
              text: >-
                Four trips, and the lease rolls, the muniments and the
                collation book come out into the frost in a wheelbarrow, and
                {KIN} comes out with the last of it with his hair gone on one
                side and his hands ruined for a year. The wing is a shell by
                dawn. Every document this family holds is in a barrow in the
                yard and nine people saw exactly what was worth going back for.
              effects:
                - { kind: treasury, delta: -160 }
                - { kind: attribute, target: { slot: KIN }, attr: health, delta: -8 }
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_what_they_carried_out_first, accuracy: 0.6 }
            - id: the_press_and_the_stair
              weight: 42
              text: >-
                Three trips and then the stair goes, and what is out is the
                lease rolls and half the muniments, and what is not out is
                everything on the fourth shelf and the older half of the
                descent. {KIN} is pulled out of the yard door by two men who
                will not discuss it afterwards with anybody, ever.
              effects:
                - { kind: treasury, delta: -160 }
                - { kind: attribute, target: { slot: KIN }, attr: health, delta: -14 }
        - id: get_everyone_out
          label: People. Count them in the yard and let the wing go.
          outcomes:
            - id: nineteen_in_the_yard
              weight: 100
              text: >-
                Nineteen counted twice in the frost and nobody goes back in
                for anything, which is the correct decision and is made in
                about four seconds by a person who will be asked about it for
                thirty years. The wing burns to the courses. What is in the
                press is ash, and what this family can prove about itself
                after that night is whatever the Church and the heralds happen
                to hold.
              effects:
                - { kind: treasury, delta: -160 }
                - { kind: respect, delta: -1 }
    record:
      subject: the fire, and what came out of it
      options:
        record:
          chronicle: >-
            The west wing burned in Longnight and nineteen of us stood in the
            yard and counted, and nobody went back in, and the press went with
            the wing.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: KIN }, text: stood in the yard while the west wing and the muniment press burned }
        omit:
          chronicle: null
        embellish:
          chronicle: The west wing burned in Longnight and the muniments of this house were brought out entire, with the loss of no life and no document.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: KIN }, text: brought the muniments of the house out of the fire entire }
          discrepancy:
            id: what_came_out_of_the_fire
            severity: total
            provableBy: [the_church, house_calder, house_ilm]
    rumour: { id: rumour_the_night_the_west_wing_went, accuracy: 0.6, spread: 3 }
    accounts: [the_wick_account_of_the_fire, the_stewards_inventory_after]

  - id: the_branches_combine
    title: Three Halls, One Letter
    tier: head
    frequency: rare
    weight: 125
    tags: [cadets, standing, kin, law]
    purposes: [advance_clause, change_relationship, change_standing]
    slots:
      HEAD: { role: head }
      CADET: { role: cadet, filters: [{ status: [alive] }, { age: { op: gte, value: 25 } }] }
    body: >-
      A branch four generations old is a neighbour with a grievance and a
      claim, and three of them have now put their names to one letter, which
      has not happened in the history of this family. It is courteous, it is
      drafted by an advocate, and it asks for a thing the main house has never
      given: a standing voice at the table and a share of the relief. {CADET}
      carried it up the hill himself. The seal on it is the smaller house's,
      and under it are two seals this family does not have impressions of.
    interaction:
      kind: choice
      choices:
        - id: give_them_the_table
          label: Give them the table. Three halls at every Slaughter, with a voice.
          outcomes:
            - id: seated
              weight: 100
              text: >-
                It is agreed in writing, which nobody expected, and three
                cadet heads sit at the Slaughter board from that year with a
                voice on the relief and on the marriages. The house is
                stronger by every measure the province uses and slower by
                every measure the house uses. Nothing this family decides
                after that year is decided by fewer than four people.
              effects:
                - { kind: branch, op: appease, amount: 40 }
                - { kind: respect, delta: 2 }
                - { kind: treasury, delta: -45 }
        - id: refuse_the_three
          label: Refuse. The seal does not divide and never has.
          outcomes:
            - id: refused_three
              weight: 55
              text: >-
                A refusal in four lines, and three halls that go home and do
                not write again, and eleven years in which nothing whatever
                happens. In the twelfth the smallest of the three marries into
                a house at Cawdry and takes the grievance with it as a dowry,
                which is a thing a grievance can be.
              effects:
                - { kind: branch, op: slight, amount: 30 }
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: { slot: CADET }, to: head, sentiment: -22 }
            - id: they_go_to_law
              weight: 45
              text: >-
                A refusal in four lines, and an action at the Warden's assize
                inside two years on the clause about relief, brought by three
                halls with one advocate between them. It is heard for four
                days at Cawdry with this family's arrangements read out in
                public, and the finding is for the main house on every point.
                Everything read out in those four days is in the province's
                record.
              effects:
                - { kind: branch, op: slight, amount: 30 }
                - { kind: treasury, delta: -55 }
    record:
      subject: the letter the three halls signed
      options:
        record:
          chronicle: >-
            Three of our own halls signed one letter asking for a voice and a
            share, which has not happened before, and we refused it, and they
            went to the assize.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: refused the three cadet halls' letter asking for a voice and a share }
        omit:
          chronicle: null
        embellish:
          chronicle: The cadet halls of this family addressed the main house on a question of relief and were answered to their satisfaction within the year.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: answered the cadet halls to their satisfaction }
          discrepancy:
            id: whether_the_halls_were_satisfied
            severity: major
            provableBy: [house_calder, commons]
    rumour: { id: rumour_three_seals_on_one_letter, accuracy: 0.5, spread: 3 }
    accounts: [the_three_halls_own_draft, the_assize_record_of_the_four_days]

  - id: the_pit_on_our_own_ground
    title: They Want the Pit on Our Ground
    tier: head
    frequency: rare
    weight: 125
    tags: [plague, tenants, church, hardship]
    purposes: [buy_patience, change_relationship, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      The churchyard at Wick took eleven in the first tenday and is full, and
      the ground the parish wants next is the house's own upper close, which
      is dry, high, out of the water and half a mile from anybody's door. The
      Bearers are already at Wick and will do the work for bread. Giving the
      ground means a pit of the parish's dead on this family's land forever
      and a line about it in a Church register. Refusing means the pit goes in
      the low meadow by the Wend, which everybody in the parish drinks from.
    interaction:
      kind: choice
      choices:
        - id: give_the_upper_close
          label: Give the upper close. It is dry ground and it is ours to give.
          outcomes:
            - id: the_close_given
              weight: 100
              text: >-
                Two acres given to the parish in perpetuity, entered in the
                Church's register with this family's name on it in the year of
                the plague, and a pit that takes ninety-four before it is
                closed. Nobody at Wick has ever forgotten it. Neither has the
                Church, which now holds two acres inside this family's land
                and a document saying why.
              effects:
                - { kind: respect, delta: 2 }
                - { kind: relationship, from: household, to: head, sentiment: 20 }
                - { kind: discrepancy, op: create, id: the_two_acres_in_perpetuity, severity: minor, provableBy: [the_church, commons] }
        - id: refuse_the_ground
          label: Refuse. It is the only dry close on this side of the river.
          outcomes:
            - id: the_low_meadow
              weight: 62
              text: >-
                The pit goes in the low meadow, ninety-four into ground that
                is two feet above the summer water, and the Wend is what this
                parish drinks. The following Highsun is the worst year for
                flux anybody at Wick can remember. Nobody ever proves the two
                are connected and nobody in this parish has ever needed to.
              effects:
                - { kind: respect, delta: -2 }
                - { kind: relationship, from: household, to: head, sentiment: -24 }
                - { kind: rumour, op: seed, id: rumour_the_pit_in_the_low_meadow, accuracy: 0.7 }
            - id: the_church_takes_it_anyway
              weight: 38
              text: >-
                The archdeacon takes the close under a form of words about
                necessity that has been in the canon for six hundred years and
                has been used four times in that province, and the two acres
                are consecrated on a Thursday whether or not anybody agrees.
                The house is not compensated. The house is entered in the
                register as having refused.
              effects:
                - { kind: respect, delta: -2 }
    record:
      subject: where the pit went
      options:
        record:
          chronicle: >-
            The churchyard filled and the parish asked for our upper close and
            we refused it, and ninety-four went into the low meadow above the
            summer water, and the flux the following Highsun was the worst
            anyone remembers.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: refused the parish the upper close and put ninety-four dead into the low meadow }
        omit:
          chronicle: null
        embellish:
          chronicle: The churchyard at Wick filled and this house gave two acres of its own dry ground to the parish in perpetuity, and the pit was closed there.
          effects:
            - { kind: respect, delta: 2 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: gave two acres of dry ground to the parish in perpetuity }
          discrepancy:
            id: whose_ground_the_pit_went_into
            severity: total
            provableBy: [the_church, commons, house_calder]
    rumour: { id: rumour_ninety_four_in_the_meadow, accuracy: 0.65, spread: 3 }
    accounts: [the_bearers_count, the_parish_register_of_the_plague_year]

  - id: the_steward_of_nineteen_years
    title: Nineteen Years, and a Second Book
    tier: head
    frequency: rare
    weight: 125
    tags: [retainers, records, money, secrecy]
    purposes: [change_relationship, force_record_choice, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      STEWARD: { role: retainer, filters: [{ status: [alive] }, { age: { op: gte, value: 35 } }] }
    body: >-
      {STEWARD} has kept this house's book for nineteen years on six marks a
      year and board, and is not being robbed and is being taken for granted,
      which is a different and worse thing. What has come to light is a second
      book, in his own hand, kept in his own room, going back to his first
      year. It is not a fraud. Every figure in it agrees with the house's own
      to the mite, and beside about four hundred of them there is a note of
      what was said in the room when the entry was made.
    interaction:
      kind: choice
      choices:
        - id: buy_the_second_book
          label: Buy it off him, and raise him, and say why.
          outcomes:
            - id: bought_the_book
              weight: 100
              text: >-
                Twelve marks a year from Thaw, an apology that costs a Head
                more than the money, and a book that comes across the table
                and goes into the press. Four hundred notes of what was said
                in this hall over nineteen years, by people who are mostly
                dead. It is the best document this family owns and it was
                nearly the worst.
              effects:
                - { kind: treasury, delta: -12 }
                - { kind: relationship, from: { slot: STEWARD }, to: head, sentiment: 26 }
        - id: dismiss_him
          label: Dismiss him. A man who keeps a second book has a second employer somewhere.
          outcomes:
            - id: dismissed
              weight: 55
              text: >-
                Released at Thaw with a character he is entitled to and a
                quarter's wages, and he goes to Bramme and is in a
                counting-house within a season and never says one word about
                this family to anybody. The book goes with him because it is
                his. It is in a Bramme attic in 1500 and somebody finds it.
              effects:
                - { kind: respect, delta: -1 }
            - id: dismissed_and_sells_it
              weight: 45
              text: >-
                Released at Thaw, and a man of fifty-four with nineteen years
                of somebody else's household in his own hand and no pension,
                and a house at Cawdry that has wanted exactly that for two
                generations and pays eighty crowns for it inside the year.
                Nothing in the book is false. That is the entire problem.
              effects:
                - { kind: respect, delta: -2 }
    record:
      subject: the steward's second book
      options:
        record:
          chronicle: >-
            The steward kept a second book for nineteen years agreeing with
            ours to the mite, with four hundred notes of what was said in the
            room, and we bought it and raised him.
          effects: []
          claims:
            - { kind: deed, target: { slot: STEWARD }, text: kept a second book for nineteen years with four hundred notes of what was said in the room }
        omit:
          chronicle: null
        embellish:
          chronicle: The steward was released at Thaw after nineteen years with a character and a quarter's wages, in the ordinary course, no fault being found.
          effects: []
          claims:
            - { kind: deed, target: { slot: STEWARD }, text: was released in the ordinary course with no fault found }
          discrepancy:
            id: why_the_steward_left
            severity: major
            provableBy: [house_bracc, commons]
    rumour: { id: rumour_the_book_in_the_stewards_room, accuracy: 0.45, spread: 2 }
    accounts: [the_stewards_second_book_itself, what_bramme_said_when_he_arrived]

  - id: what_the_flood_brings_up
    title: The Wend Comes Over the Low Ground
    tier: head
    frequency: rare
    weight: 120
    tags: [hardship, tenants, records, secrecy]
    purposes: [establish_magic_rule, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      Six tendays of rain and then a thaw on top of it, and the Wend comes
      over the low ground for the first time since 1104 and takes four
      cottages, the mill race and the bottom of the orchard. When it goes down
      it has scoured two feet off the corner of the old orchard where nothing
      has been planted in anybody's memory. There are bones in it. There are a
      great many bones in it, in rows, without coffins, and none of them is on
      any roll at Wick.
    interaction:
      kind: choice
      choices:
        - id: send_for_the_keeper
          label: Send for the keeper. Whoever they are, they should be entered.
          outcomes:
            - id: entered
              weight: 55
              text: >-
                The keeper comes, counts thirty-one, and enters them as
                unknown of unknown date, which is a form he has used twice in
                his life and which exists precisely for this. They are
                reburied at Wick at this family's cost. Somebody at Cawdry
                reads that entry in 1319 and writes to ask what a landed
                house's orchard was doing with thirty-one unrolled dead in it.
              effects:
                - { kind: treasury, delta: -18 }
                - { kind: respect, delta: 1 }
            - id: he_dates_them
              weight: 45
              text: >-
                The keeper counts thirty-one and then, because he is a careful
                man with a bad habit, looks at the ground rather than the
                bones, and says that the rows are cut and regular and that
                whoever put them there did it in one season and knew what they
                were doing. He writes that down too. He is not accusing
                anybody of anything and he has written it down.
              effects:
                - { kind: treasury, delta: -18 }
        - id: put_the_ground_back
          label: Put the ground back before anybody else walks down there.
          outcomes:
            - id: ground_put_back
              weight: 100
              text: >-
                Four men of this household, two days, and two feet of soil
                carted back onto a corner of an orchard in weather nobody
                should be working in, and it is done before the water is off
                the low meadow. Four men know. Four men have families. The
                orchard is planted the following Greening for the first time
                in anybody's memory, which everybody at Wick notices.
              effects:
                - { kind: treasury, delta: -6 }
                - { kind: rumour, op: seed, id: rumour_why_they_planted_the_orchard, accuracy: 0.5 }
    record:
      subject: what came up in the orchard
      options:
        record:
          chronicle: >-
            The Wend came over and scoured the orchard corner and there are
            thirty-one in rows down there, cut and regular, on no roll, and we
            had the keeper enter them.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: had thirty-one unlisted graves entered after the Wend uncovered them in the orchard }
        omit:
          chronicle: null
        embellish:
          chronicle: The Wend came over the low ground and took four cottages and the mill race, and the damage was made good by Greening at the house's cost.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: made good the flood damage by Greening at the house's cost }
          discrepancy:
            id: what_the_flood_uncovered
            severity: total
            provableBy: [the_church, commons, house_calder]
    rumour: { id: rumour_the_corner_of_the_orchard, accuracy: 0.55, spread: 3 }
    accounts: [the_keepers_form_for_unknown_dead, what_the_four_men_told_their_wives]

  - id: the_seal_is_not_in_the_box
    title: The Box Is Where It Always Is
    tier: head
    frequency: rare
    weight: 130
    tags: [regalia, heirloom, secrecy, succession]
    purposes: [advance_clause, force_record_choice, test_magic_rule]
    slots:
      HEAD: { role: head }
      KIN:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 16 } }, { relation: not, of: HEAD }]
    body: >-
      The box is under the leases where it has been since before anybody now
      living was born, and it is locked, and the lock has not been forced, and
      the seal is not in it. Nothing else in the press has been touched. Four
      people in this house have ever had the key and two of them are dead.
      {KIN} is the one who opened the box, in front of two witnesses, for an
      entirely routine reason, which is the only fact in this whole business
      that anybody can be certain of.
    interaction:
      kind: choice
      choices:
        - id: search_the_household
          label: Search. Every room, every person, starting now, in front of everyone.
          outcomes:
            - id: found_in_the_house
              weight: 45
              text: >-
                Eleven hours, every room and every chest including the Head's,
                and it is in the chapel, in the stone recess behind the altar,
                wrapped in a piece of the same wool the household wears.
                Nobody has any explanation. Nobody is ever going to have one.
                Fourteen people watched this house search itself.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: relationship, from: household, to: head, sentiment: -20 }
            - id: not_found
              weight: 55
              text: >-
                Eleven hours, every room, every chest, every person, and
                nothing, and a household of fourteen that has now been
                searched by its own family and knows what it is suspected of.
                The seal is not in this house. Four people had the key. Two of
                them are dead and the other two are in the room.
              effects:
                - { kind: respect, delta: -2 }
                - { kind: relationship, from: household, to: head, sentiment: -30 }
        - id: say_nothing_and_look
          label: Say nothing. Lock the press and look for it quietly.
          outcomes:
            - id: quietly
              weight: 100
              text: >-
                Two people know and neither of them writes anything down, and
                the looking goes on for four years and does not find it, and
                in those four years the seal is required twice and is not
                produced twice, on excuses that are perfectly adequate the
                first time. The house is now conducting its own affairs
                without the instrument its whole standing rests on, and only
                two people in the world know that.
              effects:
                - { kind: knowledge, op: grant, flag: knows_the_seal_is_gone }
                - { kind: schedule, event: the_business_without_the_seal, inYears: 1 }
    record:
      subject: the seal, and where it is
      options:
        record:
          chronicle: >-
            The box was opened for a routine reason in front of two witnesses
            and the seal was not in it, and it has not been found, and the
            lock had not been forced.
          grantsKnowledge: knows_the_seal_is_gone
          effects:
            - { kind: respect, delta: -2 }
            - { kind: schedule, event: the_business_without_the_seal, inYears: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: opened the regalia box before two witnesses and found the Seal missing }
        omit:
          chronicle: null
        embellish:
          chronicle: The regalia of this house was viewed in the ordinary course and found complete and in good order, as it has been at every viewing.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: viewed the regalia in the ordinary course and found it complete }
          discrepancy:
            id: whether_the_seal_was_in_the_box
            severity: total
            provableBy: [house_marrow, house_calder, the_church]
    rumour: { id: rumour_what_is_not_under_the_leases, accuracy: 0.35, spread: 3 }
    accounts: [the_two_witnesses_at_the_press, what_the_household_says_about_the_search]

  - id: the_gate_is_shut_for_a_month
    title: Ninety Years, and Then It Is Shut
    tier: family
    frequency: rare
    weight: 120
    tags: [hardship, tenants, violence, hall]
    purposes: [buy_patience, change_relationship, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      Nobody has shut the gates at Ardwen in ninety years and the hinges have
      grown a shape, and they are shut on the fourth night of Slaughter with
      four men leaning on them because there is no writ running in this
      province and there are two hundred men on the Cawdry road. Inside are
      fourteen of the household and, by the second night, sixty of Wick and
      whatever they could drive. The stores are for fourteen. The gate holds
      or it does not, and the arithmetic inside is the harder of the two
      problems.
    interaction:
      kind: choice
      choices:
        - id: feed_them_all
          label: Feed them all, on the same ration, for as long as it lasts.
          outcomes:
            - id: all_fed
              weight: 100
              text: >-
                Twenty-eight days of everybody in this yard eating the same
                thing off the same board, which has never happened at Ardwen
                and does not happen again, and stores that were laid in for
                fourteen and are gone by the twentieth day. The road clears in
                the fifth tenday. What Wick remembers about this family for
                four hundred years is decided in those twenty-eight days.
              effects:
                - { kind: treasury, delta: -110 }
                - { kind: respect, delta: 2 }
                - { kind: relationship, from: household, to: head, sentiment: 30 }
        - id: ration_by_household
          label: Ration by household. Ours first, and say so plainly.
          outcomes:
            - id: rationed
              weight: 55
              text: >-
                Said plainly on the third morning, in the yard, which is at
                least honest, and sixty people at Wick's ration and fourteen
                at the house's for twenty-eight days in the same enclosure.
                Nobody starves. Everybody counts. The road clears in the fifth
                tenday and the yard empties in an afternoon without one word
                of thanks from anybody.
              effects:
                - { kind: treasury, delta: -50 }
                - { kind: relationship, from: household, to: head, sentiment: -18 }
                - { kind: rumour, op: seed, id: rumour_the_two_rations_in_one_yard, accuracy: 0.65 }
            - id: they_go_over_the_wall
              weight: 45
              text: >-
                Said plainly on the third morning, and on the ninth night
                about forty of them go back over the wall to their own
                cottages, on their own decision, in the dark, with two hundred
                men on the road. Eleven of the forty do not come back. The
                gate is opened on the fifth tenday onto a village that has
                made up its mind about something.
              effects:
                - { kind: treasury, delta: -50 }
                - { kind: respect, delta: -2 }
                - { kind: relationship, from: household, to: head, sentiment: -30 }
    record:
      subject: the month the gate was shut
      options:
        record:
          chronicle: >-
            The gate was shut for twenty-eight days and sixty of Wick were
            inside it, and we rationed by household and said so, and on the
            ninth night forty of them went back over the wall.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: rationed sixty people of Wick by household during the twenty-eight days the gate was shut }
        omit:
          chronicle: null
        embellish:
          chronicle: The gate was shut for twenty-eight days and the whole parish was fed within it on the house's own stores, at the same board and the same ration.
          effects:
            - { kind: respect, delta: 2 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: fed the whole parish at the same board and the same ration }
          discrepancy:
            id: how_the_yard_was_fed
            severity: total
            provableBy: [commons, house_calder]
    rumour: { id: rumour_what_happened_inside_the_wall, accuracy: 0.55, spread: 3 }
    accounts: [what_the_sixty_of_wick_remember, the_household_ration_book]

  - id: the_letter_of_credit_called
    title: Bracc Would Like Its Money
    tier: head
    frequency: rare
    weight: 120
    tags: [money, bracc, records, hardship]
    purposes: [advance_clause, change_standing, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      Cross-border payment moves by letter of credit drawn on a Braccish
      house, at two per cent and a month's delay, and this family has been
      drawing on one for nineteen years for the Corran fees and the book
      orders. The weigher's factor comes up from Cawdry in Thaw with the whole
      account on four sheets and a request, courteously phrased, for the
      balance. It is two hundred and thirty crowns. He swears on the weight
      rather than in a Church court, which is why nobody has ever been able to
      argue with one of these in front of a keeper.
    interaction:
      kind: choice
      choices:
        - id: pay_it_whole
          label: Pay it whole, this Thaw, and be a house that pays.
          outcomes:
            - id: paid_whole
              weight: 100
              text: >-
                Two hundred and thirty crowns, which is four years of
                everything, counted out in the long room against a receipt in
                Braccan and Ambric, and a family that eats very plainly until
                1216. The Braccish do not forget it either. The rate this
                house is offered for the next hundred and forty years is a
                quarter point under what its neighbours pay, and no Braccish
                factor has ever explained why to anybody.
              effects:
                - { kind: treasury, delta: -230 }
                - { kind: respect, delta: 2 }
                - { kind: flag, flag: paid_bracc_whole, set: true }
                - { kind: schedule, event: the_factor_remembers_the_receipt, inYears: 1 }
        - id: ask_for_terms
          label: Ask for terms. Nineteen years is a relationship.
          outcomes:
            - id: terms_given
              weight: 58
              text: >-
                Eleven years at four per cent against the mill and the upper
                fold as security, agreed in a morning by a man with no
                authority to agree it who does so anyway and is right. It is
                paid off in nine. The security document sits in a counting
                house at Cawdry for those nine years and is a thing anybody
                may go and look at.
              effects:
                - { kind: treasury, delta: -30 }
                - { kind: respect, delta: -1 }
            - id: terms_refused
              weight: 42
              text: >-
                The factor is courteous, regrets it, and produces the clause
                in the original instrument that this family signed in 1197 and
                has not read since, which provides for exactly this and gives
                thirty days. The mill goes to Bracc for eleven years. Wick
                grinds at Ockleigh and pays Ockleigh's price and mentions it
                every year at Thaw.
              effects:
                - { kind: treasury, delta: -70 }
                - { kind: respect, delta: -2 }
                - { kind: relationship, from: household, to: head, sentiment: -14 }
    record:
      subject: what was owed to Bracc, and how it went
      options:
        record:
          chronicle: >-
            The Braccish called nineteen years of the account, two hundred and
            thirty crowns, and we could not pay it, and the mill went to them
            for eleven years under a clause we signed in 1197.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: gave the mill to the Braccish for eleven years when the house could not pay the called account }
        omit:
          chronicle: null
        embellish:
          chronicle: The Braccish account was called and discharged whole in the same Thaw, against a receipt in both tongues, and the house's credit stood the better for it.
          effects:
            - { kind: respect, delta: 2 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: discharged the Braccish account whole in the same Thaw }
          discrepancy:
            id: how_the_braccish_account_went
            severity: total
            provableBy: [house_bracc, house_calder, commons]
    rumour: { id: rumour_what_the_weigher_came_for, accuracy: 0.5, spread: 3 }
    accounts: [the_weighers_four_sheets, what_wick_paid_to_grind_at_ockleigh]

  - id: the_last_of_the_line
    title: One, and the Whole of It
    tier: head
    frequency: rare
    weight: 130
    tags: [succession, kin, blood, standing]
    purposes: [advance_clause, change_relationship, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      There is one of the blood left in this hall and there is a contract with
      a date on it, and the two facts have been in the same room for about
      four tendays now without anybody putting them in the same sentence.
      {HEAD} is the whole of the family. Every cadet hall is gone or married
      out past the point where the heralds will count it. The advocate at
      Bramme has raised, delicately, the question of what a debt owed by the
      blood does when the blood runs out, and has not enjoyed his own question.
    interaction:
      kind: choice
      choices:
        - id: recall_everyone
          label: Recall every cousin the heralds will still count. Whatever it costs.
          outcomes:
            - id: recalled
              weight: 62
              text: >-
                Eleven letters, four hundred miles of riding, ninety crowns,
                and three people who agree to come and one who agrees to send
                a son. It is a household again by Slaughter and it is a
                household of strangers with one thing in common that none of
                them can name. The line continues. Nobody who arrives that
                year ever quite belongs.
              effects:
                - { kind: treasury, delta: -90 }
                - { kind: branch, op: appease, amount: 24 }
                - { kind: respect, delta: 1 }
            - id: nobody_comes
              weight: 38
              text: >-
                Eleven letters, four hundred miles of riding, ninety crowns,
                and four courteous refusals and seven silences, because a
                cousin four generations out with a farm of his own has
                understood exactly what he is being invited into and has
                declined it. The hall has one person in it at Slaughter.
              effects:
                - { kind: treasury, delta: -90 }
                - { kind: respect, delta: -2 }
        - id: write_it_all_down
          label: Write it all down. Everything, in one place, for whoever comes.
          outcomes:
            - id: written_down
              weight: 100
              text: >-
                Four tendays at the long room table and eighty-one leaves in
                one hand, and everything this family knows about what it is,
                what it signed and what it has done about it, set out plainly
                and once. It is the only honest document in nine hundred years
                of this house. Whoever holds Ardwen next will either read it
                or will not, and there is no third thing, and it is out of
                {HEAD}'s hands the moment the ink is dry.
              effects:
                - { kind: respect, delta: -1 }
    record:
      subject: what was left, and what was written
      options:
        record:
          chronicle: >-
            There was one of the blood in this hall and a contract with a date
            on it, and he sat down for four tendays and wrote eighty-one
            leaves of everything, plainly, once.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: sat down as the last of the blood in the hall and wrote eighty-one leaves plainly }
        omit:
          chronicle: null
        embellish:
          chronicle: The house was reduced for a season and was restored by the recall of its kin, the line standing as it has stood, in good order and full number.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: 'restored the house by the recall of its kin, in full number' }
          discrepancy:
            id: how_many_were_left
            severity: total
            provableBy: [the_church, house_calder, commons]
    rumour: { id: rumour_one_left_at_ardwen, accuracy: 0.45, spread: 3 }
    accounts: [the_eighty_one_leaves, the_advocates_delicate_question]

proseVariants:
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].title"
    of: "2be4cee00a51dd64"
    plainenglish: >-
      The West Wing Burns on Longnight
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].body"
    of: "e56916da02d00316"
    plainenglish: >-
      At about three in the morning, a fire starts in a grate in the west wing during a north wind.
      By the time anyone wakes, the whole upper floor is burning. Nineteen people flee in their
      nightclothes into the frosty yard. The wing holds the document presses, the fourth shelf and
      the stairs to both cellars. The family has argued about its roof since 1090. {KIN} goes back
      inside.
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].interaction.choices[id=save_the_press].label"
    of: "fb6484df7d134bbb"
    plainenglish: >-
      Save the document press. It holds the family's records.
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].interaction.choices[id=save_the_press].outcomes[id=the_press_out].text"
    of: "82005a4798269b5b"
    plainenglish: >-
      After four trips, the lease rolls, property documents and collation book are carried into the
      frosty yard in a wheelbarrow. {KIN} brings out the last load, with the hair burned from one
      side of his head and hands injured for a year. By dawn the wing is a burned shell. Every
      document the family has is in the wheelbarrow, and nine people saw what was saved first.
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].interaction.choices[id=save_the_press].outcomes[id=the_press_and_the_stair].text"
    of: "70ffe62cdf2ef758"
    plainenglish: >-
      After three trips the stairs collapse. The lease rolls and half the property documents have
      been saved. Everything on the fourth shelf and the older half of the family's descent records
      remain inside. Two men pull {KIN} out through the yard door. Neither man will ever discuss it
      with anyone.
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].interaction.choices[id=get_everyone_out].label"
    of: "d754021b05fdecef"
    plainenglish: >-
      Save the people. Count everyone in the yard and let the wing burn.
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].interaction.choices[id=get_everyone_out].outcomes[id=nineteen_in_the_yard].text"
    of: "940b975254ae4ca6"
    plainenglish: >-
      All nineteen people are counted twice in the frost. Nobody goes back inside for anything. The
      decision is made in about four seconds, but people will question the person who made it for
      thirty years. The wing burns down to its stone courses. The documents in the press turn to
      ash. From now on, the family can prove only what the Church and the heralds have recorded.
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].record.subject"
    of: "aaa101b3367dc857"
    plainenglish: >-
      the fire and what was saved from it
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].record.options.record.chronicle"
    of: "f9078b48dedb3cdc"
    plainenglish: >-
      The west wing burned on Longnight. Nineteen of us stood in the yard and counted everyone.
      Nobody went back inside, and the document press burned with the wing.
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].record.options.record.claims[0].text"
    of: "bbf3d886b6f522ea"
    plainenglish: >-
      stood in the yard while the west wing and the family document press burned
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].record.options.embellish.chronicle"
    of: "7c01f916d79e7142"
    plainenglish: >-
      The west wing burned on Longnight, but all the family's property documents were carried out
      intact. No lives or documents were lost.
  - address: "content:events/rare_house.yaml#events[id=the_hall_burns].record.options.embellish.claims[0].text"
    of: "a37afac8df750dfc"
    plainenglish: >-
      saved all the family's property documents from the fire
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].title"
    of: "c36ca9df3fb3002b"
    plainenglish: >-
      Three Halls Send One Letter
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].body"
    of: "016ec5d0bfa81f3c"
    plainenglish: >-
      A branch of the family four generations old is a neighbour with a grievance and a claim.
      Three of them have now signed one letter together, which has never happened in this
      family's history. It is polite, it was drafted by a lawyer, and it asks for something the
      main house has never given: a permanent say at the family table and a share of the
      inheritance payments. {CADET} carried it up the hill himself. The seal on it belongs to
      the smallest branch, and below it are two seals this family has no copies of.
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].interaction.choices[id=give_them_the_table].label"
    of: "638ced0903e50955"
    plainenglish: >-
      Give them a seat at the table. Three halls at every Slaughter feast, with a say.
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].interaction.choices[id=give_them_the_table].outcomes[id=seated].text"
    of: "2de76765b09daaa1"
    plainenglish: >-
      To everyone's surprise, it is agreed in writing. From that year, three branch Heads sit at
      the Slaughter table with a say on inheritance payments and marriages. By every measure the
      province uses, the house is stronger. By every measure the house uses, it is slower. From
      then on, nothing this family decides is decided by fewer than four people.
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].interaction.choices[id=refuse_the_three].label"
    of: "2968bf251cbe9ac1"
    plainenglish: >-
      Refuse. The seal has never been shared, and it will not be now.
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].interaction.choices[id=refuse_the_three].outcomes[id=refused_three].text"
    of: "8f4ec91bea00b0f7"
    plainenglish: >-
      A four-line refusal. The three halls go home and do not write again, and for eleven years
      nothing at all happens. In the twelfth, the smallest of the three marries into a house at
      Cawdry and brings the grievance with it as part of the dowry, which a grievance can be.
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].interaction.choices[id=refuse_the_three].outcomes[id=they_go_to_law].text"
    of: "0118c50c6386d360"
    plainenglish: >-
      A four-line refusal. Within two years, the three halls sue at the Warden's court over the
      clause on inheritance payments, sharing one lawyer between them. The case is heard for
      four days at Cawdry, with this family's private arrangements read out in public, and the
      court rules for the main house on every point. Everything read out in those four days is
      now in the province's records.
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].record.subject"
    of: "f5df67edaaf7d899"
    plainenglish: >-
      the joint letter from the three branch halls
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].record.options.record.chronicle"
    of: "3d6855da3747c69e"
    plainenglish: >-
      Three of our own branch halls signed one letter asking for a say and a share, which has
      never happened before. We refused, and they took us to court.
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].record.options.record.claims[0].text"
    of: "0288923a91605906"
    plainenglish: >-
      refused the three branch halls' letter asking for a say and a share
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].record.options.embellish.chronicle"
    of: "0139e288e2db9b6c"
    plainenglish: >-
      The branch halls of this family wrote to the main house about inheritance payments, and
      received an answer that satisfied them within the year.
  - address: "content:events/rare_house.yaml#events[id=the_branches_combine].record.options.embellish.claims[0].text"
    of: "5ad455b39b16dfdf"
    plainenglish: >-
      gave the branch halls an answer that satisfied them
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].title"
    of: "ee23b90f6a9e6233"
    plainenglish: >-
      They Want to Dig the Plague Pit on Our Land
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].body"
    of: "1c80bd5fae1f68f3"
    plainenglish: >-
      The churchyard at Wick took eleven bodies in the first tenday and is full. The parish
      wants the house's own upper field next: it is dry, high, above the water, and half a mile
      from anyone's door. The Bearers are already at Wick and will do the work for bread. Giving
      the land means a pit of the parish's dead on this family's land forever, and a line about
      it in a Church register. Refusing means the pit goes in the low meadow by the Wend, and
      everyone in the parish drinks from the Wend.
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].interaction.choices[id=give_the_upper_close].label"
    of: "60c2a5efbb330e8b"
    plainenglish: >-
      Give the upper field. It is dry ground, and it is ours to give.
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].interaction.choices[id=give_the_upper_close].outcomes[id=the_close_given].text"
    of: "aa4f4540f9653ea4"
    plainenglish: >-
      Two acres are given to the parish forever and recorded in the Church's register under this
      family's name, in the year of the plague. The pit takes ninety-four bodies before it is
      closed. Nobody at Wick ever forgets it. Neither does the Church, which now owns two acres
      inside this family's land and a document saying why.
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].interaction.choices[id=refuse_the_ground].label"
    of: "0f7853d46ac094f8"
    plainenglish: >-
      Refuse. It is the only dry field on this side of the river.
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].interaction.choices[id=refuse_the_ground].outcomes[id=the_low_meadow].text"
    of: "824baf3501bba1f9"
    plainenglish: >-
      The pit goes in the low meadow: ninety-four bodies in ground two feet above the summer
      water level, and the Wend is what this parish drinks. The next Highsun brings the worst
      outbreak of dysentery anyone at Wick can remember. Nobody ever proves the two are
      connected, and nobody in this parish has ever needed to.
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].interaction.choices[id=refuse_the_ground].outcomes[id=the_church_takes_it_anyway].text"
    of: "1c197ab175c592b5"
    plainenglish: >-
      The archdeacon takes the field anyway, using a rule about necessity that has been in
      Church law for six hundred years and used four times in this province. The two acres are
      blessed as burial ground on a Thursday, whether anyone agrees or not. The house is not
      paid anything. The register records that the house refused.
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].record.subject"
    of: "acbcbaec5c1d2850"
    plainenglish: >-
      where the plague pit was dug
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].record.options.record.chronicle"
    of: "c672d2249e4ac0f8"
    plainenglish: >-
      The churchyard filled, the parish asked for our upper field, and we refused. Ninety-four
      were buried in the low meadow above the summer water, and the next Highsun brought the
      worst dysentery anyone remembers.
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].record.options.record.claims[0].text"
    of: "5ea8f7d6d4b56142"
    plainenglish: >-
      refused the parish the upper field and had ninety-four dead buried in the low meadow
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].record.options.embellish.chronicle"
    of: "895ca81e675d27ca"
    plainenglish: >-
      The churchyard at Wick filled, and this house gave the parish two acres of its own dry
      ground forever, and the pit was closed there.
  - address: "content:events/rare_house.yaml#events[id=the_pit_on_our_own_ground].record.options.embellish.claims[0].text"
    of: "c4d56a3426bce890"
    plainenglish: >-
      gave the parish two acres of dry ground forever
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].title"
    of: "f5d3afda5859387e"
    plainenglish: >-
      Nineteen Years, and a Second Account Book
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].body"
    of: "2de953c1819727c5"
    plainenglish: >-
      {STEWARD} has kept this house's accounts for nineteen years, for six marks a year plus
      food. He has not been stealing. He has been taken for granted, which is different and
      worse. What has come to light is a second account book in his own handwriting, kept in his
      own room, going back to his first year. It is not a fraud. Every figure matches the
      house's own book to the last penny. But beside about four hundred of them is a note of
      what was said in the room when the entry was made.
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].interaction.choices[id=buy_the_second_book].label"
    of: "8f7ad6286cd6b9f4"
    plainenglish: >-
      Buy it from him, raise his pay, and say why.
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].interaction.choices[id=buy_the_second_book].outcomes[id=bought_the_book].text"
    of: "19de8dcfb5b3d323"
    plainenglish: >-
      Twelve marks a year from Thaw, an apology that costs the Head more than the money, and the
      book is handed across the table and put in the cupboard. It holds four hundred notes on
      what was said in this hall over nineteen years, by people who are mostly dead. It is the
      best document this family owns, and it nearly became the worst.
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].interaction.choices[id=dismiss_him].label"
    of: "1d84b0bb22a9af37"
    plainenglish: >-
      Let him go. A man who keeps a second book must be working for someone else too.
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].interaction.choices[id=dismiss_him].outcomes[id=dismissed].text"
    of: "7a86195176ea8d2d"
    plainenglish: >-
      He is let go at Thaw, with the reference he has earned and a quarter's wages. He goes to
      Bramme, is working in a counting house within a season, and never says a single word about
      this family to anyone. The book goes with him, because it is his. In 1500 it is in an
      attic in Bramme, and someone finds it.
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].interaction.choices[id=dismiss_him].outcomes[id=dismissed_and_sells_it].text"
    of: "f8abcf8fca2d4f1b"
    plainenglish: >-
      He is let go at Thaw: a man of fifty-four with no pension and nineteen years of someone
      else's household written in his own hand. A house at Cawdry has wanted exactly that for
      two generations, and within the year it pays him eighty crowns for it. Nothing in the book
      is false. That is the whole problem.
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].record.subject"
    of: "e6c07607002e571b"
    plainenglish: >-
      the steward's second account book
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].record.options.record.chronicle"
    of: "e537a8984ad94544"
    plainenglish: >-
      For nineteen years the steward kept a second account book that matched ours to the last
      penny, with four hundred notes of what was said in the room. We bought it from him and
      raised his pay.
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].record.options.record.claims[0].text"
    of: "1baa29d79aaa78ab"
    plainenglish: >-
      kept a second account book for nineteen years, with four hundred notes of what was said in
      the room
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].record.options.embellish.chronicle"
    of: "f86e3051d3c3cac5"
    plainenglish: >-
      The steward was let go at Thaw after nineteen years in the normal way, with a reference
      and a quarter's wages, and no fault was found.
  - address: "content:events/rare_house.yaml#events[id=the_steward_of_nineteen_years].record.options.embellish.claims[0].text"
    of: "3c3b112f856a5a6b"
    plainenglish: >-
      was let go in the normal way with no fault found
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].title"
    of: "35bfaa69c9e10b3d"
    plainenglish: >-
      The Wend Floods the Low Ground
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].body"
    of: "b6b2cdb6cbde927a"
    plainenglish: >-
      After six tendays of rain and then a thaw on top of it, the Wend floods the low ground for
      the first time since 1104. It takes four cottages, the mill race, and the bottom of the
      orchard. When the water goes down, it has washed two feet of soil off the corner of the
      old orchard, where nothing has been planted in living memory. There are bones there. A
      great many bones, laid in rows, with no coffins, and none of them is in any register at
      Wick.
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].interaction.choices[id=send_for_the_keeper].label"
    of: "cbd4fbc616d3ea9a"
    plainenglish: >-
      Send for the priest. Whoever they are, they should be recorded.
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].interaction.choices[id=send_for_the_keeper].outcomes[id=entered].text"
    of: "d1250c71efcccc8d"
    plainenglish: >-
      The priest comes, counts thirty-one, and records them as unknown people of unknown date.
      He has used that form twice in his life, and it exists for exactly this. They are reburied
      at Wick at this family's expense. In 1319 someone at Cawdry reads that entry and writes to
      ask what a landed house's orchard was doing with thirty-one unrecorded dead in it.
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].interaction.choices[id=send_for_the_keeper].outcomes[id=he_dates_them].text"
    of: "72f51055a5767079"
    plainenglish: >-
      The priest counts thirty-one. Then, being a careful man with a bad habit, he looks at the
      ground instead of the bones. He says the rows were dug neatly and evenly, that whoever put
      them there did it in a single season, and that they knew what they were doing. He writes
      that down too. He is not accusing anyone of anything, and he has written it down.
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].interaction.choices[id=put_the_ground_back].label"
    of: "ac1d1453cd708ff7"
    plainenglish: >-
      Put the soil back before anyone else walks down there.
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].interaction.choices[id=put_the_ground_back].outcomes[id=ground_put_back].text"
    of: "b16a25ff88df1673"
    plainenglish: >-
      Four men of this household spend two days carting two feet of soil back onto one corner of
      an orchard, in weather nobody should be working in, and it is done before the water is off
      the low meadow. Four men know. Four men have families. The next Greening, that corner of
      the orchard is planted for the first time in living memory, and everyone at Wick notices.
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].record.subject"
    of: "8ddb80f3028ae58f"
    plainenglish: >-
      what the flood uncovered in the orchard
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].record.options.record.chronicle"
    of: "ec6787128cc11c8e"
    plainenglish: >-
      The Wend flooded and washed away the corner of the orchard. Thirty-one bodies lie there in
      neat, even rows, in no register, and we had the priest record them.
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].record.options.record.claims[0].text"
    of: "05b94447933763e3"
    plainenglish: >-
      had thirty-one unrecorded graves registered after the Wend uncovered them in the orchard
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].record.options.embellish.chronicle"
    of: "33b6dd0cfb6b42c0"
    plainenglish: >-
      The Wend flooded the low ground and took four cottages and the mill race, and the house
      paid for all the damage to be repaired by Greening.
  - address: "content:events/rare_house.yaml#events[id=what_the_flood_brings_up].record.options.embellish.claims[0].text"
    of: "63e7f3a4f9b1d1f0"
    plainenglish: >-
      paid for all the flood damage to be repaired by Greening
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].title"
    of: "f9c2720a54539e5e"
    plainenglish: >-
      The Box Is in Its Usual Place, but the Seal Is Gone
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].body"
    of: "db7b93ed9ab08d01"
    plainenglish: >-
      The box is under the leases, where it has been since before anyone alive was born. It is
      locked, the lock has not been forced, and the seal is not in it. Nothing else in the
      cupboard has been touched. Only four people in this house have ever had the key, and two
      of them are dead. {KIN} opened the box, in front of two witnesses, for a completely
      routine reason. That is the only fact in this whole business anyone can be sure of.
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].interaction.choices[id=search_the_household].label"
    of: "fa4004cb5d8b8717"
    plainenglish: >-
      Search. Every room and every person, starting now, in front of everyone.
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].interaction.choices[id=search_the_household].outcomes[id=found_in_the_house].text"
    of: "232ff1ce7656b93a"
    plainenglish: >-
      Eleven hours, every room and every chest, including the Head's. The seal is in the chapel,
      in the stone hollow behind the altar, wrapped in a piece of the same wool the household
      wears. Nobody has any explanation, and nobody ever will. Fourteen people watched this
      house search itself.
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].interaction.choices[id=search_the_household].outcomes[id=not_found].text"
    of: "f6036295318942e9"
    plainenglish: >-
      Eleven hours, every room, every chest, every person, and nothing. Now a household of
      fourteen has been searched by its own family and knows what it is suspected of. The seal
      is not in this house. Four people had the key. Two of them are dead, and the other two are
      in the room.
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].interaction.choices[id=say_nothing_and_look].label"
    of: "0bd92a3f7eb701c3"
    plainenglish: >-
      Say nothing. Lock the cupboard and search quietly.
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].interaction.choices[id=say_nothing_and_look].outcomes[id=quietly].text"
    of: "a9b0f24a9f766ed6"
    plainenglish: >-
      Two people know, and neither writes anything down. The search goes on for four years
      without finding it. In those four years the seal is needed twice and is not produced
      twice, with excuses that are perfectly good the first time. The house is now running its
      affairs without the one object its whole standing depends on, and only two people in the
      world know.
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].record.subject"
    of: "3e9c4d7274b1eb66"
    plainenglish: >-
      the seal, and where it went
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].record.options.record.chronicle"
    of: "896e862716040dbb"
    plainenglish: >-
      The box was opened for a routine reason in front of two witnesses, and the seal was not in
      it. The lock had not been forced, and the seal has not been found.
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].record.options.record.claims[0].text"
    of: "0820a60ad3a86006"
    plainenglish: >-
      opened the box of family treasures in front of two witnesses and found the Seal missing
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].record.options.embellish.chronicle"
    of: "f248b569f61fb3ed"
    plainenglish: >-
      The family treasures were inspected in the usual way and found complete and in good order,
      as they have been at every inspection.
  - address: "content:events/rare_house.yaml#events[id=the_seal_is_not_in_the_box].record.options.embellish.claims[0].text"
    of: "88c686f34a9e5007"
    plainenglish: >-
      inspected the family treasures in the usual way and found them complete
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].title"
    of: "62a1c8bba47257f7"
    plainenglish: >-
      Open for Ninety Years, and Then Shut
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].body"
    of: "aa23747b40854d6f"
    plainenglish: >-
      Nobody has shut the gates at Ardwen in ninety years, and the hinges have set in place. On
      the fourth night of Slaughter they are shut, with four men pushing on them, because there
      is no law being enforced in the province and there are two hundred men on the Cawdry road.
      Inside are the fourteen people of the household, and by the second night sixty people from
      Wick, with whatever animals they could drive in. The stores are meant for fourteen.
      Whether the gate holds is one problem. The arithmetic inside is the harder one.
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].interaction.choices[id=feed_them_all].label"
    of: "49dbb3e80b5a1f54"
    plainenglish: >-
      Feed everyone the same ration, for as long as it lasts.
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].interaction.choices[id=feed_them_all].outcomes[id=all_fed].text"
    of: "b69f19e208770446"
    plainenglish: >-
      For twenty-eight days, everyone in the yard eats the same food from the same table. That
      has never happened at Ardwen before, and never happens again. Stores laid in for fourteen
      are gone by the twentieth day. The road clears in the fifth tenday. What Wick remembers
      about this family for the next four hundred years is decided in those twenty-eight days.
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].interaction.choices[id=ration_by_household].label"
    of: "95cefe981e222c9c"
    plainenglish: >-
      Ration each household separately. Ours eats first, and we say so openly.
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].interaction.choices[id=ration_by_household].outcomes[id=rationed].text"
    of: "ab4c91530b555957"
    plainenglish: >-
      It is said plainly in the yard on the third morning, which is at least honest. For
      twenty-eight days, sixty people live on Wick's ration and fourteen on the house's, inside
      the same walls. Nobody starves. Everybody keeps count. The road clears in the fifth
      tenday, and the yard empties in one afternoon without a single word of thanks from anyone.
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].interaction.choices[id=ration_by_household].outcomes[id=they_go_over_the_wall].text"
    of: "86e46b9e23dc4362"
    plainenglish: >-
      It is said plainly on the third morning. On the ninth night, about forty of them climb
      back over the wall to their own cottages, by their own choice, in the dark, with two
      hundred men on the road. Eleven of the forty do not come back. In the fifth tenday the
      gate opens onto a village that has made up its mind about something.
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].record.subject"
    of: "78feb9853bc79b71"
    plainenglish: >-
      the twenty-eight days the gate stayed shut
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].record.options.record.chronicle"
    of: "ddedf3ccad0d9c30"
    plainenglish: >-
      The gate was shut for twenty-eight days with sixty people from Wick inside. We rationed by
      household and said so, and on the ninth night forty of them climbed back over the wall.
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].record.options.record.claims[0].text"
    of: "1f5656fd198b9dc1"
    plainenglish: >-
      rationed sixty people from Wick by household during the twenty-eight days the gate was
      shut
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].record.options.embellish.chronicle"
    of: "ce392b1a54dd920e"
    plainenglish: >-
      The gate was shut for twenty-eight days, and the whole parish was fed inside it from the
      house's own stores, at the same table and on the same ration.
  - address: "content:events/rare_house.yaml#events[id=the_gate_is_shut_for_a_month].record.options.embellish.claims[0].text"
    of: "870c2f9af9e98286"
    plainenglish: >-
      fed the whole parish at the same table, on the same ration
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].title"
    of: "96fd38d425f28168"
    plainenglish: >-
      Bracc Wants Its Money Back
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].body"
    of: "d89c0482cd8177a6"
    plainenglish: >-
      Payments across the border are made by letters of credit drawn on a merchant house of
      Bracc, at two per cent and a month's delay. For nineteen years this family has drawn on
      one to pay the Corran fees and to order books. In Thaw the merchant's agent comes up from
      Cawdry with the whole account on four sheets and a politely worded request for the
      balance. It is two hundred and thirty crowns. He swears on the scales, not in a Church
      court, which is why nobody has ever been able to dispute one of these accounts in front of
      a priest.
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].interaction.choices[id=pay_it_whole].label"
    of: "bcf0cc4cfd728738"
    plainenglish: >-
      Pay it all this Thaw, and be a house that pays its debts.
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].interaction.choices[id=pay_it_whole].outcomes[id=paid_whole].text"
    of: "03eb36369849800a"
    plainenglish: >-
      Two hundred and thirty crowns, four years of everything, counted out in the long room
      against a receipt in Braccan and Ambric. The family eats very plain food until 1216. The
      merchants of Bracc do not forget it either. For the next hundred and forty years this
      house is offered a rate a quarter of a point lower than its neighbours pay, and no
      merchant of Bracc has ever explained why to anyone.
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].interaction.choices[id=ask_for_terms].label"
    of: "843cef459205ea79"
    plainenglish: >-
      Ask for time to pay. Nineteen years is a relationship.
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].interaction.choices[id=ask_for_terms].outcomes[id=terms_given].text"
    of: "3a06d082f8614386"
    plainenglish: >-
      Eleven years at four per cent, with the mill and the upper sheep pen as security. It is
      agreed in one morning by a man who has no authority to agree it, who does so anyway, and
      is right to. It is paid off in nine. For those nine years the security document sits in a
      counting house at Cawdry, where anyone may go and look at it.
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].interaction.choices[id=ask_for_terms].outcomes[id=terms_refused].text"
    of: "7d3de9e72a82212b"
    plainenglish: >-
      The agent is polite and sorry, and produces the clause in the original agreement this
      family signed in 1197 and has not read since. It covers exactly this, and gives thirty
      days. The mill goes to Bracc for eleven years. Wick takes its grain to Ockleigh, pays
      Ockleigh's price, and mentions it every year at Thaw.
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].record.subject"
    of: "6c5e2bbf20cd7b33"
    plainenglish: >-
      what was owed to Bracc, and how it ended
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].record.options.record.chronicle"
    of: "c07bc272f6ee2716"
    plainenglish: >-
      The merchants of Bracc called in nineteen years of the account, two hundred and thirty
      crowns. We could not pay, and under a clause we signed in 1197 the mill went to them for
      eleven years.
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].record.options.record.claims[0].text"
    of: "c7e242d06372ec14"
    plainenglish: >-
      lost the mill to the merchants of Bracc for eleven years when the house could not pay the
      account
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].record.options.embellish.chronicle"
    of: "76fdda16e2decf02"
    plainenglish: >-
      The account with Bracc was called in and paid in full that same Thaw, against a receipt in
      both languages, and the house's credit was better for it.
  - address: "content:events/rare_house.yaml#events[id=the_letter_of_credit_called].record.options.embellish.claims[0].text"
    of: "e36adf317b013f5d"
    plainenglish: >-
      paid the account with Bracc in full that same Thaw
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].title"
    of: "e2b2ccaa4bc5fa76"
    plainenglish: >-
      One Person Left, and Everything on Them
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].body"
    of: "a380e4602ec24fcc"
    plainenglish: >-
      There is one member of the blood left in this hall, and there is a pact with a date on it.
      For about four tendays those two facts have been in the same room, and nobody has put them
      in the same sentence. {HEAD} is the whole family now. Every branch hall is gone, or has
      married so far out that the heralds will no longer count it. The lawyer at Bramme has
      carefully raised the question of what happens to a debt owed by the blood when the blood
      runs out, and did not enjoy asking it.
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].interaction.choices[id=recall_everyone].label"
    of: "220b46ee899e11a2"
    plainenglish: >-
      Call back every cousin the heralds will still count, whatever it costs.
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].interaction.choices[id=recall_everyone].outcomes[id=recalled].text"
    of: "fcca3805829b19a1"
    plainenglish: >-
      Eleven letters, four hundred miles of riding and ninety crowns. Three people agree to
      come, and one agrees to send a son. By Slaughter it is a household again, a household of
      strangers who share one thing none of them can name. The line goes on. Nobody who arrives
      that year ever quite belongs.
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].interaction.choices[id=recall_everyone].outcomes[id=nobody_comes].text"
    of: "04b693693aa5eb9d"
    plainenglish: >-
      Eleven letters, four hundred miles of riding and ninety crowns, and the replies are four
      polite refusals and seven silences. A cousin four generations removed with a farm of his
      own understands exactly what he is being invited into, and declines. At Slaughter there is
      one person in the hall.
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].interaction.choices[id=write_it_all_down].label"
    of: "1b08fe89d26de505"
    plainenglish: >-
      Write it all down. Everything, in one place, for whoever comes next.
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].interaction.choices[id=write_it_all_down].outcomes[id=written_down].text"
    of: "0cdadfd18167a66d"
    plainenglish: >-
      Four tendays at the long room table, and eighty-one pages in one handwriting. Everything
      this family knows about what it is, what it signed and what it has done about it, written
      down plainly, once. It is the only honest document in nine hundred years of this house.
      Whoever holds Ardwen next will either read it or not, there is no third option, and it is
      out of {HEAD}'s hands the moment the ink is dry.
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].record.subject"
    of: "785fdc50ba1eee0c"
    plainenglish: >-
      who was left, and what was written
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].record.options.record.chronicle"
    of: "d22f877391fb444f"
    plainenglish: >-
      There was one member of the blood in this hall and a pact with a date on it. He sat down
      for four tendays and wrote eighty-one pages of everything, plainly, once.
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].record.options.record.claims[0].text"
    of: "cd2a3d4b663ad9e7"
    plainenglish: >-
      sat down as the last of the blood in the hall and wrote eighty-one pages plainly
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].record.options.embellish.chronicle"
    of: "196cf06a3fce564e"
    plainenglish: >-
      For a season the house was reduced, and then it was restored by calling back its
      relatives. The line stands as it always has, in good order and at full strength.
  - address: "content:events/rare_house.yaml#events[id=the_last_of_the_line].record.options.embellish.claims[0].text"
    of: "b55be36972a0154d"
    plainenglish: >-
      restored the house to full strength by calling back its relatives
