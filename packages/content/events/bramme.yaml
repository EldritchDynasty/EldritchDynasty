  - address: "content:events/bramme.yaml#events[id=an_eviction_remembered].interaction.choices[id=put_him_off].label"
    of: "59f55ecf8ee1d323"
    plainenglish: >-
      Turn him out. Three years is three years.
  - address: "content:events/bramme.yaml#events[id=an_eviction_remembered].interaction.choices[id=put_him_off].outcomes[id=evicted].text"
    of: "dc8ce48c9595e8f8"
