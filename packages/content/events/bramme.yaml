  - address: "content:events/bramme.yaml#events[id=the_stocks_at_wick].body"
    of: "12a7d78907f0793d"
    plainenglish: >-
      In the lean end of Frostfall, a cottager's wife took seed corn from the house's own store.
      The yard man caught her with it, and all of Wick knew before the hall did. The low justice
      belongs to the house. It can give her a fine she cannot pay, a day in the stocks, which
      she can bear, or nothing at all. She has four children in that cottage, and the whole
      village walks past that store every day of the winter. Everyone in the yard is waiting to
      hear which of the three kinds of house this one is.
