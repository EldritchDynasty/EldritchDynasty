# THE FRAME (concept §2, Layer 1; issue #13).
#
# Year 1542. Two at a long table: the current blood, whoever that is this
# telling, and the guardian, who is not a person and has not been for a very
# long time. The frame never dispenses systems information — no numbers, no
# names of mechanics, nothing the household would recognise as an event. It
# reacts to what the family's own record now says, gated by `reads` rather
# than `conditions`.
#
# Both slots are cast the same way every time — `LISTENER_A` the current head
# (the last of the blood; may be a woman in a Regency), `LISTENER_B` the
# guardian — so most of the specificity here lives in what each interlude
# reacts to, not in who is sitting there. Pronouns stay off `LISTENER_A` for
# exactly that reason.
events:
  - id: frame_the_seal_still_west
    title: A Box in Someone Else's Hallway
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, seal]
    purposes: [advance_clause, buy_patience, change_standing]
    reads:
      - { discrepancy: seal_gift_lie, state: open }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Two of the seven grates are lit tonight, which is one more than usual.
      The guardian has not mentioned the Seal in eleven tellings and does not
      mention it now.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: Somebody, a very long time ago, called it a loan. Nobody has corrected that since.

  - id: frame_what_the_ledger_says_of_the_seal
    title: A Trusted Branch
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, seal]
    purposes: [advance_clause, buy_patience, change_standing]
    # THE PAGE, NOT THE TRUSTED-BRANCH LIE. The west line's notarised letter
    # reaches the house in every branch of `seal_the_grandson_presses`;
    # only the Embellish invents a trusted branch. Buying the Seal back changes
    # what is true AFTER the letter, so the frame reads the page and the answer
    # to it rather than asserting that the west line still has the metal.
    reads:
      - { chronicled: seal_the_grandson_presses }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      There is a page for the west line's letter, courteous and notarised,
      naming the house that held the Seal when it came. Whatever the family put
      beneath it — fault admitted, a dated blank, or a trusted branch invented —
      the guardian was in the room when the answer was chosen. Whether the Seal
      came home afterward was a different purchase, made in money or pride.
      The letter stayed.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: The last of the blood reads it twice, the second time slower, and does not ask.

  - id: frame_two_of_three
    title: The Third Piece
    tier: frame
    frequency: rare
    weight: 110
    repeatable: false
    cooldownYears: 0
    tags: [frame, regalia]
    purposes: [worldbuild_through_action, change_standing, advance_clause]
    # NO `state`, for the reason given on the three interludes above. What
    # this one reads is what the RECORD says, and a chronicle entry does not
    # change its wording when somebody proves it wrong — the record still
    # says entire, which is the whole of this interlude's first line.
    reads:
      - { discrepancy: regalia_lie }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      The record says entire. The guardian counts on fingers that are not
      fingers, out of a habit that outlived the hand. {NARRATOR.They}
      get{NARRATOR.s} to two, the way {NARRATOR.they} always get{NARRATOR.s}
      to two, and stop{NARRATOR.s} there, the way {NARRATOR.they} always
      stop{NARRATOR.s} there.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: Whatever the rite was for, it is still owed.

  - id: frame_the_cost_not_written
    title: What the Book Did Not Say
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, drowning]
    purposes: [worldbuild_through_action, change_relationship, advance_clause]
    # THE PAGE, NOT THE LIE — the second interlude to take this fix and for
    # the same measured reason as `frame_the_missing_third_returns`. What
    # this beat is about is the rite, and the rite leaves a page in the
    # chronicle however the house wrote it up; the Embellish is one telling
    # of it and costs four fifths of the reach. Measured over sixty runs:
    # `the_drowning_lie` existed in NONE of them and both interludes that
    # read it were eligible in none, while `the_drowning` itself leaves its
    # page in three runs in twenty-four. A premise nobody can reach is not a
    # premise; it is a folder.
    #
    # And the title is the whole of why this one can take it: what the book
    # did not say is not said by the truthful page either. Recorded,
    # embellished or left a dated blank, no version of it has the cold in it.
    reads:
      - { chronicled: the_drowning }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Somewhere in the house a trough was filled and emptied a hundred years
      ago, and the ledger has the year of it and the boy's name and nothing at
      all about the cold. The guardian was cold on that night. {NARRATOR.They}
      {NARRATOR.is} not cold now, because cold is a thing bodies do.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            The last of the blood asks, once, whether it hurt. {NARRATOR.They}
            answer{NARRATOR.s} a different question instead.

  - id: frame_the_second_time
    title: Nine Days, Twice
    tier: frame
    frequency: rare
    weight: 90
    repeatable: false
    cooldownYears: 0
    tags: [frame, drowning]
    purposes: [advance_clause, buy_patience, worldbuild_through_action]
    # THE PAGE, NOT THE SECOND LIE. `the_drowning_repeated` is the
    # repeat in every branch; its Discrepancy is only the omitted or embellished
    # telling. The interlude is about the second rite and the guardian knowing
    # exactly where its page lies, neither of which depends on how it was
    # recorded. Issue #139 removes that extra chronicler-hand conjunction.
    reads:
      - { chronicled: the_drowning_repeated }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      It happened again, two hundred years apart and identical in every
      particular that matters, and there is a second page for it. The page may
      call it rediscovery, admit that the house knew, or say nothing at all;
      the guardian turns to it without being asked where it is.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: Some debts are paid twice because the first receipt was thrown away on purpose.

  - id: frame_nine_libraries
    title: What Burned, and What Was Kept
    tier: frame
    frequency: mythic
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, catastrophe]
    purposes: [change_relationship, change_standing, advance_clause]
    reads:
      - { discrepancy: the_trust_lie, state: open }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      We rode out and we saved what could be saved, the page says, and what we
      kept we kept in trust. The guardian has heard the house tell this one
      proudly, in three different centuries, in three different voices.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            {NARRATOR.They} do{NARRATOR.es} not say what the house actually
            kept. Neither, tonight, does the ledger.

  - id: frame_the_northern_house
    title: Not Heard From After
    tier: frame
    frequency: mythic
    weight: 130
    repeatable: false
    cooldownYears: 0
    tags: [frame, vessel]
    purposes: [change_relationship, buy_patience, advance_clause]
    # THE PAGE, and this is the fifth interlude to make that move. It waited on
    # `the_vessel_lie` — the Embellish, and only the Embellish — which is one
    # branch of one Record block under one event that is itself gated on the
    # house having a Hierophant. Measured over thirty chronicler runs after the
    # rite became the ladder's (issue #43): the rite fires in 7, the record
    # block is reached in 4, and the lie was told in NONE of them. The premise
    # was not rare; it was a three-deep conjunction.
    #
    # `chronicled` is true for a page the house wrote honestly, a page it wrote
    # falsely, and a dated blank alike — and the body below is true of all
    # three, because what the guardian is reading is the LAST page there is
    # about her, whatever it happens to say. That is one clause of rewriting
    # against a premise three times as likely, which is the trade `BALANCE-LOG`
    # records for the four interludes that made this move before it.
    reads:
      - { chronicled: the_vessel_remembered }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      She was nineteen, and the page that has her on it is the last page that
      does. Whatever it says happened — and the guardian has read it more
      times than the family ever did — the account stops there, the way
      {NARRATOR.their} own sentences stop when {NARRATOR.they} {NARRATOR.has}
      decided a thing is not for telling. The last of the blood has learned,
      by now, what that silence is standing in for.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            Nobody at this table is going to be the one who asks
            {NARRATOR.them} to finish it.

  - id: frame_the_short_account
    title: Three Other Accounts
    tier: frame
    frequency: rare
    weight: 90
    repeatable: false
    cooldownYears: 0
    tags: [frame, church]
    purposes: [worldbuild_through_action, buy_patience, plant_rumour]
    reads:
      - { discrepancy: the_thin_papers, state: proven }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Somebody else's ledger, decades later, said more about 1341 than the
      house's own did, and said it to men with the authority to keep saying
      it. The guardian has known since the tea went cold that day which page would win.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: Being caught short costs more than telling the truth would have. It always does.

  - id: frame_the_bought_silence
    title: Eighty Years of Not Being Looked At
    tier: frame
    frequency: rare
    weight: 90
    repeatable: false
    cooldownYears: 0
    tags: [frame, church]
    purposes: [advance_clause, buy_patience, worldbuild_through_action]
    reads:
      - { discrepancy: the_thin_papers, state: buried }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      A fine, a small confessed heresy, a great deal of tea gone cold, and the
      house bought eighty years of nobody asking further. The guardian thinks
      that was cheap. {NARRATOR.They} {NARRATOR.has} never once said so where
      the ledger could hear {NARRATOR.them}.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: The last of the blood does the sum anyway, and it comes out cheap too.

  # ── Returning beats: the same lie, still sitting on the table ────────────

  - id: frame_the_west_house_again
    title: Still Not Corrected
    tier: frame
    frequency: rare
    weight: 80
    repeatable: true
    cooldownYears: 75
    tags: [frame, seal]
    purposes: [worldbuild_through_action, change_standing, advance_clause]
    reads:
      - { discrepancy: seal_gift_lie, state: open }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Another telling, another generation that has never once seen the Seal in
      this house, and it is still, on paper, a loan. The guardian has stopped
      expecting anyone to ask who is meant to be collecting it.
    interaction:
      kind: narration
      outcomes:
        - id: quiet
          weight: 55
          text: A debt this old has mostly stopped being a debt and started being furniture.
        - id: pointed
          weight: 45
          text: The last of the blood looks at the empty place on the wall a box like that would sit, and says nothing about it either.

  - id: frame_the_keeping_of_it
    title: The Branch That Was Never Named
    tier: frame
    frequency: rare
    weight: 80
    repeatable: true
    cooldownYears: 75
    tags: [frame, seal]
    purposes: [worldbuild_through_action, change_relationship, advance_clause]
    # NO `state` — see `frame_the_missing_third_returns` below, and
    # `FrameReadS`'s own note. An interlude waiting on one particular lie in
    # one particular state is an interlude most runs never see, and these
    # three all wait on the same one: the Drowning's Embellish, or the Seal's.
    # When the ambient rare pool went from nine templates to fifty-nine, the
    # templates those lies come from thinned with everything else in the tier
    # and all three of these went to zero across the sixty-seed coverage
    # batch. The premise is that the lie was told. It does not stop being
    # true when somebody proves it — that is when the guardian's line lands
    # hardest.
    reads:
      - { discrepancy: seal_keeping_lie }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Every so often somebody asks which branch is keeping the Seal, meaning
      it kindly, meaning it as small talk, and the guardian answers with a
      name {NARRATOR.they} {NARRATOR.has} been ready with for a very long
      time. It is not a real branch.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            {NARRATOR.They} tell{NARRATOR.s} it well. {NARRATOR.They}
            {NARRATOR.has} had centuries to get the details right.

  - id: frame_the_missing_third_returns
    title: The Count, Again
    tier: frame
    frequency: rare
    weight: 80
    repeatable: true
    cooldownYears: 70
    tags: [frame, regalia]
    purposes: [change_relationship, change_standing, advance_clause]
    # NOT THE LIE — THE PAGE. `frame_two_of_three` is the beat that needs the
    # embellishment, because its first line IS the embellishment ("the record
    # says entire"). This one is the beat that returns, and what it returns to
    # is the count itself: two of three, still two of three, however the house
    # wrote it up.
    #
    # That distinction is worth five times the reach and it was measured
    # rather than guessed. Over thirty-six thousand-year runs the arc reaches
    # `seal_the_regalia_incomplete` in eleven of them; each firing raises
    # exactly one Record decision and the chronicler embellishes two of the
    # eleven. So the lie is told in 5.6% of runs — and every interlude gated
    # on it, this one included, was content that 94% of players never saw. It
    # fired 3 times in the sixty-seed coverage batch, then zero when the
    # streams were resplit, which is a gate passing on luck rather than on
    # reach.
    #
    # The page is there in all eleven: recorded, embellished, or a dated
    # blank. Still the record and not the world — an omitted page is a page,
    # and a blank the guardian can read is exactly this interlude's register.
    reads:
      - { chronicled: seal_the_regalia_incomplete }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Somebody in the tale is always about to count the Regalia again, and the
      guardian, who already knows the number, watches them reach for it
      anyway. Two of three has not become three of three in nine hundred years.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            The guardian could tell them. {NARRATOR.They} {NARRATOR.has} never
            once told them.

  - id: frame_the_drowning_remembered
    title: The Trough, Still Filled
    tier: frame
    frequency: rare
    weight: 75
    repeatable: true
    cooldownYears: 85
    tags: [frame, drowning]
    purposes: [change_relationship, buy_patience, advance_clause]
    # THE PAGE, NOT THE LIE — the third interlude to take this fix, and for
    # the same measured reason as `frame_the_missing_third_returns`. What
    # this beat is about is the rite, and the rite leaves a page in the
    # chronicle however the house wrote it up; the Embellish is one telling
    # of it and costs four fifths of the reach. Measured over sixty runs:
    # `the_drowning_lie` existed in NONE of them and both interludes that
    # read it were eligible in none, while `the_drowning` itself leaves its
    # page in three runs in twenty-four. A premise nobody can reach is not a
    # premise; it is a folder.
    #
    # The returning beat, so it takes the page and lets the line be whatever
    # the house wrote: what the guardian withholds is not a correction, it is
    # everything he could add and never does.
    reads:
      - { chronicled: the_drowning }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Every so many generations a boy goes under for nine days and comes up
      changed or does not come up changed, and the ledger takes a line for it
      either way. The guardian has never once added to that line.
      {NARRATOR.They} {NARRATOR.has} {NARRATOR.their} reasons.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: The last of the blood has stopped asking what the reasons are.

  # ── What the record now says about its own copies ────────────────────────
  # The frame reads Discrepancies, so every new record-bearing scene is new
  # material for this table and the four below are the archive's. There is a
  # reason they read as one movement: what the house did in all four cases was
  # let somebody else hold the pen, and then write down that it had not.
  - id: frame_the_index_in_another_hand
    title: Eleven Quires
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, records, archive]
    purposes: [advance_clause, buy_patience, plant_rumour]
    reads:
      - { discrepancy: the_index_out_of_the_house, state: open }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      The page for that century says the presses of this house have never been
      indexed by any hand but the family's own, and it says so in a hand that
      is beautiful and is the family's, and the guardian does not look up from
      it. Somewhere east of here, in a room nobody living has been shown, there
      are eleven quires that say otherwise and have said so, patiently, in a
      woman's careful lettering, for a very long time.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            She was paid five marks a year and let go in a thin autumn, and
            what she made outlasted the wing it was made in.

  - id: frame_the_copy_that_was_short
    title: Ten Years and a Half
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, records, law]
    purposes: [advance_clause, change_relationship, force_record_choice]
    reads:
      - { discrepancy: the_short_copy_at_cawdry, state: open }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Eleven clear years, the page says, copied fair and accepted at the assize
      without a question asked. The guardian turns back a leaf, and turns back
      another, and the margin dates run straight on through an autumn that is
      not there, ruled first and filled after, exactly as they were ruled and
      filled by a man who never once said what he thought of being asked.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            A gap in a fair hand is the only kind anybody ever notices, which
            is why it was made in one.

  - id: frame_read_out_in_a_hall_at_cawdry
    title: Item Nine
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, records, law]
    purposes: [advance_clause, force_record_choice, test_magic_rule]
    # THE PAGE, NOT THE OBJECTION. The advocate reads the cellar location
    # aloud in every branch of `archive_read_back_at_the_assize`; the
    # discrepancy below it only exists when the house objects or embellishes.
    # Making the interlude wait on that narrower account turns an event about
    # an external provincial record into an event about the chronicler's hand.
    # Issue #139 follows the same page-vs-lie distinction already measured on
    # the Drowning and the missing Regalia.
    reads:
      - { chronicled: archive_read_back_at_the_assize }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      There is a page for an afternoon in a provincial record office where a
      bored advocate read out where a box is kept in a cellar, for a date, in
      a suit about a weir. Whether the family kept that fact, left the page
      blank, or wrote that nothing of theirs was entered, the clerk's copy is
      still there. It has been entered longer now than the wing that box was
      carried out of has been standing, and the ninth line of the contract is
      not a difficult line, and everyone who has ever read it has understood
      it the same way and hoped otherwise.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            What is written by the debtor is not evidence. Somebody wrote that
            down for us, in advance, and we filed it.

  - id: frame_nothing_worth_the_ink
    title: In the Ordinary Way
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, records, birth]
    purposes: [advance_clause, buy_patience, test_magic_rule]
    # READS THE PAGE, not the lie on it — the fourth interlude to take this
    # fix and the first that needed its opening rewritten to take it.
    #
    # `{ discrepancy: the_ordinary_birth }` waited on the sickroom firing
    # (14 runs in 30) AND the chronicler embellishing it (one in five), which
    # measured out at 2 runs in 60 eligible, and the first clause of the old
    # body quoted that embellishment word for word — which is why this was
    # filed with `frame_two_of_three` as one of the two that could not read
    # the page. The body was the obstacle, not the premise. What the guardian
    # has to say about that fortnight is true of a careful account, a
    # flattering one and a dated blank alike, and it is better for not knowing
    # which it is looking at.
    reads:
      - { chronicled: the_rule_of_the_sickroom }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      There is a page for the eleven days, and whatever the family chose to
      set down on it — the careful account, the kind one, or the dated blank
      that is itself a kind of account — the page is about a room. The
      guardian has stood at more of those beds than the page has years.
      {NARRATOR.They} {NARRATOR.has} watched the iron laid across a threshold
      go dull along its whole length in about the time it takes a person to
      notice it, and {NARRATOR.they} {NARRATOR.has} not in eleven hundred
      years found the sentence for what that was. A room is the one thing the
      record has ever been good at, and it does not lie about this one. It
      lies by being equal to it.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            Nothing worth the ink is what the family said of that fortnight at
            the time, and read one way it is the truest sentence any of them
            ever spoke. Read the other way it is the only lie in the book that
            has ever mattered.


  # ── What the record says about the three ─────────────────────────────────
  # The frame rations off its own ledger (`world.frame`), not the ambient
  # budget, so an interlude costs the rest of the game nothing. These five read
  # the Regalia drop's record layer: a short minute, a ring, a rule that held
  # for two hundred years, and a sheet of paper that stopped being ink.
  - id: frame_the_short_minute
    title: Three Nouns, and a Minute With Two
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, regalia, records]
    purposes: [advance_clause, change_standing, test_magic_rule]
    reads:
      - { discrepancy: the_heralds_short_minute, state: open }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      The heralds asked to see three things and were shown one, and the minute
      they wrote is the oldest account of these objects that anybody outside
      this family has ever made, and it names the seal and stops. The guardian
      has had a very long time to consider that stopping. A house is a word
      other people use about you when you are not in the room, and for four
      hundred years the word other people have had has been missing two of its
      three parts, and nobody outside ever asked why because nobody outside
      ever knew there were three.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            A good lunch, that afternoon. The family has always been very good
            at lunches.

  - id: frame_what_the_ring_cost
    title: Both of Them Were Trouble
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, regalia, madness]
    purposes: [advance_clause, change_relationship, test_magic_rule]
    reads:
      - { discrepancy: what_the_ring_costs, state: open }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Never cost the house a thing the house was not glad to give, the page
      says, of two people four hundred years apart, and the page is in the
      hand of somebody who met neither of them. The guardian met both.
      {NARRATOR.They} do{NARRATOR.es} not say so and {NARRATOR.they}
      do{NARRATOR.es} not correct the page, and the not-correcting has by now
      gone on longer than either of those two lives, and is beginning to look,
      even to {NARRATOR.them}, like a kind of agreement.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            They were glad to give it. That is the part the page has right and
            the part nobody has ever been able to bear.

  - id: frame_the_rule_of_two
    title: What Was Always in the Room
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, regalia, knowledge]
    purposes: [advance_clause, establish_magic_rule, worldbuild_through_action]
    reads:
      - { discrepancy: the_rule_of_two, state: open }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Eleven years of a ruled notebook, and the weather written down before
      breakfast, and one column nobody had thought to keep — and it is the best
      work this family ever did, and it is in the book as a finding, and it is
      wrong. The fire was in the room. It was in the room for every trial in
      the notebook and for every trial in two hundred years of trials, because
      a family does not test a thing it cares about in a cold room, and nobody
      writes down a fire.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            They were right to believe it. That is a different sentence from
            the one they wrote, and it is the only one still standing.

  - id: frame_one_word_and_eight_days
    title: One Word, and Eight Days
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, contract, records]
    purposes: [advance_clause, buy_patience, establish_magic_rule]
    reads:
      - { discrepancy: the_second_obligation_lie, state: open }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Recorded in the founder's own hand and kept without interruption or
      ambiguity since the year of the signing, the page says, and the page has
      said it in eleven copies and nine hands and has never once been made to
      say anything else. Both half-sheets are still in the box. The guardian
      wrote one of them on a night {NARRATOR.they} can still describe and the
      other eight days later out of a memory {NARRATOR.they} already did not
      trust, and of everything {NARRATOR.they} {NARRATOR.has} been unable to
      say to this family in five hundred years, that is the one
      {NARRATOR.they} {NARRATOR.has} come closest to saying.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            The guardian would tell them now, if telling them now were a thing
            that could be done. It is very late to be finding that out.

  - id: frame_the_colour_of_its_own_paper
    title: The Colour of Its Own Paper
    tier: frame
    frequency: rare
    weight: 100
    repeatable: false
    cooldownYears: 0
    tags: [frame, contract, omen]
    purposes: [advance_clause, test_magic_rule, worldbuild_through_action]
    # THE PAGE, NOT THE HOUSE'S EXPLANATION. On the current main full gate this
    # is the rarest frame outcome: 2 fires in 800 Long Lines (0.25%). The
    # incident itself happens in every branch of `eight_days_and_then_it_did`;
    # this Discrepancy only exists when the house holds the old practice or
    # blames damp. That extra conjunction is exactly #139's thin-tail shape.
    reads:
      - { chronicled: eight_days_and_then_it_did }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      The guardian turns to the date of a wet autumn afternoon and stops. Some
      hands name the ink and the dogs, some call it damp, and some leave the
      line blank. {NARRATOR.They} do{NARRATOR.es} not need the sentence.
      {NARRATOR.They} {NARRATOR.was} there when the dogs stood outside with
      their backs to the hall and the second obligation went the colour of its
      own paper. What the record chose was an ordinary cause, an impossible
      fact, or silence, and all three sit in the same place where an answer
      ought to have been. The page says enough.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            That is not a lie and it is not the truth. It is the family's whole
            method, and it very nearly worked.

  # ── The baseline five ────────────────────────────────────────────────────
  #
  # Every interlude above this line is gated on one `read` — a Discrepancy
  # standing open, a clause recovered, a tale in circulation. That is what the
  # frame is FOR, and it is also why the frame nearly never happened.
  #
  # Measured: sampled every fifty years across a run, the eligible pool held
  # ZERO scenes at almost every sample. Four runs of one build, driven through
  # the docket as a player answers it, produced 2, 13, 15 and 3 interludes,
  # with silences long enough to swallow whole generations. Two of those players get no
  # creditor, no rising dread in the present, and no reason for the last night
  # to land on anything — and the frame is the promise the whole tale is read
  # against (§2).
  #
  # These five read nothing. They are what the table has when the record has
  # given the guardian nothing new to say, which across a full campaign is
  # most nights. Repeatable, with a long cooldown, because a creditor who says
  # a version of the same thing twice in three hundred years is the register.
  #
  # WEIGHTED WELL BELOW the gated scenes (28-34 against 100). A baseline is
  # what the table has when the record has given the guardian nothing new to
  # say; it must never be what the table reaches for when the record HAS.
  # `arcs.slow.test.ts` caught the first cut of this immediately — at weight
  # 100+ they crowded out `frame_the_northern_house`, which is the exact
  # failure the whole batch test exists to find.

  - id: frame_the_grates_and_the_hour
    title: Seven Grates, One Lit
    tier: frame
    frequency: rare
    weight: 34
    repeatable: true
    cooldownYears: 140
    tags: [frame, baseline]
    purposes: [buy_patience, plant_rumour, test_magic_rule]
    # There is a chronicle and it says something. The plainest reading the
    # guardian can make, and the one that is always available.
    reads:
      - { recorded: { atLeast: 1 } }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      There are seven grates in the long room and one of them is lit, which is
      how it has been on every night of this kind, in a house that has had
      three roofs and four names and has never once been warm from end to end.
      The guardian sits where the guardian sits. {NARRATOR.They}
      {NARRATOR.has} been sitting there since before the oldest thing in the
      room was made, and the chair beneath {NARRATOR.them} is a hundred and
      forty years old, and both of these are true.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            Few now remember what the other six were for. The house has been
            careful, across eight centuries, never to be the one to ask.

  - id: frame_the_hour_the_clocks_agree
    title: Four Minutes
    tier: frame
    frequency: rare
    weight: 32
    repeatable: true
    cooldownYears: 150
    tags: [frame, baseline]
    purposes: [buy_patience, establish_magic_rule, force_record_choice]
    reads:
      - { recorded: { atLeast: 2 } }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      Somewhere between one page and the next the clocks in the house lose four
      minutes, all of them, together, as they have on this night for longer
      than anyone has kept the habit of noticing. The guardian does not look
      up. Whatever takes the four minutes has never taken anything else, and
      has never taken them from anywhere but here.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            The clockmaker at Wick, who came twice and would not come a third
            time, wrote that the mechanisms were faultless. He wrote it in a
            hand that got smaller toward the end of the line.

  - id: frame_what_the_table_was
    title: The Length of the Table
    tier: frame
    frequency: rare
    weight: 30
    repeatable: true
    cooldownYears: 160
    tags: [frame, baseline]
    purposes: [advance_clause, change_standing, establish_magic_rule]
    reads:
      - { recorded: { atLeast: 3 } }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      The table is long enough for thirty and there are two, and it was built
      long because in the year it was built there were thirty, and the hall was
      loud, and the man who ordered it made of it a joke about how much louder
      it would be by the time his grandsons had it. He was not wrong about the
      grandsons. There is a great deal of table between the two of them now,
      and the far end of it is dark, and the wood there has never been worn by
      anybody's elbows.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            It is a fine piece of work. Whatever else is said of the house, it
            bought well, in the century when it could.

  - id: frame_the_page_he_does_not_turn
    title: A Page Left Face Down
    tier: frame
    frequency: rare
    weight: 30
    repeatable: true
    cooldownYears: 150
    tags: [frame, baseline, record]
    purposes: [advance_clause, establish_magic_rule, force_record_choice]
    # A page nobody agrees about needs the family to have left one — this is
    # the interlude for a house that omits.
    reads:
      - { omitted: { atLeast: 1 } }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      There is a page the guardian turns past every time, and {NARRATOR.they}
      turn{NARRATOR.s} past it at the same speed {NARRATOR.they}
      turn{NARRATOR.s} the others, which is the only reason anybody ever
      noticed. It has been read aloud in this room perhaps four times in eight
      hundred years, each time by somebody who did not know it was the page,
      and each of those four accounts of it disagrees with the other three
      about what is on it.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            Whether the disagreement is in the accounts or in the page, the
            chronicle does not say. It was, after all, written by the house.

  - id: frame_the_ninth_name_unspoken
    title: Eight of Nine
    tier: frame
    frequency: rare
    weight: 28
    repeatable: true
    cooldownYears: 190
    tags: [frame, baseline, myth]
    purposes: [advance_clause, plant_rumour, test_magic_rule]
    reads:
      - { recorded: { atLeast: 4 } }
    slots:
      LISTENER_A: { role: listener_blood }
      LISTENER_B: { role: listener_record }
    body: >-
      The Church keeps nine names and speaks eight of them, and has explained
      the ninth in four different ways across as many centuries, each
      explanation complete and none of them the same. The guardian was in a
      room once where somebody tried the ninth. {NARRATOR.They} {NARRATOR.has}
      never said what happened and {NARRATOR.they} {NARRATOR.has} never said
      that nothing did, and the difference between those two silences is the
      whole of what the family has to go on.
    interaction:
      kind: narration
      outcomes:
        - id: only
          weight: 100
          text: >-
            There is a third account of that room, in a hand nobody has since
            identified, which gives no name at all and records only the hour.

proseVariants:
  - address: "content:events/frame.yaml#events[id=frame_the_seal_still_west].title"
    of: "0bfa3e55f85ffc39"
    plainenglish: >-
      A Box Kept in Someone Else's House
  - address: "content:events/frame.yaml#events[id=frame_the_seal_still_west].body"
    of: "3363c161f437397d"
    plainenglish: >-
      Tonight two of the seven fireplaces are lit, one more than usual. The
      guardian has not mentioned the Seal in the last eleven tellings, and
      does not mention it now.
  - address: "content:events/frame.yaml#events[id=frame_the_seal_still_west].interaction.outcomes[id=only].text"
    of: "417c62fababc8cf6"
    plainenglish: >-
      Long ago, someone called it a loan. Nobody has corrected that since.
  - address: "content:events/frame.yaml#events[id=frame_what_the_ledger_says_of_the_seal].title"
    of: "15c8f89dd6d956e1"
    plainenglish: >-
      A Trusted Branch of the Family
  - address: "content:events/frame.yaml#events[id=frame_what_the_ledger_says_of_the_seal].body"
    of: "dfa12bbee74e2b52"
    plainenglish: >-
      There is a page about the letter from the western line. It is polite and witnessed by a
      notary, and it names the house that had the Seal when the letter came. Whatever the family
      wrote underneath it, whether admitting fault, leaving a dated blank, or inventing a
      trusted branch of the family, the guardian was in the room when that answer was chosen.
      Whether the Seal came home afterwards was a separate matter, paid for in money or in
      pride. The letter stayed.
  - address: "content:events/frame.yaml#events[id=frame_what_the_ledger_says_of_the_seal].interaction.outcomes[id=only].text"
    of: "38fd6bf0cef44b3c"
    plainenglish: >-
      The last of the blood reads it twice, more slowly the second time, and asks nothing.
  - address: "content:events/frame.yaml#events[id=frame_two_of_three].title"
    of: "2d32a0b732495783"
    plainenglish: >-
      The Missing Third Piece
  - address: "content:events/frame.yaml#events[id=frame_two_of_three].body"
    of: "a71e3f8abe116de6"
    plainenglish: >-
      The record says the set is complete. The guardian counts on fingers that
      are no longer real fingers, out of a habit that outlived the hand.
      {NARRATOR.They} get{NARRATOR.s} to two, as {NARRATOR.they} always
      get{NARRATOR.s} to two, and stop{NARRATOR.s} there, as {NARRATOR.they}
      always stop{NARRATOR.s} there.
  - address: "content:events/frame.yaml#events[id=frame_two_of_three].interaction.outcomes[id=only].text"
    of: "9a89fc76c8493b6a"
    plainenglish: >-
      Whatever the ritual was for, it has still not been paid.
  - address: "content:events/frame.yaml#events[id=frame_the_cost_not_written].title"
    of: "d2c8924ed5e6bf32"
    plainenglish: >-
      What the Book Left Out
  - address: "content:events/frame.yaml#events[id=frame_the_cost_not_written].body"
    of: "bdf9702a47707096"
    plainenglish: >-
      A hundred years ago, somewhere in this house, a water trough was filled
      and then emptied. The record gives the year and the boy's name, and says
      nothing at all about the cold. The guardian was cold that night.
      {NARRATOR.They} {NARRATOR.is} not cold now, because being cold is
      something only living bodies do.
  - address: "content:events/frame.yaml#events[id=frame_the_cost_not_written].interaction.outcomes[id=only].text"
    of: "e578880dbe479b91"
    plainenglish: >-
      The last of the blood asks, once, whether it hurt. {NARRATOR.They}
      answer{NARRATOR.s} a different question.
  - address: "content:events/frame.yaml#events[id=frame_the_second_time].title"
    of: "cfe14f40b34c62b4"
    plainenglish: >-
      Nine Days, Happening Twice
  - address: "content:events/frame.yaml#events[id=frame_the_second_time].body"
    of: "586bebbcfe2ea718"
    plainenglish: >-
      It happened again, two hundred years later, the same in every way that matters, and there
      is a second page for it. That page may call it a rediscovery, admit that the house already
      knew, or say nothing. The guardian turns to it without being told where it is.
  - address: "content:events/frame.yaml#events[id=frame_the_second_time].interaction.outcomes[id=only].text"
    of: "9251dfb2bdaf0886"
    plainenglish: >-
      Some debts get paid twice, because the first receipt was thrown away on purpose.
  - address: "content:events/frame.yaml#events[id=frame_nine_libraries].title"
    of: "cdbfb2df1ba472f3"
    plainenglish: >-
      The Books That Burned, and the Ones Kept
  - address: "content:events/frame.yaml#events[id=frame_nine_libraries].body"
    of: "8441c606c25af87a"
    plainenglish: >-
      The page says: we rode out and saved what could be saved, and what we kept, we kept in
      trust for others. The guardian has heard the house tell this story proudly in three
      different centuries, in three different voices.
  - address: "content:events/frame.yaml#events[id=frame_nine_libraries].interaction.outcomes[id=only].text"
    of: "e209adcb84ddf72f"
    plainenglish: >-
      {NARRATOR.They} do{NARRATOR.es} not say what the house really kept.
      Tonight, the record does not say either.
  - address: "content:events/frame.yaml#events[id=frame_the_northern_house].title"
    of: "112d2974106a1540"
    plainenglish: >-
      Never Heard From Again
  - address: "content:events/frame.yaml#events[id=frame_the_northern_house].body"
    of: "24055198ab36f21c"
    plainenglish: >-
      She was nineteen, and the page she appears on is the last page that
      mentions her. Whatever it says happened, and the guardian has read it
      more often than the family ever did, the account stops there. It stops
      the way {NARRATOR.their} own sentences stop when {NARRATOR.they}
      {NARRATOR.has} decided something is not to be told. By now, the last of
      the blood has learned what that silence is hiding.
  - address: "content:events/frame.yaml#events[id=frame_the_northern_house].interaction.outcomes[id=only].text"
    of: "604d91f4547358c0"
    plainenglish: >-
      Nobody at this table will be the one to ask {NARRATOR.them} to finish
      the story.
  - address: "content:events/frame.yaml#events[id=frame_the_short_account].title"
    of: "9ea583b7c986040b"
    plainenglish: >-
      Three Other Versions
  - address: "content:events/frame.yaml#events[id=frame_the_short_account].body"
    of: "10b128f3438fefef"
    plainenglish: >-
      Decades later, someone else's record said more about 1341 than the house's own record did,
      and it said it to men with the power to keep repeating it. Ever since the day the tea went
      cold, the guardian has known which version would win.
  - address: "content:events/frame.yaml#events[id=frame_the_short_account].interaction.outcomes[id=only].text"
    of: "a3f398dddb06ff89"
    plainenglish: >-
      Being caught out costs more than telling the truth would have. It always does.
  - address: "content:events/frame.yaml#events[id=frame_the_bought_silence].title"
    of: "116fd22bf3d561b7"
    plainenglish: >-
      Eighty Years of Nobody Looking Closely
  - address: "content:events/frame.yaml#events[id=frame_the_bought_silence].body"
    of: "0320eff76bc9dfd3"
    plainenglish: >-
      A fine, a minor heresy confessed, and a great deal of tea left to go
      cold: with that, the house bought eighty years in which nobody asked any
      more questions. The guardian thinks it was cheap. {NARRATOR.They}
      {NARRATOR.has} never once said so where the record could hear
      {NARRATOR.them}.
  - address: "content:events/frame.yaml#events[id=frame_the_bought_silence].interaction.outcomes[id=only].text"
    of: "63737510146375a4"
    plainenglish: >-
      The last of the blood works out the cost anyway, and agrees that it was cheap.
  - address: "content:events/frame.yaml#events[id=frame_the_west_house_again].title"
    of: "a872451bb0bffc4f"
    plainenglish: >-
      Still Never Corrected
  - address: "content:events/frame.yaml#events[id=frame_the_west_house_again].body"
    of: "e8a75e6a5e0c4b9e"
    plainenglish: >-
      Another telling, and another generation that has never once seen the Seal in this house,
      and on paper it is still a loan. The guardian has stopped expecting anyone to ask who is
      supposed to collect it.
  - address: "content:events/frame.yaml#events[id=frame_the_west_house_again].interaction.outcomes[id=quiet].text"
    of: "05a8576595911b41"
    plainenglish: >-
      A debt this old has mostly stopped being a debt and turned into part of the furniture.
  - address: "content:events/frame.yaml#events[id=frame_the_west_house_again].interaction.outcomes[id=pointed].text"
    of: "9d47ca3451f13508"
    plainenglish: >-
      The last of the blood looks at the empty spot on the wall where a box like that would sit,
      and says nothing about that either.
  - address: "content:events/frame.yaml#events[id=frame_the_keeping_of_it].title"
    of: "ac97b98bfd1a0ca7"
    plainenglish: >-
      The Branch That Never Existed
  - address: "content:events/frame.yaml#events[id=frame_the_keeping_of_it].body"
    of: "4a81eb3120d8f4a5"
    plainenglish: >-
      Every so often someone asks which branch of the family is looking after
      the Seal. They mean it kindly, as small talk. The guardian answers with
      a name {NARRATOR.they} {NARRATOR.has} had ready for a very long time. It
      is not a real branch.
  - address: "content:events/frame.yaml#events[id=frame_the_keeping_of_it].interaction.outcomes[id=only].text"
    of: "f40df4adb4556951"
    plainenglish: >-
      {NARRATOR.They} tell{NARRATOR.s} the story well. {NARRATOR.They}
      {NARRATOR.has} had hundreds of years to get the details right.
  - address: "content:events/frame.yaml#events[id=frame_the_missing_third_returns].title"
    of: "1b60429d25466ed9"
    plainenglish: >-
      Counting Them Again
  - address: "content:events/frame.yaml#events[id=frame_the_missing_third_returns].body"
    of: "95045848c3785ac4"
    plainenglish: >-
      In the story, someone is always about to count the family treasures again. The guardian
      already knows the number, and watches them reach for the box anyway. In nine hundred
      years, two out of three has never become three out of three.
  - address: "content:events/frame.yaml#events[id=frame_the_missing_third_returns].interaction.outcomes[id=only].text"
    of: "249036a393e8eb2f"
    plainenglish: >-
      The guardian could tell them. {NARRATOR.They} never {NARRATOR.has}.
  - address: "content:events/frame.yaml#events[id=frame_the_drowning_remembered].title"
    of: "d115b58782c1f723"
    plainenglish: >-
      The Water Trough Is Still Filled
  - address: "content:events/frame.yaml#events[id=frame_the_drowning_remembered].body"
    of: "1b41d49b56adfcc7"
    plainenglish: >-
      Every few generations a boy goes under the water for nine days and comes
      up changed, or comes up unchanged, and the record gives it one line
      either way. The guardian has never once added to that line.
      {NARRATOR.They} {NARRATOR.has} {NARRATOR.their} reasons.
  - address: "content:events/frame.yaml#events[id=frame_the_drowning_remembered].interaction.outcomes[id=only].text"
    of: "178d892e235b994a"
    plainenglish: >-
      The last of the blood has stopped asking what the guardian's reasons
      are.
  - address: "content:events/frame.yaml#events[id=frame_the_index_in_another_hand].title"
    of: "cca6ab255e11d691"
    plainenglish: >-
      Eleven Bound Sections
  - address: "content:events/frame.yaml#events[id=frame_the_index_in_another_hand].body"
    of: "ecfa072abdbc05d6"
    plainenglish: >-
      The page for that century says that nobody outside the family has ever indexed this
      house's bookcases. It says so in beautiful handwriting that belongs to the family, and the
      guardian does not look up from it. Somewhere to the east, in a room nobody alive has been
      shown, there are eleven bound sections that say otherwise. They have said so patiently, in
      a woman's careful lettering, for a very long time.
  - address: "content:events/frame.yaml#events[id=frame_the_index_in_another_hand].interaction.outcomes[id=only].text"
    of: "436888c2f09188ae"
    plainenglish: >-
      She was paid five marks a year and let go in a poor autumn, and what she made has
      outlasted the wing she made it in.
  - address: "content:events/frame.yaml#events[id=frame_the_copy_that_was_short].title"
    of: "7d91461d3561d6f1"
    plainenglish: >-
      Ten and a Half Years
  - address: "content:events/frame.yaml#events[id=frame_the_copy_that_was_short].body"
    of: "dcec435c860a0f68"
    plainenglish: >-
      The page says: eleven clean years, neatly copied and accepted by the court without a
      single question. The guardian turns back one page, then another. The dates in the margin
      run straight through an autumn that is not there. They were ruled first and filled in
      afterwards, exactly as they always were, by a man who never once said what he thought of
      being asked.
  - address: "content:events/frame.yaml#events[id=frame_the_copy_that_was_short].interaction.outcomes[id=only].text"
    of: "ee34eb1e498ccf1a"
    plainenglish: >-
      The only gaps anyone ever notices are gaps in messy handwriting, which is why this one was
      made in neat handwriting.
  - address: "content:events/frame.yaml#events[id=frame_read_out_in_a_hall_at_cawdry].title"
    of: "97e2a6aae4bc2da6"
    plainenglish: >-
      Line Nine
  - address: "content:events/frame.yaml#events[id=frame_read_out_in_a_hall_at_cawdry].body"
    of: "b1e10896b2d56a52"
    plainenglish: >-
      There is a page about an afternoon in a provincial records office. During a lawsuit about
      a weir, a bored lawyer read out, for the record, where a certain box is kept in a cellar.
      Whether the family wrote that fact down, left the page blank, or wrote that nothing of
      theirs was recorded, the clerk's copy is still there. It has now been on record longer
      than the wing the box was carried out of has been standing. The ninth line of the pact is
      not a difficult line. Everyone who has ever read it has understood it the same way, and
      hoped they were wrong.
  - address: "content:events/frame.yaml#events[id=frame_read_out_in_a_hall_at_cawdry].interaction.outcomes[id=only].text"
    of: "7749746ef2fa8532"
    plainenglish: >-
      What the debtor writes does not count as evidence. Someone wrote that down for us in
      advance, and we filed it away.
  - address: "content:events/frame.yaml#events[id=frame_nothing_worth_the_ink].title"
    of: "40399202d0cb4c76"
    plainenglish: >-
      In the Usual Way
  - address: "content:events/frame.yaml#events[id=frame_nothing_worth_the_ink].body"
    of: "606c75d4d72deff0"
    plainenglish: >-
      There is a page for the eleven days of mourning. Whatever the family
      chose to write on it, a careful account, a kind one, or a dated blank,
      which is a kind of account in itself, the page is about a room. The
      guardian has stood beside more of those deathbeds than the page has
      years. {NARRATOR.They} {NARRATOR.has} watched iron laid across a doorway
      turn dull along its whole length in about the time it takes someone to
      notice. In eleven hundred years {NARRATOR.they} {NARRATOR.has} not found
      the words for what that was. Describing a room is the one thing the
      record has always been good at, and it does not lie about this one. It
      lies by treating it as ordinary.
  - address: "content:events/frame.yaml#events[id=frame_nothing_worth_the_ink].interaction.outcomes[id=only].text"
    of: "fa4c5a6eea9df64a"
    plainenglish: >-
      At the time, the family said those two weeks were 'not worth the ink'. Read one way, it is
      the truest thing any of them ever said. Read the other way, it is the only lie in the book
      that has ever mattered.
  - address: "content:events/frame.yaml#events[id=frame_the_short_minute].title"
    of: "17beceee1f54bbb2"
    plainenglish: >-
      Three Things Named, and a Record of Only One
  - address: "content:events/frame.yaml#events[id=frame_the_short_minute].body"
    of: "4b952b2cfede8618"
    plainenglish: >-
      The heralds asked to see three objects and were shown one. The note they wrote is the
      oldest description of these objects ever made by anyone outside this family, and it names
      the seal and stops. The guardian has had a very long time to think about that stop. A
      house is a word other people use about you when you are not in the room. For four hundred
      years, the word other people have had has been missing two of its three parts, and nobody
      outside ever asked why, because nobody outside ever knew there were three.
  - address: "content:events/frame.yaml#events[id=frame_the_short_minute].interaction.outcomes[id=only].text"
    of: "629c96de0539a642"
    plainenglish: >-
      It was a good lunch that afternoon. The family has always been very good at lunches.
  - address: "content:events/frame.yaml#events[id=frame_what_the_ring_cost].title"
    of: "c0d89b0faeeab9a3"
    plainenglish: >-
      Two People, Both of Them Trouble
  - address: "content:events/frame.yaml#events[id=frame_what_the_ring_cost].body"
    of: "54efe4b596945049"
    plainenglish: >-
      The page says of two people, four hundred years apart, that they never
      cost the house anything it was not glad to give. It is written by
      someone who never met either of them. The guardian met both.
      {NARRATOR.They} do{NARRATOR.es} not say so, and {NARRATOR.they}
      do{NARRATOR.es} not correct the page. The guardian has now gone without
      correcting it for longer than either of their lives lasted, and even to
      {NARRATOR.them} it is starting to look like a kind of agreement.
  - address: "content:events/frame.yaml#events[id=frame_what_the_ring_cost].interaction.outcomes[id=only].text"
    of: "6946951f7a5cd78b"
    plainenglish: >-
      They were glad to give it. That is the part the page gets right, and the part nobody has
      ever been able to bear.
  - address: "content:events/frame.yaml#events[id=frame_the_rule_of_two].title"
    of: "59017ff02af95aa4"
    plainenglish: >-
      What Was in the Room the Whole Time
  - address: "content:events/frame.yaml#events[id=frame_the_rule_of_two].body"
    of: "7e8028603b7221ec"
    plainenglish: >-
      Eleven years of a lined notebook, the weather recorded before breakfast, and one column
      nobody else had thought to keep. It is the best work this family ever did. It is in the
      book as a discovery, and it is wrong. The fire was in the room. It was in the room for
      every test in the notebook, and for every test over two hundred years, because a family
      does not test something it cares about in a cold room, and nobody writes down that a fire
      was lit.
  - address: "content:events/frame.yaml#events[id=frame_the_rule_of_two].interaction.outcomes[id=only].text"
    of: "4520d02b71746287"
    plainenglish: >-
      They were right to believe it. That is a different sentence from the one they wrote, and
      it is the only one still true.
  - address: "content:events/frame.yaml#events[id=frame_one_word_and_eight_days].title"
    of: "48ac7da4dafd35b0"
    plainenglish: >-
      One Word, and Eight Days Later
  - address: "content:events/frame.yaml#events[id=frame_one_word_and_eight_days].body"
    of: "f64fd75c2cf048c0"
    plainenglish: >-
      The page says it was written in the founder's own hand and has been kept
      without a break or any doubt since the year of the signing. It has said
      so in eleven copies, in nine different handwritings, and has never once
      been made to say anything else. Both half-sheets are still in the box.
      The guardian wrote one of them on a night {NARRATOR.they} can still
      describe, and the other eight days later, from a memory {NARRATOR.they}
      already did not trust. Of everything {NARRATOR.they} {NARRATOR.has} been
      unable to tell this family in five hundred years, that is the thing
      {NARRATOR.they} {NARRATOR.has} come closest to telling.
  - address: "content:events/frame.yaml#events[id=frame_one_word_and_eight_days].interaction.outcomes[id=only].text"
    of: "f6530205571f9e61"
    plainenglish: >-
      The guardian would tell them now, if telling them now were still
      possible. It is very late to be finding that out.
  - address: "content:events/frame.yaml#events[id=frame_the_colour_of_its_own_paper].title"
    of: "9f32d2b940229a4d"
    plainenglish: >-
      The Ink Faded to the Colour of the Paper
  - address: "content:events/frame.yaml#events[id=frame_the_colour_of_its_own_paper].body"
    of: "008bcf5c1c58b398"
    plainenglish: >-
      The guardian turns to the date of a wet autumn afternoon and stops. Some
      writers mention the ink and the dogs, some blame damp, and some leave
      the line blank. {NARRATOR.They} do{NARRATOR.es} not need the sentence.
      {NARRATOR.They} {NARRATOR.was} there when the dogs stood outside with
      their backs to the hall, and the writing of the second obligation faded
      to the colour of its own paper. The record chose an ordinary cause, an
      impossible fact, or silence, and all three sit in the place where an
      answer should have been. The page says enough.
  - address: "content:events/frame.yaml#events[id=frame_the_colour_of_its_own_paper].interaction.outcomes[id=only].text"
    of: "a4a56b6ab6648bd6"
    plainenglish: >-
      That is not a lie, and it is not the truth. It is the family's whole method, and it very
      nearly worked.
  - address: "content:events/frame.yaml#events[id=frame_the_grates_and_the_hour].title"
    of: "1d547fcf989cfc33"
    plainenglish: >-
      Seven Fireplaces, One Lit
  - address: "content:events/frame.yaml#events[id=frame_the_grates_and_the_hour].body"
    of: "1fc6cf3491f959b0"
    plainenglish: >-
      The long room has seven fireplaces, and one is lit, as on every night
      like this. The house has had three roofs and four names, and it has
      never once been warm from end to end. The guardian sits where the
      guardian always sits. {NARRATOR.They} {NARRATOR.has} been sitting there
      since before the oldest thing in the room was made, and the chair under
      {NARRATOR.them} is a hundred and forty years old, and both of those
      things are true.
  - address: "content:events/frame.yaml#events[id=frame_the_grates_and_the_hour].interaction.outcomes[id=only].text"
    of: "e04934798e407945"
    plainenglish: >-
      Few people now remember what the other six fires were for. For eight centuries the house
      has been careful never to be the one who asks.
  - address: "content:events/frame.yaml#events[id=frame_the_hour_the_clocks_agree].title"
    of: "200eced44ba85328"
    plainenglish: >-
      Four Lost Minutes
  - address: "content:events/frame.yaml#events[id=frame_the_hour_the_clocks_agree].body"
    of: "f3d3fd7538b63759"
    plainenglish: >-
      Somewhere between one page and the next, every clock in the house loses four minutes, all
      of them together, as they have on this night for longer than anyone has bothered to
      notice. The guardian does not look up. Whatever takes the four minutes has never taken
      anything else, and has never taken them from anywhere but here.
  - address: "content:events/frame.yaml#events[id=frame_the_hour_the_clocks_agree].interaction.outcomes[id=only].text"
    of: "8c63367ae5e2ed6e"
    plainenglish: >-
      The clockmaker from Wick came twice and would not come a third time. He wrote that the
      clocks had nothing wrong with them, and his handwriting got smaller towards the end of the
      line.
  - address: "content:events/frame.yaml#events[id=frame_what_the_table_was].title"
    of: "16b8ce2ec6546e5a"
    plainenglish: >-
      How Long the Table Is
  - address: "content:events/frame.yaml#events[id=frame_what_the_table_was].body"
    of: "fb84c31c73cc0300"
    plainenglish: >-
      The table seats thirty and there are two people at it. It was built long because, in the
      year it was made, there were thirty, the hall was loud, and the man who ordered it joked
      about how much louder it would be by the time his grandsons had it. He was not wrong about
      the grandsons. Now there is a great deal of table between the two of them. The far end is
      dark, and the wood there has never been worn by anyone's elbows.
  - address: "content:events/frame.yaml#events[id=frame_what_the_table_was].interaction.outcomes[id=only].text"
    of: "0da3f94b231c9737"
    plainenglish: >-
      It is a fine piece of work. Whatever else is said about the house, it bought well, in the
      century when it could afford to.
  - address: "content:events/frame.yaml#events[id=frame_the_page_he_does_not_turn].title"
    of: "c861a1b769ff2aa3"
    plainenglish: >-
      A Page Always Skipped
  - address: "content:events/frame.yaml#events[id=frame_the_page_he_does_not_turn].body"
    of: "7e6862388174c6ac"
    plainenglish: >-
      There is one page the guardian always turns past. Every time,
      {NARRATOR.they} turn{NARRATOR.s} past it at exactly the same speed
      {NARRATOR.they} turn{NARRATOR.s} the others, and that is the only reason
      anyone ever noticed. In eight hundred years it has been read aloud in
      this room perhaps four times, each time by someone who did not know it
      was that page. Each of those four people describes it differently from
      the other three.
  - address: "content:events/frame.yaml#events[id=frame_the_page_he_does_not_turn].interaction.outcomes[id=only].text"
    of: "0b2899926d123d0e"
    plainenglish: >-
      Whether the difference is in the accounts or in the page itself, the chronicle does not
      say. It was, after all, written by the house.
  - address: "content:events/frame.yaml#events[id=frame_the_ninth_name_unspoken].title"
    of: "3576e47b2b351737"
    plainenglish: >-
      Eight Names Out of Nine
  - address: "content:events/frame.yaml#events[id=frame_the_ninth_name_unspoken].body"
    of: "fa3a17816f28c495"
    plainenglish: >-
      The Church keeps nine names and speaks eight of them. Over four
      centuries it has explained the ninth in four different ways, each
      explanation complete and none of them the same. The guardian was once in
      a room where someone tried saying the ninth. {NARRATOR.They}
      {NARRATOR.has} never said what happened, and {NARRATOR.they}
      {NARRATOR.has} never said that nothing happened, and the difference
      between those two silences is all the family has to go on.
  - address: "content:events/frame.yaml#events[id=frame_the_ninth_name_unspoken].interaction.outcomes[id=only].text"
    of: "1f84f0f9c7dd55bd"
    plainenglish: >-
      There is a third account of that room, in handwriting nobody has ever identified. It gives
      no name at all, and records only the hour.
