# CALLBACKS (#1898). See `arcs/callbacks.yaml` for the shape and why the
# decision starts them rather than the ambient draw.
#
# Each pair is the decision's page and its return. Neither asks anything: the
# question was the Match, the term or the waking itself, and the player has
# already answered it. What these add is the way back to that answer.
#
# Outcomes split on the person's sex, never on `canExpress`: a son's waking
# and a daughter's are different promises, and an outcome that sorted sons by
# the hidden font would tell the player what the genome is.
events:
  - id: the_match_made
    title: The Toasts
    tier: family
    frequency: common
    campaigns: [short, long]
    tags: [marriage, callback]
    purposes: [change_relationship, change_standing, establish_magic_rule]
    arc: { of: arc_the_match_come_to_something, node: the_match_made }
    slots:
      SUBJECT: { role: family_member, bind: arc, onMissing: cancel_arc }
      SPOUSE: { role: family_member, bind: arc, onMissing: cancel_arc }
    body: >-
      The terms are read twice at the long table, once for the house and once
      for the witnesses, and then the cups come out. {SUBJECT} and {SPOUSE}
      are married before the month is out. Nobody asks either of them what
      they hope for. The house hopes for children, and says so in every toast.
    interaction:
      kind: narration
      outcomes:
        - id: a_son_married
          weight: 100
          onlyIf: { slot: SUBJECT, filters: [{ sex: male }] }
          text: >-
            {SUBJECT} is a son of the blood with a wife at his side, and the
            house can count forward from him. It starts counting that night.
        - id: a_daughter_married
          weight: 100
          onlyIf: { slot: SUBJECT, filters: [{ not: { sex: male } }] }
          text: >-
            {SUBJECT} is a daughter of the blood, and worth what her sons will
            be. The house has named its price, and settles in to see it paid.

  - id: the_match_returned
    title: Looked At Again
    tier: family
    frequency: common
    campaigns: [short, long]
    tags: [marriage, callback]
    purposes: [change_relationship, buy_patience, plant_rumour]
    arc: { of: arc_the_match_come_to_something, node: the_match_returned }
    slots:
      SUBJECT: { role: family_member, bind: arc, onMissing: cancel_arc }
      SPOUSE: { role: family_member, bind: arc, onMissing: cancel_arc }
    body: >-
      Some years on, the house looks again at the Match it made for {SUBJECT},
      the way it looks again at a field it paid too much for. It walks the
      edges. It counts what came up.
    interaction:
      kind: narration
      # Split on whether the marriage still stands, not on who is in it: an
      # authored `marriage: end` can undo a Match the docket made, and a page
      # about two chairs at one table would then be about nobody.
      outcomes:
        - id: the_match_held
          weight: 100
          onlyIf: { slot: SUBJECT, filters: [{ relation: spouse_of, of: SPOUSE }] }
          text: >-
            For {SUBJECT} the marriage bought what a marriage buys first: a
            settled chair at the table, and an end to being argued about at
            dinner. Settled is what the house paid for.
        - id: the_match_undone
          weight: 100
          onlyIf: { slot: SUBJECT, filters: [{ not: { relation: spouse_of, of: SPOUSE } }] }
          text: >-
            The marriage did not hold. The house does not write down why, and
            {SUBJECT} does not ask it to. The second chair goes back against
            the wall.

  - id: the_term_bought
    title: Counted Onto the Table
    tier: individual
    frequency: common
    campaigns: [short, long]
    tags: [table, tutor, money, callback]
    purposes: [buy_patience, change_relationship, worldbuild_through_action]
    arc: { of: arc_the_term_paid_for, node: the_term_bought }
    slots:
      PUPIL: { role: child, bind: arc, onMissing: cancel_arc }
    body: >-
      Forty crowns goes out of the strongbox in one morning, counted onto the
      table where the steward and the tutor can both watch it go. {PUPIL} has
      eight years now that belong to somebody else's lessons. The house does
      not say what it wants for the money. It wants what every house wants: a
      child worth more than the sum.
    interaction:
      kind: narration
      outcomes:
        - id: shown_the_chair
          weight: 100
          text: >-
            {PUPIL} is shown the schoolroom and the chair that goes with it.
            The chair is hard, which the tutor says is the point.

  - id: the_term_shows
    title: The Box Goes Back on the Cart
    tier: individual
    frequency: common
    campaigns: [short, long]
    tags: [table, tutor, callback]
    purposes: [buy_patience, change_standing, plant_rumour]
    arc: { of: arc_the_term_paid_for, node: the_term_shows }
    slots:
      PUPIL: { role: family_member, bind: arc, onMissing: cancel_arc }
    body: >-
      Eight years, and the tutor packs the books he came with into the box he
      brought them in. {PUPIL} helps carry it out to the cart. Nobody makes a
      speech. The house finds out what it bought the way it always does, by
      watching.
    interaction:
      kind: narration
      outcomes:
        - id: it_shows_in_him
          weight: 100
          onlyIf: { slot: PUPIL, filters: [{ sex: male }] }
          text: >-
            It shows in {PUPIL}, in the yard and the counting room, wherever
            the steward sends him. He is sent more often every year, which is how a house
            says a thing worked.
        - id: it_shows_in_her
          weight: 100
          onlyIf: { slot: PUPIL, filters: [{ not: { sex: male } }] }
          text: >-
            It shows in {PUPIL} at the table, where she corrects the steward
            twice in one winter and is right both times. Nobody forgets which of them was
            paid for.

  - id: the_waking_noticed
    title: The Kitchen Knows First
    tier: family
    frequency: common
    campaigns: [short, long]
    tags: [awakening, blood, callback]
    purposes: [establish_magic_rule, buy_patience, change_relationship]
    arc: { of: arc_the_waking_kept, node: the_waking_noticed }
    slots:
      WOKEN: { role: family_member, bind: arc, onMissing: cancel_arc }
    body: >-
      It is the kitchen that notices, as it always is: a jug that cracks with
      nobody holding it, a cold that settles on one end of the bench and will
      not shift. By evening the whole house knows that {WOKEN} has woken.
      Nobody says the word.
    interaction:
      kind: narration
      outcomes:
        - id: a_son_woke
          weight: 100
          onlyIf: { slot: WOKEN, filters: [{ sex: male }] }
          text: >-
            {WOKEN} is a son who has woken, and the house does the sum it
            always does. It will come when it comes, and never because anybody
            asked.
        - id: a_daughter_woke
          weight: 100
          onlyIf: { slot: WOKEN, filters: [{ not: { sex: male } }] }
          text: >-
            {WOKEN} will never use it. She will carry it, and every house that
            hears of this will want her sons.

  - id: the_waking_shows
    title: A Door Left Open
    tier: family
    frequency: common
    campaigns: [short, long]
    tags: [awakening, blood, callback]
    purposes: [establish_magic_rule, test_magic_rule, buy_patience]
    arc: { of: arc_the_waking_kept, node: the_waking_shows }
    slots:
      WOKEN: { role: family_member, bind: arc, onMissing: cancel_arc }
    body: >-
      {WOKEN} woke some years ago now, which is long enough for a house to stop
      whispering about a thing and start arranging itself around it. Nobody
      mentions the waking. Everybody remembers it.
    interaction:
      kind: narration
      outcomes:
        - id: what_his_waking_became
          weight: 100
          onlyIf: { slot: WOKEN, filters: [{ sex: male }] }
          text: >-
            When {WOKEN} is angry the fires gutter, and the household has
            learned to leave a door open. It has never once come when he called
            it.
        - id: what_her_waking_became
          weight: 100
          onlyIf: { slot: WOKEN, filters: [{ not: { sex: male } }] }
          text: >-
            Every house that writes to this one mentions {WOKEN}, in the careful
            way such letters mention anything. Nobody has to say what they are
            asking after.
proseVariants:
  - address: "content:events/callbacks.yaml#events[id=the_match_made].title"
    of: "06ac085007d5cd3c"
    plainenglish: >-
      The Wedding Toasts
  - address: "content:events/callbacks.yaml#events[id=the_match_made].body"
