    of: "2fb1af9f869ae0bb"
    plainenglish: "The field stays flooded through the harvest, and the water drains slowly afterwards. Longmere brings in less rent this winter, especially from the ground that stayed underwater longest. Nobody drowned, but nobody cleared the ditches either."
  - address: content:events/land.yaml#events[id=what_the_years_wore_down].title
    of: "bda57f83e6a1fe6f"
    plainenglish: "Repair the Neglected Fields"
  - address: content:events/land.yaml#events[id=what_the_years_wore_down].body
    of: "aa382d6b86f1c5df"
    plainenglish: "Coldharbour still produces the best hay of any field the house holds, but its harvest has declined for years. Only the old accounts could show how long. Since the last man who measured them died, the hedges have grown a foot into the field on each side. {HEAD} walks the field in the cold before breakfast and calculates the loss twice. Both calculations give the same result. Good land needs maintenance."
