    plainenglish: "The repairs take a full season and cost as much as a season of hired labour usually does. They do not make the field bigger. They restore Coldharbour to the condition it was in thirty years ago, before the house stopped checking it closely."
  - address: content:events/land.yaml#events[id=what_the_years_wore_down].interaction.choices[id=leave_it].label
