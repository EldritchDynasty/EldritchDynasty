    plainenglish: "Cold water rises quietly through land that has been dry for three generations. By the time a farm boy rides up to tell the house, the low field is flooded. {HEAD} can hear the water rising from the yard before the boy speaks. The old drainage ditches are blocked by ten years of fallen leaves that nobody cleared. Longmere was drained a hundred years ago to make a farm. The water is returning."
