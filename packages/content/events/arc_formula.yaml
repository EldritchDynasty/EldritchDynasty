    plainenglish: >-
      Two copies of a legal formula arrive at Ardwen. One carries the Warden's seal; the
      other carries the Church chapter house's seal. Both copies have exactly the same
      wording, including the comma before the final clause. {HEAD} reads both carefully
      because the house paid advocates to make every word count. Ardwen has won the immediate
      dispute. Both courts have saved that same wording, so it may matter in future cases.
  - address: "content:events/arc_formula.yaml#events[id=formula_two_copies].interaction.outcomes[id=filed_twice].text"
    of: bf9b55d8c6c101fc
