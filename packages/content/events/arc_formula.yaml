# Nodes of arc_the_formula_on_two_desks.
#
# The Church has no magic here. The uncanny thing is that institutions remember
# a sentence longer and more accurately than the people who wrote it.
events:
  - id: formula_two_copies
    title: The Same Sentence, Twice
    tier: head
    frequency: uncommon
    weight: 100
    tags: [church, law, records, arc]
    purposes: [worldbuild_through_action, buy_patience, advance_clause]
    arc: { of: arc_the_formula_on_two_desks, node: two_copies }
    slots:
      HEAD: { role: head }
    body: >-
      The formula arrives at Ardwen in two copies. One bears the Warden's seal
      and one the chapter house's, and the sentence in the middle is identical
      down to the comma before the last clause. {HEAD} reads both because the
      advocates were paid enough to make every word matter. The house has won
      the immediate argument. Both courts have kept the words that won it.
    interaction:
      kind: narration
      outcomes:
        - id: filed_twice
          weight: 100
          text: >-
            One copy goes into the presses and the other back to Cawdry with a
            receipt. The Warden's clerk calls it the Ardwen formula before the
            year is out. The chapter house calls it that too, which is the
            first sign that a legal victory has become a thing other people
            can use.

  - id: formula_another_house_uses_it
    title: The Ardwen Formula, in Somebody Else's Mouth
    tier: head
    frequency: uncommon
    weight: 100
    tags: [church, law, houses, arc]
    purposes: [change_standing, force_record_choice, worldbuild_through_action]
    arc: { of: arc_the_formula_on_two_desks, node: another_house }
    slots:
      HEAD: { role: head }
    body: >-
      A house two counties south has been asked by the Church about an oath and
      has answered with Ardwen's sentence. Their advocate copied it from the
      Warden's book at Cawdry and changed only the names. The chapter house has
      written to ask whether {HEAD} agrees that the old formula means what the
      southern house says it means. There is no courteous way to answer without
      teaching one court how much the formula is worth against the other.
    interaction:
      kind: choice
      choices:
        - id: stand_by_it
          label: Stand by the words. They were right when we needed them.
          outcomes:
            - id: precedent_kept
              weight: 100
              text: >-
                Ardwen answers in one page. The southern house keeps its
                jurisdictional defence and sends a case of wine in gratitude,
                while both courts add another citation under the same sentence.
                A private escape has become precedent.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_the_ardwen_formula, accuracy: 0.8 }
        - id: distinguish_it
          label: Say their case is different. Keep our victory narrow.
          outcomes:
            - id: precedent_narrowed
              weight: 100
              text: >-
                Eight crowns of advocate and three weeks of letters produce a
                careful distinction nobody at Ardwen could explain over supper.
                The southern house loses its defence. The Church keeps the
                distinction beside the formula, and now has two Ardwen
                sentences instead of one.
              effects:
                - { kind: treasury, delta: -8 }

  - id: formula_returns_to_ardwen
    title: What the Last Clause Meant
    tier: head
    frequency: uncommon
    weight: 100
    tags: [church, law, records, arc]
    purposes: [advance_clause, force_record_choice, change_standing]
    arc: { of: arc_the_formula_on_two_desks, node: returns }
    slots:
      HEAD: { role: head }
    body: >-
      The summons quotes Ardwen against Ardwen. Not the whole formula, only the
      last clause: the part saying a court must establish its jurisdiction
      before it asks what a landed house reads. A Church advocate argues that
      the sentence does not forbid the question at all; it merely says which
      court gets to ask it first. {HEAD} has the old copy on the table. The
      comma is still where both clerks put it.
    interaction:
      kind: choice
      choices:
        - id: accept_the_reading
          label: Accept the reading. We wrote the words and can live under them.
          outcomes:
            - id: accepted
              weight: 100
              text: >-
                The house answers the question and pays the advocate for a day,
                not a season. Nothing dramatic follows. The formula remains in
                both books with one more note underneath it, which is how law
                gets older.
              effects:
                - { kind: treasury, delta: -2 }
                - { kind: respect, delta: 1 }
        - id: fight_our_words
          label: Fight it again. A precedent is not a surrender.
          outcomes:
            - id: fought
              weight: 100
              text: >-
                Twenty-four crowns and seven weeks later the answer is more
                precise and no kinder. Ardwen keeps the narrow point and loses
                the broad one. The new ruling quotes the old formula in full,
                so a sentence written to keep one inquiry out now occupies
                three pages of the Church's book.
              effects:
                - { kind: treasury, delta: -24 }
                - { kind: respect, delta: -1 }
    record:
      subject: the jurisdiction formula and what it eventually permitted
      options:
        record:
          chronicle: >-
            We made the two courts agree on a sentence when agreement served
            us. The sentence outlived the advocates and came back with the same
            comma and a different use. Both copies are evidence of both facts.
          effects: []
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            The Ardwen formula settled the question of jurisdiction in this
            house's favour and remained the rule whenever the Church attempted
            to exceed its court.
          effects:
            - { kind: respect, delta: 1 }
          discrepancy:
            id: the_formula_always_favoured_ardwen
            severity: major
            provableBy: [the_church, house_marrow]

proseVariants:
  - address: "content:events/arc_formula.yaml#events[id=formula_two_copies].title"
