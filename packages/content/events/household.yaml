# COMMON — the texture of a generation.
# Common events carry no Record block and never enter folklore. They are the
# ordinary weather of a house, and they exist so that the Rare ones land.
events:
  - id: hard_winter
    title: A Hard Winter
    tier: family
    frequency: common
    weight: 120
    tags: [weather, hardship]
    purposes: [worldbuild_through_action, change_standing, buy_patience]
    slots:
      STEWARD: { role: retainer, filters: [{ status: [alive] }] }
    body: >-
      The cold comes early and stays. {STEWARD} reports it the way he reports
      everything, which is to say without looking up: the east grate is out,
      the second cellar has flooded and frozen over the top of the flooding,
      and there is bread until the thaw if nobody is generous. Outside, the
      dogs have stopped going into the yard. Nobody has told them to stop.
    interaction:
      kind: choice
      choices:
        - id: ration
          label: Ration it. Nobody starves and nobody eats well.
          outcomes:
            - id: held
              weight: 100
              # #341: the bread is already in the cellar, so rationing it
              # costs no coin. It costs the man who has to say no.
              text: >-
                The house holds. It is a thin, mean winter, and {STEWARD} is
                the one who says no at the kitchen door every night until the
                thaw. The kitchen remembers whose voice it was. In eighty
                years nobody else will remember the winter at all.
              effects:
                - { kind: relationship, from: { slot: STEWARD }, to: head, sentiment: -8 }
        - id: generous
          label: Open the stores to the village.
          outcomes:
            - id: remembered
              weight: 70
              text: >-
                They remember it. Not for long, and not accurately, but they
                remember it.
              effects:
                - { kind: treasury, delta: -40 }
                - { kind: respect, delta: 1 }
            - id: wasted
              weight: 30
              text: >-
                The thaw comes a fortnight early and the generosity turns out
                to have been unnecessary, which is somehow worse than if it had
                cost more.
              effects:
                - { kind: treasury, delta: -40 }

  - id: tutors_lesson
    title: A Lesson in the Long Room
    tier: individual
    frequency: common
    weight: 140
    tags: [study, warmth, tutor]
    purposes: [establish_magic_rule, change_relationship, buy_patience]
    slots:
      TUTOR: { role: tutor, filters: [{ status: [alive] }] }
      PUPIL:
        role: child
        filters: [{ age: { op: lte, value: 16 } }, { relation: not, of: TUTOR }]
    body: >-
      {TUTOR} sets the book down where {PUPIL} can reach it and then does not
      hand it over, which is the lesson. A book is a year of a life, he says.
      Not a year of study. A year of the life. You will not get it back and you
      cannot spend it twice, and there are men in this house who have spent
      forty of them and cannot call water.
    interaction:
      kind: narration
      outcomes:
        - id: taken
          weight: 100
          text: >-
            The child takes the book. The old man watches him take it and says
            nothing else, which the child will remember longer than the words.
          effects:
            - { kind: attribute, target: { slot: PUPIL }, attr: mind, delta: 2 }

  - id: servants_petition
    title: The Steward Asks
    tier: head
    frequency: common
    weight: 90
    tags: [household, money]
    purposes: [change_relationship, change_standing, buy_patience]
    slots:
      HEAD: { role: head }
      SERVANT: { role: retainer, filters: [{ relation: not, of: HEAD }] }
    body: >-
      {SERVANT} has been with the house eleven years at three marks a year, and
      has worked out, in the patient way of people who count for a living, that
      eleven years is longer than the house has had a roof on the west wing.
      He would like the wage looked at. He does not say the word owed.
    interaction:
      kind: choice
      choices:
        - id: raise
          label: Raise it.
          outcomes:
            - id: loyal
              weight: 100
              text: He says nothing at all, and stays another thirty years.
              effects:
                - { kind: treasury, delta: -18 }
        - id: refuse
          label: Refuse. There is a war on somewhere, there always is.
          outcomes:
            - id: kept
              weight: 65
              text: He stays. Something goes out of the way he says the name of the house.
              effects: []
            - id: leaves
              weight: 35
              text: >-
                He is gone by the spring, and he takes with him eleven years of
                knowing exactly which rooms are never opened.
              effects:
                - { kind: flag, flag: steward_left_bitter, set: true }

  - id: a_birth_in_the_house
    title: A Birth in the House
    tier: family
    frequency: common
    weight: 160
    tags: [birth, household]
    purposes: [worldbuild_through_action, change_relationship, buy_patience]
    slots:
      MIDWIFE: { role: retainer, filters: [{ sex: female }] }
      MOTHER: { role: family_member, filters: [{ sex: female }, { age: { op: lte, value: 44 } }] }
    body: >-
      It is a long night and a cold one and the water is put on three times
      before anyone needs it. {MIDWIFE} works without talking. Afterwards she
      stands in the passage a while longer than the work required, looking at
      nothing in particular, the way she does when the room felt wrong to her
      and she does not intend to say so where {MOTHER} can hear it.
    interaction:
      kind: narration
      outcomes:
        - id: well
          weight: 78
          text: The child lives. The midwife says the room was fine. She is lying, but only a little.
          effects: []
        - id: watchful
          weight: 22
          text: >-
            The child lives, and the midwife asks — carefully, not looking up —
            whether anyone has noticed the iron in that room going dull.
          effects:
            - { kind: flag, flag: signs_noticed, set: true }

  - id: the_rival_at_court
    title: A Remark at Court
    tier: head
    frequency: common
    weight: 100
    tags: [rival, politics]
    purposes: [change_relationship, worldbuild_through_action, plant_rumour]
    slots:
      HEAD: { role: head }
      RIVAL: { role: rival, filters: [{ status: [alive] }] }
    body: >-
      {RIVAL} does not raise his voice — that is the frightening part — and he
      does not say anything that could be repeated to a magistrate. He asks
      after {HEAD}'s cousins. He asks after them by name, and by degree, and he
      keeps asking after them for slightly longer than the question needs.
    interaction:
      kind: narration
      outcomes:
        - id: landed
          weight: 100
          text: >-
            Somebody laughs before they decide not to. It is a small sound in a
            large room and it carries beautifully.
          effects:
            - { kind: relationship, from: head, to: { slot: RIVAL }, sentiment: -8 }

# Plain English alternatives for the above Original event prose (#569).
proseVariants:
  - address: content:events/household.yaml#events[id=hard_winter].title
    of: e908051e48823372
    plainenglish: >-
      A Difficult Winter
  - address: content:events/household.yaml#events[id=hard_winter].body
    of: 47b87ef8f1976d7c
    plainenglish: >-
      Winter arrives early and will not end. {STEWARD} reports that the east grate is broken
      and the second cellar has flooded, then frozen over. There is enough bread to last
      until spring, but only if the house does not give any away. Even the dogs refuse to go
      into the yard, though no one has told them to stay inside.
  - address: content:events/household.yaml#events[id=hard_winter].interaction.choices[id=ration].label
    of: 948f13012aed7745
    plainenglish: >-
      Ration the food. Everyone survives, but no one eats well.
  - address: content:events/household.yaml#events[id=hard_winter].interaction.choices[id=ration].outcomes[id=held].text
    of: 7aacc9f7c587b493
    plainenglish: >-
      The house makes it through a hard winter. Every night until the thaw, {STEWARD} has to
      turn people away from the kitchen. The kitchen staff remember that he was the one who
      refused them. Eighty years later, everyone else has forgotten the winter.
  - address: content:events/household.yaml#events[id=hard_winter].interaction.choices[id=generous].label
    of: 232e6198c0d7dc14
    plainenglish: >-
      Share the stored food with the village.
  - address: content:events/household.yaml#events[id=hard_winter].interaction.choices[id=generous].outcomes[id=remembered].text
    of: 8f4e23330d7a56ff
    plainenglish: >-
      The villagers remember your generosity for a while, although they do not remember the
      details correctly.
  - address: content:events/household.yaml#events[id=hard_winter].interaction.choices[id=generous].outcomes[id=wasted].text
    of: 264f292de262acc1
    plainenglish: >-
      The thaw arrives two weeks early. The village did not actually need the extra food,
      which makes the cost feel even worse.
  - address: content:events/household.yaml#events[id=tutors_lesson].title
    of: 0890edfd2611dbe9
    plainenglish: >-
      Learning in the Long Room
  - address: content:events/household.yaml#events[id=tutors_lesson].body
    of: 06af90af5b26344b
    plainenglish: >-
      {TUTOR} puts a book within {PUPIL}'s reach but does not hand it over. He says that
      learning from it takes a year of your life, not just a year of study. You cannot get
      that year back or spend it again. Some men in this house have devoted forty years to
      learning magic and still cannot summon water.
  - address: content:events/household.yaml#events[id=tutors_lesson].interaction.outcomes[id=taken].text
    of: 9d465c510b97b91d
    plainenglish: >-
      The child picks up the book. The old tutor watches in silence. The child will remember
      that silence longer than the lesson.
  - address: content:events/household.yaml#events[id=servants_petition].title
    of: 8acccbf2af346786
    plainenglish: >-
      The Steward Requests a Raise
  - address: content:events/household.yaml#events[id=servants_petition].body
    of: d81b02a8cbdeacec
    plainenglish: >-
      {SERVANT} has worked for the house for eleven years, earning three marks each year. He
      points out that he has served longer than the west wing has had its roof. He asks the
      house to reconsider his pay, but does not say that he is owed more.
  - address: content:events/household.yaml#events[id=servants_petition].interaction.choices[id=raise].label
    of: 6d465b6686c01b9a
    plainenglish: >-
      Increase his pay.
  - address: content:events/household.yaml#events[id=servants_petition].interaction.choices[id=raise].outcomes[id=loyal].text
    of: 60cd4c2574f172b9
    plainenglish: >-
      He accepts without saying anything and stays for another thirty years.
  - address: content:events/household.yaml#events[id=servants_petition].interaction.choices[id=refuse].label
    of: da343c4b4b5b5727
    plainenglish: >-
      Refuse the raise. There always seems to be a war somewhere.
  - address: content:events/household.yaml#events[id=servants_petition].interaction.choices[id=refuse].outcomes[id=kept].text
    of: 11ee2422031f8d46
    plainenglish: >-
      He stays, but he no longer speaks of the house with the same feeling.
  - address: content:events/household.yaml#events[id=servants_petition].interaction.choices[id=refuse].outcomes[id=leaves].text
    of: 9e2140fdba825b59
    plainenglish: >-
      He leaves by spring. He takes with him eleven years of knowledge about which rooms are
      never opened.
  - address: content:events/household.yaml#events[id=a_birth_in_the_house].title
    of: 9001eaab3ff5da67
    plainenglish: >-
      A Child Is Born in the House
  - address: content:events/household.yaml#events[id=a_birth_in_the_house].body
    of: 89fa0dcf3ab3ef33
    plainenglish: >-
      The night is long and cold. The household heats water three times before it is needed.
      {MIDWIFE} works in silence. Afterward, she stays in the passage for longer than
      necessary. Something about the room disturbed her, but she does not want {MOTHER} to
      hear her say so.
  - address: content:events/household.yaml#events[id=a_birth_in_the_house].interaction.outcomes[id=well].text
    of: 72acd22debe6e141
    plainenglish: >-
      The child survives. The midwife says there was nothing wrong with the room, although she
      is not telling the whole truth.
  - address: content:events/household.yaml#events[id=a_birth_in_the_house].interaction.outcomes[id=watchful].text
    of: d9c7cdf4e9249588
    plainenglish: >-
      The child survives. The midwife quietly asks whether anyone has noticed the iron in that
      room losing its shine.
  - address: content:events/household.yaml#events[id=the_rival_at_court].title
    of: 141ce7ba78ce7206
    plainenglish: >-
      An Unsettling Comment at Court
  - address: content:events/household.yaml#events[id=the_rival_at_court].body
    of: a735d2789271c2dc
    plainenglish: >-
      {RIVAL} speaks calmly and says nothing that could be reported to a magistrate. That
      makes the exchange more threatening. He asks about {HEAD}'s cousins, naming each one
      and their exact family relationship. He keeps asking long after an ordinary polite
      question would have ended.
  - address: content:events/household.yaml#events[id=the_rival_at_court].interaction.outcomes[id=landed].text
    of: cc82f8a1aea1173d
    plainenglish: >-
      Someone laughs and then stops. Even that brief sound is heard across the large room.
