# WHAT THE CLIMB COSTS THE MAN CLIMBING (concept §22, issue #41).
#
# The Hierophant gate asks for a Madness floor of twenty, and `ascension.ts`
# writes the reason on the gate itself: *nothing has been asked of him that
# cost anything*. Measured over sixteen played thousand-year runs, that line
# was the last thing standing between the house and the fourth rung — men at
# power 57 with ten books, eight affinities and Madness **0**.
#
# The blood cannot pay that price and was never meant to be the only thing
# that could. Expressed power is `min(font, ceiling)` and Madness from the
# blood is `(font - ceiling) x 0.85`, so power and involuntary Madness are the
# same subtraction with opposite signs: the man who has fifty of the one has
# none of the other by construction. Halving the overflow clock doubled the
# ruin and moved the ladder not one rung in eight of eight runs.
#
# So the ladder has to be charged by CONTENT, and until this file every one of
# the game's twenty-two authored `madness` effects landed on HEAD, BEARER,
# CHILD or SECOND — positions. The ladder is not a position. It is climbed by
# whoever the blood happened to land in, and measured, that man was living and
# dying in a cadet hall while the seat was being asked for everything.
#
# `role: foremost` is the vocabulary that was missing (`core/src/events/slots.ts`).
# It casts the one man standing highest on the ladder and nobody else, and the
# pool is expressers only — so these outcomes may deal Madness without a filter
# saying so, and `madness/gate` knows the role by name.
#
# ─── The shape of the bargain ───────────────────────────────────────────────
#
# Three scenes, and they are three because there are three people who can do
# the asking: the house, the man himself, and the world. Every one of them is
# a real trade with a real refusal — his mind against the house's money, his
# mind against what he is able to hold, his mind against how the province
# speaks of the family. A player who says no to all three keeps a whole man
# and stops at Adept, and that is a correct way to play.
#
# COMMON for the first two, because a rung is bought in a working life and not
# in a ceremony: the uncommon cooldown is global to its tier, and a man who is
# asked once every twelve years is asked twice before he dies. The third is
# UNCOMMON because being looked at by the province is not an ordinary Tuesday.
#
# The cast rations these far harder than the tier does — one man, and only
# while he stands at Adept or above — which is the same argument `the_drowning`
# makes at 600, so the weights are high and the fire rates are measured in
# `docs/BALANCE-LOG.md` rather than guessed at.
#
# ─── And the half of that sentence that stopped being true ──────────────────
#
# "Only while he stands at Adept or above" was doing most of the rationing,
# and it was doing it by ACCIDENT: Adept was hard because §22's book count
# asked three of a shelf the house did not have. Renormalising those counts
# made Adept typical, which is what §22 asks for — and took this lane from
# 6.5% of every template fire in the game to 10.1%, measured over forty
# thousand-year runs. Three templates of three hundred and eighty-five, taking
# one fire in ten.
#
# So the cooldowns are the ration now, because they are the ration these
# scenes DECLARE, and at twenty-five and sixty they never bound on a lane
# whose natural spacing was sixty-eight years. Swept at forty runs:
#
#   cooldown 25 / 25 / 60     36.1 fires a run    10.1% of all fires
#   cooldown 100 / 100 / 200  12.2               3.4%
#   cooldown 50 / 50 / 100    19.3               5.4%
#   cooldown 40 / 40 / 80     22.2               6.2%   <- here
#
# Forty and eighty put the lane back where it was measured and accepted
# (23.4 a run, 6.5%) without the accident holding it there. Forty years is
# also the right shape for the scene: a man's working life, so the house asks
# the man who is climbing about twice before he dies, which is what the
# paragraph above says it wanted.
#
# ─── Asked twice, and the second time differently (#341) ────────────────────
#
# Forty years let the first two scenes come round about 3.6 times in a
# 300-year Short Line — the two most-repeated choices in the game, and the
# same question each time. The recurrence is the design: a man is asked in
# his working life, and asked again. So the lane keeps its forty-year cadence
# and splits BY MAN. Answering the first scene marks him (`went_past_the_book`,
# `asked_for_in_wick`); the first scene will not cast a marked man, and its
# return will cast nobody else. A new climber is asked the first question,
# and the man who already answered it is asked what his answer led to.
#
# The first cut chained the return with `next` and stretched the first
# scene's cooldown to a hundred years instead. It met the fire-rate bar and
# halved the ascendant column's Unmaking takers (16 to 7): a lane resting a
# century never asks the NEXT generation's climber at all, and the Mind the
# first scene pays went with it. See #341's BALANCE-LOG entry.
events:
  - id: the_race_silted_through
    title: An Afternoon's Work
    tier: family
    frequency: common
    weight: 260
    cooldownYears: 70
    tags: [ladder, madness, money, wick]
    purposes: [test_magic_rule, change_standing, worldbuild_through_action]
    conditions: { ascension: { atLeast: adept } }
    # ONE SLOT. The head of the house is very often the foremost expresser
    # himself, and a body with both tokens in it renders "Daveed puts it to
    # Daveed" in every run where he is. Where these scenes need the seat they
    # name the bare `head` TARGET, which is a person without being a token.
    slots:
      ASCENDANT: { role: foremost, filters: [{ trait: asked_for_in_wick, has: false }] }
    body: >-
      The race silted through above the mill in the spring and Wick has been
      carrying water uphill since Greening. Two hundred crowns hires a gang and
      most of a season, and the house does not have two hundred crowns this
      year, and everybody at the table knows what it has instead. Somebody says
      it the way you say a thing that has already been decided: it would take
      {ASCENDANT} an afternoon.
      Nobody says what an afternoon costs, because nobody has ever written it
      down. They have all seen it, though. A man comes in from doing a thing
      like that, sits by the fire a long while without saying anything, and is
      himself again by the third day. A different himself each time.
    interaction:
      kind: choice
      choices:
        - id: ask_him
          label: Ask him. It is an afternoon.
          outcomes:
            - id: done_by_evening
              weight: 100
              text: >-
                The race runs by evening. Wick is grateful the way a village is
                grateful, which is thoroughly and for about four years, and the
                reeve tells the story at the alehouse until the story is better
                than the afternoon was. {ASCENDANT} eats very little at supper
                and goes up early. On the third day he is himself again, and
                the house takes that for the whole of the bill.
              effects:
                - { kind: madness, target: { slot: ASCENDANT }, delta: 5 }
                - { kind: respect, delta: 1 }
                - { kind: trait, target: { slot: ASCENDANT }, trait: asked_for_in_wick, op: add }
        - id: hire_the_gang
          label: Hire the gang. Keep him out of it.
          outcomes:
            - id: paid_for
              weight: 100
              text: >-
                Two hundred crowns, eleven men and most of a season, and the
                race runs by Ingathering instead. Nobody of the house goes near
                the water. That is the entire thing the money bought, and it is
                not nothing, and it is a great deal to have paid for nothing
                happening.
              effects:
                - { kind: treasury, delta: -200 }

  - id: past_what_the_book_says
    title: The Part With Anything In It
    tier: individual
    frequency: common
    weight: 260
    cooldownYears: 70
    tags: [ladder, madness, library, blood]
    purposes: [establish_magic_rule, change_relationship, worldbuild_through_action]
    conditions: { ascension: { atLeast: adept } }
    slots:
      ASCENDANT: { role: foremost, filters: [{ trait: went_past_the_book, has: false }] }
    body: >-
      The book is a greater work and the man at Cawdry who sold it said so and
      charged accordingly. {ASCENDANT} has had it eleven months and can read
      the first third and no further, and the first third is the part that
      explains what the rest is going to be about.
      What stops him is not the language. He can say the words. He says them
      and nothing happens, and he has taken to saying them anyway, at night, in
      the room over the stable where the noise does not carry down to the hall.
      He has worked out that there is a way to go the rest of it. He has not
      said what the way is. What he has said, once, at the table, is that he is
      close — which is a long way from asking, and is meant to be. Everybody
      heard it.
    interaction:
      kind: choice
      choices:
        - id: let_him_go_on
          label: Let him go on. He is close.
          outcomes:
            - id: it_works_in_march
              weight: 100
              text: >-
                It works in March and it is not what the book describes.
                Afterwards he is better at it in a way anybody can see and
                different in a way nobody can point at — quicker, harder to
                surprise, inclined to answer a question about half a second
                before it has been asked. The house gets six good decades out
                of him and never once counts what else it got, because the
                thing about a bargain nobody wrote down is that nobody can
                produce it later and read the terms out.
              effects:
                - { kind: madness, target: { slot: ASCENDANT }, delta: 7 }
                - { kind: attribute, target: { slot: ASCENDANT }, attr: mind, delta: 3 }
                - { kind: trait, target: { slot: ASCENDANT }, trait: went_past_the_book, op: add }
        - id: take_the_book
          label: Take the book. Put it back on the shelf.
          outcomes:
            - id: shelved
              weight: 100
              text: >-
                It goes back on the shelf and it stays there, and the house is
                careful for a while about who has the key. He does not argue.
                He does not forgive it either, and for the rest of his life he
                arranges to be somewhere else whenever the library comes up at
                the table.
              effects:
                - { kind: relationship, from: { slot: ASCENDANT }, to: head, sentiment: -22 }

  # THE RETURN OF `the_race_silted_through` (#341), for a man who already
  # carries `asked_for_in_wick`. The village has learned
  # the price of an afternoon and learned that nobody shows it the bill. The
  # question is no longer money against his mind: it is whether the house or
  # the man decides what he spends, and neither answer costs a crown.
  - id: wick_asks_for_him_by_name
    title: Asked For By Name
    tier: family
    frequency: common
    weight: 260
    cooldownYears: 70
    tags: [ladder, madness, wick]
    purposes: [test_magic_rule, change_relationship, plant_rumour]
    conditions: { ascension: { atLeast: adept } }
    slots:
      ASCENDANT: { role: foremost, filters: [{ trait: asked_for_in_wick, has: true }] }
    body: >-
      The race silts again in a wet spring, and this time Wick does not wait
      for the house. The reeve comes up the hill on foot with his hat in both
      hands and mud to the knee, and he does not ask for the family. He asks
      for {ASCENDANT}, by name, at the gate, the way a village asks for the man
      who mends things. Nobody taught him to. The village has done its own
      sums: a gang costs a season, a man from the house costs an afternoon, and
      nobody has ever shown Wick the rest of the bill. He is waiting in the
      yard.
    interaction:
      kind: choice
      choices:
        - id: send_him_down
          label: Send him down. It is his village as much as ours.
          outcomes:
            - id: the_race_runs_again
              weight: 100
              text: >-
                He goes down with the reeve and the race runs before dark. Wick
                lines the bank to watch, which it did not do the first time,
                and a few of them clap, and {ASCENDANT} does not know what to do
                with his hands. He climbs back slower than he went down. He has
                started to like being asked.
              effects:
                - { kind: madness, target: { slot: ASCENDANT }, delta: 5 }
                - { kind: relationship, from: { slot: ASCENDANT }, to: head, sentiment: 10 }
        - id: keep_him_in
          label: Keep him in. Tell the reeve it was once.
          outcomes:
            - id: wick_digs_it_out
              weight: 100
              text: >-
                The reeve goes back down the hill with his hat on. Wick digs the
                race out itself, with spades, over five weeks, and says in the
                alehouse that the house has got proud, which is what a village
                says instead of what it means. {ASCENDANT} watches the digging
                from the upper window most of that week. He does not come down
                to supper the day it runs.
              effects:
                - { kind: relationship, from: { slot: ASCENDANT }, to: head, sentiment: -12 }
                - { kind: rumour, op: seed, id: rumour_wick_dug_it_themselves, accuracy: 0.5 }

  # THE RETURN OF `past_what_the_book_says` (#341), for a man who already
  # carries `went_past_the_book`. He went past the book once.
  # The question now is not his mind against the shelf but whether the next
  # reader of the blood inherits a map — a thing the record keeps, or a thing
  # burned in front of him.
  - id: what_he_wrote_past_it
    title: The Margins
    tier: individual
    frequency: common
    weight: 260
    cooldownYears: 70
    tags: [ladder, madness, library, blood]
    purposes: [test_magic_rule, change_relationship, worldbuild_through_action]
    conditions: { ascension: { atLeast: adept } }
    slots:
      ASCENDANT: { role: foremost, filters: [{ trait: went_past_the_book, has: true }] }
    body: >-
      The greater work comes down off the shelf in the cold months now, because
      {ASCENDANT} has started writing in it. Not in the text. In the margins, in
      a small hand, beside the place where the book stops explaining and he did
      not stop. The ink is the kitchen's, so he has been doing it at night, at
      the long table by the banked fire, with nothing to hear but the clock and
      the dog. What he has written is not a spell. It is directions: which
      word, which door, how long to wait in the dark before something answers.
      Anybody of the blood who can read could follow them, and that is the
      whole of the question. Whether the next one gets a map.
    interaction:
      kind: choice
      choices:
        - id: let_the_margins_stand
          label: Let the margins stand. The next one should not have to find it alone.
          outcomes:
            - id: finished_in_one_winter
              weight: 100
              text: >-
                He finishes it over one winter, and goes back through the
                working twice more to be sure of the order, which is the part
                nobody counts. The margins fill. The book is heavier by a few
                ounces of ink and a good deal else. When he closes it the last
                time he looks like a man who has put something down.
              effects:
                - { kind: madness, target: { slot: ASCENDANT }, delta: 6 }
                - { kind: attribute, target: { slot: ASCENDANT }, attr: mind, delta: 3 }
                - { kind: chronicle, text: "A greater work in the library was written over in the family's own hand, past the place where the book itself stops." }
        - id: cut_the_pages
          label: Cut the pages out. Burn them where he can see.
          outcomes:
            - id: eleven_pages
              weight: 100
              text: >-
                The knife is the one from the kitchen and it takes eleven pages
                clean at the gutter. They go into the hall grate one at a time,
                because a book burns badly all at once. {ASCENDANT} stands and
                watches it done and says nothing, then or afterwards. He can
                still do everything he wrote down. Now he is the only one who
                can.
              effects:
                - { kind: relationship, from: { slot: ASCENDANT }, to: head, sentiment: -20 }

  - id: what_the_province_asks_to_see
    title: Where the Province Can Watch
    tier: head
    frequency: uncommon
    weight: 200
    # SUPPLY (#341). Once the first two scenes spaced themselves out, this one
    # took their draws and reached 2.2 a Short Line — the province asking to
    # watch in every other generation. It asks once in a man's life now.
    cooldownYears: 110
    tags: [ladder, madness, standing, assize]
    purposes: [change_standing, plant_rumour, test_magic_rule]
    conditions: { ascension: { atLeast: adept } }
    slots:
      ASCENDANT: { role: foremost }
    body: >-
      The assize sits at Cawdry in the autumn and the question is not whether
      the family has it. That was settled two generations ago, in a room, in a
      way nobody wrote down and nobody has needed to since. The question is
      whether the family will do it once where the province can watch, and be
      done with the whispering for a while.
      The house has been told, by a man who would know, that it would help. It
      would. Standing is granted rather than earned and the men who grant it
      want something they can repeat at dinner without sounding like a tenant.
      What they are asking for is an afternoon of {ASCENDANT}'s life, and
      nobody who comes out to the yard to watch will be able to read that
      bill. Neither can he.
    interaction:
      kind: choice
      choices:
        - id: let_them_see
          label: Let them see it. Once.
          outcomes:
            - id: the_yard_at_cawdry
              weight: 100
              text: >-
                He does it in the yard at Cawdry in front of ninety people and
                it takes less time than the reading of the charge did. Two of
                the watching magistrates never speak of it again, to anyone,
                including each other. The house is spoken of properly from that
                autumn on, first in the province and then past it, and
                {ASCENDANT} does not come out into a yard again for anything as
                long as he lives.
              effects:
                - { kind: madness, target: { slot: ASCENDANT }, delta: 12 }
                - { kind: respect, delta: 2 }
                - { kind: rumour, op: seed, id: rumour_the_yard_at_cawdry, accuracy: 0.4 }
        - id: nothing_to_show
          label: Say the family are landholders and nothing else.
          outcomes:
            - id: accepted_not_believed
              weight: 100
              text: >-
                The house says it has held land in the Nethering for two
                hundred years, which is true, and says nothing further, which
                is also true. The assize accepts it. The assize does not
                believe it. That is a bill the house pays in instalments, over
                a long time, to people who never present it.
              effects:
                - { kind: respect, delta: -1 }
    rumour: { id: rumour_what_they_saw_at_cawdry, accuracy: 0.3, spread: 2 }

# Plain English alternatives for every ladder bargain and consequence (#1178).
proseVariants:
  - address: "content:events/the_ladder.yaml#events[id=the_race_silted_through].title"
    of: ddea6979bc0490dd
    plainenglish: >-
      The Mill Race Is Blocked
  - address: "content:events/the_ladder.yaml#events[id=the_race_silted_through].body"
    of: e2d644240a78f2f8
    plainenglish: >-
      The water channel above Wick's mill has filled with silt. Since Greening, villagers
      have carried water uphill. Hiring workers would cost 200 crowns and most of a season,
      and the house cannot afford it this year. Someone suggests that {ASCENDANT} could
      clear the channel in an afternoon. Everyone knows the work would affect him, although
      nobody has recorded the cost. After using his power this way, he sits silently by the
      fire and seems himself again after three days. Each time, though, he has changed.
  - address: "content:events/the_ladder.yaml#events[id=the_race_silted_through].interaction.choices[id=ask_him].label"
    of: 81511a3aeb6e1e1e
    plainenglish: >-
      Ask him to do the work. It will take one afternoon.
  - address: "content:events/the_ladder.yaml#events[id=the_race_silted_through].interaction.choices[id=ask_him].outcomes[id=done_by_evening].text"
    of: b784ad5c7df49eb8
    plainenglish: >-
      The mill's water channel is clear by evening. Wick is grateful, and the reeve tells
      the story in the alehouse for about four years. {ASCENDANT} barely eats supper and
      goes to bed early. By the third day he seems himself again. The house decides that
      means he has paid the full cost.
  - address: "content:events/the_ladder.yaml#events[id=the_race_silted_through].interaction.choices[id=hire_the_gang].label"
    of: c565eb7e4648ac1a
    plainenglish: >-
      Hire the workers. Do not ask him.
  - address: "content:events/the_ladder.yaml#events[id=the_race_silted_through].interaction.choices[id=hire_the_gang].outcomes[id=paid_for].text"
    of: 702fad1ea6e7ba22
    plainenglish: >-
      The house pays 200 crowns to eleven workers. They spend most of a season clearing the
      mill channel, which runs again by Ingathering. No one from the house has to work near
      the water. The money has bought protection from an unknown cost.
  - address: "content:events/the_ladder.yaml#events[id=past_what_the_book_says].title"
    of: 9fb1f213db9f8ecf
    plainenglish: >-
      Beyond the First Third of the Book
  - address: "content:events/the_ladder.yaml#events[id=past_what_the_book_says].body"
    of: d505afc9f3fff165
    plainenglish: >-
      A man at Cawdry sold the house an expensive greater work. {ASCENDANT} has studied it
      for eleven months, but can understand only the first third, which introduces the rest
      of the work. The problem is not the language. He knows the words, but they have no
      effect. He keeps repeating them at night in the room above the stable. He believes he
      has found a way to continue but has not said how. At the table he told everyone he was
      close. He did not ask permission directly, but everyone understood what he meant.
  - address: "content:events/the_ladder.yaml#events[id=past_what_the_book_says].interaction.choices[id=let_him_go_on].label"
    of: c159b3049c2d4920
    plainenglish: >-
      Allow him to continue. He says he is close.
  - address: "content:events/the_ladder.yaml#events[id=past_what_the_book_says].interaction.choices[id=let_him_go_on].outcomes[id=it_works_in_march].text"
    of: 9355c243664fe95f
    plainenglish: >-
      The work succeeds in March, but not in the way the book describes. He becomes visibly
      more capable. He is also changed: quicker, harder to surprise, and sometimes answering
      before a question is finished. The house benefits from his abilities for six decades.
      Nobody records the other cost of his discovery, so the family cannot later check what
      he gave up.
  - address: "content:events/the_ladder.yaml#events[id=past_what_the_book_says].interaction.choices[id=take_the_book].label"
    of: 477e3111dd578a65
    plainenglish: >-
      Take the book and return it to the shelf.
  - address: "content:events/the_ladder.yaml#events[id=past_what_the_book_says].interaction.choices[id=take_the_book].outcomes[id=shelved].text"
    of: 37e4e8e563efb009
    plainenglish: >-
      The book stays on the shelf, and the house guards the key more carefully for a while.
      He does not argue with the decision, but he resents it for the rest of his life.
      Whenever the library comes up in conversation, he makes sure he is somewhere else.
  - address: "content:events/the_ladder.yaml#events[id=wick_asks_for_him_by_name].title"
    of: 00eb47f80233663c
    plainenglish: >-
      Wick Requests Him by Name
  - address: "content:events/the_ladder.yaml#events[id=wick_asks_for_him_by_name].body"
    of: 2d593cf02b3dbd6c
    plainenglish: >-
      After another wet spring, the mill channel fills with silt again. This time Wick sends
      its reeve directly to the house. He arrives on foot with mud up to his knees and asks
      for {ASCENDANT} by name. The villagers know that hiring a gang takes a season, while
      his power cleared the channel in an afternoon. They do not know what that work cost
      him. The reeve waits in the yard for an answer.
  - address: "content:events/the_ladder.yaml#events[id=wick_asks_for_him_by_name].interaction.choices[id=send_him_down].label"
    of: 18f30ba4c2a9d4d0
    plainenglish: >-
      Send him to help. Wick is also his village.
  - address: "content:events/the_ladder.yaml#events[id=wick_asks_for_him_by_name].interaction.choices[id=send_him_down].outcomes[id=the_race_runs_again].text"
    of: 3e306c343c0bda28
    plainenglish: >-
      He goes down with the reeve and clears the channel before dark. Villagers line the
      bank to watch, and some applaud. {ASCENDANT} does not know how to respond. He walks
      back up the hill more slowly than before, but he has begun to enjoy being asked for
      help.
  - address: "content:events/the_ladder.yaml#events[id=wick_asks_for_him_by_name].interaction.choices[id=keep_him_in].label"
    of: 9533b1e30c6d1a1f
    plainenglish: >-
      Keep him at home. Tell the reeve it was a one-time favour.
  - address: "content:events/the_ladder.yaml#events[id=wick_asks_for_him_by_name].interaction.choices[id=keep_him_in].outcomes[id=wick_digs_it_out].text"
    of: 5b06235320806ef7
    plainenglish: >-
      The reeve returns to Wick. The villagers dig the channel clear themselves with spades
      over five weeks. In the alehouse they say the house has become proud. {ASCENDANT}
      watches the work from an upper window for much of that week. When the water runs
      again, he stays away from supper.
  - address: "content:events/the_ladder.yaml#events[id=what_he_wrote_past_it].title"
    of: d5e1efdb6a8ad0ef
    plainenglish: >-
      Writing in the Book's Margins
  - address: "content:events/the_ladder.yaml#events[id=what_he_wrote_past_it].body"
    of: d762d8e6c640855a
    plainenglish: >-
      In the cold months, {ASCENDANT} takes the greater work from the library and writes
      notes in its margins. He works at the kitchen table at night, beside the fire. He
      writes directions beyond the point where the book stops explaining: which word to say,
      which door to use, and how long to wait in darkness for an answer. These notes are not
      themselves a spell. Anyone of the blood who can read could follow them. The house must
      decide whether future readers should inherit those instructions.
  - address: "content:events/the_ladder.yaml#events[id=what_he_wrote_past_it].interaction.choices[id=let_the_margins_stand].label"
    of: c2b2da68c8f5fb44
    plainenglish: >-
      Keep his notes in the book so future readers can use them.
  - address: "content:events/the_ladder.yaml#events[id=what_he_wrote_past_it].interaction.choices[id=let_the_margins_stand].outcomes[id=finished_in_one_winter].text"
    of: 83f2a3b24597a48e
    plainenglish: >-
      He completes the notes in one winter and repeats the work twice more to check the
      order. The margins fill with instructions. When he finally closes the book, he appears
      relieved that he has finished recording what he learned.
  - address: "content:events/the_ladder.yaml#events[id=what_he_wrote_past_it].interaction.choices[id=let_the_margins_stand].outcomes[id=finished_in_one_winter].effects[2].text"
    of: 96ac3d56ea69ecc2
    plainenglish: >-
      A greater work in the library was annotated by someone in the family with instructions
      that go beyond the original text.
  - address: "content:events/the_ladder.yaml#events[id=what_he_wrote_past_it].interaction.choices[id=cut_the_pages].label"
    of: eaee2284bf49d540
    plainenglish: >-
      Cut out the notes and burn them where he can watch.
  - address: "content:events/the_ladder.yaml#events[id=what_he_wrote_past_it].interaction.choices[id=cut_the_pages].outcomes[id=eleven_pages].text"
    of: e031c146e0bb97a2
    plainenglish: >-
      Using a kitchen knife, the house cuts eleven pages from the book. The pages burn one
      by one in the hall fireplace. {ASCENDANT} watches without speaking, and never
      discusses it afterwards. He still knows how to perform what he wrote, but no one else
      can learn those instructions from the book.
  - address: "content:events/the_ladder.yaml#events[id=what_the_province_asks_to_see].title"
    of: ea875c10c20de364
    plainenglish: >-
      A Public Display at Cawdry
  - address: "content:events/the_ladder.yaml#events[id=what_the_province_asks_to_see].body"
    of: be519712066f5e0e
    plainenglish: >-
      The provincial assize meets at Cawdry in autumn. Two generations ago, the family
      demonstrated its unusual power privately, and the province still talks about it.
      Officials now want one public demonstration to quiet the rumours. Someone whose
      judgement the house trusts says the display would improve its standing. Those
      officials want a story they can tell about the family. They are asking {ASCENDANT} to
      use an afternoon of his life. Neither the spectators nor he can know the full personal
      cost.
  - address: "content:events/the_ladder.yaml#events[id=what_the_province_asks_to_see].interaction.choices[id=let_them_see].label"
    of: 2b5f01339a960cc7
    plainenglish: >-
      Allow one public demonstration.
  - address: "content:events/the_ladder.yaml#events[id=what_the_province_asks_to_see].interaction.choices[id=let_them_see].outcomes[id=the_yard_at_cawdry].text"
    of: f528bd5da9bac349
    plainenglish: >-
      He demonstrates his power in the yard at Cawdry before ninety people. The act takes
      less time than the reading of the charge. Two magistrates who witness it never discuss
      it with anyone, even each other. From that autumn, the house gains respect in the
      province and beyond. {ASCENDANT} refuses to appear in a yard for any purpose for the
      rest of his life.
  - address: "content:events/the_ladder.yaml#events[id=what_the_province_asks_to_see].interaction.choices[id=nothing_to_show].label"
    of: 2efeb3f2d9428176
    plainenglish: >-
      Say the family only owns land.
  - address: "content:events/the_ladder.yaml#events[id=what_the_province_asks_to_see].interaction.choices[id=nothing_to_show].outcomes[id=accepted_not_believed].text"
    of: 7f2033764df0a6ca
    plainenglish: >-
      The house says it has owned land in the Nethering for 200 years, which is true, and
      makes no claim about its power. The assize accepts the statement but does not believe
      it. The family bears the consequences of that doubt for years without anyone making a
      formal demand.
