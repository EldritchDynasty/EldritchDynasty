# THE OTHER HOUSES, AND THE PEOPLE PASSING THROUGH (world §10, §22).
#
# COMMON, for the tier reasons at the top of village.yaml.
#
# Standing in this kingdom is a line on the Roll of Houses, kept by the
# heralds at Caster and read out every third year at the Assembly, and
# everything in this file is an argument about where that line sits. None of
# it is a war. Precedence is deniable, permanent and free; a letter takes a
# year to Yssanne and comes back with the argument already moved on; a wall
# nobody mends is a claim being made slowly.
#
# `the_invitation_from_cawdry` is decided by `state`. A house with an empty
# coffer and a low line on the Roll does not sit up deliberating about a
# dinner it cannot dress for — it writes the regrets, and the ladder says so
# instead of asking a question with one real answer.
events:
  - id: the_letter_from_yssanne
    title: A Letter That Took Eleven Months
    tier: head
    frequency: common
    weight: 70
    tags: [foreign, records, marriage, law]
    purposes: [advance_clause, change_relationship, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      It comes up from Sarrow in a factor's satchel, eleven months out of
      Yssanne, in a hand nobody at Ardwen can read and an Ambric translation
      pinned to it that somebody was paid two marks a day to make. A Yssene
      house is asking after a marriage that this family's records place four
      generations back and theirs place five. An answer will take another
      eleven months and will arrive after the man who asked is dead. The
      difference between four and five is the difference between a cousin and
      a stranger, in a law that Aubren does not recognise and cannot quite
      dismiss.
    interaction:
      kind: choice
      choices:
        - id: answer_it_properly
          label: Answer it, with the descent set out in full.
          outcomes:
            - id: answered
              weight: 100
              text: >-
                Nine crowns for a copyist, an advocate and the carriage, and a
                document leaves this house stating what this house says its
                own descent is, in writing, to a party abroad. It is the
                fullest account of the line the family has ever put on paper.
                Somebody in Yssanne files it, and Yssene houses do not lose
                paper either.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: respect, delta: 1 }
        - id: let_it_lie
          label: Let it lie. He will be dead before an answer lands.
          outcomes:
            - id: unanswered
              weight: 100
              text: >-
                No reply goes south and none is expected after the second
                year, and the whole thing is a curiosity in the press within a
                generation. The Yssene house records that the question was put
                and not answered, because that is what their law does with
                silence. In their reckoning the descent stands at five.
              effects:
                - { kind: discrepancy, op: create, id: the_unanswered_yssene_descent, severity: minor, provableBy: [house_yssanne] }

  - id: a_slight_at_a_door
    title: Who Goes Through First
    tier: head
    frequency: common
    weight: 85
    tags: [precedence, rival, standing, quarrel]
    purposes: [change_relationship, change_standing, plant_rumour]
    slots:
      HEAD: { role: head }
      RIVAL: { role: rival, filters: [{ status: [alive] }] }
    body: >-
      At the door of the assize hall at Cawdry, with about forty people in the
      passage behind, {RIVAL} goes through ahead of {HEAD} and does it without
      hurrying, which is the part that makes it what it is. Precedence is the
      whole of politeness here. An insult in this grammar is deniable,
      permanent and free, and every one of the forty people in that passage
      read it correctly and none of them will ever mention it. There is a
      quarter of an hour before the Warden sits.
    interaction:
      kind: choice
      choices:
        - id: answer_it_now
          label: Answer it now, in the passage, in front of the forty.
          outcomes:
            - id: answered_in_the_passage
              weight: 100
              text: >-
                Six words, quietly, close enough that only the front four
                hear, and the front four tell the other thirty-six by noon.
                {RIVAL} is white about it and says nothing. The Warden's
                steward, who is paid a great deal to prevent exactly this,
                marks both of them down as men who will need seating apart for
                the next thirty years.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: { slot: RIVAL }, to: head, sentiment: -18, grudge: { severity: 22, inheritance: heir_only } }
        - id: remember_it
          label: Say nothing. Remember it.
          outcomes:
            - id: remembered
              weight: 100
              text: >-
                Nothing at all happens in the passage and the assize sits on
                time. It is done twice more that year, at Bramme and at a
                wedding, each time a little more comfortably. By the third
                time it is not an insult any more, it is the order, and an
                order is a thing the heralds eventually write down.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_who_goes_through_first, accuracy: 0.6 }

  - id: the_wall_nobody_mends
    title: Four Hundred Yards of It
    tier: head
    frequency: common
    weight: 80
    tags: [land, rival, law, tenants]
    purposes: [buy_patience, change_standing, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      The march wall between this house's high pasture and the next holding
      has been down in three places since a bad Frostfall and the other side
      has not sent a man to it in two years. Their beasts are through it and
      grazing the house's grass every day of the summer, which is either
      neglect or a claim being made very slowly, and there is no way to tell
      which from here. Mending it is the house's own men, nine days, and an
      admission that the wall on that line is the house's to mend. The Warden
      will hear a boundary case at Cawdry in Ingathering and will want papers
      neither side has.
    interaction:
      kind: choice
      choices:
        - id: mend_it_ourselves
          label: Mend it ourselves and say nothing about whose wall it is.
          outcomes:
            - id: mended
              weight: 100
              text: >-
                Nine days, four men, and four hundred yards of drystone put
                back by people who know how. The grass is the house's again by
                Haying. In 1148 a clerk finds it written that this house
                mended that wall, and reads it exactly the way the other side
                would want it read.
              # #341: the clerk in 1148 needs something to find. The flag that
              # stood in for it was read by nothing (#334).
              effects:
                - { kind: treasury, delta: -7 }
                - { kind: chronicle, text: "The house mended the march wall on the high pasture with its own men, and said nothing about whose wall it was." }
        - id: take_it_to_cawdry
          label: Take it to the assize and make them produce something.
          outcomes:
            - id: heard_at_cawdry
              weight: 62
              text: >-
                Two days at Cawdry, four crowns to an advocate, and neither
                side produces a single sheet of paper, so the Warden does what
                the Warden does, which is find for the custom as the oldest
                men present describe it. Two of the oldest men present are the
                house's tenants. The line is entered in the province's record
                for the first time in its history.
              effects:
                - { kind: treasury, delta: -4 }
                - { kind: respect, delta: 1 }
                - { kind: chronicle, text: "The march wall was found for the house at Cawdry, on the word of its own tenants." }
                - { kind: relationship, from: household, to: head, sentiment: 6 }
            - id: found_against
              weight: 38
              text: >-
                Two days at Cawdry, four crowns, and three fell-graziers who
                were on that hill every summer of their lives say the wall has
                always been the house's, and say it plainly, and they are not
                lying. The line is entered against the house. It is a hundred
                and eleven yards of pasture and a permanent sentence in the
                province's record.
              effects:
                - { kind: treasury, delta: -8 }
                - { kind: respect, delta: -1 }
                - { kind: chronicle, text: "The march wall was found against the house at Cawdry, and the line entered." }

  - id: the_invitation_from_cawdry
    title: What It Costs to Be Seen There
    tier: head
    frequency: common
    weight: 75
    tags: [standing, money, precedence, feast]
    purposes: [buy_patience, change_standing, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      The Warden keeps a table twice a year and this house is on the list for
      the Ingathering one, which it is not always. Going means four riding
      days, a night at an inn each way, and dress the family does not own:
      true black and deep red are licensed at this rank and cost what licensed
      colour costs. Not going is a line in nobody's book and a gap at a table
      that seats thirty. The regrets take four lines and a mark for the rider.
    interaction:
      kind: choice
      # A house with nothing in the coffer does not deliberate about a dinner
      # it cannot dress for. The ladder says so rather than asking a question
      # with one real answer in it.
      decidedBy:
        state:
          - when: { treasury: { op: lt, value: 90 } }
            take: write_the_regrets
            because: the house cannot dress for it and everyone at that table would know
          - take: go_to_cawdry
      choices:
        - id: go_to_cawdry
          label: Go. Be at the table and be seen at it.
          outcomes:
            - id: went
              weight: 100
              text: >-
                Twenty-six crowns of cloth, four days on the road, and an
                evening of being spoken to by eleven people who have not
                spoken to this family in nine years. Nothing is agreed and
                nothing is asked for. Two years later a marriage is proposed
                that would not have been proposed to a house nobody had seen.
              effects:
                - { kind: treasury, delta: -26 }
                - { kind: respect, delta: 1 }
        - id: write_the_regrets
          label: Write the regrets. Four lines and a mark for the rider.
          outcomes:
            - id: regrets
              weight: 100
              text: >-
                Four lines, correctly phrased, in the steward's best hand, and
                a gap at a table that seats thirty and is arranged in a
                particular order. The Warden does not notice. The Warden's
                steward notices, because noticing is the office, and the list
                for the following Ingathering is drawn up by him.
              effects:
                - { kind: treasury, delta: -1 }
                - { kind: respect, delta: -1 }

  - id: the_yssene_house_at_cawdry
    title: Immaculate, Poor, and Entirely Unimpressed
    tier: head
    frequency: common
    weight: 70
    tags: [foreign, marriage, law, standing]
    purposes: [change_relationship, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      YSSENE: { role: outsider, filters: [{ status: [alive] }, { age: { op: gte, value: 25 } }] }
    body: >-
      There are perhaps nine Yssene families in the whole kingdom and one of
      them is nineteen miles off at Cawdry, exiled two generations back, very
      poor, and better mannered than anybody in the Nethering has ever had to
      cope with. {YSSENE} calls in Highsun, drinks one cup, and raises a match
      between the houses in a way that takes four minutes and never once uses
      the word. Their law of inheritance is not Aubren's and would put a
      daughter's line ahead of a brother's. Nobody in this province is
      equipped to have that argument and everybody in it knows a good match
      when it is put in front of them.
    interaction:
      kind: choice
      choices:
        - id: open_the_question
          label: Open it. A good match is a good match.
          outcomes:
            - id: opened
              weight: 100
              text: >-
                Three visits, two letters and an advocate at two marks a day
                who admits on the second afternoon that he cannot tell the
                house what it is agreeing to. The manners are the best this
                hall has ever seen and the terms are not readable by anyone in
                it. Somewhere in the fourth clause is a sentence about issue
                that will matter in about ninety years.
              effects:
                - { kind: treasury, delta: -5 }
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_the_yssene_terms, accuracy: 0.3 }
        - id: stay_clear
          label: Stay clear. We cannot read their law and they can read ours.
          outcomes:
            - id: stayed_clear
              weight: 100
              text: >-
                It is declined in the only way that can be done to somebody
                that well mannered, which is by never quite answering, and it
                takes a year and a half. {YSSENE} is faultless about it to the
                end. The house has turned down the one alliance in the
                province that nobody else in the province could have made, and
                will hear about it twice a generation from its own cadets.
              effects:
                - { kind: branch, op: slight, amount: 8 }
                - { kind: respect, delta: -1 }

  - id: a_company_outside_bramme
    title: Marches Men, Between Wars
    tier: head
    frequency: common
    weight: 75
    tags: [violence, town, money, hardship]
    purposes: [buy_patience, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      Two hundred Marches men are camped in the water meadow outside Bramme
      in numbers that make the magistrate extremely polite, paid by the month
      and loyal until the month ends, and there is no war anywhere for them to
      be sent to. Their captain rides up the hill on the second day, alone,
      well-mannered, and asks whether the house has need of eleven men through
      the winter, at eleven crowns the month for the lot of them. It is a fair rate. It is also the
      only proposition he is going to make and everybody in the yard
      understands that the alternative is not a different proposition.
    interaction:
      kind: choice
      choices:
        - id: take_eleven
          label: Take eleven of them through the winter.
          outcomes:
            - id: hired
              weight: 100
              text: >-
                Forty-four crowns over four months, eleven men in the yard who
                are polite, filthy, competent and entirely uninterested in
                anything that happens in this house, and a gate that is
                watched every night for the first time in ninety years.
                Nothing whatever happens all winter, which is what was bought.
              effects:
                - { kind: treasury, delta: -44 }
                - { kind: respect, delta: 1 }
        - id: bar_the_gate
          label: Refuse, and put the tenants' beasts inside the wall.
          outcomes:
            - id: refused
              weight: 62
              text: >-
                They are gone from the water meadow inside three tendays,
                north, on somebody else's news, and nothing at all happens on
                this land. The house's beasts are inside the wall for
                twenty-one nights and the tenants' beasts with them, which is
                remembered.
              effects:
                - { kind: treasury, delta: -6 }
                - { kind: relationship, from: household, to: head, sentiment: 6 }
            - id: they_take_it_anyway
              weight: 38
              text: >-
                Nothing is stolen from this house because this house is on a
                rise behind a wall. Four cottages at the bottom of the lane
                are stripped in one night and a man at Ockleigh is killed for
                a horse, and blood belongs to the Warden's assize, which sits
                in eleven weeks. Everybody at Wick knows what was offered and
                refused.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: relationship, from: household, to: head, sentiment: -9 }
                - { kind: rumour, op: seed, id: rumour_the_winter_the_house_shut_its_gate, accuracy: 0.55 }

  - id: a_marriage_offer_from_below
    title: A Draper's Daughter, and a Hundred and Ten Crowns
    tier: head
    frequency: common
    weight: 80
    tags: [marriage, money, town, standing]
    purposes: [change_relationship, change_standing, force_record_choice]
    slots:
      HEAD: { role: head }
      SON:
        role: family_member
        filters: [{ sex: male }, { status: [alive] }, { age: { op: gte, value: 18 } }, { age: { op: lte, value: 32 } }, { relation: not, of: HEAD }]
    body: >-
      The wool-draper who told this house no about the market day has one
      daughter, no sons, and a hundred and ten crowns he would settle on her the
      day she married {SON}. She is nineteen, has been taught to keep a book, and
      is better company than anybody this family has been offered in a
      generation. Her father is a burgess of Bramme and her grandfather carted
      fleeces. A hundred and ten crowns is the better part of two years of this
      house's income, and the Roll of Houses does not have a column for it.
    interaction:
      kind: choice
      choices:
        - id: take_the_match
          label: Take it. A hundred and ten crowns and a woman who can keep a book.
          outcomes:
            - id: married_in
              weight: 100
              text: >-
                A hundred and ten crowns into the coffer at Greening and a
                daughter-in-law who has the wage roll in order inside a year
                and the rent book inside two. The heralds enter the marriage
                without comment because the heralds enter everything. Four
                houses stop inviting this one, and it takes nineteen years for
                anybody to notice that they have.
              effects:
                - { kind: treasury, delta: 110 }
                - { kind: respect, delta: -1 }
        - id: refuse_it
          label: Refuse it. The line is not for sale by the crown.
          outcomes:
            - id: refused_below
              weight: 100
              text: >-
                It is refused in a way that is meant to be kind and is heard in
                Bramme as exactly what it is, and the forty households hear it
                within a tenday because the forty households hear everything.
                {SON} marries in five years, adequately, with sixty crowns.
                The draper's daughter marries at Cawdry and is, thirty years
                on, the wealthiest woman in the province.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: { slot: SON }, to: head, sentiment: -8 }

  - id: the_book_they_never_returned
    title: Lent, in 1061
    tier: head
    frequency: common
    weight: 70
    tags: [library, rival, records, standing]
    purposes: [advance_clause, change_relationship, plant_rumour]
    slots:
      HEAD: { role: head }
      RIVAL: { role: rival, filters: [{ status: [alive] }] }
    body: >-
      A book is a year of somebody's life to read and half a year of somebody
      else's to copy, and this house lent one to the house {RIVAL} now holds,
      and there is an entry in the archive saying so and naming the year. Two
      generations have passed. The book is on their shelf, is spoken of as
      theirs, and has their mark cut into the board over a mark that is not
      quite covered. Asking for it back means saying, in writing, that this
      family keeps a record of what it lends and to whom.
    interaction:
      kind: choice
      choices:
        - id: ask_for_it_back
          label: Ask for it. In writing, with the entry copied out.
          outcomes:
            - id: asked
              weight: 62
              text: >-
                It comes back inside two months with a courteous letter that
                does not admit anything and does not need to, and the mark
                under theirs is still under theirs. The house is nine crowns
                better off and has told another house exactly how good its
                records are.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: { slot: RIVAL }, to: head, sentiment: -10 }
            - id: they_deny_it
              weight: 38
              text: >-
                The reply says the volume was bought at Sarrow in 1058, three
                years before the entry, and encloses a copy of a receipt.
                Either the receipt or this family's archive is wrong, and both
                are now in circulation, and there is no third document
                anywhere that can settle it.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_which_house_owns_the_book, accuracy: 0.4 }
        - id: leave_it_on_their_shelf
          label: Leave it. Two generations is two generations.
          outcomes:
            - id: left
              weight: 100
              text: >-
                The entry stays in the archive, where it will be read by
                somebody in about ninety years who does not know the book has
                been given up on. He will write to Cawdry about it. He will do
                it in a much worse year than this one, and he will be entirely
                within his rights.
              effects:
                - { kind: flag, flag: the_lent_book_left_alone, set: true }
              # #334: "read by somebody in about ninety years ... He will write to Cawdry about it."
              next: { event: a_letter_to_cawdry_about_a_book, after: { minYears: 85, maxYears: 95 } }

  # #334: the reader of the_lent_book_left_alone. No binding is kept: ninety years on, the rival is whoever holds that house now.
  - id: a_letter_to_cawdry_about_a_book
    title: A Letter to Cawdry About a Book
    tier: head
    frequency: common
    weight: 100
    tags: [library, rival, records, law]
    purposes: [change_relationship, change_standing, force_record_choice]
    conditions:
      all:
        - { flag: the_lent_book_left_alone, is: true }
    slots:
      HEAD: { role: head }
      RIVAL: { role: rival, filters: [{ status: [alive] }] }
    body: >-
      The archive room is cold enough to see your breath in, and the steward's
      grandson has been working through it a press at a time. He has found the
      entry for the lent book, with the year and the borrower's name, and
      nothing under it to say the house ever gave it up. So he has written to
      Cawdry. The letter is in the carrier's satchel by the time {HEAD} hears
      of it. It is a good letter, and it is entirely within the house's
      rights. It names the house {RIVAL} now holds, and that house has a seat
      on the assize bench this year. The carrier leaves on Thursday.
    interaction:
      kind: choice
      choices:
        - id: let_the_letter_go
          label: Let it go to Cawdry. The entry is true.
          outcomes:
            - id: the_letter_went
              weight: 100
              text: >-
                The clerk at Cawdry enters it, and the other house answers with
                the receipt from Sarrow it sent ninety years ago. Nothing is
                decided. Both houses now have a grievance on file, and theirs sits
                on the bench.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: { slot: RIVAL }, to: head, sentiment: -12 }
                - { kind: flag, flag: the_lent_book_left_alone, set: false }
        - id: send_a_rider
          label: Send a rider after the carrier.
          outcomes:
            - id: recalled
              weight: 100
              text: >-
                The rider catches him at the ford, and the letter comes back with
                its seal whole. The steward's grandson is told why, and does not
                like it. The entry stays in the archive for somebody else to find.
              effects:
                - { kind: treasury, delta: -2 }
                - { kind: relationship, from: household, to: head, sentiment: -4 }

  # #1812: a former rival survives a settlement; annual cast maintenance can
  # mint a new opponent instead of waiting for that person to die.
  - id: the_second_signature
    title: The Rival's Second Signature
    tier: head
    frequency: common
    weight: 75
    tags: [rival, agreement, assize, records]
    purposes: [buy_patience, change_relationship, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      RIVAL: { role: rival, filters: [{ status: [alive] }] }
    body: >-
      At the Warden's table in Cawdry, {RIVAL} lays down a second copy of the quarrel that has
      kept both houses sending riders to the assize. A settlement will cost {HEAD} eight crowns
      and a public concession, but it will take {RIVAL}'s name off the roll of claimants.
      Refusing leaves the mark there for the next clerk, and the next Head, to read.
    interaction:
      kind: choice
      choices:
        - id: put_the_seal_to_it
          label: Put a seal to it. Let this rivalry end here.
          outcomes:
            - id: the_seals_agreed
              weight: 100
              text: >-
                The clerk sand-dries the page and writes that {RIVAL} has withdrawn the claim. {HEAD}
                pays eight crowns and yields a place on the Roll. Neither man dies; the seal merely frees
                a name that has held the opposite chair too long. A later claimant will have to bring a
                different case.
              effects:
                - { kind: treasury, delta: -8 }
                - { kind: respect, delta: -1 }
                - { kind: relationship, from: head, to: { slot: RIVAL }, sentiment: 12 }
                - { kind: recast, slot: RIVAL }
              next: { event: the_name_under_the_second_signature, after: { minYears: 3, maxYears: 6 }, keep: [RIVAL] }
        - id: let_the_claim_stand
          label: Leave the claim standing. Do not buy peace with precedence.
          outcomes:
            - id: the_quarrel_kept
              weight: 100
              text: >-
                The two copies go back into different satchels. {RIVAL} says nothing on the stairs, which
                is not forgiveness. The Warden's clerk leaves the dispute entered under both names; the
                next encounter will carry this refusal into the room before either man speaks.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: relationship, from: { slot: RIVAL }, to: head, sentiment: -12, grudge: { severity: 12, inheritance: heir_only } }

  - id: the_name_under_the_second_signature
    title: A Different Hand on the Roll
    tier: head
    frequency: common
    weight: 100
    tags: [rival, agreement, assize, records]
    purposes: [change_relationship, change_standing, plant_rumour]
    slots:
      HEAD: { role: head }
      RIVAL:
        role: rival
        bind: arc
        onMissing: continue_absent
      NEW_RIVAL: { role: rival, filters: [{ status: [alive] }] }
    body: >-
      Years after {RIVAL} put his seal beside {HEAD}'s, {NEW_RIVAL} comes to the same table at
      Cawdry with a different grievance. The clerk points to the older settlement and names
      {RIVAL} aloud: that name left the roll without a funeral, and nothing in the new claim
      undoes the peace that was bought. {NEW_RIVAL} has brought new witnesses and means to be
      heard in his own right.
    absentBody: >-
      The second signature remains on file, though its signer is no longer at the table.
      {NEW_RIVAL} brings a new claim before {HEAD}; the Warden's clerk reads the old settlement
      into the Roll first, so the house's previous peace is not mistaken for this new quarrel.
    interaction:
      kind: narration
      outcomes:
        - id: another_claim
          weight: 100
          text: >-
            The new petition is entered separately, with the old settlement copied beneath it.
            {NEW_RIVAL} hears the clerk read the previous rival's name and learns what the house once
            paid to end an argument; this time no one has offered a price. The quarrel begins with a
            record of how one ended.
          effects:
            - { kind: relationship, from: head, to: { slot: NEW_RIVAL }, sentiment: -6 }

proseVariants:
  - address: "content:events/neighbours.yaml#events[id=the_second_signature].title"
    of: "a98019ecf9dfb740"
    plainenglish: >-
      A Second Signature from the Rival
  - address: "content:events/neighbours.yaml#events[id=the_second_signature].body"
    of: "351f742f6af0a54b"
    plainenglish: >-
      At the Warden's table in Cawdry, {RIVAL} lays down another copy of the complaint between
      the houses. {HEAD} can settle it by paying eight crowns and admitting a fault in public.
      That would end {RIVAL}'s claim. Or the house can refuse and leave the complaint for the
      next official and the next Head.
  - address: "content:events/neighbours.yaml#events[id=the_second_signature].interaction.choices[id=put_the_seal_to_it].label"
    of: "c2cb7ac5c57114f9"
    plainenglish: >-
      Sign the settlement and end this rivalry.
  - address: "content:events/neighbours.yaml#events[id=the_second_signature].interaction.choices[id=put_the_seal_to_it].outcomes[id=the_seals_agreed].text"
    of: "08eb08fa9353827e"
    plainenglish: >-
      The clerk dries the ink and records that {RIVAL} has dropped the claim. {HEAD} pays eight
      crowns and loses standing. Both people live, but this dispute ends. Anyone who challenges
      the house later must bring a new claim.
  - address: "content:events/neighbours.yaml#events[id=the_second_signature].interaction.choices[id=let_the_claim_stand].label"
    of: "902f365902aed3fd"
    plainenglish: >-
      Refuse the settlement. Keep the claim open.
  - address: "content:events/neighbours.yaml#events[id=the_second_signature].interaction.choices[id=let_the_claim_stand].outcomes[id=the_quarrel_kept].text"
    of: "7dccefe2e5299e86"
    plainenglish: >-
      Each house takes back its copy. {RIVAL} does not speak on the stairs. The clerk leaves
      the complaint under both names, so the next meeting will still be about this refusal.
  - address: "content:events/neighbours.yaml#events[id=the_name_under_the_second_signature].title"
    of: "cfe7878bc18a524f"
    plainenglish: >-
      A New Rival Takes the Place
  - address: "content:events/neighbours.yaml#events[id=the_name_under_the_second_signature].body"
    of: "a567118c444fdb80"
    plainenglish: >-
      Years after {RIVAL} signed the settlement with {HEAD}, {NEW_RIVAL} brings another
      complaint to Cawdry. The clerk reads {RIVAL}'s name from the old agreement, which still
      stands. {NEW_RIVAL} has different witnesses and a different case.
  - address: "content:events/neighbours.yaml#events[id=the_name_under_the_second_signature].absentBody"
    of: "e6bc4163db260907"
    plainenglish: >-
      The old agreement remains even though its signer is gone. {NEW_RIVAL} brings a new
      complaint to {HEAD}. The clerk reads the first settlement before recording the new
      dispute.
  - address: "content:events/neighbours.yaml#events[id=the_name_under_the_second_signature].interaction.outcomes[id=another_claim].text"
    of: "4687e26d17fdc219"
    plainenglish: >-
      The clerk records this as a new complaint and copies the old agreement below it.
      {NEW_RIVAL} hears what the house once paid to settle a quarrel. No one offers a
      settlement today.
  - address: "content:events/neighbours.yaml#events[id=the_letter_from_yssanne].title"
    of: "a2935b9c3e1446b0"
    plainenglish: >-
      A Letter Eleven Months on the Road
  - address: "content:events/neighbours.yaml#events[id=the_letter_from_yssanne].body"
    of: "84277a0df24d0ef9"
    plainenglish: >-
      It arrives from Sarrow in a factor's bag, eleven months after it left Yssanne. Nobody at
      Ardwen can read the handwriting. Pinned to it is an Ambric translation, made by someone
      who was paid two marks a day for it. A Yssene house is asking about a marriage. This
      family's records put it four generations back; theirs put it five. A reply will take
      another eleven months, and the man who asked will be dead before it arrives. The gap
      between four and five is the gap between a cousin and a stranger, under a law that Aubren
      does not recognise and cannot quite ignore.
  - address: "content:events/neighbours.yaml#events[id=the_letter_from_yssanne].interaction.choices[id=answer_it_properly].label"
    of: "fc4cc1d1dda615ad"
    plainenglish: >-
      Reply, and set out the full descent.
  - address: "content:events/neighbours.yaml#events[id=the_letter_from_yssanne].interaction.choices[id=answer_it_properly].outcomes[id=answered].text"
    of: "237db873536781ff"
    plainenglish: >-
      It costs nine crowns for a copyist, an advocate and the carriage. A document leaves this
      house stating, in writing, to a party abroad, what this house says its own descent is. It
      is the fullest account of the line the family has ever written down. Someone in Yssanne
      files it, and Yssene houses do not lose paper either.
  - address: "content:events/neighbours.yaml#events[id=the_letter_from_yssanne].interaction.choices[id=let_it_lie].label"
    of: "7c8733c9baac1ddd"
    plainenglish: >-
      Leave it. He will be dead before any reply arrives.
  - address: "content:events/neighbours.yaml#events[id=the_letter_from_yssanne].interaction.choices[id=let_it_lie].outcomes[id=unanswered].text"
    of: "8f89ac444aae7c60"
    plainenglish: >-
      No reply goes south, and after the second year nobody expects one. Within a generation the
      letter is just a curiosity kept in the press. The Yssene house records that the question
      was asked and not answered, because that is what their law does with silence. By their
      count, the descent stands at five.
  - address: "content:events/neighbours.yaml#events[id=a_slight_at_a_door].title"
    of: "a47e76d8ebdfbbe4"
    plainenglish: >-
      Who Walks Through First
  - address: "content:events/neighbours.yaml#events[id=a_slight_at_a_door].body"
    of: "8654b242096c9f86"
    plainenglish: >-
      At the door of the assize hall at Cawdry, with about forty people in the passage behind,
      {RIVAL} walks through ahead of {HEAD}. He does not hurry, and that is what makes it an
      insult. Here, politeness is all about who goes first. An insult of this kind can be
      denied, lasts for ever and costs nothing. All forty people in that passage understood it,
      and none of them will ever mention it. The Warden sits in a quarter of an hour.
  - address: "content:events/neighbours.yaml#events[id=a_slight_at_a_door].interaction.choices[id=answer_it_now].label"
    of: "0e698f580faff07c"
    plainenglish: >-
      Answer it now, in the passage, in front of all forty.
  - address: "content:events/neighbours.yaml#events[id=a_slight_at_a_door].interaction.choices[id=answer_it_now].outcomes[id=answered_in_the_passage].text"
    of: "196697039d23266f"
    plainenglish: >-
      Six quiet words, close enough that only the four at the front hear. By noon those four
      have told the other thirty-six. {RIVAL} goes white and says nothing. The Warden's steward,
      who is paid well to stop exactly this, notes both of them as men who will need to be
      seated apart for the next thirty years.
  - address: "content:events/neighbours.yaml#events[id=a_slight_at_a_door].interaction.choices[id=remember_it].label"
    of: "466c38bd7cb39061"
    plainenglish: >-
      Say nothing, but remember it.
  - address: "content:events/neighbours.yaml#events[id=a_slight_at_a_door].interaction.choices[id=remember_it].outcomes[id=remembered].text"
    of: "cb97d293f5cae63f"
    plainenglish: >-
      Nothing happens in the passage, and the assize starts on time. It happens twice more that
      year, at Bramme and at a wedding, and each time it looks a little more natural. By the
      third time it is no longer an insult. It is simply the order of precedence, and sooner or
      later the heralds write the order down.
  - address: "content:events/neighbours.yaml#events[id=the_wall_nobody_mends].title"
    of: "705cdace1fc6f732"
    plainenglish: >-
      Four Hundred Yards of Wall
  - address: "content:events/neighbours.yaml#events[id=the_wall_nobody_mends].body"
    of: "7375ba68248b2f6c"
    plainenglish: >-
      The march wall between this house's high pasture and the next holding has been broken in
      three places since a bad Frostfall. In two years the other side has not sent a single man
      to fix it. Their animals come through and graze the house's grass every day of the summer.
      That is either neglect or a very slow claim to the land, and from here there is no telling
      which. Mending it would take the house's own men nine days, and would admit that the wall
      on that line is the house's to mend. The Warden will hear a boundary case at Cawdry in
      Ingathering, and will want papers that neither side has.
  - address: "content:events/neighbours.yaml#events[id=the_wall_nobody_mends].interaction.choices[id=mend_it_ourselves].label"
    of: "cb550c63dd0feb47"
    plainenglish: >-
      Mend it ourselves, and say nothing about whose wall it is.
  - address: "content:events/neighbours.yaml#events[id=the_wall_nobody_mends].interaction.choices[id=mend_it_ourselves].outcomes[id=mended].text"
    of: "02e35566e6a92a2a"
    plainenglish: >-
      Four men spend nine days rebuilding four hundred yards of drystone, and they know how to
      do it. By Haying the grass is the house's again. In 1148 a clerk finds a note that this
      house mended that wall, and reads it exactly the way the other side would want it read.
  - address: "content:events/neighbours.yaml#events[id=the_wall_nobody_mends].interaction.choices[id=mend_it_ourselves].outcomes[id=mended].effects[1].text"
    of: "609c8ea5d429cbc9"
    plainenglish: >-
      The house used its own men to mend the march wall on the high pasture, and said nothing
      about whose wall it was.
  - address: "content:events/neighbours.yaml#events[id=the_wall_nobody_mends].interaction.choices[id=take_it_to_cawdry].label"
    of: "e68ad499267aff2d"
    plainenglish: >-
      Take it to the assize and make them show something.
  - address: "content:events/neighbours.yaml#events[id=the_wall_nobody_mends].interaction.choices[id=take_it_to_cawdry].outcomes[id=heard_at_cawdry].text"
    of: "4c1ee506b0333c52"
    plainenglish: >-
      It takes two days at Cawdry and four crowns for an advocate. Neither side brings a single
      sheet of paper, so the Warden does what the Warden always does: he rules by custom, as the
      oldest men present describe it. Two of those oldest men are the house's tenants. For the
      first time in its history, the line is written into the province's record.
  - address: "content:events/neighbours.yaml#events[id=the_wall_nobody_mends].interaction.choices[id=take_it_to_cawdry].outcomes[id=heard_at_cawdry].effects[2].text"
    of: "70f3db155eb7f3e1"
    plainenglish: >-
      At Cawdry the march wall was ruled to be the house's, on the word of its own tenants.
  - address: "content:events/neighbours.yaml#events[id=the_wall_nobody_mends].interaction.choices[id=take_it_to_cawdry].outcomes[id=found_against].text"
    of: "e1af35a4340af408"
    plainenglish: >-
      It takes two days at Cawdry and four crowns. Three fell-graziers who have been on that
      hill every summer of their lives say the wall has always been the house's. They say it
      plainly, and they are not lying. The line is written down against the house. It is a
      hundred and eleven yards of pasture, and a permanent entry in the province's record.
  - address: "content:events/neighbours.yaml#events[id=the_wall_nobody_mends].interaction.choices[id=take_it_to_cawdry].outcomes[id=found_against].effects[2].text"
    of: "91b12d50bb9879cc"
    plainenglish: >-
      At Cawdry the march wall was ruled against the house, and the line was written down.
  - address: "content:events/neighbours.yaml#events[id=the_invitation_from_cawdry].title"
    of: "424bf7c1da67a735"
    plainenglish: >-
      The Price of Being Seen There
  - address: "content:events/neighbours.yaml#events[id=the_invitation_from_cawdry].body"
    of: "66fda09a4a1304d6"
    plainenglish: >-
      Twice a year the Warden holds a dinner, and this house is on the list for the Ingathering
      one, which it is not always. Going means four days of riding, a night at an inn each way,
      and clothes the family does not own: at this rank, true black and deep red are licensed,
      and licensed colour is expensive. Not going leaves no mark in anyone's book, only an empty
      place at a table for thirty. A refusal takes four lines and a mark to pay the rider.
  - address: "content:events/neighbours.yaml#events[id=the_invitation_from_cawdry].interaction.decidedBy.state[0].because"
    of: "2a61c8a8b78840d4"
    plainenglish: >-
      the house cannot afford the right clothes, and everyone at that table would know it
  - address: "content:events/neighbours.yaml#events[id=the_invitation_from_cawdry].interaction.choices[id=go_to_cawdry].label"
    of: "e084a911d069904d"
    plainenglish: >-
      Go. Sit at the table and be seen there.
  - address: "content:events/neighbours.yaml#events[id=the_invitation_from_cawdry].interaction.choices[id=go_to_cawdry].outcomes[id=went].text"
    of: "d32ddc1fee98f79b"
    plainenglish: >-
      It costs twenty-six crowns in cloth and four days on the road. For one evening, eleven
      people who have not spoken to this family in nine years speak to it. Nothing is agreed and
      nothing is asked. Two years later, someone proposes a marriage they would never have
      proposed to a house nobody had seen.
  - address: "content:events/neighbours.yaml#events[id=the_invitation_from_cawdry].interaction.choices[id=write_the_regrets].label"
    of: "d26d5ddf1f30621b"
    plainenglish: >-
      Send apologies. Four lines and a mark for the rider.
  - address: "content:events/neighbours.yaml#events[id=the_invitation_from_cawdry].interaction.choices[id=write_the_regrets].outcomes[id=regrets].text"
    of: "93ae7f90e73c1d2c"
    plainenglish: >-
      Four properly worded lines in the steward's best handwriting, and an empty place at a
      table for thirty that is laid out in a careful order. The Warden does not notice. The
      Warden's steward does, because noticing is his job, and he is the one who draws up the
      list for next Ingathering.
  - address: "content:events/neighbours.yaml#events[id=the_yssene_house_at_cawdry].title"
    of: "2442c7f12fe512bd"
    plainenglish: >-
      Perfectly Mannered, Poor, and Not at All Impressed
  - address: "content:events/neighbours.yaml#events[id=the_yssene_house_at_cawdry].body"
    of: "84739b951d256369"
    plainenglish: >-
      There are perhaps nine Yssene families in the whole kingdom. One of them lives nineteen
      miles away at Cawdry. They were exiled two generations ago, they are very poor, and their
      manners are better than anyone in the Nethering has ever had to deal with. {YSSENE} visits
      in Highsun, drinks one cup, and suggests a match between the two houses. It takes four
      minutes, and the word is never once used. Their inheritance law is not Aubren's: it would
      put a daughter's line ahead of a brother's. Nobody in this province knows how to have that
      argument, and everybody in it knows a good match when they see one.
  - address: "content:events/neighbours.yaml#events[id=the_yssene_house_at_cawdry].interaction.choices[id=open_the_question].label"
    of: "e7bcb44a46ad551e"
    plainenglish: >-
      Open talks. A good match is a good match.
  - address: "content:events/neighbours.yaml#events[id=the_yssene_house_at_cawdry].interaction.choices[id=open_the_question].outcomes[id=opened].text"
    of: "183bf5183d44871c"
    plainenglish: >-
      Three visits, two letters, and an advocate at two marks a day. On the second afternoon he
      admits he cannot tell the house what it is agreeing to. The manners are the best this hall
      has ever seen, and nobody in it can understand the terms. Somewhere in the fourth clause
      is a sentence about heirs that will matter in about ninety years.
  - address: "content:events/neighbours.yaml#events[id=the_yssene_house_at_cawdry].interaction.choices[id=stay_clear].label"
    of: "a01d6148d6b5e25c"
    plainenglish: >-
      Keep away. We cannot read their law, and they can read ours.
  - address: "content:events/neighbours.yaml#events[id=the_yssene_house_at_cawdry].interaction.choices[id=stay_clear].outcomes[id=stayed_clear].text"
    of: "43e316599f44f0b5"
    plainenglish: >-
      With someone so well mannered, the only way to say no is never quite to answer, and that
      takes a year and a half. {YSSENE} behaves perfectly to the very end. The house has refused
      the one alliance in the province that nobody else in the province could have made. Its own
      cadets will remind it of this twice a generation.
  - address: "content:events/neighbours.yaml#events[id=a_company_outside_bramme].title"
    of: "47f42a039bba5bf7"
    plainenglish: >-
      Marches Men, Waiting for a War
  - address: "content:events/neighbours.yaml#events[id=a_company_outside_bramme].body"
    of: "3554ca462b5d7dea"
    plainenglish: >-
      Two hundred Marches men are camped in the water meadow outside Bramme, enough of them to
      make the magistrate very polite. They are paid by the month and loyal until the month runs
      out, and there is no war anywhere to send them to. On the second day their captain rides
      up the hill alone. He is courteous, and asks whether the house needs eleven men for the
      winter, at eleven crowns a month for all of them. It is a fair price. It is also the only
      offer he will make, and everyone in the yard knows the alternative is not another offer.
  - address: "content:events/neighbours.yaml#events[id=a_company_outside_bramme].interaction.choices[id=take_eleven].label"
    of: "48dfb3b11437cc5d"
    plainenglish: >-
      Hire eleven of them for the winter.
  - address: "content:events/neighbours.yaml#events[id=a_company_outside_bramme].interaction.choices[id=take_eleven].outcomes[id=hired].text"
    of: "92bc9f122e0c720e"
    plainenglish: >-
      It costs forty-four crowns over four months. Eleven men live in the yard, polite, filthy,
      capable and not at all interested in anything that goes on in this house. For the first
      time in ninety years, the gate is watched every night. Nothing at all happens all winter,
      and that is what the money bought.
  - address: "content:events/neighbours.yaml#events[id=a_company_outside_bramme].interaction.choices[id=bar_the_gate].label"
    of: "190dddf375850e17"
    plainenglish: >-
      Say no, and bring the tenants' animals inside the wall.
  - address: "content:events/neighbours.yaml#events[id=a_company_outside_bramme].interaction.choices[id=bar_the_gate].outcomes[id=refused].text"
    of: "44466be38b8ffcc7"
    plainenglish: >-
      Within three tendays they have left the water meadow and gone north, following someone
      else's news, and nothing at all happens on this land. For twenty-one nights the house's
      animals are kept inside the wall, and the tenants' animals with them. People remember
      that.
  - address: "content:events/neighbours.yaml#events[id=a_company_outside_bramme].interaction.choices[id=bar_the_gate].outcomes[id=they_take_it_anyway].text"
    of: "21af159efa5765fa"
    plainenglish: >-
      Nothing is stolen from this house, because it stands on a rise behind a wall. In one night
      four cottages at the bottom of the lane are stripped, and a man at Ockleigh is killed for
      a horse. Killing is a matter for the Warden's assize, which sits in eleven weeks. Everyone
      at Wick knows what was offered, and that the house said no.
  - address: "content:events/neighbours.yaml#events[id=a_marriage_offer_from_below].title"
    of: "a7ea5d1239e23b8e"
    plainenglish: >-
      A Draper's Daughter and 110 Crowns
  - address: "content:events/neighbours.yaml#events[id=a_marriage_offer_from_below].body"
    of: "e14f7a2371ea5d67"
    plainenglish: >-
      The wool-draper who turned this house down over the market day has one daughter and no
      sons. He would settle a hundred and ten crowns on her the day she married {SON}. She is
      nineteen, has been taught to keep accounts, and is better company than anyone this family
      has been offered in a generation. Her father is a burgess of Bramme, and her grandfather
      carted fleeces. A hundred and ten crowns is most of two years of this house's income, and
      the Roll of Houses has no column for it.
  - address: "content:events/neighbours.yaml#events[id=a_marriage_offer_from_below].interaction.choices[id=take_the_match].label"
    of: "a4d0257b0c694107"
    plainenglish: >-
      Accept. A hundred and ten crowns, and a woman who can keep accounts.
  - address: "content:events/neighbours.yaml#events[id=a_marriage_offer_from_below].interaction.choices[id=take_the_match].outcomes[id=married_in].text"
    of: "275a7ccf31eb8393"
    plainenglish: >-
      At Greening a hundred and ten crowns go into the coffer. Within a year the new
      daughter-in-law has the wage roll in order, and within two the rent book too. The heralds
      record the marriage without comment, because the heralds record everything. Four houses
      stop inviting this one, and nineteen years pass before anyone notices.
  - address: "content:events/neighbours.yaml#events[id=a_marriage_offer_from_below].interaction.choices[id=refuse_it].label"
    of: "bfcb7da7bf8771c3"
    plainenglish: >-
      Refuse. The line is not for sale by the crown.
  - address: "content:events/neighbours.yaml#events[id=a_marriage_offer_from_below].interaction.choices[id=refuse_it].outcomes[id=refused_below].text"
    of: "e22cb9e40ff9c518"
    plainenglish: >-
      The refusal is meant kindly, and Bramme hears it for exactly what it is. The forty
      households hear it within a tenday, because they hear everything. {SON} marries five years
      later, well enough, with sixty crowns. The draper's daughter marries at Cawdry, and thirty
      years on she is the richest woman in the province.
  - address: "content:events/neighbours.yaml#events[id=the_book_they_never_returned].title"
    of: "49f19ec9f960196d"
    plainenglish: >-
      Lent in 1061
  - address: "content:events/neighbours.yaml#events[id=the_book_they_never_returned].body"
    of: "1febc64c4ab33148"
    plainenglish: >-
      Reading a book takes a year of someone's life, and copying it takes half a year of someone
      else's. This house once lent a book to the house {RIVAL} now holds, and an entry in the
      archive says so and gives the year. Two generations have gone by. The book sits on their
      shelf and is talked of as theirs. Their mark is cut into the board, over another mark that
      is not quite hidden. Asking for it back means saying, in writing, that this family keeps a
      record of what it lends and to whom.
  - address: "content:events/neighbours.yaml#events[id=the_book_they_never_returned].interaction.choices[id=ask_for_it_back].label"
    of: "58643abaa46b213e"
    plainenglish: >-
      Ask for it, in writing, with the entry copied out.
  - address: "content:events/neighbours.yaml#events[id=the_book_they_never_returned].interaction.choices[id=ask_for_it_back].outcomes[id=asked].text"
    of: "cae5c7c4a4e97888"
    plainenglish: >-
      Within two months it comes back with a polite letter that admits nothing and does not need
      to. The old mark is still under theirs. The house is nine crowns better off, and has shown
      another house exactly how good its records are.
  - address: "content:events/neighbours.yaml#events[id=the_book_they_never_returned].interaction.choices[id=ask_for_it_back].outcomes[id=they_deny_it].text"
    of: "41529ecc28d0e308"
    plainenglish: >-
      The reply says the book was bought at Sarrow in 1058, three years before the entry, and
      includes a copy of a receipt. Either the receipt is wrong or this family's archive is.
      Both are now out in the world, and no third document anywhere can settle it.
  - address: "content:events/neighbours.yaml#events[id=the_book_they_never_returned].interaction.choices[id=leave_it_on_their_shelf].label"
    of: "b977423d9a483981"
    plainenglish: >-
      Let it go. Two generations is a long time.
  - address: "content:events/neighbours.yaml#events[id=the_book_they_never_returned].interaction.choices[id=leave_it_on_their_shelf].outcomes[id=left].text"
    of: "58a76b93547d19e7"
    plainenglish: >-
      The entry stays in the archive. In about ninety years someone will read it without knowing
      the book was given up on. He will write to Cawdry about it. He will do it in a far worse
      year than this one, and he will be completely within his rights.
  - address: "content:events/neighbours.yaml#events[id=a_letter_to_cawdry_about_a_book].title"
    of: "8e8da7f44413e6f0"
    plainenglish: >-
      A Letter to Cawdry About a Lent Book
  - address: "content:events/neighbours.yaml#events[id=a_letter_to_cawdry_about_a_book].body"
    of: "71b06d7bcc222e77"
    plainenglish: >-
      The archive room is so cold you can see your breath, and the steward's grandson has been
      working through it one cupboard at a time. He has found the record of the book the house
      lent out, with the year and the borrower's name, and nothing to say the house ever gave up
      on getting it back. So he has written to Cawdry. By the time {HEAD} hears about it, the
      letter is already in the carrier's bag. It is a good letter, and the house is fully within
      its rights. It names the house {RIVAL} now leads, and that house has a seat among the
      judges this year. The carrier leaves on Thursday.
  - address: "content:events/neighbours.yaml#events[id=a_letter_to_cawdry_about_a_book].interaction.choices[id=let_the_letter_go].label"
    of: "18f1eeab5fd009d7"
    plainenglish: >-
      Let it go to Cawdry. The record is true.
  - address: "content:events/neighbours.yaml#events[id=a_letter_to_cawdry_about_a_book].interaction.choices[id=let_the_letter_go].outcomes[id=the_letter_went].text"
    of: "35deef8d207313e9"
    plainenglish: >-
      The clerk at Cawdry records it, and the other house replies with the same receipt from
      Sarrow it sent ninety years ago. Nothing is settled. Both houses now have a complaint on
      file, and theirs sits among the judges.
  - address: "content:events/neighbours.yaml#events[id=a_letter_to_cawdry_about_a_book].interaction.choices[id=send_a_rider].label"
    of: "ae07d6ed78595089"
    plainenglish: >-
      Send someone on horseback to stop the carrier.
  - address: "content:events/neighbours.yaml#events[id=a_letter_to_cawdry_about_a_book].interaction.choices[id=send_a_rider].outcomes[id=recalled].text"
    of: "95f17fac800927c0"
    plainenglish: >-
      The rider catches him at the ford, and the letter comes back with its seal unbroken. The
      steward's grandson is told why, and he does not like it. The record stays in the archive
      for someone else to find.
