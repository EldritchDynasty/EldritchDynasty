# ARDWEN ITSELF.
#
# COMMON, all of it, for the reason set out at the top of village.yaml: the
# uncommon cooldown is global to its tier, and ordinary weather belongs where
# there is no cooldown at all.
#
# The hall is the one antagonist in this game that never leaves and never
# escalates. It is cold, it is dark, seven grates burn three, and the west
# wing's roof has been bad since about 1090 and will be quoted in every
# argument about money for the next nine hundred years. Nothing here is a
# crisis. Every one of them is a bill with an opinion attached, and every one
# of them is the player's to settle, because a house is not a place in this
# game — it is a standing account.
#
# Priced against what these displace. The expensive ones (the roof, the well)
# are the two that a house genuinely cannot put off forever; the rest are
# cheap on purpose, because a common template that costs forty crowns every
# time it fires is a tax on the calendar rather than a scene.
events:
  - id: the_west_wing_roof
    title: The Roof Has Been Bad Since 1090
    tier: head
    frequency: common
    weight: 80
    tags: [hall, money, hesk, upkeep]
    purposes: [buy_patience, change_standing, worldbuild_through_action]
    # #334: a slated roof is the thing that stops happening. The scene recurs
    # only while the west wing has never been done properly.
    conditions: { not: { flag: west_wing_slated, is: true } }
    slots:
      HEAD: { role: head }
    body: >-
      Water comes through the west wing in the second tenday of Thaw and it
      comes through in the same four places it came through for the last Head
      and the one before him. The slate-men of Hesk will do it properly for
      ninety crowns and a summer of scaffolding, and they say so without
      pressing, because they have said it to this family four times. The
      alternative is what the house has done four times. {HEAD} has the
      accounts open on the board and the sound of it in the next room.
    interaction:
      kind: choice
      choices:
        - id: hesk_properly
          label: Ninety crowns to Hesk. Do it once and stop paying for it.
          outcomes:
            - id: slated
              weight: 100
              text: >-
                Eighteen men, eleven weeks, and a roof that will outlast
                everybody who argued about it. The house eats plainly for two
                years and the west wing is dry for eighty. Nobody thanks a
                Head for a thing that stops happening.
              effects:
                - { kind: treasury, delta: -90 }
                - { kind: respect, delta: 1 }
                - { kind: flag, flag: west_wing_slated, set: true }
                - { kind: flag, flag: west_wing_patched_again, set: false }
        - id: patch_it_again
          label: Patch it again. It has held before.
          outcomes:
            - id: patched
              weight: 100
              text: >-
                Twelve crowns, a fortnight, and the yard man up a ladder in
                weather nobody should be up a ladder in. It holds. It holds
                the way it held the last time, which is to say until the wind
                comes round to the north.
              effects:
                - { kind: treasury, delta: -12 }
                - { kind: flag, flag: west_wing_patched_again, set: true }
              # #334: "until the wind comes round to the north". Chained, so the
              # patch is tested by the next hard winter rather than by the draw.
              next: { event: the_north_wind_finds_the_patch, after: { minYears: 3, maxYears: 8 } }

  # #334: the reader of west_wing_patched_again. It does not fire on a roof
  # that has since been slated. No HEAD binding: the wind finds whoever holds
  # the seal.
  - id: the_north_wind_finds_the_patch
    title: The North Wind Finds the Patch
    tier: head
    frequency: common
    weight: 100
    tags: [hall, money, hesk, upkeep]
    purposes: [buy_patience, change_standing, change_relationship]
    conditions:
      all:
        - { flag: west_wing_patched_again, is: true }
        - { not: { flag: west_wing_slated, is: true } }
    slots:
      HEAD: { role: head }
    body: >-
      The wind comes round to the north in Frostfall and stays there nine
      days, and every shutter on that side of the house knocks the whole time.
      On the fourth night the patch lifts like a page. The rain goes in behind
      it. {HEAD} stands in the west passage with a candle and listens to it
      drip onto the boards of two bedchambers and down the plaster of a third.
      The slate-men of Hesk climb up in the morning, come down slower, and say
      what they said the last time with a different number at the end of it.
      The rot is in the battens. Doing it properly is a hundred and ten crowns
      where it was ninety. The yard man has his ladder out already.
    interaction:
      kind: choice
      choices:
        - id: slate_it_now
          label: A hundred and ten crowns to Hesk. Do it properly this time.
          outcomes:
            - id: slated_at_last
              weight: 100
              text: >-
                Eighteen men again, and twelve weeks this time, because the
                battens come off with the slates. The house eats plainly for
                three years. The west wing is dry, and it stays dry.
              effects:
                - { kind: treasury, delta: -110 }
                - { kind: respect, delta: 1 }
                - { kind: flag, flag: west_wing_slated, set: true }
                - { kind: flag, flag: west_wing_patched_again, set: false }
        - id: patch_it_once_more
          label: Patch it once more. Twelve crowns.
          outcomes:
            - id: patched_once_more
              weight: 100
              text: >-
                Twelve crowns and the yard man up the ladder in the wind. The
                two chambers stay shut until Thaw, and the family sleeps three
                to a room in the east wing. It holds. Nobody expects it to.
              effects:
                - { kind: treasury, delta: -12 }
                - { kind: relationship, from: household, to: head, sentiment: -6 }

  - id: three_grates_of_seven
    title: Three Grates of Seven
    tier: family
    frequency: common
    weight: 85
    tags: [hall, winter, colliers, upkeep]
    purposes: [buy_patience, change_relationship, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      Seven grates and an ordinary winter lights three, and which three is a
      decision somebody makes in Frostfall and everybody lives with until
      Thaw. The colliers are out of the wood with charcoal that burns clean
      and hot and costs fourteen crowns for the season. The house's own
      woodland has plenty of green ash in it and green ash fills a room with
      smoke and half the heat. The steward has laid both figures on the board
      and is waiting to be told which room stays warm.
    interaction:
      kind: choice
      choices:
        - id: buy_charcoal
          label: Buy the burn. Light four grates and let the hall be warm.
          outcomes:
            - id: warm
              weight: 100
              text: >-
                Four grates from Frostfall to Thaw, and the long room stops
                being a place people go to argue and starts being a place they
                sit. The colliers are paid in full on the day, which is not
                what the colliers are used to, and they mention it in three
                villages.
              effects:
                - { kind: treasury, delta: -14 }
                - { kind: relationship, from: household, to: head, sentiment: 8 }
        - id: burn_green
          label: Burn what we cut. Three grates, as always.
          outcomes:
            - id: smoke
              weight: 100
              text: >-
                Green ash all winter, and by Deepwinter everybody in the hall
                coughs and nobody remarks on it. The saving is real and the
                steward enters it. Two of the youngest are still coughing at
                Greening.
              effects:
                - { kind: attribute, target: household, attr: health, delta: -2 }
                - { kind: treasury, delta: 1 }

  - id: the_gatehouse_nobody_has_shut
    title: A Gate Nobody Has Shut in Ninety Years
    tier: head
    frequency: common
    weight: 75
    tags: [hall, gate, standing, vigilance]
    purposes: [change_standing, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      The gates have stood open so long the hinges have grown a shape and the
      left leaf has settled four inches into the mud. A smith out of Bramme
      says he can hang a new pair for twenty-two crowns, and he says it in the
      yard, loudly, in front of the reeve. An open gate is a thing this family
      has been quietly proud of for three generations. It is also a thing
      anybody can walk through.
    interaction:
      kind: choice
      choices:
        - id: hang_new_gates
          label: Hang them. A house that can be walked into is walked into.
          outcomes:
            - id: hung
              weight: 100
              text: >-
                Oak, iron, and a bar that takes two men. They are shut for the
                first time on the second night and the sound carries down to
                Wick, where four people who have never once thought about the
                house stand in the street and listen to it.
              effects:
                - { kind: treasury, delta: -22 }
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_the_gate_was_shut, accuracy: 0.4 }
        - id: leave_it_open
          label: Leave it. Ninety years is an argument.
          outcomes:
            - id: left
              weight: 100
              text: >-
                The smith is paid a mark for the ride and goes back down the
                hill with a story. The gate stays where it is, and the house
                keeps the only claim it has that costs nothing at all — that
                anybody may come up, and always could.
              effects:
                - { kind: treasury, delta: -1 }
                - { kind: relationship, from: household, to: head, sentiment: 5 }

  - id: the_second_cellar_again
    title: Bricked, and Unbricked, and Bricked
    tier: head
    frequency: common
    weight: 70
    tags: [hall, cellar, secrecy, upkeep]
    purposes: [establish_magic_rule, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      KIN:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 15 } }, { relation: not, of: HEAD }]
    body: >-
      The second cellar is cold and dry and has been bricked up and opened
      again more times than the house can account for, which is itself the
      interesting fact about it. {KIN} wants it opened, on the grounds that a
      dry cellar is worth money and the house has none to waste. The mason
      wants six crowns and a day. Three crowns and a morning puts a fresh
      course over the old one and settles the question the way the last four
      Heads settled it.
    interaction:
      kind: choice
      choices:
        - id: open_it
          label: Open it. A dry cellar is a dry cellar.
          outcomes:
            - id: opened
              weight: 100
              text: >-
                Six crowns, and behind the course there is a room with nothing
                in it but a bench, a drain cut in the floor, and four iron
                rings set into the wall at a height that suits a standing man.
                The mason works the rest of the day without saying anything at
                all.
              effects:
                - { kind: treasury, delta: -6 }
                - { kind: knowledge, op: grant, flag: knows_the_rings_in_the_cellar }
                - { kind: rumour, op: seed, id: rumour_the_room_below_the_hall, accuracy: 0.3 }
        - id: brick_it
          label: Brick it. It was bricked for a reason and the reason is gone.
          outcomes:
            - id: bricked
              weight: 100
              text: >-
                Three crowns and a morning. {KIN} watches the last course go
                in and does not argue, and does not forget either, and the
                house has now made this decision five times without once
                writing down why.
              effects:
                - { kind: treasury, delta: -3 }
                - { kind: relationship, from: { slot: KIN }, to: head, sentiment: -8 }

  - id: tallow_and_wax
    title: Tallow, and What It Smells Like
    tier: family
    frequency: common
    weight: 80
    tags: [hall, guests, standing, upkeep]
    purposes: [change_relationship, change_standing, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      Wax is for the chapel and for guests, and tallow is for everybody else,
      and tallow stinks the way a rendered sheep stinks because that is what
      it is. Nine crowns buys wax enough to light the long room properly from
      Smoke to Thaw. The house has never done it. A visitor coming up the hill
      after dark can tell which it is from the yard, and so can everybody who
      lives here.
    interaction:
      kind: choice
      choices:
        - id: buy_wax
          label: Wax in the long room. All winter.
          outcomes:
            - id: waxed
              weight: 100
              text: >-
                Nine crowns and the room is a different room. People stay in
                it after the board is cleared, which they have not done in
                years, and two arguments that had been running since Harvest
                get finished in a week.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: relationship, from: household, to: head, sentiment: 7 }
        - id: keep_tallow
          label: Tallow. The chapel gets the wax and always has.
          outcomes:
            - id: tallow
              weight: 100
              text: >-
                The saving goes into the box and the smell goes into the
                wool, and by Longnight nobody notices either. A man up from
                Bramme notices both inside four steps and is far too polite to
                say so.
              effects:
                - { kind: respect, delta: -1 }

  - id: the_dovecote_and_the_seed
    title: What the Doves Eat
    tier: head
    frequency: common
    weight: 75
    tags: [hall, tenants, rights, food]
    purposes: [buy_patience, change_standing, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      A dovecote is the right of a landed house and this one holds four
      hundred birds, and four hundred birds eat off eleven tenancies every
      spring without asking. The reeve brings it up the way he brings
      everything up, which is by mentioning something else first. Nobody
      disputes the right. What they dispute is the number, and they have been
      disputing it politely since 1074.
    interaction:
      kind: choice
      choices:
        - id: cull_the_flight
          label: Cull it to two hundred. Say why, out loud, in the yard.
          outcomes:
            - id: culled
              weight: 100
              text: >-
                Two hundred birds down in a morning, salted, and half of them
                sent to Wick in the reeve's own cart. The right is not
                surrendered and everybody understands that it is not. It is
                the first thing this house has given up without being made to
                in about sixty years.
              effects:
                - { kind: treasury, delta: -4 }
                - { kind: respect, delta: 1 }
        - id: hold_the_right
          label: Hold the right entire. A right unused is a right lost.
          outcomes:
            - id: held
              weight: 100
              tags: [hard]
              text: >-
                The birds stay and the house eats well in a thin month, which
                is what a dovecote is for. The reeve says nothing further
                about it, this year or any year, and the number is still four
                hundred when his grandson has the office.
              effects:
                - { kind: treasury, delta: 4 }
                - { kind: respect, delta: -1 }

  - id: the_old_bitch_by_the_fire
    title: The Old Bitch by the Fire
    tier: family
    frequency: common
    weight: 85
    tags: [hall, dogs, signs, kindness]
    purposes: [change_relationship, plant_rumour, test_magic_rule]
    slots:
      HEAD: { role: head }
      CHILD: { role: child, filters: [{ status: [alive] }, { age: { op: gte, value: 5 } }] }
    body: >-
      She has been the best of the hall hounds for eleven years and she cannot
      get up the step any more. The yard man will do it behind the barn in the
      morning and has done it for six dogs before her without anybody being
      told. {CHILD} has worked out what the yard man is for. There is also the
      other thing, which nobody in the hall says and everybody has noticed:
      she has not gone into the west wing since Slaughter.
    interaction:
      kind: choice
      choices:
        - id: let_the_yard_man
          label: Let the yard man do it. It is what he is for.
          outcomes:
            - id: done_behind_the_barn
              weight: 100
              text: >-
                It takes no time at all and the hall is quieter for a fortnight
                in a way nobody can put a finger on. {CHILD} does not speak to
                the yard man again for two years. The pack will still not go
                into the west wing.
              effects:
                - { kind: relationship, from: { slot: CHILD }, to: head, sentiment: -10 }
                - { kind: rumour, op: seed, id: rumour_the_dogs_and_the_west_wing, accuracy: 0.3 }
        - id: keep_her
          label: Keep her by the fire until she stops.
          outcomes:
            - id: by_the_fire
              weight: 100
              text: >-
                Four more months, most of them asleep, and she is carried out
                at Thaw by two men who have both had a drink first. It costs
                the house nothing and the household notices anyway. Dogs are
                the one instrument in this house that cannot be asked a
                question twice.
              effects:
                - { kind: relationship, from: { slot: CHILD }, to: head, sentiment: 12 }
                - { kind: relationship, from: household, to: head, sentiment: 4 }

  - id: rushes_or_boards
    title: Rushes, or Boards
    tier: head
    frequency: common
    weight: 70
    tags: [hall, upkeep, standing, health]
    purposes: [buy_patience, change_standing, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      The long room still has rushes on it because the long room is the old
      wing, and rushes are cut, laid, walked on for a year and then taken up
      with whatever has gone into them. The new wings have boards. A carpenter
      out of Bramme will board the long room for sixteen crowns and be four
      tendays about it, working through the middle of the year with the family
      eating in the kitchen. Two crowns buys fresh rushes and a morning.
    interaction:
      kind: choice
      choices:
        - id: board_it
          label: Board it. The house can eat in the kitchen for a month.
          outcomes:
            - id: boarded
              weight: 100
              text: >-
                Sixteen crowns, four tendays, and a floor that can be swept.
                The room sounds different and everybody says so for a year.
                The last of the old rushes come up with three coins, a knife
                and a child's shoe in them, none of which anybody can account
                for.
              effects:
                - { kind: treasury, delta: -16 }
                - { kind: respect, delta: 1 }
        - id: fresh_rushes
          label: Fresh rushes. It has been good enough since the founding.
          outcomes:
            - id: rushes
              weight: 100
              text: >-
                Two crowns, a morning, and a room that smells of cut sedge for
                about nine days. The house at Cawdry has boards throughout and
                mentions it whenever anybody from the Nethering is in the
                room. Nobody at Ardwen has ever been in that room.
              effects:
                - { kind: treasury, delta: -2 }
                - { kind: rumour, op: seed, id: rumour_the_rushes_at_ardwen, accuracy: 0.5 }

  - id: the_well_in_a_dry_year
    title: The Well in a Dry Year
    tier: family
    frequency: common
    weight: 75
    tags: [hall, water, hardship, tenants]
    purposes: [buy_patience, change_relationship, change_standing]
    slots:
      HEAD: { role: head }
    body: >-
      Highsun with no rain in it since Greening, and the yard well is down to
      a foot of water that comes up the colour of the bucket. The well-sinker
      out of Cawdry wants twenty crowns to go down another fifteen feet and
      will not promise anything, because no well-sinker ever has. The Wend is
      a quarter mile downhill and running, and a cart and two barrels does six
      trips a day. Wick is drawing from the river already and has been for a
      tenday.
    interaction:
      kind: choice
      choices:
        - id: sink_it_deeper
          label: Sink it. Twenty crowns and no promises.
          outcomes:
            - id: struck_water
              weight: 62
              text: >-
                Fifteen feet, then nineteen, and on the fourth day water comes
                in cold enough to hurt a hand. It has not gone dry since, in
                any summer, in any of the years this chronicle covers.
              effects:
                - { kind: treasury, delta: -20 }
                - { kind: respect, delta: 1 }
            - id: nothing_down_there
              weight: 38
              text: >-
                Nineteen feet of rock, four days, and twenty crowns, and at
                the end of it the same foot of brown water there was before.
                The well-sinker is sorry and is paid, because that was the
                agreement and this house keeps agreements.
              effects:
                - { kind: treasury, delta: -20 }
        - id: cart_from_the_river
          label: Cart it up from the Wend and wait for rain.
          outcomes:
            - id: carted
              weight: 100
              text: >-
                Six trips a day for five tendays, and the hall drinks what
                Wick drinks, which nobody at Wick fails to notice. Small beer
                for everyone including the children, because the water is not
                trustworthy and this year it is river water besides. Two of
                the maids and a groom have the flux by Harvest.
              effects:
                - { kind: treasury, delta: -5 }
                - { kind: attribute, target: household, attr: health, delta: -2 }
                - { kind: relationship, from: household, to: head, sentiment: 5 }

proseVariants:
  - address: "content:events/the_hall.yaml#events[id=the_west_wing_roof].title"
    of: "d28a10a31d0d9a7f"
    plainenglish: >-
      The Roof Has Leaked Since 1090
  - address: "content:events/the_hall.yaml#events[id=the_west_wing_roof].body"
    of: "0fbaa54b576b4b97"
    plainenglish: >-
      Water comes through the west wing roof in the second tenday of Thaw. It comes through in
      the same four places it did for the last Head, and the Head before him. The slaters from
      Hesk will fix it properly for ninety crowns and a summer of scaffolding. They say so
      without pushing, because they have told this family the same thing four times. The other
      choice is what the house has done all four times. {HEAD} has the accounts open on the
      table, and can hear the dripping in the next room.
  - address: "content:events/the_hall.yaml#events[id=the_west_wing_roof].interaction.choices[id=hesk_properly].label"
    of: "2c83955cb2327b00"
    plainenglish: >-
      Pay Hesk the ninety crowns. Fix it once and stop paying for it.
  - address: "content:events/the_hall.yaml#events[id=the_west_wing_roof].interaction.choices[id=hesk_properly].outcomes[id=slated].text"
    of: "a7f2b957299f142b"
    plainenglish: >-
      It takes eighteen men and eleven weeks, and the roof will outlast everyone who argued
      about it. The house eats plain food for two years, and the west wing stays dry for eighty.
      Nobody thanks a Head for a problem that simply stops.
  - address: "content:events/the_hall.yaml#events[id=the_west_wing_roof].interaction.choices[id=patch_it_again].label"
    of: "2a7be3ebaf6aef97"
    plainenglish: >-
      Patch it once more. That has worked before.
  - address: "content:events/the_hall.yaml#events[id=the_west_wing_roof].interaction.choices[id=patch_it_again].outcomes[id=patched].text"
    of: "2f6e05f5e9d58289"
    plainenglish: >-
      It costs twelve crowns and two weeks, with the yard man up a ladder in weather nobody
      should be up a ladder in. It holds. It holds the way it did last time, which means until
      the wind turns to the north.
  - address: "content:events/the_hall.yaml#events[id=the_north_wind_finds_the_patch].title"
    of: "728a139ed20e3c52"
    plainenglish: >-
      The North Wind Breaks the Patch
  - address: "content:events/the_hall.yaml#events[id=the_north_wind_finds_the_patch].body"
    of: "339efd38b9aab434"
    plainenglish: >-
      In Frostfall the wind turns to the north and blows for nine days, and every shutter on
      that side of the house bangs the whole time. On the fourth night the patch lifts off the
      roof. The rain gets in behind it. {HEAD} stands in the west passage with a candle and
      listens to it drip onto the floors of two bedrooms and down the wall of a third. The
      roofers from Hesk climb up in the morning and come down more slowly. They say what they
      said last time, but with a different price. The roof timbers have rotted. Doing it
      properly now costs a hundred and ten crowns instead of ninety. The yard man already has
      his ladder out.
  - address: "content:events/the_hall.yaml#events[id=the_north_wind_finds_the_patch].interaction.choices[id=slate_it_now].label"
    of: "0f4d55b293561a2e"
    plainenglish: >-
      Pay Hesk a hundred and ten crowns. Do it properly this time.
  - address: "content:events/the_hall.yaml#events[id=the_north_wind_finds_the_patch].interaction.choices[id=slate_it_now].outcomes[id=slated_at_last].text"
    of: "b9a18f631b7161af"
    plainenglish: >-
      Eighteen men again, and twelve weeks this time, because the rotten timbers come off with
      the slates. The household eats plain food for three years. The west wing is dry, and it
      stays dry.
  - address: "content:events/the_hall.yaml#events[id=the_north_wind_finds_the_patch].interaction.choices[id=patch_it_once_more].label"
    of: "1ef6c0c96e8825b5"
    plainenglish: >-
      Patch it one more time. Twelve crowns.
  - address: "content:events/the_hall.yaml#events[id=the_north_wind_finds_the_patch].interaction.choices[id=patch_it_once_more].outcomes[id=patched_once_more].text"
    of: "42b2d05458da9e88"
    plainenglish: >-
      Twelve crowns, and the yard man up the ladder in the wind. The two bedrooms stay closed
      until Thaw, and the family sleeps three to a room in the east wing. The patch holds.
      Nobody expects it to last.
  - address: "content:events/the_hall.yaml#events[id=three_grates_of_seven].title"
    of: "9b9cd49f3bd7275b"
    plainenglish: >-
      Three Fires Out of Seven
  - address: "content:events/the_hall.yaml#events[id=three_grates_of_seven].body"
    of: "15fbf3eb15dd45d7"
    plainenglish: >-
      There are seven fireplaces, and in an ordinary winter only three are lit. Someone decides
      which three in Frostfall, and everyone lives with it until Thaw. The charcoal burners have
      come out of the woods with charcoal that burns clean and hot, at fourteen crowns for the
      season. The house's own woods are full of green ash, which fills a room with smoke and
      gives half the heat. The steward has set out both costs on the table and is waiting to
      hear which rooms stay warm.
  - address: "content:events/the_hall.yaml#events[id=three_grates_of_seven].interaction.choices[id=buy_charcoal].label"
    of: "81c7de03fd45909f"
    plainenglish: >-
      Buy the charcoal. Light four fires and keep the hall warm.
  - address: "content:events/the_hall.yaml#events[id=three_grates_of_seven].interaction.choices[id=buy_charcoal].outcomes[id=warm].text"
    of: "e9fd325109ab9f5d"
    plainenglish: >-
      Four fires burn from Frostfall to Thaw. The long room stops being a place people go to
      argue and becomes a place where they sit. The charcoal burners are paid in full on the
      day, which they are not used to, and they talk about it in three villages.
  - address: "content:events/the_hall.yaml#events[id=three_grates_of_seven].interaction.choices[id=burn_green].label"
    of: "4c1a4f19e5fa2a75"
    plainenglish: >-
      Burn our own wood. Three fires, as always.
  - address: "content:events/the_hall.yaml#events[id=three_grates_of_seven].interaction.choices[id=burn_green].outcomes[id=smoke].text"
    of: "3fef9514dcdb28f8"
    plainenglish: >-
      They burn green ash all winter. By Deepwinter everyone in the hall is coughing, and nobody
      mentions it. The money saved is real, and the steward writes it down. Two of the youngest
      children are still coughing at Greening.
  - address: "content:events/the_hall.yaml#events[id=the_gatehouse_nobody_has_shut].title"
    of: "ed14f49cc9085b38"
    plainenglish: >-
      A Gate Nobody Has Closed in Ninety Years
  - address: "content:events/the_hall.yaml#events[id=the_gatehouse_nobody_has_shut].body"
    of: "e003d0a7dda2d8cb"
    plainenglish: >-
      The gates have stood open so long that the hinges have set in place, and the left gate has
      sunk four inches into the mud. A smith from Bramme says he can hang a new pair for
      twenty-two crowns. He says it loudly, in the yard, in front of the reeve. For three
      generations this family has been quietly proud of its open gate. It also means anyone can
      walk in.
  - address: "content:events/the_hall.yaml#events[id=the_gatehouse_nobody_has_shut].interaction.choices[id=hang_new_gates].label"
    of: "0135498848cbeb9c"
    plainenglish: >-
      Hang new gates. A house anyone can walk into, people will walk into.
  - address: "content:events/the_hall.yaml#events[id=the_gatehouse_nobody_has_shut].interaction.choices[id=hang_new_gates].outcomes[id=hung].text"
    of: "fdf953957de3b6c1"
    plainenglish: >-
      Oak, iron, and a bar that takes two men to lift. They are closed for the first time on the
      second night, and the sound carries down to Wick. Four people who have never once thought
      about the house stand in the street and listen.
  - address: "content:events/the_hall.yaml#events[id=the_gatehouse_nobody_has_shut].interaction.choices[id=leave_it_open].label"
    of: "dc7db32a645ec316"
    plainenglish: >-
      Leave it. Ninety years is a good reason.
  - address: "content:events/the_hall.yaml#events[id=the_gatehouse_nobody_has_shut].interaction.choices[id=leave_it_open].outcomes[id=left].text"
    of: "ca6dbc132f907747"
    plainenglish: >-
      The smith is paid a mark for his trip and goes back down the hill with a story to tell.
      The gate stays as it is. The house keeps the one claim it has that costs nothing: anyone
      may come up, and anyone always could.
  - address: "content:events/the_hall.yaml#events[id=the_second_cellar_again].title"
    of: "ef0d909e7839996a"
    plainenglish: >-
      Walled Up, Opened, and Walled Up Again
  - address: "content:events/the_hall.yaml#events[id=the_second_cellar_again].body"
    of: "451faa7d15fe1cc1"
    plainenglish: >-
      The second cellar is cold and dry. It has been bricked up and opened again more times than
      the house can explain, and that is the interesting thing about it. {KIN} wants it opened,
      because a dry cellar is worth money and the house has none to waste. The mason wants six
      crowns and a day's work. For three crowns and a morning, he can add a new layer of bricks
      over the old one and settle the matter the way the last four Heads settled it.
  - address: "content:events/the_hall.yaml#events[id=the_second_cellar_again].interaction.choices[id=open_it].label"
    of: "52fc8ac23cea8cc6"
    plainenglish: >-
      Open it. A dry cellar is useful.
  - address: "content:events/the_hall.yaml#events[id=the_second_cellar_again].interaction.choices[id=open_it].outcomes[id=opened].text"
    of: "0f1540376f329feb"
    plainenglish: >-
      It costs six crowns. Behind the bricks is a room with nothing in it but a bench, a drain
      cut into the floor, and four iron rings fixed into the wall at about the height of a
      standing man. The mason works the rest of the day without saying a word.
  - address: "content:events/the_hall.yaml#events[id=the_second_cellar_again].interaction.choices[id=brick_it].label"
    of: "0e637bee12ab4552"
    plainenglish: >-
      Brick it up. It was bricked up for a reason, and that reason is gone.
  - address: "content:events/the_hall.yaml#events[id=the_second_cellar_again].interaction.choices[id=brick_it].outcomes[id=bricked].text"
    of: "4973eed3cb60f817"
    plainenglish: >-
      It costs three crowns and a morning. {KIN} watches the last row of bricks go in and does
      not argue, but does not forget either. The house has now made this decision five times
      without ever writing down why.
  - address: "content:events/the_hall.yaml#events[id=tallow_and_wax].title"
    of: "d3ab6ee5f9330fd9"
    plainenglish: >-
      Tallow Candles, and the Smell
  - address: "content:events/the_hall.yaml#events[id=tallow_and_wax].body"
    of: "5b1d928eb35fef2a"
    plainenglish: >-
      Wax candles are for the chapel and for guests. Everyone else gets tallow, and tallow
      stinks like boiled-down sheep, because that is what it is. Nine crowns would buy enough
      wax to light the long room properly from Smoke to Thaw. The house has never done it. A
      visitor coming up the hill after dark can smell which one is burning from the yard, and so
      can everyone who lives here.
  - address: "content:events/the_hall.yaml#events[id=tallow_and_wax].interaction.choices[id=buy_wax].label"
    of: "85ce6f64121be738"
    plainenglish: >-
      Wax candles in the long room, all winter.
  - address: "content:events/the_hall.yaml#events[id=tallow_and_wax].interaction.choices[id=buy_wax].outcomes[id=waxed].text"
    of: "96155de67799ccc2"
    plainenglish: >-
      Nine crowns, and it feels like a different room. People stay after the table is cleared,
      which they have not done for years, and two arguments that had gone on since Harvest are
      settled within a week.
  - address: "content:events/the_hall.yaml#events[id=tallow_and_wax].interaction.choices[id=keep_tallow].label"
    of: "0508f43e43590d42"
    plainenglish: >-
      Tallow. The chapel gets the wax, as it always has.
  - address: "content:events/the_hall.yaml#events[id=tallow_and_wax].interaction.choices[id=keep_tallow].outcomes[id=tallow].text"
    of: "13ef789857fe296c"
    plainenglish: >-
      The money saved goes into the cash box and the smell goes into everyone's clothes, and by
      Longnight nobody notices either. A visitor from Bramme notices both within four steps, and
      is far too polite to say so.
  - address: "content:events/the_hall.yaml#events[id=the_dovecote_and_the_seed].title"
    of: "46313d7b76c836df"
    plainenglish: >-
      What the Pigeons Eat
  - address: "content:events/the_hall.yaml#events[id=the_dovecote_and_the_seed].body"
    of: "235ffaf5adfd8651"
    plainenglish: >-
      A landed house has the right to keep a dovecote, and this one holds four hundred birds.
      Every spring, those four hundred birds eat from the fields of eleven tenant farms without
      asking. The reeve raises the matter the way he raises everything, by talking about
      something else first. Nobody questions the right. They question the number of birds, and
      they have been questioning it politely since 1074.
  - address: "content:events/the_hall.yaml#events[id=the_dovecote_and_the_seed].interaction.choices[id=cull_the_flight].label"
    of: "8d741a627d3a966e"
    plainenglish: >-
      Cut the flock to two hundred. Explain why, out loud, in the yard.
  - address: "content:events/the_hall.yaml#events[id=the_dovecote_and_the_seed].interaction.choices[id=cull_the_flight].outcomes[id=culled].text"
    of: "5bddd9be42ae6a8a"
    plainenglish: >-
      Two hundred birds are killed in one morning and salted, and half of them go to Wick in the
      reeve's own cart. The house does not give up the right, and everyone understands that. It
      is the first thing this house has given up without being forced to in about sixty years.
  - address: "content:events/the_hall.yaml#events[id=the_dovecote_and_the_seed].interaction.choices[id=hold_the_right].label"
    of: "dbc1767653069ed2"
    plainenglish: >-
      Keep the full right. A right you do not use is a right you lose.
  - address: "content:events/the_hall.yaml#events[id=the_dovecote_and_the_seed].interaction.choices[id=hold_the_right].outcomes[id=held].text"
    of: "d7bfc39b23364047"
    plainenglish: >-
      The birds stay, and the house eats well in a hungry month, which is what a dovecote is
      for. The reeve never raises it again, this year or any year. When his grandson becomes
      reeve, there are still four hundred birds.
  - address: "content:events/the_hall.yaml#events[id=the_old_bitch_by_the_fire].title"
    of: "23b9671b8db189c7"
    plainenglish: >-
      The Old Dog by the Fire
  - address: "content:events/the_hall.yaml#events[id=the_old_bitch_by_the_fire].body"
    of: "55d58a51e71d4e3d"
    plainenglish: >-
      She has been the best of the hall's hounds for eleven years, and now she cannot get up the
      step. In the morning the yard man will kill her behind the barn, as he has done for six
      dogs before her without anyone being told. {CHILD} has worked out what the yard man is
      for. There is something else too, which nobody in the hall says but everyone has noticed:
      she has not gone into the west wing since Slaughter.
  - address: "content:events/the_hall.yaml#events[id=the_old_bitch_by_the_fire].interaction.choices[id=let_the_yard_man].label"
    of: "9a38a47098d26394"
    plainenglish: >-
      Let the yard man do it. That is his job.
  - address: "content:events/the_hall.yaml#events[id=the_old_bitch_by_the_fire].interaction.choices[id=let_the_yard_man].outcomes[id=done_behind_the_barn].text"
    of: "6e8934c82dfba224"
    plainenglish: >-
      It is over quickly, and for two weeks the hall is quieter in a way nobody can quite
      explain. {CHILD} does not speak to the yard man for two years. The other dogs still will
      not go into the west wing.
  - address: "content:events/the_hall.yaml#events[id=the_old_bitch_by_the_fire].interaction.choices[id=keep_her].label"
    of: "cf340b70aae07df4"
    plainenglish: >-
      Keep her by the fire until she dies.
  - address: "content:events/the_hall.yaml#events[id=the_old_bitch_by_the_fire].interaction.choices[id=keep_her].outcomes[id=by_the_fire].text"
    of: "7d7b1f894428ef8d"
    plainenglish: >-
      She lives four more months, mostly asleep, and at Thaw she is carried out by two men who
      have both had a drink first. It costs the house nothing, and the household notices anyway.
      Dogs are the one thing in this house you cannot ask the same question twice.
  - address: "content:events/the_hall.yaml#events[id=rushes_or_boards].title"
    of: "954eba8b5ba3a237"
    plainenglish: >-
      Rushes or Floorboards
  - address: "content:events/the_hall.yaml#events[id=rushes_or_boards].body"
    of: "321bad1283c69406"
    plainenglish: >-
      The long room still has rushes on the floor, because it is in the old wing. Rushes are
      cut, laid down, walked on for a year, then taken up along with whatever has fallen into
      them. The new wings have wooden floors. A carpenter from Bramme will lay a wooden floor in
      the long room for sixteen crowns. It will take him four tendays in the middle of the year,
      and the family will eat in the kitchen. Fresh rushes cost two crowns and a morning.
  - address: "content:events/the_hall.yaml#events[id=rushes_or_boards].interaction.choices[id=board_it].label"
    of: "da56a441488caa75"
    plainenglish: >-
      Lay the floor. The family can eat in the kitchen for a month.
  - address: "content:events/the_hall.yaml#events[id=rushes_or_boards].interaction.choices[id=board_it].outcomes[id=boarded].text"
    of: "80efc4a56d8d1b69"
    plainenglish: >-
      Sixteen crowns and four tendays buy a floor you can sweep. The room sounds different, and
      everyone says so for a year. When the last old rushes come up, they contain three coins, a
      knife and a child's shoe, and nobody can explain any of them.
  - address: "content:events/the_hall.yaml#events[id=rushes_or_boards].interaction.choices[id=fresh_rushes].label"
    of: "8eb77caab14ffd06"
    plainenglish: >-
      Fresh rushes. They have been good enough since the house was founded.
  - address: "content:events/the_hall.yaml#events[id=rushes_or_boards].interaction.choices[id=fresh_rushes].outcomes[id=rushes].text"
    of: "ca07f11778c665b3"
    plainenglish: >-
      Two crowns and a morning, and the room smells of fresh-cut reeds for about nine days. The
      house at Cawdry has wooden floors everywhere and mentions it whenever anyone from the
      Nethering is there. Nobody from Ardwen has ever been in that room.
  - address: "content:events/the_hall.yaml#events[id=the_well_in_a_dry_year].title"
    of: "a7f2c1ae6dcdd19a"
    plainenglish: >-
      The Well Runs Low in a Dry Summer
  - address: "content:events/the_hall.yaml#events[id=the_well_in_a_dry_year].body"
    of: "82c4dc7f876a2a43"
    plainenglish: >-
      It is Highsun, and there has been no rain since Greening. The yard well is down to a foot
      of water, and it comes up the colour of the bucket. The well-digger from Cawdry wants
      twenty crowns to dig another fifteen feet down, and he will not promise anything, because
      no well-digger ever does. The Wend river is a quarter mile downhill and still flowing. A
      cart with two barrels can make six trips a day. Wick has already been drawing water from
      the river for a tenday.
  - address: "content:events/the_hall.yaml#events[id=the_well_in_a_dry_year].interaction.choices[id=sink_it_deeper].label"
    of: "90efc418da5a83ec"
    plainenglish: >-
      Dig deeper. Twenty crowns and no promises.
  - address: "content:events/the_hall.yaml#events[id=the_well_in_a_dry_year].interaction.choices[id=sink_it_deeper].outcomes[id=struck_water].text"
    of: "71916f9d13cf6ae1"
    plainenglish: >-
      Fifteen feet, then nineteen, and on the fourth day water comes in cold enough to hurt your
      hand. The well has not run dry since, in any summer, in all the years this chronicle
      covers.
  - address: "content:events/the_hall.yaml#events[id=the_well_in_a_dry_year].interaction.choices[id=sink_it_deeper].outcomes[id=nothing_down_there].text"
    of: "70e2f25a81a5d2ee"
    plainenglish: >-
      Nineteen feet of rock, four days and twenty crowns, and at the end there is the same foot
      of brown water as before. The well-digger is sorry, and he is paid anyway, because that
      was the deal and this house keeps its deals.
  - address: "content:events/the_hall.yaml#events[id=the_well_in_a_dry_year].interaction.choices[id=cart_from_the_river].label"
    of: "54f4a29770046063"
    plainenglish: >-
      Bring water up from the Wend by cart and wait for rain.
  - address: "content:events/the_hall.yaml#events[id=the_well_in_a_dry_year].interaction.choices[id=cart_from_the_river].outcomes[id=carted].text"
    of: "7e3dff10d83e374c"
    plainenglish: >-
      Six trips a day for five tendays, and the hall drinks what Wick drinks, which everyone at
      Wick notices. Everyone drinks weak beer, children included, because the water cannot be
      trusted and this year it is river water as well. By Harvest, two of the maids and a groom
      have dysentery.
