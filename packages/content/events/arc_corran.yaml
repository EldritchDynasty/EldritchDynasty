# Nodes of arc_nine_years_at_corran.
#
# The rule this arc exists to teach, over and over, at increasing cost: Mystic
# magic is a licensed trade, taught in a foreign country, practised by
# warranted people who charge by the job — and it is the only magic in this
# world that can be BOUGHT. Everything the family actually has is the other
# kind, and cannot be taught, cannot be warranted, and cannot be sent anywhere
# to be improved.
events:
  - id: corran_the_letters
    title: What the Letters Say, and When
    tier: family
    frequency: uncommon
    weight: 100
    tags: [corran, mystic, arc, distance]
    purposes: [establish_magic_rule, plant_rumour, test_magic_rule]
    arc: { of: arc_nine_years_at_corran, node: the_letters }
    slots:
      HEAD: { role: head }
      SON:
        role: family_member
        bind: arc
        onMissing: continue_absent
        filters: [{ sex: male }, { status: [alive] }]
    body: >-
      They come by ship in season and by road out of it, which means four in a
      good year and two in a bad one, and every one of them is between two and
      four months old before {HEAD} breaks the seal. {SON} is well. {SON} was
      well. The Colleges teach the four elemental affinities to men and the
      four Threshold ones to everybody, and he has been put to Terra, which he
      did not choose and cannot change, and he explains the reasoning at length
      in a hand that is getting smaller each letter to save paper. In the
      fourth year he asks a question about the family. It is a careful
      question. Nobody at Ardwen can work out what he is really asking, and by
      the time anybody has answered it he will long since have stopped wanting
      to know. Four months each way does that.
    absentBody: >-
      Four letters in a good year and two in a bad one, every one of them
      between two and four months old before the seal is broken. He is well. He
      was well. In the fourth year there is a careful question about the family
      in it, and nobody at Ardwen can work out what he is really asking, and by
      the time an answer gets to Anvary he will have stopped wanting to know.
    interaction:
      kind: choice
      choices:
        - id: answer_plainly
          label: Answer him plainly. He is ours and he is seven hundred miles away.
          outcomes:
            - id: answered
              weight: 100
              text: >-
                Four sheets, sent by ship, and the house spends a season
                knowing that four sheets of the truth about this family are
                somewhere on the water between here and Anvary in a bag with
                other people's letters. They arrive. He reads them in a room he
                shares with two Braccish boys. Nothing whatever comes of it,
                which the house does not find out for two years and does not
                stop being frightened about in the meantime.
              effects:
                - { kind: rumour, op: seed, id: rumour_the_letters_to_anvary, accuracy: 0.3 }
        - id: answer_nothing
          label: Answer around it. Weather, prices, his sister's marriage.
          outcomes:
            - id: deflected
              weight: 100
              text: >-
                He is nineteen and seven hundred miles away and he can read a
                letter that is not answering him as well as anybody in this
                family, because he was taught to by the people who wrote it.
                The next letter is shorter. The one after that is about the
                weather.
              effects:
                - { kind: relationship, from: { slot: SON }, to: head, sentiment: -18 }

  - id: corran_the_letters_stop
    title: Nothing Since the Spring
    tier: head
    frequency: uncommon
    weight: 100
    tags: [corran, mystic, arc, distance]
    purposes: [change_relationship, change_standing, test_magic_rule]
    arc: { of: arc_nine_years_at_corran, node: the_letters_stop }
    slots:
      HEAD: { role: head }
      SON:
        role: family_member
        bind: arc
        onMissing: continue_absent
        filters: [{ sex: male }, { status: [alive] }]
    body: >-
      Nothing since the spring, and it is now the spring after. That is not
      alarming by itself — a ship is a ship, a bag goes into the sea, a term
      runs long — and the house has told itself all three of those in order,
      about once a month, for fourteen months. A letter to the Colleges costs
      two marks and takes four months to be answered if it is answered. A man
      sent to Corran to ask in person costs eleven crowns, four months out and
      four back, and cannot be got word to once he has gone. Both of those are
      the same decision made twice at different prices, and {HEAD} has been
      making it every morning since the autumn.
    absentBody: >-
      Nothing since the spring, and it is the spring after. A ship is a ship, a
      bag goes into the sea, a term runs long, and this house has told itself
      all three in order about once a month for fourteen months. Two marks and
      four months for a letter that may not be answered. Eleven crowns and
      eight months for a man who cannot be got word to once he has gone.
    interaction:
      kind: choice
      choices:
        - id: send_a_man
          label: Send someone. Eleven crowns and eight months, and be done wondering.
          outcomes:
            - id: sent
              weight: 100
              text: >-
                He is a good man and he goes, and what he finds at Corran is a
                register with a line through a name, a proctor who is sorry and
                unhelpful in the correct proportions, and a room that was
                cleared eleven months ago. Nobody is obstructing anything.
                There is simply a boy who was there and is not there, and a
                foreign institution's entirely reasonable account of not
                knowing where he went.
              effects:
                - { kind: treasury, delta: -11 }
                - { kind: status, target: { slot: SON }, status: missing, cause: the Colleges at Corran }
                - { kind: rumour, op: seed, id: rumour_the_one_who_went_to_anvary, accuracy: 0.45 }
        - id: write_again
          label: Write again. Twice more if we must. Eleven crowns is a horse.
          outcomes:
            - id: wrote
              weight: 100
              text: >-
                Three letters over two years, and the third one is answered by
                a clerk who encloses the register entry with the line through
                it and regrets that the Colleges cannot assist further. The
                enclosure is a courtesy. It is also the only document this
                family will ever have about the end of that boy, and it cost
                six marks, and it is four lines long.
              effects:
                - { kind: treasury, delta: -1 }
                - { kind: status, target: { slot: SON }, status: missing, cause: the Colleges at Corran }
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_the_one_who_went_to_anvary, accuracy: 0.6 }

  - id: corran_what_came_back
    title: What Came Back
    tier: head
    frequency: rare
    weight: 100
    tags: [corran, mystic, arc, homecoming]
    purposes: [force_record_choice, plant_rumour, test_magic_rule]
    arc: { of: arc_nine_years_at_corran, node: what_came_back }
    slots:
      HEAD: { role: head }
      SON:
        role: family_member
        bind: arc
        onMissing: continue_absent
        filters: [{ sex: male }, { status: [alive, missing] }]
    body: >-
      A man comes up from Bramme on a hired horse in the autumn and gives the
      gate a name it has not heard aloud in nine years. He is the right age. He
      knows the west passage, the bad step on the cellar stair, and what the
      family calls the second cup, and he knows three things about that house
      that were not in any letter and are not in any book. He is also warranted
      — Terra, properly examined, the paper folded in oilcloth — and a
      warranted man in this family is a thing that has never existed and that
      the Church has opinions about. Nobody in the yard has yet used the word
      son, and the yard has been standing there for a considerable while.
    absentBody: >-
      A man comes up from Bramme on a hired horse and gives the gate a name it
      has not heard aloud in nine years. He is the right age. He knows the west
      passage, the bad step on the cellar stair and what this family calls the
      second cup, and he is warranted in Terra with the paper folded in
      oilcloth, and a warranted man in this family has never existed. Nobody in
      the yard has said the word son.
    interaction:
      kind: choice
      choices:
        - id: he_is_ours
          label: He is ours. Open the gate and do not ask him anything for a week.
          outcomes:
            - id: taken_back
              weight: 100
              text: >-
                He is at the table by nightfall and in the long room within a
                month, and he is competent, and he is paid work, and for eleven
                years the house has the only warranted practitioner in the
                Nethering under its own roof. He never once talks about the
                missing years. Two people in that household go to their graves
                privately certain he is not the boy who left, and neither of
                them ever says it to the other.
              effects:
                - { kind: status, target: { slot: SON }, status: alive }
                - { kind: career, target: { slot: SON }, op: assign, career: scholar }
                - { kind: treasury, delta: 60 }
                - { kind: respect, delta: 1 }
        - id: pay_him_off
          label: Pay him and send him on. A name is not a proof and we have no proofs.
          outcomes:
            - id: paid
              weight: 100
              text: >-
                Four crowns and a night in the gatehouse, and he takes both
                without arguing, which is the part that stays with everybody.
                He is on the Bramme road before light. The house is exactly as
                safe as it was and one whole degree colder, and there is
                nobody to be angry with about it, and that turns out to be the
                difficulty.
              effects:
                - { kind: treasury, delta: -4 }
                - { kind: respect, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_the_one_who_went_to_anvary, accuracy: 0.8 }
    record:
      subject: the man who came up from Bramme
      options:
        record:
          chronicle: >-
            A man came up in the autumn nine years after the boy went to
            Corran, knowing three things about this house that were in no
            letter, warranted in Terra and carrying the paper for it. What this
            house decided about him is written below. What he actually was is
            not written anywhere, because nobody ever established it.
          claims:
            - { kind: deed, target: { slot: SON }, text: 'came back from Bramme nine years later warranted in Terra, with his identity unproved' }
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            The house's son returned from nine years at the Colleges, warranted
            and examined, and was received at his own gate by his own family as
            anybody would be.
          effects:
            - { kind: respect, delta: 1 }
          # "Received at his own gate by his own family as anybody would be" —
          # which claims, of a man nobody could identify after nine years away,
          # that there is nothing the matter with him.
          claims:
            - { kind: attr, target: { slot: SON }, attr: madness, value: 0 }
          discrepancy:
            id: the_man_from_bramme
            severity: major
            provableBy: [the_church, house_ilm]
    rumour: { id: rumour_the_one_who_went_to_anvary, accuracy: 0.4, spread: 2 }
    accounts: [corran_register_entry, wick_on_the_man_who_came_back]

proseVariants:
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters].title"
    of: d11ec2d9a07299c5
    plainenglish: >-
      The Letters from Corran
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters].body"
    of: 706887b7175395b3
    plainenglish: >-
      The letters arrive by ship during sailing season and by road at other times. There are four in
      a good year and two in a bad one. Each is already two to four months old when {HEAD} opens it.
      {SON} writes that he is well, but that news is old by the time it arrives. {SON} studies at the
      Colleges, where men learn the four elemental affinities and everyone can learn the four
      Threshold affinities. He has been assigned Terra. He did not choose it and cannot change it.
      His letters explain why at length, in writing that gets smaller to save paper. In his fourth
      year, he asks a careful question about the family. Nobody at Ardwen understands what he really
      wants to know. By the time an answer arrives, he may no longer want it. A letter takes four
      months each way.
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters].absentBody"
    of: ab9b78245baf45c0
    plainenglish: >-
      There are four letters in a good year and two in a bad one. Each is already two to four months
      old when it arrives. He says he is well, but that news is old. In his fourth year, he asks a
      careful question about the family. Nobody at Ardwen understands what he really means. By the
      time an answer reaches Anvary, he may no longer want to know. The journey takes four months
      each way.
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters].interaction.choices[id=answer_plainly].label"
    of: 55d9a853ad749387
    plainenglish: >-
      Tell him the truth. He is family, even seven hundred miles away.
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters].interaction.choices[id=answer_plainly].outcomes[id=answered].text"
    of: 0075133b9dc1baa7
    plainenglish: >-
      The family sends four sheets explaining the truth about itself by ship. For a whole season, the
      household knows that those pages are travelling across the water to Anvary among strangers'
      letters. They reach him, and he reads them in a room shared with two Braccish boys. Nothing
      comes of it. The family does not learn that for two years, and remains frightened in the
      meantime.
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters].interaction.choices[id=answer_nothing].label"
    of: 5a526237175ae0ab
    plainenglish: >-
      Avoid his question. Write about the weather, prices and his sister's marriage.
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters].interaction.choices[id=answer_nothing].outcomes[id=deflected].text"
    of: 42b6baeea0e7e9f2
    plainenglish: >-
      He is nineteen and seven hundred miles away, but he knows when a letter avoids his question. He
      learned to recognise that kind of letter from the family who wrote it. His next letter is
      shorter. The one after that talks only about the weather.
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters_stop].title"
    of: 82dd7360be2bffcc
    plainenglish: >-
      No Letters Since Last Spring
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters_stop].body"
    of: e97acccf2ba48a5b
    plainenglish: >-
      No letter has arrived since last spring, and another spring has begun. A ship could have been
      lost, a mailbag could have fallen into the sea, or the term could have run late. The family has
      repeated these explanations every month for fourteen months. A letter asking the Colleges for
      news costs two marks and takes four months to get a reply, if one comes at all. Sending a man
      to ask in person costs eleven crowns. He would spend four months travelling there and four
      returning, and the family could not contact him once he left. They are two ways of asking the
      same question at different costs. {HEAD} has weighed the choices every morning since autumn.
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters_stop].absentBody"
    of: 829962a194bb1a3d
    plainenglish: >-
      There has been no letter since last spring. Another spring has arrived. The family has spent
      fourteen months repeating the same explanations: a ship may have been delayed, a bag lost at
      sea, or a school term extended. A letter to the Colleges costs two marks and may take four
      months to get an answer, if anyone answers. Sending a man costs eleven crowns and eight months
      of travel, and the family cannot contact him once he leaves.
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters_stop].interaction.choices[id=send_a_man].label"
    of: a308680667dc91aa
    plainenglish: >-
      Send someone to find out. It costs eleven crowns and eight months.
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters_stop].interaction.choices[id=send_a_man].outcomes[id=sent].text"
    of: a88a7f510ad9112d
    plainenglish: >-
      A capable man travels to Corran. He finds a register where the boy's name has been crossed out,
      a proctor who apologises but cannot help, and a room that was emptied eleven months earlier.
      Nobody is hiding information from him. The boy used to be at the Colleges and is no longer
      there. The foreign institution says it does not know where he went, and that is all it can tell
      him.
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters_stop].interaction.choices[id=write_again].label"
    of: 5ceb96848385b7b8
    plainenglish: >-
      Write again, even twice more. Eleven crowns would buy a horse.
  - address: "content:events/arc_corran.yaml#events[id=corran_the_letters_stop].interaction.choices[id=write_again].outcomes[id=wrote].text"
    of: 98cb62703729687c
    plainenglish: >-
      The family sends three letters over two years. A clerk answers the third and encloses a copy of
      the crossed-out register entry. The clerk says the Colleges cannot help further. The copy is a
      courtesy, but it is also the only document the family will ever have about the boy's
      disappearance. It is four lines long and cost six marks to obtain.
  - address: "content:events/arc_corran.yaml#events[id=corran_what_came_back].title"
    of: 8aefdac647fd402a
    plainenglish: >-
      The Man Who Came Back
  - address: "content:events/arc_corran.yaml#events[id=corran_what_came_back].body"
    of: 3f9e8ca1722b749d
    plainenglish: >-
      In autumn, a man rides up from Bramme on a hired horse and gives the gate a name nobody has
      heard spoken in nine years. He is the right age. He knows the west passage, the bad step on the
      cellar stairs and the family's name for the second cup. He also knows three things about the
      house that appeared in no letter or book. He has a proper Terra warrant, issued after an
      examination and wrapped in oilcloth. No one from this family has ever held such a warrant, and
      the Church has strong views about it. Nobody in the yard has called him a son yet. They have
      all been standing there for a long time.
  - address: "content:events/arc_corran.yaml#events[id=corran_what_came_back].absentBody"
    of: fe6c4fcccf0c4a10
    plainenglish: >-
      A man arrives from Bramme on a hired horse and gives the gate a name nobody has heard spoken in
      nine years. He is the right age. He knows the west passage, the bad cellar step and what the
      family calls the second cup. He carries a Terra warrant wrapped in oilcloth, though no one in
      this family has ever held one before. Nobody in the yard has called him a son.
  - address: "content:events/arc_corran.yaml#events[id=corran_what_came_back].interaction.choices[id=he_is_ours].label"
    of: 6499f693189b782f
    plainenglish: >-
      Accept him as family. Open the gate and ask no questions for a week.
  - address: "content:events/arc_corran.yaml#events[id=corran_what_came_back].interaction.choices[id=he_is_ours].outcomes[id=taken_back].text"
    of: fee982c353949c27
    plainenglish: >-
      He eats with the household that night and works in the long room within a month. He is skilled
      and earns money for his work. For eleven years, the house has the only warranted practitioner
      in the Nethering living under its roof. He never discusses the missing years. Two members of
      the household remain privately convinced that he is not the boy who left. Both die without
      telling the other what they suspect.
  - address: "content:events/arc_corran.yaml#events[id=corran_what_came_back].interaction.choices[id=pay_him_off].label"
    of: 9516467e853c6ec2
    plainenglish: >-
      Pay him and send him away. Knowing a name does not prove who he is.
  - address: "content:events/arc_corran.yaml#events[id=corran_what_came_back].interaction.choices[id=pay_him_off].outcomes[id=paid].text"
    of: 0daeea0586fc8481
    plainenglish: >-
      The family pays him four crowns and gives him a night in the gatehouse. He accepts without
      arguing, which unsettles everyone. Before dawn he takes the road to Bramme. The house is no
      less safe than it was, but the family feels colder towards one another. There is nobody they
      can clearly blame.
  - address: "content:events/arc_corran.yaml#events[id=corran_what_came_back].record.subject"
    of: e711debf9504ddf3
    plainenglish: >-
      the man who arrived from Bramme
  - address: "content:events/arc_corran.yaml#events[id=corran_what_came_back].record.options.record.chronicle"
    of: 859ecc7adf03d24e
    plainenglish: >-
      Nine years after the boy left for Corran, a man came from Bramme. He knew three things about
      the house that no letter had mentioned. He had passed a Terra examination and carried a
      warrant. The family's decision about him is recorded below. Nobody established who he really
      was.
  - address: "content:events/arc_corran.yaml#events[id=corran_what_came_back].record.options.embellish.chronicle"
    of: 048c353db764f6f1
    plainenglish: >-
      After nine years of study at the Colleges, the family's son returned with his warrant and
      examination completed. His family welcomed him home at their own gate.
