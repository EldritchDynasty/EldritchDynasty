# THE LAND, AND WICK.
#
# COMMON tier, deliberately and without exception. The manual's scheduling
# note is the whole design of this file: uncommon's cooldown is global to its
# tier, so twelve new uncommon templates would have divided a ration of about
# eighty-three firings that fifty-five templates were already sharing. Ordinary
# weather belongs where there is no cooldown at all.
#
# Everything here happens on the house's own 1,400 acres or within the half
# mile downhill to Wick, and every one of them is a thing the family cannot
# delegate: the low justice is theirs, the bounty is theirs, the common is the
# reason the village tolerates them at all.
#
# The beasts obey §24 — they frighten, kill, refuse or leave, and not one of
# them knows anything. Where a scene looks like it has a sixth option in it,
# the sixth option is the house.
events:
  - id: the_grey_in_the_upper_fold
    title: The Grey in the Upper Fold
    tier: head
    frequency: common
    weight: 70
    tags: [wolves, winter, tenants, bounty]
    purposes: [change_standing, plant_rumour, test_magic_rule]
    slots:
      HEAD: { role: head }
      KIN:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 16 } }, { relation: not, of: HEAD }]
    body: >-
      Nobody says the word in Deepwinter, so the reeve says the grey, and he
      says it four times in the yard before anybody asks him to come inside.
      Eleven ewes in the upper fold and a boy's dog. The bounty is a mark a
      head and the house has paid it out of the same box since 1063, and the
      question in the yard is not the money. It is whether {HEAD} goes up
      there, because a house that pays and does not go is a house the fold
      talks about all spring.
    interaction:
      kind: choice
      choices:
        - id: pay_the_bounty
          label: Pay the bounty and let the fold sort it out.
          outcomes:
            - id: paid
              weight: 100
              text: >-
                Four heads on the gate post by Thaw and four marks out of the
                box, which is the correct price and the correct answer. What it
                does not cover is eleven ewes off eleven tenancies, and the
                rents those tenancies will not be paying at Thaw, and the house
                carries that whether it went up the hill or not.
              effects:
                - { kind: treasury, delta: -24 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: go_up
          label: Go up with them.
          outcomes:
            - id: the_hounds_stop
              weight: 45
              tags: [signs]
              text: >-
                The hounds work the whole line of the fold and then, forty
                yards short of the beck, they will not go on. They are not
                frightened of anything ahead of them. Two of the graziers watch
                them turn, and then watch which of the party they turn toward,
                and afterwards one of the two is careful never to mention it.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_the_dogs_in_the_fold, accuracy: 0.2 }
            - id: a_clean_week
              weight: 55
              text: >-
                Six days on the tops in weather that takes the skin off a face,
                and three of the grey brought down on the last of them. The
                fold does not thank anybody. It simply stops mentioning the
                house for a year, which from the fold is thanks.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: attribute, target: { slot: KIN }, attr: health, delta: -3 }
                - { kind: treasury, delta: -19 }
                - { kind: rumour, op: seed, id: rumour_the_house_went_up_the_hill, accuracy: 0.6 }
              site:
                kind: party
                slots:
                  - HEAD
                  - KIN
              primordial:
                id: a_clean_week_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} stands above the fold in the wet. The broken hurdle rises and holds
                  without a post while the surviving beasts are brought down. The dead stock and spent
                  days are still lost.
                effects:
                  - {kind: respect, delta: 1}
                  - {kind: attribute, target: {slot: KIN}, attr: health, delta: -3}
                  - {kind: treasury, delta: -9}
                  - {kind: rumour, op: seed, id: rumour_the_house_went_up_the_hill, accuracy: 0.6}
                tags:
                  - primordial
                record: null

  - id: a_murrain_year
    title: A Murrain Year
    tier: family
    frequency: common
    weight: 75
    tags: [cattle, hardship, tenants, signs]
    purposes: [buy_patience, change_standing, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      It starts at the two farms nearest the river and it is through eleven
      byres before Slaughter. Nobody is at fault for a murrain, which is the
      hardest thing about it: there is no eviction to make and no man to fine
      and nothing to do but count. Forty-one head in the parish. The byre under
      the hall wall does not take it, and the cowman there has begun answering
      questions about that in a way that suggests he has been asked more than
      once.
    interaction:
      kind: choice
      choices:
        - id: remit_the_rents
          label: Remit the rents on the farms that lost stock.
          outcomes:
            - id: remitted
              weight: 100
              text: >-
                Two crowns a head is what a cow costs and nobody at Wick has
                two crowns. The house takes the year on its own books and the
                village understands exactly what has been done for it, which is
                not the same as being grateful.
              effects:
                - { kind: treasury, delta: -52 }
                - { kind: respect, delta: 1 }
              agreedPrices:
                - effect: 0
                  reason: gift
        - id: hold_the_terms
          label: Hold the terms. A murrain is not the house's weather.
          outcomes:
            - id: held
              weight: 100
              tags: [hard]
              text: >-
                They pay in labour, in wool, and in one case in a daughter's
                service, and the accounts come out level. The cowman under the
                hall wall keeps his stock and his silence and neither is
                forgotten.
              # #341: the text says the accounts come out level, so holding the
              # terms costs no coin, and the other houses never hear of it. The
              # price is what Wick keeps: the daughter's service, and the byre.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -8 }
                - { kind: rumour, op: seed, id: rumour_the_clean_byre, accuracy: 0.3 }

  - id: the_boar_in_the_west_wood
    title: Boar in the West Wood
    tier: family
    frequency: common
    weight: 70
    tags: [hunt, beast, iron, kin]
    purposes: [change_relationship, change_standing, test_magic_rule]
    slots:
      HEAD: { role: head }
      HUNTER:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 15 } }, { relation: not, of: HEAD }]
    body: >-
      The Warden's deer are the Warden's and the boar in the house's own wood
      is the house's, which is the only good news in the sentence. It has been
      in the pannage for a tenday and it has already gone through a collier's
      leg to the bone. {HUNTER} wants to go, and {HEAD} has to weigh a thing
      that kills well-armed men on horses against a thing the whole province
      counts as Respect.
    interaction:
      kind: choice
      choices:
        - id: let_him_go
          label: Let them go, with the yard man and the two big hounds.
          outcomes:
            - id: taken
              weight: 62
              text: >-
                Four hours in the wet and it comes out of the holly at eleven
                paces. The spear holds. Wick eats better that tenday than it
                has since Slaughter, and the tusks go up over the long room
                door where everybody has to walk under them.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: respect, delta: 2 }
                - { kind: attribute, target: { slot: HUNTER }, attr: strength, delta: 3 }
              site:
                kind: party
                slots:
                  - HUNTER
              primordial:
                id: taken_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} is at the closing when the knife fails. The boar's weight stops
                  against an empty space beside the hunter, long enough for the spear to be reset. The
                  broken gear still needs replacing.
                effects:
                  - {kind: treasury, delta: -4}
                  - {kind: respect, delta: 2}
                  - {kind: attribute, target: {slot: HUNTER}, attr: strength, delta: 3}
                tags:
                  - primordial
                record: null
            - id: the_blade_that_would_not
              weight: 38
              tags: [signs, iron]
              text: >-
                It goes wrong at the closing and it is the knife that goes
                wrong: the edge is gone off it, all along, the way an edge goes
                after a winter in a damp wall and not after a morning in a
                hand. The yard man finishes the boar with a spear and does not
                look at anybody. He hands the knife back at the gate, holding
                it by the blade, and says the smith should see to it.
              effects:
                - { kind: treasury, delta: -16 }
                - { kind: attribute, target: { slot: HUNTER }, attr: health, delta: -8 }
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_the_dull_iron, accuracy: 0.2 }
              site:
                kind: party
                slots:
                  - HUNTER
              primordial:
                id: the_blade_that_would_not_primordial
                text: >-
                  {PRIMORDIAL_ACTOR} is at the closing when the knife fails. The boar's weight stops
                  against an empty space beside the hunter, long enough for the spear to be reset. The
                  broken gear still needs replacing.
                effects:
                  - {kind: treasury, delta: -8}
                  - {kind: attribute, target: {slot: HUNTER}, attr: health, delta: -8}
                  - {kind: respect, delta: 1}
                  - {kind: rumour, op: seed, id: rumour_the_dull_iron, accuracy: 0.2}
                tags:
                  - signs
                  - iron
                  - primordial
                record: null
        - id: pay_the_colliers
          label: Pay the colliers to take it and keep the family out of the wood.
          outcomes:
            - id: bought
              weight: 100
              text: >-
                They do it in a day and a half for eleven marks and a barrel,
                and they are not remotely grateful, and the tusks go up over
                the door of the alehouse instead. {HUNTER} does not raise it
                again. That is worse than if it had been raised.
              effects:
                - { kind: treasury, delta: -11 }
                - { kind: relationship, from: { slot: HUNTER }, to: head, sentiment: -12 }
              agreedPrices:
                - effect: 0
                  reason: contract

  - id: the_ford_below_wick
    title: The Crossing Below Wick
    tier: family
    frequency: common
    weight: 80
    tags: [wend, children, folklore, water]
    purposes: [buy_patience, plant_rumour, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      In Thaw the Wend comes up brown and quiet and takes the ford out from
      under a person without ever appearing to hurry. Wick loses a child there
      about every eleven years and has for as long as the roll goes back. The
      village says it is the grey mare, and it is not, and the story has kept
      more children off that crossing than the truth ever managed. A tenant's
      wife stops {HEAD} in the yard to ask whether the house will build the
      plank bridge her grandmother asked about.
    interaction:
      kind: choice
      choices:
        - id: build_it
          label: Build the bridge. Oak, and high.
          outcomes:
            - id: built
              weight: 100
              text: >-
                Nine crowns and a summer, and the crossing stops killing
                anybody. Within two generations there are children at Wick who
                have never heard of the mare, and one of them drowns in the mill
                pool instead, which is not the bridge's fault and is held
                against it anyway.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: respect, delta: 1 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: leave_the_story
          label: Leave it. The story is doing the work of a bridge.
          outcomes:
            - id: left
              weight: 100
              text: >-
                It is a defensible position and it costs nothing and the house
                has taken it four times now. The mare gets a new detail each
                time she is told, and by the fourth telling she has an interest
                in one particular family, and it is not a family from Wick.
              effects:
                - { kind: rumour, op: seed, id: rumour_the_mare_of_the_ford, accuracy: 0.1 }

  - id: the_tenant_who_wants_it_written
    title: The Tenant Who Wants It Written
    tier: head
    frequency: common
    weight: 65
    tags: [tenants, law, paper, custom]
    purposes: [advance_clause, buy_patience, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      He holds forty acres on customary terms, as his line has since before the
      roof, and there is not one sheet of paper anywhere that says so. His son
      has been to Bramme and come back with an idea. The idea is that custom is
      only worth what the man on the other side of it remembers, and that a
      notary's attestation costs one mark. {HEAD} has heard this argument
      before, from the other side of a table, in a room where the house was the
      one without the paper.
    interaction:
      kind: choice
      choices:
        - id: sign_it
          label: Sign it. Let the terms be written and witnessed.
          outcomes:
            - id: written
              weight: 100
              text: >-
                A mark to the notary at Bramme and both copies read out in the
                yard so that nobody can say afterwards that they were not.
                Three more tenants ask within the year. It is a good year for
                the notary and the beginning of a long argument about what
                exactly the house has agreed to for ever.
              effects:
                - { kind: treasury, delta: -4 }
                - { kind: respect, delta: 1 }
                - { kind: flag, flag: the_customary_terms_were_written, set: true }
                - { kind: schedule, event: the_son_brings_the_written_terms, inYears: 1 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: refuse_the_paper
          label: Refuse. Custom is stronger without a document to argue with.
          outcomes:
            - id: refused
              weight: 100
              text: >-
                The word used in the hall is unnecessary, and the word used in
                the alehouse is different. Nothing changes for forty years.
                Then a Warden's clerk asks the house to produce its title to
                eleven farms and the house produces a memory.
              effects:
                - { kind: rumour, op: seed, id: rumour_the_house_without_paper, accuracy: 0.5 }

  - id: the_hedge_across_the_common
    title: The Hedge Across the Common
    tier: head
    frequency: common
    weight: 65
    tags: [land, tenants, money, standing]
    purposes: [advance_clause, change_standing, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      Wick Common is on the house's roll for grazing, and on the villagers' memory for the
      same thing. The steward has planned a fence with one gate, for which the house alone
      would keep a key. He has also drawn up a certificate saying Wick agreed at a parish
      meeting. It needs the Head's seal. The stakes are still loose.
    interaction:
      kind: choice
      choices:
        - id: hedge_it
          label: "Fence our grazing. Seal that Wick has agreed."
          outcomes:
            - id: hedged
              weight: 100
              tags: [hard]
              text: >-
                The gate takes the house's mark, and the steward puts a larger yield
                against the common on his roll. {HEAD} seals a certificate saying Wick
                assented at a parish meeting. No such meeting was held. The village keeps
                its own reckoning.
              effects:
                # #1810: develop the existing grazing; Wick Common is already
                # held at founding. The false assent has an institutional reader.
                - {kind: land, op: restore, parcel: wick_common, magnitude: 2}
                - {kind: discrepancy, op: create, id: the_common_enclosure_assent, severity: major, provableBy: [commons, the_church]}
                - {kind: rumour, op: seed, id: rumour_the_forty_acres, accuracy: 0.7}
                - {kind: chronicle, text: '{HEAD} sealed a certificate falsely claiming that Wick had agreed to the enclosure of its common grazing.'}
        - id: leave_the_common
          label: "Walk the boundary with Wick. Leave this enclosure unbuilt."
          outcomes:
            - id: left_open
              weight: 100
              text: >-
                The Head spends a wet week walking the proposed line with the tenants and
                pulling the loose stakes. The ditch stays uncut. The people who work at
                both hall and village can use the track together, and remember who came out
                to mark it with them. The cough comes home with the Head.
              effects:
                - {kind: attribute, target: head, attr: health, delta: -2}
                - {kind: relationship, from: household, to: head, sentiment: 8}

  - id: the_adder_on_the_high_pasture
    title: A Fortnight of Fever
    tier: individual
    frequency: common
    weight: 70
    tags: [beast, medicine, graziers, signs]
    purposes: [buy_patience, plant_rumour, test_magic_rule]
    slots:
      BITTEN:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 10 } }]
    body: >-
      Highsun on the high pasture, and the adder does what an adder does, which
      is almost never kill anybody and always cost a fortnight. Every grazier
      on the Nethering has a cure. There are at least nine of them, they
      contradict each other flatly, and each man is certain because he has
      watched somebody recover. {BITTEN} is going to recover too, in about a
      fortnight, whichever of the nine gets the credit.
    interaction:
      kind: choice
      choices:
        - id: the_graziers_cure
          label: Let the graziers do it their way.
          outcomes:
            - id: the_ninth_cure
              weight: 100
              text: >-
                Bread poultice, a cut cross the fang marks, and a great deal of
                small beer. Fourteen days. The man who suggested the beer tells
                the story for thirty years and improves his own part in it
                steadily, which is how the tenth cure gets invented.
              effects:
                - { kind: treasury, delta: -1 }
                - { kind: attribute, target: { slot: BITTEN }, attr: health, delta: -2 }
                - { kind: rumour, op: seed, id: rumour_the_tenth_cure, accuracy: 0.15 }
              agreedPrices:
                - effect: 0
                  reason: contract
        - id: send_to_bramme
          label: Send to Bramme for the physician.
          outcomes:
            - id: humoral
              weight: 100
              text: >-
                Two days' wait, three crowns, and a physician who bleeds the
                arm that was not bitten and is entirely right about the leg.
                Fourteen days. He is worth the money and it is nearly
                impossible to say why, and the graziers are still talking about
                the beer.
              effects:
                - { kind: treasury, delta: -3 }
                - { kind: attribute, target: { slot: BITTEN }, attr: health, delta: -1 }
              agreedPrices:
                - effect: 0
                  reason: contract
proseVariants:
  - address: "content:events/village.yaml#events[id=the_grey_in_the_upper_fold].title"
    of: 39fb34ecac6b4538
    plainenglish: >-
      The Wolves in the Upper Fold
  - address: "content:events/village.yaml#events[id=the_grey_in_the_upper_fold].body"
    of: 5cd22c1ddf5e20b1
    plainenglish: >-
      In Deepwinter, nobody says the word wolf aloud. The reeve calls them the grey four times before
      anyone invites him indoors. Wolves have killed eleven ewes in the upper fold and a boy's dog.
      The house has paid a bounty of one mark per wolf since 1063. The tenants want to know whether
      {HEAD} will go up the hill personally. If the house only pays and stays home, the fold will talk
      about it all spring.
  - address: "content:events/village.yaml#events[id=the_grey_in_the_upper_fold].interaction.choices[id=pay_the_bounty].label"
    of: 155663f227c9b906
    plainenglish: >-
      Pay the bounty and let the tenants handle the wolves.
  - address: "content:events/village.yaml#events[id=the_grey_in_the_upper_fold].interaction.choices[id=pay_the_bounty].outcomes[id=paid].text"
    of: 9fb46eff9b91add3
    plainenglish: >-
      By Thaw, four wolf heads hang on the gate post and the house has paid four marks, the set
      bounty. That does not replace the eleven ewes lost from eleven tenancies, or the rent those
      farms cannot pay at Thaw. The house bears that loss whether it joined the hunt or not.
  - address: "content:events/village.yaml#events[id=the_grey_in_the_upper_fold].interaction.choices[id=go_up].label"
    of: 5359d638906bc824
    plainenglish: >-
      Go up to the fold with the hunters.
  - address: "content:events/village.yaml#events[id=the_grey_in_the_upper_fold].interaction.choices[id=go_up].outcomes[id=the_hounds_stop].text"
    of: 2db8d044ad0f4cd0
    plainenglish: >-
      The hounds search the entire fold but stop forty yards from the stream. Nothing ahead appears to
      frighten them. Two graziers see the dogs turn back and notice which member of the party they
      face. Afterwards, one of the graziers avoids mentioning what he saw.
  - address: "content:events/village.yaml#events[id=the_grey_in_the_upper_fold].interaction.choices[id=go_up].outcomes[id=a_clean_week].text"
    of: 7dc6f56956f5ce55
    plainenglish: >-
      The party spends six days on the exposed hills in bitter weather. On the final day they kill
      three wolves. The fold gives no thanks, but it stops speaking about the house for a year. For
      these tenants, that silence is thanks.
  - address: "content:events/village.yaml#events[id=a_murrain_year].title"
    of: 71790a2ff8d3ecd3
    plainenglish: >-
      A Year of Sick Cattle
  - address: "content:events/village.yaml#events[id=a_murrain_year].body"
    of: 747bf47c3904d9c0
    plainenglish: >-
      The cattle disease begins on the two farms nearest the river and spreads through eleven cattle
      sheds before Slaughter. No tenant caused it, so there is nobody to evict or fine. The parish
      loses forty-one cattle. The shed below the hall wall is untouched. Its cowman has started giving
      careful answers about why his herd is healthy, as if many people have asked him.
  - address: "content:events/village.yaml#events[id=a_murrain_year].interaction.choices[id=remit_the_rents].label"
    of: 782d40534013894f
    plainenglish: >-
      Cancel the rent for farms that lost cattle.
  - address: "content:events/village.yaml#events[id=a_murrain_year].interaction.choices[id=remit_the_rents].outcomes[id=remitted].text"
    of: 41687358c4492c14
    plainenglish: >-
      A cow costs two crowns, more than anyone in Wick can afford. The house absorbs the lost rent for
      the year. The villagers understand the help they have received, but that does not mean they feel
      grateful.
  - address: "content:events/village.yaml#events[id=a_murrain_year].interaction.choices[id=hold_the_terms].label"
    of: 832560316d0324bd
    plainenglish: >-
      Keep the rent terms unchanged. The house did not cause the disease.
  - address: "content:events/village.yaml#events[id=a_murrain_year].interaction.choices[id=hold_the_terms].outcomes[id=held].text"
    of: 892948d80c1d2bec
    plainenglish: >-
      The tenants pay what they owe with labour, wool, and, in one case, a daughter's service. The
      accounts balance. The cowman below the hall wall keeps both his healthy cattle and his silence,
      and the village remembers.
  - address: "content:events/village.yaml#events[id=the_boar_in_the_west_wood].title"
    of: e725b58330aebd27
    plainenglish: >-
      A Wild Boar in the West Wood
  - address: "content:events/village.yaml#events[id=the_boar_in_the_west_wood].body"
    of: 54bd401fb0fbdbe3
    plainenglish: >-
      The Warden owns the deer, but the wild boar in the family's west wood belongs to the house. It
      has spent ten days in the pigs' feeding grounds and has torn a collier's leg to the bone.
      {HUNTER} wants to hunt it. {HEAD} must weigh the risk of a boar that can kill an armed rider
      against the Respect a successful hunt would earn.
  - address: "content:events/village.yaml#events[id=the_boar_in_the_west_wood].interaction.choices[id=let_him_go].label"
    of: add1d636e3b3aea2
    plainenglish: >-
      Let the hunter go with the yard man and two large hounds.
  - address: "content:events/village.yaml#events[id=the_boar_in_the_west_wood].interaction.choices[id=let_him_go].outcomes[id=taken].text"
    of: f92662e6a11acdda
    plainenglish: >-
      After four wet hours, the boar charges from the holly at eleven paces. The spear holds. Wick
      eats better for the next ten days than it has since Slaughter. Its tusks are hung above the long
      room door where everyone walks beneath them.
  - address: "content:events/village.yaml#events[id=the_boar_in_the_west_wood].interaction.choices[id=let_him_go].outcomes[id=the_blade_that_would_not].text"
    of: 56f5725b221b81ff
    plainenglish: >-
      The final attempt goes wrong when the knife loses its edge. It is blunt as though it had spent a
      winter in a damp wall, not a morning in someone's hand. The yard man kills the boar with a spear
      without meeting anyone's eyes. At the gate, he returns the knife by holding its blade and says
      the smith should examine it.
  - address: "content:events/village.yaml#events[id=the_boar_in_the_west_wood].interaction.choices[id=pay_the_colliers].label"
    of: f75d62f4aefb4528
    plainenglish: >-
      Pay the colliers to kill the boar and keep the family out of the wood.
  - address: "content:events/village.yaml#events[id=the_boar_in_the_west_wood].interaction.choices[id=pay_the_colliers].outcomes[id=bought].text"
    of: 6914f07b79f31307
    plainenglish: >-
      The colliers kill it in a day and a half for eleven marks and a barrel. They are not grateful.
      The tusks hang above the alehouse door instead of the house's. {HUNTER} never mentions the hunt
      again, and that silence hurts more than a complaint.
  - address: "content:events/village.yaml#events[id=the_ford_below_wick].title"
    of: e2f0953dd4635fe9
    plainenglish: >-
      The Ford Below Wick
  - address: "content:events/village.yaml#events[id=the_ford_below_wick].body"
    of: ba8951ebec62a6af
    plainenglish: >-
      At Thaw, the Wend turns brown and can wash a person off the ford without warning. About once
      every eleven years, a child from Wick drowns there, according to the parish records. The village
      blames a grey mare, though that story is false. Still, the story keeps more children away from
      the crossing than warnings about the river. A tenant's wife asks {HEAD} whether the house will
      finally build the wooden bridge her grandmother asked for.
  - address: "content:events/village.yaml#events[id=the_ford_below_wick].interaction.choices[id=build_it].label"
    of: 221f7f73e0c6309f
    plainenglish: >-
      Build a high oak bridge across the ford.
  - address: "content:events/village.yaml#events[id=the_ford_below_wick].interaction.choices[id=build_it].outcomes[id=built].text"
    of: 1f6771b06f602f5c
    plainenglish: >-
      The bridge costs nine crowns and takes one summer to build. No one drowns at that crossing
      again. Within two generations, some children in Wick have never heard of the grey mare. One
      child drowns in the mill pool instead. The bridge did not cause that death, but people blame it
      anyway.
  - address: "content:events/village.yaml#events[id=the_ford_below_wick].interaction.choices[id=leave_the_story].label"
    of: 849a45a943f5639d
    plainenglish: >-
      Leave the crossing as it is. The story already keeps children away.
  - address: "content:events/village.yaml#events[id=the_ford_below_wick].interaction.choices[id=leave_the_story].outcomes[id=left].text"
    of: 8b103a9db5305641
    plainenglish: >-
      Leaving the ford alone costs nothing and has been the house's decision four times. The grey mare
      story changes with each telling. By the fourth version, the mare is said to target one
      particular family, which is not from Wick.
  - address: "content:events/village.yaml#events[id=the_tenant_who_wants_it_written].title"
    of: 17376573388bb7ef
    plainenglish: >-
      The Tenant Wants a Written Agreement
  - address: "content:events/village.yaml#events[id=the_tenant_who_wants_it_written].body"
    of: 0923c86b6855fc7f
    plainenglish: >-
      A tenant has held forty acres under customary terms since before the hall roof was built, but he
      has no written proof. His son returns from Bramme saying that custom only protects a family
      while the other party remembers it. A notary will attest their agreement for one mark. {HEAD}
      has heard this argument before, when the house was the party without the written proof.
  - address: "content:events/village.yaml#events[id=the_tenant_who_wants_it_written].interaction.choices[id=sign_it].label"
    of: ddf0a915e7bbcfa1
    plainenglish: >-
      Sign and witness a written record of the tenant's terms.
  - address: "content:events/village.yaml#events[id=the_tenant_who_wants_it_written].interaction.choices[id=sign_it].outcomes[id=written].text"
    of: 9db10a8617306bd2
    plainenglish: >-
      The house pays a mark to the notary in Bramme. Both copies are read aloud in the yard so nobody
      can later deny what was written. Three more tenants ask for written terms that year. The notary
      gains business, and the house begins a long argument over what it has permanently promised.
  - address: "content:events/village.yaml#events[id=the_tenant_who_wants_it_written].interaction.choices[id=refuse_the_paper].label"
    of: c3836c5117581345
    plainenglish: >-
      Refuse the written agreement. Leave the customary terms unwritten.
  - address: "content:events/village.yaml#events[id=the_tenant_who_wants_it_written].interaction.choices[id=refuse_the_paper].outcomes[id=refused].text"
    of: 38d321cfc9e0a5ab
    plainenglish: >-
      In the hall they call the document unnecessary. The villagers use another word. Nothing changes
      for forty years, until a Warden's clerk demands written proof of the house's title to eleven
      farms. All the house can offer is its memory.
  - address: "content:events/village.yaml#events[id=the_hedge_across_the_common].title"
    of: 2c0da68ae2b30ca6
    plainenglish: >-
      A Hedge Across the Village Common
  - address: "content:events/village.yaml#events[id=the_hedge_across_the_common].body"
    of: "3152bc52312c7dfe"
    plainenglish: >-
      The house and the villagers both have grazing rights on Wick Common. The steward
      proposes fencing it for the house's exclusive use. He has prepared a certificate
      falsely saying that Wick agreed at a parish meeting. The Head must decide whether to
      seal it. The fence has not been built.
  - address: "content:events/village.yaml#events[id=the_hedge_across_the_common].interaction.choices[id=hedge_it].label"
    of: "629ba7b6aedc40c2"
    plainenglish: "Fence the common for the house and sign the false certificate of consent."
  - address: "content:events/village.yaml#events[id=the_hedge_across_the_common].interaction.choices[id=hedge_it].outcomes[id=hedged].text"
    of: "45dda375cc9bf039"
    plainenglish: >-
      Fencing increases the yield from the house's existing common holding. {HEAD} signs a
      certificate saying Wick agreed at a parish meeting that never took place. The village
      has records that can disprove it.
  - address: "content:events/village.yaml#events[id=the_hedge_across_the_common].interaction.choices[id=leave_the_common].label"
    of: "90c99973116d562f"
    plainenglish: "Spend a week marking the boundary with Wick and leave this enclosure unbuilt."
  - address: "content:events/village.yaml#events[id=the_hedge_across_the_common].interaction.choices[id=leave_the_common].outcomes[id=left_open].text"
    of: "72adf4797856f9f5"
    plainenglish: >-
      The Head spends a wet week walking the proposed boundary with the tenants and removing
      the loose stakes. The track stays open. The household appreciates the work, but the
      Head loses Health to the cold and rain.
  - address: "content:events/village.yaml#events[id=the_adder_on_the_high_pasture].title"
    of: 3ce13db4b7b4c138
    plainenglish: >-
      Two Weeks of Fever
  - address: "content:events/village.yaml#events[id=the_adder_on_the_high_pasture].body"
    of: 4d16449035ffc7d4
    plainenglish: >-
      In Highsun on the high pasture, an adder bites a family member. Adder bites rarely kill, but
      recovery takes about a fortnight. Every grazier in the Nethering recommends a different cure.
      There are at least nine cures, and they contradict one another. Each grazier believes his own
      works because he has seen someone recover. {BITTEN} will probably recover in about two weeks,
      whichever cure is used.
  - address: "content:events/village.yaml#events[id=the_adder_on_the_high_pasture].interaction.choices[id=the_graziers_cure].label"
    of: 6c3d81fdc99245e9
    plainenglish: >-
      Let the graziers use their traditional remedy.
  - address: "content:events/village.yaml#events[id=the_adder_on_the_high_pasture].interaction.choices[id=the_graziers_cure].outcomes[id=the_ninth_cure].text"
    of: fc1f57c8b9a4cc24
    plainenglish: >-
      They apply bread, cut a cross over the fang marks, and give plenty of small beer. Recovery takes
      fourteen days. The grazier who suggested the beer tells the story for thirty years, adding to
      his own role each time. That is how a tenth cure is invented.
  - address: "content:events/village.yaml#events[id=the_adder_on_the_high_pasture].interaction.choices[id=send_to_bramme].label"
    of: 2534892e02bb0f1a
    plainenglish: >-
      Send for a physician from Bramme.
  - address: "content:events/village.yaml#events[id=the_adder_on_the_high_pasture].interaction.choices[id=send_to_bramme].outcomes[id=humoral].text"
    of: e75569222441471e
    plainenglish: >-
      The physician arrives after two days and charges three crowns. He bleeds the unbitten arm, but
      correctly treats the leg. Recovery still takes fourteen days. His treatment seems worth the
      price, though nobody can explain why. The graziers continue talking about the beer.

  - address: "content:events/village.yaml#events[id=the_hedge_across_the_common].interaction.choices[id=hedge_it].outcomes[id=hedged].effects[3].text"
    of: "dffa061bd00ebe97"
    plainenglish: "{HEAD} falsely certified that Wick had agreed to the enclosure of its common grazing."
  - address: >-
      content:events/village.yaml#events[id=the_grey_in_the_upper_fold].interaction.choices[id=go_up].outcomes[id=a_clean_week].primordial.text
    of: 9a3f6cd3f6f7e357
    plainenglish: "{PRIMORDIAL_ACTOR} is in the wet ground above the sheep fold. The broken hurdle rises and holds without a post while the surviving beasts are brought down. The dead stock and spent days are still lost."
  - address: >-
      content:events/village.yaml#events[id=the_boar_in_the_west_wood].interaction.choices[id=let_him_go].outcomes[id=taken].primordial.text
    of: 21bd7447ce13529b
    plainenglish: "When the knife breaks, {PRIMORDIAL_ACTOR} is close to the boar. The boar's weight stops against an empty space beside the hunter, long enough for the spear to be reset. The broken gear still needs replacing."
  - address: >-
      content:events/village.yaml#events[id=the_boar_in_the_west_wood].interaction.choices[id=let_him_go].outcomes[id=the_blade_that_would_not].primordial.text
    of: 21bd7447ce13529b
    plainenglish: "When the knife breaks, {PRIMORDIAL_ACTOR} is close to the boar. The boar's weight stops against an empty space beside the hunter, long enough for the spear to be reset. The broken gear still needs replacing."
