events:
  - id: demo_the_empty_chair
    title: The Chair by the Window
    tier: family
    frequency: common
    campaigns:
      - demo
    repeatable: false
    purposes:
      - worldbuild_through_action
      - change_relationship
      - test_magic_rule
    slots:
      FOUNDER:
        role: family_member
        bind: arc
        onMissing: cancel_arc
    body: The first account ends with {FOUNDER}'s name. The family puts a cup beside the chair by the
      window and leaves it there while the room grows cold. What began with a signature has reached
      the line where a life is supposed to stop. The chair is empty.
    interaction:
      kind: narration
      outcomes:
        - id: the_hand_remains
          weight: 100
          text: They enter the founder's death and put the pen down. When the book is opened again, a word has
            been crossed out in the hand that signed the first page. The family still has decisions
            to make.
          effects:
            - kind: status
              target:
                slot: FOUNDER
              status: dead
              cause: the closing of the first account
          site:
            kind: hall
            hall: main
          primordial:
            id: the_hand_remains_primordial
            text: >-
              {PRIMORDIAL_ACTOR} stands beside the chair while the last candle gutters. Breath returns
              before the keeper can close the book. The page waits.
            effects: []
            tags:
              - primordial
            record: null
    arc:
      of: arc_the_first_account
      node: the_empty_chair
  - id: demo_the_last_page
    title: What the Next Page Says
    tier: record
    frequency: uncommon
    campaigns:
      - demo
    repeatable: false
    purposes:
      - force_record_choice
      - change_standing
      - worldbuild_through_action
    slots:
      HEAD:
        role: head
    body: The clerk has reached the founder's last page. There is room below the date for an account of
      what happened after the chair was emptied. {HEAD} has heard the pen moving in a room nobody
      entered. The clerk asks what the next page should say.
    interaction:
      kind: narration
      outcomes:
        - id: the_page_is_offered
          weight: 100
          text: The old signature can still be read through the thin paper. The clerk waits with the pen clear
            of the page. Nothing is written yet.
    record:
      subject: the founder's death, and what continued
      options:
        record:
          chronicle: We entered the founder's death. His hand went on correcting the account, and the house
            went on asking what it should do.
          effects:
            - kind: respect
              delta: -1
        omit:
          chronicle: null
        embellish:
          chronicle: The founder gave up the seal in health and withdrew to a quiet room. The family made its
            decisions without him.
          effects:
            - kind: respect
              delta: 1
          discrepancy:
            id: demo_the_quiet_retirement
            severity: major
            provableBy:
              - the_church
              - house_marrow
    arc:
      of: arc_the_first_account
      node: the_last_page
  - id: demo_the_margin_keeps_its_colour
    title: The Colour in the Margin
    tier: frame
    frequency: rare
    campaigns:
      - demo
    repeatable: false
    purposes:
      - worldbuild_through_action
      - change_relationship
      - test_magic_rule
    slots:
      BLOOD:
        role: listener_blood
      RECORD:
        role: listener_record
    reads:
      - chronicled: demo_the_last_page
    body: The last light rests upon a painted blossom at the edge of the book, and the room beyond it
      has the patient cold of a house that has kept one place at its table longer than any living
      guest could remember.
    interaction:
      kind: narration
      outcomes:
        - id: the_page_is_not_turned
          weight: 100
          text: Beneath one hand {BLOOD} keeps the page left for the years after its founder, and beyond that
            page {RECORD} waits with a patience the old ink has not preserved. The blossom painted
            in the margin has outlived the tree, though a little of its colour comes away whenever
            the page is touched. No one turns it.
    arc:
      of: arc_the_first_account
      node: the_margin_keeps_its_colour
