# Nodes of arc_everybody_has_a_theory.
#
# THE HARD ONE. The escalation's Incomprehension stage (manual §13) needs a
# reading the family held for centuries and was RIGHT to hold, or there is
# nothing to break — a theory the player always suspected is not a revelation
# when it fails, it is a joke landing late. So beat one gives the house a
# theory that genuinely predicts, beat two lets three generations be correct
# with it, and beat three removes the prediction without replacing it.
#
# Nothing here explains the rod. The correction is not a better theory; it is
# the discovery that the thing they were measuring was never the thing they
# thought they were measuring, and no third reading is offered.
events:
  - id: rod_a_theory_that_works
    title: A Yard of Black Wood, and a Notebook
    tier: family
    frequency: uncommon
    weight: 100
    tags: [regalia, rod, arc, study]
    purposes: [establish_magic_rule, test_magic_rule, buy_patience]
    arc: { of: arc_everybody_has_a_theory, node: the_theory }
    slots:
      THEORIST:
        role: family_member
        bind: arc
        onMissing: { inherit: eldest_child }
        filters: [{ status: [alive] }, { age: { op: gte, value: 20 } }]
    body: >-
      The rod has been in the house for as long as the house has been the
      house, and what is known about it is that it is a yard of black wood with
      no marks on it and that holding it makes you warm. Every generation has
      had a theory and every theory has been somebody's opinion at a table.
      {THEORIST} does the other thing. Eleven years, a ruled notebook, the hour
      written down each time and the weather with it, and one column nobody has
      thought to keep before: who was in the room. By the ninth year there is a
      pattern in that column, and it is not subtle, and it holds every single
      time it is tested.
    absentBody: >-
      Eleven years of a ruled notebook, the hour written down each time and the
      weather with it, and one column nobody had thought to keep before: who
      was in the room. The hand that kept it is in the ground now. The pattern
      in that column is not subtle and has held every time anybody has tested
      it since, which is eleven times, over sixty years, by four people who did
      not much like each other.
    interaction:
      kind: narration
      outcomes:
        - id: written
          weight: 100
          text: >-
            It works with two of the blood in the room and it does nothing with
            one. That is the finding, it is written down plainly, and for the
            first time in four hundred years this family owns a sentence about
            the rod that can be checked by somebody who does not trust them.
          effects:
            - { kind: attribute, target: { slot: THEORIST }, attr: mind, delta: 5 }

  - id: rod_three_generations_of_being_right
    title: Three Generations of Being Right
    tier: family
    frequency: uncommon
    weight: 100
    tags: [regalia, rod, arc, study]
    purposes: [establish_magic_rule, force_record_choice, plant_rumour]
    arc: { of: arc_everybody_has_a_theory, node: the_theory_holds }
    slots:
      HEAD: { role: head }
      THEORIST:
        role: family_member
        bind: arc
        onMissing: continue_absent
        filters: [{ status: [alive] }]
    body: >-
      Two of the blood in the room. It has been the rule for ninety years now
      and it has never once failed, and the household arranges itself around it
      the way a household arranges itself around a step that is higher than the
      others. Children are taught it before they are taught the grates. {HEAD}
      has used it to settle an argument about a marriage, twice, on the
      grounds that a woman who cannot make the rod work is not carrying what
      she says she is carrying — and both times the rule agreed with what the
      marriage market had already worked out for itself, which everybody took
      as confirmation and nobody took as a warning.
    absentBody: >-
      Two of the blood in the room. Ninety years, never once a failure, and the
      household arranged around it the way a household arranges itself around a
      step higher than the others. Children are taught it before they are
      taught the grates. It has settled two arguments about marriages, and both
      times it agreed with what the market had already decided, and everybody
      took that as confirmation.
    interaction:
      kind: choice
      choices:
        - id: write_it_as_law
          label: Enter it in the book as settled. Four hundred years of guessing is enough.
          outcomes:
            - id: entered
              weight: 100
              text: >-
                It goes in as a finding rather than an opinion, in the
                chronicler's hand, with the eleven years of notebook cited
                underneath it. The house has never been able to say anything
                true about the rod before. It says one now, and the saying of
                it is the proudest afternoon in about two centuries.
              effects:
                - { kind: respect, delta: 1 }
        - id: keep_it_a_habit
          label: Leave it out of the book. A house that writes a thing down has to defend it.
          outcomes:
            - id: habit
              weight: 100
              text: >-
                It stays a household habit and never becomes a claim, which
                costs the family nothing it can measure and one thing it
                cannot: the two generations after this never quite know
                whether they are keeping a finding or keeping a superstition,
                and they do it exactly as carefully either way.
              tags: [self_expression]
              effects: []
    record:
      subject: the rule of two in the room
      options:
        record:
          chronicle: >-
            The rod answers with two of the blood in the room and does nothing
            with one. Eleven years of notebook, ninety years of practice, and
            not one exception in either. This is the first checkable sentence
            this family has ever written about the third of the three.
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            The rod answers to the blood, and answers to it alone, and has done
            so on every occasion any of this line has had cause to ask it
            anything at all.
          effects:
            - { kind: respect, delta: 1 }
          discrepancy:
            id: the_rule_of_two
            severity: minor
            provableBy: [house_ilm, commons]

  - id: rod_the_correlation_was_something_else
    title: What They Had Been Counting
    tier: head
    frequency: rare
    weight: 100
    tags: [regalia, rod, arc, knowledge]
    purposes: [advance_clause, establish_magic_rule, test_magic_rule]
    arc: { of: arc_everybody_has_a_theory, node: the_theory_breaks }
    slots:
      HEAD: { role: head }
    body: >-
      A cold spring, the hall half empty with the fever in the village, and the
      rod is brought out with two of the blood in the room exactly as it has
      been brought out for two hundred years. Nothing. They do it again on the
      Tuesday with four in the room and get nothing, and on the Thursday with
      one, alone, at four in the morning, and it answers the way it always did.
      It takes the archivist nine days and the original notebook to find what
      the eleven years were really counting, and it is this: in every one of
      those trials, and in every trial since, the room had a fire in it. Two
      hundred years of arranging a family around a step that was never there.
      The fire is not an answer either.
    interaction:
      kind: choice
      choices:
        - id: write_the_correction
          label: Write the correction in, under the finding, in the same hand.
          outcomes:
            - id: corrected
              weight: 100
              text: >-
                The correction runs to a page and a half and the last line of
                it says that the house does not know what the rod is for and
                has never known. Three people cry at that supper and none of
                them is able to say afterwards which line did it. What the
                family has actually lost is not a theory. It is two hundred
                years of having been the only people on earth who knew a true
                thing about it.
              effects:
                - { kind: clause, reveal: clause_of_the_made_thing }
                - { kind: respect, delta: -1 }
        - id: let_it_stand
          label: Let the finding stand. Nobody outside this house can test it.
          outcomes:
            - id: stood
              weight: 100
              text: >-
                It stays in the book as a finding, cited, with eleven years of
                notebook underneath it, and every generation after this is
                taught a thing about their own blood that is not true and
                cannot be got at. Two of them build marriages on it. One builds
                a refusal on it, which is worse and cheaper and takes four
                minutes.
              effects:
                - { kind: clause, reveal: clause_of_the_made_thing }
                - { kind: discrepancy, op: create, id: the_rule_of_two, severity: major, provableBy: [house_ilm, the_church, commons] }
                - { kind: respect, delta: 1 }
    record:
      subject: what the eleven years were counting
      options:
        record:
          chronicle: >-
            The rule of two in the room was a fire in the room, for two hundred
            years, and nobody checked because it kept being right. The house
            does not know what the third of the three is for. It has never
            known and it should stop writing as though it has.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: head, text: 'learned that the rod''s rule of two had been tracking fire, not the blood' }
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            A cold spring troubled the rod's answering, as cold springs will,
            and the rule of two was found on examination to hold exactly as it
            has always held.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: attr, target: head, attr: eldritch_power, value: 0 }
          discrepancy:
            id: the_rule_of_two
            severity: total
            provableBy: [house_ilm, the_church, house_marrow]
    rumour: { id: rumour_what_the_rod_is_for, accuracy: 0.25, spread: 1 }
    accounts: [ilm_note_on_the_nethering_rod, the_household_rule_as_taught]

proseVariants:
  - address: "content:events/arc_rod.yaml#events[id=rod_a_theory_that_works].title"
    of: "8af1444cf41c08e8"
    plainenglish: >-
      A One-Yard Black Rod and a Notebook
  - address: "content:events/arc_rod.yaml#events[id=rod_a_theory_that_works].body"
    of: "31cb41a0e7c52a5c"
    plainenglish: >-
      The house has owned the rod for as long as it has existed. It is one yard of unmarked black
      wood, and holding it makes people warm. Every generation has offered a theory about it.
      {THEORIST} decides to keep records instead. For eleven years, they note the time, the
      weather and who was in the room whenever someone holds the rod. By the ninth year, the
      number of people present seems to predict what will happen. The pattern holds every time
      they test it.
  - address: "content:events/arc_rod.yaml#events[id=rod_a_theory_that_works].absentBody"
    of: "2db383bb1f4a8fc7"
    plainenglish: >-
      For eleven years, someone recorded the time, weather and people present whenever the rod
      was used. That person has since died. Their notes show a clear pattern. Four people who
      often disagreed have tested it eleven more times over sixty years. It appeared to work
      every time.
  - address: "content:events/arc_rod.yaml#events[id=rod_a_theory_that_works].interaction.outcomes[id=written].text"
    of: "44e0d2bcd4f19ca0"
    plainenglish: >-
      The rod works when two blood relatives are present and does nothing when there is only one.
      The household records this finding. For the first time in four hundred years, the family
      has a claim about the rod that someone outside the house can check.
  - address: "content:events/arc_rod.yaml#events[id=rod_three_generations_of_being_right].title"
    of: "d4a4a148aa5a4744"
    plainenglish: >-
      Three Generations Trust the Same Rule
  - address: "content:events/arc_rod.yaml#events[id=rod_three_generations_of_being_right].body"
    of: "3dc8f7682aa6b604"
    plainenglish: >-
      The family believes that the rod needs two blood relatives in the room. For ninety years,
      the rule has appeared to work every time. The household now treats it as a fact, and
      children learn it before they learn to tend the grates. {HEAD} has used the rule twice to
      question whether a woman carries the blood she claims. Both times, its answer matched what
      the marriage market had already decided. Everyone saw that as proof of the rule, not as a
      reason to doubt it.
  - address: "content:events/arc_rod.yaml#events[id=rod_three_generations_of_being_right].absentBody"
    of: "4f4a2712ff365ec6"
    plainenglish: >-
      The family has followed the rule about two blood relatives for ninety years without seeing
      it fail. Children learn the rule before they learn to tend the grates. People have used it
      to settle two marriage disputes. Both times, it agreed with what the marriage market had
      already decided, so the household trusted it even more.
  - address: "content:events/arc_rod.yaml#events[id=rod_three_generations_of_being_right].interaction.choices[id=write_it_as_law].label"
    of: "87df1cda5a6f2546"
    plainenglish: >-
      Write the rule down as a settled fact. Four hundred years of guessing is enough.
  - address: "content:events/arc_rod.yaml#events[id=rod_three_generations_of_being_right].interaction.choices[id=write_it_as_law].outcomes[id=entered].text"
    of: "16e06d9d13d71c31"
    plainenglish: >-
      The chronicler writes the rule down as a finding, not an opinion, and cites eleven years of
      notes. The house believes it can finally state something true about the rod. Recording the
      finding is the family's proudest moment in about two hundred years.
  - address: "content:events/arc_rod.yaml#events[id=rod_three_generations_of_being_right].interaction.choices[id=keep_it_a_habit].label"
    of: "126c001319b03ae7"
    plainenglish: >-
      Keep the rule out of the book. A written claim would have to be defended.
  - address: "content:events/arc_rod.yaml#events[id=rod_three_generations_of_being_right].interaction.choices[id=keep_it_a_habit].outcomes[id=habit].text"
    of: "ba0e32fc898969e0"
    plainenglish: >-
      The family continues to follow the rule but never records it as a formal claim. There is no
      cost they can measure. For the next two generations, people cannot tell whether they are
      following a proven finding or a superstition. They follow it just as carefully either way.
  - address: "content:events/arc_rod.yaml#events[id=rod_three_generations_of_being_right].record.subject"
    of: "1153414ebeaddf2a"
    plainenglish: >-
      the rule about two blood relatives in the room
  - address: "content:events/arc_rod.yaml#events[id=rod_three_generations_of_being_right].record.options.record.chronicle"
    of: "350e2f9f71e85b73"
    plainenglish: >-
      The rod appears to work with two blood relatives in the room and not with one. The family
      has eleven years of notes and ninety years of practice with no recorded exception. It is
      the first claim about the third of the three heirlooms that someone else can test.
  - address: "content:events/arc_rod.yaml#events[id=rod_three_generations_of_being_right].record.options.embellish.chronicle"
    of: "f97b62179998dca3"
    plainenglish: >-
      The rod responds only to the family's blood. It has always answered whenever a member of
      this bloodline has needed it.
  - address: "content:events/arc_rod.yaml#events[id=rod_the_correlation_was_something_else].title"
    of: "461c1b9dd9909509"
    plainenglish: >-
      What the Notebook Was Really Counting
  - address: "content:events/arc_rod.yaml#events[id=rod_the_correlation_was_something_else].body"
    of: "56e82c2297204c8e"
    plainenglish: >-
      During a cold spring, fever has left the hall half empty. The family brings out the rod
      with two blood relatives in the room, as it has done for two hundred years. Nothing
      happens. On Tuesday they try again with four people, but it still does nothing. On
      Thursday, one person tries alone at four in the morning and the rod works. The archivist
      spends nine days reading the original eleven years of notes. Every successful test had one
      other thing in common: there was a fire in the room. The family had built two hundred years
      of decisions around a rule that was never real. But the fire does not explain what the rod
      is for either.
  - address: "content:events/arc_rod.yaml#events[id=rod_the_correlation_was_something_else].interaction.choices[id=write_the_correction].label"
    of: "b1137a7f152a681b"
    plainenglish: >-
      Write the correction below the old finding, in the same handwriting.
  - address: "content:events/arc_rod.yaml#events[id=rod_the_correlation_was_something_else].interaction.choices[id=write_the_correction].outcomes[id=corrected].text"
    of: "ca21772728e6aadb"
    plainenglish: >-
      The correction takes a page and a half. Its final line says that the house does not know
      what the rod is for and never has. Three people cry at supper, though none can later
      explain why. The family has lost more than a theory. For two hundred years, they believed
      they alone knew something true about the rod.
  - address: "content:events/arc_rod.yaml#events[id=rod_the_correlation_was_something_else].interaction.choices[id=let_it_stand].label"
    of: "1807c05dca553141"
    plainenglish: >-
      Keep the old finding in the book. No one outside this house can test it.
  - address: "content:events/arc_rod.yaml#events[id=rod_the_correlation_was_something_else].interaction.choices[id=let_it_stand].outcomes[id=stood].text"
    of: "c6f4dc13327b15e7"
    plainenglish: >-
      The family leaves the finding in the book, supported by eleven years of notes. Every later
      generation learns a false rule about its blood and cannot challenge it. Two generations use
      the rule to arrange marriages. Another uses it to refuse one, making the decision in just
      four minutes.
  - address: "content:events/arc_rod.yaml#events[id=rod_the_correlation_was_something_else].record.subject"
    of: "0c55be558bef9e91"
    plainenglish: >-
      what the first eleven years of notes were measuring
  - address: "content:events/arc_rod.yaml#events[id=rod_the_correlation_was_something_else].record.options.record.chronicle"
    of: "20b97445cf39a2f1"
    plainenglish: >-
      For two hundred years, the supposed rule about two blood relatives was really tracking
      whether there was a fire in the room. Nobody checked because the rule seemed reliable. The
      house still does not know what the third of the three heirlooms is for. It never did, and
      should stop claiming otherwise.
  - address: "content:events/arc_rod.yaml#events[id=rod_the_correlation_was_something_else].record.options.record.claims[0].text"
    of: "50a8ccfc7664c9d8"
    plainenglish: >-
      discovered that the rod's apparent rule about two blood relatives followed the presence of
      a fire, not their blood
  - address: "content:events/arc_rod.yaml#events[id=rod_the_correlation_was_something_else].record.options.embellish.chronicle"
    of: "8d0b58eb297f45a7"
    plainenglish: >-
      A cold spring temporarily disturbed the rod, as cold springs can. After examining it, we
      confirmed that the rule about two blood relatives still works exactly as it always has.
