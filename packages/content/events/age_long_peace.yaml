# THE LONG PEACE — warm register.
#
# The Age where nothing is wrong and that is the problem. Income up, mortality
# down, standing flat. Everybody breeds and nobody dies, so the hall fills, the
# roof waits, and the Roll of Houses reads out the same line for the third time
# running.
#
# The design note that matters here: a warm Age still has to COST something, or
# it is a rest stop rather than an Age. What the Long Peace costs is momentum,
# and momentum is the one currency the Ledger keeps counting in.
events:
  - id: too_many_at_the_table
    title: Sixteen at a Table Built for Nine
    tier: family
    frequency: uncommon
    weight: 80
    cooldownYears: 35
    tags: [peace, crowding, household]
    purposes: [buy_patience, change_standing, force_record_choice]
    ages: { only: [the_long_peace] }
    slots:
      HEAD: { role: head }
      STEWARD: { role: retainer, filters: [{ status: [alive] }] }
    body: >-
      The long room is loud in a way it was not twenty years ago, and the noise
      is the whole problem. {STEWARD} has counted sixteen at the table and the
      hall was built for nine. Nobody has died badly. Nobody has died at all,
      which is the difficulty — three good harvests, no war, no fever worth the
      name, and every son who would once have been a soldier or a corpse is
      instead a man of thirty with an opinion about the seating. The stores
      hold and the roof leaks and the arguments are about neither of those
      things. There is enough of everything and too much of everyone.
    interaction:
      kind: choice
      choices:
        - id: portion_them_out
          label: Portion them out. Dowries now are cheaper than quarrels later.
          outcomes:
            - id: placed
              weight: 100
              text: >-
                Four leave inside two years and the table is a table again. It
                costs what four portions cost, which is more than anyone said
                out loud at the time.
              effects:
                - { kind: treasury, delta: -40 }
                - { kind: respect, delta: 1 }
        - id: let_it_ride
          label: Let it ride. A full hall is not a crisis.
          outcomes:
            - id: crowded
              weight: 64
              text: >-
                It is not a crisis. It is eleven small grievances that all
                agree to be about the seating.
              effects:
                - { kind: branch, op: slight, amount: 6 }
            - id: settled
              weight: 36
              text: >-
                Two of them sort themselves out without being asked, which is
                the reward for having done nothing, and it is not a reward the
                house can count on twice.
              effects: []
    record:
      subject: the crowded years
      options:
        record:
          chronicle: Sixteen sat at a table built for nine, and four were portioned out because the house could not seat them.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: portioned four of the house out because sixteen could not fit at the table }
        omit:
          chronicle: null
        embellish:
          chronicle: The house was full in these years, and sent four of its own out into the province well provided for.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: provided portions for four of the house's children in one decade }
          discrepancy:
            id: the_crowded_years_lie
            severity: minor
            provableBy: [commons, house_calder]

  - id: the_road_nobody_mends
    title: Four Miles of Bad Gravel
    tier: family
    frequency: uncommon
    weight: 70
    cooldownYears: 45
    tags: [peace, branches, neglect]
    purposes: [change_relationship, buy_patience, plant_rumour]
    ages: { only: [the_long_peace] }
    slots:
      HEAD: { role: head }
      CADET: { role: cadet, filters: [{ age: { op: gte, value: 20 } }], optional: true }
    body: >-
      The cart from the smaller house is loud the whole way up, because four
      miles of bad gravel makes any cart loud. {CADET} arrives at noon and does
      not mention the road. He mentions the mill, and the tithe, and the west
      pasture he has raised twice before, and underneath all three of them sits
      the gravel nobody has mended since his grandfather was a boy. Peace is
      expensive in a way that war never is. Nothing forces the work, so the
      work does not happen, and the not-happening piles up somewhere it can be
      counted in hours. The road is still four miles.
    absentBody: >-
      The cart from the smaller house is loud the whole way up, because four
      miles of bad gravel makes any cart loud. It brings the tithe, a letter
      about the mill, and a question about the west pasture that has been
      asked twice before. None of the three is the road. Peace is expensive in
      a way that war never is: nothing forces the work, so the work does not
      happen, and the not-happening piles up somewhere it can be counted in
      hours. The road is still four miles.
    interaction:
      kind: choice
      choices:
        - id: mend_it
          label: Mend the road. It is gravel and it is four miles.
          outcomes:
            - id: mended
              weight: 100
              text: >-
                It takes a season and eleven men out of Wick and rather more
                cartage than the estimate allowed for. The cart from the
                smaller house now takes an hour and a quarter, and nobody
                mentions that either.
              effects:
                - { kind: treasury, delta: -14 }
                - { kind: branch, op: appease, amount: 12 }
        - id: leave_it
          label: Leave it. There is always next year.
          outcomes:
            - id: left
              weight: 100
              text: >-
                There is always next year. There has been always next year for
                thirty of them, and at the smaller house they have started
                counting.
              effects:
                - { kind: branch, op: slight, amount: 8 }
    rumour: { id: rumour_the_bad_road, accuracy: 0.8, spread: 1 }

  - id: the_flat_market
    title: A Year When Nobody Needs You
    tier: head
    frequency: uncommon
    weight: 65
    cooldownYears: 40
    tags: [peace, marriage, standing]
    purposes: [change_standing, buy_patience, plant_rumour]
    ages: { only: [the_long_peace] }
    conditions:
      all:
        - { ageElapsed: { op: gte, years: 15 } }
    slots:
      HEAD: { role: head }
    body: >-
      The notary at Bramme is bored, and a bored notary is the surest reading
      of the market there is. Six houses in the province have daughters this
      year and four of them have written first. In a bad year a marriage buys
      something: grain, a wall, a name at the assize, somebody's silence. In
      this year it buys a wedding. {HEAD} can take a good match cheaply, or
      hold out for a year in which a match is worth something again, and the
      difficulty with holding out is that the Long Peace has outlasted two
      Heads already and has shown no sign of forming an opinion about a third.
      Everyone is available and nobody is necessary.
    interaction:
      kind: choice
      choices:
        - id: buy_cheap
          label: Buy while it is cheap.
          outcomes:
            - id: bought
              weight: 100
              text: >-
                The terms are good and the wedding is small and the province
                notes both. Cheap blood bought in a fat year is the one
                purchase nobody is ever impressed by.
              effects:
                - { kind: treasury, delta: -10 }
        - id: hold_out
          label: Hold out. A match should cost the other house something.
          outcomes:
            - id: waited
              weight: 100
              text: >-
                The house waits. The Peace does not end that year, or the year
                after, and by the third the daughters of those six houses are
                somebody else's.
              effects:
                - { kind: respect, delta: -1 }
    rumour: { id: rumour_the_cheap_wedding, accuracy: 0.45, spread: 2 }

  - id: the_roll_does_not_move
    title: The Third Reading
    tier: record
    frequency: uncommon
    weight: 70
    cooldownYears: 60
    tags: [peace, standing, caster, record]
    purposes: [change_standing, force_record_choice, plant_rumour]
    ages: { only: [the_long_peace] }
    conditions:
      all:
        - { ageElapsed: { op: gte, years: 21 } }
    slots:
      HEAD: { role: head }
    body: >-
      The heralds' clerk is polite and the room is cold and the whole business
      takes under an hour. The Roll of Houses is read at Caster every seventh
      year, and for the third reading running the Eldritch House sits precisely
      where it sat. Not fallen. Not risen either, which is the part they will
      be chewing over at the smaller house for a decade, because a house that
      holds its place through three readings of plenty is a house carried by
      its land and not by anything anybody did. {HEAD} has a chronicle to write
      for the year and very little to put in it. The clerk asks whether there
      is anything to add.
    interaction:
      kind: narration
      outcomes:
        - id: read_out
          weight: 100
          text: >-
            The line is read, and it is the same line, and the clerk moves on
            to House Calder without pausing.
          effects: []
    rumour: { id: rumour_the_third_reading, accuracy: 0.6, spread: 2 }
    record:
      subject: the third reading of the Roll
      options:
        record:
          chronicle: The Roll was read at Caster and this house held its place, as it held it at the two readings before.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: held the house's place through three readings of the Roll }
        omit:
          chronicle: null
        embellish:
          chronicle: At Caster the house was read out among those by which the province measures itself, and was heard.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: was read out at Caster among the first houses of the province }
          discrepancy:
            id: the_caster_reading
            severity: minor
            provableBy: [house_ilm, commons]

  # A hundred and five years of nothing happening is exactly how long it takes
  # a family to forget a thing it was told once. The Peace is therefore where a
  # song is worth more than a chronicle: nobody edits a tune, because nobody
  # thinks a tune is a document.
  - id: the_stave_nobody_edited
    title: The Verse Nobody Thought to Cut
    tier: family
    frequency: uncommon
    weight: 120
    tags: [peace, folklore, feast, records]
    purposes: [advance_clause, plant_rumour, worldbuild_through_action]
    ages: { only: [the_long_peace] }
    conditions:
      all:
        - { unlocked: house_songs }
        - { generation: { op: gte, value: 5 } }
    slots:
      HEAD: { role: head }
      SINGER: { role: retainer, filters: [{ trait: keeps_the_house_songs, has: true }] }
    body: >-
      Nothing has happened for sixty years and the hall is warm and full and
      the second cup goes round for nobody in particular, because nobody died
      this year either. {SINGER} sings the long one, the one about the road and
      the two men and the weather, which everybody in this room has known since
      they could stand. In the seventh stave there is a line about a term of
      years and a thing counted from the day of signing, and it has been in
      that song for two hundred years, and it rhymes, which is why it is still
      in it. {HEAD} has read the contract, and nobody else at this table has,
      and nobody at this table has ever had the smallest reason to want to. The
      line is exact.
    interaction:
      kind: choice
      choices:
        - id: say_nothing_and_listen
          label: Say nothing. Let it finish, and then send for the singer.
          outcomes:
            - id: written_down
              weight: 100
              text: >-
                He gives it up gladly, all eleven staves, and cannot say where
                it came from beyond that his mother had it. Four of them are
                nonsense. Three of them are weather. The seventh is a clause
                that has been sung at this table twice a year, in front of
                tenants, by people who thought it was about a road.
              effects:
                - { kind: clause, reveal: clause_of_the_term }
        - id: have_it_dropped
          label: Have the seventh stave dropped. Quietly, from this year onward.
          outcomes:
            - id: dropped
              weight: 100
              text: >-
                It goes out of the song in one season and out of the valley in
                thirty years, and the Wayfolk who carried it die without
                teaching it, and by the fourth generation the long one is ten
                staves and always was. What the house has done is destroy the
                only copy of a thing it did not know it owned. It felt, at the
                time, like caution.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_the_missing_stave, accuracy: 0.55 }
    rumour: { id: rumour_the_missing_stave, accuracy: 0.4, spread: 1 }


# Plain English counterparts for the five Long Peace events (#567).
proseVariants:
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].title"
    of: ea9a5b0c9219fe08
    plainenglish: >-
      Sixteen People at a Nine-Person Table
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].body"
    of: 84bcce57f1e0709b
    plainenglish: >-
      The long room is much noisier than it was twenty years ago. {STEWARD} counts sixteen
      people at a table built for nine. Nobody has died, not even in war or fever. Three
      harvests have been good. Sons who might once have become soldiers or died are now
      thirty-year-old men arguing about where to sit. The food stores are full and the roof
      leaks, but neither causes the arguments. The house has enough supplies. It does not
      have enough room.
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].interaction.choices[id=portion_them_out].label"
    of: 1f4615e310fbd877
    plainenglish: >-
      Give some of them their portions now. Paying dowries is cheaper than future quarrels.
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].interaction.choices[id=portion_them_out].outcomes[id=placed].text"
    of: 22a2562ef0a7da2a
    plainenglish: >-
      Four people leave within two years. The table has room again. Providing their portions
      costs more than anyone admitted it would.
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].interaction.choices[id=let_it_ride].label"
    of: cc44673799dac45b
    plainenglish: >-
      Leave everyone where they are. A crowded hall is not an emergency.
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].interaction.choices[id=let_it_ride].outcomes[id=crowded].text"
    of: 255d239a5a5ebe76
    plainenglish: >-
      There is no emergency. Instead, eleven small disputes develop, all supposedly about
      the seating.
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].interaction.choices[id=let_it_ride].outcomes[id=settled].text"
    of: a0d64b1b21bb3be7
    plainenglish: >-
      Two people solve their own disagreements without help. Doing nothing works this time,
      but the house cannot rely on it working again.
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].record.subject"
    of: 36caafda342a0526
    plainenglish: >-
      the years when the hall was overcrowded
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].record.options.record.chronicle"
    of: f8797dd2656f61be
    plainenglish: >-
      Sixteen people sat at a table built for nine. Four were given portions and sent away
      because the house had no room for them.
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].record.options.record.claims[0].text"
    of: 9d03b996f18990c2
    plainenglish: >-
      gave four people their portions because sixteen could not fit at the table
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].record.options.embellish.chronicle"
    of: 42c1720199375a85
    plainenglish: >-
      The house was full during these years. It generously provided for four family members
      and sent them to live elsewhere in the province.
  - address: "content:events/age_long_peace.yaml#events[id=too_many_at_the_table].record.options.embellish.claims[0].text"
    of: 3c9240e17be08e95
    plainenglish: >-
      provided portions for four children of the house within one decade
  - address: "content:events/age_long_peace.yaml#events[id=the_road_nobody_mends].title"
    of: e85567ea214371c6
    plainenglish: >-
      Four Miles of Damaged Gravel Road
  - address: "content:events/age_long_peace.yaml#events[id=the_road_nobody_mends].body"
    of: 205eb1472565f2db
    plainenglish: >-
      The cart from the smaller house makes noise on all four miles of damaged gravel.
      {CADET} arrives at noon but does not complain about the road. He discusses the mill,
      the tithe and the west pasture, which he has raised twice before. Beneath those
      complaints is the road, which has not been repaired since his grandfather's childhood.
      Peace allows repairs to be postponed. Nothing forces the house to do the work, and the
      delays now cost hours of travel. The road is still four miles long.
  - address: "content:events/age_long_peace.yaml#events[id=the_road_nobody_mends].absentBody"
    of: a150770f9aa19823
    plainenglish: >-
      The cart from the smaller house makes noise on all four miles of damaged gravel. It
      brings the tithe, a letter about the mill and another question about the west pasture.
      That question has already been asked twice. None of the messages mentions the road.
      During peace the house can keep postponing repairs, and the delays now cost hours of
      travel. The road is still four miles long.
  - address: "content:events/age_long_peace.yaml#events[id=the_road_nobody_mends].interaction.choices[id=mend_it].label"
    of: 850c46629de8428e
    plainenglish: >-
      Repair the road. It is four miles of gravel.
  - address: "content:events/age_long_peace.yaml#events[id=the_road_nobody_mends].interaction.choices[id=mend_it].outcomes[id=mended].text"
    of: 2f9ff07bba1f0b77
    plainenglish: >-
      The repair takes one season, eleven workers from Wick and more cart transport than
      estimated. The journey from the smaller house now takes an hour and a quarter. Nobody
      comments on the improvement.
  - address: "content:events/age_long_peace.yaml#events[id=the_road_nobody_mends].interaction.choices[id=leave_it].label"
    of: ac07afb2f4f72616
    plainenglish: >-
      Do not repair it. The work can wait until next year.
  - address: "content:events/age_long_peace.yaml#events[id=the_road_nobody_mends].interaction.choices[id=leave_it].outcomes[id=left].text"
    of: f98fa4b473cf5ce8
    plainenglish: >-
      The house keeps postponing the repairs, as it has for thirty years. The people at the
      smaller house have begun counting how long they have waited.
  - address: "content:events/age_long_peace.yaml#events[id=the_flat_market].title"
    of: bf60eb647bf91528
    plainenglish: >-
      A Year When Nobody Needs Your House
  - address: "content:events/age_long_peace.yaml#events[id=the_flat_market].body"
    of: fa347d1223630d7e
    plainenglish: >-
      The notary in Bramme is bored, which shows how little competition there is for
      marriages. Six provincial houses have daughters available this year; four have already
      written to ask about matches. In a difficult year, a marriage might secure grain,
      protection, influence at the assize or someone's silence. This year it secures only a
      wedding. {HEAD} can make a good, inexpensive match now or wait for marriages to become
      more valuable. But the Long Peace has already lasted through two Heads and may
      continue through a third. Many matches are available, but none is urgently needed.
  - address: "content:events/age_long_peace.yaml#events[id=the_flat_market].interaction.choices[id=buy_cheap].label"
    of: 1d428360cf21627c
    plainenglish: >-
      Make the marriage arrangement while it costs little.
  - address: "content:events/age_long_peace.yaml#events[id=the_flat_market].interaction.choices[id=buy_cheap].outcomes[id=bought].text"
    of: 3074f3ef0ef73143
    plainenglish: >-
      The terms are favourable and the wedding is small. People across the province notice
      both. A cheap marriage made in a prosperous year wins the house little admiration.
  - address: "content:events/age_long_peace.yaml#events[id=the_flat_market].interaction.choices[id=hold_out].label"
    of: f47b33751aac44d9
    plainenglish: >-
      Wait. A marriage should also benefit the house at the other family's expense.
  - address: "content:events/age_long_peace.yaml#events[id=the_flat_market].interaction.choices[id=hold_out].outcomes[id=waited].text"
    of: 80e6acf7fecb7cdb
    plainenglish: >-
      The house waits. The Long Peace continues for another two years. By the third year,
      the daughters from those six houses have married elsewhere.
  - address: "content:events/age_long_peace.yaml#events[id=the_roll_does_not_move].title"
    of: 9ee4e4957e61a4c1
    plainenglish: >-
      The Third Reading of the Roll
  - address: "content:events/age_long_peace.yaml#events[id=the_roll_does_not_move].body"
    of: 43c4640c440cbd38
    plainenglish: >-
      The heralds' clerk is polite, the room is cold and the meeting lasts less than an
      hour. At Caster, the Roll of Houses is read every seven years. For the third reading
      in a row, the Eldritch House remains at exactly the same rank. It has not fallen, but
      it has not risen. The smaller house will discuss this for years: during three
      prosperous periods, the family has held its position because it owns land, not because
      anyone achieved something new. {HEAD} must write this year's chronicle but has little
      to report. The clerk asks whether there is anything to add.
  - address: "content:events/age_long_peace.yaml#events[id=the_roll_does_not_move].interaction.outcomes[id=read_out].text"
    of: 4af73c2683c3fd7a
    plainenglish: >-
      The clerk reads the house's name at the same rank as before, then continues to House
      Calder without stopping.
  - address: "content:events/age_long_peace.yaml#events[id=the_roll_does_not_move].record.subject"
    of: 138dba983fb6672c
    plainenglish: >-
      the third reading of the list of houses
  - address: "content:events/age_long_peace.yaml#events[id=the_roll_does_not_move].record.options.record.chronicle"
    of: dfda28a5b24f8c89
    plainenglish: >-
      At Caster, the Roll was read and our house kept the same rank it held at the previous
      two readings.
  - address: "content:events/age_long_peace.yaml#events[id=the_roll_does_not_move].record.options.record.claims[0].text"
    of: baa936c75d2d16eb
    plainenglish: >-
      kept the house at the same rank through three readings of the Roll
  - address: "content:events/age_long_peace.yaml#events[id=the_roll_does_not_move].record.options.embellish.chronicle"
    of: a0e8374cbef124e8
    plainenglish: >-
      At Caster, our house was named among the houses that set the standard for the
      province, and everyone heard it.
  - address: "content:events/age_long_peace.yaml#events[id=the_roll_does_not_move].record.options.embellish.claims[0].text"
    of: 31fb79237a7607af
    plainenglish: >-
      was named at Caster among the leading houses of the province
  - address: "content:events/age_long_peace.yaml#events[id=the_stave_nobody_edited].title"
    of: 729ff902f691223e
    plainenglish: >-
      The Song Verse Nobody Removed
  - address: "content:events/age_long_peace.yaml#events[id=the_stave_nobody_edited].body"
    of: 89c23d3ad9e06bfe
    plainenglish: >-
      Nothing important has happened for sixty years. The hall is warm and full, people
      share a second cup and nobody has died this year. {SINGER} sings the familiar long
      song about a road, two men and the weather. Everyone has known it since childhood. The
      seventh of its eleven verses names a term of years and something counted from the
      signing date. That line has stayed in the song for two hundred years, partly because
      it rhymes. {HEAD} has read the contract, but nobody else at the table has read it or
      thought to do so. The song's line matches the contract exactly.
  - address: "content:events/age_long_peace.yaml#events[id=the_stave_nobody_edited].interaction.choices[id=say_nothing_and_listen].label"
    of: 92f33338fc062b4c
    plainenglish: >-
      Say nothing while the song ends, then ask the singer to speak with you.
  - address: "content:events/age_long_peace.yaml#events[id=the_stave_nobody_edited].interaction.choices[id=say_nothing_and_listen].outcomes[id=written_down].text"
    of: 05f3f9105bd06a74
    plainenglish: >-
      The singer gladly recites all eleven verses. He only knows that his mother taught them
      to him. Four verses make no sense and three describe the weather. The seventh contains
      a contract clause. Tenants have heard people sing it at this table twice a year
      without knowing it was about anything more than a road.
  - address: "content:events/age_long_peace.yaml#events[id=the_stave_nobody_edited].interaction.choices[id=have_it_dropped].label"
    of: 433054370999a193
    plainenglish: >-
      Quietly remove the seventh verse from the song from now on.
  - address: "content:events/age_long_peace.yaml#events[id=the_stave_nobody_edited].interaction.choices[id=have_it_dropped].outcomes[id=dropped].text"
    of: 56c311383d162064
    plainenglish: >-
      The seventh verse disappears from the song within one season and from the valley
      within thirty years. The Wayfolk who knew it die without teaching it to anyone. By the
      fourth generation, everyone believes the long song always had ten verses. The house
      has destroyed the only surviving copy of something it did not know it owned. At the
      time, that seemed like a cautious decision.
