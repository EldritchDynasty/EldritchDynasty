# AGE-EXCLUSIVE CONTENT
#
# An Age that shares all its content with every other Age is a modifier wearing
# a name. These fire in one Age and nowhere else, which is why they take a
# priority boost while their Age is active — a twenty-year Wars must still show
# the player a war.
#
# Note `ageElapsed`: the twentieth year of a war is a different place from the
# second, and it costs one field to let an author write both.
events:
  - id: the_levy_at_the_door
    title: The Levy at the Door
    tier: family
    frequency: common
    weight: 150
    tags: [war, levy, hardship]
    purposes: [change_standing, change_relationship, buy_patience]
    ages: { only: [the_wars] }
    slots:
      HEAD: { role: head }
      SON: { role: family_member, filters: [{ sex: male }, { age: { op: gte, value: 16 } }, { relation: not, of: HEAD }] }
    body: >-
      They come with a list and a cart and the good manners of men who do not
      need to be rude. Two in every five households, and the house is counted
      as a household, which is new. {HEAD} can send {SON}, or send coin, or
      send the argument up the chain and see what comes back down it.
    interaction:
      kind: choice
      choices:
        - id: send_the_son
          label: Send him. It is what the standing is for.
          outcomes:
            - id: honour
              weight: 62
              text: He comes back four years later with a limp and a reputation.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: attribute, target: { slot: SON }, attr: strength, delta: -6 }
            - id: gone
              weight: 38
              text: He does not come back. There is a letter, and it is a form, and the name is spelled wrong.
              effects:
                - { kind: status, target: { slot: SON }, status: dead, cause: the levy }
                - { kind: respect, delta: 1 }
        - id: pay
          label: Pay it out. Coin is cheaper than sons.
          outcomes:
            - id: paid
              weight: 100
              text: >-
                It is cheaper than sons and everyone in the province knows to
                the mark exactly how much cheaper you thought it was.
              effects:
                - { kind: treasury, delta: -120 }
                - { kind: respect, delta: -1 }

  - id: the_looted_library
    title: Somebody Else's Library
    tier: head
    frequency: uncommon
    weight: 120
    tags: [war, auction, books]
    purposes: [change_standing, worldbuild_through_action, buy_patience]
    ages: { only: [the_wars] }
    conditions:
      all:
        - { ageElapsed: { op: gte, years: 8 } }
    slots:
      HEAD: { role: head }
    body: >-
      The stall is in a market that did not exist last year, and the man
      running it does not know what he has. Forty volumes out of a house in the
      east that no longer has a roof, priced by weight. {HEAD} knows what three
      of them are. The war has been a catastrophe and it has also been the best
      buying window in four hundred years, and both of those are true at once.
    interaction:
      kind: choice
      choices:
        - id: buy
          label: Buy the lot. Sort it later.
          outcomes:
            - id: bought
              weight: 100
              text: >-
                Eleven are worthless, twenty-six are ordinary, and three are
                the reason your great-grandchildren will be able to do this at all.
              effects:
                - { kind: treasury, delta: -220 }
                - { kind: flag, flag: looted_library, set: true }
        - id: walk
          label: Walk past. There is a war on and coin is a wall.
          outcomes:
            - id: walked
              weight: 100
              text: Somebody from House Ilm buys them on the Thursday.
              effects: []

  - id: the_inquest_of_names
    title: An Inquest, Politely Conducted
    tier: record
    frequency: uncommon
    weight: 130
    tags: [church, inquest, record]
    purposes: [force_record_choice, change_standing, change_relationship]
    ages: { only: [the_crusade] }
    slots:
      HEAD: { role: head }
    body: >-
      They are not accusing anyone. They want that understood before anything
      else is said. They have the house's account of the year 1341 and they
      have three other accounts of the year 1341, and they would simply like to
      understand why {HEAD}'s is the shortest. There is tea. Nobody drinks it.
    interaction:
      kind: choice
      choices:
        - id: stand_on_it
          label: Stand on the record as written.
          outcomes:
            - id: held
              weight: 58
              text: They thank the house for its time. They take the ledger with them.
              effects:
                - { kind: flag, flag: church_holds_a_copy, set: true }
            - id: cracked
              weight: 42
              text: >-
                One of them asks a follow-up question that could only be asked
                by somebody who already knew the answer.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: discrepancy, op: create, id: the_thin_papers, severity: minor, provableBy: [the_church] }
                - { kind: discrepancy, op: prove, id: the_thin_papers }
        - id: concede_a_little
          label: Concede a small thing to protect a large one.
          outcomes:
            - id: bought_off
              weight: 100
              text: >-
                A minor heresy, freely admitted, costs a fine and buys eighty
                years of not being looked at closely.
              effects:
                - { kind: treasury, delta: -180 }
                - { kind: respect, delta: -1 }
                - { kind: discrepancy, op: create, id: the_thin_papers, severity: minor, provableBy: [the_church] }
                - { kind: discrepancy, op: bury, id: the_thin_papers }

  - id: nothing_gained
    title: A Generation With Nothing In It
    tier: family
    frequency: common
    weight: 140
    tags: [withering, drift]
    purposes: [worldbuild_through_action, establish_magic_rule, buy_patience]
    ages: { only: [the_withering] }
    slots:
      HEAD: { role: head }
    body: >-
      Nobody wakes. Not the promising one, not the difficult one, not the girl
      everyone had quietly decided about. {HEAD} keeps the accounts and keeps
      the peace and keeps the house, and at the end of thirty years the house
      is exactly where it was, minus thirty years. The Ledger does not stop
      counting for a Withering. It has never stopped counting for anything.
    interaction:
      kind: narration
      outcomes:
        - id: drift
          weight: 100
          text: The chronicle for this decade is four lines long. Three of them are about weather.
          effects:
            - { kind: chronicle, text: 'A quiet decade. The rye did well.' }

  - id: the_desperate_offer
    title: Ruined, and Willing
    tier: head
    frequency: uncommon
    # The Insurrection's fourth scene, filed here rather than with the other
    # three, and carrying their weight for the reason written at the top of
    # `age_insurrection.yaml`: inside an Age this brief, its own content has
    # to outweigh the whole unscoped pool or its endings are paragraphs
    # nobody reads.
    weight: 1000
    tags: [marriage, insurrection, opportunity]
    purposes: [change_standing, change_relationship, worldbuild_through_action]
    ages: { only: [the_insurrection] }
    slots:
      HEAD: { role: head }
      SUITOR: { role: outsider, filters: [{ sex: female }, { age: { op: gte, value: 17 } }] }
    body: >-
      Six months ago the house of {SUITOR} would not have received {HEAD}'s
      steward. The letter now is four lines and one of them is the word
      immediately. Excellent blood, ruined standing, and terms that would have
      been an insult to write down in any year but this one.
    interaction:
      kind: choice
      choices:
        - id: take_it
          label: Take it before somebody else does.
          outcomes:
            - id: taken
              weight: 100
              text: >-
                It is the cheapest good blood the house will ever buy, and
                everyone remembers who bought it cheap.
              effects:
                - { kind: treasury, delta: -40 }
                - { kind: respect, delta: -1 }
        - id: wait
          label: Wait. Desperation deepens.
          outcomes:
            - id: waited
              weight: 55
              text: It does deepen. The terms improve twice more before the year is out.
              effects:
                - { kind: flag, flag: waited_out_the_insurrection, set: true }
            - id: lost
              weight: 45
              text: House Marrow was not waiting.
              effects:
                - { kind: relationship, from: head, to: { slot: SUITOR }, sentiment: -10 }

  - id: what_came_up_the_river_road
    title: What Came Up the River Road
    tier: family
    frequency: rare
    # 400, and it is the WINDOW and not the tier again — the same pricing
    # `the_hall_after` needed, and the second instance found in one session,
    # which is what makes it a class rather than an incident. This is rare AND
    # `ages: { only: [the_wars] }`, so a flat 100 prices the war years as
    # though they were the run: measured, it fires in 12 runs of 60, and
    # `hold_the_gate -> broken_through` is one check band of one of two
    # choices under that — about one per cent, against gate 8's floor of half
    # a per cent. It has been reported at 1.2%, 0.8% and 0% on three
    # consecutive batches without its content changing at all.
    #
    # At 400 the event reaches 30 runs of 60. The check's own difficulty is
    # untouched: how often the house loses the gate is a separate question
    # from how often the house is asked.
    weight: 400
    tags: [war, violence]
    purposes: [change_standing, worldbuild_through_action, force_record_choice]
    ages: { only: [the_wars] }
    slots:
      HEAD: { role: head }
    body: >-
      The dogs go quiet first, which is how {HEAD} knows before the boy from
      the mill does. Six men on the river road, unhurried, carrying the
      confidence of people who have done this before and were not stopped.
      The garrison is two days off, if the roads hold. The gates are wood.
    interaction:
      kind: choice
      choices:
        - id: hold_the_gate
          label: Stand at the gate yourself.
          check: gate_stand
          outcomes:
            - id: driven_off
              weight: 100
              text: >-
                It takes less time than the waiting did. They were counting on
                the gate being the hard part, and it was not, and they leave
                two of their own in the mud to prove it.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: attribute, target: { slot: HEAD }, attr: strength, delta: -2 }
            - id: held
              weight: 100
              text: >-
                Nobody breaks and nobody wins. They pull back before dark,
                which is not the same as leaving, and {HEAD} spends the night
                at the gate anyway.
              effects:
                - { kind: attribute, target: { slot: HEAD }, attr: strength, delta: -4 }
            - id: broken_through
              weight: 100
              text: >-
                The gate holds for less time than it took to bar it. They take
                the grain store and the horses and are gone before the
                garrison is halfway there.
              effects:
                - { kind: treasury, delta: -60 }
                - { kind: respect, delta: -1 }
                - { kind: attribute, target: { slot: HEAD }, attr: strength, delta: -6 }
        - id: bar_the_doors
          label: Bar the doors and wait for the garrison.
          outcomes:
            - id: waited_out
              weight: 70
              tags: [vigilance]
              text: >-
                The house sits in the dark and listens to somebody else's barn
                burn. By the time the garrison arrives there is nothing left
                to arrive for.
              effects:
                - { kind: treasury, delta: -25 }
            - id: found_the_side_door
              weight: 30
              text: >-
                The side door was never meant to hold against anyone who
                already knew it was there. Somebody did.
              effects:
                - { kind: treasury, delta: -70 }
                - { kind: respect, delta: -1 }
    checks:
      - id: gate_stand
        pool: { kind: slot, slot: HEAD, attrs: [{ attr: strength, weight: 1 }] }
        difficulty: 38
        variance: narrow
        bands:
          - { atLeast: 10, outcome: driven_off }
          - { atLeast: -12, outcome: held }
          - { atLeast: -999, outcome: broken_through }
    record:
      subject: the six men on the river road
      options:
        record:
          chronicle: Six came up the river road and the house met them at the gate. Not everyone did.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: met six men from the river road at the gate with the house }
        omit:
          chronicle: null
        embellish:
          chronicle: A company of raiders broke against these walls, and this house was the reason the garrison found nothing left to do.
          effects:
            - { kind: respect, delta: 2 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: 'broke a company of raiders against these walls, unaided' }
          discrepancy:
            id: the_river_road_lie
            severity: minor
            provableBy: [house_marrow, commons]
    rumour: { id: rumour_the_river_road, accuracy: 0.5, spread: 2 }
    accounts: [ballad_of_the_river_road, cawdry_garrison_log_1218]

  - id: the_boy_they_send_us
    title: The Boy They Send Us
    tier: head
    frequency: uncommon
    weight: 75
    cooldownYears: 35
    tags: [war, hostage, fostering, record]
    purposes: [change_relationship, buy_patience, force_record_choice]
    ages: { only: [the_wars] }
    conditions:
      all:
        - { ageElapsed: { op: gte, years: 4 } }
    slots:
      HEAD: { role: head }
      # The boy himself is narrated, not cast. The outsider pool is built from
      # suitors, rivals and envoys and holds no children, so a slot asking for
      # one cannot fill in any run — gate 2 caught exactly that. The man who
      # delivers him is the person this scene actually has to remember, because
      # he is the one who comes back in nine years.
      ENVOY:
        role: rival_house
        filters: [{ sex: male }, { age: { op: gte, value: 25 } }]
    body: >-
      The escort is six men, and they are cold, and they want to be gone before
      dark. {ENVOY} does the talking and does not dismount while he does it.
      The boy is eleven and belongs to a house four valleys over that has
      picked the losing side twice and needs somebody to hold a surety it can
      no longer hold itself. He is not a hostage. That is the word nobody uses,
      and the arrangement is a fostering, and the difference between those two
      words is entirely a matter of who wins, which nobody will know for nine
      years. He eats what the house eats and learns what the house teaches and
      goes home when somebody says that he can. He has brought his own horse.
    interaction:
      kind: choice
      choices:
        - id: raise_him_as_ours
          label: Raise him as one of the house's own.
          outcomes:
            - id: raised
              weight: 100
              text: >-
                He is taught in the long room with the rest and eats at the
                table on the third night, and nine years later he goes home a
                man who will not hear a word said against this house, which is
                worth more than the surety ever was.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: relationship, from: head, to: { slot: ENVOY }, sentiment: 30 }
                - { kind: respect, delta: 1 }
        - id: keep_him_apart
          label: Keep him fed, housed, and separate.
          outcomes:
            - id: kept_apart
              weight: 100
              text: >-
                He is fed, housed, and taught nothing, and he counts the doors
                he is not shown through. When he goes home he is nineteen and
                he remembers every one of them.
              effects:
                - { kind: treasury, delta: -9 }
                - { kind: relationship, from: head, to: { slot: ENVOY }, sentiment: -25 }
    record:
      subject: the boy held as surety
      options:
        record:
          chronicle: A boy of eleven was held here as surety for his house during the war, and the word used in the papers was fostering.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: held an eleven-year-old boy as surety while the papers called it fostering }
        omit:
          chronicle: null
        embellish:
          chronicle: A boy of a great house was fostered here through the war years, at this family's invitation and at its own expense.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: fostered the heir of an allied house through the war at his own expense }
          discrepancy:
            id: the_fostering_lie
            severity: minor
            provableBy: [house_calder, commons]

proseVariants:
  - address: "content:events/age_scoped.yaml#events[id=the_levy_at_the_door].title"
