  - address: "content:events/age_scoped.yaml#events[id=the_boy_they_send_us].title"
    of: 2e9fe6eebe676eaa
    plainenglish: "The Boy Sent as Surety"
  - address: "content:events/age_scoped.yaml#events[id=the_boy_they_send_us].body"
    of: 5d1461c25c00790e
    plainenglish: "Six cold escorts arrive and want to leave before dark. {ENVOY} speaks for them without getting off his horse. They bring an eleven-year-old boy from a house four valleys away that has backed the losing side twice. His family needs another house to hold him as security. Everyone calls the arrangement fostering rather than hostage-taking, but the practical difference will depend on who wins the war. For nine years he will eat, learn, and live here until someone allows him to go home. He has brought his own horse."
  - address: "content:events/age_scoped.yaml#events[id=the_boy_they_send_us].interaction.choices[id=raise_him_as_ours].label"
    of: 4d53196917eba415
    plainenglish: "Raise him with the house's own children."
  - address: "content:events/age_scoped.yaml#events[id=the_boy_they_send_us].interaction.choices[id=raise_him_as_ours].outcomes[id=raised].text"
    of: c588dccd8e0c5951
    plainenglish: "He studies with the other children and joins the family table on his third night. Nine years later he returns home loyal to this house, which proves more valuable than the original surety."
  - address: "content:events/age_scoped.yaml#events[id=the_boy_they_send_us].interaction.choices[id=keep_him_apart].label"
    of: 21f471b760ef3e73
    plainenglish: "Give him food and a room, but keep him separate."
  - address: "content:events/age_scoped.yaml#events[id=the_boy_they_send_us].interaction.choices[id=keep_him_apart].outcomes[id=kept_apart].text"
    of: fe133ccdcfa0b6c1
    plainenglish: "He is fed and housed but taught nothing, and he notices every door kept closed to him. He returns home at nineteen remembering all of them."
  - address: "content:events/age_scoped.yaml#events[id=the_boy_they_send_us].record.subject"
