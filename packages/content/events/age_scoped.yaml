    of: f503ac50bed128cc
    plainenglish: "The levy officers arrive with a list and a cart. They are taking men from two in every five households, and for the first time this house counts as one of those households. {HEAD} can send {SON}, pay money instead, or appeal the demand to higher authorities."
  - address: "content:events/age_scoped.yaml#events[id=the_levy_at_the_door].interaction.choices[id=send_the_son].label"
    of: 4cfa2edaaee84fc6
