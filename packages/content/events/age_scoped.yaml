  - address: "content:events/age_scoped.yaml#events[id=the_levy_at_the_door].interaction.choices[id=send_the_son].outcomes[id=honour].text"
    of: 6cafe410f1aac7d4
    plainenglish: "He returns four years later with a limp and a good reputation."
  - address: "content:events/age_scoped.yaml#events[id=the_levy_at_the_door].interaction.choices[id=send_the_son].outcomes[id=gone].text"
