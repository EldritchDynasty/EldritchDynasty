# Events that show what `decidedBy` is for, and what an inline follow-up is for.
#
# Three shapes, one template each:
#
#   the_reeve_at_ingathering    decidedBy: state. Nobody is asked. What the
#                               house does with a bad harvest is already
#                               decided by what is in the coffer and how close
#                               the village is to the edge, and a ladder of
#                               guards says so out loud.
#
#   the_wheel_stops             decidedBy: party. The player's decision is WHO
#                               GOES; a check pooled over exactly those people
#                               decides the rest. The branches are labelled as
#                               what happens, not as options, because by the
#                               time they are reached nobody is choosing.
#
#   the_boy_and_the_east_cellar A two-beat scene with `next` and no arc file.
#                               `keep: [CHILD]` is the whole reason it is not
#                               two unrelated events: the follow-up is about
#                               the same person, thirty years older.
events:
  - id: the_reeve_at_ingathering
    title: What the Reeve Came to Ask
    tier: family
    frequency: uncommon
    weight: 100
    tags: [tenants, harvest, money]
    purposes: [buy_patience, change_standing, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      The reeve comes up from Wick the day after Ingathering, which is the day
      he always comes, and he stands in the yard with his hat in his hands
      until {HEAD} notices him. It has rained for six weeks. The mill has
      ground half what it ground last year, the tenants have eaten most of
      that, and the numbers are on the back of a tally he has plainly copied
      out twice to get them small enough to carry. He does not ask for
      anything; he waits to be asked, and then he says the word forgiven the
      way a man says a word he practised on the road up. It is not a word this
      house uses.
    interaction:
      kind: choice
      # Read top down. The first rung that holds takes its branch, and the
      # last has no guard, which is how an author writes the else.
      decidedBy:
        state:
          - when: { treasury: { op: lt, value: 150 } }
            take: take_it_whole
            because: there is nothing in the coffer to forgive a year with
          # 45 was a knife edge in the old Long Line. 32 fixed that there,
          # but the 500-year campaign exposed the same funnel again: Gate 8 on
          # current main reached `forgiven` in only 2 of 800 runs (0.25%).
          # This branch is a STATE, not a weighted gamble: a solvent house with
          # a village already near the edge should enter it often enough to be
          # part of play rather than a sample accident. #139 widens that state
          # here instead of buying more event draws from unrelated content.
          - when: { discontent: { op: gte, value: 25 } }
            take: forgive
            because: the village is already close enough to the edge
          - take: take_in_kind
      choices:
        - id: forgive
          label: Forgive the year.
          outcomes:
            - id: forgiven
              weight: 100
              tags: [mercy]
              text: >-
                It is written off in the ledger in a hand that is not quite
                steady, and by the following week three men in Wick have told
                the story to somebody who was not there, and improved it.
              effects:
                - { kind: treasury, delta: -60 }
                - { kind: respect, delta: 1 }
        - id: take_in_kind
          label: Take it in kind, and take less of it.
          outcomes:
            - id: taken_in_kind
              weight: 100
              text: >-
                Barley, two pigs, and a quantity of bad cheese that the hall
                will still be working through at Greening. Nobody is happy and
                nobody is ruined, which the reeve seems to have expected.
              effects:
                - { kind: treasury, delta: -20 }
        - id: take_it_whole
          label: Take it whole. The roof does not care about the weather.
          outcomes:
            - id: taken_whole
              weight: 100
              tags: [hard]
              text: >-
                Two families are gone by spring and their holdings go to men
                who can pay, which is the correct outcome by every measure the
                house keeps and by none of the ones Wick keeps.
              effects:
                - { kind: treasury, delta: 40 }
                - { kind: respect, delta: -1 }

  - id: the_wheel_stops
    title: The Wheel Stops in the Night
    tier: family
    frequency: uncommon
    weight: 100
    tags: [mill, winter, dispatch]
    purposes: [change_standing, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      # The player fills these. That is the decision he is being asked for —
      # the branch below follows from who he sends. Each excludes the ones
      # before it, so the house cannot send one woman down the race three
      # times; `resolveSlots` fills them in dependency order so those filters
      # are asked when they can be answered.
      SENT_A:
        role: family_member
        castBy: player
        filters: [{ status: [alive] }, { age: { op: gte, value: 15 } }]
      SENT_B:
        role: family_member
        castBy: player
        optional: true
        filters:
          - { status: [alive] }
          - { age: { op: gte, value: 15 } }
          - { relation: not, of: SENT_A }
      SENT_C:
        role: family_member
        castBy: player
        optional: true
        filters:
          - { status: [alive] }
          - { age: { op: gte, value: 15 } }
          - { relation: not, of: SENT_A }
          - { relation: not, of: SENT_B }
    body: >-
      The wheel stops in the night and it is the sound it does not make that
      wakes the house. Wend water in February takes the feeling out of a
      man's hands in about the time it takes to say so, and the race is
      packed with alder that came down four miles upstream and arrived all at
      once. {HEAD} can send whoever the hall can spare and no more than that.
      The reeve says two days before the flour runs out in Wick. The reeve
      has been wrong about that before, in the direction that costs.
    checks:
      # A party check. Its bands name BRANCHES, not outcomes — what the people
      # sent are between them is what decides which of the three happens.
      - id: the_race
        pool: { kind: party_sum, slots: [SENT_A, SENT_B, SENT_C], attr: strength }
        # Calibrated against the real distribution, not against a guess at what
        # a strength score looks like: three of the household drawn at random
        # sum to about 99, quartiles 77 and 120. The chronicler draws at random
        # and lands mostly in the middle band, which is the point — a player who
        # picks the right three should be able to buy the top one.
        difficulty: { base: 92, perCentury: 2 }
        variance: narrow
        bands:
          - { atLeast: 20, outcome: they_clear_it }
          - { atLeast: -22, outcome: they_clear_it_hard }
          - { atLeast: -9999, outcome: they_come_back_wet }
    interaction:
      kind: dispatch
      decidedBy: { party: { check: the_race } }
      choices:
        - id: they_clear_it
          label: They clear the race before dawn.
          outcomes:
            - id: cleared
              weight: 100
              tags: [competent]
              text: >-
                The wheel turns again a little after four and the noise of it
                is the reason nobody in the hall sleeps for the rest of the
                night, which nobody complains about.
              effects:
                - { kind: treasury, delta: 15 }
                - { kind: respect, delta: 1 }
        - id: they_clear_it_hard
          label: They clear it, and it costs.
          outcomes:
            - id: cleared_hard
              weight: 100
              tags: [competent, injury]
              text: >-
                The alder goes in the end. So does a hand, most of the way
                through, on a beam that had been holding the whole tangle up
                and was under more than anyone standing in the water could
                have guessed.
              effects:
                - { kind: attribute, target: { slot: SENT_A }, attr: strength, delta: -8 }
                - { kind: treasury, delta: 10 }
        - id: they_come_back_wet
          label: They come back wet, and the wheel stays where it is.
          outcomes:
            - id: not_shifted
              weight: 100
              tags: [failure]
              text: >-
                They work at it until the light comes and then they stand in
                the yard steaming and not saying much. Wick buys its flour in
                Bramme for a month, at Bramme prices, and remembers it for
                considerably longer than a month.
              effects:
                - { kind: treasury, delta: -45 }
                - { kind: respect, delta: -1 }

  # ── The two-beat scene ───────────────────────────────────────────────────
  - id: the_boy_and_the_east_cellar
    title: The Key on the Nail
    tier: individual
    # COMMON, and it always should have been. A child reaching a key off a nail
    # is ordinary texture, and CLAUDE.md says where ordinary texture goes: the
    # uncommon cooldown is global to its tier, so a run has room for about 83
    # uncommon firings shared by every uncommon template in the game.
    #
    # This was the FIRST BEAT of a two-beat scene whose second beat is
    # `what_he_did_with_the_key`, so the chain needed two draws from the most
    # rationed tier in the game and `arcs.slow.test.ts` measured it firing zero
    # times in 700 years across three seeds. It had been passing on a coin.
    frequency: common
    weight: 100
    tags: [cellar, childhood, secret]
    purposes: [buy_patience, change_relationship, plant_rumour]
    slots:
      CHILD: { role: child, filters: [{ status: [alive] }, { age: { op: gte, value: 8 } }] }
    body: >-
      The east cellar is where the house puts what it has bought and would
      rather not look at, and the key lives on a nail in the long room
      because nobody has ever needed to hide it. {CHILD} is old enough to
      reach the nail by standing on the settle. Nobody notices for two days.
      When somebody does, the key is back where it belongs, hung the wrong
      way round, and the dust on the third step has a clean strip up the
      middle of it the width of a boot.
    interaction:
      kind: narration
      outcomes:
        - id: went_down
          weight: 100
          tags: [secret]
          text: >-
            Nothing is said about it, which in this house is a decision and
            not an oversight.
          effects: []
          # The second beat, inline. No arc file: `desugar.ts` compiles this
          # into one before the engine sees it. `keep` is what makes it the
          # same person thirty years on rather than a stranger with the same
          # part.
          next:
            event: what_he_did_with_the_key
            after: { minYears: 22, maxYears: 34 }
            keep: [CHILD]

  - id: what_he_did_with_the_key
    title: A Clerk With All Day
    tier: family
    frequency: uncommon
    weight: 100
    tags: [cellar, secret, church]
    purposes: [force_record_choice, plant_rumour, worldbuild_through_action]
    slots:
      CHILD:
        role: family_member
        bind: arc
        onMissing: continue_absent
        filters: [{ status: [alive] }]
    body: >-
      There is a man at the gate at Ingathering with a wax tablet and a
      letter from the chapter house at Bramme, and what he wants is a list of
      what the house keeps in its cellars. {CHILD} has not been down those
      steps since childhood and has never once mentioned that there is a
      third room. Nobody else in the hall knows there is. The clerk is
      unhurried. He has all day, and he says so twice.
    absentBody: >-
      There is a man at the gate at Ingathering with a wax tablet and a
      letter from the chapter house at Bramme, and what he wants is a list of
      what the house keeps in its cellars. The only person who ever went down
      to look is four years in the ground and told nobody what was there. The
      key is on its nail, hung the wrong way round, and has been for as long
      as anyone can remember. The clerk is unhurried. He has all day, and he
      says so twice.
    interaction:
      kind: choice
      choices:
        - id: give_him_the_short_list
          label: Give him the list the house gives the assessor.
          outcomes:
            - id: short_list
              weight: 100
              tags: [omission]
              text: >-
                He copies it out, thanks the house, and asks one more question
                on his way through the yard that he had no reason to think of
                and every reason to remember the answer to.
              effects:
                - { kind: flag, flag: the_clerk_asked_again, set: true }
                - { kind: respect, delta: 1 }
        - id: walk_him_down
          label: Take him down and show him the whole of it.
          outcomes:
            - id: shown
              weight: 100
              tags: [candour]
              text: >-
                He is down there rather longer than the house expected and
                comes up saying almost nothing, which is worse than any of the
                things he might have said. He says rather more at Bramme,
                and the chapter house is not a place where things stay said
                once.
              # #341: nothing in the cellar was sold or seized, and the thirty
              # crowns were never explained. What candour costs is the room
              # itself, carried out of the house by a man with a wax tablet.
              effects:
                - { kind: respect, delta: 2 }
                - { kind: rumour, op: seed, id: rumour_the_room_under_the_east_cellar, accuracy: 0.6 }
    # A scene whose declared purpose is `force_record_choice` and which offered
    # the family no Record choice was the same dilution bug from the other side:
    # it drew from the ambient pool without ever feeding the record layer the
    # frame reads. `arcs.slow.test.ts`'s interlude average is what noticed.
    record:
      subject: what the house keeps in its cellars
      options:
        record:
          chronicle: The chapter house asked what we keep below, and there is a room under the east cellar that is not on any list we have ever given anyone.
          grantsKnowledge: knows_the_third_room
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: CHILD }, text: kept the room under the east cellar off the list given to the chapter house }
        omit:
          chronicle: null
        embellish:
          chronicle: The cellars were listed entire for the chapter house, as they have been listed for the assessor these two hundred years.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: CHILD }, text: listed the cellars entire for the chapter house }
          discrepancy:
            id: the_cellar_list_lie
            severity: minor
            provableBy: [the_church, house_marrow]

# Plain English counterparts for the Wend events (issue #1087, child of #415).
proseVariants:
  - address: "content:events/wend.yaml#events[id=the_reeve_at_ingathering].title"
    of: 9800d90747a95cfb
    plainenglish: >-
      The Reeve's Request
  - address: "content:events/wend.yaml#events[id=the_reeve_at_ingathering].body"
    of: 474dc3d3729b506f
    plainenglish: >-
      The reeve comes from Wick the day after Ingathering, as he does every year. He stands in the
      yard holding his hat until {HEAD} notices him. It has rained for six weeks. The mill has
      ground half as much grain as last year, and the tenants have already eaten most of it. He has
      written the figures on a tally twice, making them small enough to carry. He waits for someone
      to ask what he needs. Then he asks for the year's payment to be forgiven. He has clearly
      practised the word on his way to the hall. This house is not used to forgiving debts.
  - address: "content:events/wend.yaml#events[id=the_reeve_at_ingathering].interaction.decidedBy.state[0].because"
    of: 096a20feb3852012
    plainenglish: >-
      the treasury has too little money to give up a year's income
  - address: "content:events/wend.yaml#events[id=the_reeve_at_ingathering].interaction.decidedBy.state[1].because"
    of: cf3064ebc575ad57
    plainenglish: >-
      the village is already close to its limit
  - address: "content:events/wend.yaml#events[id=the_reeve_at_ingathering].interaction.choices[id=forgive].label"
    of: 108bd56b5ee9f45f
    plainenglish: >-
      Forgive what the tenants owe for this year.
  - address: "content:events/wend.yaml#events[id=the_reeve_at_ingathering].interaction.choices[id=forgive].outcomes[id=forgiven].text"
    of: d408be9b2865da2f
    plainenglish: >-
      The debt is cancelled in the ledger. The person writing the entry has an unsteady hand. By the
      following week, three men from Wick have each told someone who was not there. Each has made
      the story sound better.
  - address: "content:events/wend.yaml#events[id=the_reeve_at_ingathering].interaction.choices[id=take_in_kind].label"
    of: cf4dd92b8665fc0f
    plainenglish: >-
      Accept goods instead of money, and take a smaller amount.
  - address: "content:events/wend.yaml#events[id=the_reeve_at_ingathering].interaction.choices[id=take_in_kind].outcomes[id=taken_in_kind].text"
    of: 1100c8840c3d70b0
    plainenglish: >-
      The house receives barley, two pigs and enough poor-quality cheese to last until Greening.
      Nobody is pleased, but nobody loses everything. The reeve appears to have expected that
      result.
  - address: "content:events/wend.yaml#events[id=the_reeve_at_ingathering].interaction.choices[id=take_it_whole].label"
    of: 95989be8b33e142c
    plainenglish: >-
      Collect the full amount. The roof still needs repairs, whatever the weather.
  - address: "content:events/wend.yaml#events[id=the_reeve_at_ingathering].interaction.choices[id=take_it_whole].outcomes[id=taken_whole].text"
    of: 6a296786f4d161ea
    plainenglish: >-
      By spring, two families have left. Their holdings pass to people who can pay. By the house's
      own measures, this is the right result. People in Wick judge it differently.
  - address: "content:events/wend.yaml#events[id=the_wheel_stops].title"
    of: 4ba4a2d8bf798dfc
    plainenglish: >-
      The Mill Wheel Stops at Night
  - address: "content:events/wend.yaml#events[id=the_wheel_stops].body"
    of: ca62bf5e4d624832
    plainenglish: >-
      The mill wheel stops during the night. The missing noise wakes the household. It is February,
      and the water of the Wend makes a person's hands go numb almost immediately. Alder trees swept
      down from four miles upstream have blocked the millrace all at once. {HEAD} can send only the
      people the hall can spare. The reeve says Wick will run out of flour in two days. He has been
      wrong about such deadlines before, and his mistakes have cost the village.
  - address: "content:events/wend.yaml#events[id=the_wheel_stops].interaction.choices[id=they_clear_it].label"
    of: 734fd789e1493365
    plainenglish: >-
      They remove the blockage before dawn.
  - address: "content:events/wend.yaml#events[id=the_wheel_stops].interaction.choices[id=they_clear_it].outcomes[id=cleared].text"
    of: 58ccfa00088f65c4
    plainenglish: >-
      The wheel begins turning again shortly after four in the morning. Its noise keeps everyone at
      the hall awake for the rest of the night. Nobody complains.
  - address: "content:events/wend.yaml#events[id=the_wheel_stops].interaction.choices[id=they_clear_it_hard].label"
    of: f8df41cb00ed560f
    plainenglish: >-
      They clear the blockage, but someone is hurt.
  - address: "content:events/wend.yaml#events[id=the_wheel_stops].interaction.choices[id=they_clear_it_hard].outcomes[id=cleared_hard].text"
    of: 219b662baeb8ece7
    plainenglish: >-
      They eventually remove the alder. A hand is badly injured when a beam shifts. The beam had
      supported the whole tangle of wood, under far more pressure than anyone standing in the water
      had realised.
  - address: "content:events/wend.yaml#events[id=the_wheel_stops].interaction.choices[id=they_come_back_wet].label"
    of: 4bcb6fdfcced2b6b
    plainenglish: >-
      They return soaked, and the wheel remains stopped.
  - address: "content:events/wend.yaml#events[id=the_wheel_stops].interaction.choices[id=they_come_back_wet].outcomes[id=not_shifted].text"
    of: 6710db1e7e70d62a
    plainenglish: >-
      They work until daylight, then stand quietly in the yard with steam rising from their wet
      clothes. Wick must buy flour from Bramme for a month, at Bramme's prices. The village
      remembers the failure much longer than that.
  - address: "content:events/wend.yaml#events[id=the_boy_and_the_east_cellar].title"
    of: 0a5eda9d3e9e8371
    plainenglish: >-
      The Cellar Key on the Nail
  - address: "content:events/wend.yaml#events[id=the_boy_and_the_east_cellar].body"
    of: 2482eabc4fd4dbd0
    plainenglish: >-
      The family stores things it would rather not examine in the east cellar. The key hangs on a
      nail in the long room because nobody has ever thought to hide it. {CHILD} can reach the nail
      by standing on a bench. Nobody notices that the key is missing for two days. When someone
      finally looks, it is back on the nail, but hanging the wrong way round. A boot-width strip of
      dust is missing from the middle of the third step.
  - address: "content:events/wend.yaml#events[id=the_boy_and_the_east_cellar].interaction.outcomes[id=went_down].text"
    of: 23cdcabca910c710
    plainenglish: >-
      Nobody talks about what happened. In this house, remaining silent is a deliberate choice.
  - address: "content:events/wend.yaml#events[id=what_he_did_with_the_key].title"
    of: 0e0f842ac1ee38a6
    plainenglish: >-
      A Clerk Who Has All Day
  - address: "content:events/wend.yaml#events[id=what_he_did_with_the_key].body"
    of: 106a6b4471ebc5f8
    plainenglish: >-
      At Ingathering, a clerk comes to the gate with a wax tablet and a letter from the chapter
      house at Bramme. He wants a list of everything stored in the house's cellars. {CHILD} has not
      gone down those steps since childhood and has never mentioned the third room. Nobody else in
      the hall knows about it. The clerk is in no hurry. He says twice that he has all day.
  - address: "content:events/wend.yaml#events[id=what_he_did_with_the_key].absentBody"
    of: ecf8f66537e80a29
    plainenglish: >-
      At Ingathering, a clerk comes to the gate with a wax tablet and a letter from the chapter
      house at Bramme. He wants a list of everything stored in the house's cellars. The only person
      who ever went down to look died four years ago and told nobody what was there. The key still
      hangs on its nail the wrong way round. Nobody remembers it ever hanging differently. The clerk
      is in no hurry. He says twice that he has all day.
  - address: "content:events/wend.yaml#events[id=what_he_did_with_the_key].interaction.choices[id=give_him_the_short_list].label"
    of: 3536309ec7bf8d12
    plainenglish: >-
      Give him the shorter list normally given to the assessor.
  - address: "content:events/wend.yaml#events[id=what_he_did_with_the_key].interaction.choices[id=give_him_the_short_list].outcomes[id=short_list].text"
    of: b10f59a6a6528542
    plainenglish: >-
      The clerk copies the list and thanks the household. As he leaves through the yard, he asks
      another question. He had no reason to ask it before coming here, but he will remember the
      answer.
  - address: "content:events/wend.yaml#events[id=what_he_did_with_the_key].interaction.choices[id=walk_him_down].label"
    of: 77b64cf4c9df8770
    plainenglish: >-
      Take the clerk to the cellars and show him everything.
  - address: "content:events/wend.yaml#events[id=what_he_did_with_the_key].interaction.choices[id=walk_him_down].outcomes[id=shown].text"
    of: bb15c57cbac63e68
    plainenglish: >-
      The clerk stays downstairs longer than the family expected. When he returns, he says almost
      nothing. That worries the household more than anything he might have said. He says much more
      when he reaches Bramme, and the chapter house spreads what it hears.
  - address: "content:events/wend.yaml#events[id=what_he_did_with_the_key].record.subject"
    of: 5ab9d8f721de7783
    plainenglish: >-
      what is stored in the house's cellars
  - address: "content:events/wend.yaml#events[id=what_he_did_with_the_key].record.options.record.chronicle"
    of: 2b93d97f7b9934eb
    plainenglish: >-
      The chapter house asked what we keep in our cellars. There is a room beneath the east cellar
      that we have never included on any list given to anyone.
  - address: "content:events/wend.yaml#events[id=what_he_did_with_the_key].record.options.embellish.chronicle"
    of: 49862ea7fc5b1b7b
    plainenglish: >-
      We gave the chapter house a complete list of our cellars, just as we have done for the
      assessor for two hundred years.
