# THE LIBRARY, READ.
#
# The auction has always bought books. Nothing had ever read one: `gainSpellbook`
# was reachable only through a `spellbook` effect no content authored, so a run
# ended with sixty-odd volumes on the shelf, degrading, and `Person.spellsKnown`
# empty in every house that ever lived. Eleven spellbooks with `studyYears` on
# them, and the Scholar's `studySpeed`, all measuring a wait nobody was having.
#
# This is the door in. `op: study` spends the years first and delivers the
# knowledge after — see `people/library.ts` — so a book with `studyYears: 2`
# arrives two years later, and one year sooner than that for a Scholar.
events:
  - id: the_book_comes_down
    title: The Book Comes Down
    tier: family
    frequency: uncommon
    weight: 90
    repeatable: true
    tags: [library, study, mystic]
    purposes: [establish_magic_rule, worldbuild_through_action, change_relationship]
    conditions:
      all:
        - { generation: { op: gte, value: 2 } }
    slots:
      READER:
        role: family_member
        filters:
          - { age: { op: gte, value: 16 } }
          - { status: [alive] }
    body: >-
      The shelf in the north room is cold enough that the glue goes brittle, and
      nobody has moved the books in forty years because nobody has wanted one.
      {READER} wants one. It is the midwife's book, the one copied so many times
      the copies have their own errors, and it takes both hands to lift and a
      knife to get the pages apart. There is no ceremony to any of this. There is
      a boy on a stool with a cold candle, and a book, and the rest of his
      twenties.
    interaction:
      kind: choice
      choices:
        - id: read_it
          label: Let him take it upstairs and keep it as long as he needs.
          outcomes:
            - id: begun
              weight: 100
              text: >-
                He gets through it the slow way, which is the only way there is.
                The house does not notice for the first year and cannot stop
                noticing after the second, because he has started correcting the
                errors in the margins and the corrections are right.
              effects:
                - { kind: spellbook, op: study, target: { slot: READER }, book: lesser_workings_of_life }
                - { kind: respect, delta: 1 }
        - id: sell_it
          label: The shelf is worth money and the boy is worth a wage.
          outcomes:
            - id: sold
              weight: 100
              text: >-
                It goes for less than it cost, the way books do. He is found a
                place with a factor in the lower town and does well enough at it,
                and for the rest of his life he is careful never to say what he
                would have preferred.
              effects:
                - { kind: treasury, delta: 70 }
                - { kind: relationship, from: { slot: READER }, to: head, sentiment: -18 }

  - id: the_fair_copy
    title: Half a Year of Somebody's Life
    tier: family
    frequency: uncommon
    weight: 95
    repeatable: true
    tags: [library, study, records, mystic]
    purposes: [establish_magic_rule, buy_patience, plant_rumour]
    conditions:
      all:
        - { generation: { op: gte, value: 3 } }
    slots:
      HEAD: { role: head }
      COPYIST:
        role: family_member
        filters:
          - { age: { op: gte, value: 18 } }
          - { age: { op: lte, value: 40 } }
          - { status: [alive] }
    body: >-
      There is no press and there is not going to be one, so a second copy of
      anything costs half a year of a living person and there is no other price
      it can be bought at. {HEAD} wants the Life book copied, because one
      volume in one cellar is one fire away from four hundred years of nothing.
      {COPYIST} can rule a line and hold a hand steady for six hours, which is
      rarer than it sounds and is the entire qualification. Six hours a day
      from the Greening to the Ingathering. Nobody at Corran would call it
      practice and nobody at Corran is being asked.
    interaction:
      kind: choice
      choices:
        - id: copy_it_here
          label: Copy it here, in the long room, where anybody may see what is being copied.
          outcomes:
            - id: two_volumes
              weight: 100
              text: >-
                It takes seven months and comes out clean, and the house now
                owns the same book twice, in two cellars, which is the only
                insurance this world sells. The tenants have watched a
                gentleman's daughter write in a window for seven months. What
                they make of it is not something anybody in the long room
                thought to ask about beforehand.
              effects:
                - { kind: spellbook, op: gain, target: { slot: COPYIST }, book: lesser_workings_of_life }
                - { kind: attribute, target: { slot: COPYIST }, attr: mind, delta: 3 }
                - { kind: rumour, op: seed, id: rumour_the_window_in_the_long_room, accuracy: 0.4 }
        - id: send_it_to_bramme
          label: Send it to the chapter house at Bramme. They copy for coin and they are quick.
          outcomes:
            - id: came_back
              weight: 68
              text: >-
                Fourteen crowns and eleven weeks and it comes back handsome,
                bound better than the original, with a small clean note in the
                margin of the fourth quire in a hand nobody at Ardwen knows.
                The note is a correction. The correction is right.
              effects:
                - { kind: treasury, delta: -14 }
                - { kind: spellbook, op: gain, target: { slot: COPYIST }, book: lesser_workings_of_life }
                - { kind: flag, flag: bramme_copied_a_book, set: true }
            - id: read_before_returned
              weight: 32
              text: >-
                Fourteen crowns and eleven weeks and a handsome copy, and a
                letter with it, courteous, asking whether the house holds
                anything else of that kind and whether it might be seen. The
                letter does not say who wants to see it. It is the chapter
                house asking, and the chapter house never asks for itself.
              effects:
                - { kind: treasury, delta: -14 }
                - { kind: spellbook, op: gain, target: { slot: COPYIST }, book: lesser_workings_of_life }
                - { kind: rumour, op: seed, id: rumour_what_the_presses_hold, accuracy: 0.6 }
    rumour: { id: rumour_the_window_in_the_long_room, accuracy: 0.35, spread: 1 }

  - id: the_fourth_shelf
    title: The Fourth Shelf
    tier: individual
    frequency: uncommon
    weight: 100
    repeatable: true
    tags: [library, study, mystic, women]
    purposes: [change_relationship, establish_magic_rule, test_magic_rule]
    conditions:
      all:
        - { generation: { op: gte, value: 2 } }
        - { knowledge: knows_the_threshold_wall, has: false }
    slots:
      TUTOR: { role: tutor, filters: [{ status: [alive] }] }
      DAUGHTER:
        role: family_member
        filters:
          - { sex: female }
          - { age: { op: gte, value: 14 } }
          - { age: { op: lte, value: 26 } }
          - { status: [alive] }
    body: >-
      Four shelves in the north room and {DAUGHTER} has read three of them
      through twice. The fourth is Fluid, Thermal, Aero, Terra, and the four of
      them are shut to her the way the weather is shut to her: not by anybody's
      rule in this house, not by the Colleges, not by the Church, and not by
      anything a person could argue with or bribe. She has asked {TUTOR} why
      eleven times in four years. He has given her eleven answers, each one
      worse than the last, because he does not know either and neither does
      Corran and neither does anyone. What she is asking for this time is not
      the reason, which she has stopped expecting anybody in this house to
      have. She wants to try it in front of a witness.
    interaction:
      kind: choice
      choices:
        - id: let_her_try
          label: Let her try. In the yard, with the tutor watching, and nobody else.
          outcomes:
            - id: nothing_at_all
              weight: 100
              text: >-
                Nine hours across four days, the working done correctly every
                time, by a woman who has the Thermal book by heart and can
                recite the whole of it backward. Nothing happens. Not a failure
                and not a fault and not a spark going astray — nothing, the way
                nothing happens when you read a page of a language you do not
                have. She writes it all down and puts it on the third shelf.
                Two of her granddaughters read it before they ask.
              effects:
                - { kind: knowledge, op: grant, flag: knows_the_threshold_wall }
                - { kind: attribute, target: { slot: DAUGHTER }, attr: mind, delta: 2 }
                - { kind: relationship, from: { slot: DAUGHTER }, to: { slot: TUTOR }, sentiment: 12 }
        - id: forbid_it
          label: Forbid it. It costs nothing to try and everything if she is seen trying.
          outcomes:
            - id: obeyed
              weight: 55
              text: >-
                She obeys, which is worse than if she had not, because it means
                the house has now spent a daughter's whole appetite for asking
                on one afternoon and gets nothing back for it. The fourth shelf
                stays shut. Nobody in this family will find out why for another
                two hundred years, and then only by accident.
              effects:
                - { kind: relationship, from: { slot: DAUGHTER }, to: head, sentiment: -20 }
            - id: tried_anyway
              weight: 45
              text: >-
                She does it in the second cellar at night with a candle and no
                witness at all, which is the exact arrangement the prohibition
                was meant to prevent, and nothing happens there either. She
                tells nobody. The house keeps a rule it has never tested and
                will go on quoting it as though it had.
              effects:
                - { kind: relationship, from: { slot: DAUGHTER }, to: head, sentiment: -12 }

  - id: the_book_that_is_wrong
    title: The Book That Is Wrong
    tier: family
    frequency: uncommon
    weight: 90
    repeatable: true
    tags: [library, study, mystic, auction]
    purposes: [establish_magic_rule, test_magic_rule, worldbuild_through_action]
    conditions:
      all:
        - { generation: { op: gte, value: 4 } }
        - { knowledge: knows_a_book_can_be_wrong, has: false }
    slots:
      HEAD: { role: head }
      READER:
        role: family_member
        filters: [{ age: { op: gte, value: 20 } }, { status: [alive] }]
    body: >-
      It cost ninety crowns at Sarrow and it is Thermal and it is beautiful,
      and {READER} has been eleven months inside it and has got nothing out of
      it at all. That is not how a book fails. A book you cannot manage yet
      fails in a way that tells you where you are; this one is smooth all the
      way down and comes out the far end with nothing in your hands. On the
      ninth month he starts checking it against the Fluid book, line for line,
      where the two ought to agree. They do not agree anywhere. Somebody copied
      this from a copy of a copy made by a man who could not do the working and
      would not say so, and four generations of somebody else's family paid for
      that silence before this house did, at ninety crowns and beautifully
      bound. It is the best-made object in the house.
    interaction:
      kind: choice
      choices:
        - id: burn_it
          label: Burn it. A wrong book is worse than no book and it will outlive us.
          outcomes:
            - id: burned
              weight: 100
              text: >-
                Ninety crowns in the west grate on an ordinary Tuesday, with
                three people watching and the steward keeping his face still.
                What the house keeps is the eleven months of notes on why it is
                wrong, which is now the most useful thing in the north room and
                the only volume in it that no other house on earth owns.
              effects:
                - { kind: spellbook, op: lose, target: { slot: READER }, book: lesser_workings_of_thermal }
                - { kind: knowledge, op: grant, flag: knows_a_book_can_be_wrong }
                - { kind: attribute, target: { slot: READER }, attr: mind, delta: 4 }
        - id: sell_it_on
          label: Sell it on. Somebody at the next sale will want a beautiful Thermal book.
          outcomes:
            - id: sold_on
              weight: 100
              text: >-
                It goes for seventy at the next sale to a house that is pleased
                with itself about the price, and the house is down twenty
                crowns and up a debt it has not been billed for yet. The notes
                stay, and so does the name of the buyer, written in the margin
                of the notes in {HEAD}'s own hand with no explanation against
                it. Somebody meant that name to be found.
              effects:
                - { kind: treasury, delta: 70 }
                - { kind: spellbook, op: lose, target: { slot: READER }, book: lesser_workings_of_thermal }
                - { kind: knowledge, op: grant, flag: knows_a_book_can_be_wrong }
                - { kind: respect, delta: -1 }


  - id: the_bramme_margin_returns
    title: The Hand in the Fourth Quire
    tier: family
    frequency: uncommon
    weight: 95
    repeatable: false
    tags: [library, records, church, mystic]
    purposes: [plant_rumour, worldbuild_through_action]
    conditions:
      all:
        - { generation: { op: gte, value: 4 } }
        - { flag: bramme_copied_a_book, is: true }
    slots:
      HEAD: { role: head }
    body: >-
      A clerk from Bramme arrives with the fourth quire of the Life book opened
      beneath his thumb. He has brought no accusation. He asks whether the
      correction in the unknown hand has been tried. The chapter house kept a
      copy of that page, he says, and the man who wrote the note is dead. The
      clerk will take an answer back. He is careful not to ask for the book.
    interaction:
      kind: choice
      choices:
        - id: acknowledge_the_correction
          label: Admit that the correction is right, and let Bramme keep its page.
          outcomes:
            - id: bramme_knows
              weight: 100
              text: >-
                The clerk writes down the answer without looking up. Bramme
                now holds both the corrected page and the house's admission
                that the working succeeds. The chapter house does not need
                the whole book to know what sort of book it is.
              effects:
                - { kind: respect, delta: -2 }
                - { kind: rumour, op: seed, id: rumour_what_the_presses_hold, accuracy: 0.8 }
                - { kind: flag, flag: bramme_copied_a_book, set: false }
        - id: refuse_the_answer
          label: Say nothing about the working, and send the clerk away.
          outcomes:
            - id: silence_recorded
              weight: 100
              text: >-
                He writes down the refusal. The chapter house keeps the
                corrected page and now has a dated silence beside it. The
                family keeps its answer, but pays for the privilege of being
                remembered as unwilling to give one.
              effects:
                - { kind: respect, delta: -1 }
                - { kind: flag, flag: bramme_copied_a_book, set: false }

proseVariants:
  - address: "content:events/library.yaml#events[id=the_book_comes_down].title"
    of: fcc6e2a08ab0a994
    plainenglish: >-
      The Book Is Taken from the Shelf
  - address: "content:events/library.yaml#events[id=the_book_comes_down].body"
    of: e7363fe3ca6cef5f
    plainenglish: >-
      No one has moved the books in the north room for forty years. The room is so cold that the
      glue in their bindings has become brittle. Now {READER} wants the midwife's book. It has been
      copied so often that different copies contain different mistakes. It is heavy enough to need
      both hands, and some pages must be separated with a knife. There is no ceremony. A boy sits on
      a stool with a cold candle and begins reading a book that will take up the rest of his
      twenties.
  - address: "content:events/library.yaml#events[id=the_book_comes_down].interaction.choices[id=read_it].label"
    of: 3c18e3eec45b1d5a
    plainenglish: >-
      Let him take the book upstairs and study it for as long as he needs.
  - address: "content:events/library.yaml#events[id=the_book_comes_down].interaction.choices[id=read_it].outcomes[id=begun].text"
    of: 8a296c19d1e282c5
    plainenglish: >-
      He studies it slowly because there is no shortcut. During the first year, nobody in the house
      notices a difference. After the second, everyone can see it: he has begun correcting mistakes
      in the margins, and his corrections are right.
  - address: "content:events/library.yaml#events[id=the_book_comes_down].interaction.choices[id=sell_it].label"
    of: e5b3fb999f0c20f5
    plainenglish: >-
      Sell the books for money and find the boy paid work.
  - address: "content:events/library.yaml#events[id=the_book_comes_down].interaction.choices[id=sell_it].outcomes[id=sold].text"
    of: d7241102f7590cee
    plainenglish: >-
      The book sells for less than it originally cost. The boy takes a position with a factor in the
      lower town and does reasonably well. For the rest of his life, he avoids saying what he would
      rather have done.
  - address: "content:events/library.yaml#events[id=the_fair_copy].title"
    of: 2231e67599669f49
    plainenglish: >-
      Six Months of a Person's Life
  - address: "content:events/library.yaml#events[id=the_fair_copy].body"
    of: 9a21f0bbfcdb1c5f
    plainenglish: >-
      There are no printing presses, and there will not be any. Making a second copy of a book takes half a year of someone's work. {HEAD} wants the Life book copied. If the only volume burns in its cellar, four hundred years of knowledge could be lost. {COPYIST} can draw straight lines and write steadily for six hours. Those skills are rare, and they are all this job requires. The copying will take six hours each day, from the Greening to the Ingathering. Nobody at Corran would call it practice, but nobody has asked Corran.
  - address: "content:events/library.yaml#events[id=the_fair_copy].interaction.choices[id=copy_it_here].label"
    of: 0884f400f949192c
    plainenglish: >-
      Make the copy in the long room, where anyone can watch the work.
  - address: "content:events/library.yaml#events[id=the_fair_copy].interaction.choices[id=copy_it_here].outcomes[id=two_volumes].text"
    of: 5746767e08a236a2
    plainenglish: >-
      Seven months later, the copy is finished without errors. The house now has the same book in two different cellars, so one fire cannot destroy both copies. For all seven months, the tenants have watched a gentleman's daughter writing beside a window. Nobody in the long room thought to ask what the tenants might make of that.
  - address: "content:events/library.yaml#events[id=the_fair_copy].interaction.choices[id=send_it_to_bramme].label"
    of: 30b3cd7d36003ae1
    plainenglish: >-
      Pay the chapter house at Bramme to make the copy quickly.
  - address: "content:events/library.yaml#events[id=the_fair_copy].interaction.choices[id=send_it_to_bramme].outcomes[id=came_back].text"
    of: 75526dd665189fa2
    plainenglish: >-
      After eleven weeks and a payment of fourteen crowns, the copy arrives. Its binding is better than the original's. In the margin of the fourth quire is a small, neatly written note in handwriting nobody at Ardwen recognises. The note corrects an error. The correction is right.
  - address: "content:events/library.yaml#events[id=the_fair_copy].interaction.choices[id=send_it_to_bramme].outcomes[id=read_before_returned].text"
    of: cb6f14b7e60cd923
    plainenglish: >-
      After eleven weeks and a payment of fourteen crowns, the house receives a fine copy and a polite letter. The letter asks whether the house owns other books of this kind and whether someone could see them. It does not name the person who wants to see the books. The chapter house is asking on someone else's behalf; it never asks for itself.
  - address: "content:events/library.yaml#events[id=the_fourth_shelf].title"
    of: 85825470a7336e8c
    plainenglish: >-
      The Books on the Fourth Shelf
  - address: "content:events/library.yaml#events[id=the_fourth_shelf].body"
    of: 9d6d417dd797d751
    plainenglish: >-
      There are four shelves of books in the north room. {DAUGHTER} has read all the books on three of them twice. The fourth holds Fluid, Thermal, Aero and Terra books, but she cannot use any of those four kinds of magic. No family rule, College decree or Church law is stopping her. It is a limit that nobody can argue away or pay to remove. She has asked {TUTOR} why eleven times over four years. He has offered eleven explanations, none satisfactory, because he does not know. Neither does Corran, nor anyone else. She no longer expects an answer. Now she wants to attempt a working while someone watches.
  - address: "content:events/library.yaml#events[id=the_fourth_shelf].interaction.choices[id=let_her_try].label"
    of: 1977e71780c38cb3
    plainenglish: >-
      Allow her to try the working in the yard, with only her tutor watching.
  - address: "content:events/library.yaml#events[id=the_fourth_shelf].interaction.choices[id=let_her_try].outcomes[id=nothing_at_all].text"
    of: ea56d6a4ebe70058
    plainenglish: >-
      Over four days she spends nine hours performing the working correctly. She knows the Thermal book so well that she can recite it backward, yet nothing happens. There is no mistake or stray spark. The magic simply does not respond to her, like words in a language she cannot speak. She records every attempt and puts her account on the third shelf. Two of her granddaughters read it before they ask the same question.
  - address: "content:events/library.yaml#events[id=the_fourth_shelf].interaction.choices[id=forbid_it].label"
    of: 698a353ba6adc737
    plainenglish: >-
      Forbid the attempt. Trying costs nothing, but being seen could cost everything.
  - address: "content:events/library.yaml#events[id=the_fourth_shelf].interaction.choices[id=forbid_it].outcomes[id=obeyed].text"
    of: b05b982bb9fc3fff
    plainenglish: >-
      She obeys the order. In doing so, the house discourages her from asking questions, with nothing gained in return. She leaves the fourth shelf alone. The family will not discover why it is closed to her until an accident two hundred years later.
  - address: "content:events/library.yaml#events[id=the_fourth_shelf].interaction.choices[id=forbid_it].outcomes[id=tried_anyway].text"
    of: 7f2c09aa1289bffe
    plainenglish: >-
      She secretly attempts the working at night in the second cellar, using a candle and with nobody watching. This is exactly the kind of unwitnessed attempt the ban was meant to prevent. Nothing happens. She tells no one. The house keeps repeating a rule that, as far as anyone knows, has never been tested.
  - address: "content:events/library.yaml#events[id=the_book_that_is_wrong].title"
    of: e3e692fb56075b9f
    plainenglish: >-
      The Faulty Magic Book
  - address: "content:events/library.yaml#events[id=the_book_that_is_wrong].body"
    of: 7582b397fc837253
    plainenglish: >-
      The beautiful Thermal book cost ninety crowns at Sarrow. {READER} has studied it for eleven months without learning anything. Even a difficult book normally shows a student where he is going wrong, but this one offers no clues. In the ninth month he starts comparing it line by line with the Fluid book, where the instructions ought to agree. They disagree everywhere. The Thermal book was copied repeatedly from a version written by a man who could not perform the working and refused to admit it. Four generations of another family suffered from his silence before this house bought the book for ninety crowns. Despite being useless, it is the finest-made object in the house.
  - address: "content:events/library.yaml#events[id=the_book_that_is_wrong].interaction.choices[id=burn_it].label"
    of: fea1c0c975b8b8dd
    plainenglish: >-
      Burn the false book. Its mistakes could mislead people long after we are gone.
  - address: "content:events/library.yaml#events[id=the_book_that_is_wrong].interaction.choices[id=burn_it].outcomes[id=burned].text"
    of: e3f645dda22e9191
    plainenglish: >-
      On an ordinary Tuesday, the house burns a book worth ninety crowns in the west grate. Three people watch while the steward keeps his expression still. They retain the notes from eleven months of study explaining why the book is wrong. Those notes have become the most useful volume in the north room, and no other house owns a copy.
  - address: "content:events/library.yaml#events[id=the_book_that_is_wrong].interaction.choices[id=sell_it_on].label"
    of: b5f76cb1b6962635
    plainenglish: >-
      Sell it at the next auction. Someone will pay for a beautiful Thermal book.
  - address: "content:events/library.yaml#events[id=the_book_that_is_wrong].interaction.choices[id=sell_it_on].outcomes[id=sold_on].text"
    of: 4a321fef95b51b23
    plainenglish: >-
      At the next sale, another house buys the book for seventy crowns, pleased with the price. This house loses twenty crowns and passes on a danger whose cost has not yet come due. It keeps the notes explaining the errors. The notes also contain the buyer's name, written in the margin by {HEAD} without explanation. Somebody intended that name to be found.
