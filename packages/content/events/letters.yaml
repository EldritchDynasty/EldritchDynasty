# NEWS, AND HOW SLOWLY IT MOVES.
#
# COMMON. A rider does twenty-five miles a day, the post relay sixty, a loaded
# cart twelve. Caster is nine days by cart and three by relay. Corran is six
# weeks. Nothing in this world is ever faster than that across a Long Line,
# and §6 exists because the commonest consistency failure in a generational
# game is information arriving too soon.
#
# So every scene here is really about the gap: what a house does in the eleven
# months before an answer can possibly arrive, and what it commits to in
# writing knowing the other party will read it in a different year with
# different facts. The drovers carry the fact and the Wayfolk carry the song,
# and the song is always first.
events:
  - id: the_letter_that_crossed
    title: They Crossed on the Road
    tier: head
    frequency: common
    weight: 75
    tags: [records, roads, kin, law]
    purposes: [buy_patience, force_record_choice, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      The first seal cracks under the keeper's thumb. A letter proposing terms
      went to Cawdry in the first tenday of Frostfall, and one proposing
      different terms came back in the second, the two crossing near Ockleigh.
      The dates are four days apart. The house can withdraw its own offer and
      enter both letters in the register. It can also seal a declaration that
      no answering letter reached the hall, leaving its earlier offer to
      stand alone. The keeper has kept both covers.
    interaction:
      kind: choice
      choices:
        - id: take_theirs_as_first
          label: Withdraw ours. Enter both letters in the register.
          outcomes:
            - id: theirs_first
              weight: 100
              text: >-
                The household hears the withdrawal read out before both covers
                are sewn into the register. The keeper strikes through the old
                claim that no answering letter reached the house, and the new
                receipt is copied below it. The steward folds our draft.
              effects:
                - { kind: discrepancy, op: bury, id: the_received_letter_denied }
                - { kind: relationship, from: household, to: head, sentiment: -4 }
        - id: insist_on_ours
          label: Register ours alone. Certify that no answer arrived.
          outcomes:
            - id: ours_first
              weight: 100
              text: >-
                The entry gives the house a single, unanswered offer under its
                own earlier date. When a copy goes to Cawdry in the next post,
                the other cover is still threaded beside it. Both dates can
                be read.
              effects:
                # #1810: borrowed standing against a specific, recoverable
                # false receipt. A later honest entry can answer this claim.
                - { kind: discrepancy, op: create, id: the_received_letter_denied, severity: minor, provableBy: [the_church] }
                - { kind: respect, delta: 1 }
                - { kind: chronicle, text: "The house certified that no answering letter from Cawdry had reached it, and registered only its own offer." }

  - id: the_post_relay_will_take_it
    title: Sixty Miles a Day, and What It Costs
    tier: head
    frequency: common
    weight: 70
    tags: [roads, money, records, law]
    purposes: [buy_patience, change_standing, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      The post relay is the Crown's and the Church's and does sixty miles a
      day on fresh horses at stages, which is the fastest thing in this world,
      and it will carry a private letter for four marks if the postmaster at
      Bramme feels like it. An ordinary rider is nine days to Caster and costs
      nothing but a horse. The matter in hand is worth about thirty crowns and
      will be decided at Caster in about a fortnight.
    interaction:
      kind: choice
      choices:
        - id: pay_the_relay
          label: Four marks. Three days instead of nine.
          outcomes:
            - id: relayed
              weight: 100
              text: >-
                Four marks, three days, and a letter that is on the right table
                before the matter is decided rather than four days after, which
                is the whole of what speed is for in this world. The
                postmaster at Bramme now knows this family will pay for speed.
                So, within the year, does everybody the postmaster drinks with.
              effects:
                - { kind: treasury, delta: 26 }
                - { kind: rumour, op: seed, id: rumour_who_pays_for_the_relay, accuracy: 0.4 }
        - id: send_a_rider
          label: Send our own man. Nine days is what nine days is.
          outcomes:
            - id: nine_days
              weight: 62
              text: >-
                Nine days each way and a groom who is glad of the trip, and a
                letter that arrives in good time because the matter at Caster
                takes four tendays rather than two, as matters at Caster
                generally do. The house saves four marks and learns nothing it
                did not know.
              effects:
                - { kind: treasury, delta: 30 }
            - id: four_days_late
              weight: 38
              text: >-
                Nine days, and the matter was decided on the eleventh, and this
                family's position is a letter in a clerk's tray under a
                decision that has already been taken. Nobody is at fault.
                Nothing can be done. That is what distance is and this house
                has just paid thirty crowns to be reminded.
              effects:
                - { kind: treasury, delta: -30 }

  - id: the_wayfolk_have_it_first
    title: The Song Is Here Before the Fact
    tier: family
    frequency: common
    weight: 80
    tags: [folklore, roads, wayfolk, standing]
    purposes: [change_standing, plant_rumour, worldbuild_through_action]
    conditions: { not: { flag: the_song_arc_started, is: true } }
    slots:
      HEAD: { role: head }
    body: >-
      A troupe comes through in Highsun with a stave about a house four
      counties east that lost its seat, and it is a good song and it is sung
      twice in the hall and once at the alehouse. The drovers arrive nine days
      later with the fact, which is that the house lost a lawsuit and not a
      seat and that nobody died. The song has already been learned by four
      people at Wick. The correction has been heard by the steward.
    interaction:
      kind: choice
      choices:
        - id: pay_them_to_get_it_right
          label: Pay the troupe to carry the corrected version on.
          outcomes:
            - id: corrected_version
              weight: 100
              text: >-
                Two crowns and an evening, and a troupe that is professionally
                delighted to be given a better verse and carries it as far as
                Sarrow. Treated well, the Wayfolk sing your version for a
                century. The house has just discovered the cheapest instrument
                in this world and has no idea yet what it has found.
              effects:
                - { kind: treasury, delta: -2 }
                - { kind: respect, delta: 1 }
                - { kind: flag, flag: the_song_arc_started, set: true }
                - { kind: arc, op: start, arc: arc_the_song_we_taught_them }
        - id: let_the_song_stand
          label: Let it stand. It is not our house in the song.
          outcomes:
            - id: song_stands
              weight: 100
              text: >-
                It is not this house in the song, this year, and the song goes
                west with the names getting vaguer at every telling, and in
                about forty years it comes back through this parish with a
                different house in it. Nobody at Ardwen recognises it. Two
                people at Wick do.
              effects:
                - { kind: rumour, op: seed, id: rumour_the_stave_that_came_back, accuracy: 0.3 }

  - id: the_letter_nobody_answered
    title: Eleven Months, and Then Nothing
    tier: head
    frequency: common
    weight: 70
    tags: [records, kin, foreign, hardship]
    purposes: [advance_clause, buy_patience, force_record_choice]
    slots:
      HEAD: { role: head }
    body: >-
      A letter went south eleven months ago on a matter of some substance and
      there has been no answer, and eleven months is exactly long enough that
      silence means nothing at all: it may be lost, he may be dead, the ship
      may not have gone. There is no way to distinguish those and no way there
      will ever be. Writing again costs nine crowns and restarts a clock.
      Doing nothing means the matter is closed by default in about two years.
    interaction:
      kind: choice
      choices:
        - id: write_again
          label: Write again, and copy the first letter into the second.
          outcomes:
            - id: written_again
              weight: 100
              text: >-
                Nine crowns, and a second letter that quotes the first entire
                so that whichever arrives, the whole of the position arrives
                with it, which is a trick this house learns here and uses for
                four hundred years. One of them gets there. Nobody ever
                establishes which.
              effects:
                - { kind: treasury, delta: -9 }
        - id: let_it_close
          label: Let it close. Two years of silence is an answer.
          outcomes:
            - id: closed
              weight: 100
              tags: [self_expression]
              text: >-
                The matter lapses, which costs this family a thing it will
                never be able to price because it never finds out what was in
                the reply that was or was not written. In 1290 a bundle of
                letters is found at Sarrow in a factor's effects. One of them
                is addressed here.

  - id: news_of_a_death_arrives_late
    title: He Has Been Dead Four Months
    tier: family
    frequency: common
    weight: 75
    tags: [death, kin, roads, custom]
    purposes: [buy_patience, change_relationship, establish_magic_rule]
    slots:
      HEAD: { role: head }
      KIN:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 16 } }]
    body: >-
      A cousin who went east died in the second tenday of Slaughter and the
      letter arrives in Greening, which means this household has kept a
      Slaughter feast, a set of Hollow Days and a Thaw with a man's place
      still counted at the board. The eleven days of grey are for the eleven
      days after a death. Nobody has ever ruled on what they are for four
      months after, because the question does not come up in a parish where
      everybody dies within a mile.
    interaction:
      kind: choice
      choices:
        - id: keep_them_now
          label: Keep the eleven days now. The custom is for the household, not the corpse.
          outcomes:
            - id: kept_now
              weight: 100
              text: >-
                Undyed wool in Greening, four months out of time, and a
                household that does the work and says the words and finds it
                does help, which surprises everybody including the people who
                proposed it. The keeper at Wick has no objection and no
                precedent and enters it without either.
              effects:
                - { kind: relationship, from: { slot: KIN }, to: head, sentiment: 10 }
                - { kind: respect, delta: 1 }
        - id: let_it_pass
          label: Let it pass. Four months is four months.
          outcomes:
            - id: passed
              weight: 100
              text: >-
                No grey and no gap at the board, because the gap was filled at
                Slaughter by somebody who did not know what they were doing,
                and a family that has no moment at which it stopped. It comes
                back in about six years, at another funeral, all at once, out
                of somebody who had not seemed to mind.
              effects:
                - { kind: relationship, from: { slot: KIN }, to: head, sentiment: -12 }

  - id: the_tinker_and_the_third_price
    title: Pots, Small Goods, and Worse News
    tier: family
    frequency: common
    weight: 75
    tags: [roads, folklore, trade, tinkers]
    purposes: [change_relationship, plant_rumour, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      One traveller, one mule, and a trade that runs on three prices: what a
      thing costs, what a mending costs, and what he will take to tell you
      what he heard four parishes back. The third price is the one his trade
      actually lives on. He is at the gate with a pot to mend and something he
      is visibly waiting to be asked about, and the steward has already
      decided not to ask.
    interaction:
      kind: choice
      choices:
        - id: pay_the_third_price
          label: Pay the third price. Four mites and hear it.
          outcomes:
            - id: heard_it
              weight: 62
              text: >-
                Four mites and a quarter of an hour, and about a third of it is
                worth having: who has died, who is selling, and which road has
                men on it. He is careful with facts because a tinker who is
                wrong twice is a tinker who eats badly. He also now knows
                exactly what this house pays to know things.
              effects:
                - { kind: treasury, delta: -1 }
            - id: it_is_about_us
              weight: 38
              text: >-
                Four mites, and what he has carried four parishes is about this
                family, and he tells it exactly as he heard it while watching
                the Head's face with a professional interest that nobody in
                this yard misses. It is not accurate. It is not far off
                either, and he can say where he had it.
              effects:
                - { kind: treasury, delta: -1 }
                - { kind: rumour, op: seed, id: rumour_what_the_tinker_was_carrying, accuracy: 0.5 }
        - id: mend_the_pot_only
          label: The pot only. This house does not buy talk.
          outcomes:
            - id: pot_only
              weight: 100
              text: >-
                The pot is mended for two mites and he goes on down the road
                with whatever it was, and sells it at Ockleigh instead for
                four, and Ockleigh gets a fortnight's advantage on something
                that this house finds out about in Slaughter. It is almost
                never important. It is important about once a generation.
              effects:
                - { kind: treasury, delta: -1 }
                - { kind: respect, delta: -1 }

  - id: the_letter_read_aloud
    title: Who Is in the Room When It Is Opened
    tier: head
    frequency: common
    weight: 70
    tags: [records, secrecy, household, kin]
    purposes: [establish_magic_rule, force_record_choice, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      Letters are read aloud in this house because that is how a household
      that mostly cannot read consumes a letter, and it has been that way
      since the founding, and it is one of the four or five habits that make
      this family's business the household's business. This one is from
      Cawdry and the seal has not been broken. The long room has eleven people
      in it and the fire is lit and it is the natural place to open it.
    interaction:
      kind: choice
      choices:
        - id: open_it_in_the_long_room
          label: Open it here. It has been done here for two hundred years.
          outcomes:
            - id: read_aloud
              weight: 100
              text: >-
                Read aloud to eleven people, of whom nine are servants, which
                is the custom and which nobody has ever objected to including
                the letters' senders. It is a matter of a boundary. It is
                entirely dull. The habit survives, unexamined, until the year
                a letter arrives that is not dull, and then it is a habit
                nobody can suddenly break without saying why.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: 5 }
        - id: take_it_to_the_press
          label: Take it away and read it alone.
          outcomes:
            - id: read_alone
              weight: 100
              text: >-
                It is carried out of a warm room full of people who were
                expecting to hear it, which has not happened in living memory
                and is noticed by every one of them within about four seconds.
                It is a matter of a boundary. The precedent is what has been
                set, and it is set permanently, and it cost nothing to set and
                cannot be unset.
              effects:
                - { kind: rumour, op: seed, id: rumour_the_letter_that_was_not_read_out, accuracy: 0.5 }
                - { kind: relationship, from: household, to: head, sentiment: -8 }

  - id: the_drovers_bring_the_price
    title: The Drovers Carry the Fact
    tier: head
    frequency: common
    weight: 75
    tags: [roads, money, trade, drovers]
    purposes: [change_standing, force_record_choice, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      The drovers move cattle two hundred miles at ten a day along the green
      roads, the same families on the same routes for generations, and they
      carry coin, notes of hand and the only reliable prices anybody in this
      province ever hears. This year's man says the southern wool price is
      breaking and says it four tendays before the factors come up. He has no
      reason to lie and he has been wrong once in nineteen years.
    interaction:
      kind: choice
      choices:
        - id: sell_early_on_his_word
          label: Sell the clip early, at Bramme, on his word.
          outcomes:
            - id: he_was_right
              weight: 68
              text: >-
                The clip goes four tendays early at a price that looks poor and
                is, by Haying, twenty-two crowns better than what the factors
                offer at the gate. He is given a crown at Ingathering that he
                did not ask for and does not refuse. He tells this house
                everything he hears for the next eleven years.
              effects:
                - { kind: treasury, delta: 22 }
            - id: he_was_wrong
              weight: 32
              text: >-
                The price holds and the early sale costs eleven crowns, and the
                drover is mortified in a way that a man who has been right for
                nineteen years is entitled to be. He is not blamed. He does
                not carry a price to this house again for four years, out of
                shame rather than resentment.
              effects:
                - { kind: treasury, delta: -11 }
        - id: wait_for_the_factors
          label: Wait for the factors. They set the price and they always have.
          outcomes:
            - id: waited_for_them
              weight: 100
              text: >-
                The factors come up in Haying and price the clip as the
                factors price a clip, which is the number they were always
                going to say, and the drover's warning turns out to have been
                worth exactly what this house paid for it. There is no way to
                know, then or afterwards, what the other road was worth.
              effects:
                - { kind: treasury, delta: 4 }

  - id: nobody_owns_a_clock
    title: Nobody Here Owns a Clock
    tier: family
    frequency: common
    weight: 65
    tags: [custom, town, records, knowledge]
    purposes: [establish_magic_rule, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      KIN:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 14 } }]
    body: >-
      Hours are told by bells in towns and by the sun everywhere else, and
      there are tower clocks at Caster, Sarrow and Corran that people go to
      look at as an outing. {KIN} has come back from Bramme with the idea that
      the house should know what hour it is, and has begun keeping a mark on
      the long room wall against the sun through a particular gap in the
      shutter. It is not a clock. It is, after four months, more accurate than
      the bells at Bramme.
    interaction:
      kind: narration
      outcomes:
        - id: the_marks_on_the_wall
          weight: 62
          text: >-
            The marks stay on the wall and are added to for eleven years and
            are limewashed over in 1211 by a maid who has never been told what
            they are, and nobody in this house ever mentions them again or
            works out that the thing that was lost took eleven years to make.
          effects:
            - { kind: relationship, from: { slot: KIN }, to: head, sentiment: -6 }
        - id: somebody_notices
          weight: 38
          text: >-
            A guest out of Cawdry notices the marks, works out what they are in
            about a minute, and is impressed in a way that visibly costs him
            something, and mentions it at three tables that winter. A house in
            the Nethering that keeps the hour is a small strange fact and it
            travels well.
          effects:
            - { kind: respect, delta: 1 }
            - { kind: rumour, op: seed, id: rumour_the_marks_on_the_long_room_wall, accuracy: 0.4 }

  - id: the_rumour_arrives_before_the_rider
    title: It Is at Wick Before It Is at the Hall
    tier: head
    frequency: common
    weight: 75
    tags: [folklore, tenants, standing, roads]
    purposes: [change_relationship, change_standing, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      Something has happened to this family at Cawdry and the alehouse at Wick
      knows a version of it a full day before the rider gets up the hill, which
      is not remarkable and is how news has always moved. What is remarkable is
      that the reeve comes up to tell the Head what Wick is saying, unasked,
      before the rider arrives. He has never done that before. He is plainly
      not sure whether he should be doing it now.
    interaction:
      kind: choice
      choices:
        - id: thank_him_and_ask_for_more
          label: Thank him, and ask him to do it again whenever it happens.
          outcomes:
            - id: an_arrangement
              weight: 100
              text: >-
                An arrangement made in a yard in four sentences, never written
                down and never named, under which this house hears what its own
                parish is saying about it for the next thirty years. It costs
                nothing. It is the best thing that happens to this family that
                decade and it happens because a reeve was uncertain and came up
                a hill anyway.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: 12 }
        - id: tell_him_it_is_not_his_business
          label: Tell him, kindly, that the hall's business is the hall's.
          outcomes:
            - id: not_his_business
              weight: 100
              text: >-
                Kindly, briefly, and with every intention of sparing him an
                awkward duty, and he takes it exactly as it is meant and never
                comes up that hill about anything again. Wick goes on knowing
                first. This house goes back to hearing last, which is where it
                has always been and where it now stays.
              effects:
                - { kind: relationship, from: household, to: head, sentiment: -8 }
                - { kind: rumour, op: seed, id: rumour_what_wick_knew_first, accuracy: 0.45 }

# Plain English counterparts for common letter, news, and travel scenes (#1178).
proseVariants:
  - address: "content:events/letters.yaml#events[id=the_letter_that_crossed].title"
    of: 92dbd38a733c1a56
    plainenglish: >-
      Two Letters Cross on the Road
  - address: "content:events/letters.yaml#events[id=the_letter_that_crossed].body"
    of: "f57dfa6e057e3262"
    plainenglish: >-
      The keeper breaks the first seal. The house sent terms to Cawdry, but a letter
      proposing different terms crossed it on the road. The dates are four days apart. The
      house could withdraw its offer and record both letters. It could instead certify that
      no answering letter arrived, so its own offer would appear to stand alone. The keeper
      still has both envelopes.
  - address: "content:events/letters.yaml#events[id=the_letter_that_crossed].interaction.choices[id=take_theirs_as_first].label"
    of: "87d2200dd87e5a31"
    plainenglish: "Withdraw the house offer and record both letters."
  - address: "content:events/letters.yaml#events[id=the_letter_that_crossed].interaction.choices[id=take_theirs_as_first].outcomes[id=theirs_first].text"
    of: "6580bfa77752dbcb"
    plainenglish: >-
      The household hears its offer withdrawn. Both envelopes are sewn into the register,
      and the keeper crosses out the claim that no answer arrived. The new receipt is
      entered below it. The steward folds the old draft.
  - address: "content:events/letters.yaml#events[id=the_letter_that_crossed].interaction.choices[id=insist_on_ours].label"
    of: "59b4909939e09525"
    plainenglish: "Record only the house offer and certify that no answer arrived."
  - address: "content:events/letters.yaml#events[id=the_letter_that_crossed].interaction.choices[id=insist_on_ours].outcomes[id=ours_first].text"
    of: "5c8c14cd5aa22d29"
    plainenglish: >-
      The register shows only the house offer, under its earlier date, as though no answer
      arrived. A copy is sent to Cawdry, but both envelopes are still kept together. Both
      dates remain readable.
  - address: "content:events/letters.yaml#events[id=the_post_relay_will_take_it].title"
    of: 51c55b71e38f9ded
    plainenglish: >-
      Paying for Faster Mail
  - address: "content:events/letters.yaml#events[id=the_post_relay_will_take_it].body"
    of: 25dcad30d5fdffc4
    plainenglish: >-
      The Crown and Church's post relay changes horses at each stage and travels sixty miles
      a day, faster than any other service. At Bramme, the postmaster may carry a private
      letter for four marks. An ordinary rider takes nine days to reach Caster and only
      costs the use of a horse. A matter worth about thirty crowns will be decided at Caster
      in roughly two weeks.
  - address: "content:events/letters.yaml#events[id=the_post_relay_will_take_it].interaction.choices[id=pay_the_relay].label"
    of: 707fdf57dcd8182b
    plainenglish: >-
      Pay four marks for the relay. The letter will arrive in three days, not nine.
  - address: "content:events/letters.yaml#events[id=the_post_relay_will_take_it].interaction.choices[id=pay_the_relay].outcomes[id=relayed].text"
    of: fc99e33c7d3dd780
    plainenglish: >-
      The house pays four marks and its letter reaches Caster in three days, before the
      decision. Without the relay it would have arrived four days too late. The postmaster
      at Bramme learns that the family pays for fast messages. Within a year, everyone he
      drinks with knows it too.
  - address: "content:events/letters.yaml#events[id=the_post_relay_will_take_it].interaction.choices[id=send_a_rider].label"
    of: 09aeb9e1cabd604d
    plainenglish: >-
      Send our own rider. The journey takes nine days.
  - address: "content:events/letters.yaml#events[id=the_post_relay_will_take_it].interaction.choices[id=send_a_rider].outcomes[id=nine_days].text"
    of: be6d62c816892d74
    plainenglish: >-
      The rider takes nine days each way and enjoys the journey. The decision at Caster is
      delayed from two ten-day periods to four, so the letter arrives in time. The house
      saves four marks and learns nothing new.
  - address: "content:events/letters.yaml#events[id=the_post_relay_will_take_it].interaction.choices[id=send_a_rider].outcomes[id=four_days_late].text"
    of: a6b902f72610d34b
    plainenglish: >-
      The rider takes nine days, but the decision is made on day eleven. The family's letter
      arrives after the decision and cannot change it. Nobody made a mistake. The house
      loses thirty crowns because of the distance.
  - address: "content:events/letters.yaml#events[id=the_wayfolk_have_it_first].title"
    of: ebc4273d871e9119
    plainenglish: >-
      A Song Spreads Before the News
  - address: "content:events/letters.yaml#events[id=the_wayfolk_have_it_first].body"
    of: dbd34e642f641988
    plainenglish: >-
      In Highsun, a travelling troupe sings a song about a house four counties east
      supposedly losing its seat. The song is performed twice in the hall and once at the
      alehouse. Nine days later, drovers bring the real news: that house lost a lawsuit, not
      its seat, and no one died. Four people at Wick have already learned the wrong song.
      Only the steward has heard the correction.
  - address: "content:events/letters.yaml#events[id=the_wayfolk_have_it_first].interaction.choices[id=pay_them_to_get_it_right].label"
    of: a6fa0dcada5907a6
    plainenglish: >-
      Pay the troupe to spread the corrected song.
  - address: "content:events/letters.yaml#events[id=the_wayfolk_have_it_first].interaction.choices[id=pay_them_to_get_it_right].outcomes[id=corrected_version].text"
    of: 5283ec2c14273788
    plainenglish: >-
      The house pays two crowns and spends an evening helping the troupe make a corrected
      verse. The troupe likes the change and carries it as far as Sarrow. When treated well,
      the Wayfolk may sing a house's version for a century. The family has found an
      inexpensive way to influence a story, though it does not yet realise how useful it
      could be.
  - address: "content:events/letters.yaml#events[id=the_wayfolk_have_it_first].interaction.choices[id=let_the_song_stand].label"
    of: 511e2110eb167734
    plainenglish: >-
      Leave the song alone. It is about another house.
  - address: "content:events/letters.yaml#events[id=the_wayfolk_have_it_first].interaction.choices[id=let_the_song_stand].outcomes[id=song_stands].text"
    of: a54e7e0e7ddd3ff2
    plainenglish: >-
      The song travels west, and the names become less clear as people repeat it. Around
      forty years later, it returns to this parish with a different house named in it.
      Nobody at Ardwen recognises it. Two people at Wick do.
  - address: "content:events/letters.yaml#events[id=the_letter_nobody_answered].title"
    of: 101026deafd58a02
    plainenglish: >-
      Eleven Months Without an Answer
  - address: "content:events/letters.yaml#events[id=the_letter_nobody_answered].body"
    of: a91eea239ff0aebf
    plainenglish: >-
      The house sent an important letter south eleven months ago and has received no answer.
      The letter may have been lost, its recipient may have died, or a ship may never have
      sailed. There is no way to know. Writing again costs nine crowns and begins another
      wait. If the house does nothing, the matter will close automatically in about two
      years.
  - address: "content:events/letters.yaml#events[id=the_letter_nobody_answered].interaction.choices[id=write_again].label"
    of: e74b263430edee60
    plainenglish: >-
      Send another letter and include a copy of the first.
  - address: "content:events/letters.yaml#events[id=the_letter_nobody_answered].interaction.choices[id=write_again].outcomes[id=written_again].text"
    of: f3f75b00bed73e64
    plainenglish: >-
      The second letter costs nine crowns and repeats the first letter in full. This means
      either letter can explain the house's entire position when it arrives. The family uses
      this method for the next four hundred years. One letter gets through, but nobody ever
      finds out which.
  - address: "content:events/letters.yaml#events[id=the_letter_nobody_answered].interaction.choices[id=let_it_close].label"
    of: aafceda00f15010c
    plainenglish: >-
      Do not send another letter. Let the matter close after two years.
  - address: "content:events/letters.yaml#events[id=the_letter_nobody_answered].interaction.choices[id=let_it_close].outcomes[id=closed].text"
    of: 8685e1b58aae04e1
    plainenglish: >-
      The matter expires, and the family never learns what a reply might have said or what
      the missed answer cost. In 1290, a bundle of letters is discovered among a factor's
      belongings at Sarrow. One of those letters is addressed to this house.
  - address: "content:events/letters.yaml#events[id=news_of_a_death_arrives_late].title"
    of: eb94309d4015c0a1
    plainenglish: >-
      News of a Death Arrives Four Months Late
  - address: "content:events/letters.yaml#events[id=news_of_a_death_arrives_late].body"
    of: be28371780adbd1b
    plainenglish: >-
      A cousin living in the east died in the second ten days of Slaughter, but the news
      reaches the house in Greening, four months later. The family has held a Slaughter
      feast, the Hollow Days and Thaw while still counting his place at the table. Custom
      calls for eleven days of grey mourning after death. Nobody knows whether those days
      should still be observed four months later, because most families here hear about a
      death nearby.
  - address: "content:events/letters.yaml#events[id=news_of_a_death_arrives_late].interaction.choices[id=keep_them_now].label"
    of: 79ee341c8bf9c140
    plainenglish: >-
      Observe the eleven days now. Mourning is for the family.
  - address: "content:events/letters.yaml#events[id=news_of_a_death_arrives_late].interaction.choices[id=keep_them_now].outcomes[id=kept_now].text"
    of: b63bc4e6e88b6292
    plainenglish: >-
      The household wears undyed wool for eleven days in Greening, four months after the
      death. The family performs the mourning customs and finds they help, to everyone's
      surprise. The keeper at Wick knows of no rule or precedent against it and records the
      observance.
  - address: "content:events/letters.yaml#events[id=news_of_a_death_arrives_late].interaction.choices[id=let_it_pass].label"
    of: 82ab28aa9836a40e
    plainenglish: >-
      Do not hold another mourning period. Four months have passed.
  - address: "content:events/letters.yaml#events[id=news_of_a_death_arrives_late].interaction.choices[id=let_it_pass].outcomes[id=passed].text"
    of: 912412ebed01ee67
    plainenglish: >-
      The household does not wear grey or leave an empty place at the table. Someone filled
      the cousin's place at Slaughter without knowing he was dead, so the family has never
      marked his departure. About six years later, grief appears suddenly at another funeral
      in someone who had seemed unaffected.
  - address: "content:events/letters.yaml#events[id=the_tinker_and_the_third_price].title"
    of: 54daafa64fb9854a
    plainenglish: >-
      A Tinker Who Sells News
  - address: "content:events/letters.yaml#events[id=the_tinker_and_the_third_price].body"
    of: 4c8cce9ddeece439
    plainenglish: >-
      A travelling tinker arrives at the gate with one mule and a pot to repair. He charges
      for goods, for repairs, and for telling news he heard four parishes away. The third
      fee is the main source of his livelihood. He clearly has something to tell, but the
      steward has decided not to ask for it.
  - address: "content:events/letters.yaml#events[id=the_tinker_and_the_third_price].interaction.choices[id=pay_the_third_price].label"
    of: ce94e7c07260a8fc
    plainenglish: >-
      Pay four mites to hear his news.
  - address: "content:events/letters.yaml#events[id=the_tinker_and_the_third_price].interaction.choices[id=pay_the_third_price].outcomes[id=heard_it].text"
    of: 678105448c392260
    plainenglish: >-
      The house pays four mites and listens for fifteen minutes. About a third of the news
      is useful: who has died, who is selling, and which roads have dangerous men on them.
      The tinker tries to be accurate because repeated false news would cost him customers.
      He now also knows how much this house will pay for information.
  - address: "content:events/letters.yaml#events[id=the_tinker_and_the_third_price].interaction.choices[id=pay_the_third_price].outcomes[id=it_is_about_us].text"
    of: 15bbef53b06ded37
    plainenglish: >-
      The house pays four mites and learns that the tinker has heard a story about this
      family four parishes away. He repeats it exactly while carefully watching the Head's
      reaction. The story is not accurate, but it is close to the truth. He can name where
      he heard it.
  - address: "content:events/letters.yaml#events[id=the_tinker_and_the_third_price].interaction.choices[id=mend_the_pot_only].label"
    of: d49feeef5be3c61b
    plainenglish: >-
      Pay only to repair the pot. We will not buy rumours.
  - address: "content:events/letters.yaml#events[id=the_tinker_and_the_third_price].interaction.choices[id=mend_the_pot_only].outcomes[id=pot_only].text"
    of: 8ab9cacff67421db
    plainenglish: >-
      The tinker repairs the pot for two mites, then sells his news at Ockleigh for four.
      Ockleigh learns something about two weeks before this house does, which is not until
      Slaughter. Usually that delay does not matter, but about once a generation it does.
  - address: "content:events/letters.yaml#events[id=the_letter_read_aloud].title"
    of: d2402e229b37387e
    plainenglish: >-
      Who Hears a Letter Read Aloud?
  - address: "content:events/letters.yaml#events[id=the_letter_read_aloud].body"
    of: fdae2b5abbc46386
    plainenglish: >-
      The household usually has letters read aloud because most people living here cannot
      read. This has been the custom since the founding, so many servants hear the family's
      business. A sealed letter from Cawdry has arrived. Eleven people are gathered in the
      long room by the fire, where letters are normally opened.
  - address: "content:events/letters.yaml#events[id=the_letter_read_aloud].interaction.choices[id=open_it_in_the_long_room].label"
    of: ba98a048387a98e4
    plainenglish: >-
      Open and read it here, as the house has done for 200 years.
  - address: "content:events/letters.yaml#events[id=the_letter_read_aloud].interaction.choices[id=open_it_in_the_long_room].outcomes[id=read_aloud].text"
    of: 54d57d90c80fd064
    plainenglish: >-
      The letter is read aloud to eleven people, including nine servants. That is the usual
      practice, and no sender has objected before. The house keeps sharing its letters this
      way without questioning it. When a private letter eventually arrives, changing the
      custom without explaining why will be difficult.
  - address: "content:events/letters.yaml#events[id=the_letter_read_aloud].interaction.choices[id=take_it_to_the_press].label"
    of: 5bc1a60eb91108ea
    plainenglish: >-
      Take the letter elsewhere and read it alone.
  - address: "content:events/letters.yaml#events[id=the_letter_read_aloud].interaction.choices[id=take_it_to_the_press].outcomes[id=read_alone].text"
    of: 097b58423ae14c56
    plainenglish: >-
      The letter is taken from a warm room full of people expecting to hear it read.
      Everyone notices this unusual choice immediately. The Head has established a new
      boundary around private letters. It costs nothing now, but the change cannot simply be
      undone.
  - address: "content:events/letters.yaml#events[id=the_drovers_bring_the_price].title"
    of: 20c6f59936716a8d
    plainenglish: >-
      Cattle Drovers Bring Price News
  - address: "content:events/letters.yaml#events[id=the_drovers_bring_the_price].body"
    of: 0de6438b8d923917
    plainenglish: >-
      Drovers move cattle 200 miles along the green roads at ten miles a day. Their families
      have used the same routes for generations, carrying money, promissory notes and
      reliable market prices. This year's drover warns that southern wool prices are
      falling, four ten-day periods before the factors are due. He has no reason to lie and
      has been wrong only once in nineteen years.
  - address: "content:events/letters.yaml#events[id=the_drovers_bring_the_price].interaction.choices[id=sell_early_on_his_word].label"
    of: a67eeeb1b788c8a5
    plainenglish: >-
      Trust the drover and sell the wool early at Bramme.
  - address: "content:events/letters.yaml#events[id=the_drovers_bring_the_price].interaction.choices[id=sell_early_on_his_word].outcomes[id=he_was_right].text"
    of: 0a81021a8df596d6
    plainenglish: >-
      The wool is sold four ten-day periods early at a price that seems low. By Haying, that
      sale has earned twenty-two crowns more than the factors would have offered at the
      gate. The house gives the drover a crown at Ingathering. He had not requested it but
      accepts, and brings this house everything he hears for the next eleven years.
  - address: "content:events/letters.yaml#events[id=the_drovers_bring_the_price].interaction.choices[id=sell_early_on_his_word].outcomes[id=he_was_wrong].text"
    of: 529b750ca4bb2dc8
    plainenglish: >-
      The wool price stays steady. Selling early costs the house eleven crowns. The drover
      is ashamed because his predictions have been reliable for nineteen years. The house
      does not blame him, but he avoids passing on prices for four years out of
      embarrassment.
  - address: "content:events/letters.yaml#events[id=the_drovers_bring_the_price].interaction.choices[id=wait_for_the_factors].label"
    of: fbf34858cdd249bc
    plainenglish: >-
      Wait for the factors to set the price, as usual.
  - address: "content:events/letters.yaml#events[id=the_drovers_bring_the_price].interaction.choices[id=wait_for_the_factors].outcomes[id=waited_for_them].text"
    of: ca2a84db832c61a7
    plainenglish: >-
      The factors arrive in Haying and give the price they intended to offer for the wool.
      The house paid nothing for the drover's warning but cannot know whether selling early
      would have been better. It never learns the value of that other choice.
  - address: "content:events/letters.yaml#events[id=nobody_owns_a_clock].title"
    of: 363b56c02d1fc50c
    plainenglish: >-
      No One at the House Owns a Clock
  - address: "content:events/letters.yaml#events[id=nobody_owns_a_clock].body"
    of: 39160bff43b92ed3
    plainenglish: >-
      Towns mark the hours with bells, while the countryside uses the sun. Tower clocks at
      Caster, Sarrow and Corran are so unusual that people visit to see them. {KIN} returns
      from Bramme wanting the household to know the time. They start marking where sunlight
      from a gap in the shutter falls on the long-room wall. After four months, those marks
      give a more accurate time than Bramme's bells, though the marks are not a clock.
  - address: "content:events/letters.yaml#events[id=the_rumour_arrives_before_the_rider].title"
    of: bb9517067c4ac8c2
    plainenglish: >-
      Wick Hears the Rumour First
  - address: "content:events/letters.yaml#events[id=the_rumour_arrives_before_the_rider].body"
    of: 4ed8a06b87c14687
    plainenglish: >-
      Something involving this family happened at Cawdry. People at the alehouse in Wick
      hear a version of the news a full day before a rider reaches the hall. Usually Wick
      hears such news first. This time the reeve comes to tell the Head what people are
      saying without being asked. He has never done this before and is unsure whether he
      should.
  - address: "content:events/letters.yaml#events[id=the_rumour_arrives_before_the_rider].interaction.choices[id=thank_him_and_ask_for_more].label"
    of: 9ab9d33e36801a72
    plainenglish: >-
      Thank the reeve and ask him to bring news like this again.
  - address: "content:events/letters.yaml#events[id=the_rumour_arrives_before_the_rider].interaction.choices[id=thank_him_and_ask_for_more].outcomes[id=an_arrangement].text"
    of: 3a2a351a165e611e
    plainenglish: >-
      The Head and reeve make a short, unwritten agreement in the yard. For the next thirty
      years, the reeve tells the house what people in its own parish are saying about it.
      This costs nothing and proves valuable. The arrangement exists because he chose to
      bring difficult news despite his doubts.
  - address: "content:events/letters.yaml#events[id=the_rumour_arrives_before_the_rider].interaction.choices[id=tell_him_it_is_not_his_business].label"
    of: 4ba8c52ce9061aa8
    plainenglish: >-
      Tell the reeve politely that the hall's business is private.
  - address: "content:events/letters.yaml#events[id=the_rumour_arrives_before_the_rider].interaction.choices[id=tell_him_it_is_not_his_business].outcomes[id=not_his_business].text"
    of: 9a68761aeee529de
    plainenglish: >-
      The Head kindly tells the reeve not to involve himself in the hall's affairs. He
      understands and never brings such news up the hill again. Wick continues to hear
      rumours before the house, which returns to hearing them last.
  - address: "content:events/letters.yaml#events[id=nobody_owns_a_clock].interaction.outcomes[id=the_marks_on_the_wall].text"
    of: 8f342f8330316717
    plainenglish: >-
      The marks remain on the wall for eleven years. In 1211 a maid who does not know what
      they mean covers them with limewash. Nobody in the house speaks of them again or
      realises that eleven years of work have been lost.
  - address: "content:events/letters.yaml#events[id=nobody_owns_a_clock].interaction.outcomes[id=somebody_notices].text"
    of: 0a3505005e94a15c
    plainenglish: >-
      A visitor from Cawdry recognises the wall marks in about a minute. He is impressed,
      although he seems reluctant to admit it. He mentions them at three tables that winter.
      People spread the strange news that a house in the Nethering keeps track of the hour.

  - address: "content:events/letters.yaml#events[id=the_letter_that_crossed].interaction.choices[id=insist_on_ours].outcomes[id=ours_first].effects[2].text"
    of: "36d4e9d2d72a9c46"
    plainenglish: >-
      The family registered only its own offer and certified that no answering letter from
      Cawdry had arrived.
