# THE PEOPLE WHO GO EVERYWHERE.
#
# World §22 exists because a stranger who is only "a man from the road" is a
# wasted slot. This file spends the eleven peoples it lists: the Wayfolk who
# carry the song, the drovers who carry the fact, the colliers who are awake
# in the one place nobody else is, the boat families who will not open the box,
# the tinker and the third price, the Rimefell men who arrive with things the
# paperwork says cannot exist.
#
# Every scene here tests the same rule from a different side, and it is §1.9:
# a thing that cannot be explained was done by a warranted practitioner, by a
# fraud, or by the counterparty. There is no fourth option and nobody in these
# scenes is ever told which of the three it was.
#
# COMMON tier throughout. A road is weather, not an occasion.
events:
  - id: the_wayfolk_at_the_gate
    title: The Wayfolk at the Gate
    tier: head
    frequency: common
    weight: 85
    tags: [wayfolk, folklore, song, hospitality]
    purposes: [advance_clause, plant_rumour, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      Thirty of them and nine wagons, come up from the Bramme fair, and what
      they want is supper and a floor. What they are is the only people in the
      Settled Lands who go everywhere and talk to everyone. A house that feeds
      them gets its version of a story sung for a century, and a house that
      turns them away gets the other version, and there is no third version and
      no way to buy one later.
    interaction:
      kind: choice
      choices:
        - id: hall_and_supper
          label: The hall, supper, and the fires kept up.
          outcomes:
            - id: sung_well
              weight: 100
              text: >-
                Their harp is better than anything the nobility owns and
                nobody will ever say so out loud. Two staves that night are
                about this province and one of them is nearly about this house,
                and the version that leaves in the morning has the house in it
                being generous and being nothing else at all.
              effects:
                - { kind: treasury, delta: -16 }
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_the_open_hall, accuracy: 0.7 }
        - id: the_barn
          label: The barn, bread, and the road in the morning.
          outcomes:
            - id: barn
              weight: 70
              text: >-
                It is not a refusal and it is not the hall, and they have been
                counting the difference between those two for four hundred
                years. They go at first light without a word out of place.
              effects:
                - { kind: treasury, delta: -2 }
            - id: the_stave_that_travels
              weight: 30
              tags: [folklore]
              text: >-
                One of them sings at Bramme a fortnight later about a cold
                house on a rise where the fires were down to three and a
                grandmother would not come out of the west wing. It is not
                accusation. It is not flattering either, and it has fifteen
                years to get to Caster and fifty to lose the names.
              effects:
                - { kind: treasury, delta: -2 }
                - { kind: rumour, op: seed, id: rumour_the_cold_house, accuracy: 0.4 }

  - id: the_third_price
    title: The Third Price
    tier: family
    frequency: common
    weight: 70
    tags: [tinker, custom, money, superstition]
    purposes: [advance_clause, buy_patience, test_magic_rule]
    slots:
      BUYER:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 14 } }]
    body: >-
      A tinker names three prices and the third is the true one, and haggling
      past it is bad luck, and refusing him water is worse. Everyone observes
      this and nobody defends it. What he has this year, along with the pots,
      is a small flat box of blackened iron with a lid that will not lift, out
      of the peat at the Lag, and he says four marks, and then two, and then he
      looks at {BUYER} for a while and says eleven. He will also take a
      reference saying he has mended the house's pots for three winters.
      Nobody here has seen him before.
    interaction:
      kind: choice
      choices:
        - id: pay_the_third
          label: Pay the third price and ask him nothing.
          outcomes:
            - id: bought_it
              weight: 100
              text: >-
                Eleven marks and the water he was owed, and he is gone down the
                Bramme road before noon. The lid comes off in the second cellar
                three days later with no particular difficulty and there is
                nothing inside it but dry peat. The house keeps the box.
              effects:
                - { kind: treasury, delta: -1 }
        - id: send_him_on
          label: Give him water and send him on.
          outcomes:
            - id: sent_on
              weight: 100
              text: >-
                He drinks it standing in the yard, which from a tinker is not
                an insult, and takes the box up the road to Hesk where he gets
                nine for it. The story that comes back down in Frostfall has
                the box open and something in it, and by the Greening fair it
                has a hand in it.
              effects:
                - { kind: rumour, op: seed, id: rumour_the_box_out_of_the_peat, accuracy: 0.15 }
        - id: sign_the_reference
          label: Sign for three winters of work. Take the box without coin.
          outcomes:
            - id: referenced
              weight: 100
              text: >-
                {BUYER} puts a name beneath three winters of work that
                never happened. The tinker takes the paper to Bramme and
                leaves the box. Its lid comes off over supper, with nothing
                beneath it but dry peat. The kitchen accounts are in the press.
              effects:
                - { kind: discrepancy, op: create, id: the_tinker_given_three_winters, severity: minor, provableBy: [commons, the_church] }
                - { kind: relationship, from: household, to: { slot: BUYER }, sentiment: -6 }
                - { kind: chronicle, text: "{BUYER} certified three winters of work at the house for a tinker first seen that morning, taking an iron box in return." }

  - id: the_colliers_are_awake
    title: The Colliers Are Awake
    tier: family
    frequency: common
    weight: 70
    tags: [colliers, wood, witness, night]
    purposes: [change_relationship, plant_rumour, test_magic_rule]
    slots:
      HEAD: { role: head }
      SEEN:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 15 } }, { relation: not, of: HEAD }]
    body: >-
      Charcoal burners sleep by the burn in season, which makes them the only
      people awake at night in the one part of the province where nobody else
      is. Their testimony is worth nothing in any court and they see
      everything. Two of them come to the yard in Smoke and ask, very carefully
      and without ever finishing the sentence, whether {SEEN} was in the west
      wood four nights ago about an hour before dawn.
    interaction:
      kind: choice
      choices:
        - id: answer_them
          label: Answer them straight.
          outcomes:
            - id: answered
              weight: 100
              text: >-
                Yes, and the reason, and it is a dull reason and true. They
                take it away with them and are visibly relieved, and the story
                they were carrying dies in the wood where it started. Eleven
                marks a year of goodwill for four minutes in a yard.
              # #341: four minutes in a yard cost nothing, and the other houses
              # never hear what was said to a collier. What it buys is {SEEN}.
              effects:
                - { kind: relationship, from: { slot: SEEN }, to: head, sentiment: 10 }
        - id: pay_them_off
          label: Give them a barrel and no answer.
          outcomes:
            - id: paid
              weight: 100
              text: >-
                They take the barrel because a barrel is a barrel. They also
                take the non-answer, and they are back in the wood by dark with
                nothing else to do until Thaw but decide what it meant. Colliers
                come out black and full of what they have decided.
              effects:
                - { kind: treasury, delta: -2 }
                - { kind: rumour, op: seed, id: rumour_before_dawn_in_the_west_wood, accuracy: 0.25 }

  - id: the_boat_that_does_not_open_it
    title: The Boat That Does Not Open It
    tier: head
    frequency: common
    weight: 70
    tags: [boat_families, wend, carriage, discretion]
    purposes: [plant_rumour, test_magic_rule, worldbuild_through_action]
    slots:
      HEAD: { role: head }
    body: >-
      They are born, married and buried aboard, they speak a dialect nobody
      ashore has ever managed, and their guild will not take an outsider. What
      they sell, once, for a price, is that they will carry a thing down the
      Wend and not open it, and their memory for a cargo is famously poor and
      privately excellent. Two days down to the Lag and four back. {HEAD} has
      something in the second cellar that would be better forty miles away.
    interaction:
      kind: choice
      choices:
        - id: send_it_down
          label: Send it down.
          outcomes:
            - id: carried
              weight: 100
              text: >-
                Four marks, a bill of nothing, and the crate is gone on the
                Tuesday tide with a woman steering who does not ask its weight
                out loud and gets it wrong on purpose in front of the reeve.
                What the Lag does with a thing is take it in and stop mentioning
                it. That is the whole of the service and it is worth the money.
              effects:
                - { kind: treasury, delta: -4 }
        - id: keep_it_here
          label: Keep it. What leaves the house is out of the house's hands.
          outcomes:
            - id: kept
              weight: 100
              text: >-
                It stays bricked in the second cellar, which has been bricked
                and unbricked more than once and will be again. The boat woman
                is at the staithe for three days waiting on a cargo that never
                comes down, and asks the reeve about it twice, which is two
                more times than she has ever asked about anything.
              effects:
                - { kind: rumour, op: seed, id: rumour_the_cargo_that_never_came, accuracy: 0.3 }

  - id: the_drovers_bring_the_fact
    title: What the Drovers Brought
    tier: head
    frequency: common
    weight: 75
    tags: [drovers, news, money, roads]
    purposes: [buy_patience, change_relationship, plant_rumour]
    slots:
      HEAD: { role: head }
    body: >-
      The hall smells of wet hides long after the drovers have gone. A man two
      hundred miles down the green road has been paying for news of a
      Nethering family, and asking by its habits rather than its name. The
      drovers can remember his weights better than his face. {HEAD} could
      follow their route and ask at the three markets where he stopped, if the
      house can spare a head for most of the summer. The cattle are already
      on the road.
    interaction:
      kind: choice
      choices:
        - id: pay_for_more
          label: Follow the road. Ask at the markets yourself.
          outcomes:
            - id: he_asks
              weight: 60
              text: >-
                At the third market a keeper remembers weighed Braccish coin
                and a traveller who stopped asking in Smoke. Nobody can give a
                name, but the three accounts agree on the places and the
                months. The journey leaves its marks under the riding clothes.
                At home the questions are asked in a quieter voice.
              effects:
                - { kind: attribute, target: { slot: HEAD }, attr: health, delta: -4 }
                - { kind: relationship, from: household, to: head, sentiment: 6 }
            - id: nothing_comes_back
              weight: 40
              text: >-
                The men remember the cattle, the weather and a dozen ordinary
                sales. Each sends the question to another stall, and after
                three markets there is no stall left to ask. Most of the
                summer has gone on the road, with nothing brought home but
                a saddle sore that will not close. The scar stays.
              effects:
                - { kind: attribute, target: { slot: HEAD }, attr: health, delta: -4 }
        - id: let_it_go
          label: Let it go. A description is not a name.
          outcomes:
            - id: let_go
              weight: 100
              text: >-
                It is the correct answer nine times in ten and the house has no
                way of knowing which time this is. The drovers come up the same
                road every year with the same families on it, and nobody ever
                asks them the follow-up.
              effects:
                - { kind: rumour, op: seed, id: rumour_a_man_asking_by_description, accuracy: 0.5 }

  - id: the_rimefell_men_in_frostfall
    title: The Rimefell Men in Frostfall
    tier: head
    frequency: common
    weight: 70
    tags: [rimefell, trade, horses, books]
    purposes: [advance_clause, change_standing, test_magic_rule]
    slots:
      HEAD: { role: head }
    body: >-
      They come down before the passes close with ore, horn, coarse wool and
      horses, they speak Ambric badly and prices exactly, and they are gone
      again inside a tenday. This year one of them has a bound thing wrapped in
      oiled cloth that he will not price until the yard is empty. It is a
      quarter of a book, forty leaves, in a hand nobody at Ardwen can read, and
      the paperwork that would explain how it came off a mountain does not
      exist and is not going to.
    interaction:
      kind: choice
      choices:
        - id: buy_the_quarter
          label: Buy it. Forty leaves is forty leaves.
          outcomes:
            - id: bought_the_leaves
              weight: 100
              text: >-
                Thirty-one crowns after an hour of arithmetic conducted almost
                entirely in numbers. It goes in the press unlisted. Whatever it
                is, a quarter of a book is a quarter of an argument, and the
                house now owns an object it cannot explain the ownership of to
                anybody who asks in a court.
              effects:
                - { kind: treasury, delta: -31 }
                - { kind: heirloom, op: grant, heirloom: the_forty_leaves }
                - { kind: respect, delta: -1 }
        - id: send_him_to_cawdry
          label: Send him to the bookseller at Cawdry.
          outcomes:
            - id: sent_to_cawdry
              weight: 100
              text: >-
                The bookseller at Cawdry is wrong about most things and will be
                wrong about this at length and in writing. The house keeps its
                thirty-one crowns and its clean answer, and in eleven years a
                catalogue comes up from Cawdry describing the leaves in terms
                that make it clear somebody eventually read them.
              effects:
                - { kind: respect, delta: 1 }
                - { kind: rumour, op: seed, id: rumour_the_forty_leaves_at_cawdry, accuracy: 0.45 }

  - id: the_licensed_poor
    title: A Badge From Another Parish
    tier: family
    frequency: common
    weight: 65
    tags: [poor, law, parish, witness]
    purposes: [advance_clause, change_relationship, test_magic_rule]
    slots:
      HEAD: { role: head }
      KIN:
        role: family_member
        filters: [{ status: [alive] }, { age: { op: gte, value: 14 } }, { relation: not, of: HEAD }]
    body: >-
      A man may beg by a badge from his own parish and nowhere else, and
      begging out of parish is vagrancy, and vagrancy is the stocks. The one at
      the Ardwen gate has a badge from a parish forty miles off and has plainly
      walked it. {KIN} is the one who notices the badge, and notices that he is
      not asking for bread. He is asking whether this is the house where the
      grates were cold in the year of the great frost, and he has been asking
      it at gates all the way up the road.
    interaction:
      kind: choice
      choices:
        - id: feed_and_ask
          label: Feed him. Vouch for a Wick badge with {KIN} named as witness.
          outcomes:
            - id: he_tells
              weight: 100
              text: >-
                He heard the question in a song at Coln, from a Wayfolk girl
                who had it from her father. The reeve is sent a certificate
                saying the man has lived at Wick for three winters, with
                {KIN} named as witness. He has never slept here. He eats in
                the kitchen while the new badge is cut.
              effects:
                - { kind: relationship, from: { slot: KIN }, to: head, sentiment: 8 }
                - { kind: discrepancy, op: create, id: the_beggar_entered_as_wick_resident, severity: minor, provableBy: [commons, the_church] }
                - { kind: chronicle, text: "The house certified three winters of residence at Wick for the stranger from Coln, naming {KIN} as witness." }
        - id: the_stocks
          label: Hand him to the reeve. Out of parish is out of parish.
          outcomes:
            - id: stocked
              weight: 100
              tags: [hard]
              text: >-
                Two days in the Wick stocks and then walked to the parish line
                by a man who is embarrassed about it. The reeve calls {KIN}
                forward to confirm where the stranger was found. What he
                asked is repeated at the alehouse for both nights. Back at
                the hall, the witness's stool is left empty.
              effects:
                - { kind: relationship, from: head, to: { slot: KIN }, grudge: { severity: 20, inheritance: none } }
                - { kind: relationship, from: { slot: KIN }, to: head, sentiment: -8 }
                - { kind: rumour, op: seed, id: rumour_the_man_who_asked_at_the_gate, accuracy: 0.55 }

proseVariants:
  - address: "content:events/roads.yaml#events[id=the_wayfolk_at_the_gate].title"
    of: df6a8a9084ea7adc
    plainenglish: >-
      The Travelling Wayfolk Arrive
  - address: "content:events/roads.yaml#events[id=the_wayfolk_at_the_gate].body"
    of: 51bb58ca9376664e
    plainenglish: >-
      Thirty Wayfolk arrive with nine wagons from the Bramme fair. They ask for supper and a
      place to sleep. They travel throughout the Settled Lands and talk to people
      everywhere. If the house feeds them, their songs may praise it for a century. If the
      house turns them away, the songs will tell another version. The house cannot change
      the songs later by paying for them.
  - address: "content:events/roads.yaml#events[id=the_wayfolk_at_the_gate].interaction.choices[id=hall_and_supper].label"
    of: b8594c083293464c
    plainenglish: >-
      Let them sleep in the hall, feed them supper, and keep the fires burning.
  - address: "content:events/roads.yaml#events[id=the_wayfolk_at_the_gate].interaction.choices[id=hall_and_supper].outcomes[id=sung_well].text"
    of: ddf1fe1bc4d5b737
    plainenglish: >-
      Their harp sounds better than those owned by the nobility, although no noble would
      admit it. That night they sing two songs about the province. One almost mentions this
      house. When they leave the next morning, their version praises the house for its
      generosity and nothing else.
  - address: "content:events/roads.yaml#events[id=the_wayfolk_at_the_gate].interaction.choices[id=the_barn].label"
    of: 14d1721f2c5ce9ab
    plainenglish: >-
      Give them the barn and bread, and send them on their way in the morning.
  - address: "content:events/roads.yaml#events[id=the_wayfolk_at_the_gate].interaction.choices[id=the_barn].outcomes[id=barn].text"
    of: 811959d13240a2bd
    plainenglish: >-
      The family does not turn them away, but it does not invite them into the hall. The
      Wayfolk have remembered this distinction for four hundred years. They leave quietly at
      first light.
  - address: "content:events/roads.yaml#events[id=the_wayfolk_at_the_gate].interaction.choices[id=the_barn].outcomes[id=the_stave_that_travels].text"
    of: a10b4afa8c46f766
    plainenglish: >-
      Two weeks later, one of the Wayfolk sings at Bramme about a cold house on a hill. Its
      fires were down to three, and a grandmother refused to leave the west wing. The song
      does not accuse anyone, but it does not flatter the house. It will take fifteen years
      to reach Caster and fifty years to lose the names.
  - address: "content:events/roads.yaml#events[id=the_third_price].title"
    of: ab3ee3988d924ecc
    plainenglish: >-
      The Tinker's Third Price
  - address: "content:events/roads.yaml#events[id=the_third_price].body"
    of: "ac00aa5df2feaeb1"
    plainenglish: >-
      The tinker names three prices. People say the third is the true price and it is bad
      luck to haggle further or refuse him water. He offers a sealed iron box from the Lag
      peat: first four marks, then two, then eleven after looking at {BUYER}. He will also
      accept a reference saying he has worked for the house for three winters. Nobody here
      has met him before.
  - address: "content:events/roads.yaml#events[id=the_third_price].interaction.choices[id=pay_the_third].label"
    of: 85179269dbcb677d
    plainenglish: >-
      Pay eleven marks, the third price, and ask no questions.
  - address: "content:events/roads.yaml#events[id=the_third_price].interaction.choices[id=pay_the_third].outcomes[id=bought_it].text"
    of: ae3386a6679fc9f2
    plainenglish: >-
      The tinker takes eleven marks and the water he is owed. He leaves on the Bramme road
      before noon. Three days later, the lid opens easily in the second cellar. The box
      contains only dry peat. The house keeps it.
  - address: "content:events/roads.yaml#events[id=the_third_price].interaction.choices[id=send_him_on].label"
    of: b43602ed517dfa29
    plainenglish: >-
      Give him water, but do not buy the box.
  - address: "content:events/roads.yaml#events[id=the_third_price].interaction.choices[id=send_him_on].outcomes[id=sent_on].text"
    of: e6287e6f2a488663
    plainenglish: >-
      He stands in the yard to drink the water. That is normal for a tinker and is not an
      insult. He takes the box to Hesk and sells it for nine marks. By Frostfall the
      returning story says the box was opened and something was inside. By the Greening
      fair, the story says it contained a hand.
  - address: "content:events/roads.yaml#events[id=the_colliers_are_awake].title"
    of: 5e24047a11514b46
    plainenglish: >-
      The Charcoal Burners Saw Something
  - address: "content:events/roads.yaml#events[id=the_colliers_are_awake].body"
    of: fa9136430c4bfd97
    plainenglish: >-
      Charcoal burners sleep beside their fires during the burning season. They are often
      the only people awake at night in a remote part of the province. Courts give their
      testimony no weight, although they see many things. In Smoke, two burners come to the
      yard and ask whether {SEEN} was in the west wood four nights earlier, about an hour
      before dawn. They ask carefully without finishing their question.
  - address: "content:events/roads.yaml#events[id=the_colliers_are_awake].interaction.choices[id=answer_them].label"
    of: 1b2e755fa6e117bb
    plainenglish: >-
      Tell them directly what happened.
  - address: "content:events/roads.yaml#events[id=the_colliers_are_awake].interaction.choices[id=answer_them].outcomes[id=answered].text"
    of: 2fe4de4b651d613f
    plainenglish: >-
      The answer is yes, and the reason is ordinary and true. The charcoal burners are
      visibly relieved. They take the explanation home, and the rumour dies where it began.
      Four minutes of explanation in the yard have bought goodwill worth eleven marks a
      year.
  - address: "content:events/roads.yaml#events[id=the_colliers_are_awake].interaction.choices[id=pay_them_off].label"
    of: cafde9f533ec1081
    plainenglish: >-
      Give them a barrel, but no explanation.
  - address: "content:events/roads.yaml#events[id=the_colliers_are_awake].interaction.choices[id=pay_them_off].outcomes[id=paid].text"
    of: e0d09928cdb5b93c
    plainenglish: >-
      They accept the barrel, but they also remember that nobody answered them. Back in the
      wood, they have little to do before Thaw except discuss what the silence meant. When
      the charcoal burners emerge, they are covered in soot and certain of their
      conclusions.
  - address: "content:events/roads.yaml#events[id=the_boat_that_does_not_open_it].title"
    of: 4183f7a03ebb3274
    plainenglish: >-
      The Boat Families Who Keep Cargo Secret
  - address: "content:events/roads.yaml#events[id=the_boat_that_does_not_open_it].body"
    of: a61a62e7be0e0f63
    plainenglish: >-
      These boat families are born, marry, and die aboard their vessels. They speak a
      dialect nobody on shore understands, and their guild does not admit outsiders. For a
      fee, they will carry something down the Wend without opening it. They pretend not to
      remember cargo, but privately remember it very well. The journey takes two days to the
      Lag and four days back. {HEAD} has something in the second cellar that would be safer
      forty miles away.
  - address: "content:events/roads.yaml#events[id=the_boat_that_does_not_open_it].interaction.choices[id=send_it_down].label"
    of: aed1832e8f5898c2
    plainenglish: >-
      Pay the boat families to take it downstream.
  - address: "content:events/roads.yaml#events[id=the_boat_that_does_not_open_it].interaction.choices[id=send_it_down].outcomes[id=carried].text"
    of: 25d7dfca56d70bee
    plainenglish: >-
      The house pays four marks for a bill that lists no cargo. The crate leaves on
      Tuesday's tide. The woman steering does not ask its weight aloud, and deliberately
      gives the reeve the wrong figure. At the Lag, people accept things without discussing
      them again. That discretion is what the house paid for.
  - address: "content:events/roads.yaml#events[id=the_boat_that_does_not_open_it].interaction.choices[id=keep_it_here].label"
    of: 5d4d5438f76d316c
    plainenglish: >-
      Keep it in the cellar rather than lose control of it.
  - address: "content:events/roads.yaml#events[id=the_boat_that_does_not_open_it].interaction.choices[id=keep_it_here].outcomes[id=kept].text"
    of: a6d11254aa756128
    plainenglish: >-
      The object stays behind bricks in the second cellar. The wall has been opened and
      closed before and will be again. The boat woman waits three days at the landing for a
      cargo that never arrives. She asks the reeve about it twice, although she has never
      asked about any cargo before.
  - address: "content:events/roads.yaml#events[id=the_drovers_bring_the_fact].title"
    of: 2aff33ace1172580
    plainenglish: >-
      News From the Cattle Drovers
  - address: "content:events/roads.yaml#events[id=the_drovers_bring_the_fact].body"
    of: "9f5f7a13ef4681ff"
    plainenglish: >-
      The hall still smells of wet cattle hides after the drovers leave. Two hundred miles
      south, a man has been paying for information about a Nethering family, describing its
      habits without giving a name. The drovers remember his weights better than his face.
      {HEAD} could follow their route and ask at the three markets he visited, but the
      journey would take most of the summer. The cattle are already on their way.
  - address: "content:events/roads.yaml#events[id=the_drovers_bring_the_fact].interaction.choices[id=pay_for_more].label"
    of: "e184a22070655034"
    plainenglish: "Travel down the road and ask at the markets yourself."
  - address: "content:events/roads.yaml#events[id=the_drovers_bring_the_fact].interaction.choices[id=pay_for_more].outcomes[id=he_asks].text"
    of: "6188a28ade3e4176"
    plainenglish: >-
      A keeper at the third market remembers Braccish weights and a traveller who stopped
      asking in Smoke. Nobody knows his name, but the three accounts agree about the places
      and months. The journey has hurt the traveller from this house. At home the family is
      reassured that the questions were followed up.
  - address: "content:events/roads.yaml#events[id=the_drovers_bring_the_fact].interaction.choices[id=pay_for_more].outcomes[id=nothing_comes_back].text"
    of: "150efd0fdc6e8c0b"
    plainenglish: >-
      Each market sends the question to another stall until there is nobody left to ask.
      Most of the summer is spent travelling and nothing is learned. The only lasting result
      is a saddle sore that leaves a scar.
  - address: "content:events/roads.yaml#events[id=the_drovers_bring_the_fact].interaction.choices[id=let_it_go].label"
    of: f7d0e277a0a6b8eb
    plainenglish: >-
      Ignore the question. A description is not a name.
  - address: "content:events/roads.yaml#events[id=the_drovers_bring_the_fact].interaction.choices[id=let_it_go].outcomes[id=let_go].text"
    of: 6a1e656ea8327daa
    plainenglish: >-
      Ignoring the question would be right nine times out of ten. The house cannot know
      whether this is the exception. The same drover families use the road every year, and
      nobody asks them about the man again.
  - address: "content:events/roads.yaml#events[id=the_rimefell_men_in_frostfall].title"
    of: 0b3a8f9ef75e7e4a
    plainenglish: >-
      Traders From Rimefell Bring a Book
  - address: "content:events/roads.yaml#events[id=the_rimefell_men_in_frostfall].body"
    of: d198341c98b6ea48
    plainenglish: >-
      The Rimefell traders arrive before the mountain passes close. They bring ore, horn,
      coarse wool, and horses. They speak Ambric poorly but state prices precisely, and
      leave within ten days. This year one trader has a bound object wrapped in oiled cloth.
      He will not name a price until the yard is empty. It is a quarter of a book, forty
      leaves, written in a script nobody at Ardwen can read. He has no paperwork explaining
      how he obtained it in the mountains.
  - address: "content:events/roads.yaml#events[id=the_rimefell_men_in_frostfall].interaction.choices[id=buy_the_quarter].label"
    of: b72c97203f155b3c
    plainenglish: >-
      Buy the forty leaves.
  - address: "content:events/roads.yaml#events[id=the_rimefell_men_in_frostfall].interaction.choices[id=buy_the_quarter].outcomes[id=bought_the_leaves].text"
    of: 90c0f800ca79c9cc
    plainenglish: >-
      After an hour of bargaining with numbers, the house pays thirty-one crowns. The leaves
      go into storage without being listed. The family now owns part of a book and cannot
      explain its ownership to a court if questioned.
  - address: "content:events/roads.yaml#events[id=the_rimefell_men_in_frostfall].interaction.choices[id=send_him_to_cawdry].label"
    of: b94fecaa71e33f96
    plainenglish: >-
      Direct the trader to the bookseller at Cawdry instead.
  - address: "content:events/roads.yaml#events[id=the_rimefell_men_in_frostfall].interaction.choices[id=send_him_to_cawdry].outcomes[id=sent_to_cawdry].text"
    of: 62362cd427663438
    plainenglish: >-
      The Cawdry bookseller will probably make a long, confidently wrong written assessment.
      The house keeps its thirty-one crowns and avoids questions about ownership. Eleven
      years later, a catalogue arrives from Cawdry describing the leaves. Someone has
      eventually learned how to read them.
  - address: "content:events/roads.yaml#events[id=the_licensed_poor].title"
    of: de4a02775dc1a633
    plainenglish: >-
      A Beggar With Another Parish's Badge
  - address: "content:events/roads.yaml#events[id=the_licensed_poor].body"
    of: cd553fb96607ef5d
    plainenglish: >-
      A man may legally beg only in his own parish while wearing its badge. Begging
      elsewhere counts as vagrancy and can lead to the stocks. The man at Ardwen's gate
      wears a badge from a parish forty miles away. He has clearly walked that distance.
      {KIN} notices the badge and realises the man is not asking for bread. He wants to know
      whether this is the house whose grates went cold during the great frost. He has asked
      the same question at gates along the road.
  - address: "content:events/roads.yaml#events[id=the_licensed_poor].interaction.choices[id=feed_and_ask].label"
    of: "764d028b94998e47"
    plainenglish: "Feed him and falsely certify him for a Wick badge, naming {KIN} as witness."
  - address: "content:events/roads.yaml#events[id=the_licensed_poor].interaction.choices[id=feed_and_ask].outcomes[id=he_tells].text"
    of: "cdc661b63e382a0a"
    plainenglish: >-
      He heard the question in a song at Coln, from a travelling girl who learned it from
      her father. The family certifies to the reeve that the stranger has lived at Wick for
      three winters, naming {KIN} as witness. He has never slept here. He eats in the
      kitchen while a new badge is made.
  - address: "content:events/roads.yaml#events[id=the_licensed_poor].interaction.choices[id=the_stocks].label"
    of: 187fcab34427b11f
    plainenglish: >-
      Hand him to the reeve for begging outside his parish.
  - address: "content:events/roads.yaml#events[id=the_licensed_poor].interaction.choices[id=the_stocks].outcomes[id=stocked].text"
    of: "1b62388c13da9a18"
    plainenglish: >-
      The man spends two days in the Wick stocks, then is escorted to the parish boundary.
      The reeve makes {KIN} confirm where he was found. People repeat his question at the
      alehouse on both nights. At home, the witness leaves an empty stool at the table.

  - address: "content:events/roads.yaml#events[id=the_licensed_poor].interaction.choices[id=feed_and_ask].outcomes[id=he_tells].effects[2].text"
    of: "9d3a6a326b3b344e"
    plainenglish: >-
      The family falsely certified that the stranger from Coln had lived at Wick for three
      winters, with {KIN} named as witness.

  - address: "content:events/roads.yaml#events[id=the_third_price].interaction.choices[id=sign_the_reference].label"
    of: "c21e57e1bfb9ee7d"
    plainenglish: "Falsely certify three winters of work and take the box without paying coin."

  - address: "content:events/roads.yaml#events[id=the_third_price].interaction.choices[id=sign_the_reference].outcomes[id=referenced].text"
    of: "3d557991082d1cd5"
    plainenglish: "{BUYER} signs for three winters of work the tinker never did. He takes the reference to Bramme and leaves the iron box. The lid is opened that evening and the box contains only dry peat. The kitchen records can disprove the reference."

  - address: "content:events/roads.yaml#events[id=the_third_price].interaction.choices[id=sign_the_reference].outcomes[id=referenced].effects[2].text"
    of: "5f2b3b53670d5357"
    plainenglish: "{BUYER} falsely certified that a stranger had worked at the house for three winters, receiving an iron box in exchange."
