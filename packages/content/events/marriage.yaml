  - address: "content:events/marriage.yaml#events[id=a_son_who_carries_nothing].interaction.choices[id=keep_him].outcomes[id=kept].text"
    of: f4c16313eebedbb7
    plainenglish: >-
      He handles the work well. The household never records his contribution because it
      considers him merely useful.
  - address: "content:events/marriage.yaml#events[id=a_son_who_carries_nothing].record.subject"
    of: 50b73306c1658bb2
    plainenglish: >-
      the son who never awakened
