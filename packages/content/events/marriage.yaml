  - address: "content:events/marriage.yaml#events[id=an_early_waking_daughter].body"
    of: 3eb6e1bb97f4485f
    plainenglish: >-
      {GIRL} awakens in the yard, in sight of the kitchen and half the village. She is
      nine. {MIDWIFE} reaches her first and brings her inside. Three houses have heard
      the story by evening, and by spring marriage offers begin arriving. No one can
