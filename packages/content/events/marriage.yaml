    plainenglish: >-
      The girl's awakening is stronger proof of what she may carry than any family
      document. Unlike a document, the fact that she awakened cannot be forged.
  - address: "content:events/marriage.yaml#events[id=the_match_that_never_comes].title"
    of: 1c64545a95d609ce
    plainenglish: >-
      A Marriage Offer with Impossible Terms
  - address: "content:events/marriage.yaml#events[id=the_match_that_never_comes].body"
    of: 75a9d863a4b8f717
    plainenglish: >-
      Another formal offer arrives for {MATCH}, polite and prompt as usual. One clause is
      impossible for any house to accept. {HEAD} reads it twice. The unacceptable clause
      has changed, but it is no more reasonable. The archive contains four similar offers
      in four different hands, dating back one hundred and ten years.
  - address: "content:events/marriage.yaml#events[id=the_match_that_never_comes].interaction.choices[id=decline].label"
