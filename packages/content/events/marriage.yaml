  - address: "content:events/marriage.yaml#events[id=the_match_that_never_comes].interaction.choices[id=counter].label"
    of: b56e86a4562fc700
    plainenglish: >-
      Send a counteroffer instead. Someone must make the first move.
  - address: "content:events/marriage.yaml#events[id=the_match_that_never_comes].interaction.choices[id=counter].outcomes[id=silence].text"
    of: 01941c2d26690f11
    plainenglish: >-
      No answer arrives. The other house never intended to answer.
  - address: "content:events/marriage.yaml#events[id=the_match_that_never_comes].interaction.choices[id=counter].outcomes[id=opened].text"
    of: 6850107225df249e
    plainenglish: >-
      The other house replies in two lines. It neither accepts nor rejects the
      counteroffer, and the family discusses that response for ten years.
  - address: "content:events/marriage.yaml#events[id=a_son_who_carries_nothing].title"
    of: 7c94589af3e43256
    plainenglish: >-
      A Son Who Will Never Awaken
  - address: "content:events/marriage.yaml#events[id=a_son_who_carries_nothing].body"
    of: 586980d4503763f0
    plainenglish: >-
      The household falls quiet when it becomes clear that {SON} will never awaken. He is
      twenty-two. {HEAD} knows that because the son cannot express the blood's power, he
      can safely be sent away or assigned work that would risk someone who can. The
      family treats his safety and his usefulness as the same fact.
  - address: "content:events/marriage.yaml#events[id=a_son_who_carries_nothing].interaction.choices[id=the_church].label"
    of: 4ebdc0eef9681f8a
    plainenglish: >-
      Send him into Church service. The house gains protection but loses one man of its
      bloodline.
  - address: "content:events/marriage.yaml#events[id=a_son_who_carries_nothing].interaction.choices[id=the_church].outcomes[id=given].text"
    of: 79ae61827f4cf5ce
    plainenglish: >-
      He leaves in the autumn. The Church approves, though its approval may carry a cost.
      The house has one fewer man and is a little safer.
  - address: "content:events/marriage.yaml#events[id=a_son_who_carries_nothing].interaction.choices[id=keep_him].label"
    of: 313b4345c7b602d9
    plainenglish: >-
