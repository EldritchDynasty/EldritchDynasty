    plainenglish: >-
      chose service instead of using the blood's power
  - address: "content:events/marriage.yaml#events[id=the_house_has_one_name_left].title"
    of: 8295f1c0d2e23f94
    plainenglish: >-
      Only One Person Can Carry On the Family Name
  - address: "content:events/marriage.yaml#events[id=the_house_has_one_name_left].body"
    of: 208f3b8ae364c726
    plainenglish: >-
      The kitchen still prepares food for a full table out of habit, then feeds half of
      it to the dogs. The west wing is cold and empty. There are no footsteps or
      arguments there, and no cousins remain. {SOLE_HEIR} eats alone at a table built for
      twelve people, under portraits of earlier relatives who once filled the seats.
      Nobody speaks about the emptiness.
  - address: "content:events/marriage.yaml#events[id=the_house_has_one_name_left].interaction.choices[id=send_to_a_broker].label"
    of: cde4cb786d6cb0a4
    plainenglish: >-
      Ask a marriage broker for help immediately and explain the situation clearly.
  - address: "content:events/marriage.yaml#events[id=the_house_has_one_name_left].interaction.choices[id=send_to_a_broker].outcomes[id=word_sent].text"
    of: 048aafa4c2bb1550
    plainenglish: >-
      Within a week, the house writes to every marriage broker it has paid before. The
      letters say directly that the remaining blood heir is unmarried and the family is
      down to one place at the table. Admitting this is difficult, but the honesty gains
      the brokers' full attention for the coming marriage season.
  - address: "content:events/marriage.yaml#events[id=the_house_has_one_name_left].interaction.choices[id=send_to_a_broker].outcomes[id=word_sent].effects[2].text"
    of: 55df293d82287c21
    plainenglish: >-
      The house sent word that only one member of the bloodline remained and it was
      seeking a match.
  - address: "content:events/marriage.yaml#events[id=the_house_has_one_name_left].interaction.choices[id=leave_it].label"
    of: e1a6fdf1593de195
    plainenglish: >-
      Do nothing. Keep the family's situation private.
  - address: "content:events/marriage.yaml#events[id=the_house_has_one_name_left].interaction.choices[id=leave_it].outcomes[id=left].text"
    of: ad4c62f04b508464
    plainenglish: >-
      No letters are sent. The family keeps this trouble private for a little longer, as
      it has hidden other matters it did not want others to know.
  - address: "content:events/marriage.yaml#events[id=the_marriage_that_cannot_answer].title"
    of: 0a63476a4412f396
    plainenglish: >-
      A Marriage That Has Produced No Heir
  - address: "content:events/marriage.yaml#events[id=the_marriage_that_cannot_answer].body"
    of: 7dcc2c5fbd6be103
    plainenglish: >-
      {SOLE_HEIR} and {SPOUSE} have been married for twelve years, and the nursery still
      stores trunks left unopened since the wedding. They no longer discuss their lack of
      children. Nobody can identify a problem with either spouse. Although they care for
      each other, the family is one death away from having no one left to continue its
      record.
  - address: "content:events/marriage.yaml#events[id=the_marriage_that_cannot_answer].interaction.choices[id=put_it_to_the_church].label"
    of: e3e892fd6c782d49
    plainenglish: >-
      Ask the Church to annul the marriage while there is still time to remarry.
  - address: "content:events/marriage.yaml#events[id=the_marriage_that_cannot_answer].interaction.choices[id=put_it_to_the_church].outcomes[id=annulled].text"
    of: d9b431f7ad30bd53
    plainenglish: >-
      The Church's chapter house reviews the marriage and, as it usually does for a
      threatened bloodline, grants an annulment. {SPOUSE} packs a chest and leaves
      without looking back. The heir can seek another marriage and another chance at
      children. By Michaelmas, everyone in Bramme will know what it cost the house to do
      this.
  - address: "content:events/marriage.yaml#events[id=the_marriage_that_cannot_answer].interaction.choices[id=put_it_to_the_church].outcomes[id=annulled].effects[4].text"
    of: dbe94f2f922df8a3
    plainenglish: >-
      The Church annulled the marriage, and the house went back to the marriage market
      for its last remaining heir.
  - address: "content:events/marriage.yaml#events[id=the_marriage_that_cannot_answer].interaction.choices[id=let_it_stand].label"
    of: bd513827526149e3
    plainenglish: >-
      Keep the marriage in place.
  - address: "content:events/marriage.yaml#events[id=the_marriage_that_cannot_answer].interaction.choices[id=let_it_stand].outcomes[id=stood].text"
    of: 10e797a68701c812
    plainenglish: >-
      No one brings the problem to an outside authority. The couple remains married the
      next morning. Without saying it openly, the house has decided what it is prepared
      to lose to preserve the marriage.
