    plainenglish: >-
      Pay for a tutor for {CHILD}. It costs forty crowns for eight years.
  - address: "content:events/the_wish.yaml#events[id=asked_again].interaction.choices[id=pay_for_this_one].outcomes[id=the_second_term].text"
    of: "2273b9f04da11aec"
    plainenglish: >-
      The tutor arrives from Bramme in late Thaw. On the first morning,
      {ASKER} is at the table before the pupil and says nothing about the
      years in between. Nothing needs saying. The lessons have been paid for.
  - address: "content:events/the_wish.yaml#events[id=asked_again].interaction.choices[id=pay_for_this_one].outcomes[id=the_second_term_after_them].text"
    of: "f96ef1e5e2f41891"
    plainenglish: >-
      The tutor arrives from Bramme in late Thaw. The forty crowns are counted
      out in the hall, where the whole household can hear. Nobody says whose
      request it was. Everyone knows.
  - address: "content:events/the_wish.yaml#events[id=asked_again].interaction.choices[id=no_again].label"
    of: "2f932832debd2a5e"
    plainenglish: >-
      Refuse again. Lessons are still only for the heir.
  - address: "content:events/the_wish.yaml#events[id=asked_again].interaction.choices[id=no_again].outcomes[id=refused_twice].text"
    of: "f77e86285b293a54"
    plainenglish: >-
      {HEAD} gives the same answer, in nearly the same words. {ASKER} says
      nothing at the table. Later, in the yard, {ASKER} says a great deal to
      anyone who will listen about what this house is for and who it spends
      its money on. Some of it is unfair. Not enough of it.
  - address: "content:events/the_wish.yaml#events[id=asked_again].interaction.choices[id=no_again].outcomes[id=refused_after_them].text"
    of: "46fab0210e52857d"
    plainenglish: >-
      The answer is the same as before, and nobody at the table cares enough
      to argue. At the cold end of the long room, the sums keep coming out
      right.
