  - address: "content:events/the_wish.yaml#events[id=the_day_book].body"
    of: "3148c4f6300c0d42"
    plainenglish: >-
      The house does its accounts in Thaw. This year the steward finally
      admits what he has avoided saying since the Slaughter feast: he can no
      longer read his own handwriting by candlelight. He has kept the
      day-book, the house's account book, for thirty years. Someone else must
      keep it now, and the house must decide who. Ten years ago, the house
      paid forty crowns for {ASKER} to learn reading, writing and arithmetic,
      because {ASKER} asked. The book lies closed on the long-room table.
