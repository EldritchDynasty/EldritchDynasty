# A TERM ASKED FOR (#1976) — a relative's own wish, and what the answer does
# to that same person's life.
#
# Every callback before this one (#1867's tutor, #1898's Match, term and
# waking) returns to a decision the HOUSE made. `the_house_decides_for_him`
# says it outright: "Nobody asks {CHILD} first." This is the other way round.
# A child of the house asks for one thing, a tutor's term in letters and
# reckoning, and the answer decides which later scene that child is in.
#
# THE BRANCH TABLE.
#
#   pay_for_the_term            -> the_day_book, 10-12 years on. The old
#       steward gives up the house's books and somebody must keep them. Keeping
#       them in the family is the good answer only if the term was finished
#       and the person it was bought for is still here to use it.
#   the_terms_are_for_the_heir  -> asked_again, 9-12 years on. The person who
#       was refused asks for the same term for the next child, and a second
#       refusal is a grudge.
#
# WHO OWNS WHAT (#1977's distinction). HEAD is the office and is not kept:
# every beat casts whoever holds the seal that year, and the prose says "the
# house" wherever the earlier answer might have been somebody else's. ASKER
# is the person and is kept for the whole chain. Nobody is ever substituted
# for them. If they are dead or away when a beat falls due, `continue_absent`
# renders the `absentBody`, and every outcome is guarded on ASKER, so an
# absent person receives no relationship and takes no act. The child in
# `asked_again` is the subject of a new request, not a stand-in for ASKER.
#
# WHAT THE TERM IS. The authored `tutor` effect goes through `beginTutoring`,
# the same gate and the same forty-crown fee as the Table's own order. The
# entry is held to `treasury >= 40` so the fee can always be paid, and ASKER
# is filtered `inTerm: false` and untaught in Mind, so the term always begins.
# The decision arc `arc_the_term_paid_for` is started only by the Table and
# the steward, never by an authored effect, so the house does not tell this
# term twice.
events:
  - id: a_term_asked_for
    title: A Term Asked For
    tier: family
    frequency: common
    weight: 70
    repeatable: true
    # The chain runs at most twelve years and an inline arc holds one instance
    # at a time, so a second asking must never find the first still open.
    cooldownYears: 60
    campaigns: [short, long]
    tags: [tutor, household, wish]
    purposes: [change_relationship, change_standing, worldbuild_through_action]
    conditions:
      all:
        - { generation: { op: gte, value: 2 } }
        - { treasury: { op: gte, value: 40 } }
    slots:
      HEAD: { role: head }
      ASKER:
        role: child
        filters:
          - { status: [alive] }
          - { age: { op: gte, value: 12 } }
          - { age: { op: lte, value: 16 } }
          - { inTerm: false }
          - { not: { taught: { attr: mind } } }
          - { relation: not, of: HEAD }
    body: >-
      The heir's lessons happen in the long room, and for most of a year
      {ASKER} has sat at the cold end of it with nothing to do, getting the
      sums right under {ASKER.their} breath before the heir does. Tonight
      {ASKER.they} come{ASKER.s} to {HEAD} with the question worn smooth from
      practice. Not a horse. Not a new coat for the Greening. A term of
      {ASKER.their} own: a tutor, letters and reckoning, eight years of it,
      the thing the house buys for the child it means to keep. Forty crowns
      is twenty cows, and every person at this table can do that sum without
      being taught. Nobody gets up to see to the fire.
    interaction:
      kind: choice
      choices:
        - id: pay_for_the_term
          label: Find {ASKER.them} a tutor. Forty crowns, and eight years of lessons.
          outcomes:
            - id: a_tutor_is_found
              weight: 100
              text: >-
                A man comes up from Bramme at the end of Thaw with a box of
                slates and an opinion about everything. The forty crowns are
                counted out of the strongbox in front of {ASKER}, which is how
                the house says it means a thing. For a month {ASKER} is at the
                table before the tutor is, every morning. After that nobody
                thinks it worth remarking on.
              effects:
                - { kind: tutor, target: { slot: ASKER }, attr: mind, op: begin }
                - { kind: relationship, from: { slot: ASKER }, to: head, sentiment: 12 }
              next: { event: the_day_book, after: { minYears: 10, maxYears: 12 }, keep: [ASKER] }
        - id: the_terms_are_for_the_heir
          label: No. The house buys terms for its heir.
          outcomes:
            - id: refused
              weight: 100
              text: >-
                {HEAD} says it kindly, which does not help. The terms are for
                the heir, the way the good chair is for the heir, and a house
                that bought one for every child who asked would have nothing
                left to buy one with. {ASKER} nods as though this were news,
                and goes back to the cold end of the long room. The sums keep
                coming out right. Nobody asks to hear them.
              effects:
                - { kind: relationship, from: { slot: ASKER }, to: head, sentiment: -10 }
              next: { event: asked_again, after: { minYears: 9, maxYears: 12 }, keep: [ASKER] }

  # THE LATER CHOICE THE TERM MADE. Two years after the term ends the old
  # steward gives up the day-book. Keeping it in the family is only a good
  # answer if the term was finished AND the person it was bought for is
  # still here to use it, so every outcome reads one compound guard on ASKER.
  # The body speaks only of the past, because a consumed Vessel is still
  # castable and would be handed the body rather than the absentBody.
  #
  # Uncommon, though as an arc node it spends no ration, because it carries a
  # Record: who keeps the house's books is the house's record of itself.
  - id: the_day_book
    title: Whose Hand Keeps the Book
    tier: family
    frequency: uncommon
    repeatable: true
    tags: [tutor, household, wish, money]
    purposes: [change_relationship, change_standing, force_record_choice]
    slots:
      HEAD: { role: head }
      ASKER: { role: family_member, filters: [{ status: [alive] }], onMissing: continue_absent }
    body: >-
      The accounts are done in Thaw, and this Thaw the steward says what he
      has been not saying since Slaughter: he cannot read his own hand by
      candlelight any more. Thirty years the day-book has been his. Somebody
      else has to keep it now, and the house has to decide who. Ten years ago
      it paid forty crowns so that {ASKER} could learn letters and reckoning,
      because {ASKER} asked. The book is on the long-room table, shut.
    absentBody: >-
      The accounts are done in Thaw, and this Thaw the steward says what he
      has been not saying since Slaughter: he cannot read his own hand by
      candlelight any more. Thirty years the day-book has been his. Ten years
      ago the house paid forty crowns so that {ASKER} could learn letters and
      reckoning, and {ASKER} is not here to be asked. The book is on the
      long-room table, shut.
    interaction:
      kind: choice
      choices:
        - id: keep_it_in_the_family
          label: Keep the day-book in the family's own hand.
          outcomes:
            - id: the_book_comes_to_them
              weight: 100
              onlyIf: { slot: ASKER, filters: [{ all: [{ status: [alive] }, { taught: { attr: mind } }] }] }
              text: >-
                {ASKER} takes the day-book upstairs and does not come down for
                two days. On the third {ASKER.they} put{ASKER.s} a column of
                figures in front of {HEAD}: the low farms have been entered at
                the rents of a bad decade, every year, for thirty years,
                because nobody who could read the old leases ever sat down with
                the book. The reeve carries the right figures round the farms in
                a week of rain and comes back wet and unpopular. The money comes
                in at the first fair weather all the same.
              effects:
                - { kind: treasury, delta: 45 }
                - { kind: relationship, from: { slot: ASKER }, to: head, sentiment: 12 }
                - { kind: rumour, op: seed, id: rumour_the_house_that_reads_its_leases, accuracy: 0.5 }
            - id: nobody_left_to_keep_it
              weight: 100
              onlyIf: { slot: ASKER, filters: [{ not: { all: [{ status: [alive] }, { taught: { attr: mind } }] } }] }
              text: >-
                Whatever the forty crowns bought is not at the table this Thaw,
                and nobody else in the family has the reckoning for it. The
                heir takes the day-book and keeps it the way heirs keep things,
                in a drawer, until somebody needs a figure. The figures drift.
                It is years before anybody notices how far.
              # Nothing changes, and that is the cost: the low rents stay
              # unfound, where the clerk on the other choice finds them.
              effects: []
        - id: send_to_bramme
          label: Send to Bramme for a clerk who can read leases.
          outcomes:
            - id: a_clerk_over_their_head
              weight: 100
              onlyIf: { slot: ASKER, filters: [{ all: [{ status: [alive] }, { taught: { attr: mind } }] }] }
              text: >-
                The clerk from Bramme costs a mark a day and is worth it.
                Inside a fortnight he has found that the low farms were entered
                at a bad decade's rents for thirty years, and the house puts
                them right. {ASKER} had found the same thing the winter before,
                in the margin of the same book. Nobody had asked.
              effects:
                - { kind: treasury, delta: 25 }
                - { kind: relationship, from: { slot: ASKER }, to: head, sentiment: -12 }
                - { kind: rumour, op: seed, id: rumour_the_house_that_reads_its_leases, accuracy: 0.5 }
            - id: a_clerk_from_bramme
              weight: 100
              onlyIf: { slot: ASKER, filters: [{ not: { all: [{ status: [alive] }, { taught: { attr: mind } }] } }] }
              text: >-
                The clerk from Bramme costs a mark a day and is worth it.
                Inside a fortnight he has found that the low farms were entered
                at a bad decade's rents for thirty years, and the house puts
                them right. The steward takes it well. He has had thirty years
                to expect it.
              effects:
                - { kind: treasury, delta: 25 }
                - { kind: rumour, op: seed, id: rumour_the_house_that_reads_its_leases, accuracy: 0.5 }
    record:
      subject: the day-book, and the hand that keeps it
      options:
        record:
          chronicle: >-
            In this year the old steward gave up the day-book he had kept for
            thirty years, because he could no longer read his own hand by
            candlelight, and the house chose who would keep its books after him.
          effects: []
          claims:
            - { kind: deed, target: { slot: HEAD }, text: chose who would keep the house's books after the old steward }
        omit:
          chronicle: null
        embellish:
          chronicle: >-
            In this year the house's books passed from one careful hand of the
            blood to the next, as they have since the founding, and not an
            error was found in them.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: kept the house's books in the blood's own hand as the house always had }
          discrepancy:
            id: the_books_the_blood_never_kept
            severity: minor
            provableBy: [commons]

  # THE REFUSAL'S RETURN. ASKER is now past the age a tutor will take, so the
  # only thing left to ask for is somebody else's term. The child is cast
  # fresh and is the subject of the request, never a replacement for the
  # person who made the first one. If no untaught child of the right age is in
  # the house, the beat waits five years at a time, as every arc beat does.
  - id: asked_again
    title: Asked Again
    tier: family
    frequency: common
    repeatable: true
    tags: [tutor, household, wish]
    purposes: [change_standing, plant_rumour, worldbuild_through_action]
    slots:
      HEAD: { role: head }
      ASKER: { role: family_member, filters: [{ status: [alive] }], onMissing: continue_absent }
      CHILD:
        role: child
        filters:
          - { status: [alive] }
          - { age: { op: gte, value: 10 } }
          - { age: { op: lte, value: 15 } }
          - { inTerm: false }
          - { not: { taught: { attr: mind } } }
          - { relation: not, of: HEAD }
    body: >-
      {ASKER} is grown now and has not asked the house for anything in years.
      Tonight {ASKER.they} stand{ASKER.s} at the cold end of the long room,
      where {ASKER.they} used to sit through the heir's lessons, and
      ask{ASKER.s} the old question again. It is not for {ASKER.them} this
      time. It is for {CHILD}, who is about the age {ASKER} was when the house
      said no, and who gets the heir's sums right under {CHILD.their} breath.
      Forty crowns is still twenty cows.
    absentBody: >-
      {ASKER} is not here to ask again. Somebody at the table remembers that
      {ASKER} once did, and what the house said, and brings it up, because
      {CHILD} is about the age {ASKER} was then and gets the heir's sums right
      under {CHILD.their} breath. Forty crowns is still twenty cows.
    interaction:
      kind: choice
      choices:
        - id: pay_for_this_one
          label: Pay for {CHILD}'s term. Forty crowns, and eight years.
          outcomes:
            - id: the_second_term
              weight: 100
              onlyIf: { slot: ASKER, filters: [{ status: [alive] }] }
              text: >-
                The tutor comes up from Bramme at the end of Thaw. {ASKER} is
                at the table on the first morning, before the pupil is, and
                says nothing about the years in between. Nothing needs to be
                said. It has been paid for.
              effects:
                - { kind: tutor, target: { slot: CHILD }, attr: mind, op: begin }
                - { kind: relationship, from: { slot: ASKER }, to: head, sentiment: 15 }
            - id: the_second_term_after_them
              weight: 100
              onlyIf: { slot: ASKER, filters: [{ not: { status: [alive] } }] }
              text: >-
                The tutor comes up from Bramme at the end of Thaw, and the forty
                crowns are counted out in the hall where the household can hear
                it. Nobody says whose question it was. Everybody knows.
              effects:
                - { kind: tutor, target: { slot: CHILD }, attr: mind, op: begin }
        - id: no_again
          label: No. The terms are still for the heir.
          outcomes:
            - id: refused_twice
              weight: 100
              onlyIf: { slot: ASKER, filters: [{ status: [alive] }] }
              text: >-
                {HEAD} gives the same answer in nearly the same words. {ASKER}
                says nothing at the table. Afterwards, in the yard, {ASKER} says
                a good deal to anyone who will stand still for it, about what
                this house is for and who it keeps its money for. Some of it is
                unfair. Not enough of it.
              effects:
                - { kind: relationship, from: { slot: ASKER }, to: head, sentiment: -15 }
                # A grudge is held by `to` against `from`: the head did the
                # wronging, and ASKER is the one who remembers it.
                - { kind: relationship, from: head, to: { slot: ASKER }, grudge: { severity: 25, inheritance: heir_only } }
                - { kind: rumour, op: seed, id: rumour_who_the_house_keeps_its_money_for, accuracy: 0.6 }
            - id: refused_after_them
              weight: 100
              onlyIf: { slot: ASKER, filters: [{ not: { status: [alive] } }] }
              text: >-
                The answer is the same as it was, and nobody at the table minds
                it enough to argue. The sums keep coming out right at the cold
                end of the long room.
              effects: []

proseVariants:
  - address: "content:events/the_wish.yaml#events[id=a_term_asked_for].title"
