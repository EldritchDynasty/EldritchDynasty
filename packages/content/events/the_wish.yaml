    plainenglish: >-
      A Child Asks for Lessons
  - address: "content:events/the_wish.yaml#events[id=a_term_asked_for].body"
    of: "9d5fb859e0c32535"
    plainenglish: >-
      The heir has lessons in the long room. For most of a year, {ASKER} has
      sat at the cold end of that room with nothing to do, quietly getting the
      sums right under {ASKER.their} breath before the heir does. Tonight
      {ASKER.they} come{ASKER.s} to {HEAD} with a well-practised request. It
      is not for a horse or a new coat for the Greening feast. It is for a
      tutor of {ASKER.their} own: eight years of lessons in reading, writing
      and arithmetic. The house usually pays for this only for the child it
      plans to keep at home. Forty crowns is the price of twenty cows, and
      everyone at the table can work that out. Nobody gets up to tend the
      fire.
  - address: "content:events/the_wish.yaml#events[id=a_term_asked_for].interaction.choices[id=pay_for_the_term].label"
    of: "fafb65f98c70091d"
    plainenglish: >-
      Hire a tutor for {ASKER.them}. It costs forty crowns for eight years of lessons.
  - address: "content:events/the_wish.yaml#events[id=a_term_asked_for].interaction.choices[id=pay_for_the_term].outcomes[id=a_tutor_is_found].text"
    of: "7d5b10150b282ef9"
    plainenglish: >-
      In late Thaw, a tutor arrives from Bramme with a box of writing slates
      and an opinion about everything. The forty crowns are counted out of the
