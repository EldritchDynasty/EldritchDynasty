# THE NARRATOR.
#
# Daveed Gearithy does not die. Death is redirected: he becomes the guardian
# spirit of the house and makes its decisions from that day forward — which is
# to say he becomes the player, and the player has been him the whole time.
#
# These fire through the `guardian` slot role, which reads status `guardian`
# rather than `alive`. That is why a template written for 1042 can still name
# him at the term, generations later.
events:
  - id: the_guardian_at_the_table
    title: He Is Still Sitting There
    tier: family
    frequency: uncommon
    weight: 110
    tags: [guardian, narrator, household]
    purposes: [worldbuild_through_action, change_relationship, plant_rumour]
    rumour: { id: rumour_the_kept_chair, accuracy: 0.4, spread: 2 }
    slots:
      GUARDIAN: { role: guardian }
      HEIR: { role: head }
    body: >-
      The chair at the head of the long table is not moved and is not sat in,
      and no one in the house can remember deciding that. {HEIR} eats at the
      side, where a son eats. Somebody laid the fires this morning before the
      girl who lays the fires came down, and she has stopped mentioning it,
      because the first three times she mentioned it nobody would meet her eye.
      The room is warm. It has no business being warm.
    interaction:
      kind: narration
      outcomes:
        - id: kept
          weight: 100
          text: >-
            They call it the draught, or the old timbers, or nothing at all.
            {GUARDIAN} lets them.
          effects:
            - { kind: flag, flag: the_chair_is_kept, set: true }

  - id: the_guardian_disagrees
    title: The House Decides Otherwise
    tier: head
    frequency: rare
    weight: 100
    tags: [guardian, narrator, succession]
    purposes: [change_relationship, change_standing, force_record_choice]
    # TWO PREMISES, AND THE SECOND ONE IS MEASURED.
    #
    # The kept chair is the plant: `the_guardian_at_the_table` sets it, and
    # that is one uncommon template's only outcome. It fires in 25 runs of 60,
    # and it fires LATE — of the twelve runs instrumented year by year, seven
    # set the flag at all, between 1074 and 2018, median 1396. That leaves
    # this scene 134 to 337 eligible years to win a rare draw shared with
    # ninety-three other templates, and the draw obliges in about one eligible
    # run in five. Net: 8 runs in 60, and a resplit of the RNG streams took
    # that to 0 in 60. An event that needs luck twice over is not in the game;
    # it is in the folder.
    #
    # So the second premise is the same fact arrived at the long way. By ten
    # generations there is no one alive who remembers a head this house did
    # not overrule, and no scene is needed to establish that. Where the chair
    # WAS kept, the payoff still lands early, in the generation that saw it.
    conditions:
      any:
        - all:
            - { flag: the_chair_is_kept }
            - { generation: { op: gte, value: 6 } }
        - { generation: { op: gte, value: 10 } }
    slots:
      GUARDIAN: { role: guardian }
      HEAD: { role: head }
    body: >-
      {HEAD} has made up his mind and says so twice, which is once more than a
      man says a thing he believes. Then the seal is not where he left it. Then
      the letter he wrote is in the grate, unburnt, face up, and the fire has
      gone around it. Nobody in the house will admit to any of this and nobody
      in the house is lying. He sits down in the wrong chair, at the side,
      where a son sits, and he does not get up again until he has changed his
      mind.
    interaction:
      kind: choice
      choices:
        - id: yield
          label: Yield. The house has been here longer than you have.
          outcomes:
            - id: yielded
              weight: 100
              text: >-
                It is the correct decision and it costs him every part of being
                the man who makes them. He is forty-one. He will not try again.
              effects:
                - { kind: treasury, delta: 120 }
        - id: defy
          label: Do it anyway.
          outcomes:
            - id: held
              weight: 44
              text: >-
                Nothing stops him, and the not-stopping is worse than being
                stopped, because now he has to find out whether he was right.
              effects:
                - { kind: respect, delta: 1 }
            - id: ruined
              weight: 56
              text: >-
                It goes exactly as badly as it was going to go. The chair at
                the head of the table stays empty through all of it.
              effects:
                - { kind: treasury, delta: -260 }
                - { kind: respect, delta: -1 }
    record:
      subject: who actually rules the house
      options:
        record:
          chronicle: >-
            The Head was overruled. Not by the Assembly, not by the Church,
            and not by any living person in this house.
          effects:
            - { kind: respect, delta: -1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: was overruled in the long room by no living person in the house }
        omit:
          chronicle: null
        embellish:
          chronicle: The Head reconsidered, in his wisdom, and the house prospered by it.
          effects:
            - { kind: respect, delta: 1 }
          claims:
            - { kind: deed, target: { slot: HEAD }, text: reconsidered of his own wisdom, and the house prospered by it }
          discrepancy:
            id: the_empty_chair_lie
            severity: major
            provableBy: [the_church, house_marrow]
    rumour: { id: rumour_the_seated_house, accuracy: 0.3, spread: 3 }
    accounts: [ballad_of_the_empty_chair, church_inquest_minute_1604]

# Plain English alternatives for the above Original event prose (#569).
proseVariants:
  - address: content:events/guardian.yaml#events[id=the_guardian_at_the_table].title
    of: 8b57d80e36a19b12
    plainenglish: >-
      The Chair Still Belongs to Him
  - address: content:events/guardian.yaml#events[id=the_guardian_at_the_table].body
    of: e160e66775e780bb
    plainenglish: >-
      No one sits in or moves the chair at the head of the long table. No one remembers
       agreeing to leave it empty. {HEIR} eats at the side, in the seat usually given to a
       son. This morning, the fires were already lit before the servant who lights them came
       downstairs. She has stopped talking about it because nobody would look at her the first
       three times she mentioned it. The room is warm when it should not be.
  - address: content:events/guardian.yaml#events[id=the_guardian_at_the_table].interaction.outcomes[id=kept].text
    of: 6ad7da72309127d6
    plainenglish: >-
      People blame a draught or old wood, or say nothing at all. {GUARDIAN} lets them think
       what they want.
  - address: content:events/guardian.yaml#events[id=the_guardian_disagrees].title
    of: cce0323f3042edbb
    plainenglish: >-
      The House Overrules Its Head
  - address: content:events/guardian.yaml#events[id=the_guardian_disagrees].body
    of: fe3a38674127b0b3
    plainenglish: >-
      {HEAD} announces his decision twice, as if he needs to convince himself. Then the house
       seal disappears from where he left it. His letter turns up in the fireplace, still
       unburnt and face up, while the fire burns around it. Nobody admits that anything
       strange has happened, and nobody is lying. He takes the side chair where a son would
       sit and stays there until he changes his decision.
  - address: content:events/guardian.yaml#events[id=the_guardian_disagrees].interaction.choices[id=yield].label
    of: ee80f494798fe708
    plainenglish: >-
      Give in. The house has existed longer than you have.
  - address: content:events/guardian.yaml#events[id=the_guardian_disagrees].interaction.choices[id=yield].outcomes[id=yielded].text
    of: 833ef938329e3dac
    plainenglish: >-
      Giving in is the right decision, but it takes away his authority as the man who makes
       the decisions. He is forty-one years old. He will never try to challenge the house
       again.
  - address: content:events/guardian.yaml#events[id=the_guardian_disagrees].interaction.choices[id=defy].label
    of: c98e59fc1065fb38
    plainenglish: >-
      Go ahead with the decision anyway.
  - address: content:events/guardian.yaml#events[id=the_guardian_disagrees].interaction.choices[id=defy].outcomes[id=held].text
    of: 44dc2d42c116046e
    plainenglish: >-
      Nothing stops him. That is worse than being stopped, because now he has to find out
       whether he made the right decision.
  - address: content:events/guardian.yaml#events[id=the_guardian_disagrees].interaction.choices[id=defy].outcomes[id=ruined].text
    of: 467d99062c3f40b2
    plainenglish: >-
      The decision turns out as badly as expected. The chair at the head of the table remains
       empty throughout.
  - address: content:events/guardian.yaml#events[id=the_guardian_disagrees].record.subject
    of: 73134ea82215bd0c
    plainenglish: >-
      who has the final say in the house
  - address: content:events/guardian.yaml#events[id=the_guardian_disagrees].record.options.record.chronicle
