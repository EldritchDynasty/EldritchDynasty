  - address: "content:prologue.yaml#prologue[id=the_signing].examination[id=the_hard_winter].answers[id=all_three].owed"
    of: "ed95549af78b92d6"
    plainenglish: >-
      All three servants became less loyal to the house.
  - address: "content:prologue.yaml#prologue[id=the_signing].examination[id=the_moved_stone].situation"
    of: "779ab1b61f5d54d2"
    plainenglish: >-
      One morning a boundary stone stood one furrow further onto the house's land than it had
      the night before. There were no boot prints around it, and the rain had not been heavy
      enough to move anything made of stone. The neighbour said nothing. The question was what
      the man did.
  - address: "content:prologue.yaml#prologue[id=the_signing].examination[id=the_moved_stone].answers[id=assize_at_cawdry].says"
    of: "27919ec8bca1f074"
    plainenglish: >-
      I took it to the court at Cawdry.
  - address: "content:prologue.yaml#prologue[id=the_signing].examination[id=the_moved_stone].answers[id=assize_at_cawdry].given"
    of: "95f8f4a1bb4ca425"
    plainenglish: >-
      The house's standing went up.
  - address: "content:prologue.yaml#prologue[id=the_signing].examination[id=the_moved_stone].answers[id=assize_at_cawdry].owed"
    of: "97e81021390f77ed"
    plainenglish: >-
      The court, the travel and a winter in rented rooms cost a lot of money.
  - address: "content:prologue.yaml#prologue[id=the_signing].examination[id=the_moved_stone].answers[id=move_it_back].says"
    of: "dfb15118167d90e4"
    plainenglish: >-
      I put it back myself, after dark.
  - address: "content:prologue.yaml#prologue[id=the_signing].examination[id=the_moved_stone].answers[id=move_it_back].given"
    of: "4e3691bb8a101197"
    plainenglish: >-
      The house kept the rent from that furrow.
  - address: "content:prologue.yaml#prologue[id=the_signing].examination[id=the_moved_stone].answers[id=move_it_back].owed"
    of: "32983ce7bb40c8e3"
    plainenglish: >-
      Calder held a small grudge against the line.
  - address: "content:prologue.yaml#prologue[id=the_signing].examination[id=the_moved_stone].answers[id=let_it_lie].says"
    of: "ab53a556a9ac9b2a"
    plainenglish: >-
      I left it where it was.
  - address: "content:prologue.yaml#prologue[id=the_signing].examination[id=the_moved_stone].answers[id=let_it_lie].given"
    of: "cbfd5410351eae44"
    plainenglish: >-
      Osric, Hesper and Bertram became a little more loyal to the house.
  - address: "content:prologue.yaml#prologue[id=the_signing].examination[id=the_moved_stone].answers[id=let_it_lie].owed"
    of: "5aef3295c8c1ecb9"
    plainenglish: >-
      The house lost the value of the furrow.
  - address: "content:prologue.yaml#prologue[id=the_signing].housePrompt"
    of: "8038dc3fc8e4bcbb"
    plainenglish: >-
      Only after these answers did the other party ask what the house would be called. The man's
      own name was already on the page. This name was for the door, the seal, and everyone who
      would come after him. Name the house.
  - address: "content:prologue.yaml#prologue[id=the_signing].friendsPrompt"
    of: "a0171a3f15dc5c73"
    plainenglish: >-
      There was one more question. It was not about the house, and the man answered it without
      realising he had been asked anything. It said: name five people who are not of your blood,
      without whom your life would have been a different life. He gave five names. Nobody asked
      him why, he did not say, and none of the four people in that room could later remember a
      single one of them.


      They have been coming back ever since, about one every half century, and then they
      stopped. A midwife from Kettlewick in 1094. A rival's second son with the wrong
      grandmother. A girl offered to a table that had already turned down two that season, in a
      year when the house could not afford to be picky. The last of the five arrived some time
      before 1300, and there has not been another. The family would find that worse if it had
      ever counted them.


      Each of them was a little better than they had any right to be: a strong back, a long
      life, a mind that got there first. None of them was ever more than that. Nobody in the
      house has commented on it, because nobody in the house was in that room, and the man who
      was there did not write the names down.
  - address: "content:prologue.yaml#prologue[id=the_signing].heirlooms[0].line"
    of: "91bcf61b1429e28f"
    plainenglish: >-
      He asked for time, because time was the only thing anyone in that room seemed to have too
      much of.
  - address: "content:prologue.yaml#prologue[id=the_signing].heirlooms[1].line"
    of: "e3896372948141de"
    plainenglish: >-
      He asked for children. It was the least imaginative thing anyone could have asked for in
      that room, and the only one that has never yet ruined a house.
  - address: "content:prologue.yaml#prologue[id=the_signing].heirlooms[2].line"
    of: "37faa8738c6ad83f"
    plainenglish: >-
      He asked to be able to see it. Nothing in the agreement said anyone had to tell him what
      he would be looking at, and nobody has.
  - address: "content:prologue.yaml#prologue[id=the_signing].grudges[0].line"
    of: "b9f41bab68418b4f"
    plainenglish: >-
      The Marrow family had the better claim to the upper field, and two witnesses to prove it.
      One witness was dead by Thaw, and the other had moved to Bramme and would not answer
      letters. Marrow has never accused this house of anything. They simply buy every book that
      comes up at auction, and they read them.
  - address: "content:prologue.yaml#prologue[id=the_signing].grudges[1].line"
    of: "3346fa3e1044100a"
    plainenglish: >-
      That winter Calder sent eleven men to hold the ford because this house promised to come.
      This house did not come, and four of the men came back. Soldiers hold this kind of thing
      against a seat, not a family, so it falls on whoever is sitting in it.
  - address: "content:prologue.yaml#prologue[id=the_signing].grudges[2].line"
    of: "e056da1c3598afe8"
    plainenglish: >-
      The man burned a scholar's letters rather than answer the question in them. Ilm does not
      forget and does not strike back. It writes, patiently, for three hundred years, and lends
      what it writes to anyone who asks.
  - address: "content:prologue.yaml#prologue[id=the_signing].thesis"
    of: "e3208e1764517113"
    plainenglish: >-
      Everything after this was done by people who never signed it.
  - address: "content:prologue.yaml#prologue[id=the_signing].inheritedLine"
    of: "b92c1aac5b8c45b0"
    plainenglish: >-
      Before this house there was another one. It called itself {house} and kept a book, as this
      house will. Nothing of that house is left in the province now except the book and what
      people say about it. That story has passed, as such stories do, to {teller}. The chronicle
      does not say whether the book or the story is closer to the truth.
