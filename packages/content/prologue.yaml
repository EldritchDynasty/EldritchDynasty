    housePrompt: >-
      Only after these answers did the other party ask what the house would be
      called. The man's own name was already on the page; this one was for the
      door, the seal, and those who would come after him. Name the house.

    friendsPrompt: >-
      There was one further question and it was not about the house, and the
      man answered it without understanding that he had been asked anything.
      Name five, it said, who are not of your blood and without whom the life
      you have had would have been some other life. He gave five names. He was
      not asked why, and he did not say, and none of the four in that room
      could afterwards recall a single one of them.


      They have been coming back since, roughly one to half a century, and
      then they stopped. A midwife out of Kettlewick in 1094. A rival's second
      son with the wrong grandmother. A girl dealt to a table that had already
      turned down two that season, in a year the house could not afford to be
      careful. The last of the five arrived somewhere before 1300 and there
      has not been another, which is the part the family would find worse if it
      had ever counted them.


      Each of them was a little better than they had any business being — a
      strong back, a long life, a mind that got there first — and none of them
      was ever anything more than that. Nobody in the house has remarked on it,
      because nobody in the house was in the room, and the man who was did not
      write the names down.

    heirlooms:
      - heirloom: portion_of_agelessness
        line: >-
          He asked for time, which was the only thing he had seen anyone in
          that room appear to have too much of.
      - heirloom: portion_of_fertility
        line: >-
          He asked for children, which was the least imaginative thing anyone
          could have asked for in that room, and the only one that has never
          yet ruined a house.
      - heirloom: the_unmirrored_eye
        line: >-
          He asked to be able to see it. Nothing in the agreement obliged
          anybody to tell him what he would be looking at, and nothing has.

    grudges:
      - house: house_marrow
        severity: 70
        inheritance: house_wide
        line: >-
          The Marrow had the better claim to the upper field and two witnesses
          to it, and one of the witnesses was dead by Thaw and the other had
          moved to Bramme and would not answer letters. They have never
          accused this house of anything. They simply buy every book that
          comes to auction, and they read them.
      - house: house_calder
        severity: 55
        inheritance: house_wide
        line: >-
          Calder sent eleven men to hold the ford that winter on the word of
          this house, and this house did not come, and four of them came back.
          Soldiers keep this sort of thing against a chair rather than against
          a family, which means it lands on whoever is sitting in it.
      - house: house_ilm
        severity: 40
        inheritance: house_wide
        line: >-
          The man burned a scholar's letters rather than answer the question
          in them. Ilm does not forget and does not retaliate; it writes,
          patiently, for three hundred years, and lends the writing to anyone
          who asks.

    thesis: Everything after this was done by people who did not sign it.

    # Shown only when this run inherited a Library account (#342). Frame
    # register, and it vouches for neither side: {house} is the older house,
    # {teller} the voice now carrying the account. No verb follows {teller},
    # because the tellers are singular and plural both.
    inheritedLine: >-
      Before this house there was another, which called itself {house} and
      kept a book as this one will, and of that house nothing remains in the
      province now but the book and what is said of it. The saying has passed,
      as such things pass, to {teller}; and whether the book or the telling is
      the truer, the chronicle does not say.
