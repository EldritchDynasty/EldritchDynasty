# THE PROLOGUE — a debt of three parts (concept §3, issue #38).
#
# The frame's register: Dunsanian, per `.claude/skills/lovecraftian-prose`.
# Elevated diction and long accumulating clauses, the other party described by
# what it displaces and never by what it is, and no motive anywhere. The one
# plain line in the file is `thesis`, and every ending reaches back to it.
#
# The founder takes the player's supplied name; blank keeps Daveed Gearithy.
# The house name remains a separate answer after the Examination.
prologue:
  - id: the_signing
    opening: >-
      It was the last of the Hollow Days, when the old year has ended and the
      new one has not begun and every table in the province keeps a seat empty
      without anybody agreeing why. The hall was cold in the way of a room
      built for four times the family that had it. There were seven candles in
      sconces meant for forty, and a dog at the fire that had slept there every
      winter of its life.


      What came in was not seen. The dog rose and went out and would not be
      called back, and was found in the morning in the yard with the snow
      melted around it in a shape nobody cared to measure. The iron on the
      table dulled between one sentence and the next, so that the seal which
      had been bright when the man sat down had to be cleaned before it would
      take wax. There was a smell of wet ash indoors, in summer, in the middle
      of winter. Afterwards none of the four who had been in that room could
      agree on how long they had been in it, and two of them would not discuss
      it at all.


      Three things were given. Three things were owed for them. The man was
      told which was which, in order, and the order was not an accident.

    triad:
      - given: >-
          THE ROOF. The house had a poor claim to its land and a worse one to
          the name above its door, and there were two families and a bishop who
          could have said so in a court. After that night none of them did. The
          quiet held through the Fall of the next dynasty and the burning of
          the Marches and four royal surveys, and it holds now.
        owed: >-
          A PAGE A YEAR. Somebody of the blood was to write down what the house
          had done, truthfully, in a book kept for the purpose and kept
          nowhere else. The man took this for a courtesy. He was a man who had
          never yet had anything he needed to leave out.

      - given: >-
          THE THING IN THE BLOOD. It was not explained, then or since. It comes
          to the sons and never to the daughters, who carry it and hand it on
          without ever once holding it; it cannot be asked for, scheduled,
          taught, or produced on purpose by anybody living; and it has never
          arrived twice in the same way.
        owed: >-
          THE SONS. Not taken — spent. The gift and the price are the same
          substance, and in five hundred years no house of this line has managed
          to have the first without paying the second, though several have
          written books arguing that they did.

      - given: >-
          THE KEEPING. Three objects were left on the table — a seal, a ring,
          and a rod for which no use has ever been established — on the single
          condition that the family hold them in a hand that could be shown.
        owed:
          campaignText: >-
            THE TERM. {years} years, to the day, ending in {endYear}, and then
            the account read back and settled in whatever coin the account
            turns out to be written in. The man agreed to this part quickly,
            and the two of his household who were sober enough to remember it
            both said afterwards that he had agreed to it more quickly than to
            the others. He was fifty-one. {years} years was a number, and not a
            thing that happens to anybody.

    namePrompt: >-
      Before any seal was warmed and before the house was asked what it would
      call itself, the other party asked the man what he was called, and when
      he answered the name was written down in a hand that none of the four in
      the room could afterwards imitate. The page remained open upon the table.
      What are you called?

    examination:
      - id: the_ford
        situation: >-
          In the year before the signing, at a ford below Cawdry, the river
          rose after dark and took one wheel of a laden cart between two
          stones, while the Warden's men watched from the farther bank and the
          last useful light went out of the sky. The question was what the man
          had done then.
        answers:
          - id: own_back
            says: I put my own back to the wheel.
            given: Strength ran a little stronger in the line.
            owed: Mind ran a little thinner in the line.
            terms:
              given:
                - kind: bias
                  who: [founder]
                  attr: strength
                  amount: 0.15
              owed:
                - kind: bias
                  who: [founder]
                  attr: mind
                  amount: -0.15
          - id: wardens_men
            says: I talked the Warden's men into lending theirs.
            given: Charm ran a little stronger in the line.
            owed: Strength ran a little thinner in the line.
            terms:
              given:
                - kind: bias
                  who: [founder]
                  attr: charm
                  amount: 0.15
              owed:
                - kind: bias
                  who: [founder]
                  attr: strength
                  amount: -0.15
          - id: wait_for_water
            says: I waited for the water to go down.
            given: Long life ran a little stronger in the line.
            owed: A small tithe was taken across the line's heritable strengths.
            terms:
              given:
                - kind: bias
                  who: [founder]
                  attr: longevity
                  amount: 0.15
              owed:
                - kind: tithe
                  who: [founder]
                  amount: 0.05

      - id: the_two_letters
        situation: >-
          Before Eilwen came from Ilm there were two letters, one written by a
          woman who had known her mother and one by a steward who had counted
          what travelled with the marriage. Both were kept. The question was
          not which letter had been believed, but why the man had married her.
        answers:
          - id: what_her_mother_bore
            says: For what her mother bore.
            given: Eilwen's fecundity was favoured.
            owed: Some of Eilwen's charm was the price.
            terms:
              given:
                - kind: bias
                  who: [founders_wife]
                  attr: fecundity
                  amount: 0.2
              owed:
                - kind: bias
                  who: [founders_wife]
                  attr: charm
                  amount: -0.15
          - id: light_in_her
            says: For the light in her.
            given: Light and Life ran stronger in Eilwen's blood.
            owed: Eilwen's fecundity ran thinner.
            terms:
              given:
                - kind: bias
                  who: [founders_wife]
                  attr: light
                  amount: 0.2
                - kind: bias
                  who: [founders_wife]
                  attr: life
                  amount: 0.1
              owed:
                - kind: bias
                  who: [founders_wife]
                  attr: fecundity
                  amount: -0.15
          - id: for_the_dowry
            says: For the dowry.
            given: The treasury began with more coin.
            owed: A small tithe was taken across Eilwen's heritable strengths.
            terms:
              given:
                - kind: treasury
                  amount: 60
              owed:
                - kind: tithe
                  who: [founders_wife]
                  amount: 0.05

      - id: the_hard_winter
        situation: >-
          There had been bread enough for two through the worst winter anyone
          then living could remember, and three had stood at the door: a
          teacher, a midwife, and a man who could make a column of figures
          agree with itself. The snow had already covered the lower road. The
          question was who had been let in.
        answers:
          - id: the_teacher
            says: The teacher.
            given: Osric's loyalty to the house deepened.
            owed: Hesper was dismissed, and what she knew went with her.
            terms:
              given:
                - kind: loyalty
                  retainer: tutor
                  amount: 20
              owed:
                - kind: dismiss
                  retainer: midwife
          - id: the_midwife
            says: The midwife.
            given: Hesper's loyalty to the house deepened.
            owed: Osric and Bertram trusted the house less.
            terms:
              given:
                - kind: loyalty
                  retainer: midwife
                  amount: 20
              owed:
                - kind: loyalty
                  retainer: tutor
                  amount: -20
                - kind: loyalty
                  retainer: steward
                  amount: -10
          - id: all_three
            says: All three, on half a loaf.
            given: The house kept more coin through the winter.
            owed: All three retainers trusted the house less.
            terms:
              given:
                - kind: treasury
                  amount: 40
              owed:
                - kind: loyalty
                  retainer: tutor
                  amount: -15
                - kind: loyalty
                  retainer: midwife
                  amount: -15
                - kind: loyalty
                  retainer: steward
                  amount: -15

      - id: the_moved_stone
        situation: >-
          One morning a boundary stone stood a furrow farther onto the house's
          land than it had stood the night before, though the ground about it
          carried no boot-mark and the rain had not been heavy enough to move
          anything made of stone. The neighbour said nothing. The question was
          what the man had done.
        answers:
          - id: assize_at_cawdry
            says: I took it to the assize at Cawdry.
            given: The house's standing rose.
            owed: The assize, the road, and the winter in lodgings cost dearly.
            terms:
              given:
                - kind: respect
                  steps: 1
              owed:
                - kind: treasury
                  amount: -80
          - id: move_it_back
            says: I moved it back myself, at night.
            given: The furrow's rent stayed with the house.
            owed: Calder kept a lesser grudge against the line.
            terms:
              given:
                - kind: treasury
                  amount: 60
              owed:
                - kind: grudge
                  house: house_calder
                  severity: 30
                  inheritance: heir_only
          - id: let_it_lie
            says: I let it lie.
            given: Osric, Hesper, and Bertram trusted the house a little more.
            owed: The house gave up the value of the furrow.
            terms:
              given:
                - kind: loyalty
                  retainer: tutor
                  amount: 10
                - kind: loyalty
                  retainer: midwife
                  amount: 10
                - kind: loyalty
                  retainer: steward
                  amount: 10
              owed:
                - kind: treasury
                  amount: -40

    housePrompt: >-
      Only after these answers did the other party ask what the house would be
      called. The man's own name was already on the page; this one was for the
      door, the seal, and those who would come after him. Name the house.

    friendsPrompt: >-
      There was one further question and it was not about the house, and the
      man answered it without understanding that he had been asked anything.
      Name five, it said, who are not of your blood and without whom the life
      you have had would have been some other life. He gave five names. He was
      not asked why, and he did not say, and none of the four in that room
      could afterwards recall a single one of them.


      They have been coming back since, roughly one to half a century, and
      then they stopped. A midwife out of Kettlewick in 1094. A rival's second
      son with the wrong grandmother. A girl dealt to a table that had already
      turned down two that season, in a year the house could not afford to be
      careful. The last of the five arrived somewhere before 1300 and there
      has not been another, which is the part the family would find worse if it
      had ever counted them.


      Each of them was a little better than they had any business being — a
      strong back, a long life, a mind that got there first — and none of them
      was ever anything more than that. Nobody in the house has remarked on it,
      because nobody in the house was in the room, and the man who was did not
      write the names down.

    heirlooms:
      - heirloom: portion_of_agelessness
        line: >-
          He asked for time, which was the only thing he had seen anyone in
          that room appear to have too much of.
      - heirloom: portion_of_fertility
        line: >-
          He asked for children, which was the least imaginative thing anyone
          could have asked for in that room, and the only one that has never
          yet ruined a house.
      - heirloom: the_unmirrored_eye
        line: >-
          He asked to be able to see it. Nothing in the agreement obliged
          anybody to tell him what he would be looking at, and nothing has.

    grudges:
      - house: house_marrow
        severity: 70
        inheritance: house_wide
        line: >-
          The Marrow had the better claim to the upper field and two witnesses
          to it, and one of the witnesses was dead by Thaw and the other had
          moved to Bramme and would not answer letters. They have never
          accused this house of anything. They simply buy every book that
          comes to auction, and they read them.
      - house: house_calder
        severity: 55
        inheritance: house_wide
        line: >-
          Calder sent eleven men to hold the ford that winter on the word of
          this house, and this house did not come, and four of them came back.
          Soldiers keep this sort of thing against a chair rather than against
          a family, which means it lands on whoever is sitting in it.
      - house: house_ilm
        severity: 40
        inheritance: house_wide
        line: >-
          The man burned a scholar's letters rather than answer the question
          in them. Ilm does not forget and does not retaliate; it writes,
          patiently, for three hundred years, and lends the writing to anyone
          who asks.

    thesis: Everything after this was done by people who did not sign it.

    # Shown only when this run inherited a Library account (#342). Frame
    # register, and it vouches for neither side: {house} is the older house,
    # {teller} the voice now carrying the account. No verb follows {teller},
    # because the tellers are singular and plural both.
    inheritedLine: >-
      Before this house there was another, which called itself {house} and
      kept a book as this one will, and of that house nothing remains in the
      province now but the book and what is said of it. The saying has passed,
      as such things pass, to {teller}; and whether the book or the telling is
      the truer, the chronicle does not say.

