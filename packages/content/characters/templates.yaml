  - id: groom_of_hesk_quarryman
    title: A Quarryman of Hesk
    role: groom
    frequency: common
    weight: 80
    sex: male
    ageAtArrival: { min: 19, max: 31 }
    bias: { strength: 0.6 }
    houses: [{ house: house_hesk, weight: 100 }]
    blurb: >-
      Eighteen miles north, one trade, three hundred years of marrying each
