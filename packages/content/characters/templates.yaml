      find out where they went afterwards, and the house stops asking.

  # ══════════════════════════════════════════════════════════════════════════
  # THE MARKET, WIDENED — and the second holder for four posts
  # ══════════════════════════════════════════════════════════════════════════
  #
  # World §22 lists eleven peoples of Aubren and four resident foreign
  # communities. Before this block the marriage market could draw from Marrow,
  # Calder, Ilm, Bracc, Hesk and `commons`, which is six pools for a thousand
  # years, and it is why every third suitor card read like the last one. Four
  # new gene pools went into `houses.yaml` with this block and these are the
  # recipes that reach them.
  #
  # TIER DISCIPLINE. `eligibleTemplates` filters by role but `frequencyWeight`
  # reads ONE shared `characterFrequency` ledger, so an uncommon wanderer
  # minted in 1310 bars every uncommon SUITOR template until 1322. Almost
  # everything below is therefore `common`, which has no cooldown: a
  # grazier's son is not a rare person, he is a person, and the tier says how
  # often the world produces one rather than how interesting he is.
  #
  # No new `wanderer`. That role is rolled once a year at a flat 5% and
  # chronicled as `illuminated` when it lands, so a second template would
  # halve the one arrival in the game that is supposed to be unrepeatable.

  # ── Four peoples the market could not reach ──────────────────────────────
  - id: suitor_of_the_marches
    title: A Daughter of a Petty Hold
    role: suitor
    frequency: common
    weight: 105
    sex: female
    ageAtArrival: { min: 16, max: 27 }
    bias: { strength: 0.4, agility: 0.4 }
    houses: [{ house: the_marches, weight: 100 }]
    blurb: >-
      Two hundred holds unruled since 604, no precedence anywhere in it worth
      marrying for, and consequently the most outbred pool in the game. She
      arrives with no pedigree at all and the healthiest grandchildren on this
      list, and the province will spend forty years calling the match cheap.

  - id: groom_of_the_marches
    title: A Company Man Between Wars
    role: groom
    frequency: common
    weight: 90
    sex: male
    ageAtArrival: { min: 22, max: 34 }
    bias: { strength: 0.5 }
    houses: [{ house: the_marches, weight: 100 }]
    blurb: >-
      Paid by the month and loyal until the month ends, and he will take the
      name because the name is the only thing on offer that outlasts a
      contract. Nobody can produce a single document about where he is from.

  - id: suitor_of_yssanne
    title: A Daughter of the Yssene Houses
    role: suitor
    frequency: uncommon
    weight: 95
    sex: female
    naming: of_house
    ageAtArrival: { min: 17, max: 26 }
