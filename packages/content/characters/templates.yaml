  - id: groom_of_the_lag
    title: A Man Out of the Lag
    role: groom
    frequency: common
    weight: 85
    sex: male
    ageAtArrival: { min: 20, max: 33 }
    bias: { longevity: 0.4 }
    houses: [{ house: the_lag, weight: 100 }]
    blurb: >-
      Eels, peat and wildfowl, the ague every Highsun since childhood, and a
