    weight: 100
    sex: male
    ageAtArrival: { min: 21, max: 32 }
    bias: { mind: 0.6, light: 0.4 }
    houses: [{ house: house_ilm, weight: 100 }]
    blurb: >-
      He has read more of the archive than your archivist has, and he asks
