# CHARACTER TEMPLATES — the people the next five centuries produce.
#
# The seed cast is twelve individuals who exist in 1042. Everyone after them is
# minted from one of these recipes. A template is not a person: it says which
# house rolls the genome, what age they arrive at, what they are for, and how
# often the world makes one.
#
# `houses` is the field that matters. It decides whether this person carries
# anything, and the player has no way to see it — which is the entire reason
# the marriage market has a vocabulary and a forgery industry.
characterTemplates:
  # ── Suitors: the marriage market ────────────────────────────────────────
  - id: suitor_common_stock
    title: A Daughter of No Particular House
    role: suitor
    frequency: common
    weight: 140
    sex: female
    ageAtArrival: { min: 17, max: 26 }
    houses:
      - { house: house_calder, weight: 130 }
      - { house: commons, weight: 90 }
    blurb: >-
      Cheap, willing, and carrying nothing whatever. Her sons will be mundane
      and safe and useless, and the house will be one Regency closer.

  - id: suitor_of_ilm
    title: A Scholar's Daughter
    role: suitor
    frequency: uncommon
    weight: 110
    sex: female
    ageAtArrival: { min: 17, max: 28 }
    bias: { light: 0.5, mind: 0.5 }
    houses: [{ house: house_ilm, weight: 100 }]
    blurb: >-
      House Ilm keeps good records and better secrets. A two-percent chance of
      deep blood, and a certainty of being asked what you want it for.

  - id: suitor_of_deep_blood
    title: Deep Blood, and They Know It
    role: suitor
    frequency: rare
    weight: 100
    sex: female
    ageAtArrival: { min: 18, max: 24 }
    naming: of_house
    bias: { death: 0.6, charm: 0.6 }
    traits: [early_waking]
    houses: [{ house: house_marrow, weight: 100 }]
    conditions:
      all:
        - { respect: { op: gte, tier: regarded } }
    blurb: >-
      She woke at eleven in front of witnesses, which is the one thing in this
      market that cannot be forged. The price reflects it. So does the clause
      about her firstborn.

  - id: suitor_ruined_nobility
    title: Ruined, and Willing
    role: suitor
    frequency: uncommon
    weight: 120
    sex: female
    ageAtArrival: { min: 17, max: 30 }
    naming: of_house
    bias: { charm: 0.5 }
    houses:
      - { house: house_marrow, weight: 60 }
      - { house: house_ilm, weight: 100 }
    conditions:
      all:
        - { ageActive: the_insurrection }
    blurb: >-
      Six months ago her house would not have received your steward. Excellent
      blood, ruined standing, and terms that would be an insult in any other year.

  # ── Grooms: matrilineal matches ─────────────────────────────────────────
  - id: groom_who_marries_in
    title: A Man Who Will Take the Name
    role: groom
    frequency: common
    weight: 120
    sex: male
    ageAtArrival: { min: 19, max: 30 }
    houses:
      - { house: house_calder, weight: 140 }
      - { house: commons, weight: 70 }
      - { house: house_ilm, weight: 50 }
    blurb: >-
      A house whose living blood is all female must practise matrilineal
      marriage or end. Everyone finds it scandalous. Everyone would do it.

  - id: suitor_ward_of_the_church
    title: A Girl the Church Placed
    role: suitor
    frequency: common
    weight: 110
    sex: female
    ageAtArrival: { min: 17, max: 24 }
    bias: { light: 0.4 }
    houses:
      - { house: commons, weight: 120 }
      - { house: the_church, weight: 60 }
    blurb: >-
      Raised at the chapter house, dowered by the chapter house, and the
      chapter house would like to be told how she gets on. Every year. In
      writing.

  - id: suitor_widow_with_land
    title: A Widow, and Three Children Living
    role: suitor
    frequency: uncommon
    weight: 100
    sex: female
    ageAtArrival: { min: 26, max: 34 }
    bias: { fecundity: 0.6, mind: 0.3 }
    houses:
      - { house: house_calder, weight: 110 }
      - { house: commons, weight: 80 }
    blurb: >-
      She has buried a husband and borne three who lived, which is the only
      fact in this market that can be checked. Older than the others by ten
      years, and worth every one of them if what you want is a house full.

  - id: suitor_of_marrow_cousin
    title: A Cousin of the Rival
    role: suitor
    frequency: uncommon
    weight: 90
    sex: female
    naming: of_house
    ageAtArrival: { min: 17, max: 25 }
    bias: { death: 0.5, charm: 0.4 }
    houses: [{ house: house_marrow, weight: 100 }]
    blurb: >-
      Marrow does not send its daughters out for nothing, and this one comes
      with an understanding about the western pasture that nobody will write
      down. Her blood is better than her terms.

  # ── Grooms: matrilineal matches ─────────────────────────────────────────
  - id: groom_second_son
    title: A Second Son With Nothing Coming
    role: groom
    frequency: common
    weight: 130
    sex: male
    ageAtArrival: { min: 19, max: 28 }
    houses:
      - { house: house_calder, weight: 130 }
      - { house: commons, weight: 100 }
    blurb: >-
      His brother gets the land and he gets whatever he can arrange. He will
      take the name without an argument, which tells you exactly how little
      he was offered anywhere else.

  - id: groom_of_ilm_scholar
    title: A Man Who Reads
