  - id: groom_of_marrow_younger
    title: A Younger Son of Marrow
    role: groom
    frequency: uncommon
    weight: 80
    sex: male
    naming: of_house
    ageAtArrival: { min: 20, max: 30 }
    bias: { death: 0.5, strength: 0.3 }
    houses: [{ house: house_marrow, weight: 100 }]
    conditions:
